# v8.0 — E2E test stack for routing, adapters, and PWA tests.
# Run with: docker compose -f docs/testing/docker-compose.test.yml up --abort-on-container-exit
# Or via:   make test-e2e-docker

version: "3.9"
services:
  # Primary datawatch daemon (system under test)
  # Uses port 18080 to avoid conflicts with a production daemon on 8080.
  datawatch:
    image: local/datawatch:dev
    build: { context: ../../, dockerfile: Dockerfile.dev }
    ports:
      - "18080:8080"
      - "18443:8443"
      - "19090:9090"
    volumes:
      - ../../testdata/datawatch.yaml:/etc/datawatch/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock   # docker-network routing
    environment:
      - DATAWATCH_DATA_DIR=/tmp/dw-test-data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Peer datawatch daemon (for datawatch-proxy routing tests)
  datawatch-peer:
    image: local/datawatch:dev
    ports:
      - "28081:8080"
    environment:
      - DATAWATCH_DATA_DIR=/tmp/dw-peer-data
      - DATAWATCH_TOKEN=peer-test-token
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Ollama (direct routing baseline + docker-network container target)
  # Uses port 21434 to avoid conflicts with a production Ollama on 11434.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "21434:11434"
    environment:
      - OLLAMA_NUM_GPU=999
      - OLLAMA_NUM_THREAD=48
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Mock opencode API (nginx returning OpenAI-compat JSON)
  mock-opencode:
    image: nginx:alpine
    ports:
      - "18081:80"
    volumes:
      - ../../testdata/mock-opencode/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../testdata/mock-opencode/response.json:/usr/share/nginx/html/response.json:ro

  # Playwright runner (PWA story suite in scripts/test-stories/pwa).
  # Image tag matches playwright's version in scripts/test-stories/pwa/package-lock.json.
  playwright:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    depends_on:
      datawatch:
        condition: service_healthy
    volumes:
      - ../../scripts/test-stories/pwa:/tests/pwa
    working_dir: /tests/pwa
    # Installs from the lockfile (npm install only if npm ci cannot run), then runs the story suite.
    command: bash -c "(npm ci --quiet || npm install --quiet) && node run-all.mjs"
    environment:
      # lib.mjs reads these; the daemon's HTTP port inside the compose network is 8080.
      - TEST_HTTP=http://datawatch:8080
      # Empty server.token in testdata/datawatch.yaml means the daemon accepts unauthenticated
      # requests, so this value is not checked. It is the lib.mjs default, passed for consistency.
      - TEST_TOKEN=dw-test-token-12345
      - EVIDENCE_DIR=/tmp/dw-pwa-evidence
