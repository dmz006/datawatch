  # ─── Automations — stored orchestration records over member Automata ────
  #
  # An Automation is a named graph of member Automata (PRDs), run one at a
  # time by a single cursor. Each member names at most one next member per
  # outcome (on_complete / on_blocked / on_failed); an empty edge ends the
  # Automation in the status that outcome implies. For now these are stored
  # records only — nothing on the server advances from one member Automaton
  # to the next automatically.
  /api/automations:
    get:
      summary: List Automations
      description: |
        All Automation records, one object each, in store order. A record
        with a budget policy also carries a computed `budget` view; the view
        is worked out on each read and is never stored. Each record also carries
        a computed `tags` array: the union of the tag IDs of its member Automata,
        sorted. It is read-only and is never stored on the Automation.
        An empty store returns `[]`, never `null`. The response carries an
        `ETag`; a matching `If-None-Match` returns 304.
      operationId: automationsList
      tags: [Automations]
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "304":
          description: "`If-None-Match` matched the current ETag."
        "200":
          description: Array of Automations
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Automation"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}
    post:
      summary: Create an Automation
      description: |
        Creates a new Automation in `draft` status at version 1. Members
        reference existing Automata (PRDs) by `prd_id`; a member may belong
        to at most one non-terminal Automation. The per-outcome edges must
        form an acyclic graph rooted at `entry_member_id` (when
        `entry_member_id` is omitted, the first member is the entry).
        `actor` and `reason` are recorded in the audit log.
      operationId: automationsCreate
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationCreate"
      responses:
        "201":
          description: Created Automation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400":
          description: |
            Validation failure: unknown member or edge target, a cycle in
            the member graph, a member already owned by another Automation,
            or a template/owned PRD enrolled as a member.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}
  /api/automations/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    get:
      summary: Get an Automation
      description: |
        The stored record. When the Automation has a budget policy it also
        carries a computed `budget` view (spend, remaining, window, reset
        time, any hold, the stored breach state and the estimated allocation
        figure); the view is worked out on each read and is never stored.
      operationId: automationsGet
      tags: [Automations]
      responses:
        "200":
          description: Automation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "404": {description: Automation not found}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}
    put:
      summary: Update an Automation
      description: |
        Replaces name, description, budget policy, execution and verification
        defaults, `project_dir`, members and the entry member. A blank name
        keeps the existing one. Members and the entry member may only
        actually change while the Automation is a draft.
        Optimistic concurrency: send the last `version` you saw as
        `expected_version`; a stale value is rejected and the record is left
        unchanged.
      operationId: automationsUpdate
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationUpdate"
      responses:
        "200":
          description: Updated Automation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": {description: "Validation failure (same rules as create)"}
        "404": {description: Automation not found}
        "409":
          description: |
            `expected_version` does not match the stored version, or the
            member list / entry member is changing while the Automation is
            not in draft.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}
    delete:
      summary: Delete an Automation
      description: |
        Removes the record and frees its members (their PRDs are no longer
        reserved by an Automation). Only draft, completed or cancelled
        Automations may be deleted; an intermediate status is a 409.
        Optional body `{"actor": "...", "reason": "..."}` for the audit log;
        actor defaults to "operator".
      operationId: automationsDelete
      tags: [Automations]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: {type: string}
                reason: {type: string}
      responses:
        "204": {description: Deleted}
        "404": {description: Automation not found}
        "409": {description: "The Automation is active, paused or blocked and cannot be deleted; complete or cancel it first"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}

  /api/automations/import-graph/{graph_id}:
    parameters:
      - {name: graph_id, in: path, required: true, schema: {type: string}, description: "Orchestrator graph ID"}
    post:
      summary: Convert an orchestrator graph into a draft Automation
      description: |
        Reads the orchestrator graph and creates a draft Automation from it:
        Automaton nodes become members, a fan-out and its fan-in become a paired
        fork and join, and guardrail nodes are dropped with a warning. The graph
        is never changed. With `dry_run` true nothing is created or audited and
        the response carries the `input` that a real run would create, the
        `warnings` and `dry_run: true`. A real import writes one
        `automation_import_graph` audit entry.
      operationId: automationsImportGraph
      tags: [Automations]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run: {type: boolean}
      responses:
        "200":
          description: The new Automation, or for a dry run the converted input with warnings
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Automation"
                  - type: object
                    properties:
                      input: {type: object}
                      warnings: {type: array, items: {type: string}}
                      dry_run: {type: boolean}
        "404": {description: Graph not found}
        "409": {description: "A member Automaton already belongs to another Automation"}
        "422": {description: "The graph cannot be expressed as an Automation; the body gives the reason"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous or orchestrator disabled"}

  /api/automations/{id}/activate:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    post:
      summary: Activate a draft Automation
      description: |
        Validates the Automation, marks it active and starts its entry member
        through the same approval gate used between members; if the entry
        member cannot start, the Automation becomes blocked instead. Only a
        draft can be activated. Optional body `{"actor": "...", "reason": "..."}`
        for the audit log; actor defaults to "operator".
      operationId: automationsActivate
      tags: [Automations]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: {type: string}
                reason: {type: string}
      responses:
        "200":
          description: The Automation after activation (active, or blocked with its reason in the status row)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": {description: "The Automation cannot be activated (for example it has no entry member)"}
        "404": {description: Automation not found}
        "409": {description: "The Automation is not a draft, or changed while it was being activated"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}

  /api/automations/{id}/pause:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    post:
      summary: Pause an active Automation
      description: |
        Moves an active Automation to paused. Members already running keep running
        and nothing is ended; a paused Automation moves on when a member finishes
        but starts nothing until resumed. Body: `{expected_version, actor?, reason?}`.
      operationId: automationsPause
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties:
        expected_version: {type: integer, format: int64, description: "The Automation version the caller read; a different current version is a 409"}
        actor: {type: string, description: "Who is acting (audit log); defaults to operator"}
        reason: {type: string, description: "Why (audit log)"}
      responses:
        "200":
          description: The Automation, now paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": {description: "Malformed body"}
        "404": {description: Automation not found}
        "409": {description: "Stale expected_version (the Automation changed since it was read), or the Automation is not in a state this operation accepts"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}

  /api/automations/{id}/resume:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    post:
      summary: Resume a paused Automation
      description: |
        Moves a paused Automation back to active; members that finished while it was
        paused are routed on and the next member is started. Body:
        `{expected_version, actor?, reason?}`.
      operationId: automationsResume
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties:
        expected_version: {type: integer, format: int64, description: "The Automation version the caller read; a different current version is a 409"}
        actor: {type: string, description: "Who is acting (audit log); defaults to operator"}
        reason: {type: string, description: "Why (audit log)"}
      responses:
        "200":
          description: The Automation, now active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": {description: "Malformed body"}
        "404": {description: Automation not found}
        "409": {description: "Stale expected_version (the Automation changed since it was read), or the Automation is not in a state this operation accepts"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}

  /api/automations/{id}/cancel:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    post:
      summary: Cancel an Automation
      description: |
        Cancels the Automation. `cancel_in_flight` is REQUIRED and has no default:
        `true` ends the session of every in-flight member, `false` leaves in-flight
        members running. A body without the key is a 400 naming both values. Members
        not yet run become cancelled either way. If the Automation is cancelled but
        ending an in-flight member session failed, the response is a 500 and the
        Automation stays cancelled.
      operationId: automationsCancel
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, cancel_in_flight]
              properties:
        expected_version: {type: integer, format: int64, description: "The Automation version the caller read; a different current version is a 409"}
        actor: {type: string, description: "Who is acting (audit log); defaults to operator"}
        reason: {type: string, description: "Why (audit log)"}
        cancel_in_flight: {type: boolean, description: "REQUIRED. true ends the session of every in-flight member; false leaves in-flight members running"}
      responses:
        "200":
          description: The Automation, now cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": {description: "cancel_in_flight is missing (the message names cancel_in_flight=true and cancel_in_flight=false), or the body is malformed"}
        "404": {description: Automation not found}
        "409": {description: "Stale expected_version (the Automation changed since it was read), or the Automation is not in a state this operation accepts"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}

  /api/automations/{id}/skip_member:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    post:
      summary: Skip an active member
      description: |
        Skips an active member and moves on along `edge`, as if the member had ended
        that way. A session the member is running is not ended. In a forked
        Automation with several active branches, `member_id` names the branch.
      operationId: automationsSkipMember
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties:
        expected_version: {type: integer, format: int64, description: "The Automation version the caller read; a different current version is a 409"}
        actor: {type: string, description: "Who is acting (audit log); defaults to operator"}
        reason: {type: string, description: "Why (audit log)"}
        member_id: {type: string, description: "Member ID"}
        edge: {type: string, enum: [on_complete, on_blocked, on_failed], default: on_complete}
      responses:
        "200":
          description: The Automation after the skip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": {description: "Invalid edge, or member_id missing or not an active branch"}
        "404": {description: Automation not found}
        "409": {description: "Stale expected_version (the Automation changed since it was read), or the Automation is not in a state this operation accepts"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}

  /api/automations/{id}/insert_member:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    post:
      summary: Insert an Automaton member
      description: |
        Inserts an Automaton as a new member. On a draft it lands in the graph at once; on a
        running Automation it is held as a pending insert until an operator approves it
        (`approve_insert`). `reason` is required. Only one urgent insert may be pending
        at a time. An urgent insert takes the next slot and must leave `after` empty.
      operationId: automationsInsertMember
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, reason, member]
              properties:
        expected_version: {type: integer, format: int64, description: "The Automation version the caller read; a different current version is a 409"}
        actor: {type: string, description: "Who is acting (audit log); defaults to operator"}
        reason: {type: string, description: "Why (audit log)"}
        member:
          type: object
          required: [prd_id]
          properties:
            prd_id: {type: string, description: "The member Automaton to insert"}
            name: {type: string, description: "Optional display name"}
        urgent: {type: boolean, description: "Take the next slot instead of the end of the chain"}
        after: {type: string, description: "Insert directly after this member ID; empty for the end of the chain"}
      responses:
        "200":
          description: The Automation after the insert (the pending insert is on the record when it was held)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": {description: "reason or member.prd_id missing, or an invalid position"}
        "404": {description: Automation not found}
        "409": {description: "Stale expected_version (the Automation changed since it was read), or the Automation is not in a state this operation accepts"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}

  /api/automations/{id}/remove_member:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    post:
      summary: Remove a member
      description: |
        Removes a member that has not started and has no outgoing edges. The entry
        member, running or finished members, forks, joins and fork or join branches are
        refused with a 409.
      operationId: automationsRemoveMember
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, member_id]
              properties:
        expected_version: {type: integer, format: int64, description: "The Automation version the caller read; a different current version is a 409"}
        actor: {type: string, description: "Who is acting (audit log); defaults to operator"}
        reason: {type: string, description: "Why (audit log)"}
        member_id: {type: string, description: "Member ID"}
      responses:
        "200":
          description: The Automation without the member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": {description: "member_id missing"}
        "404": {description: Automation not found}
        "409": {description: "Stale expected_version (the Automation changed since it was read), or the Automation is not in a state this operation accepts"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}

  /api/automations/{id}/reorder_edges:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    post:
      summary: Rewire a member's edges
      description: |
        Rewires the three outgoing edges of a member that has not started. Each edge
        is the member ID it now names; empty or omitted clears it. A member that is
        running or finished is refused with a 409; unknown targets, self-edges and
        cycles are a 400.
      operationId: automationsReorderEdges
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, member_id]
              properties:
        expected_version: {type: integer, format: int64, description: "The Automation version the caller read; a different current version is a 409"}
        actor: {type: string, description: "Who is acting (audit log); defaults to operator"}
        reason: {type: string, description: "Why (audit log)"}
        member_id: {type: string, description: "Member ID"}
        on_complete: {type: string}
        on_blocked: {type: string}
        on_failed: {type: string}
      responses:
        "200":
          description: The Automation with the new edges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": {description: "Unknown target, self-edge, cycle, or member_id missing"}
        "404": {description: Automation not found}
        "409": {description: "Stale expected_version (the Automation changed since it was read), or the Automation is not in a state this operation accepts"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}

  /api/automations/{id}/approve_insert:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    post:
      summary: Approve a pending inserted member
      description: |
        Promotes a pending insert, named by `member_id` (the pending ID returned with
        the insert), into the graph at its reserved position. Only the operator may
        approve; an unknown pending ID is a 409.
      operationId: automationsApproveInsert
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, member_id]
              properties:
        expected_version: {type: integer, format: int64, description: "The Automation version the caller read; a different current version is a 409"}
        actor: {type: string, description: "Who is acting (audit log); defaults to operator"}
        reason: {type: string, description: "Why (audit log)"}
        member_id: {type: string, description: "Member ID"}
      responses:
        "200":
          description: The Automation with the member in the graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": {description: "member_id missing"}
        "404": {description: Automation not found}
        "409": {description: "Stale expected_version (the Automation changed since it was read), or the Automation is not in a state this operation accepts"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}

  /api/automations/{id}/set_budget:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    post:
      summary: Set or clear an Automation's budget policy
      description: |
        Sets, replaces or clears the budget policy of the Automation, or, with
        `member_id`, the override of one member. The policy fields replace the
        whole policy; `clear` removes the policy (or the member override) and
        cannot be combined with them. For a member, `estimated_cost_usd`
        declares what its Automaton is expected to cost; sent alone it changes
        only that estimate, and 0 removes it.

        Setting a policy never changes the Automation's status. A paused
        Automation resumes through its own tick when the window resets, and a
        blocked one when the operator resumes it. The Automation must not be
        completed or cancelled, and a member must not have finished.

        A dollar ceiling that is reached pauses the Automation and resumes it
        by itself at the window rollover when the reset time is known (a day,
        week or month window, anchored at `reset_time`, `reset_weekday`,
        `reset_day` and `reset_zone` or at the calendar default, or a reset time
        read from a rate-limit message). When the reset time is not known, or
        `on_breach` is `block`, it is blocked and waits for the operator. An
        alert is raised either way. An `allocation_pct` ceiling and
        `allocation_estimate` only add an estimated figure and never pause or
        block. Naming a peer in `peer_window` counts that peer's usage toward
        the ceiling; this is opt-in per peer and nothing confirms
        automatically that the peer shares the account.

        Send the last `version` you saw as `expected_version`. `actor` defaults
        to "operator"; `actor` and `reason` are recorded in the audit log as
        `automation_set_budget`.
      operationId: automationsSetBudget
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetSetRequest"
      responses:
        "200":
          description: The updated Automation, with its computed `budget` view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": {description: "Invalid input: an unknown ceiling type, window, pacing or on-breach rule, a ceiling that is not positive, a reset field that does not fit the window, clear combined with policy fields, a declared cost without a member, or a fork or join member"}
        "404": {description: "Automation or member not found"}
        "409": {description: "expected_version is stale, the Automation is completed or cancelled, or the member has already finished"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}
  /api/automations/{id}/set_decision_assistant:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    post:
      summary: Set or clear an Automation's decision assistant
      description: |
        Sets or clears the optional local-model decision assistant of the
        Automation, or, with `member_id`, of one member. It is off by default.
        The fields replace the whole setting; `clear`, or an empty `backend`,
        turns it off, and `clear` cannot be combined with the setting fields.
        `mode` is `shadow` (the default) or `live`; `hooks` are `empty_edge`,
        `skip_member`, `insert_member` and `budget_breach`; `thresholds` map a
        hook to a confidence in (0,1] (defaults 0.9, `budget_breach` 0.95).
        The Automation's status is not changed. `actor` and `reason` are
        recorded in the audit log as `automation_set_decision_assistant`.
      operationId: automationsSetDecisionAssistant
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                member_id: {type: string}
                backend: {type: string}
                model: {type: string}
                mode: {type: string, enum: [shadow, live]}
                hooks:
                  type: array
                  items: {type: string, enum: [empty_edge, skip_member, insert_member, budget_breach]}
                thresholds:
                  type: object
                  additionalProperties: {type: number, exclusiveMinimum: 0, maximum: 1}
                clear: {type: boolean}
                expected_version: {type: integer}
                actor: {type: string}
                reason: {type: string}
      responses:
        "200":
          description: The updated Automation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": {description: "Invalid setting, or nothing to set"}
        "404": {description: Automation or member not found}
        "409": {description: "expected_version is stale, or the Automation is completed or cancelled"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}

  # ─── Mobile-client parity endpoints (documented in v4.0.3) ────
  /api/backends/active:
