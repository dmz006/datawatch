        content:
          application/json:
            schema:
              type: object
              properties:
                id: {type: string}
                ids:
                  type: array
                  items: {type: string}
      responses: {"200": {description: OK}}
  /api/sessions/timeline:
    get:
      summary: Session event timeline (state transitions + key events)
      operationId: sessionsTimeline
      tags: [Sessions]
      parameters:
        - {name: id, in: query, required: true, schema: {type: string}}
        - {name: since, in: query, schema: {type: integer, description: "epoch ms"}}
        - {name: limit, in: query, schema: {type: integer}}
      responses: {"200": {description: OK}}

  # BL359 — restart session by ID (path-based)
  /api/sessions/{id}/status:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Full or short session ID"}
    get:
      summary: Session status board (hook state plus Automaton detail)
      description: |
        Latest hook-event state and derived board for the PWA Status tab.
        For autonomous task sessions the response also carries an `automaton`
        block built from the daemon's own PRD/story/task store, so it is
        present even when the agent sends no hook payloads. The block is
        omitted for sessions not linked to an autonomous task.
        When no hook payload supplied `sprint`, a backward-compatible
        `sprint` map is synthesized from the same data.
        Requires `CapConfigRead` federation capability.
      operationId: sessionStatus
      tags: [Sessions]
      responses:
        "200":
          description: Status board
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: {type: string}
                  state: {type: string, description: "running | waiting | idle | unknown"}
                  current_focus: {type: object, additionalProperties: true}
                  sprint:
                    type: object
                    additionalProperties: true
                    description: |
                      Hook-supplied sprint state, or (autonomous sessions without a
                      hook payload) a synthesized map with stable keys `sprint_id`,
                      `title`, `status`, `automata`, `task_id`, `task_title`, `story_title`.
                  tests: {type: object, additionalProperties: true}
                  git: {type: object, additionalProperties: true}
                  last_event: {type: object, additionalProperties: true}
                  idle_since: {type: string, format: date-time}
                  hook_health: {type: string, description: "alive | stale | missing"}
                  telemetry: {type: object, additionalProperties: true}
                  automaton: {$ref: "#/components/schemas/SessionAutomatonDetail"}
                  updated_at: {type: string, format: date-time}
        "400": {description: Session id required}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Federation peer lacks CapConfigRead}
        "405": {description: Method not allowed}

  /api/sessions/{id}/restart:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      summary: Restart a session by path ID
      description: |
        Restart a completed, failed, or killed session. Optionally supply
        a new task or session name; otherwise the original values are reused.
      operationId: sessionRestartById
      tags: [Sessions]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                task: {type: string, description: "Override the task for the restarted session"}
                session_name: {type: string, description: "Override the session name"}
      responses:
        "200":
          description: Session restarted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400": {description: Bad Request}
        "404": {description: Session not found}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/cert:
    get:
      summary: Download the server CA certificate PEM
      operationId: cert
      tags: [Security]
      responses:
        "200":
          description: PEM-encoded certificate
          content:
            application/x-pem-file: {schema: {type: string}}
        "404": {description: TLS not enabled}
  /api/interfaces:
    get:
      summary: List network interfaces the daemon sees
      operationId: interfaces
      tags: [Diagnostics]
      responses: {"200": {description: OK}}
  /api/logs:
    get:
      summary: Paged daemon log tail
      operationId: logs
      tags: [Diagnostics]
      parameters:
        - {name: level, in: query, schema: {type: string, enum: [info, warn, error]}}
        - {name: since, in: query, schema: {type: integer, description: "epoch ms"}}
        - {name: limit, in: query, schema: {type: integer}}
      responses: {"200": {description: OK}}
  /api/restart:
    post:
      summary: Restart the daemon (re-exec). Returns before the old process exits.
      operationId: restart
      tags: [Operations]
      responses: {"200": {description: "{status: restarting}"}}

  # Result store (BL360)
  /api/result-store:
    get:
      summary: List result store entries
      operationId: resultStoreList
      tags: [ResultStore]
      parameters:
        - {name: prefix, in: query, required: false, description: "Optional name prefix filter", schema: {type: string}}
      responses:
        "200":
          description: Array of result entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResultEntry"
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      summary: Put a result store entry
      operationId: resultStorePut
      tags: [ResultStore]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, payload]
              properties:
                name: {type: string}
                payload: {type: object}
                ttl_seconds: {type: integer}
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultEntry"
        "400": {description: Bad Request}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/result-store/{name}:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string}}
    get:
      summary: Get a result store entry by name
      operationId: resultStoreGet
      tags: [ResultStore]
      responses:
        "200":
          description: Result entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultEntry"
        "404": {description: Not found}
        "401": {$ref: "#/components/responses/Unauthorized"}
    delete:
      summary: Delete a result store entry
      operationId: resultStoreDelete
      tags: [ResultStore]
      responses: {"200": {description: Deleted}, "404": {description: Not found}, "401": {$ref: "#/components/responses/Unauthorized"}}

  /api/ollama/models:
    get:
      summary: List installed Ollama models (name, size, modified)
      operationId: ollamaModels
      tags: [Backends]
      responses: {"200": {description: OK}}
  /api/openwebui/models:
    get:
      summary: List OpenWebUI models
      operationId: openwebuiModels
      tags: [Backends]
      responses: {"200": {description: OK}}

  # ─── Observer (BL171, v4.1.0) — unified stats / process-tree /
  # sub-process monitoring. /api/stats gained a ?v=2 param that
  # returns the structured StatsResponse v2 payload. /api/observer/*
  # exposes the envelope + tree drill-downs that mobile + PWA use.
  /api/observer/stats:
    get:
      summary: StatsResponse v2 snapshot (structured host / cpu / mem / disk / gpu / sessions / backends / envelopes / processes)
      operationId: observerStats
      tags: [Observer]
      responses: {"200": {description: OK}, "503": {description: observer disabled}}
  /api/observer/envelopes:
    get:
      summary: Envelope rollup only — per-session + per-LLM-backend CPU / mem / net / GPU totals
      operationId: observerEnvelopes
      tags: [Observer]
      responses: {"200": {description: OK}, "503": {description: observer disabled}}
  /api/observer/envelope:
    get:
      summary: Drill-down — process sub-tree for one envelope by id
      operationId: observerEnvelope
      tags: [Observer]
      parameters:
        - {name: id, in: query, required: true, schema: {type: string},
           description: "envelope id, e.g. session:ralfthewise-787e or backend:ollama"}
      responses: {"200": {description: OK}, "404": {description: envelope not found}, "503": {description: observer disabled}}
  /api/observer/config:
    get:
      summary: Read observer config
      operationId: observerConfigGet
      tags: [Observer]
      responses: {"200": {description: OK}}
    put:
      summary: Replace observer config (full body)
      operationId: observerConfigSet
      tags: [Observer]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object}}}
      responses: {"200": {description: OK}, "400": {description: Bad Request}}

  # ─── Observer peers (BL172 / S11 Shape B + C) — federated peer
  # registry. 503 when observer.peers.allow_register is false.
  /api/observer/peers:
    get:
      summary: List registered Shape B / C peers (TokenHash redacted)
      operationId: observerPeersList
      tags: [Observer]
      responses: {"200": {description: OK}, "503": {description: Peer registry disabled}}
    post:
      summary: Register a Shape B / C peer; returns the minted bearer token (only opportunity)
      operationId: observerPeersRegister
      tags: [Observer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:    {type: string, description: "Stable peer name (commonly hostname)"}
                shape:   {type: string, enum: [B, C], default: B}
                version: {type: string}
                host_info: {type: object, additionalProperties: true}
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:  {type: string}
                  shape: {type: string}
                  token: {type: string, description: "Bearer token — store securely; only returned once"}
        "400": {description: Bad Request}
        "503": {description: Peer registry disabled}
  /api/observer/peers/{name}:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string}}
    get:
      summary: Peer detail (TokenHash redacted)
      operationId: observerPeerGet
      tags: [Observer]
      responses: {"200": {description: OK}, "404": {description: Not found}, "503": {description: Peer registry disabled}}
    delete:
      summary: De-register a peer (rotates the token — peer auto-re-registers on next push)
      operationId: observerPeerDelete
      tags: [Observer]
      responses: {"200": {description: OK}, "404": {description: Not found}, "503": {description: Peer registry disabled}}
  /api/observer/peers/{name}/stats:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string}}
    get:
      summary: Last-known StatsResponse v2 snapshot for the peer
      operationId: observerPeerLastStats
      tags: [Observer]
      responses: {"200": {description: OK}, "404": {description: No snapshot or unknown peer}, "503": {description: Peer registry disabled}}
    post:
      summary: Push a StatsResponse v2 snapshot (Bearer auth from `register`)
      description: |
        Push body wraps the StatsResponse v2 with `shape` and
        `peer_name` fields so the parent can roll up envelopes
        per-peer. peer_name in the body must match the path segment.
      operationId: observerPeerPush
      tags: [Observer]
      security:
        - BearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshot]
              properties:
                shape:     {type: string, enum: [B, C]}
                peer_name: {type: string}
                snapshot:  {type: object, description: "StatsResponse v2 payload"}
      responses:
        "200": {description: Accepted}
        "400": {description: Bad payload or peer_name mismatch}
        "401": {description: Missing or invalid bearer token}
        "503": {description: Peer registry disabled}

  # ─── Memory + Knowledge Graph (BL23 episodic + BL57 KG, BL101 cross-
  # profile namespaces). All endpoints 503 when memory is not enabled.
  /api/memory/stats:
    get:
      summary: Memory backend status (provider, embedder, counts, last write)
      operationId: memoryStats
      tags: [Memory]
      responses: {"200": {description: OK}, "503": {description: Memory not enabled}}
  /api/memory/list:
    get:
      summary: List recent memories (most recent first)
      operationId: memoryList
      tags: [Memory]
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer}}
        - {name: namespace, in: query, required: false, schema: {type: string}}
      responses: {"200": {description: OK}, "503": {description: Memory not enabled}}
  /api/memory/search:
    get:
      summary: Semantic recall over the episodic store
      description: |
        Vector search across stored memories. Pass `q` for the query
        string. Optional `profile` (or `agent_id`) expands the
        namespace set per BL101 mutual-opt-in rules so workers see
        peer-profile memories without knowing raw namespace ids.
      operationId: memorySearch
      tags: [Memory]
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer}}
        - {name: profile, in: query, required: false, schema: {type: string}}
        - {name: agent_id, in: query, required: false, schema: {type: string}}
        - {name: namespace, in: query, required: false, schema: {type: string}}
      responses: {"200": {description: OK}, "400": {description: Missing q}, "503": {description: Memory not enabled}}
  /api/memory/save:
    post:
      summary: Store a new memory (decision, pattern, finding)
      operationId: memorySave
      tags: [Memory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: {type: string}
                kind: {type: string, description: "decision / pattern / finding / context (free-form)"}
                namespace: {type: string}
                tags: {type: array, items: {type: string}}
                metadata: {type: object}
      responses: {"200": {description: Saved}, "400": {description: Bad Request}, "503": {description: Memory not enabled}}
  /api/memory/delete:
    post:
      summary: Forget a memory by id
      operationId: memoryDelete
      tags: [Memory]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [id], properties: {id: {type: string}}}}}
      responses: {"200": {description: OK}, "404": {description: Not found}, "503": {description: Memory not enabled}}
  /api/memory/reindex:
    post:
      summary: Rebuild the vector index for a namespace (or all namespaces)
      operationId: memoryReindex
      tags: [Memory]
      requestBody:
        required: false
        content: {application/json: {schema: {type: object, properties: {namespace: {type: string}}}}}
      responses: {"200": {description: Reindex started}, "503": {description: Memory not enabled}}
  /api/memory/learnings:
    get:
      summary: Recent learnings (decisions + verifier results) feeding the autonomous loop
      operationId: memoryLearnings
      tags: [Memory]
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer}}
        - {name: since, in: query, required: false, schema: {type: string, format: date-time}}
      responses: {"200": {description: OK}, "503": {description: Memory not enabled}}
  /api/memory/research:
    get:
      summary: Cross-session research aggregator (deep search with KG context)
      operationId: memoryResearch
      tags: [Memory]
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}}
        - {name: depth, in: query, required: false, schema: {type: integer}}
      responses: {"200": {description: OK}, "400": {description: Missing q}, "503": {description: Memory not enabled}}
  /api/memory/export:
    get:
      summary: Export the entire memory store as a portable JSON bundle
      operationId: memoryExport
      tags: [Memory]
      responses:
        "200":
          description: JSON bundle (memories + KG + namespaces)
          content: {application/json: {schema: {type: object}}}
        "503": {description: Memory not enabled}
  /api/memory/import:
    post:
      summary: Import a memory bundle (idempotent — existing ids are skipped)
      operationId: memoryImport
      tags: [Memory]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object}}}
      responses: {"200": {description: Imported}, "400": {description: Bad bundle}, "503": {description: Memory not enabled}}
  /api/memory/wal:
    get:
      summary: Tail of the memory write-ahead audit log
      operationId: memoryWAL
      tags: [Memory]
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer}}
      responses: {"200": {description: OK}, "503": {description: Memory not enabled}}
  /api/memory/test:
    get:
      summary: Probe the configured backend before flipping the enable flag
      description: PWA Settings toggle uses this to validate Postgres + embedder reachability.
      operationId: memoryTest
      tags: [Memory]
      responses: {"200": {description: Reachable}, "502": {description: Backend unreachable}}
  /api/memory/kg/query:
    get:
      summary: Knowledge-graph query (entities + relationships)
      operationId: kgQuery
      tags: [Memory]
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}}
        - {name: depth, in: query, required: false, schema: {type: integer}}
      responses: {"200": {description: OK}, "400": {description: Missing q}, "503": {description: Memory not enabled}}
  /api/memory/kg/add:
    post:
      summary: Add an entity / relationship to the knowledge graph
      operationId: kgAdd
      tags: [Memory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject: {type: string}
                predicate: {type: string}
                object: {type: string}
                metadata: {type: object}
      responses: {"200": {description: OK}, "400": {description: Bad Request}, "503": {description: Memory not enabled}}
  /api/memory/kg/invalidate:
    post:
      summary: Invalidate (soft-delete) a KG triple by id
      operationId: kgInvalidate
      tags: [Memory]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [id], properties: {id: {type: string}, reason: {type: string}}}}}
      responses: {"200": {description: OK}, "404": {description: Not found}, "503": {description: Memory not enabled}}
  /api/memory/kg/timeline:
    get:
      summary: Timeline view of KG changes for an entity
      operationId: kgTimeline
      tags: [Memory]
      parameters:
        - {name: entity, in: query, required: true, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer}}
      responses: {"200": {description: OK}, "400": {description: Missing entity}, "503": {description: Memory not enabled}}
  /api/memory/kg/stats:
    get:
      summary: KG counts (entities, triples, namespaces)
      operationId: kgStats
      tags: [Memory]
      responses: {"200": {description: OK}, "503": {description: Memory not enabled}}

  # ─── Voice transcription (issue #2 / F18) — Whisper-backed
  # multipart upload returning the transcript and an optional command
  # action. Used by the PWA mic button (#21, v4.2.0) and by mobile.
  /api/voice/transcribe:
    post:
      summary: Transcribe an audio blob with Whisper (returns transcript + optional action dispatch)
      description: |
        Accepts multipart/form-data with an `audio` blob (opus/ogg/webm/mp4
        preferred). When `session_id` is set the result auto-replies into
        that session; when `auto_exec` is `true` and the transcript starts
        with `new:`, `reply:`, or `status`, the corresponding action is
        returned in the `action` field.
      operationId: voiceTranscribe
      tags: [Voice]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: Audio blob (opus/ogg/webm/mp4 preferred, mono 16 kHz)
                session_id:
                  type: string
                  description: When set the transcript is replied into this session
                auto_exec:
                  type: string
                  description: "true / 1 — run a recognised command prefix (new:/reply:/status)"
                ts_client:
                  type: string
                  description: unix_ms client send time, for latency telemetry
      responses:
        "200":
          description: Transcript + optional action
          content:
            application/json:
              schema:
                type: object
                properties:
                  transcript: {type: string}
                  confidence: {type: number}
                  action: {type: string, enum: [none, new, reply, status]}
                  session_id: {type: string}
                  latency_ms: {type: integer}
        "400": {description: Missing or malformed audio}
        "502": {description: Whisper backend error}
        "503": {description: Voice transcription not enabled}

  # ─── RTK auto-update (BL85, v4.0.1) — surfaces the background
  # checker to operators so they can see the available rtk version
  # and trigger an update from the PWA / Signal.
  /api/rtk/version:
    get:
      summary: Currently-installed rtk version + last-known available release
      operationId: rtkVersion
      tags: [RTK]
      responses:
        "200":
          description: Version info
          content:
            application/json:
              schema:
                type: object
                properties:
                  installed: {type: string}
                  available: {type: string}
                  update_available: {type: boolean}
                  checked_at: {type: string, format: date-time}
  /api/rtk/check:
    post:
      summary: Force a check against the rtk-ai/rtk releases endpoint now
      operationId: rtkCheck
      tags: [RTK]
      responses: {"200": {description: Check completed}, "502": {description: GitHub releases unreachable}}
  /api/rtk/update:
    post:
      summary: Download + install the available rtk binary (atomic replace + chmod)
      description: |
        Operator-triggered update. The PWA Settings → Monitor card
        surfaces the upstream install one-liner
        (`curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh`)
        as a click-to-copy chip when an upgrade is available, so the
        operator can run it manually if they prefer.
      operationId: rtkUpdate
      tags: [RTK]
      responses: {"200": {description: Updated}, "409": {description: Already up to date}, "502": {description: Download failed}}
  /api/rtk/discover:
    get:
      summary: Walk recent Claude Code sessions and report missed RTK opportunities
      operationId: rtkDiscover
      tags: [RTK]
      responses: {"200": {description: Discovery report}}

  # ─── Cost tracking (BL6) — token + USD rollups across sessions and
  # backends. Mobile + PWA Settings card both consume.
  /api/cost:
    get:
      summary: Token + USD cost rollup across all sessions
      operationId: costSummary
      tags: [Cost]
      parameters:
        - {name: since, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: backend, in: query, required: false, schema: {type: string}}
      responses: {"200": {description: OK}}
  /api/cost/usage:
    get:
      summary: Per-session usage + cost detail
      operationId: costUsage
      tags: [Cost]
      parameters:
        - {name: session_id, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer}}
      responses: {"200": {description: OK}}
  /api/cost/rates:
    get:
      summary: Current per-model price-per-token rates
      operationId: costRatesGet
      tags: [Cost]
      responses: {"200": {description: OK}}
    put:
      summary: Operator override for per-model rates
      operationId: costRatesSet
      tags: [Cost]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object}}}
      responses: {"200": {description: OK}, "400": {description: Bad Request}}

  # ─── Schedules — plural path the server actually serves (v4.0.7 fix for issue #16)
  /api/schedules:
    get:
      summary: List scheduled commands (plural alias of /api/schedule)
      description: |
        Returns scheduled commands. Optional query params filter
        the result set; the PWA uses both `session_id` and `state`.
      operationId: listSchedules
      tags: [Schedule]
      parameters:
        - name: session_id
          in: query
          required: false
          description: Filter to schedules attached to a specific session
          schema: {type: string}
        - name: state
          in: query
          required: false
          description: Filter by lifecycle state
          schema: {type: string, enum: [pending, fired, cancelled, failed]}
      responses:
        "200":
          description: Array of scheduled command entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledCommand"
    post:
      summary: Add a scheduled command (plural alias of /api/schedule)
      operationId: addSchedule
      tags: [Schedule]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledCommand"
      responses:
        "200":
          description: Scheduled command added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledCommand"
    delete:
      summary: Cancel a scheduled command by id (plural alias of /api/schedule)
      operationId: deleteSchedule
      tags: [Schedule]
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
      responses:
        "200": {description: OK}
        "404": {description: schedule not found}

  # ─── Profiles — backend + project + cluster profile enumeration (issue #16)
  /api/profiles:
    get:
      summary: List all registered profiles (backend / project / cluster)
      description: |
        Returns a unified list of agent profiles used by the New
        Session form. The server splits the detailed CRUD across
        `/api/profiles/projects` and `/api/profiles/clusters`; this
        top-level list is the convenience view.
      operationId: listProfiles
      tags: [Profiles]
      responses:
        "200":
          description: Array of profile summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: {type: string}
                    kind:
                      type: string
                      enum: [backend, project, cluster]
                    default_backend: {type: string}
  /api/profiles/projects:
    get:
      summary: List project profiles
      operationId: listProjectProfiles
      tags: [Profiles]
      responses: {"200": {description: OK}}
    post:
      summary: Create or update a project profile
      operationId: upsertProjectProfile
      tags: [Profiles]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"200": {description: OK}, "400": {description: Bad Request}}
  /api/profiles/clusters:
    get:
      summary: List cluster profiles
      operationId: listClusterProfiles
      tags: [Profiles]
      responses: {"200": {description: OK}}
    post:
      summary: Create or update a cluster profile
      operationId: upsertClusterProfile
      tags: [Profiles]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"200": {description: OK}, "400": {description: Bad Request}}

  # ─── BL170 phase 5 — long-tail backfill (operator-facing routes).
  # Worker-internal / PWA-only routes deliberately omitted: /api/proxy/*,
  # /api/test/message, /api/mcp/docs, /api/agents/peer/*,
  # /api/channel/{ready,notify}, /api/stats/kill-orphans, /api/update,
  # /api/pipeline*. See docs/plans/2026-04-25-bl170-feature-completeness-audit.md.

  # Sessions sub-routes
  /api/sessions/finished-oneshots:
    get:
      summary: List one-shot sessions whose command has ended but that never reached complete
      operationId: sessionsFinishedOneShotsList
      tags: [Sessions]
      responses: {"200": {description: "{count, ids}"}}
    post:
      summary: Complete those sessions (runs the validation gate), close their panes and remove scratch files
      operationId: sessionsFinishedOneShotsCleanup
      tags: [Sessions]
      responses: {"200": {description: "{reaped: [session ids]}"}}
  /api/sessions/aggregated:
    get:
      summary: Aggregated session view across federated peers
      operationId: sessionsAggregated
      tags: [Sessions]
      responses: {"200": {description: OK}}
  /api/sessions/bind:
    post:
      summary: Bind a session to an agent worker (proxies session reads through /api/proxy/agent/...)
      operationId: sessionBind
      tags: [Sessions]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [session_id, agent_id], properties: {session_id: {type: string}, agent_id: {type: string}}}}}}
      responses: {"200": {description: Bound}, "404": {description: Session or agent not found}}
  /api/sessions/import:
    post:
      summary: Import a single orphan session from disk (BL94)
      operationId: sessionImport
      tags: [Sessions]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [path], properties: {path: {type: string}}}}}}
      responses: {"200": {description: Imported}, "404": {description: Session dir not found}}
  /api/sessions/kill:
    post:
      summary: Terminate a session (sends SIGTERM to the tmux process)
      operationId: sessionKill
      tags: [Sessions]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [id], properties: {id: {type: string}}}}}}
      responses: {"200": {description: OK}, "404": {description: Not found}}
  /api/sessions/prompt:
    get:
      summary: Inspect the captured prompt waiting for input (when state=waiting_input)
      operationId: sessionPromptGet
      tags: [Sessions]
      parameters:
        - {name: id, in: query, required: true, schema: {type: string}}
      responses: {"200": {description: OK}, "404": {description: Not found}}
  /api/sessions/reconcile:
    get:
      summary: List orphan session directories on disk that are missing from the registry (BL93)
      operationId: sessionReconcile
      tags: [Sessions]
      responses: {"200": {description: List of orphans}}
  /api/sessions/response:
    get:
      summary: Last LLM response for a session (final assistant message, parsed)
      operationId: sessionResponse
      tags: [Sessions]
      parameters:
        - {name: id, in: query, required: true, schema: {type: string}}
      responses: {"200": {description: OK}, "404": {description: Not found}}
  /api/sessions/stale:
    get:
      summary: List running sessions stuck longer than session.stale_timeout_seconds (BL40)
      operationId: sessionsStale
      tags: [Sessions]
      parameters:
        - {name: seconds, in: query, required: false, schema: {type: integer}}
      responses: {"200": {description: OK}}
  /api/sessions/state:
    post:
      summary: Manual state override (operator only — bypasses idle-detection)
      operationId: sessionStateOverride
      tags: [Sessions]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [id, state], properties: {id: {type: string}, state: {type: string, enum: [running, waiting_input, complete, killed, rate_limited]}}}}}}
      responses: {"200": {description: OK}, "400": {description: Bad state}, "404": {description: Not found}}

  # Agents
  /api/agents:
    get:
      summary: List ephemeral agent workers (F10 sprint 3+)
      operationId: agentsList
      tags: [Agents]
      responses: {"200": {description: OK}}
    post:
      summary: Spawn a new agent worker
      operationId: agentSpawn
      tags: [Agents]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"200": {description: Spawned}, "400": {description: Bad Request}}
  /api/agents/audit:
    get:
      summary: Tail of the agent-audit log (BL107) — every spawn, terminate, bootstrap event
      operationId: agentsAudit
      tags: [Agents]
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer}}
        - {name: agent_id, in: query, required: false, schema: {type: string}}
      responses: {"200": {description: OK}}

  # Channel
  /api/channel/diagnostics:
    get:
      summary: MCP channel bridge diagnostics — bridge kind/path, per-session port and liveness (BL362)
      operationId: channelDiagnostics
      tags: [Channel]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDiagnostics"
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/channel/reply:
    post:
      summary: Inbound MCP-bridge reply from Claude (used by channel.js)
      operationId: channelReply
      tags: [Channel]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [session_id, text], properties: {session_id: {type: string}, text: {type: string}}}}}}
      responses: {"200": {description: OK}}

  # Devices
  /api/devices:
    get:
      summary: List registered devices (F17 mobile registry)
      operationId: devicesList
      tags: [Devices]
      responses: {"200": {description: OK}}
  /api/devices/register:
    post:
      summary: Register a new device for push notifications
      operationId: deviceRegister
      tags: [Devices]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"200": {description: Registered}, "400": {description: Bad Request}}
  /api/device-aliases:
    get:
      summary: "List device aliases for `new: @<alias>:` routing (BL31)"
      operationId: deviceAliasList
      tags: [Devices]
      responses: {"200": {description: OK}}
    post:
      summary: Upsert a device alias
      operationId: deviceAliasUpsert
      tags: [Devices]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [alias, target], properties: {alias: {type: string}, target: {type: string}}}}}}
      responses: {"200": {description: OK}}
    delete:
      summary: Delete a device alias
      operationId: deviceAliasDelete
      tags: [Devices]
      parameters:
        - {name: alias, in: query, required: true, schema: {type: string}}
      responses: {"200": {description: OK}, "404": {description: Not found}}

  # Discussion subscriptions (BL358)
  /api/discussion-subs:
    get:
      summary: List discussion subscriptions
      operationId: discussionSubsList
      tags: [Sessions]
      parameters:
        - name: discussion_id
          in: query
          required: false
          description: Optional filter by discussion ID
          schema: {type: string}
      responses: {"200": {description: OK}, "401": {$ref: "#/components/responses/Unauthorized"}}
    post:
      summary: Subscribe a session to a discussion
      operationId: discussionSubsCreate
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [discussion_id, session_name]
              properties:
                discussion_id: {type: string}
                session_name: {type: string}
      responses: {"200": {description: Subscribed}, "400": {description: Bad Request}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /api/discussion-subs/{discussion_id}/{session_name}:
    parameters:
      - {name: discussion_id, in: path, required: true, schema: {type: string}}
      - {name: session_name, in: path, required: true, schema: {type: string}}
    delete:
      summary: Unsubscribe a session from a discussion
      operationId: discussionSubsDelete
      tags: [Sessions]
      responses: {"200": {description: Unsubscribed}, "404": {description: Not found}, "401": {$ref: "#/components/responses/Unauthorized"}}

  # Exit hooks (BL356)
  /api/exit-hooks:
    get:
      summary: List all exit hooks
      operationId: exitHooksList
      tags: [Sessions]
      responses:
        "200":
          description: Array of exit hook entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExitHookEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create an exit hook
      operationId: exitHooksCreate
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, action]
              properties:
                name: {type: string, description: "Session name to monitor"}
                action: {type: string, enum: [restart, notify]}
                notify_session: {type: string}
                notify_message: {type: string}
                cooldown_seconds: {type: integer}
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExitHookEntry"
        "400": {description: Bad Request}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/exit-hooks/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    put:
      summary: Update an exit hook
      operationId: exitHooksUpdate
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                action: {type: string, enum: [restart, notify]}
                notify_session: {type: string}
                notify_message: {type: string}
                cooldown_seconds: {type: integer}
      responses: {"200": {description: Updated}, "400": {description: Bad Request}, "404": {description: Not found}, "401": {$ref: "#/components/responses/Unauthorized"}}
    delete:
      summary: Delete an exit hook
      operationId: exitHooksDelete
      tags: [Sessions]
      responses: {"200": {description: Deleted}, "404": {description: Not found}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /api/exit-hooks/{id}/disable:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      summary: Disable an exit hook
      operationId: exitHooksDisable
      tags: [Sessions]
      responses: {"200": {description: Disabled}, "404": {description: Not found}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /api/exit-hooks/{id}/enable:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      summary: Enable an exit hook
      operationId: exitHooksEnable
      tags: [Sessions]
      responses: {"200": {description: Enabled}, "404": {description: Not found}, "401": {$ref: "#/components/responses/Unauthorized"}}

  # Routing rules (BL20)
  /api/routing-rules:
    get:
      summary: List backend auto-selection routing rules
      operationId: routingRulesList
      tags: [Routing]
      responses: {"200": {description: OK}}
    put:
      summary: Replace the routing rules set
      operationId: routingRulesSet
      tags: [Routing]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"200": {description: OK}, "400": {description: Bad Request}}
  /api/routing-rules/test:
    post:
      summary: Test which backend a given task string would route to
      operationId: routingRulesTest
      tags: [Routing]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [task], properties: {task: {type: string}, project_dir: {type: string}}}}}}
      responses: {"200": {description: OK}}

  # Federation (F19)
  /api/federation/sessions:
    get:
      summary: Aggregated session list across all federated peers
      operationId: federationSessions
      tags: [Federation]
      responses: {"200": {description: OK}}

  # Splash (BL69)
  /api/splash/info:
    get:
      summary: Render context for splash (logo, tagline, version)
      operationId: splashInfo
      tags: [Splash]
      responses: {"200": {description: OK}}
  /api/splash/logo:
    get:
      summary: Splash logo image
      operationId: splashLogo
      tags: [Splash]
      responses: {"200": {description: OK, content: {image/svg+xml: {}, image/png: {}}}}

  # Operator-facing singletons
  /api/ask:
    post:
      summary: Single-shot LLM ask — no session, no tmux (BL34)
      operationId: ask
      tags: [Singletons]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: {type: string}
                backend: {type: string}
                model: {type: string}
      responses: {"200": {description: OK}, "503": {description: Backend not configured}}
  /api/assist:
    post:
      summary: Quick-response assistant (BL42) — uses the configured assistant backend
      operationId: assist
      tags: [Singletons]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [text], properties: {text: {type: string}}}}}}
      responses: {"200": {description: OK}, "503": {description: Assistant backend not configured}}
  /api/audit:
    get:
      summary: Query the operator-action audit log (BL9)
      operationId: auditQuery
      tags: [Singletons]
      parameters:
        - {name: actor, in: query, required: false, schema: {type: string}}
        - {name: action, in: query, required: false, schema: {type: string}}
        - {name: session_id, in: query, required: false, schema: {type: string}}
        - {name: since, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: until, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: limit, in: query, required: false, schema: {type: integer}}
      responses: {"200": {description: OK}}
  /api/cooldown:
    get:
      summary: Current global rate-limit cooldown state (BL30)
      operationId: cooldownGet
      tags: [Singletons]
      responses: {"200": {description: OK}}
    put:
      summary: Set or clear the global cooldown
      operationId: cooldownSet
      tags: [Singletons]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"200": {description: OK}}
  /api/diagnose:
    get:
      summary: Diagnostic snapshot — backend reachability, config validity, recent errors (BL37)
      operationId: diagnose
      tags: [Singletons]
      responses: {"200": {description: OK}}
  /api/analytics:
    get:
      summary: Aggregate analytics — session counts, backend distribution, cost summary (BL12)
      operationId: analytics
      tags: [Singletons]
      responses: {"200": {description: OK}}
  /api/reload:
    post:
      summary: Hot config reload (BL17) — equivalent to SIGHUP
      operationId: reload
      tags: [Singletons]
      responses: {"200": {description: Reloaded}, "400": {description: Config invalid}}
  /api/project/summary:
    get:
      summary: Project overview — git status + sessions + stats (BL35)
      operationId: projectSummary
      tags: [Singletons]
      parameters:
        - {name: dir, in: query, required: true, schema: {type: string}}
      responses: {"200": {description: OK}, "400": {description: Missing dir}}

  # Work Queue (BL357)
  /api/queue:
    get:
      summary: List work queue items
      operationId: queueList
      tags: [Queue]
      parameters:
        - {name: role, in: query, required: false, schema: {type: string}}
        - {name: state, in: query, required: false, schema: {type: string, enum: [pending, claimed, complete, failed]}}
      responses:
        "200":
          description: Array of queue items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueueItem"
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/queue/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    delete:
      summary: Delete a queue item
      operationId: queueDelete
      tags: [Queue]
      responses: {"200": {description: Deleted}, "404": {description: Not found}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /api/queue/claim:
    post:
      summary: Claim a queue item for processing
      operationId: queueClaim
      tags: [Queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, claimed_by]
              properties:
                role: {type: string}
                claimed_by: {type: string}
                lease_seconds: {type: integer}
      responses:
        "200":
          description: Claimed item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueItem"
        "404": {description: No pending item for this role}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/queue/complete:
    post:
      summary: Mark a queue item as complete
      operationId: queueComplete
      tags: [Queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: {type: string}
                result: {type: object}
      responses: {"200": {description: Completed}, "404": {description: Not found}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /api/queue/fail:
    post:
      summary: Mark a queue item as failed
      operationId: queueFail
      tags: [Queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, error]
              properties:
                id: {type: string}
                error: {type: string}
      responses: {"200": {description: Marked failed}, "404": {description: Not found}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /api/queue/push:
    post:
      summary: Push a new item onto the work queue
      operationId: queuePush
      tags: [Queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: {type: string}
                payload: {type: object}
      responses:
        "200":
          description: Item enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueItem"
        "400": {description: Bad Request}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/projects:
    get:
      summary: List project aliases (BL27)
      operationId: projectsList
      tags: [Singletons]
      responses: {"200": {description: OK}}
    post:
      summary: Upsert a project alias
      operationId: projectsUpsert
      tags: [Singletons]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"200": {description: OK}}
  /api/templates:
    get:
      summary: List session-start templates (BL5)
      operationId: templatesList
      tags: [Singletons]
      responses: {"200": {description: OK}}
    post:
      summary: Upsert a template
      operationId: templatesUpsert
      tags: [Singletons]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"200": {description: OK}}
    delete:
      summary: Delete a template
      operationId: templatesDelete
      tags: [Singletons]
      parameters:
        - {name: name, in: query, required: true, schema: {type: string}}
      responses: {"200": {description: OK}}
  /api/servers/health:
    get:
      summary: Health of every configured remote datawatch server (proxy pool)
      operationId: serversHealth
      tags: [Singletons]
      responses: {"200": {description: OK}}
  /api/stats:
    get:
      summary: Legacy v1 stats (host + cpu + mem + disk). Pass ?v=2 for the structured StatsResponse v2 (Observer)
      operationId: stats
      tags: [Singletons]
      parameters:
        - {name: v, in: query, required: false, schema: {type: string}, description: "Pass 2 for the structured v2 payload"}
      responses: {"200": {description: OK}}
  /api/ollama/stats:
    get:
      summary: Ollama-specific stats — running models, queue depth
      operationId: ollamaStats
      tags: [Singletons]
      responses: {"200": {description: OK}, "503": {description: Ollama not configured}}

components:
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
    QueryToken:
      type: apiKey
      in: query
      name: token
    NoAuth:
      type: http
      scheme: basic
      description: No authentication (when token is not configured)

  responses:
    Unauthorized:
      description: Authentication required
      content:
        text/plain:
          schema:
            type: string
            example: "unauthorized"

  schemas:
    TaskProgress:
      type: object
      description: |
        Live progress snapshot parsed from a pi session's own JSONL log —
        carried by autonomous tasks while they are in progress (status
        in_progress or verifying) and returned by GET /api/sessions/{id}/progress.
        The autonomous store forces these fields off the moment a task leaves
        the active statuses, so their presence is the signal that the worker
        is running right now; they are omitted from JSON otherwise.
      required: [last_event_at, assistant_turns]
      properties:
        last_event_at: {type: string, format: date-time, description: "Timestamp of the newest event in the log (RFC3339)"}
        assistant_turns: {type: integer, description: "Assistant-role messages so far (one per LLM reply, tool-calling ones included)"}
        tool_calls:
          type: object
          description: Per-tool-name call counts across the log so far
          additionalProperties: {type: integer}
        last_tool_name: {type: string, description: "Name of the most recent tool call (omitted when none yet)"}
        last_tool_args: {type: string, description: "Arguments of the most recent tool call as compact JSON, truncated to 500 characters"}
        last_summary: {type: string, description: "First 200 characters of the most recent thinking or text block — the agent's own last-stated intent"}
        tokens: {type: integer, description: "Cumulative tokens reported by the log's assistant messages"}
    SessionAutomatonDetail:
      type: object
      description: |
        Autonomous task detail for a session, built from stored PRD/story/task
        data. Omitted for non-autonomous sessions or when the PRD cannot be loaded.
      required: [prd_id, cost]
      properties:
        prd_id: {type: string}
        prd_title: {type: string}
        prd_status: {type: string}
        story_id: {type: string}
        story_title: {type: string}
        task_id: {type: string}
        task_title: {type: string}
        task_spec: {type: string, description: "Task spec, cut to 600 characters (ellipsis appended when cut)"}
        task_spec_truncated: {type: boolean, description: "Present and true when task_spec was cut"}
        task_status: {type: string}
        wait_reason: {type: string}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        retry_count: {type: integer}
        error: {type: string}
        verification:
          type: object
          properties:
            ok: {type: boolean}
            severity: {type: string}
            summary: {type: string}
            issues: {type: array, items: {type: string}}
            verifier_backend: {type: string}
            verifier_model: {type: string}
            verifier_source: {type: string, description: "task | story | prd | global | pool"}
        git:
          type: object
          properties:
            pre_task_sha: {type: string}
            base_sha: {type: string, description: "Git HEAD captured at the start of the task's first attempt; never overwritten by retries (pre_task_sha is per-attempt)"}
            attempt_commit_shas: {type: array, items: {type: string}, description: "Commit shas recorded for the task's finished attempts, in order"}
            files_planned: {type: array, items: {type: string}, description: "Task files, or the story's planned files when the task has none"}
            files_touched: {type: array, items: {type: string}}
            foreign_file_drift: {type: array, items: {type: string}}
        decisions:
          type: array
          description: Last 10 entries of the Automaton decision log
          items:
            type: object
            properties:
              at: {type: string, format: date-time}
              kind: {type: string}
              actor: {type: string}
              note: {type: string}
              verdict_outcome: {type: string}
        cost:
          type: object
          properties:
            tokens_in: {type: integer}
            tokens_out: {type: integer}
            est_cost_usd: {type: number}
    PluginWidgetView:
      type: object
      description: A manifest widget plus its latest stored value.
      properties:
        id: {type: string}
        surface: {type: string, enum: [dashboard, session]}
        kind: {type: string, enum: [stat_tile, table, list, sparkline, status_badge, markdown]}
        data_mode: {type: string, enum: [push, pull]}
        pull_path: {type: string}
        interval_seconds: {type: integer}
        value:
          nullable: true
          type: object
          properties:
            plugin: {type: string}
            widget_id: {type: string}
            data: {description: The widget value as pushed or pulled}
            updated_at: {type: string, format: date-time}
            source: {type: string, enum: [push, pull]}
            error: {type: string, description: Last pull error; data keeps the previous value}
    ChannelDiagnostics:
      type: object
      properties:
        bridge_kind:
          type: string
          description: '"go" or "js" — which bridge the daemon resolved'
          example: "go"
        bridge_path:
          type: string
          description: Resolved binary/script path
          example: "/usr/local/bin/datawatch-channel"
        global_port:
          type: integer
          description: server.channel_port config value (0 = auto/random)
          example: 0
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/ChannelSessionDiag"
        hints:
          type: array
          items:
            type: string
          description: Actionable remediation hints when problems are detected

    ChannelSessionDiag:
      type: object
      properties:
        session_id:
          type: string
          description: Short session hex ID
          example: "a3f2"
        session_name:
          type: string
          description: Human name if set
          example: "worker"
        channel_port:
          type: integer
          description: Port the bridge registered via POST /api/channel/ready (0 = not ready yet)
          example: 54321
        bridge_alive:
          type: boolean
          description: Result of a live GET http://127.0.0.1:PORT/health probe
          example: true
        probe_error:
          type: string
          description: Human-readable error when bridge_alive is false

    Session:
      type: object
      properties:
        id:
          type: string
          description: Short 4-character hex ID
          example: "a3f2"
        full_id:
          type: string
          description: Full hostname-prefixed ID
          example: "hal9000-a3f2"
        name:
          type: string
          description: Optional human-readable name (set at creation or via rename)
          example: "auth refactor"
        task:
          type: string
          description: Original task description
          example: "write a fibonacci function in Go"
        llm_backend:
          type: string
          description: LLM backend used for this session
          example: "claude-code"
        tmux_session:
          type: string
          description: tmux session name
          example: "cs-hal9000-a3f2"
        log_file:
          type: string
          description: Path to the session's output log
          example: "/home/user/.datawatch/logs/hal9000-a3f2.log"
        state:
          $ref: "#/components/schemas/SessionState"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        hostname:
          type: string
          example: "hal9000"
        group_id:
          type: string
          description: Signal group ID this session was created from
        pending_input:
          type: string
          description: Set when waiting for user input
        last_prompt:
          type: string
          description: The prompt text that triggered waiting_input state

    SessionState:
      type: string
      enum: [running, waiting_input, complete, failed, killed]
      description: |
        - `running`: claude-code is actively running
        - `waiting_input`: claude-code is waiting for user response
        - `complete`: claude-code exited successfully
        - `failed`: claude-code exited with error
        - `killed`: session was manually terminated

    StartSessionRequest:
      type: object
      required: [task]
      properties:
        task:
          type: string
          description: Task description passed to the LLM
          example: "refactor the auth module"
        name:
          type: string
          description: Optional human-readable name for the session
          example: "auth refactor"
        project_dir:
          type: string
          description: |
            Absolute path to the project directory. The LLM will be constrained to this tree.
            Defaults to session.default_project_dir from config.
          example: "/home/user/projects/myapp"
        backend:
          type: string
          description: |
            LLM backend to use for this session. Must match a registered backend name.
            Defaults to the active backend from config.
          example: "aider"

    CommandRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: Command string in Signal command format
          example: "new: build a REST API in Go"

    CommandResponse:
      type: object
      properties:
        result:
          type: string
          description: Human-readable result message

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        hostname:
          type: string
        version:
          type: string
        uptime_seconds:
          type: integer

    ConfigResponse:
      type: object
      description: Masked configuration. Sensitive fields (tokens, passwords, secrets) are replaced with "***".
      properties:
        telegram:
          type: object
          properties:
            enabled: { type: boolean }
            token: { type: string, example: "***" }
            chat_id: { type: string }
        discord:
          type: object
          properties:
            enabled: { type: boolean }
            token: { type: string, example: "***" }
            channel_id: { type: string }
        slack:
          type: object
          properties:
            enabled: { type: boolean }
            token: { type: string, example: "***" }
            channel_id: { type: string }
        matrix:
          type: object
          properties:
            enabled: { type: boolean }
            homeserver: { type: string }
            user_id: { type: string }
            access_token: { type: string, example: "***" }
            room_id: { type: string }
        twilio:
          type: object
          properties:
            enabled: { type: boolean }
            account_sid: { type: string }
            auth_token: { type: string, example: "***" }
            from_number: { type: string }
            to_number: { type: string }
        ntfy:
          type: object
          properties:
            enabled: { type: boolean }
            server_url: { type: string }
            topic: { type: string }
            token: { type: string, example: "***" }
        email:
          type: object
          properties:
            enabled: { type: boolean }
            host: { type: string }
            port: { type: integer }
            username: { type: string }
            from: { type: string }
            to: { type: string }
        webhook:
          type: object
          properties:
            enabled: { type: boolean }
            addr: { type: string }
        github_webhook:
          type: object
          properties:
            enabled: { type: boolean }
            addr: { type: string }
        server:
          type: object
          properties:
            enabled: { type: boolean }
            host: { type: string }
            port: { type: integer }
            tls_enabled: { type: boolean }
            token: { type: string, example: "***" }

    InfoResponse:
      type: object
      properties:
        hostname:
          type: string
        version:
          type: string
        llm_backend:
          type: string
          example: "claude-code"
        messaging_backend:
          type: string
          example: "signal"
        session_count:
          type: integer
        server:
          type: object
          properties:
            host:
              type: string
            port:
              type: integer
        capabilities:
          type: array
          description: |
            Optional API features this daemon supports. Check for an entry
            before using the feature; an older daemon omits the array or
            the entry. Strings are never renamed once shipped.
            `sessions.view_summary`, `alerts.paging`, `alerts.count`,
            `ws.alerts_read`, `ws.hello`, `ws.session_list_delta`,
            `ws.session_view_summary`, `ws.output_scoped`,
            `ws.unsubscribe`, and `api.gzip` (only while `server.api_gzip`
            is on).
          items:
            type: string
          example: ["sessions.view_summary", "alerts.paging", "alerts.count", "ws.hello", "api.gzip"]

    ScheduledCommand:
      type: object
      description: |
        One scheduled command. Either `cron` (recurring) or `run_at`
        (one-shot) is present; both are optional but at least one is
        required when creating a new entry. `command` is the body
        that will be executed when the schedule fires; `task` is
        accepted as a legacy alias for the new-session variant.
      properties:
        id:
          type: string
          description: Unique identifier for this scheduled entry
        session_id:
          type: string
          description: Session the schedule is attached to (optional — omitted for new-session schedules)
        command:
          type: string
          description: Command body to send when the schedule fires
          example: "status"
        task:
          type: string
          description: "Legacy alias for the new-session variant; prefer `command`"
          example: "run nightly tests"
        cron:
          type: string
          description: Cron expression (5-field standard format) — omit for one-shot
          example: "0 2 * * *"
        run_at:
          type: string
          format: date-time
          description: RFC3339 timestamp for one-shot schedules — omit for recurring
        session_name:
          type: string
          description: "BL353: Resolve target by session name at fire time (survives session restarts)"
        cron_expr:
          type: string
          description: "BL353: 5-field cron expression (alias for `cron`; preferred in new entries)"
          example: "*/5 * * * *"
        schedule_name:
          type: string
          description: "BL353: Human-readable label for lookup/cancel by name"
        state:
          type: string
          description: Lifecycle state
          enum: [pending, fired, cancelled, failed]
        enabled:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time

    RemoteServer:
      type: object
      properties:
        name:
          type: string
          description: Short identifier used with --server flag
          example: "nas"
        url:
          type: string
          description: Base URL of the remote datawatch instance
          example: "http://203.0.113.10:8080"
        token:
          type: string
          description: "Bearer token. Accepted on create/update requests; never returned in a response (SEC-014) — responses carry token_present/token_prefix instead, and omit this field entirely when redacted."
          example: "***"
        token_present:
          type: boolean
          description: "Response-only (SEC-014). Whether a token is set — never its value."
        token_prefix:
          type: string
          description: "Response-only (SEC-014). First 4 characters of the token, for operator identification only; cannot be used to reconstruct the token."
          example: "a1b2"
        enabled:
          type: boolean

    SavedCommand:
      type: object
      required: [name, command]
      properties:
        name:
          type: string
          description: Short name for the command
          example: "approve"
        command:
          type: string
          description: The command text to send
          example: "yes"

    FilterPattern:
      type: object
      properties:
        id:
          type: string
          description: Unique filter identifier
        pattern:
          type: string
          description: Regular expression to match against session output lines
          example: "^\\s*$"
        action:
          type: string
          description: Action to take on matching lines
          enum: [drop, highlight, alert]
          example: "drop"
        enabled:
          type: boolean
          default: true
        description:
          type: string
          description: Human-readable description of what this filter does
          example: "Drop blank lines"

    Alert:
      type: object
      properties:
        id:
          type: string
          description: Unique alert identifier
        message:
          type: string
          description: Alert message text
        level:
          type: string
          enum: [info, warning, error]
          example: "warning"
        read:
          type: boolean
          default: false
        created_at:
          type: string
          format: date-time

    ExitHookEntry:
      type: object
      description: A hook that fires when a monitored session exits or enters a failed/killed state.
      properties:
        id:
          type: string
        name:
          type: string
          description: Session name to monitor
        action:
          type: string
          enum: [restart, notify]
        notify_session:
          type: string
          description: "(notify only) session name to send the message to"
        notify_message:
          type: string
          description: "(notify only) message text"
        cooldown_seconds:
          type: integer
          description: Minimum seconds between firings (default 300)
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_fired_at:
          type: string
          format: date-time
          nullable: true

    QueueItem:
      type: object
      description: A single item in the work queue.
      properties:
        id:
          type: string
        role:
          type: string
        payload:
          type: object
          nullable: true
        state:
          type: string
          enum: [pending, claimed, complete, failed]
        claimed_by:
          type: string
          nullable: true
        lease_expiry:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true
        result:
          type: object
          nullable: true

    ResultEntry:
      type: object
      description: A named key/value entry in the result store.
      properties:
        name:
          type: string
        payload:
          type: object
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Automation:
      type: object
      description: |
        An Automation: a named graph of member Automata (PRDs) advanced by a
        single cursor, one member at a time. For now a stored record only —
        nothing on the server advances from one member to the next
        automatically.
      properties:
        id: {type: string, description: "Automation ID (8-hex)"}
        name: {type: string}
        description: {type: string}
        status: {type: string, enum: [draft, active, paused, completed, blocked, cancelled]}
        entry_member_id: {type: string, description: "Member the Automation starts at"}
        current_member_id: {type: string, description: "Member the cursor is on (while active)"}
        members:
          type: array
          items:
            $ref: "#/components/schemas/AutomationMember"
        version: {type: integer, description: "Bumped on every write; send back as expected_version on update"}
        budget_policy: {$ref: "#/components/schemas/BudgetPolicy"}
        backend: {type: string, description: "Execution backend default for member runs"}
        model: {type: string, description: "Execution model default for member runs"}
        effort: {type: string, description: "Execution effort default for member runs"}
        verification_backend: {type: string, description: "Verifier backend default for member runs"}
        verification_model: {type: string, description: "Verifier model default for member runs"}
        verification_effort: {type: string, description: "Verifier effort default for member runs"}
        project_dir: {type: string, description: "Working tree member runs operate in (informational)"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
        idle_since: {type: string, format: date-time, nullable: true, description: "Set when a member finished and no next member started yet"}
        decisions:
          type: array
          description: "Decision log entries; same shape as an Automaton's decision log"
          items: {type: object}

    AutomationMember:
      type: object
      description: "One member of an Automation: one member PRD plus one next member per outcome."
      properties:
        id: {type: string, description: "Stable member ID (8-hex, or operator-supplied)"}
        prd_id: {type: string, description: "The member Automaton (PRD) ID"}
        on_complete: {type: string, description: "Next member when this one completes; empty = the Automation completes"}
        on_blocked: {type: string, description: "Next member when this one is blocked; empty = the Automation is blocked"}
        on_failed: {type: string, description: "Next member when this one fails; empty = the Automation is blocked"}
        added_at: {type: string, format: date-time}
        added_by: {type: string, description: "Who enrolled it: operator (default) or an acting session/agent"}
        added_reason: {type: string}
        status: {type: string, enum: [pending, running, completed, blocked, failed, skipped, cancelled]}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
        outcome: {type: string, description: "Automaton status observed when this member last finished"}
        edge_taken: {type: string, description: "Edge followed at last finish: on_complete | on_blocked | on_failed | skip"}
        budget_policy: {$ref: "#/components/schemas/BudgetPolicy"}
      required: [id, prd_id, status]

    BudgetPolicy:
      type: object
      description: |
        A budget guard-rail, applied per Automation or per member: a ceiling
        (dollar total, or a percentage of the window's allowance) and how it
        is enforced — pacing governs how quickly the ceiling may be consumed
        and on_breach what happens when it is hit.
      properties:
        ceiling_type: {type: string, enum: [dollar, allocation_pct]}
        ceiling_value: {type: number, description: "Dollar limit, or percent of the window's allowance"}
        window: {type: string, enum: [automation, day, week, month], description: "Scope the ceiling is measured over"}
        pacing: {type: string, enum: [none, even], description: "How the ceiling is spent: up front, or spread evenly across the window"}
        on_breach: {type: string, enum: [pause, block], description: "What happens when the ceiling is hit"}
        backend: {type: string, description: "When set, the ceiling applies only to spend on this backend"}
      required: [ceiling_type, ceiling_value, window, on_breach]

    AutomationCreate:
      type: object
      description: Request body for POST /api/automations (create a draft Automation).
      required: [members]
      properties:
        name: {type: string}
        description: {type: string}
        entry_member_id: {type: string, description: "Entry member ID; when omitted, the first members entry is the entry"}
        members:
          type: array
          items:
            $ref: "#/components/schemas/AutomationMember"
        budget_policy: {$ref: "#/components/schemas/BudgetPolicy"}
        project_dir: {type: string}
        backend: {type: string}
        model: {type: string}
        effort: {type: string}
        verification_backend: {type: string}
        verification_model: {type: string}
        verification_effort: {type: string}
        actor: {type: string, description: "operator (default) or the acting session/agent; recorded in the audit log"}
        reason: {type: string, description: "Why this Automation is being created; recorded in the audit log"}

    AutomationUpdate:
      allOf:
        - $ref: "#/components/schemas/AutomationCreate"
        - type: object
          required: [expected_version]
          properties:
            expected_version: {type: integer, description: "The `version` you last observed; the write is rejected with 409 if it is stale"}
