openapi: 3.0.3
info:
  title: Datawatch API
  description: |
    REST and WebSocket API for the datawatch daemon.

    ## Authentication
    If a token is configured, pass it as:
    - `Authorization: Bearer <token>` header, OR
    - `?token=<token>` query parameter

    ## Network Access
    The API is designed to be accessed over Tailscale (encrypted overlay network).
    TLS is optional — Tailscale provides transport encryption.

    ## Response compression
    `/api/*` responses carry `Vary: Accept-Encoding`. With
    `server.api_gzip` on (default), a JSON / text / YAML response larger
    than `server.api_gzip_min_bytes` (default 1024) is sent with
    `Content-Encoding: gzip` when the request sends
    `Accept-Encoding: gzip`. Streams, WebSocket upgrades, file downloads
    and `/api/proxy/` paths are never compressed. Advertised as `api.gzip`
    in `/api/info` `capabilities`.
  version: 0.4.0
  license:
    name: Polyform Noncommercial 1.0.0
    url: https://github.com/dmz006/datawatch/blob/main/LICENSE
  contact:
    url: https://github.com/dmz006/datawatch

servers:
  - url: http://localhost:8080
    description: Local development
  - url: http://{tailscale_ip}:8080
    description: Tailscale access
    variables:
      tailscale_ip:
        default: "100.x.x.x"
        description: Your machine's Tailscale IP

security:
  - BearerToken: []
  - QueryToken: []
  - NoAuth: []

paths:
  /api/sessions:
    get:
      summary: List all sessions
      description: Returns all sessions managed by this host, including completed ones.
      operationId: listSessions
      tags: [Sessions]
      parameters:
        - name: name
          in: query
          required: false
          description: Glob filter by session name
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: Filter by session state
          schema:
            type: string
        - name: backend
          in: query
          required: false
          description: Filter by LLM backend
          schema:
            type: string
        - name: alive
          in: query
          required: false
          description: Filter by claude_alive status
          schema:
            type: string
            enum: ["true", "false"]
        - name: view
          in: query
          required: false
          description: |
            `summary` returns the compact list: `task`, `prompt_context`,
            `last_response` and `last_summary_long` are cut to
            `server.session_summary_text_chars` characters (ending in `…`)
            and named in each record's `truncated_fields`; only the newest
            `server.session_summary_terminal_limit` terminal sessions
            (complete / failed / killed) are kept, and
            `X-Datawatch-Sessions-Omitted` reports how many were dropped.
            Without `view`, `since` or `states` the response is the
            unchanged, uncapped full list. Advertised as
            `sessions.view_summary` in `/api/info` `capabilities`.
          schema:
            type: string
            enum: [summary]
        - name: since
          in: query
          required: false
          description: Only sessions whose `updated_at` is after this time (RFC3339 or unix seconds).
          schema:
            type: string
            example: "2026-10-14T12:00:00Z"
        - name: states
          in: query
          required: false
          description: Comma list of states to include. `active` expands to every non-terminal state.
          schema:
            type: string
            example: "active"
      responses:
        "200":
          description: Array of sessions
          headers:
            X-Datawatch-Sessions-Omitted:
              description: "`view=summary` only — number of older terminal sessions dropped by the cap. Absent when nothing was dropped."
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/Session"
                    - type: object
                      properties:
                        scheduled_count:
                          type: integer
                          description: Pending schedules for the session (when schedules are enabled).
                        truncated_fields:
                          type: array
                          items:
                            type: string
                          description: "`view=summary` only — fields that were cut. Fetch `/api/sessions/{id}` for the full record."
        "400":
          description: Unknown `view`, unparseable `since`, or unknown/empty `states`.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/output:
    get:
      summary: Get session output
      description: Returns the last N lines of a session's log output.
      operationId: getSessionOutput
      tags: [Sessions]
      parameters:
        - name: id
          in: query
          required: true
          description: Session ID (short 4-char or full hostname-id)
          schema:
            type: string
            example: "a3f2"
        - name: n
          in: query
          required: false
          description: Number of lines to return (default 50)
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Plain text output
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Session not found
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/command:
    post:
      summary: Execute a command
      description: |
        Execute any command using the same syntax as the Signal interface.

        Available commands:
        - `new: <task>` — start a new session
        - `list` — list sessions
        - `status <id>` — get recent output
        - `send <id>: <text>` — send input to waiting session
        - `kill <id>` — terminate session
        - `tail <id> [n]` — last N lines
        - `attach <id>` — get tmux attach command
        - `help` — show help
      operationId: executeCommand
      tags: [Commands]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandRequest"
            examples:
              new_session:
                summary: Start a new session
                value:
                  text: "new: write a fibonacci function in Go"
              list_sessions:
                summary: List sessions
                value:
                  text: "list"
              send_input:
                summary: Send input to waiting session
                value:
                  text: "send a3f2: yes, proceed"
      responses:
        "200":
          description: Command result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        "400":
          description: Bad request
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/link/start:
    post:
      summary: Start Signal device linking
      description: |
        Starts the signal-cli device linking process. Returns a stream ID.
        Use `/api/link/stream?id=<stream_id>` to receive the QR URI via SSE.

        The QR code should be scanned from Signal on your phone:
        Settings → Linked Devices → Link New Device
      operationId: startLinking
      tags: [Setup]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                device_name:
                  type: string
                  description: Name for this linked device
                  example: "hal9000"
      responses:
        "200":
          description: Linking started
          content:
            application/json:
              schema:
                type: object
                properties:
                  stream_id:
                    type: string
                    description: Use this with /api/link/stream
        "409":
          description: Already linked
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/link/stream:
    get:
      summary: Stream linking status via SSE
      description: |
        Server-Sent Events stream for the linking process.
        Events:
        - `qr`: QR URI string (sgnl://...) — render as QR code
        - `linked`: linking complete
        - `error`: error message
      operationId: streamLinking
      tags: [Setup]
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: Stream ID not found
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/link/status:
    get:
      summary: Check linking status
      operationId: getLinkStatus
      tags: [Setup]
      responses:
        "200":
          description: Linking status
          content:
            application/json:
              schema:
                type: object
                properties:
                  linked:
                    type: boolean
                  account_number:
                    type: string
                  device_name:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/backends:
    get:
      summary: List LLM backends
      description: Returns the list of registered LLM backends and which one is active.
      operationId: listBackends
      tags: [System]
      responses:
        "200":
          description: Backend list
          content:
            application/json:
              schema:
                type: object
                properties:
                  llm:
                    type: array
                    items:
                      type: string
                    description: Registered LLM backend names
                    example: ["claude-code", "aider"]
                  active:
                    type: string
                    description: Currently active backend name
                    example: "claude-code"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/files:
    get:
      summary: Browse directory
      description: |
        Returns the contents of a directory for use in the PWA directory picker.
        Entries are sorted: directories first, then files, both alphabetically.
      operationId: listFiles
      tags: [System]
      parameters:
        - name: path
          in: query
          required: false
          description: "Absolute path to browse (default: user home directory)"
          schema:
            type: string
            example: "/home/user/projects"
      responses:
        "200":
          description: Directory entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                    description: The resolved path that was listed
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        is_dir:
                          type: boolean
                        path:
                          type: string
                          description: Full absolute path (use for next request)
        "400":
          description: Path is not a directory or cannot be read
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Upload a file
      description: |
        Upload a file to the server's file-service root (multipart/form-data).
        The `path` field sets the destination path relative to the file-service root.
        Requires `CapConfigWrite` federation capability.
        Used by the PWA and Android app for image attachment in the session input bar.
      operationId: uploadFile
      tags: [System]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, path]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload (image, document, etc.)
                path:
                  type: string
                  description: Destination filename (relative or absolute within file-service root)
                  example: "dw_attach_1234567890_photo.jpg"
      responses:
        "200":
          description: File uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                    description: Absolute server path of the uploaded file
                  bytes:
                    type: integer
                    description: Number of bytes written
        "400":
          description: Missing file or path field, or parse error
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Path traversal outside file-service root
    delete:
      summary: Delete a file
      description: |
        Delete a file from the server filesystem.
        Requires `CapConfigWrite` federation capability.
        Body: JSON `{"path": "<absolute-path>"}`.
      operationId: deleteFile
      tags: [System]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: Absolute path of the file to delete
      responses:
        "200":
          description: File deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: string
                    description: Path of the deleted file
        "400":
          description: Missing or empty path
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Path traversal outside file-service root
        "404":
          description: File not found

  /api/sessions/start:
    post:
      summary: Start a new session
      description: |
        Start a new AI coding session with optional name, project directory, and backend override.
        This endpoint provides more control than the command-based `/api/command` endpoint.
      operationId: startSession
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSessionRequest"
            examples:
              basic:
                summary: Basic session
                value:
                  task: "refactor the auth module"
              named:
                summary: Named session with backend
                value:
                  task: "refactor the auth module"
                  name: "auth refactor"
                  project_dir: "/home/user/projects/myapp"
                  backend: "aider"
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Bad request (missing task, backend not found, etc.)
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/sessions/restart:
    post:
      summary: Restart a session in-place
      description: |
        Restart a completed, failed, or killed session using the same session ID,
        tmux session, and tracking directory. If the backend supports resume, the
        LLM conversation is resumed via the deterministic session UUID.
      operationId: restartSession
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  description: Session ID (short or full)
                  example: "a3f2"
      responses:
        "200":
          description: Session restarted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Bad request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Session not found or not in a terminal state

  /api/sessions/rename:
    post:
      summary: Rename a session
      description: Set or update the human-readable name for a session.
      operationId: renameSession
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id:
                  type: string
                  description: Session ID (short or full)
                  example: "a3f2"
                name:
                  type: string
                  description: New human-readable name
                  example: "auth refactor"
      responses:
        "200":
          description: Renamed successfully
        "404":
          description: Session not found
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/sessions/{id}/progress:
    get:
      summary: Live progress snapshot for one session
      description: |
        Parses the session's own pi JSONL log and returns how far it has
        gotten: assistant turns, per-tool call counts, the most recent action
        (tool name, arguments, and the agent's last-stated intent), and
        cumulative tokens. Same `progress` shape the autonomous prd-get
        returns per running task.
      operationId: getSessionProgress
      tags: [Sessions]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}, description: "Session ID (short or full)"}
      responses:
        "200":
          description: Progress snapshot
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      session_id: {type: string}
                      full_id: {type: string}
                      state: {type: string, description: "Session state: running, completed, failed, killed"}
                      log_path: {type: string, description: "The JSONL log the snapshot was parsed from"}
                  - $ref: "#/components/schemas/TaskProgress"
        "404":
          description: "Session not found, or the session has no log to read (non-pi backend, or log not yet flushed)"
        "405":
          description: Method not allowed (GET only)
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/config:
    get:
      summary: Get configuration
      description: |
        Returns the current daemon configuration with sensitive fields masked.
        Token, password, and secret fields are replaced with `"***"` when non-empty.
      operationId: getConfig
      tags: [System]
      responses:
        "200":
          description: Masked configuration object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      summary: Update configuration
      description: |
        Apply one or more configuration changes using dot-path keys.
        Changes are written to the config file immediately.

        Supported keys: `telegram.enabled`, `discord.enabled`, `slack.enabled`,
        `matrix.enabled`, `twilio.enabled`, `ntfy.enabled`, `email.enabled`,
        `webhook.enabled`, `github_webhook.enabled`, `server.enabled`,
        `server.host`, `server.port`, `server.token`, `server.tls_enabled`.
      operationId: updateConfig
      tags: [System]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              example:
                telegram.enabled: true
                server.port: 9090
      responses:
        "200":
          description: Changes applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
        "400":
          description: Invalid request body
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/health:
    get:
      summary: Health check
      description: Returns 200 if the daemon is running. No auth required.
      operationId: healthCheck
      tags: [System]
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/info:
    get:
      summary: System information
      operationId: getInfo
      tags: [System]
      responses:
        "200":
          description: System info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/schedule:
    get:
      summary: List scheduled commands
      description: Returns all scheduled (recurring/one-shot) commands for this host.
      operationId: listSchedule
      tags: [Schedule]
      responses:
        "200":
          description: Array of scheduled command entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledCommand"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Add a scheduled command
      description: Schedule a new recurring or one-shot command.
      operationId: addScheduledCommand
      tags: [Schedule]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledCommand"
      responses:
        "200":
          description: Scheduled command added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledCommand"
        "400":
          description: Invalid schedule expression or missing fields
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      summary: Cancel a scheduled command
      description: Remove a scheduled command by ID.
      operationId: deleteScheduledCommand
      tags: [Schedule]
      parameters:
        - name: id
          in: query
          required: true
          description: Scheduled command ID
          schema:
            type: string
      responses:
        "200":
          description: Cancelled
        "404":
          description: Not found
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/servers:
    get:
      summary: List remote servers
      description: Returns the list of configured remote datawatch server connections.
      operationId: listServers
      tags: [System]
      responses:
        "200":
          description: Array of remote server entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RemoteServer"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/commands:
    get:
      summary: List saved commands
      description: Returns all named commands in the command library.
      operationId: listCommands
      tags: [Commands]
      responses:
        "200":
          description: Array of saved commands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedCommand"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Add a saved command
      description: Save a new named command to the command library.
      operationId: addCommand
      tags: [Commands]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedCommand"
            example:
              name: "approve"
              command: "yes"
      responses:
        "200":
          description: Command saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedCommand"
        "400":
          description: Missing name or command
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      summary: Delete a saved command
      description: Remove a named command from the command library by name.
      operationId: deleteCommand
      tags: [Commands]
      parameters:
        - name: name
          in: query
          required: true
          description: Command name to delete
          schema:
            type: string
            example: "approve"
      responses:
        "200":
          description: Deleted
        "404":
          description: Not found
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/filters:
    get:
      summary: List output filters
      description: Returns all configured output filter patterns.
      operationId: listFilters
      tags: [Filters]
      responses:
        "200":
          description: Array of filter patterns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FilterPattern"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Add an output filter
      description: Add a new regex-based output filter pattern.
      operationId: addFilter
      tags: [Filters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilterPattern"
      responses:
        "200":
          description: Filter added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilterPattern"
        "400":
          description: Invalid regex or missing fields
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      summary: Enable or disable a filter
      description: Toggle a filter pattern on or off by ID.
      operationId: patchFilter
      tags: [Filters]
      parameters:
        - name: id
          in: query
          required: true
          description: Filter ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Updated
        "404":
          description: Not found
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      summary: Delete an output filter
      description: Remove a filter pattern by ID.
      operationId: deleteFilter
      tags: [Filters]
      parameters:
        - name: id
          in: query
          required: true
          description: Filter ID
          schema:
            type: string
      responses:
        "200":
          description: Deleted
        "404":
          description: Not found
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/capacity:
    get:
      summary: Capacity admission status
      description: Pools (host, node:<name>, llm:<name>) with limits and holders, active leases, and the queue of Automata tasks waiting for capacity with reasons.
      operationId: capacityStatus
      tags: [Autonomous]
      responses:
        "200":
          description: Ledger snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  pools: {type: array, items: {type: object}}
                  leases: {type: array, items: {type: object}}
                  waiting: {type: array, items: {type: object}}

  /api/autonomous/prds/{id}/set_priority:
    post:
      summary: Set a PRD's capacity-queue priority
      description: Higher priority PRDs are admitted first when compute capacity is contended. Default 0.
      operationId: autonomousPRDSetPriority
      tags: [Autonomous]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priority]
              properties:
                priority: {type: integer}
      responses:
        "200": {description: Updated PRD}

  /api/alerts:
    get:
      summary: List alerts
      description: |
        Returns system alerts (newest first) and the count of unread alerts.

        Without `limit`, `unread` or `before` the response is the full list
        with `alerts` and `unread_count` only. Supplying any of them returns
        one page and adds `total`, `has_more` and `next_before`; pass
        `next_before` back as `before` to fetch the next (older) page.
        Clients can detect support via the `alerts.paging` entry in
        `/api/info` `capabilities`.
      operationId: listAlerts
      tags: [Alerts]
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
          description: Only return alerts with this source (e.g. `system`).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Maximum alerts to return. `0` returns no alerts, only the counts.
        - name: unread
          in: query
          required: false
          schema:
            type: string
            enum: ["1", "0", "true", "false"]
          description: "`1` returns only unread alerts."
        - name: before
          in: query
          required: false
          schema:
            type: string
          description: Return only alerts older than this alert ID (the previous page's `next_before`). Unknown IDs return 400.
      responses:
        "200":
          description: Alerts list with unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Alert"
                  unread_count:
                    type: integer
                    description: Number of unread alerts
                  total:
                    type: integer
                    description: Paged form only — total stored alerts (matching `source` when set).
                  has_more:
                    type: boolean
                    description: Paged form only — more matching alerts exist past this page.
                  next_before:
                    type: string
                    description: Paged form only — ID of the last returned alert; omitted when `has_more` is false.
        "400":
          description: Invalid `limit`/`unread` value or unknown `before` alert ID
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Mark alerts as read
      description: Mark one or all alerts as read.
      operationId: markAlertsRead
      tags: [Alerts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Alert ID to mark read. Omit to mark all alerts as read.
                all:
                  type: boolean
                  description: Set true to mark all alerts as read.
      responses:
        "200":
          description: Marked as read
        "404":
          description: Alert not found
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/alerts/count:
    get:
      summary: Alert counts
      description: |
        Returns only the unread and total alert counts — a cheap badge poll.
        Advertised as `alerts.count` in `/api/info` `capabilities`.
      operationId: countAlerts
      tags: [Alerts]
      responses:
        "200":
          description: Alert counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread_count:
                    type: integer
                  total:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Federation peer lacks the alerts-list capability

  /ws:
    get:
      summary: WebSocket connection
      description: |
        Upgrade to WebSocket for real-time bidirectional communication.

        ### Server to Client messages

        | type | description |
        |------|-------------|
        | `sessions` | Full session list (sent on connect and on any change) |
        | `session_state` | One session's state changed |
        | `output` | New output lines from a session |
        | `needs_input` | Session is waiting for user input |
        | `notification` | General text notification |
        | `alert` | New system alert pushed to Web UI clients |
        | `alerts_read` | Alerts were marked read: `{"ids": ["..."], "unread_count": N}` or `{"all": true, "unread_count": 0}` |
        | `hello_ack` | Reply to `hello`: `{"session_list": "full"\|"delta", "session_view": "full"\|"summary", "output": "all"\|"subscribed", "capabilities": [...]}` — the modes now in effect |
        | `session_removed` | `session_list=delta` clients only: `{"session_id": "..."}` — a session left the list |

        ### Client to Server messages

        | type | description |
        |------|-------------|
        | `command` | `{"text": "new: my task"}` — any command string |
        | `new_session` | `{"task": "...", "name": "...", "project_dir": "...", "backend": "..."}` |
        | `send_input` | `{"session_id": "a3f2", "text": "yes"}` |
        | `subscribe` | `{"session_id": "a3f2"}` — stream output for session (full or short ID) |
        | `unsubscribe` | `{"session_id": "a3f2"}` — stop output for the session and stop the screen capture `subscribe` started |
        | `hello` | `{"session_list": "delta", "session_view": "summary", "output": "subscribed"}` — negotiate a lighter stream; every key optional, unknown keys/values ignored |
        | `ping` | keepalive |

        ### Lighter streams (`hello`)

        - `session_list: delta` — no `sessions` frames; one `session_state`
          per new or changed session and one `session_removed` per removed
          session. Fetch the starting list with
          `GET /api/sessions?view=summary` after `hello_ack`.
        - `session_view: summary` — `session_state` carries the compact
          `view=summary` record (with `truncated_fields`).
        - `output: subscribed` — `output`, `raw_output`, `pane_capture`
          and `chat_message` frames only for subscribed sessions.

        Clients that never send `hello` get `server.ws_session_list_default`
        and `server.ws_output_scope_default` (`full` / `all` by default).

        All messages are JSON-wrapped in `{"type":"...", "data":{...}, "ts":"..."}`.
      operationId: connectWebSocket
      tags: [WebSocket]
      responses:
        "101":
          description: Switching Protocols

  # ─── Autonomous PRD decomposition (BL24+BL25, v3.10.0) ─────────
  /api/autonomous/status:
    get:
      summary: Loop status snapshot
      operationId: autonomousStatus
      tags: [Autonomous]
      responses: {"200": {description: OK}}
  /api/autonomous/config:
    get:
      summary: Read autonomous config
      operationId: autonomousConfigGet
      tags: [Autonomous]
      responses: {"200": {description: OK}}
    put:
      summary: Replace autonomous config
      operationId: autonomousConfigSet
      tags: [Autonomous]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses: {"200": {description: OK}, "400": {description: Bad Request}}
  /api/autonomous/prds:
    get:
      summary: List PRDs (newest first)
      operationId: autonomousPRDList
      tags: [Autonomous]
      responses: {"200": {description: OK}}
    post:
      summary: Create a draft PRD
      operationId: autonomousPRDCreate
      tags: [Autonomous]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec]
              properties:
                spec: {type: string}
                project_dir: {type: string}
                backend: {type: string}
                effort: {type: string}
      responses: {"200": {description: OK}}
  /api/autonomous/prds/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      summary: Fetch one PRD with story+task tree
      description: |
        `detail` picks the response level: `full` (default) is the whole PRD;
        `tasks` is per-task rows (id, title, status, error, verification,
        session id) without specs or story text; `summary` is ids, titles,
        statuses and counts.
        Tasks that are actively running (status in_progress or verifying)
        additionally carry `progress` — the live snapshot shown in
        TaskProgress — and `looping_warning`, set when the worker appears to
        re-issue the same tool call on consecutive polls. `progress` is
        stripped the instant a task leaves the active statuses, so its
        absence means the task's worker is not running right now.
      operationId: autonomousPRDGet
      tags: [Autonomous]
      parameters:
        - {name: detail, in: query, required: false, schema: {type: string, enum: [full, tasks, summary], default: full}}
      responses: {"200": {description: OK}, "404": {description: Not found}, "400": {description: "Bad detail value (expected full, tasks or summary)"}}
    delete:
      summary: Cancel + archive a PRD
      description: |
        Bare DELETE cancels the PRD; `?hard=true` permanently deletes it
        (plus spawned child PRDs). Either way the PRD's worker sessions are
        killed (best-effort) and the response names them so an operator can
        verify no unrelated session was stopped.
      operationId: autonomousPRDCancel
      tags: [Autonomous]
      parameters:
        - {name: hard, in: query, required: false, schema: {type: boolean}, description: "true = permanent delete instead of cancel"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  status: {type: string, enum: [cancelled, deleted]}
                  killed_sessions: {type: integer, description: "Number of session slots recorded on the PRD's tasks (may include empty slots)"}
                  killed_session_ids: {type: array, items: {type: string}, description: "Session IDs a kill was attempted on; always an array, [] when none"}
                  kill_errors: {type: object, additionalProperties: {type: string}, description: "Present only when a kill failed; session ID -> error"}
                  memory_strategy: {type: string, description: "Hard delete only: keep | purge | archive"}
  /api/autonomous/prds/{id}/decompose:
    post:
      summary: Run LLM decomposition for a PRD
      operationId: autonomousPRDDecompose
      tags: [Autonomous]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: OK}}
  /api/autonomous/prds/{id}/run:
    post:
      summary: Kick the executor for a PRD
      operationId: autonomousPRDRun
      tags: [Autonomous]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: OK}}
  /api/autonomous/prds/{id}/set_llm:
    post:
      summary: Set a PRD's worker-LLM override fields
      description: Sets the PRD-level worker LLM override. Fields the caller omits are left unchanged; an empty string ("") clears that field (falls back to global). Applied settings are audit-logged and appended to the PRD's decision log.
      operationId: autonomousPRDSetLLM
      tags: [Autonomous]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                backend: {type: string, description: "Omitted = unchanged; empty string = cleared"}
                effort: {type: string, description: "Omitted = unchanged; empty string = cleared"}
                model: {type: string, description: "Omitted = unchanged; empty string = cleared"}
                decomposition_profile: {type: string, description: "Omitted = unchanged; empty string = cleared"}
                guardrail_backend: {type: string, description: "Optional; omitted = unchanged; empty string = cleared"}
                guardrail_model: {type: string, description: "Optional; omitted = unchanged; empty string = cleared"}
      responses:
        "200": {description: Updated PRD}
  /api/autonomous/learnings:
    get:
      summary: List extracted post-task learnings
      operationId: autonomousLearnings
      tags: [Autonomous]
      responses: {"200": {description: OK}}

