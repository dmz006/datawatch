      responses: {"200": {description: OK}}

  # Federation (F19)
  /api/federation/sessions:
    get:
      summary: Aggregated session list across all federated peers
      operationId: federationSessions
      tags: [Federation]
      responses: {"200": {description: OK}}
  /api/federation/fingerprints:
    get:
      summary: This daemon's resource fingerprints for the calling peer — the operator's own labels and keyed hashes only, never the identity values behind them
      operationId: federationFingerprints
      tags: [Federation]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  fingerprints:
                    type: array
                    items:
                      type: object
                      required: [kind, name, hash]
                      properties:
                        kind: {type: string}
                        name: {type: string}
                        hash: {type: string}
        "400": {description: No peer identity for this token — /fingerprints is for federation peer tokens, not the admin token}
        "403": {description: Fingerprint exchange is not enabled for this peer}

  /api/federation/fingerprint-matches:
    get:
      summary: Fingerprint match records surfaced during reconciliation, for operator decision — each proposes that this daemon and a peer hold the same resource; identities travel as 8-char hash prefixes, never full values
      operationId: federationFingerprintMatches
      tags: [Federation]
      parameters:
        - name: state
          in: query
          required: false
          description: Optional filter — pending, confirmed or rejected
          schema: {type: string, enum: [pending, confirmed, rejected]}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: array
                    items:
                      type: object
                      required: [id, peer, kind, local_name, peer_name, state]
                      properties:
                        id: {type: string}
                        peer: {type: string}
                        kind: {type: string}
                        local_name: {type: string}
                        peer_name: {type: string}
                        hash_prefix: {type: string}
                        state: {type: string, enum: [pending, confirmed, rejected]}
                        first_seen: {type: string}
                        updated_at: {type: string}
        "403": {description: The caller lacks the federation:list capability}
        "503": {description: Fingerprint match store not configured on this daemon}
  /api/federation/fingerprint-matches/{id}/confirm:
    post:
      summary: Confirm one fingerprint match record (operator decision) — once confirmed, matching budget pools may be treated as the same resource
      operationId: federationFingerprintMatchConfirm
      tags: [Federation]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: The updated match record}
        "403": {description: The caller lacks the federation:write capability}
        "404": {description: No such match record}
        "503": {description: Fingerprint match store not configured on this daemon}
  /api/federation/fingerprint-matches/{id}/reject:
    post:
      summary: Reject one fingerprint match record (operator decision) — rejecting a previously confirmed match takes its resource pools back apart
      operationId: federationFingerprintMatchReject
      tags: [Federation]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: The updated match record}
        "403": {description: The caller lacks the federation:write capability}
        "404": {description: No such match record}
        "503": {description: Fingerprint match store not configured on this daemon}

  # Splash (BL69)
  /api/splash/info:
    get:
      summary: Render context for splash (logo, tagline, version)
      operationId: splashInfo
      tags: [Splash]
      responses: {"200": {description: OK}}
  /api/splash/logo:
    get:
      summary: Splash logo image
      operationId: splashLogo
      tags: [Splash]
      responses: {"200": {description: OK, content: {image/svg+xml: {}, image/png: {}}}}

  # Operator-facing singletons
  /api/ask:
    post:
      summary: Single-shot LLM ask — no session, no tmux
      operationId: ask
      tags: [Singletons]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: {type: string}
                backend: {type: string}
                model: {type: string}
      responses: {"200": {description: OK}, "503": {description: Backend not configured}}
  /api/assist:
    post:
      summary: Quick-response assistant — uses the configured assistant backend
      operationId: assist
      tags: [Singletons]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [text], properties: {text: {type: string}}}}}}
      responses: {"200": {description: OK}, "503": {description: Assistant backend not configured}}
  /api/audit:
    get:
      summary: Query the operator-action audit log
      operationId: auditQuery
      tags: [Singletons]
      parameters:
        - {name: actor, in: query, required: false, schema: {type: string}}
        - {name: action, in: query, required: false, description: "Exact match, or a prefix match when it ends in '*' (autonomous_budget_*, autonomous_*)", schema: {type: string}}
        - {name: subject, in: query, required: false, description: Exact match on the entry subject (task id, backend or LLM name), schema: {type: string}}
        - {name: session_id, in: query, required: false, schema: {type: string}}
        - {name: since, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: until, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: limit, in: query, required: false, schema: {type: integer}}
      responses: {"200": {description: OK}, "400": {description: since or until is not RFC 3339}}
  /api/cooldown:
    get:
      summary: Current global rate-limit cooldown state
      operationId: cooldownGet
      tags: [Singletons]
      responses: {"200": {description: OK}}
    put:
      summary: Set or clear the global cooldown
      operationId: cooldownSet
      tags: [Singletons]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"200": {description: OK}}
  /api/usage-backoff:
    get:
      summary: Active per-backend usage back-off flags, effective config, pattern staleness (patterns_version, patterns_stale) and claude_cli_version
      operationId: usageBackoffGet
      tags: [Singletons]
      responses: {"200": {description: OK}}
    post:
      summary: Set a back-off flag for a backend (minutes or until, optional reason)
      operationId: usageBackoffSet
      tags: [Singletons]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backend]
              properties:
                backend: {type: string}
                minutes: {type: integer, minimum: 1}
                until: {type: string, format: date-time}
                reason: {type: string}
      responses: {"200": {description: OK}, "400": {description: Invalid request}}
    delete:
      summary: Clear one backend's back-off flag, or all flags when no backend is given
      operationId: usageBackoffClear
      tags: [Singletons]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                backend: {type: string}
      responses: {"200": {description: OK}}
  /api/usage-backoff/recheck:
    post:
      summary: Record the current rate-limit patterns and claude_cli_version as rechecked (clears patterns_stale)
      operationId: usageBackoffRecheck
      tags: [Singletons]
      responses: {"200": {description: OK}}
  /api/usage/readings:
    get:
      summary: The account's shared usage record — the keeper's live series, or the peer's copy of the keeper (its last known copy when the keeper is unreachable, marked stale / copied_at)
      operationId: usageReadingsGet
      tags: [Singletons]
      responses: {"200": {description: OK}, "503": {description: No series locally or from the peer, or the series is not available}}
    post:
      summary: Append one reading to the shared record. source must be typed; pasted and account are planned and return 501. On a peer the write is forwarded to the keeper, which refuses the write when it is unreachable
      operationId: usageReadingAdd
      tags: [Singletons]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [percent]
              properties:
                at: {type: string, format: date-time, description: Defaults to now; more than 5 minutes in the future is rejected}
                percent: {type: number, minimum: 0, maximum: 1000}
                source: {type: string, enum: [typed], description: empty means typed; pasted and account return 501}
      responses:
        "200": {description: Appended; the stored record is returned}
        "400": {description: Invalid reading, or an unknown source}
        "403": {description: Missing the usage write capability}
        "501": {description: source is planned but not built yet (pasted, account)}
        "503": {description: The keeper could not be reached (peer); nothing was stored}
    delete:
      summary: Remove one reading by id (operator form)
      operationId: usageReadingDelete
      tags: [Singletons]
      parameters:
        - {name: id, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: Removed}
        "400": {description: No id query parameter}
        "404": {description: No such reading}
  /api/usage/readings/{id}:
    delete:
      summary: Remove one reading by id (peer wire form)
      operationId: usageReadingDeleteById
      tags: [Singletons]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Removed}
        "404": {description: No such reading}
  /api/usage/remaining-work:
    put:
      summary: Set the typed remaining-work figure (daemon-local; 0 replaces the queued-tasks estimate)
      operationId: usageRemainingWorkSet
      tags: [Singletons]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points]
              properties:
                points: {type: number, minimum: 0}
      responses:
        "200": {description: Stored}
        "400": {description: Invalid figure}
        "503": {description: The calculator is not wired on this daemon}
    delete:
      summary: Clear the typed remaining-work figure (the finish-early estimate falls back to queued-task costing)
      operationId: usageRemainingWorkClear
      tags: [Singletons]
      responses: {"200": {description: Cleared}, "503": {description: The calculator is not wired on this daemon}}
  /api/usage/extra-credit:
    put:
      summary: Set the extra credit points (0 clears) on the shared record
      operationId: usageExtraCreditSet
      tags: [Singletons]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points]
              properties:
                points: {type: number}
      responses:
        "200": {description: Stored}
        "400": {description: Invalid figure}
        "503": {description: The keeper could not be reached, or the series is not available}
  /api/usage/advice:
    get:
      summary: Usage calculator advice — one set of numbers, three renderings; variant and policy are independent per-call overrides, lanes and cost are the finish-early ones
      operationId: usageAdvice
      tags: [Singletons]
      parameters:
        - {name: variant, in: query, required: false, schema: {type: string, enum: [pace-gauge, lane-planner, burn-ledger, all]}}
        - {name: policy, in: query, required: false, schema: {type: string, enum: [use-all, pace, finish-early]}}
        - {name: lanes, in: query, required: false, schema: {type: integer, minimum: 0}}
        - name: cost
          in: query
          required: false
          schema: {type: number, minimum: 0}
          description: Per-task cost override (points/week) for the finish-early estimate
      responses:
        "200": {description: The advice (numbers plus the selected rendering); carries X-Usage-Stale / X-Usage-Copied-At when the series is stale}
        "400": {description: Unknown variant or policy, or a malformed lanes / cost value}
        "503": {description: The calculator is not wired on this daemon}
  /api/budget:
    get:
      summary: Dollar budget state of every LLM that has a budget, or one LLM with ?llm=
      operationId: budgetGet
      tags: [Singletons]
      parameters:
        - {name: llm, in: query, required: false, schema: {type: string}}
      responses: {"200": {description: OK}, "404": {description: The LLM has no budget}}
  /api/budget/usage:
    get:
      summary: This daemon's own spend for an LLM, never including peer spend; from and to default to this daemon's window
      operationId: budgetUsageGet
      tags: [Singletons]
      parameters:
        - {name: llm, in: query, required: true, schema: {type: string}}
        - {name: from, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: false, schema: {type: string, format: date-time}}
      responses: {"200": {description: OK}, "400": {description: Invalid request}, "404": {description: No budget window to default to}}
  /api/diagnose:
    get:
      summary: Diagnostic snapshot — backend reachability, config validity, recent errors (BL37)
      description: |
        In addition to the snapshot, the response carries one informational
        `listener_<name>` check per daemon listener: listener_rest,
        listener_rest_tls, listener_mcp_sse, listener_proxy_sandbox,
        listener_webhook, listener_github_webhook, listener_twilio_webhook.
        Each is posture reporting, not a failure: `ok` is always `true` and
        the overall `ok` flag is unaffected by listener auth posture (an
        exposed, unauthenticated listener still reports every other check
        normally).
        Each check's detail string has the form
        `address=… enabled=… auth_required=… loopback=… acknowledged=… exposed=…`.
        `exposed` is true exactly when the listener is enabled, bound to a
        non-loopback address, and not token-protected. `acknowledged`
        reflects `server.acknowledge_unauthenticated` (default false).
      operationId: diagnose
      tags: [Singletons]
      responses: {"200": {description: OK}}
  /api/analytics:
    get:
      summary: Aggregate analytics — session counts, backend distribution, cost summary
      operationId: analytics
      tags: [Singletons]
      responses: {"200": {description: OK}}
  /api/reload:
    post:
      summary: Hot config reload — equivalent to SIGHUP
      operationId: reload
      tags: [Singletons]
      responses: {"200": {description: Reloaded}, "400": {description: Config invalid}}
  /api/project/summary:
    get:
      summary: Project overview — git status + sessions + stats
      operationId: projectSummary
      tags: [Singletons]
      parameters:
        - {name: dir, in: query, required: true, schema: {type: string}}
      responses: {"200": {description: OK}, "400": {description: Missing dir}}

  # Work Queue (BL357)
  /api/queue:
