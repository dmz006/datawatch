      responses:
        "200":
          description: Array of queue items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueueItem"
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/queue/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    delete:
      summary: Delete a queue item
      operationId: queueDelete
      tags: [Queue]
      responses: {"200": {description: Deleted}, "404": {description: Not found}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /api/queue/claim:
    post:
      summary: Claim a queue item for processing
      operationId: queueClaim
      tags: [Queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, claimed_by]
              properties:
                role: {type: string}
                claimed_by: {type: string}
                lease_seconds: {type: integer}
      responses:
        "200":
          description: Claimed item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueItem"
        "404": {description: No pending item for this role}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/queue/complete:
    post:
      summary: Mark a queue item as complete
      operationId: queueComplete
      tags: [Queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: {type: string}
                result: {type: object}
      responses: {"200": {description: Completed}, "404": {description: Not found}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /api/queue/fail:
    post:
      summary: Mark a queue item as failed
      operationId: queueFail
      tags: [Queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, error]
              properties:
                id: {type: string}
                error: {type: string}
      responses: {"200": {description: Marked failed}, "404": {description: Not found}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /api/queue/push:
    post:
      summary: Push a new item onto the work queue
      operationId: queuePush
      tags: [Queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: {type: string}
                payload: {type: object}
      responses:
        "200":
          description: Item enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueItem"
        "400": {description: Bad Request}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/projects:
    get:
      summary: List project aliases
      operationId: projectsList
      tags: [Singletons]
      responses: {"200": {description: OK}}
    post:
      summary: Upsert a project alias
      operationId: projectsUpsert
      tags: [Singletons]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"200": {description: OK}}
  /api/templates:
    get:
      summary: List session-start templates
      operationId: templatesList
      tags: [Singletons]
      responses: {"200": {description: OK}}
    post:
      summary: Upsert a template
      operationId: templatesUpsert
      tags: [Singletons]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"200": {description: OK}}
    delete:
      summary: Delete a template
      operationId: templatesDelete
      tags: [Singletons]
      parameters:
        - {name: name, in: query, required: true, schema: {type: string}}
      responses: {"200": {description: OK}}
  /api/servers/health:
    get:
      summary: Health of every configured remote datawatch server (proxy pool)
      operationId: serversHealth
      tags: [Singletons]
      responses: {"200": {description: OK}}
  /api/stats:
    get:
      summary: Legacy v1 stats (host + cpu + mem + disk). Pass ?v=2 for the structured StatsResponse v2 (Observer)
      operationId: stats
      tags: [Singletons]
      parameters:
        - {name: v, in: query, required: false, schema: {type: string}, description: "Pass 2 for the structured v2 payload"}
      responses: {"200": {description: OK}}
  /api/ollama/stats:
    get:
      summary: Ollama-specific stats — running models, queue depth
      operationId: ollamaStats
      tags: [Singletons]
      responses: {"200": {description: OK}, "503": {description: Ollama not configured}}

  /api/questions:
    post:
      summary: Raise an operator question
      description: |
        Records an operator decision and returns it. Raise never blocks the
        asker, and the question is kept until it is answered or withdrawn —
        there is no deadline. An omitted asker and asker kind default to the
        caller and `operator`; an omitted context is not defaulted, the body
        must name one of `none`, `prd`, `task`, `proposal` or `registry_row`
        (the matching link, `prd_id` / `task_id` / `proposal_path` /
        `registry_row_key` present, `none` carrying none of them). One of the
        options or `hold` must be named as the default, so no choice is ever
        silent. Body cap 64 KiB; content after the JSON object is malformed.
        Needs the autonomous write capability when called by a federated
        peer.
      operationId: questionRaise
      tags: [Questions]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QuestionRaise"}
      responses:
        "201": {description: "The stored question record"}
        "400": {description: "Malformed body, or a validation rule failed (every offending field named); nothing is stored", content: {"text/plain": {schema: {type: string}}}}
        "403": {description: "Federated peer lacks the autonomous write capability", content: {"text/plain": {schema: {type: string}}}}
        "405": {description: "Method not allowed", content: {"text/plain": {schema: {type: string}}}}
        "413": {description: "Body over the 64 KiB cap", content: {"text/plain": {schema: {type: string}}}}
        "500": {description: "The store could not append or replay the question", content: {"text/plain": {schema: {type: string}}}}
        "503": {description: "The autonomous.questions.enabled switch is off (named in the message), or the question store is not wired", content: {"text/plain": {schema: {type: string}}}}
    get:
      summary: List operator questions
      description: |
        Matches questions, newest first, with `count` (the returned length) and
        a `questions` array (empty array, never null, when nothing matches).
        `text` is a case-insensitive substring over the question text, the
        option labels and tradeoffs, and the answer quotes; `asker` is an
        exact match on `asked_by`. `limit` is a positive integer, default 100,
        capped at 1000. Needs the autonomous read capability when called by a
        federated peer.
      operationId: questionList
      tags: [Questions]
      parameters:
        - {name: state, in: query, required: false, schema: {type: string, enum: [open, answered, withdrawn, expired, all]}}
        - {name: context, in: query, required: false, schema: {type: string, enum: [none, prd, task, proposal, registry_row, all]}}
        - {name: asker, in: query, required: false, schema: {type: string}, description: "Exact match on asked_by"}
        - {name: text, in: query, required: false, schema: {type: string}, description: "Case-insensitive substring over question text, option labels and tradeoffs, and answer quotes"}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, default: 100, maximum: 1000}}
      responses:
        "200": {description: "count and questions, newest first"}
        "400": {description: "An unknown state or context (named in the error), or a limit that is not a positive integer (\"limit must be a positive integer\")", content: {"text/plain": {schema: {type: string}}}}
        "403": {description: "Federated peer lacks the autonomous read capability", content: {"text/plain": {schema: {type: string}}}}
        "405": {description: "Method not allowed", content: {"text/plain": {schema: {type: string}}}}
        "503": {description: "The autonomous.questions.enabled switch is off, or the question store is not wired", content: {"text/plain": {schema: {type: string}}}}

  /api/questions/{id}:
    get:
      summary: Read one operator question with answer metadata
      description: |
        The question record (state, priority, return_path, options and the
        asker's recommendation included on the record itself) plus a caller's
        full return path in the same read: `answer_count` (every answer ever
        recorded, superseded ones included — they are decided and never
        deleted), `current_answer_id` (the answer in force, empty when
        there is none) and `answer` — null while the question has no
        answer, otherwise the standing answer's summary (id, chosen
        option, the verbatim quote exactly as stored, actor, surface,
        created_at). An asker that cannot subscribe polls this one read
        for the whole return path. The full answer log, with text, is the
        answers read.
      operationId: questionGet
      tags: [Questions]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "question (state, priority, return_path included on the record), answer_count, current_answer_id, and the standing answer's summary, or null while it has no answer"}
        "404": {description: Unknown question id, content: {"text/plain": {schema: {type: string}}}}
        "405": {description: Method not allowed, content: {"text/plain": {schema: {type: string}}}}
        "503": {description: "The autonomous.questions.enabled switch is off, or the question store is not wired", content: {"text/plain": {schema: {type: string}}}}

  /api/questions/{id}/answer:
    post:
      summary: Record an answer to an operator question
      description: |
        Records the operator's decision: a chosen option, the operator's own
        words as `quote` (or both), and who answered. At least one of
        `chosen_option_id` and a non-blank `quote` is required. The quote is
        stored exactly as received — no trimming, normalising or re-encoding —
        with its SHA-256 recorded alongside. `surface` is the surface the
        answer arrived on: `pwa`, `android`, `ios`, `cli`, `rest`, `mcp` or
        `comm:<channel name>`; empty defaults to `rest`.

        An answer is immutable: a changed mind is a new answer that supersedes
        the old one via `supersedes` (which must name the current answer of an
        answered question; a supersedes on an open question is a 409 — there
        is no current answer to replace).

        An answer whose text looks like a secret is refused 422, is never
        stored, and the response never echoes any part of the submitted text
        — `error` is the fixed phrase `matched: secret pattern` (not the
        name of the specific rule that matched) and `suggestion` lists the
        two safe routes (the datawatch secrets store via ${secret:name},
        or the filesystem); the matched rule's name is recorded in the
        `question_answer_refused` audit entry, not in this body. Well-formed
        ${secret:name} references pass the scan.

        Body cap 64 KiB plus the 16 KiB quote cap. Needs the autonomous write
        capability when called by a federated peer.
      operationId: questionAnswer
      tags: [Questions]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QuestionAnswer"}
      responses:
        "201": {description: "The stored answer record (quote hash included) and the question's new state"}
        "400": {description: "Malformed body; an unknown surface; neither an option nor a non-blank quote; an option id the question does not have; a quote that is not valid UTF-8", content: {"application/json": {schema: {$ref: "#/components/schemas/QuestionError"}}}}
        "403": {description: "Federated peer lacks the autonomous write capability", content: {"text/plain": {schema: {type: string}}}}
        "404": {description: Unknown question id, content: {"application/json": {schema: {$ref: "#/components/schemas/QuestionError"}}}}
        "409": {description: "Answering a withdrawn or expired question; a supersedes on an open question (no current answer to replace); a supersedes that is absent or wrong on an answered question", content: {"application/json": {schema: {$ref: "#/components/schemas/QuestionError"}}}}
        "413": {description: "Body over the cap, or a quote over 16 KiB", content: {"application/json": {schema: {$ref: "#/components/schemas/QuestionError"}}}}
        "422": {description: "The answer looks like a secret — the fixed phrase and the safe routes, no echo of the submitted text; no rule name in the body", content: {"application/json": {schema: {$ref: "#/components/schemas/QuestionSecretRefusal"}}}}
        "500": {description: "The store could not append or replay the answer", content: {"application/json": {schema: {$ref: "#/components/schemas/QuestionError"}}}}
        "503": {description: "The autonomous.questions.enabled switch is off, or the question store is not wired", content: {"text/plain": {schema: {type: string}}}}

  /api/questions/{id}/withdraw:
    post:
      summary: Withdraw an open operator question
      description: |
        Withdrawing an open question closes it without an answer; a question
        that has already moved on (answered, or withdrawn before) is refused.
        `reason` is free text; `actor` defaults to the caller.
        Needs the autonomous write capability when called by a federated peer.
      operationId: questionWithdraw
      tags: [Questions]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QuestionWithdraw"}
      responses:
        "200": {description: "The question in its new state"}
        "400": {description: Malformed body, content: {"application/json": {schema: {$ref: "#/components/schemas/QuestionError"}}}}
        "403": {description: "Federated peer lacks the autonomous write capability", content: {"text/plain": {schema: {type: string}}}}
        "404": {description: Unknown question id, content: {"application/json": {schema: {$ref: "#/components/schemas/QuestionError"}}}}
        "409": {description: "The question is not open", content: {"application/json": {schema: {$ref: "#/components/schemas/QuestionError"}}}}
        "413": {description: "Body over the 64 KiB cap", content: {"application/json": {schema: {$ref: "#/components/schemas/QuestionError"}}}}
        "500": {description: "The store could not append or replay the withdrawal", content: {"application/json": {schema: {$ref: "#/components/schemas/QuestionError"}}}}
        "503": {description: "The autonomous.questions.enabled switch is off, or the question store is not wired", content: {"text/plain": {schema: {type: string}}}}

  /api/questions/{id}/answers:
    get:
      summary: Read an operator question's answer log
      description: |
        The full answer log, oldest first, each answer carrying its derived
        superseded state (`superseded`, `superseded_by`), plus
        `current_answer_id` (the answer in force, empty when there is none).
        The superseded flags are derived on read from the log; the answer
        lines themselves never change.
      operationId: questionAnswers
      tags: [Questions]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "answers (oldest first, each with derived superseded state) and current_answer_id"}
        "404": {description: Unknown question id, content: {"application/json": {schema: {$ref: "#/components/schemas/QuestionError"}}}}
        "405": {description: Method not allowed, content: {"text/plain": {schema: {type: string}}}}
        "503": {description: "The autonomous.questions.enabled switch is off, or the question store is not wired", content: {"text/plain": {schema: {type: string}}}}

components:
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
    QueryToken:
      type: apiKey
      in: query
      name: token
    NoAuth:
      type: http
      scheme: basic
      description: No authentication (when token is not configured)

  responses:
    Unauthorized:
      description: Authentication required
      content:
        text/plain:
          schema:
            type: string
            example: "unauthorized"

  schemas:
    LaneFillStatus:
      type: object
      description: The lane fill status, as GET /api/autonomous/lane-fill returns it.
      properties:
        mode: {type: string, enum: [off, shadow, on], description: "shadow records decisions and starts nothing"}
        last_poll_at: {type: string, format: date-time}
        lanes:
          type: array
          items: {$ref: "#/components/schemas/LaneFillLane"}
        queued_eligible:
          type: object
          description: Queued Automata that could start on each lane type
          properties:
            gpu: {type: integer}
            claude: {type: integer}
        evidence:
          type: object
          properties:
            checked_at: {type: string, format: date-time}
            gpu_active_sessions: {type: integer}
            loaded_models:
              type: array
              items:
                type: object
                properties:
                  host: {type: string}
                  model: {type: string}
            error: {type: string, description: "Why the last poll could not read the pool; empty when it could"}
        decisions:
          type: array
          description: Planner decisions, newest first
          items: {$ref: "#/components/schemas/LaneFillDecision"}
        alerts:
          type: array
          items: {$ref: "#/components/schemas/LaneFillAlert"}
    LaneFillLane:
      type: object
      properties:
        id: {type: string}
        type: {type: string, enum: [gpu, claude]}
        state: {type: string, enum: [occupied, idle]}
        occupant:
          nullable: true
          description: The Automaton the lane is running; null when the lane is idle
          type: object
          properties:
            prd_id: {type: string}
            title: {type: string}
            backend: {type: string}
        blocker: {type: string, description: Why an idle lane is not being filled}
        eligible_waiting: {type: integer, description: Queued Automata this lane could take}
    LaneFillDecision:
      type: object
      properties:
        at: {type: string, format: date-time}
        mode: {type: string, enum: [off, shadow, on]}
        lane_id: {type: string}
        lane_type: {type: string, enum: [gpu, claude]}
        action:
          type: string
          enum: [start_prd, report_merge, decompose, decompose_ahead, blocked, idle]
        prd_id: {type: string}
        title: {type: string}
        reason: {type: string}
        blocker: {type: string}
        executed: {type: boolean, description: "False in shadow mode, where the decision is recorded and nothing starts"}
        error: {type: string}
        repeat_count: {type: integer, description: How many polls chose the same action again}
        last_seen_at: {type: string, format: date-time}
    LaneFillAlert:
      type: object
      description: An idle lane that sat with eligible work queued past the idle alert threshold
      properties:
        at: {type: string, format: date-time}
        lane_id: {type: string}
        work: {type: string, description: Title of the work waiting for the lane}
    TriageList:
      type: object
      description: |-
        The triage record list, as GET /api/autonomous/triage returns it. `records`
        is newest first; `alert_minutes` is the triage alert threshold currently in
        force (the autonomous.automation.triage_alert_minutes setting; 0 = off).
      required: [records, alert_minutes]
      properties:
        records:
          type: array
          description: Triage records, newest first; empty when nothing matches
          items: {$ref: "#/components/schemas/TriageRecord"}
        alert_minutes: {type: integer, description: The triage alert threshold in force in minutes; 0 = off}
    TriageRecord:
      type: object
      description: |-
        One triage record for an Automaton that ended failed or blocked, filled and
        refreshed by the triage pass on every coordinator tick and cleared again when
        the Automaton leaves that state.
      required: [prd_id, status]
      properties:
        prd_id: {type: string, description: The Automaton}
        prd_title: {type: string}
        automation_id: {type: string, description: The Automation it is a member of; empty for standalone Automata}
        automation_name: {type: string}
        member_id: {type: string, description: The Automation member slot the Automaton holds}
        status:
          type: string
          enum: [failed, blocked]
          description: The state the record covers; cleared when the Automaton leaves it
        task_id: {type: string, description: The task that failed; empty for blocked Automata without one}
        task_title: {type: string}
        blocked_reason:
          type: string
          description: The blocked reason recorded on the Automaton; empty for failed ones without one
        error:
          type: string
          description: The failed task's error, truncated to 2000 chars by the pass
        session_end_reason:
          type: string
          description: The worker session's end reason, truncated to 2000 chars by the pass
        first_seen_at:
          type: string
          format: date-time
          description: When the Automaton first ended in this failed or blocked state (its own status timestamp)
        updated_at:
          type: string
          format: date-time
          description: When the triage pass last refreshed the record
        alerted_at:
          nullable: true
          description: When the triage alert for this episode fired; null until it does
          type: string
          format: date-time
        retry_budget:
          type: object
          description: |-
            The engine's existing retry budget, reused as-is and shown for all four
            categories. Informational: the pass neither spends nor resets any of it.
          properties:
            infra: {$ref: "#/components/schemas/TriageRetryCategory"}
            content: {$ref: "#/components/schemas/TriageRetryCategory"}
            scope: {$ref: "#/components/schemas/TriageRetryCategory"}
            policy: {$ref: "#/components/schemas/TriageRetryCategory"}
            ceiling_total: {type: integer, description: The overall retry ceiling, if one is set}
            ceiling_left: {type: integer, description: What remains of the overall ceiling}
        notes:
          type: array
          description: Appended over the life of the record, oldest first
          items: {$ref: "#/components/schemas/TriageNote"}
    TriageRetryCategory:
      type: object
      description: One retry-budget category
      required: [limit, used, left]
      properties:
        limit: {type: integer, description: The maximum}
        used: {type: integer, description: What has been consumed}
        left: {type: integer, description: What remains}
    TriageNote:
      type: object
      description: One appended note on a triage record
      required: [at, source, text]
      properties:
        at: {type: string, format: date-time}
        source: {type: string, description: Who appended the note, e.g. triage}
        text: {type: string}
    NodeUsage:
      type: object
      description: |
        The node_usage object carried on a node:<name> pool in the GET /api/capacity
        response, when the daemon reports per-node usage. It shows the state of the
        node's model probe, the models loaded in memory (with their memory footprint
        and eviction time), and the GPU figures. A node of type ollama with an
        address has models_supported true.
      properties:
        state:
          type: string
          enum: [ok, unreachable, pending, no_data]
          description: |
            ok = the model server answered (or the node kind has no model probe);
            unreachable = the model server probe failed (timeout, connection error,
            non-200 response, or a response body that could not be read);
            pending = no cached figure yet and a refresh has been started;
            no_data = the node has no address and no observer data.
        checked_at:
          type: string
          format: date-time
          description: When the probe last ran.
        error:
          type: string
          description: Short reason for a failed probe; omitted when empty.
        models_supported:
          type: boolean
          description: True only for nodes of ollama kind that have an address.
        models:
          type: array
          description: Models currently loaded in memory. Always an array (empty when none).
          items:
            type: object
            properties:
              name: {type: string, description: The model name}
              size_bytes: {type: integer, description: Total memory the loaded model uses}
              size_vram_bytes: {type: integer, description: The part of that footprint in GPU memory}
              expires_at:
                type: string
                format: date-time
                description: When an eviction is scheduled; omitted when no_expiry.
              no_expiry:
                type: boolean
                description: True when the model stays loaded indefinitely (no eviction scheduled).
        gpu:
          type: array
          description: GPU figures from the node observer, filled whenever available - even when the model server is unreachable. Always an array (empty when none).
          items:
            type: object
            properties:
              name: {type: string}
              util_pct: {type: number, description: GPU utilization in percent}
              mem_used_bytes: {type: integer, description: GPU memory in use}
              mem_total_bytes: {type: integer, description: Total GPU memory}
    PendingEventsPage:
      type: object
      required: [events, next_cursor, dropped]
      properties:
        events:
          type: array
          description: Lifecycle events after the requested cursor, oldest first; never null
          items: {type: object, additionalProperties: true}
        next_cursor:
          type: integer
          description: Cursor to pass as `since` on the next call
        dropped:
          type: boolean
          description: True when unseen events were evicted from the bounded queue
    VerifierPolicyOverrideRequest:
      type: object
      description: |
        Presence-aware verifier policy override. Omitting a field leaves it
        unchanged; an empty `mode` or an empty `backends` list clears it.
      properties:
        mode:
          type: string
          description: "fixed | prefer-free | balance | gpu-only | claude-only. Empty string = clear (inherit). Any other value is rejected with 400."
        backends:
          type: array
          items: {type: string}
          description: "Ordered list of eligible verifier backends (LLM registry names). Empty list = clear (inherit). An empty entry or an unknown LLM name is rejected with 400."
        actor: {type: string, description: "Who made the change (default `operator`)"}
    PlanReviewVerdict:
      type: object
      description: |
        Recorded verdict of the pre-approval plan reviewer (see
        `autonomous.plan_review_mode`). Only the latest verdict is stored —
        re-running the review or re-decomposing replaces it. A verdict with
        `reviewer_failed: true` is the placeholder for a reviewer outage or
        an unparseable response: it is displayed, but must never be treated
        as an approval blocker.
      properties:
        ok: {type: boolean, description: "Reviewer's overall judgment (false for a reviewer_failed placeholder)"}
        severity: {type: string, enum: [low, medium, high], description: "Worst finding's severity; 'high' blocks approval in block mode"}
        summary: {type: string, description: "One or two operator-actionable sentences"}
        findings: {type: array, items: {$ref: "#/components/schemas/PlanReviewFinding"}, description: "Empty for an ok:true verdict"}
        backend: {type: string, description: "Reviewer LLM backend actually used"}
        model: {type: string}
        mode: {type: string, enum: [warn, block], description: "plan_review_mode in effect when this verdict was produced"}
        at: {type: string, format: date-time}
        prompt_chars: {type: integer, description: "Size of the bounded plan projection that was judged"}
        response_chars: {type: integer}
        tokens_in: {type: integer, description: "Reviewer spend; 0 when the backend does not report it"}
        tokens_out: {type: integer}
        est_cost_usd: {type: number}
        reviewer_failed: {type: boolean, description: "Reviewer outage / unparseable verdict; never blocks approval"}
    PlanReviewFinding:
      type: object
      description: One concrete problem the reviewer located in the plan
      properties:
        task_id: {type: string, description: "Task the finding is about; empty when story- or plan-scoped"}
        task_title: {type: string}
        category: {type: string, enum: [missing, weakened, too_large, wrong_dependency, fragile_verification, out_of_scope]}
        detail: {type: string, description: "One specific, actionable sentence"}
    AutonomousPRD:
      type: object
      description: |
        Autonomous PRD shape relevant to plan review; the full
        story/task tree is returned by `GET /api/autonomous/prds/{id}`
        and by the plan-review endpoint above.
      properties:
        id: {type: string}
        spec: {type: string}
        status: {type: string}
        notify_events: {type: array, items: {type: string}, description: "Lifecycle event kinds that notify for this Automaton; absent or empty means inherit from the guardrail profile, then the global default"}
        notify_events_effective:
          type: object
          description: "Computed read-time view (never persisted): the effective kinds and the tier supplying them"
          properties:
            events: {type: array, items: {type: string}}
            source: {type: string, enum: [automaton, profile, global]}
        plan_review: {$ref: "#/components/schemas/PlanReviewVerdict", description: "Present once a review has run (warn/block modes)"}
        story:
          type: array
          items:
            type: object
            properties:
              title: {type: string}
              tasks: {type: array, items: {$ref: "#/components/schemas/AutonomousTask"}}
    AutonomousTask:
      type: object
      description: One task in the PRD's plan (subset of stored fields)
      properties:
        id: {type: string}
        title: {type: string}
        spec: {type: string}
        depends_on: {type: array, items: {type: string}}
        kind: {type: string, enum: ['', decompose, smoke, final_gate], description: "Empty = ordinary task. 'smoke' marks the task that IS the plan's own smoke verification (judged by the verifier LLM from autonomous.smoke_verification_backend/models); 'final_gate' the terminal verification task that runs the plan's verification script"}
        verification_script: {type: string}
        status: {type: string}
        compute_node: {type: string, description: "Compute node the task's worker was started on; a daemon restart adopts the surviving worker onto it. Absent for a hosted backend or before the worker starts"}
        executor_source: {type: string, description: "task | story | prd | automation | global"}
    TaskProgress:
      type: object
      description: |
        Live progress snapshot parsed from a pi session's own JSONL log —
        carried by autonomous tasks while they are in progress (status
        in_progress or verifying) and returned by GET /api/sessions/{id}/progress.
        The autonomous store forces these fields off the moment a task leaves
        the active statuses, so their presence is the signal that the worker
        is running right now; they are omitted from JSON otherwise. It is
        task data: the PWA shows it on the running task's card, and
        GET /api/sessions/{id}/progress answers 404 for a non-pi session —
        a stale pi log from another session is never read (9.31.3).
      required: [last_event_at, assistant_turns]
      properties:
        last_event_at: {type: string, format: date-time, description: "Timestamp of the newest event in the log (RFC3339)"}
        assistant_turns: {type: integer, description: "Assistant-role messages so far (one per LLM reply, tool-calling ones included)"}
        tool_calls:
          type: object
          description: Per-tool-name call counts across the log so far
          additionalProperties: {type: integer}
        last_tool_name: {type: string, description: "Name of the most recent tool call (omitted when none yet)"}
        last_tool_args: {type: string, description: "Arguments of the most recent tool call as compact JSON, truncated to 500 characters"}
        last_summary: {type: string, description: "First 200 characters of the most recent thinking or text block — the agent's own last-stated intent"}
        tokens: {type: integer, description: "Cumulative tokens reported by the log's assistant messages"}
    SessionAutomatonDetail:
      type: object
      description: |
        Autonomous task detail for a session, built from stored PRD/story/task
        data. Omitted for non-autonomous sessions or when the PRD cannot be loaded.
      required: [prd_id, cost]
      properties:
        prd_id: {type: string}
        prd_title: {type: string}
        prd_status: {type: string}
        story_id: {type: string}
        story_title: {type: string}
        task_id: {type: string}
        task_title: {type: string}
        task_spec: {type: string, description: "Task spec, cut to 600 characters (ellipsis appended when cut)"}
        task_spec_truncated: {type: boolean, description: "Present and true when task_spec was cut"}
        task_status: {type: string}
        executor_source: {type: string, description: "task | story | prd | automation | global"}
        wait_reason: {type: string}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        retry_count: {type: integer}
        error: {type: string}
        verification:
          type: object
          properties:
            ok: {type: boolean}
            severity: {type: string}
            summary: {type: string}
            issues: {type: array, items: {type: string}}
            verifier_backend: {type: string}
            verifier_model: {type: string}
            verifier_source: {type: string, description: "task | story | prd | automation | global | pool"}
        git:
          type: object
          properties:
            pre_task_sha: {type: string}
            base_sha: {type: string, description: "Git HEAD captured at the start of the task's first attempt; never overwritten by retries (pre_task_sha is per-attempt)"}
            attempt_commit_shas: {type: array, items: {type: string}, description: "Commit shas recorded for the task's finished attempts, in order"}
            files_planned: {type: array, items: {type: string}, description: "Task files, or the story's planned files when the task has none"}
            files_touched: {type: array, items: {type: string}}
            foreign_file_drift: {type: array, items: {type: string}}
        decisions:
          type: array
          description: Last 10 entries of the Automaton decision log
          items:
            type: object
            properties:
              at: {type: string, format: date-time}
              kind: {type: string}
              actor: {type: string}
              note: {type: string}
              verdict_outcome: {type: string}
        cost:
          type: object
          properties:
            tokens_in: {type: integer}
            tokens_out: {type: integer}
            est_cost_usd: {type: number}
    PluginWidgetView:
      type: object
      description: A manifest widget plus its latest stored value.
      properties:
        id: {type: string}
        surface: {type: string, enum: [dashboard, session]}
        kind: {type: string, enum: [stat_tile, table, list, sparkline, status_badge, markdown]}
        data_mode: {type: string, enum: [push, pull]}
        pull_path: {type: string}
        interval_seconds: {type: integer}
        value:
          nullable: true
          type: object
          properties:
            plugin: {type: string}
            widget_id: {type: string}
            data: {description: The widget value as pushed or pulled}
            updated_at: {type: string, format: date-time}
            source: {type: string, enum: [push, pull]}
            error: {type: string, description: Last pull error; data keeps the previous value}
    ChannelDiagnostics:
      type: object
      properties:
        bridge_kind:
          type: string
          description: '"go" or "js" — which bridge the daemon resolved'
          example: "go"
        bridge_path:
          type: string
          description: Resolved binary/script path
          example: "/usr/local/bin/datawatch-channel"
        global_port:
          type: integer
          description: server.channel_port config value (0 = auto/random)
          example: 0
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/ChannelSessionDiag"
        hints:
          type: array
          items:
            type: string
          description: Actionable remediation hints when problems are detected

    ChannelSessionDiag:
      type: object
      properties:
        session_id:
          type: string
          description: Short session hex ID
          example: "a3f2"
        session_name:
          type: string
          description: Human name if set
          example: "worker"
        channel_port:
          type: integer
          description: Port the bridge registered via POST /api/channel/ready (0 = not ready yet)
          example: 54321
        bridge_alive:
          type: boolean
          description: Result of a live GET http://127.0.0.1:PORT/health probe
          example: true
        probe_error:
          type: string
          description: Human-readable error when bridge_alive is false

    Session:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
          description: Tag IDs the session carries itself
        inherited_tags:
          type: array
          items:
            type: string
          description: Tag IDs inherited from the owning Automaton; computed on read, read-only, empty outside an Automaton
        id:
          type: string
          description: Short 4-character hex ID
          example: "a3f2"
        full_id:
          type: string
          description: Full hostname-prefixed ID
          example: "hal9000-a3f2"
        name:
          type: string
        priority:
          type: integer
          default: 0
          description: Capacity-queue priority; higher is admitted first when capacity is contended
          description: Optional human-readable name (set at creation or via rename)
          example: "auth refactor"
        task:
          type: string
          description: Original task description
          example: "write a fibonacci function in Go"
        llm_backend:
          type: string
          description: LLM backend used for this session
          example: "claude-code"
        tmux_session:
          type: string
          description: tmux session name
          example: "cs-hal9000-a3f2"
        log_file:
          type: string
          description: Path to the session's output log
          example: ".datawatch/logs/hal9000-a3f2.log"
        state:
          $ref: "#/components/schemas/SessionState"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        hostname:
          type: string
          example: "hal9000"
        group_id:
          type: string
          description: Signal group ID this session was created from
        pending_input:
          type: string
          description: Set when waiting for user input
        last_prompt:
          type: string
          description: The prompt text that triggered waiting_input state

    SessionState:
      type: string
      enum: [running, waiting_input, complete, failed, killed]
      description: |
        - `running`: claude-code is actively running
        - `waiting_input`: claude-code is waiting for user response
        - `complete`: claude-code exited successfully
        - `failed`: claude-code exited with error
        - `killed`: session was manually terminated

    LLMEntry:
      type: object
      description: An LLM registry entry. Only the fields documented here are covered; the registry holds more (kind, models, compute nodes, budget).
      properties:
        name: {type: string}
        kind: {type: string}
        enabled: {type: boolean}
        plan_tier: {type: string}
        max_inflight: {type: integer, nullable: true}
        roles:
          type: array
          items: {type: string}
          description: Workloads this entry serves. Open set of strings, stored trimmed, lower-cased and de-duplicated.
        role_warnings:
          type: array
          items: {type: string}
          description: Contention warnings that name this entry. Set on the single-entry GET only.

    LLMWriteBody:
      type: object
      description: Body of an LLM create or update. Only the fields documented here are covered; the other entry fields are accepted as on the entry.
      properties:
        name: {type: string}
        kind: {type: string}
        roles:
          type: array
          items: {type: string}
          description: Workload roles this entry serves. On update, omit to keep the stored roles; an empty list clears them. An empty role string is rejected.

    LLMRoleTable:
      type: object
      properties:
        roles:
          type: array
          items:
            type: object
            properties:
              role: {type: string}
              entry: {type: string, description: Name of the registry entry the role resolves to}
        warnings:
          type: array
          items: {type: string}

    StartSessionRequest:
      type: object
      required: [task]
      properties:
        tags:
          type: array
          items:
            type: string
          description: Tag IDs the session carries from the start; an unknown ID refuses the start
          example: ["5e6f7a8b"]
        task:
          type: string
          description: Task description passed to the LLM
          example: "refactor the auth module"
        name:
          type: string
          description: Optional human-readable name for the session
          example: "auth refactor"
        project_dir:
          type: string
          description: |
            Absolute path to the project directory. The LLM will be constrained to this tree.
            Defaults to session.default_project_dir from config.
          example: "projects/myapp"
        backend:
          type: string
          description: |
            LLM backend to use for this session. Must match a registered backend name.
            Defaults to the active backend from config.
          example: "aider"
        git:
          type: boolean
          default: false
          description: Opt in to git init, snapshot and automatic commit.
          example: true
        priority:
          type: integer
          default: 0
          description: Capacity-queue priority; higher is admitted first when capacity is contended. A non-integer value is a 400.

    CommandRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: Command string in Signal command format
          example: "new: build a REST API in Go"

    CommandResponse:
      type: object
      properties:
        result:
          type: string
          description: Human-readable result message

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        hostname:
          type: string
        version:
          type: string
        uptime_seconds:
          type: integer
        listeners:
          type: array
          description: One entry per daemon listener with its authentication posture. Computed live from the active config. Posture only — bind addresses and token/secret values are never included because this endpoint is reachable without auth.
          items:
            type: object
            properties:
              name:
                type: string
                example: "rest"
              enabled:
                type: boolean
              auth_required:
                type: boolean
              loopback:
                type: boolean
              acknowledged:
                type: boolean

    ConfigResponse:
      type: object
      description: Masked configuration. Sensitive fields (tokens, passwords, secrets) are replaced with "***".
      properties:
        telegram:
          type: object
          properties:
            enabled: { type: boolean }
            token: { type: string, example: "***" }
            chat_id: { type: string }
        discord:
          type: object
          properties:
            enabled: { type: boolean }
            token: { type: string, example: "***" }
            channel_id: { type: string }
        slack:
          type: object
          properties:
            enabled: { type: boolean }
            token: { type: string, example: "***" }
            channel_id: { type: string }
        matrix:
          type: object
          properties:
            enabled: { type: boolean }
            homeserver: { type: string }
            user_id: { type: string }
            access_token: { type: string, example: "***" }
            room_id: { type: string }
        twilio:
          type: object
          properties:
            enabled: { type: boolean }
            account_sid: { type: string }
            auth_token: { type: string, example: "***" }
            from_number: { type: string }
            to_number: { type: string }
        ntfy:
          type: object
          properties:
            enabled: { type: boolean }
            server_url: { type: string }
            topic: { type: string }
            token: { type: string, example: "***" }
        email:
          type: object
          properties:
            enabled: { type: boolean }
            host: { type: string }
            port: { type: integer }
            username: { type: string }
            from: { type: string }
            to: { type: string }
        webhook:
          type: object
          properties:
            enabled: { type: boolean }
            addr: { type: string }
        github_webhook:
          type: object
          properties:
            enabled: { type: boolean }
            addr: { type: string }
        server:
          type: object
          description: Web server section. `acknowledge_unauthenticated` (default false) silences the startup warning for enabled, token-unprotected, non-loopback listeners and sets their `acknowledged` flag in the /api/health `listeners` array and the listener_* diagnose checks; see "Unauthenticated listener startup warning" in the operations doc.
          properties:
            enabled: { type: boolean }
            host: { type: string }
            port: { type: integer }
            tls_enabled: { type: boolean }
            token: { type: string, example: "***" }
            acknowledge_unauthenticated: { type: boolean, description: "Operator ack for enabled, non-loopback, token-unprotected listeners. Default false. Silences the startup warning and sets the `acknowledged` flag in /api/health `listeners` and the listener_* diagnose detail; never changes bind address or tokens." }

    InfoResponse:
      type: object
      properties:
        hostname:
          type: string
        version:
          type: string
        llm_backend:
          type: string
          example: "claude-code"
        messaging_backend:
          type: string
          example: "signal"
        session_count:
          type: integer
        server:
          type: object
          properties:
            host:
              type: string
            port:
              type: integer
        capabilities:
          type: array
          description: |
            Optional API features this daemon supports. Check for an entry
            before using the feature; an older daemon omits the array or
            the entry. Strings are never renamed once shipped.
            `sessions.view_summary`, `alerts.paging`, `alerts.count`,
            `ws.alerts_read`, `ws.hello`, `ws.session_list_delta`,
            `ws.session_view_summary`, `ws.output_scoped`,
            `ws.unsubscribe`, and `api.gzip` (only while `server.api_gzip`
            is on).
          items:
            type: string
          example: ["sessions.view_summary", "alerts.paging", "alerts.count", "ws.hello", "api.gzip"]

    ScheduledCommand:
      type: object
      description: |
        One scheduled command. Either `cron` (recurring) or `run_at`
        (one-shot) is present; both are optional but at least one is
        required when creating a new entry. `command` is the body
        that will be executed when the schedule fires; `task` is
        accepted as a legacy alias for the new-session variant.
      properties:
        id:
          type: string
          description: Unique identifier for this scheduled entry
        session_id:
          type: string
          description: Session the schedule is attached to (optional — omitted for new-session schedules)
        command:
          type: string
          description: Command body to send when the schedule fires
          example: "status"
        task:
          type: string
          description: "Legacy alias for the new-session variant; prefer `command`"
          example: "run nightly tests"
        cron:
          type: string
          description: Cron expression (5-field standard format) — omit for one-shot
          example: "0 2 * * *"
        run_at:
          type: string
          format: date-time
          description: RFC3339 timestamp for one-shot schedules — omit for recurring
        session_name:
          type: string
          description: "BL353: Resolve target by session name at fire time (survives session restarts)"
        cron_expr:
          type: string
          description: "BL353: 5-field cron expression (alias for `cron`; preferred in new entries)"
          example: "*/5 * * * *"
        schedule_name:
          type: string
          description: "BL353: Human-readable label for lookup/cancel by name"
        state:
          type: string
          description: Lifecycle state
          enum: [pending, fired, cancelled, failed]
        enabled:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time

    ResultPayload:
      type: object
      required: [title]
      properties:
        title:
          type: string
          description: Required heading for the result
          example: "Nightly sweep"
        status:
          type: string
          description: Absent, `ok`, `warn`, or `error`
          enum: ["", ok, warn, error]
        summary:
          type: string
          description: One-paragraph human summary (strings over 2000 chars are truncated)
        metrics:
          type: object
          additionalProperties: true
          description: Free-form key/value metrics
          example:
            pass: 5
            fail: 0
        tables:
          type: array
          description: Up to 20 tables of at most 100 rows
          items:
            type: object
            properties:
              title:
                type: string
              columns:
                type: array
                items:
                  type: string
              rows:
                type: array
                items:
                  type: array
                  items:
                    type: string
        markdown:
          type: string
          description: Optional markdown report body

    ScheduleResultEntry:
      type: object
      description: "One posted result — the payload plus its provenance"
      properties:
        payload:
          $ref: "#/components/schemas/ResultPayload"
        session_id:
          type: string
          description: Session that posted the result
        schedule_name:
          type: string
          description: Schedule name the session belongs to
        posted_at:
          type: string
          format: date-time

    ScheduleResultSummary:
      type: object
      description: One grouped row of the schedule-results list
      properties:
        schedule_name:
          type: string
        latest:
          $ref: "#/components/schemas/ScheduleResultEntry"
        count:
          type: integer
          description: Number of retained entries for this schedule
        recent_statuses:
          type: array
          description: Recent `status` values, oldest → newest (capped at 50); empty when unset
          items:
            type: string

    RemoteServer:
      type: object
      properties:
        name:
          type: string
          description: Short identifier used with --server flag
          example: "nas"
        url:
          type: string
          description: Base URL of the remote datawatch instance
          example: "http://203.0.113.10:8080"
        token:
          type: string
          description: "Bearer token. Accepted on create/update requests; never returned in a response (SEC-014) — responses carry token_present/token_prefix instead, and omit this field entirely when redacted."
          example: "***"
        token_present:
          type: boolean
          description: "Response-only (SEC-014). Whether a token is set — never its value."
        token_prefix:
          type: string
          description: "Response-only (SEC-014). First 4 characters of the token, for operator identification only; cannot be used to reconstruct the token."
          example: "a1b2"
        enabled:
          type: boolean

    SavedCommand:
      type: object
      required: [name, command]
      properties:
        name:
          type: string
          description: Short name for the command
          example: "approve"
        command:
          type: string
          description: The command text to send
          example: "yes"

    FilterPattern:
      type: object
      properties:
        id:
          type: string
          description: Unique filter identifier
        pattern:
          type: string
          description: Regular expression to match against session output lines
          example: "^\\s*$"
        action:
          type: string
          description: Action to take on matching lines
          enum: [drop, highlight, alert]
          example: "drop"
        enabled:
          type: boolean
          default: true
        description:
          type: string
          description: Human-readable description of what this filter does
          example: "Drop blank lines"

    Alert:
      type: object
      properties:
        id:
          type: string
          description: Unique alert identifier
        message:
          type: string
          description: Alert message text
        level:
          type: string
          enum: [info, warning, error]
          example: "warning"
        read:
          type: boolean
          default: false
        created_at:
          type: string
          format: date-time

    ExitHookEntry:
      type: object
      description: A hook that fires when a monitored session exits or enters a failed/killed state.
      properties:
        id:
          type: string
        name:
          type: string
          description: Session name to monitor
        action:
          type: string
          enum: [restart, notify]
        notify_session:
          type: string
          description: "(notify only) session name to send the message to"
        notify_message:
          type: string
          description: "(notify only) message text"
        cooldown_seconds:
          type: integer
          description: Minimum seconds between firings (default 300)
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_fired_at:
          type: string
          format: date-time
          nullable: true

    QueueItem:
      type: object
      description: A single item in the work queue.
      properties:
        id:
          type: string
        role:
          type: string
        payload:
          type: object
          nullable: true
        state:
          type: string
          enum: [pending, claimed, complete, failed]
        claimed_by:
          type: string
          nullable: true
        lease_expiry:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true
        result:
          type: object
          nullable: true

    ResultEntry:
      type: object
      description: A named key/value entry in the result store.
      properties:
        name:
          type: string
        payload:
          type: object
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Automation:
      type: object
      description: |
        An Automation: a named graph of members advanced along outcome edges.
        A member is a PRD, a nested Automation, or a fork/join control node.
        A fork starts its branches at once and its join waits for them. Once
        activated, the Automation advances itself as members finish.
      properties:
        id: {type: string, description: "Automation ID (8-hex)"}
        name: {type: string}
        description: {type: string}
        status: {type: string, enum: [draft, active, paused, completed, blocked, cancelled]}
        entry_member_id: {type: string, description: "Member the Automation starts at"}
        current_member_id: {type: string, description: "Member the cursor is on for a linear Automation; see active_cursors for fork/join"}
        active_cursors:
          type: array
          description: "Member IDs currently in flight, sorted; one entry per live cursor"
          items: {type: string}
        members:
          type: array
          items:
            $ref: "#/components/schemas/AutomationMember"
        version: {type: integer, description: "Bumped on every write; send back as expected_version on update"}
        budget_policy: {$ref: "#/components/schemas/BudgetPolicy"}
        budget_state: {$ref: "#/components/schemas/BudgetState"}
        budget: {$ref: "#/components/schemas/BudgetView"}
        backend: {type: string, description: "Execution backend default for member runs"}
        model: {type: string, description: "Execution model default for member runs"}
        effort: {type: string, description: "Execution effort default for member runs"}
        verification_backend: {type: string, description: "Verifier backend default for member runs"}
        verification_model: {type: string, description: "Verifier model default for member runs"}
        verification_effort: {type: string, description: "Verifier effort default for member runs"}
        project_dir: {type: string, description: "Working tree member runs operate in (informational)"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
        idle_since: {type: string, format: date-time, nullable: true, description: "Set when a member finished and no next member started yet"}
        decisions:
          type: array
          description: "Decision log entries; same shape as an Automaton's decision log"
          items: {type: object}

    AutomationMember:
      type: object
      description: "One member of an Automation: a member PRD, a nested Automation, or a fork/join control node, each with an outcome edge per result. Fork/join and nested members carry the kind fields below; prd members carry prd_id."
      properties:
        id: {type: string, description: "Stable member ID (8-hex, or operator-supplied)"}
        kind: {type: string, enum: [prd, automation, fork, join], description: "Member kind; omitted means prd"}
        prd_id: {type: string, description: "The member Automaton (PRD) ID; prd members only"}
        automation_id: {type: string, description: "kind automation: the nested child Automation ID"}
        fork_members: {type: array, items: {type: string}, description: "kind fork: the branch member IDs started together (at least 2)"}
        join_members: {type: array, items: {type: string}, description: "kind join: the branch member IDs collected, equal to the paired fork's fork_members"}
        on_branch_failure: {type: string, enum: [all_must_succeed, any_one_is_enough, continue_anyway], description: "kind join only; omitted means all_must_succeed"}
        on_complete: {type: string, description: "Next member when this one completes; empty = the Automation completes"}
        on_blocked: {type: string, description: "Next member when this one is blocked; empty = the Automation is blocked"}
        on_failed: {type: string, description: "Next member when this one fails; empty = the Automation is blocked"}
        added_at: {type: string, format: date-time}
        added_by: {type: string, description: "Who enrolled it: operator (default) or an acting session/agent"}
        added_reason: {type: string}
        status: {type: string, enum: [pending, running, completed, blocked, failed, skipped, cancelled]}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
        outcome: {type: string, description: "Automaton status observed when this member last finished"}
        edge_taken: {type: string, description: "Edge followed at last finish: on_complete | on_blocked | on_failed | skip"}
        budget_policy: {$ref: "#/components/schemas/BudgetPolicy"}
        estimated_cost_usd: {type: number, description: "Declared expected cost of a prd member's Automaton; checked against the ceiling before it starts"}
      required: [id, prd_id, status]

    BudgetPolicy:
      type: object
      description: |
        A budget guard-rail, applied per Automation or per member: a ceiling
        (dollar total, or a percentage of the window's allowance) and how it
        is enforced — pacing governs how quickly the ceiling may be consumed
        and on_breach what happens when it is hit.
      properties:
        ceiling_type: {type: string, enum: [dollar, allocation_pct]}
        ceiling_value: {type: number, description: "Dollar limit, or percent of the window's allowance"}
        window: {type: string, enum: [automation, day, week, month], description: "Scope the ceiling is measured over"}
        pacing: {type: string, enum: [none, even], description: "How the ceiling is spent: up front, or spread evenly across the window"}
        on_breach: {type: string, enum: [pause, block], description: "What happens when the ceiling is hit"}
        backend: {type: string, description: "When set, the ceiling applies only to spend on this backend"}
        allocation_estimate: {type: boolean, description: "Adds an estimated share of the plan allocation to the budget view; off by default and never used to pause or block"}
        peer_window: {type: array, items: {type: string}, description: "Federation peers whose usage counts toward the ceiling. Opt-in per peer; nothing confirms automatically that a peer shares the account"}
        reset_time: {type: string, description: "24h HH:MM at which a day, week or month window starts; default midnight"}
        reset_weekday: {type: string, description: "Week windows: monday to sunday; default monday"}
        reset_day: {type: integer, description: "Month windows: 1 to 28; default 1"}
        reset_zone: {type: string, description: "IANA zone the reset fields are read in; default is the daemon's local zone"}
      required: [ceiling_type, ceiling_value, window, on_breach]

    BudgetState:
      type: object
      description: "The stored record of the current budget breach or hold on an Automation. Written by the daemon; create and update ignore anything sent."
      properties:
        action: {type: string, enum: [paused, blocked, held], description: "paused: resumes by itself at resume_at; blocked: waits for the operator; held: a member is held back by pacing or its cost estimate and starts when the budget allows"}
        breached_at: {type: string, format: date-time}
        reason: {type: string}
        scope: {type: string, description: "automation, or member:<id>"}
        spent_usd: {type: number}
        ceiling_usd: {type: number}
        window: {type: string}
        resume_at: {type: string, format: date-time, nullable: true}
        reset_known: {type: boolean}
        reset_source: {type: string, enum: [window, rate_limit, ""]}

    BudgetAllocation:
      type: object
      description: "An estimated share of the plan allocation. Always an estimate; it is never used to pause or block."
      properties:
        allocation_pct: {type: number}
        estimated: {type: boolean, description: "Always true"}
        allocation_usd: {type: number}
        plan_tier: {type: string}
        basis: {type: string, description: "How the figure was worked out"}

    BudgetPeerLine:
      type: object
      description: "One federation peer in a budget view: whether its usage is counted toward the ceiling, and why not when it is not."
      properties:
        peer: {type: string}
        spend_usd: {type: number}
        counted: {type: boolean}
        reason: {type: string, description: "Why the peer is not counted"}
        note: {type: string, description: "On what basis the peer is counted; states that nothing confirms automatically that the peer shares the account"}

    BudgetView:
      type: object
      description: |
        The budget position of an Automation, computed on every read and never
        stored. It describes the policy with the least room left right now:
        the Automation's own, or the override of the member that is next to
        start. Dollar figures are actual spend; the allocation estimate is an
        estimate.
      properties:
        scope: {type: string, description: "automation, or member:<id>"}
        ceiling_type: {type: string, enum: [dollar, allocation_pct]}
        ceiling_usd: {type: number, description: "0 for an allocation_pct policy, which has no dollar ceiling"}
        spent_usd: {type: number, description: "Spend in the window, including opted-in peers"}
        remaining_usd: {type: number}
        window: {type: string, enum: [automation, day, week, month]}
        window_start: {type: string, format: date-time}
        window_end: {type: string, format: date-time, description: "Absent for the lifetime window (automation)"}
        pacing: {type: string, enum: [none, even]}
        pacing_allowed_usd: {type: number, description: "With even pacing, the spend allowed so far in the window"}
        on_breach: {type: string, enum: [pause, block]}
        ceiling_reached: {type: boolean, description: "True when the dollar ceiling stops members from starting"}
        hold: {type: string, enum: [pacing, estimate], description: "Set while a member is held back without a breach"}
        hold_reason: {type: string}
        reset_at: {type: string, format: date-time, description: "When the window frees up again"}
        reset_known: {type: boolean, description: "True when the daemon can act on reset_at by itself"}
        reset_source: {type: string, enum: [window, rate_limit], description: "window: a window the daemon defines itself; rate_limit: a reset time read from a rate-limit message"}
        state: {$ref: "#/components/schemas/BudgetState"}
        allocation_estimate: {$ref: "#/components/schemas/BudgetAllocation"}
        peers: {type: array, items: {$ref: "#/components/schemas/BudgetPeerLine"}}
        peer_spend_usd: {type: number}
        peer_basis: {type: string, description: "Present when peers are opted in: states that nothing confirms automatically that they share the account"}
        peer_note: {type: string, description: "Why named peers could not be counted"}
        note: {type: string, description: "Set when the policy is an estimate only"}
      required: [scope, ceiling_usd, spent_usd, remaining_usd, ceiling_reached, reset_known]

    BudgetSetRequest:
      type: object
      description: "Request body for POST /api/automations/{id}/set_budget."
      required: [expected_version]
      properties:
        expected_version: {type: integer, description: "The `version` you last observed; a stale value is rejected with 409"}
        member_id: {type: string, description: "Empty: the Automation's own policy. Set: that member's own override"}
        ceiling_type: {type: string, enum: [dollar, allocation_pct]}
        ceiling_value: {type: number, description: "Dollar limit, or percent for an allocation_pct estimate"}
        window: {type: string, enum: [automation, day, week, month]}
        pacing: {type: string, enum: [none, even]}
        on_breach: {type: string, enum: [pause, block]}
        backend: {type: string, description: "When set, only spend on this backend counts"}
        allocation_estimate: {type: boolean, description: "Show an estimated share of the plan allocation; off by default and never used to pause or block"}
        peer_window: {type: array, items: {type: string}, description: "Federation peers whose usage counts toward the ceiling (opt-in per peer)"}
        reset_time: {type: string, description: "24h HH:MM at which a day, week or month window starts"}
        reset_weekday: {type: string, description: "Week windows: monday to sunday"}
        reset_day: {type: integer, description: "Month windows: 1 to 28"}
        reset_zone: {type: string, description: "IANA zone the reset fields are read in; default is the daemon's local zone"}
        estimated_cost_usd: {type: number, description: "Members only: the expected cost of the member's Automaton, checked against the ceiling before it starts; 0 removes it"}
        clear: {type: boolean, description: "Remove the policy (or the member override); cannot be combined with other budget fields"}
        actor: {type: string, description: "operator (default) or the acting session/agent; recorded in the audit log"}
        reason: {type: string, description: "Why; recorded in the audit log"}


    AutomationCreate:
      type: object
      description: Request body for POST /api/automations (create a draft Automation).
      required: [members]
      properties:
        name: {type: string}
        description: {type: string}
        entry_member_id: {type: string, description: "Entry member ID; when omitted, the first members entry is the entry"}
        members:
          type: array
          items:
            $ref: "#/components/schemas/AutomationMember"
        budget_policy: {$ref: "#/components/schemas/BudgetPolicy"}
        project_dir: {type: string}
        backend: {type: string}
        model: {type: string}
        effort: {type: string}
        verification_backend: {type: string}
        verification_model: {type: string}
        verification_effort: {type: string}
        actor: {type: string, description: "operator (default) or the acting session/agent; recorded in the audit log"}
        reason: {type: string, description: "Why this Automation is being created; recorded in the audit log"}

    AutomationUpdate:
      allOf:
        - $ref: "#/components/schemas/AutomationCreate"
        - type: object
          required: [expected_version]
          properties:
            expected_version: {type: integer, description: "The `version` you last observed; the write is rejected with 409 if it is stale"}

    FailureEscalationPolicy:
      description: "One level of the failure escalation policy. A missing or null field inherits from the next level up (task, then Automaton, then the daemon default)."
      type: object
      properties:
        enabled: {type: boolean, description: "Turns failure escalation on. False restores the older retry-then-fail behaviour."}
        max_failures: {type: integer, minimum: 1, description: "Failed attempts after which the task is held for review. Default 3."}
        steps:
          type: array
          maxItems: 8
          description: "The ladder of workers to try, in order. An empty list inherits."
          items: {$ref: "#/components/schemas/FailureEscalationStep"}
    FailureEscalationStep:
      description: "One rung of the ladder. The step covers its attempts failed attempts; the last step covers every remaining attempt."
      type: object
      properties:
        backend: {type: string, description: "Worker backend. Empty means the task's normally resolved worker."}
        model: {type: string, description: "Worker model. Needs a backend."}
        effort: {type: string, description: "Effort level: low, medium, high, max, quick, normal or thorough. Empty inherits the task's effort."}
        attempts: {type: integer, minimum: 1, description: "Failed attempts this step covers. Default 1."}
    ReviewNeededEntry:
      description: "A task held for operator review, as listed in an Automaton summary. Only the identity, the failure count and the last worker are included, never the spec or the attempt report."
      type: object
      required: [task_id, story_id, failure_count, held_at]
      properties:
        task_id: {type: string}
        task_title: {type: string}
        story_id: {type: string}
        failure_count: {type: integer, description: "Failed attempts since the last operator action."}
        last_backend: {type: string, description: "Worker backend of the last attempt."}
        last_model: {type: string, description: "Worker model of the last attempt."}
        held_at: {type: string, format: date-time}
    TagRegistry:
      description: |
        The registry object on GET /api/autonomous/tags. It describes how this daemon
        takes part in the shared tag registry. A daemon is standalone when no keeper
        is configured (it keeps its own tags and syncs with nobody), the keeper when
        autonomous.tags.registry_keeper names this daemon, and a peer when it names
        another daemon. A peer keeps a cached copy of the keeper's tags, so it can
        still show them while the keeper is unreachable.
      type: object
      properties:
        role: {type: string, enum: [standalone, keeper, peer], description: "This daemon's role in the registry"}
        keeper: {type: string, description: "The keeper's peer name. Empty when standalone."}
        stale: {type: boolean, description: "True on a peer whose keeper has not answered since last_synced_at. The tags shown are then the last copy."}
        last_synced_at: {type: string, format: date-time, description: "When the keeper last answered with a snapshot. Omitted before the first answer."}
        revision: {type: integer, description: "The registry revision this daemon holds"}
        pending_sync_count: {type: integer, description: "Tags a peer created while the keeper was unreachable and that the keeper has not yet received"}
        notes:
          type: array
          description: "Merge and removed-on-keeper notes not yet dismissed on this daemon. Always an array."
          items: {$ref: "#/components/schemas/TagRegistryNote"}
        last_error: {type: string, description: "The last sync error. Empty when the last sync worked."}
    TagRegistryTag:
      description: "One tag of the shared registry, as this daemon holds it."
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        parent_id: {type: string, description: "Omitted for a root tag"}
        color: {type: string}
        description: {type: string}
        origin_node: {type: string, description: "Name of the daemon that created the tag"}
        pending_sync: {type: boolean, description: "True on a tag a peer created while the keeper was unreachable. Omitted otherwise."}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    TagRegistryNote:
      description: "A visible record of a merge or of a removal on the keeper. It stays until it is dismissed on this daemon."
      type: object
      properties:
        id: {type: string, description: "Note ID, used by the dismiss route"}
        kind:
          type: string
          enum: [merged, removed_on_keeper]
          description: "merged: a pending tag was merged into a keeper tag. removed_on_keeper: the keeper deleted a tag this daemon still had assignments on."
        name: {type: string}
        parent_path: {type: string, description: "Path of the parent tag, when there is one"}
        kept_id: {type: string, description: "merged: the keeper tag that was kept"}
        replaced_id: {type: string, description: "merged: the pending tag that was replaced"}
        tag_id: {type: string, description: "removed_on_keeper: the deleted tag"}
        nodes: {type: array, items: {type: string}, description: "Nodes the change touched"}
        merged_at: {type: string, format: date-time}
    TagRegistrySnapshot:
      description: "The keeper's registry, as a peer pulls it (GET /api/autonomous/tags/registry)."
      type: object
      properties:
        revision: {type: integer}
        tags: {type: array, items: {$ref: "#/components/schemas/TagRegistryTag"}}
        notes: {type: array, items: {$ref: "#/components/schemas/TagRegistryNote"}}
    TagRegistryWrite:
      description: "One edit a peer forwards to the keeper (POST /api/autonomous/tags/registry/write)."
      type: object
      required: [kind, tag_id, base_revision]
      properties:
        kind: {type: string, enum: [create, rename, reparent, recolor, describe, delete]}
        tag_id: {type: string, description: "The tag the edit applies to. For a create, the new tag's ID."}
        base_revision: {type: integer, description: "The registry revision the writer had when it made the edit. The keeper compares it with the last change to each field."}
        name: {type: string}
        parent_id: {type: string}
        color: {type: string}
        description: {type: string}
        origin_node: {type: string, description: "Name of the daemon that made the edit"}
        pending: {type: boolean, description: "True for a create made while the keeper was unreachable. A same-name tag under the same parent then merges into the keeper's tag."}
    TagRegistryWriteResult:
      description: "What the keeper returns for a forwarded write."
      type: object
      properties:
        tag:
          description: "The keeper's value after the write, or the kept tag of a merge. Empty for a delete."
          allOf: [{$ref: "#/components/schemas/TagRegistryTag"}]
        revision: {type: integer}
        conflict: {type: boolean, description: "True when the keeper kept its own value for a field the writer also edited. Omitted otherwise."}
        conflict_field: {type: string, enum: [name, parent, color, description], description: "The field the conflict is about"}
        merge:
          description: "Set when a pending create merged into the keeper tag named in tag"
          allOf: [{$ref: "#/components/schemas/TagRegistryNote"}]

    QuestionOption:
      description: "One named option of an operator question. A question must carry 2 to 20 options with unique ids."
      type: object
      required: [id, label]
      properties:
        id: {type: string, description: "Stable option id; referenced by `default`, `recommendation.option_id` and an answer's `chosen_option_id`."}
        label: {type: string, maxLength: 200, description: "What the option is. <= 200 bytes."}
        tradeoffs: {type: string, maxLength: 1000, description: "What the option buys and costs, optional. <= 1000 bytes."}

    Question:
      description: |
        One operator decision, recorded when raised and kept until answered or
        withdrawn (no deadline). The kind of question is the `label`, not a
        different structure; the shipped labels are decision, design review,
        approval and information, but users may add their own. `default` is
        the declared fallback - always an option or `hold`, never silent.
      type: object
      required: [id, label, text, options, default, context, asker_kind, state, created_at]
      properties:
        id: {type: string}
        label: {type: string, description: "The kind of question; custom labels are accepted. Defaults to `decision`."}
        asked_by: {type: string, description: "The asker of record."}
        asker_kind: {type: string, enum: [session, supervisor, operator, system], description: "Who asked; defaults to `operator`."}
        session_id: {type: string, description: "Present when the asker is a session."}
        context: {type: string, enum: [none, prd, task, proposal, registry_row], description: "Where the decision belongs; the matching link must be present, `none` none of them."}
        prd_id: {type: string, description: "The Automaton id, for context `prd`."}
        task_id: {type: string, description: "The task id, for context `task`."}
        proposal_path: {type: string, description: "A repository-relative path into the working tree, for context `proposal`."}
        registry_row_key: {type: string, description: "The registry row key, for context `registry_row`."}
        text: {type: string, maxLength: 8192, description: "The decision in one line. <= 8192 bytes."}
        options:
          type: array
          minItems: 2
          maxItems: 20
          items: {$ref: "#/components/schemas/QuestionOption"}
        recommendation:
          type: object
          description: "Optional, the asker's own preference."
          properties:
            option_id: {type: string, description: "Must exist among the options."}
            rationale: {type: string, maxLength: 1000}
        default: {type: string, description: "An option id or `hold` - the declared fallback when the question is never answered."}
        risk: {type: string, enum: [normal, low], default: normal}
        priority: {type: string, enum: [normal, high], description: "How urgently an operator should act; omitted means `normal` (separate from `risk`, which says how dangerous a wrong answer is). A `high` raise additionally lands in the alert store while the channel is on."}
        return_path: {type: boolean, default: false, description: "This question opted in to the single `DATAWATCH_ANSWER:` line delivered to its `session_id` when the answer is recorded (needs `autonomous.questions.return_path` on). Default no: the return path is the events plus polling GET."}
        state: {type: string, enum: [open, answered, withdrawn, expired]}
        created_at: {type: string, format: date-time}

    QuestionRaise:
      description: "The POST /api/questions body. The required shape is `text`, 2 to 20 options with unique ids, a named `default` (an option or `hold`) and a `context` (one of none, prd, task, proposal, registry_row) with its matching link."
      type: object
      required: [text, options, default, context]
      properties:
        label: {type: string, description: "Defaults to `decision`."}
        asked_by: {type: string, description: "Defaults to the caller."}
        asker_kind: {type: string, enum: [session, supervisor, operator, system], description: "Defaults to `operator`."}
        session_id: {type: string}
        context: {type: string, description: "One of none, prd, task, proposal, registry_row; an omitted context is not defaulted."}
        prd_id: {type: string}
        task_id: {type: string}
        proposal_path: {type: string, description: "Must be repository-relative (no leading /, no .. segment)."}
        registry_row_key: {type: string}
        text: {type: string, maxLength: 8192, description: "The decision in one line. <= 8192 bytes."}
        options:
          type: array
          minItems: 2
          maxItems: 20
          items: {$ref: "#/components/schemas/QuestionOption"}
        recommendation:
          type: object
          properties:
            option_id: {type: string, description: "Must exist among the options."}
            rationale: {type: string, maxLength: 1000}
        default: {type: string, description: "An option id of this question or `hold` - never silent."}
        risk: {type: string, enum: [normal, low], description: "Defaults to `normal`."}
        priority: {type: string, enum: [normal, high], description: "Defaults to `normal` (empty accepted). A `high` raise additionally lands in the alert store while the channel is on; anything else is a 400 naming the field."}
        return_path: {type: boolean, default: false, description: "Opt this one question in to the single `DATAWATCH_ANSWER:` line into its `session_id` at answer time (needs `autonomous.questions.return_path` on). Default false - the default return path is the events plus polling GET /api/questions/{id}."}

    Answer:
      description: |
        One recorded answer, immutable. A changed mind is a new answer whose
        `supersedes` names the replaced answer; superseded answers stay in the
        log and are derived on read, never deleted. The quote is stored
        exactly as received, with `quote_sha256` (the SHA-256 of its exact
        bytes) recorded alongside.
      type: object
      required: [id, question_id, actor, surface, created_at]
      properties:
        id: {type: string}
        question_id: {type: string}
        actor: {type: string, description: "The answering party of record."}
        surface: {type: string, description: "pwa, android, ios, cli, rest, mcp, or `comm:<channel name>`."}
        chosen_option_id: {type: string, description: "Present when the answer picked an option."}
        quote: {type: string, description: "The operator's own words, exactly as received. <= 16 KiB; empty when absent."}
        quote_sha256: {type: string, description: "Lowercase hex SHA-256 of the quote's exact bytes; empty when there is no quote."}
        supersedes: {type: string, description: "The id of the answer being replaced; present only on an answer that replaces another."}
        source_message_id: {type: string, description: "Present when the answer came over a comm channel."}
        created_at: {type: string, format: date-time}

    AnswerView:
      description: "An answer plus its derived superseded state, as returned by the answer log."
      allOf:
        - $ref: "#/components/schemas/Answer"
        - type: object
          properties:
            superseded: {type: boolean, description: "True when a later answer in the log names this one as the one it replaces."}
            superseded_by: {type: string, description: "The id of the answer that replaced it; present when superseded is true."}

    QuestionAnswer:
      description: "The POST /api/questions/{id}/answer body. At least one of chosen_option_id and a non-blank quote is required."
      type: object
      properties:
        chosen_option_id: {type: string, description: "Must name an option of the question."}
        quote: {type: string, description: "The operator's own words, stored exactly as received. <= 16384 bytes."}
        supersedes: {type: string, description: "The id of the answer being replaced (the current answer of an answered question). On an open question a supersedes is a 409 — there is no current answer to replace."}
        surface: {type: string, description: "pwa, android, ios, cli, rest, mcp, or `comm:<channel name>`. Defaults to `rest`; `system` is refused."}
        source_message_id: {type: string}
        actor: {type: string, description: "Defaults to the caller."}

    QuestionWithdraw:
      description: "The POST /api/questions/{id}/withdraw body. Both fields optional."
      type: object
      properties:
        reason: {type: string, description: "Free text for the log."}
        actor: {type: string, description: "Defaults to the caller."}

    QuestionError:
      description: "The error body of the JSON-answering question endpoints (answer, withdraw, answer log). A secret refusal is the same object with `reason` and `suggestion` added — see QuestionSecretRefusal."
      type: object
      required: [error]
      properties:
        error: {type: string, description: "A human-readable reason, e.g. `answer carries neither an option nor non-blank text`, `answer quote is not valid UTF-8`, `answer must name the answer it supersedes`, `answer supersedes the wrong target`, `question is not open`."}

    QuestionSecretRefusal:
      description: "The 422 body of POST /api/questions/{id}/answer when an answer's text looks like a secret. Nothing from the submitted text is echoed: `error` is a fixed phrase and `suggestion` the two fixed safe routes. The matched rule's name is not in this body — it is recorded on the `question_answer_refused` audit entry."
      type: object
      required: [error, reason, suggestion]
      properties:
        error:
          type: string
          description: "Fixed text containing the phrase `matched: secret pattern` and the two safe routes; it does not name the specific rule that matched."
        reason:
          type: string
          enum: [secret_detected]
          description: "Always `secret_detected`."
        suggestion:
          type: array
          items: {type: string}
          description: "The two safe routes: store the secret in the datawatch secrets store and refer to it as ${secret:name}; or save it on the filesystem and point the session at the file."
