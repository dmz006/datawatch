# ── Identity ──
# Machine identification and data storage paths.
# Identifies this machine in messages and session IDs. Auto-detected if empty.
hostname: peer-d
# Root directory for sessions.json, logs/, and state files.
data_dir: /var/lib/datawatch
# Found 2026-10-10 -- general opt-out across every comm channel for the
# outbound session-lifecycle notification broadcast (task started/
# waiting/completed/failed). Names each backend's own identifier:
# signal, telegram, discord, slack, matrix, imap_mcp, ntfy, email,
# webhook, github_webhook. A listed channel still handles inbound
# commands normally -- this only skips the notification broadcast.
# Empty (default) excludes nothing, the behavior every channel has
# always had.
notify_exclude: []

# ── Operator Identity ──
# Settings for the operator identity file (identity.yaml in the data
# directory). The "Identity" heading above is only about machine
# identification; this is the top-level `identity` key.
identity:
  # identity.backups_to_keep — how many timestamped backups of the operator
  # identity file the daemon keeps. Each write to the identity file first
  # saves a backup; the oldest are removed once there are more than this
  # many. A whole number >= 1; default 10. A value below 1 or a non-numeric
  # value is refused (PUT /api/config answers 400 and changes nothing).
  # Change it with PUT /api/config {"identity.backups_to_keep": 20},
  # the comm channel (`configure identity.backups_to_keep=20`),
  # the CLI (`datawatch config set identity.backups_to_keep 20`),
  # the MCP config_set tool (key identity.backups_to_keep, value 20)
  # or the Identity section of the PWA settings. Takes effect at the next
  # identity write, no restart needed.
  backups_to_keep: 10

# ── Session Management ──
# Controls session creation, LLM defaults, and project git integration.
session:
  # Active LLM backend. Options: claude-code, aider, goose, gemini, opencode, opencode-acp, opencode-prompt, ollama, openwebui, shell
  llm_backend: claude-code
  # How many days to keep a finished session's folder under <data_dir>/sessions/
  # before it is deleted. The session record stays in the list. 0 or unset = 30.
  session_retention_days: 30
  # Maximum concurrent active sessions (0 = unlimited)
  max_sessions: 10
  # Slots of max_sessions held back for operator sessions so autonomous work
  # never uses them. Default: 1 when max_sessions >= 3, otherwise 0.
  reserved_interactive: 1
  # Seconds an interactive (non-autonomous) session start blocks waiting for
  # a free node:/llm: capacity slot on a shared compute node before
  # returning 503, when capacity is wired. Default: 8. Kept short
  # deliberately — this blocks a synchronous HTTP request, unlike
  # autonomous.capacity_wait_timeout_seconds below, which bounds a
  # background task's retry loop instead.
  capacity_wait_seconds: 8
  # How long one OneShot task-delivery attempt waits for the Claude main prompt
  # to appear (disclaimer banner, model selection, etc.) before trying again.
  # A Claude session must finish starting its channel and tool servers before
  # the prompt shows, so the task text can take a while to become deliverable.
  # Default: 60.
  task_delivery_window_seconds: 60
  # How many delivery attempts are made before the task fails as undelivered;
  # between attempts a backoff pause (5s, then 10s) is waited. The total wait
  # is attempts * window plus that backoff — about 195 seconds with the
  # defaults (3 * 60s + 15s). A session whose process has already exited
  # still fails at once, without waiting out the budget.
  task_delivery_attempts: 3
  # Milliseconds the session store batches changes before its background
  # writer saves them to sessions. 0 saves on every change. Applies live when
  # changed through the API, web UI, comm channel, CLI or MCP.
  # Default: 1000.
  store_flush_interval: 1000
  # Days after its last update that a finished session moves from the active
  # session store into the archive file. 0 turns archiving off.
  # Default: 14.
  store_archive_after_days: 14
  # Largest session text field, in KB, kept inline in the session store.
  # Longer text is cut with a marker and the full text goes to a side file.
  # Default: 256.
  store_field_cap_kb: 256
  # Automaton (PRD) text longer than this many KB is stored in a side file next
  # to its record instead of inline. Default: 64.
  store_side_file_cap_kb: 64
  # Seconds of idle output before declaring a session is waiting for input
  input_idle_timeout: 10
  # liveness: seconds the liveness rule watches a print-mode backend (a family
  # name ending in -prompt, e.g. pi-prompt) before considering it stalled.
  # 0 (or absent) = built-in default 120. Never read the raw value; callers
  # resolve it via Config.LivenessWindowSecondsEffective(). 0 means "use the
  # default", not "no window". Negative values are refused.
  # Carried by: this YAML, REST (GET/PUT /api/config), MCP config_set,
  # CLI `datawatch config set`, comm `configure`, and web Settings.
  liveness_window_seconds: 120
  # liveness: per-backend input-idle timeout (seconds) overrides. Keys are
  # backend family names ("pi" matches "pi-prompt"); full backend names also
  # match. An empty map means the global input_idle_timeout applies, with the
  # one rule that print-mode backends default to off (0) while interactive
  # backends keep the global default of 10. Resolve via
  # Config.LivenessInputIdleTimeoutEffective(backend), which is the only
  # correct reader: raw zero values here do not mean "unset".
  # An explicit 0 for a key means off (not unset). Unknown backend names are
  # refused on every surface; negative values are refused. Carried by the same
  # surfaces as liveness_window_seconds (YAML, REST, MCP config_set, CLI
  # `config set`, comm `configure`, web Settings).
  # Example: {pi: 30, goose: 0, claude-code: 25}
  liveness_idle_timeout_overrides: {}
  # Default number of output lines returned by tail/status commands
  tail_lines: 20
  # Number of non-empty output lines included in prompt alerts sent to messaging channels
  alert_context_lines: 10
  # Default working directory for new sessions started without a project_dir,
  # on every surface (REST, MCP, comm channel, CLI). Sessions write CLAUDE.md
  # and, for non-claude-code backends, .mcp.json into this directory.
  default_project_dir: ~
  # Restrict file browser to this directory tree (empty = no restriction)
  root_path: ""
  # Root directory for the federated file service and PWA image uploads.
  # Per-peer files land in <file_service_root>/peers/<name>/;
  # per-discussion files in <file_service_root>/discussions/<id>/.
  # Empty = falls back to root_path, then the user home directory.
  file_service_root: ""
  # Path to the claude CLI binary
  claude_code_bin: claude
  # Enable the claude-code backend
  claude_enabled: true
  # Pass --dangerously-skip-permissions to claude
  skip_permissions: true
  # Enable per-session MCP channel for claude
  channel_enabled: true
  # Auto-initialize git repo in project directory
  auto_git_init: false
  # Default for the `git` field on session start requests: when omitted,
  # the session starts with git activity (pre-session snapshot, checkpoint
  # tag, completion commit) enabled iff this is true. Explicit git true/false
  # in a start request always wins. Default false.
  git_default: false
  # Auto-commit project changes after session completes
  auto_git_commit: true
  # Kill all sessions when daemon stops
  kill_sessions_on_exit: false
  # Max MCP channel restart attempts per session
  mcp_max_retries: 5
  # Settle delay (ms) between sending literal text and Enter for any send_input call.
  # 0 = legacy single send-keys (triggers missed-Enter bug on React Ink TUIs).
  # 200 (default) fixes claude-code and other Ink-based TUIs.
  # Applies to ALL send sources (schedule, MCP, CLI, API) since v8.12.9.
  schedule_settle_ms: 200

  # UI prompt handling — every value below is read live from this config,
  # none is hard-coded, and a change applies immediately with no daemon
  # restart. Unset keys read as their commented default; an explicit value
  # (including false and 0) is stored and read back, and a bad value is
  # rejected (nothing is written).
  # Change any of these with PUT /api/config {"session.dismiss_ui_prompts": false},
  # the comm channel (`configure session.ui_prompt_max_attempts=3`),
  # the CLI (`datawatch config set session.ui_prompt_dismiss_delay_seconds 10`),
  # or the MCP config_set tool (key session.ui_prompt_max_attempts, value 3)
  # — every surface rides the same daemon PUT /api/config.
  # Turn dismissing UI prompts off (unset reads true):
  dismiss_ui_prompts: true
  # Whole seconds to wait before sending the UI prompt dismissal.
  # 0 = send at once (unset reads 5):
  ui_prompt_dismiss_delay_seconds: 5
  # Whole seconds for the UI prompt clear bound (>= 1; unset reads 30):
  ui_prompt_clear_bound_seconds: 30
  # Max UI prompt dismissal attempts (>= 1; unset reads 2):
  ui_prompt_max_attempts: 2

  # Inject additional MCP servers into every spawned session's .mcp.json.
  # Each entry is merged alongside the built-in datawatch MCP bridge entry.
  # For non-claude-code backends, extras go via WriteProjectMCPConfig.
  # For claude-code sessions, extras go via InjectExtrasIntoMCPConfig.
  # ${ENV_VAR} references in env values are expanded at spawn time.
  extra_mcp_servers:
    - name: imap-mcp           # Key name in .mcp.json mcpServers block
      command: imap-mcp/imap-mcp   # Executable path
      args: []                 # Optional CLI arguments list
      env:                     # Optional environment variables
        GMAIL_APP_PASSWORD: "${GMAIL_APP_PASSWORD}"
  # Design A3 (v8.39.25) — capability group(s)/caps minted into every
  # spawned session's own scoped credential, which replaces the admin
  # token the session's bridge used to hold. Empty (the default) resolves
  # to the builtin "session-default" group (coordination + observability:
  # sessions, agents, queue, results, memory, comm, docs, autonomous-read,
  # pipelines, council — NOT secrets, config writes, federation/tailscale,
  # LLM/compute registry, plugin install, or daemon control). Accepts the
  # same values as a federation peer's capabilities field. See
  # docs/howto/federation-cbac.md.
  capabilities: []
  # BL353: new fields available on scheduled command entries (managed via
  # GET/POST/DELETE /api/schedules). These are set per-entry, not globally:
  #
  #   session_name: ""    # Resolve target by session name at fire time
  #                       # (survives session restarts unlike session_id).
  #   cron_expr: ""       # 5-field cron expression for recurrence
  #                       # (e.g. "*/5 * * * *"). Alias for the `cron` field.
  #   schedule_name: ""   # Human-readable label for lookup/cancel by name.
  # BL41: per-session effort hint applied when caller doesn't supply one.
  # One of: quick / normal / thorough. Default: normal.
  default_effort: "normal"
  # BL40: running sessions older than this are reported as stale via
  # GET /api/sessions/stale. 0 disables. Default 1800 (30 min).
  stale_timeout_seconds: 1800
  # BL30: when true, hitting a rate limit on any backend pauses new
  # session creation until the cooldown elapses or the operator clears
  # it via DELETE /api/cooldown. Default false.
  rate_limit_global_pause: false
  # BL6 (v3.7.1): per-backend USD rates (per 1K tokens). Empty entries
  # fall through to built-in defaults. Override here when your account
  # plan differs from the public price card.
  cost_rates:
    claude-code:
      in_per_k:  0.003
      out_per_k: 0.015
  # Log verbosity: info, debug, warn, error
  log_level: ""
  # Default terminal width (cols) for new sessions (0 = 80)
  console_cols: 0
  # Default terminal height (rows) for new sessions (0 = 24)
  console_rows: 0
  # BL356: Exit hooks — fire when a matching session crashes (claude_alive→false)
  # or enters failed/killed state. action: restart → re-starts the session
  # automatically; action: notify → sends a message to notify_session.
  exit_hooks:
    # Array of exit hook definitions. Each hook fires when a matching session
    # crashes (claude_alive→false) or enters failed/killed state.
    - name: "worker"          # Session name to monitor
      action: restart          # restart | notify
      notify_session: ""       # (notify only) session name to send message to
      notify_message: ""       # (notify only) message text
      cooldown_seconds: 300    # minimum seconds between firings (default: 300)

  # Response summarizer — when enabled, the last captured session response
  # is summarized via the referenced LLM after the session completes or
  # transitions to waiting_input. The summary is available via
  # GET /api/sessions/{id}/last-summary and the session_summarize MCP tool.
  summarizer:
    # Enable automatic summarization on session completion.
    enabled: false
    # LLM backend reference (must be an Ollama or OpenAI-compatible LLM).
    # Leave empty to use the first available compatible LLM.
    llm_ref: ""
    # Ollama model name to use for summarization (e.g. "qwen3:1.7b", "llama3.2").
    # Leave empty to use the default model of the selected LLM backend.
    model: ""
    # System/instruction prompt. Leave empty to use the built-in default.
    # The built-in default instructs the model to produce plain spoken English
    # suitable for text-to-speech surfaces (Android Auto, lock screen). It
    # prohibits file names, identifiers, error codes, and markdown formatting.
    prompt: ""

# ── Platform context ──
# The short text every session is told about datawatch. A change applies to
# sessions started afterwards. A project can override `enabled` with its own
# platform_context_enabled policy value.
#   enabled: default true. false = deliver nothing.
#   note: optional text appended after the platform context; max 2000 bytes.
platform_context:
  enabled: true
  note: ""

# ── UI ──
# Top-level UI display settings (the ui.* section). Unset keys read the
# defaults; an explicit 0 is a real value, distinct from unset.
ui:
  # Minimum whole seconds the UI splash stays on screen before it may
  # dismiss. Default: 6. 0 keeps the legacy timing (no minimum dwell).
  # A whole number from 0 to 60; values outside that range are refused at
  # config load (the error names ui.splash_min_seconds).
  splash_min_seconds: 6
  # Minimum whole seconds for the splash shown when it is for a new
  # version. Default: 9. 0 keeps the legacy timing (no minimum dwell).
  # A whole number from 0 to 60; values outside that range are refused at
  # config load (the error names ui.splash_min_seconds_new_version).
  splash_min_seconds_new_version: 9

# ── Git push-on-complete ──
# What datawatch pushes to the git remote when finished work is committed.
# Covers autonomous PRD work, one-shot sessions, and the last-resort
# pre-teardown save push. Pushes are plain fast-forward-only and are
# NEVER force-pushed; a failed push never loses the local commit.
git:
  # What to push when work completes. Read live on every push attempt, so a
  # runtime change (REST/comm/CLI) applies without a restart.
  #   never          — push nothing; the finished commit stays in the local
  #                    checkout only.
  #   branch         — (default) push the finished work branch to
  #                    <remote>/<branch> with upstream tracking. For PRD
  #                    work this runs after each validated task, then again
  #                    at completion (a second push of an up-to-date branch
  #                    is a no-op).
  #   default_branch — push onto the remote's default branch, and only
  #                    after the automaton's final gates have passed
  #                    (i.e. at PRD completion). A mid-run task never pushes
  #                    the default branch, because the final validation is
  #                    not done yet.
  # Empty or an unrecognised value behaves as branch. When a push cannot
  # happen (no remote, auth, non-fast-forward), the commit is kept
  # locally, a visible "not pushed" warning is recorded on the PRD
  # (push_state / push_warning) and one operator alert is raised.
  push_on_complete: branch
  # Remote name the finished branch is pushed to (default: origin).
  push_remote: origin
  # Pre-push secret scan (the "secret scan push gate"). Before any daemon
  # push attempt (PRD push-on-complete, one-shot push, pre-teardown save
  # push) it scans the commits on HEAD that are on no ref of push_remote,
  # looking only at the lines those commits add. Read live on every push
  # attempt — a runtime change (REST/MCP/comm/CLI) applies on the next
  # push, no restart. Findings are redacted everywhere: detector, commit,
  # file:line and a 16-hex fingerprint (sha256 of the matched material);
  # the secret itself is never stored, logged, alerted or printed.
  secret_scan:
    # What a finding does with the push.
    #   shadow — (default; unset/empty reads shadow) scan, log, record the
    #            findings on the PRD/session and raise one warn alert; the
    #            push proceeds.
    #   enforce — any finding not allow-listed refuses the push before it
    #             runs; the remote is left untouched and the local commit
    #             is kept exactly where it is.
    #   off — no scan at all.
    # A value other than off|shadow|enforce is refused on every write path
    # (REST/MCP/comm/CLI) with an error naming the allowed values.
    mode: shadow
    # Detector names to run; built-ins: private_key, aws_access_key,
    # github_token, generic_token, slack_token. Empty (or omitted) reads as
    # all built-ins; an empty value written at runtime resets to all
    # built-ins. An unknown name fails the scan (logged, push proceeds) —
    # it never silently no-ops.
    detectors: []
    # Allow-list: matching findings are suppressed.
    allow_list:
      # Path globs matched (path.Match) against the repository-relative
      # path; a bare directory name (e.g. vendor, testdata) also matches
      # any path inside it. Matches are skipped entirely.
      paths: []
      # Fingerprints of specific findings: the short 16-hex form shown on
      # every finding, or the full 64-hex sha256 digest of the matched
      # material. Each entry must be 16- or 64-char hex (write paths
      # validate). Only the hash is stored — never the secret.
      fingerprints: []

# ── Tracing ──
# Normalized agent trace events (tool calls, model requests, state changes,
# permission decisions, loop warnings, errors) from every backend.
tracing:
  # off (no tracing), summary (default; unset reads summary) or full.
  # Any other value is refused (at config load and on PUT /api/config) with
  # an error naming the allowed values.
  mode: summary
  # Maximum bytes of a tool-call argument summary stored per event.
  # 0 or unset reads 512; allowed range 0..1048576.
  arg_cap_bytes: 512
  # Days trace events are kept. 0 or unset reads 14; allowed range 0..3650.
  retention_days: 14
  # Per-backend switches, e.g. {pi: false}. A backend not listed is traced.
  backends: {}

# ── Web Server ──
# HTTP/WebSocket server for the PWA, REST API, and browser access.
server:
  # Enable the web server
  enabled: true
  # Bind interface. Use 0.0.0.0 for all interfaces, 127.0.0.1 for localhost only
  host: 0.0.0.0
  # HTTP listen port
  port: 8080
  # Bearer token for authentication (empty = no auth)
  token: ""
  # Enable HTTPS/TLS
  tls_enabled: false
  # Separate TLS port (0 = TLS replaces main port)
  tls_port: 0
  # Auto-generate self-signed cert if tls_cert/tls_key are empty
  tls_auto_generate: true
  # Path to TLS certificate PEM file
  tls_cert: ""
  # Path to TLS private key PEM file
  tls_key: ""
  # Per-session MCP channel port (0 = random; auto-selects a free port)
  channel_port: 0
  # Second listener (same host/cert, separate origin) that serves ONLY
  # /remote/ (a proxied federation peer's own PWA) and /api/proxy/ (its
  # matching callback traffic). Needed so a proxied peer's JS can never
  # read this daemon's own auth token out of localStorage -- before this
  # existed, /remote/ was served on the SAME origin as your own session.
  # Default: 8444. Set to 0 (or negative) to disable (not recommended --
  # /remote/ becomes unavailable rather than falling back to the old,
  # same-origin behavior). See docs/plans/2026-10-03-bl394-security-
  # findings-review.md §6.
  proxy_sandbox_port: 8444

# ── datawatch-channel binary environment variables ──
# These are injected by the daemon into each session's environment when
# spawning the datawatch-channel bridge process. They are not set in
# this YAML file but are documented here for troubleshooting.
#
#   DATAWATCH_CHANNEL_PORT   HTTP listen port for the bridge (default 7433; 0 = random).
#                            If the default port is in use the bridge will fail to start.
#                            Symptom: MCP error with no further detail; session cannot connect.
#                            Fix: set to 0 in server.channel_port to auto-select a free port.
#   DATAWATCH_API_URL        Base URL of the parent daemon API the bridge calls back to
#                            (default http://localhost:8080). Wrong value → bridge starts but
#                            tool discovery fails; sessions show "reply-only" mode.
#   DATAWATCH_TOKEN          Bearer token for the parent daemon API. Must match server.token.
#                            Wrong/missing → 401 on discovery and /api/channel/ready;
#                            bridge starts but push notifications never work.
#   CLAUDE_SESSION_ID        Session ID injected so the bridge can tag replies correctly.
#                            Auto-set by the daemon; do not override unless testing.
#
# Run `datawatch channel diagnostics` or check GET /api/channel/diagnostics to see
# per-session port registrations and live bridge /health probe results.
  # How long completed sessions show in active list (minutes)
  recent_session_minutes: 5
  # Max terminal sessions returned by GET /api/sessions?view=summary, newest first (0 = no cap; the unfiltered list is never capped)
  session_summary_terminal_limit: 50
  # Characters kept of task/prompt/response text in GET /api/sessions?view=summary (min 20)
  session_summary_text_chars: 200
  # WebSocket session updates for clients that send no hello: full (whole list) or delta (per-session changes only)
  ws_session_list_default: full
  # WebSocket terminal output for clients that don't choose in hello: all (every session) or subscribed (only subscribed sessions)
  ws_output_scope_default: all
  # Gzip-compress large JSON /api/* responses for clients that accept gzip
  api_gzip: true
  # Only compress /api/* responses larger than this many bytes (min 0)
  api_gzip_min_bytes: 1024
  # Auto-restart daemon when config is saved via web UI
  auto_restart_on_config: false
  # Hide toast notifications for the currently viewed session
  suppress_active_toasts: true
  # Extra directories a project directory may lie under. The allowed roots are
  # the PRD worktree base (autonomous.worktree_dir), then the workspace root
  # (session.workspace_root when set, otherwise the workspace folder ~/workspace),
  # plus the folders in this list. The first two are always allowed. A session,
  # automaton or test run whose project directory is outside every root is
  # refused. Symlinks and '..' are resolved before the check.
  allowed_project_roots: []

  # All existing server.* defaults are unchanged. At every start the daemon
  # also warns, one line per affected listener, for any of these listeners
  # that is enabled, not token-protected, and bound to a non-loopback
  # address:
  #   rest           (server.token)
  #   rest_tls       (server.ttls)
  #   mcp_sse        (mcp.token, or server.token when mcp.token is empty)
  #   proxy_sandbox  (server.token — same as `rest`; warned when enabled and the token is empty)
  #   webhook        (webhook.token)
  #   github_webhook (github_webhook.secret)
  # The twilio_webhook listener has no built-in auth and is never warned.
  # Set to true only after you have deliberately reviewed each of those
  # listeners. It silences that warning for them and sets the
  # `acknowledged` flag on the matching entries of the /api/health
  # `listeners` array and the listener_* diagnose checks. It does not
  # change the bind address, the token, or the warning condition itself.
  # Default: false (the warning is active).
  acknowledge_unauthenticated: false

# ── MCP Server ──
# Model Context Protocol server for IDE and AI agent integrations.
mcp:
  # Enable MCP stdio transport (Cursor, Claude Desktop, VS Code)
  enabled: true
  # Enable HTTP/SSE transport for remote AI clients
  sse_enabled: false
  # SSE bind interface (127.0.0.1 for local, 0.0.0.0 for remote)
  sse_host: 127.0.0.1
  # SSE listen port
  sse_port: 8081
  # Max time to retry failed SSE TCP binds with exponential backoff
  # (1s, 2s, 4s, ... capped at 15s between attempts), e.g. while a
  # previous daemon instance is still releasing its port. Zero or
  # negative values fall back to the 120s default.
  sse_bind_timeout: 120s
  # Public base URL advertised to SSE clients in the "endpoint" event.
  # Set this when the SSE server is bound to localhost behind a
  # TLS-terminating reverse proxy (Tailscale serve, Caddy, nginx), e.g.
  # "https://host.tailnet.example.net:8081" (example value only; your real
  # URL lives in your operator config and is not committed). Trailing slash is ignored.
  # Empty = advertise <scheme>://<first sse_host>:<sse_port>.
  public_url: ""
  # Bearer token for SSE connections. Empty falls back to server.token
  # (SEC-002) — MCP SSE is open only when BOTH this and server.token
  # are empty.
  token: ""
  # Enable TLS for SSE server
  tls_enabled: false
  # Auto-generate self-signed cert
  tls_auto_generate: true
  # Path to TLS certificate PEM file
  tls_cert: ""
  # Path to TLS private key PEM file
  tls_key: ""

# ── Signal ──
# Signal messenger integration via signal-cli subprocess.
signal:
  # Signal phone number in E.164 format (e.g. +12125551234)
  account_number: ""
  # Signal group ID in base64. Get via: signal-cli listGroups
  group_id: ""
  # signal-cli data directory
  config_dir: /var/lib/signal-cli
  # Name shown in Signal's Linked Devices list
  device_name: peer-d

# ── Messaging Backends ──
# Communication channels for commands and notifications.
telegram:
  # Enable Telegram bot
  enabled: false
  # Bot token from @BotFather
  token: ""
  # Chat/group ID
  chat_id: 0
  # Auto-manage group membership
  auto_manage_group: false
discord:
  # Enable Discord bot
  enabled: false
  # Bot token
  token: ""
  # Channel ID
  channel_id: ""
  # Auto-manage channel
  auto_manage_channel: false
slack:
  # Enable Slack bot
  enabled: false
  # OAuth bot token
  token: ""
  # Channel ID
  channel_id: ""
  # Auto-manage channel
  auto_manage_channel: false
imap_mcp:
  # Enable the imap-mcp email command channel
  enabled: false
  # imap-mcp API base URL
  url: "http://localhost:8765"
  # imap-mcp account name; empty = use imap-mcp's default account
  account: ""
  # Prefix for outbound reply subjects
  subject_prefix: "datawatch"
  # Bearer token (GH#203) imap-mcp >= 0.5.3 requires on every request
  # except GET /api/health. Accepts a ${secret:name} reference so the
  # value never lives here in plaintext. Needs the "read" and "send"
  # scopes on the imap-mcp side. Empty = no Authorization header sent
  # (fine against imap-mcp <= 0.5.2, or with auth disabled there).
  token: ""
  # Outbound recipient address. Required for any reply/notification to
  # actually deliver -- without it, the generic comm-channel router
  # addresses outbound sends to its own internal channel label
  # ("imap_mcp"), not a real address, which SMTP correctly bounces.
  to: ""
matrix:
  # Enable Matrix homeserver
  enabled: false
  # Homeserver URL
  homeserver: ""
  # Bot user ID (@bot:host)
  user_id: ""
  # Access token
  access_token: ""
  # Room ID
  room_id: ""
  # Auto-manage room
  auto_manage_room: false
twilio:
  # Enable Twilio SMS
  enabled: false
  # Account SID
  account_sid: ""
  # Auth token
  auth_token: ""
  # From phone number
  from_number: ""
  # To phone number
  to_number: ""
  # Webhook listen address
  webhook_addr: "127.0.0.1:9003"
ntfy:
  # Enable ntfy push notifications
  enabled: false
  # ntfy server URL
  server_url: "https://ntfy.sh"
  # Topic name
  topic: ""
  # Auth token (optional)
  token: ""
email:
  # Enable email notifications
  enabled: false
  # SMTP host
  host: ""
  # SMTP port
  port: 587
  # SMTP username
  username: ""
  # SMTP password
  password: ""
  # From address
  from: ""
  # To address
  to: ""
github_webhook:
  # Enable GitHub webhook
  enabled: false
  # Listen address
  addr: "127.0.0.1:9001"
  # HMAC webhook secret
  secret: ""
webhook:
  # Enable generic webhook
  enabled: false
  # Listen address
  addr: "127.0.0.1:9002"
  # Bearer token (optional)
  token: ""
  # Directory the image_url-as-local-file-path feature is scoped to; empty disables that feature (data: URIs still work either way)
  image_dir: ""

# ── DNS Channel ──
# Covert command channel via DNS TXT queries with HMAC-SHA256 authentication.
dns_channel:
  # Enable DNS channel
  enabled: false
  # Operating mode: server (authoritative DNS) or client (query via resolver)
  mode: ""
  # Domain name for DNS queries
  domain: ""
  # Server bind address (e.g. :53 or 0.0.0.0:53)
  listen: ""
  # Client upstream resolver (e.g. 8.8.8.8:53)
  upstream: ""
  # Shared HMAC-SHA256 secret for authentication
  secret: ""
  # Max queries per IP per minute (0 = unlimited)
  rate_limit: 0
  # DNS response TTL in seconds (0 = non-cacheable)
  ttl: 0
  # Max response bytes before truncation
  max_response_size: 0
  # Client polling interval (Go duration, e.g. 5s)
  poll_interval: ""

# ── ACME / Let's Encrypt (BL397) ──
# Native ACME subsystem -- the daemon itself obtains and renews a
# browser-trusted cert. See operations.md "Native ACME / Let's Encrypt".
acme:
  # Master switch
  enabled: false
  # staging (default, untrusted certs, safe to test) | production
  endpoint: staging
  # One or more hostnames, all on ONE cert. Requires an A/AAAA record
  # for each, pointing at this host.
  domains: []
  # Validation method: http01 (no DNS management, no wildcard) | dns01
  # (wildcard support, needs a provider token -- no port 80 needed)
  method: http01
  http01:
    # Optional: override which address the HTTP-01 challenge is served
    # on. Empty = the daemon's existing HTTP mux (server.port must be 80
    # for real Let's Encrypt validation -- see operations.md).
    listen: ""
  dns01:
    # Only "cloudflare" is wired in this build.
    provider: cloudflare
    # ${secret:name} reference to a ZONE-SCOPED "Zone > DNS > Edit" token
    # -- never the account-global key. Resolved in memory only; this
    # reference, never the resolved token, is what config.yaml keeps on
    # disk, even after a renewal.
    token_secret: ""
    # Reference only (not used by the provider call itself) -- documents
    # which zone the token above is scoped to.
    zone_id: ""
  # Renew when the cert's remaining life drops to this many days (90-day
  # Let's Encrypt certs; 30 matches common certbot/Caddy practice)
  renewal_days: 30
  retry:
    # Retry cadence after a failed order attempt
    interval_minutes: 30
    # Pause (alert + stop retrying) after this many consecutive failures
    max_consecutive_failures: 5
  apply:
    # true: most renewals apply with zero downtime (the listener reloads
    # the cert from disk on its next handshake); the first-ever switch to
    # ACME still restarts once. false (default): always restart to apply.
    hot_swap: false
    # Also point mcp.tls_cert/tls_key at the same issued cert (MCP's SSE
    # endpoint shares the same public host, just a different port)
    update_mcp_cert: true

# ── Push ──
# Validation for outbound mobile push endpoints (POST /api/push/register). Loopback/link-local/metadata addresses are always rejected regardless of these flags.
push:
  # Allow http:// (not just https://) push endpoints, e.g. a LAN ntfy instance with no TLS
  allow_insecure_endpoints: false
  # Also reject RFC1918/Tailscale-CGNAT/IPv6-ULA endpoints -- most self-hosted push distributors live there, so this defaults off
  block_private_endpoints: false
  # Apple Push Notification service dispatch (BL397 Phase 4 / BL335).
  # See operations.md "APNs Push Notifications".
  apns:
    enabled: false
    key_id: ""       # 10-char Auth Key ID from the Apple Developer portal
    team_id: ""      # 10-char Apple Developer Team ID
    bundle_id: ""    # the iOS app's bundle identifier
    # ${secret:name} reference to the .p8 Auth Key's PEM contents.
    # key_path (a file path) also works and is used if key_secret is empty.
    key_secret: ""
    key_path: ""
    # true = api.sandbox.push.apple.com (TestFlight/dev builds);
    # false (default) = api.push.apple.com (App Store builds)
    sandbox: false

# HTTP access / WS lifecycle / auth-failure log. See operations.md
# "Audit & Access Logging".
audit:
  # Log every HTTP request/response, auth failure, and WS connect/
  # disconnect to <data_dir>/access.log (method, path, status, remote
  # IP, user agent, resolved principal -- never the Authorization
  # header or a token value). Separate from the operator action log
  # (audit.log) since request volume is much higher.
  access_log_enabled: true
  # Prune entries older than this from both audit.log and access.log.
  # 0 = use the default (30). Negative = never prune.
  retention_days: 30
  # Additionally write a CEF-formatted line (<file>.cef) alongside every
  # entry in both logs, for forwarding to a SIEM (Splunk/QRadar/
  # ArcSight/Sentinel). Opt-in -- most operators don't run a SIEM.
  cef_mirror_enabled: false

cross_session:
  # Inject the Cross-Session Communication Rule into spawned
  # claude-code sessions' CLAUDE.md -- steers the LLM toward
  # datawatch's own audited memory/discussion/reply MCP tools instead
  # of Claude Code's native cross-session messaging, for anything
  # that should be audited or might cross a host/container boundary.
  # Mirrors memory.session_awareness's shape: an instruction-injection
  # toggle, not a subsystem toggle, so it defaults to true.
  enabled: true

# ── LLM Backends ──
# AI coding assistant backend configurations. Each has optional console_cols/console_rows for terminal size.
ollama:
  # Enable Ollama backend
  enabled: false
  # Model name (e.g. llama3, codellama)
  model: llama3
  # Ollama API URL
  host: "http://localhost:11434"
  # Terminal width (0 = use session default)
  console_cols: 0
  # Terminal height (0 = use session default)
  console_rows: 0
openwebui:
  # Enable OpenWebUI backend
  enabled: false
  # OpenWebUI server URL
  url: "http://localhost:3000"
  # Model name
  model: llama3
  # API key
  api_key: ""
  # Terminal width
  console_cols: 0
  # Terminal height
  console_rows: 0
aider:
  # Enable aider backend
  enabled: false
  # Path to aider binary
  binary: aider
  # Terminal width
  console_cols: 0
  # Terminal height
  console_rows: 0
pi:
  # Enable pi backend (interactive mode)
  enabled: false
  # Path to pi binary
  binary: pi
  # Model as "provider/model" (e.g. ollama/qwen3.8:27b); empty uses pi's own default
  model: ""
  # Level passed to pi's own --thinking flag on every pi launch (pi-prompt
  # one-shots and pi sessions). empty = don't pass the flag (pi's model
  # default); allowed: off, minimal, low, medium, high. Per-task/story/PRD
  # thinking-LLM overrides take precedence over this global default.
  thinking_level: ""
  # Terminal width
  console_cols: 0
  # Terminal height
  console_rows: 0
pi_prompt:
  # Enable pi-prompt backend (one-shot `pi --print` mode)
  enabled: false
  # Path to pi binary; defaults to pi.binary when empty
  binary: ""
  # Model as "provider/model"; empty uses pi.model or pi's own default
  model: ""
  # Terminal width
  console_cols: 0
  # Terminal height
  console_rows: 0
goose:
  # Enable goose backend
  enabled: false
  # Path to goose binary
  binary: goose
  # Terminal width
  console_cols: 0
  # Terminal height
  console_rows: 0
  # Provider to inject via GOOSE_PROVIDER (e.g. anthropic, openai, google)
  provider: ""
  # Model to inject via GOOSE_MODEL (e.g. claude-sonnet-5, gpt-4o)
  model: ""
  # API key — prefer a ${secret:name} reference (secrets store); a literal value still works.
  # Injected as the provider-specific key env var. Never logged.
  api_key_ref: ""
  # When true, inject GOOSE_MCP__DATAWATCH__* env vars so Goose connects back
  # to this daemon as an MCP server (stdio transport, caller-session-id threaded through).
  channel_enabled: false
gemini:
  # Enable Gemini CLI backend
  enabled: false
  # Path to gemini binary
  binary: gemini
  # Terminal width
  console_cols: 0
  # Terminal height
  console_rows: 0
opencode:
  # Enable opencode backend
  enabled: false
  # Path to opencode binary
  binary: opencode
  # Default model written to opencode.json at session start (e.g. "opencode/big-pickle").
  # Free built-in models are always available; cloud provider models appear after
  # running `opencode providers login <provider>`.
  default_model: opencode/big-pickle
  # Max idle gap between streamed SSE chunks from an ollama/* model before
  # opencode aborts the request (seconds). Written into opencode.json's
  # provider.ollama.options.chunkTimeout. OpenCode's own default is 300s,
  # which is shorter than long "thinking" pauses on large local models.
  # 0 = use opencode's built-in default.
  ollama_chunk_timeout_sec: 1200
  # Max wait for response headers from an ollama/* model, i.e. cold-load
  # time (seconds). Written into opencode.json's
  # provider.ollama.options.headerTimeout. 0 = use opencode's built-in
  # default (300s).
  ollama_header_timeout_sec: 900
  # Enable ACP (Analysis Code Plugin) mode
  acp_enabled: false
  # Enable opencode-prompt mode
  prompt_enabled: false
  # ACP startup timeout (seconds)
  acp_startup_timeout: 0
  # ACP health check interval (seconds)
  acp_health_interval: 0
  # ACP message timeout (seconds)
  acp_message_timeout: 0
  # Terminal width
  console_cols: 0
  # Terminal height
  console_rows: 0
# OpenCode-ACP dedicated config (overrides opencode.acp_* when present)
opencode_acp:
  # Enable ACP backend
  enabled: false
  # Path to opencode binary (defaults to opencode.binary if empty)
  binary: ""
  # Output mode: "chat" (default, rich chat UI), "log" (raw log view), "terminal"
  output_mode: chat
  # ACP startup timeout (seconds, 0 = default 30s)
  acp_startup_timeout: 0
  # ACP health check interval (seconds, 0 = default 5s)
  acp_health_interval: 0
  # ACP message timeout (seconds, 0 = default 30s)
  acp_message_timeout: 0
  # Terminal width
  console_cols: 0
  # Terminal height
  console_rows: 0
shell_backend:
  # Enable shell script backend
  enabled: false
  # Script path (empty = interactive shell)
  script_path: ""
  # Terminal width
  console_cols: 0
  # Terminal height
  console_rows: 0

# ── Detection Filters ──
# Configurable patterns for session state detection. One pattern per line.
detection:
  # Patterns indicating LLM is waiting for input (empty = use built-in defaults)
  prompt_patterns: "[]"
  # Patterns indicating session completed
  completion_patterns: "[]"
  # Patterns indicating rate limit hit
  # (the shipped default is the built-in per-backend table in
  # internal/session/rate_limit_lines.go; a non-empty list replaces it)
  rate_limit_patterns: "[]"
  # Explicit protocol markers for input needed
  input_needed_patterns: "[]"
  # Seconds to wait after detecting a prompt before transitioning to waiting_input.
  # If new output arrives during this window, the timer resets.
  # Prevents false positives during LLM thinking pauses. Default: 3
  prompt_debounce: 3
  # Minimum seconds between repeated needs-input notifications per session.
  # Prevents notification floods. Default: 15
  notify_cooldown: 15
  alert_settle: 45     # seconds a session must stay waiting before a needs-input alert/push is sent (0 = default)
  alert_repeat: 300    # seconds an identical needs-input alert for the same session is suppressed (0 = default)

# ── RTK (Rust Token Killer) ──
# Token savings tracking via RTK proxy. See: https://github.com/rtk-ai/rtk
rtk:
  # Enable RTK integration (detection, stats, auto-init)
  enabled: false
  # Path to RTK binary (default: "rtk" from PATH)
  binary: rtk
  # Display token savings in system statistics dashboard
  show_savings: true
  # Auto-run 'rtk init -g' if hooks not installed (only for supported backends: claude-code, gemini, aider)
  auto_init: true
  # Seconds between 'rtk discover' checks for optimization opportunities (0 = disabled)
  discover_interval: 0
  # Auto-update RTK binary when a new version is available on GitHub
  auto_update: false
  # Seconds between version checks against GitHub releases (default: 86400 = daily, 0 = disabled)
  update_check_interval: 86400

# ── Pipelines (Session Chaining) ──
# Chain tasks in a DAG with parallel execution and dependency tracking.
pipeline:
  # Max tasks running simultaneously (default: 3)
  max_parallel: 3
  # Override session.llm_backend for pipeline tasks (empty = use session default)
  default_backend: ""
  # BL28 — quality gates: capture a test baseline before the pipeline runs
  # and compare with a post-pipeline run. Block completion on regression.
  quality_gates:
    enabled: false
    # Test command to run for baseline + post-pipeline comparison.
    # ONE string, run through a shell (`sh -c`) in the project directory, so
    # compound commands such as "go test ./... && node --test web/*.test.js"
    # work. A baseline that cannot produce usable results (could not start,
    # timed out, non-zero exit with no named failing test, no tests found)
    # is invalid and only warns. Regressions are compared by failing test
    # name. Operators guide: docs/operations.md -> "Quality gate".
    # Examples: "go test ./...", "pytest", "npm test", "cargo test"
    test_command: ""
    # Seconds before the test command is killed (default 300).
    timeout: 300
    # When true, a regression (more failing tests than baseline) marks
    # the pipeline as failed and stops downstream work.
    block_on_regression: false

# ── Whisper Voice Transcription ──
# Transcribes voice messages from messaging backends (Telegram, Signal) into text commands.
# Requires: pip install openai-whisper in a Python venv, ffmpeg on PATH.
whisper:
  # Enable voice message transcription
  enabled: false
  # Whisper model size: tiny, base, small, medium, large (larger = more accurate, slower)
  model: base
  # ISO 639-1 language code (e.g. "en", "es", "de", "ja", "zh").
  # Set to "auto" for automatic detection. Full list: https://github.com/openai/whisper#available-models-and-languages
  # NOTE: per-user language selection planned for the multi-user access control feature.
  language: en
  # Path to the Python virtualenv containing the whisper CLI.
  # Relative paths are resolved from the datawatch working directory.
  venv_path: .venv
  # Longest audio slice (seconds) handed to the local whisper process in one go.
  # Longer recordings are split and transcribed slice by slice so memory stays flat.
  # 0 disables chunking; otherwise the value must be >= 30 (whisper's own window is 30 s).
  # Other values are ignored when set through the API. Local whisper backend only.
  chunk_seconds: 120

# ── Vision Image Description ──
# Describes image attachments from messaging backends (Signal, Telegram) as text.
# Backends: "ollama" (default, native /api/generate); "openai" / "openai_compat" (/v1/chat/completions).
vision:
  # Enable image attachment description
  enabled: false
  # Backend type: "ollama" (default) | "openai" | "openai_compat"
  backend: ollama
  # Base URL of the vision model server (required when enabled)
  endpoint: http://localhost:11434
  # Bearer credential. Optional for self-hosted; required for upstream OpenAI.
  api_key: ""
  # Vision model name — must be vision-capable. Examples: llava, moondream, gpt-4o, llava-phi3.
  # No auto-detection — model must be specified explicitly.
  model: llava
  # Default description prompt. Leave empty to use the built-in default.
  default_prompt: ""
  # Maximum image size in bytes before rejection. 0 = 10 MB default.
  max_image_bytes: 0
  # Per-request timeout for image description, in seconds. 0 or negative = 5 s default.
  describe_timeout_seconds: 0

# ── Web Search (BL391 — multi-provider registry) ──
# Inject a web_search MCP tool into opencode and goose agent sessions, backed
# by one or more named search providers tried in priority order (lowest
# first), with an internal result cache and usage tracking.
# Access: YAML | REST /api/websearch/* | CLI (datawatch websearch ...) |
#         MCP (websearch_* tools) | comm channel (read-only + enable/disable) |
#         Web UI Settings > LLM > Web Search.
web_search:
  # Set to true to enable the web_search MCP tool injection.
  enabled: false
  # Internal result cache — serves repeated identical queries without a new
  # provider call, reducing paid API usage (Brave bills per call).
  cache_enabled: true
  # Default cache TTL in seconds. A provider's own cache_ttl_seconds (below)
  # overrides this per-provider.
  cache_ttl_seconds: 900
  # Named providers, tried in priority order (lowest first). A provider that
  # "succeeds" with zero results is treated as a miss and the next provider
  # is tried — defends against silent provider-side degradation (GH#165).
  providers:
    - name: searxng-primary
      type: searxng           # searxng | brave
      enabled: true
      priority: 0
      # Base URL of the SearXNG instance (searxng only).
      url: ""
      # SearXNG engine(s). Use "bing" — other engines are CAPTCHA/rate-limited.
      # Known limitation: even bing's scraped results are intermittently
      # degraded for compound/multi-word queries (likely Bing-side
      # anti-scraping, not fixable via config) — see
      # docs/datawatch-definitions.md Web Search section.
      engine: bing
      num_results: 10
    # - name: brave-fallback
    #   type: brave
    #   enabled: true
    #   priority: 1
    #   # Literal key or a ${secret:name} ref — set via the secrets vault
    #   # (CLI: datawatch secrets set <name>, or PWA Settings), never a
    #   # plaintext key committed to this file.
    #   api_key: "${secret:brave_search_api_key}"
    #   num_results: 10
  # --- Legacy single-provider fields (pre-BL391) ---
  # Still read for backward compatibility: if providers[] above is empty and
  # any of these are set, a single "default" provider is synthesized from
  # them at load time. New configs should use providers[] instead.
  provider: searxng
  url: ""
  engine: bing
  num_results: 10

# ── Remote Servers (Proxy Mode) ──
# Configure remote datawatch instances for multi-machine management.
# The proxy instance forwards commands and relays WebSocket connections.
# Access methods: CLI (datawatch setup server), Web UI (Settings > Comms > Servers), YAML.
servers:
  # Each entry defines a remote datawatch instance:
  # - name: prod                  # short name — used in 'new: @prod: task' and CLI --server
  #   url: http://203.0.113.10:8080  # base URL of the remote instance
  #   token: "bearer-token"       # must match server.token on the remote
  #   enabled: true               # toggle without removing
  # - name: pi
  #   url: http://203.0.113.50:8080
  #   token: "another-token"
  #   enabled: true
  # - name: self-signed-peer
  #   url: https://homelab.local:8443
  #   enabled: true
  #   tls_skip_verify: true       # disables TLS cert verification for THIS peer
  #                               # only — every other peer keeps full
  #                               # verification. Only for a self-signed/
  #                               # local-dev peer on a trusted network.
  # - name: gpu-twin
  #   url: http://203.0.113.11:8080
  #   enabled: true
  #   fingerprint_sync: false     # opt THIS peer into the resource-fingerprint
  #                               # exchange (the peer-side flag; the other
  #                               # daemon must also opt you). Opt-in per peer
  #                               # on BOTH sides, default false, and both
  #                               # daemons need the `federation:fingerprint`
  #                               # capability (full-control set only). Once
  #                               # both sides are in they periodically (~10
  #                               # min by default) exchange per-pair-hashed
  #                               # node identities (the node's own GPU UUID or
  #                               # cloud instance ID) and LLM billing-group
  #                               # labels; a hit becomes a PENDING match that
  #                               # only you can confirm or reject (CLI:
  #                               # `datawatch federation fingerprint list`,
  #                               # PWA Settings, comm
  #                               # `federation fingerprint ...`) — never
  #                               # automatic. A confirmed shared compute node
  #                               # means the peer's admitted hold also counts
  #                               # against local capacity; a peer outage
  #                               # never stalls local work. No raw value ever
  #                               # leaves the daemon — see
  #                               # docs/howto/federation-fingerprint.md.
# Requires daemon restart after changes. The proxy will:
# - Forward HTTP API calls via /api/proxy/{server}/*
# - Relay WebSocket connections via /api/proxy/{server}/ws
# - Aggregate sessions from all remotes in 'list' command and /api/sessions/aggregated
# - Auto-route commands (send, kill, status, tail) to the owning remote
# - Support explicit routing: 'new: @server: task'

# ── Profiles & Fallback ──
# Named backend profiles for different accounts/API keys.
# Each profile overrides the base backend config with custom env vars, binary, or model.
# Profiles are managed via web UI (Settings > Profiles & Fallback),
# REST API (GET/POST/DELETE /api/profiles), or YAML.
profiles:
  # Example profile with env var overrides:
  # claude-personal:
  #   backend: claude-code
  #   env:
  #     ANTHROPIC_API_KEY: "sk-ant-..."
  # gemini-fallback:
  #   backend: gemini
  #   env:
  #     GEMINI_API_KEY: "AIza..."

# Fallback chain — ordered list of profile names to try when primary hits rate limit.
# Configured under session.fallback_chain in the session section above.
# Example: fallback_chain: ["claude-personal", "gemini-fallback"]

# ── Autonomous PRD Planning (BL24+BL25 — v3.10.0, BL304 rename) ──
# LLM-driven Product Requirements Document → Stories → Tasks
# planning with independent verification. Disabled by default.
# See docs/api/autonomous.md for the full contract.
# LLM registry entries (the `llms:` list; manage with `datawatch llm ...`).
# Each entry may carry a per-LLM verification_mode key:
#   llms:
#     - name: <llm-name>
#       verification_mode: generate    # default "generate" (empty string too)
# verification_mode: how this LLM judges a verification.
#   "" or "generate" (default) asks the judge to write a verdict and parses it.
#   "classify" reads the judge's option probabilities instead and fails closed
#   (missing scores, timeouts, transport errors and abstains become a block
#   with an infra category; a block is never downgraded). Set it with
#   `datawatch llm update <name> --verification-mode classify`, MCP
#   llm_update, PUT on the LLM entry, or the Verification mode selector in
#   the web app LLM settings. (The `llms:` block above is a documentation
#   example, kept commented so this file is not a live registry entry.)

classifier:
  # Publishers a classify-mode judge model may come from. Default empty: no
  # publisher is trusted until the operator adds one. Add with explicit
  # confirmation (REST/MCP/CLI/chat "add publisher ... confirm"); each
  # addition is audited. Not settable through PUT /api/config.
  publisher_allowlist: []

  # ── Client tunables (read on every classify call; no restart needed) ──
  # Every key below is settable through PUT /api/config, `datawatch config set
  # classifier.<key>=<value>`, comm `configure classifier.<key>=<value>` and
  # the web Settings → Classifier section (all five locales). A zero reads as
  # the documented default (rotate_options: false is stored as false).
  # Bound on one classify call, in whole seconds. Default 30. A timeout is a
  # block with an infra category.
  timeout_seconds: 30
  # top_logprobs asked for on the generic (logprobs) path. Default 10.
  top_logprobs: 10
  # The chosen option must lead the runner-up by at least this probability,
  # otherwise the call abstains. 0 to 1. Default 0.10.
  abstain_margin: 0.10
  # The chosen option must reach this probability, otherwise the call
  # abstains. 0 to 1. Default 0.50.
  min_probability: 0.50
  # Generic path: the option tokens must hold at least this share of the
  # first-token probability, otherwise the scores are treated as missing.
  # 0 to 1. Default 0.50.
  min_option_mass: 0.50
  # Rotate the option order across calls and average the scores (generic path
  # only; the native path never rotates). Default false.
  rotate_options: false
  # Case-insensitive model-name substrings whose chat templates get thinking
  # disabled on the generic path. Default ["qwen3"].
  thinking_off_models: ["qwen3"]
  # How long a capability probe result (supported or unsupported) is cached,
  # in whole seconds. Unknown is never cached. Default 600.
  probe_ttl_seconds: 600
  # Per-probe HTTP timeout in whole seconds. A timeout is state unknown.
  # Default 5.
  probe_timeout_seconds: 5

  # ── Calibration tunables ──
  calibration:
    # Share of samples held out for scoring, 0 up to (not including) 1.
    # Default 0.30.
    test_fraction: 0.30
    # Salt for the deterministic fit/test split. Default
    # "classifier-calibration".
    split_seed: classifier-calibration
    # Least number of fit samples a threshold may be fitted on. Default 20.
    min_fit_samples: 20
    # False blocks one false pass costs when the threshold is chosen (a false
    # pass is worse). Default 5.
    false_pass_weight: 5
    # Position-mass deviation from uniform at or above which rotation is
    # recommended. 0 to 1. Default 0.10.
    rotation_bias_threshold: 0.10
    # Share of items whose winning option changes across rotations at or above
    # which rotation is recommended. 0 to 1. Default 0.10.
    rotation_flip_threshold: 0.10

# ── Resource limits ──
# Memory ceiling for Automaton worker panes and verification runs. See
# docs/operations.md#memory-ceiling. A project (memory_limit) or a task kind
# (autonomous.memory_limit_by_kind) can override the result with a whole MB
# number, or "none" for no ceiling.
resource_limits:
  # Share of host memory a run may use, 1 to 100. 0 or unset reads 50.
  memory_share_percent: 50
  # Lowest ceiling, whole MB. 0 or unset reads 2048. Not above the cap.
  memory_floor_mb: 2048
  # Highest ceiling, whole MB. 0 or unset reads 16384.
  memory_cap_mb: 16384

autonomous:
  # Opt-in switch. When false every /api/autonomous/* returns 503.
  enabled: false
  # Background loop tick in seconds.
  poll_interval_seconds: 30
  # ── Lifecycle event notification sinks ──
  # Documented as autonomous.notify.default_events elsewhere (see
  # docs/implementation.md "Lifecycle event sinks" and the PWA settings
  # card under Settings → General → Automate).
  # Automation (chained Automatons) coordination. idle_alert_minutes: raise
  # one alert when an active Automation has sat idle (a member finished and no
  # next member started) this many minutes. Whole number >= 0; 0 = off.
  # Settable via PUT /api/config, MCP autonomous_config_set
  # (automation_idle_alert_minutes), CLI `datawatch config set
  # autonomous.automation.idle_alert_minutes=30`, comm `configure
  # autonomous.automation.idle_alert_minutes=30`, and the PWA Settings field
  # (settings_automation_idle_alert_minutes).
  #
  # triage_alert_minutes: whole number >= 0. How long an Automaton may sit
  # failed or blocked (the coordinator's poll-time triage pass times failed and
  # blocked Automaton records, not waiting-for-next-member) before the daemon
  # raises one triage alert for the episode. Unlike idle_alert_minutes, an unset
  # key is read as 30, and an explicit 0 turns triage alerts off. Settable via PUT
  # /api/config (key autonomous.automation.triage_alert_minutes; GET /api/config
  # shows the effective value), CLI `datawatch config set
  # autonomous.automation.triage_alert_minutes=45`, comm `configure
  # autonomous.automation.triage_alert_minutes=45`, the MCP autonomous_config_set
  # tool (automation_triage_alert_minutes), and the PWA Settings field
  # (settings_automation_triage_alert_minutes). A negative, fractional, or
  # non-numeric value is rejected with 400 on PUT /api/config, and nothing is
  # written. On config load a negative value is an error and a non-numeric value
  # fails to parse; a fractional YAML number such as 1.5 is not refused, the YAML
  # decoder narrows it to a whole number (1.5 loads as 1).
  #
  # merge_pending_mode: string, `off` (default), `shadow` or `on`. Controls the
  # merge-pending check of finished Automaton work branches, which compares each
  # completed Automaton's branch with main and sorts it into merged, pending,
  # needs_look, empty or unknown. `off` means the check does not run at all: git
  # is never called, no state is kept, and the merge reads return empty lists.
  # `shadow` runs the check and records what it would have done (state, commits
  # ahead of main, whether it would have alerted) in a bounded history served by
  # GET /api/autonomous/merge, but raises no alert and writes no merge-pending
  # record. `on` writes a merge-pending record for a finished Automaton whose
  # branch has commits not on main and raises the alert (see
  # merge_pending_alert_minutes). A key that is absent, or an empty value in the
  # YAML file, reads as `off`. Any other value is refused on load; PUT
  # /api/config and the Automata config object refuse an empty string and any
  # value outside the three words with 400, and nothing is written. Nothing in
  # any mode merges, deletes or pushes. Settable via PUT /api/config (key
  # autonomous.automation.merge_pending_mode; GET /api/config shows the
  # effective value), CLI `datawatch config set
  # autonomous.automation.merge_pending_mode=shadow`, comm `configure
  # autonomous.automation.merge_pending_mode=shadow`, the MCP
  # autonomous_config_set tool (automation_merge_pending_mode), and the PWA
  # Settings field (settings_automation_merge_pending_mode). Applies on the next
  # coordinator poll, no restart.
  #
  # merge_pending_alert_minutes: whole number >= 0. How long a finished Automaton
  # branch may sit merge pending (commits not on main) before the daemon raises
  # one merge-pending alert for the episode. Only used in `on` mode; in `shadow`
  # mode it only decides each recorded decision's would_alert flag. Like
  # triage_alert_minutes, an unset key is read as 30 and an explicit 0 turns the
  # alert off (the merge-pending record is still written in `on` mode, and
  # shadow decisions always report would_alert false). A negative, fractional or
  # non-numeric value is rejected with 400 on PUT /api/config, and nothing is
  # written; on config load a negative value is an error. Settable via PUT
  # /api/config (key autonomous.automation.merge_pending_alert_minutes), CLI
  # `datawatch config set autonomous.automation.merge_pending_alert_minutes=45`,
  # comm `configure autonomous.automation.merge_pending_alert_minutes=45`, the
  # MCP autonomous_config_set tool (automation_merge_pending_alert_minutes), and
  # the PWA Settings field (settings_automation_merge_pending_alert_minutes).
  #
  # merged_member_policy: string, `completed` (default), `manual` or `block`.
  # Decides what an Automaton does when a member ends cancelled or completed
  # and its work is already merged into the project's own default branch (the
  # daemon proves this with git; a branch that is not merged, or whose state
  # cannot be read, always keeps the blocked outcome). `completed` treats the
  # member as completed, so the chain follows its on_complete edge. `manual`
  # keeps the blocked outcome and adds the merge proof to the block reason, so
  # the operator can resolve it with resume or skip. `block` keeps the blocked
  # outcome and runs no git check at all. A key that is absent, or an empty
  # value in the YAML file, reads as `completed`. Any other value is refused on
  # load; PUT /api/config and the Automata config object refuse an empty string
  # and any value outside the three words with 400, and nothing is written.
  # Settable via PUT /api/config (key
  # autonomous.automation.merged_member_policy; GET /api/config shows the
  # effective value), CLI `datawatch config set
  # autonomous.automation.merged_member_policy=manual`, comm `configure
  # autonomous.automation.merged_member_policy=manual`, and the MCP
  # autonomous_config_set tool (automation_merged_member_policy). Applies to
  # the next member that ends, no restart.
  #
  # agent_insert_policy: string, `allow` (default) or `require_operator`; any
  # other value is rejected (400 on PUT /api/config, an error on config load),
  # and an empty value means allow. Decides what happens when a session or
  # agent (an actor starting `session:` or `agent:`) calls insert_member on an
  # Automation that is still a draft: `allow` adds the member at once, and
  # `require_operator` holds it as a pending insert until the operator calls
  # approve_insert. An insert into a started Automation (active, paused or
  # blocked) is always held for approve_insert, whatever the policy, and only
  # the operator may approve. At most one urgent insert may be pending per
  # Automation. Settable on the same paths as idle_alert_minutes: PUT
  # /api/config (key autonomous.automation.agent_insert_policy; GET /api/config
  # shows the effective value), CLI `datawatch config set
  # autonomous.automation.agent_insert_policy=require_operator`, comm
  # `configure autonomous.automation.agent_insert_policy=require_operator`, and
  # the MCP config_set tool when mcp.allow_self_config is on.
  #
  # create_search_mode: string, `off`, `shadow` (default) or `on`; any other
  # value is rejected (400 on PUT /api/config, an error on config load), and an
  # empty value reads as shadow. Controls the over-duplicate pre-check that
  # searches the existing sources before a new Automaton is created
  # (search-before-create): `off` never searches, `shadow` searches and
  # surfaces the over-duplicate warning to the operator while the creation
  # still proceeds, and `on` searches and holds a new Automaton back to the
  # operator when it over-duplicates an existing one. Settable via REST GET
  # /api/config (key autonomous.automation.create_search_mode; shows the
  # effective value), REST PUT /api/config, the MCP autonomous_config_set tool
  # (automation_create_search_mode), CLI `datawatch config set
  # autonomous.automation.create_search_mode=on`, and comm `configure
  # autonomous.automation.create_search_mode=on`.
  #
  # create_search_threshold: number in the open-closed interval (0, 1]; unset
  # reads the 0.5 default. The over-duplication score at or above which an
  # existing Automaton counts as the over-duplicate of the new one: a zero,
  # negative, above-1, non-finite or non-numeric value is rejected with 400
  # on PUT /api/config (nothing is written), and an out-of-range value is an
  # error on config load. Settable via REST GET /api/config (key
  # autonomous.automation.create_search_threshold; shows the effective
  # value), REST PUT /api/config, the MCP autonomous_config_set tool
  # (automation_create_search_threshold), CLI `datawatch config set
  # autonomous.automation.create_search_threshold=0.8`, and comm `configure
  # autonomous.automation.create_search_threshold=0.8`.
  #
  # cleanup_mode: string, `off`, `report` (default) or `on`. Controls the
  # safe-to-delete cleanup pass: `off` does not run it, `report` records and
  # reports only, and `on` performs the removals the pass decides on. Unlike
  # the other enum keys here, an absent key, an empty value and any
  # unrecognized word all read as `report` — they are not refused on config
  # load or on the write paths (only a non-string type is). Settable via PUT
  # /api/config (key autonomous.automation.cleanup_mode; GET /api/config
  # shows the effective value), CLI `datawatch config set
  # autonomous.automation.cleanup_mode=on`, comm `configure
  # autonomous.automation.cleanup_mode=on`, and the MCP
  # autonomous_config_set tool (automation_cleanup_mode).
  #
  # cleanup_retention_hours: whole hours >= 0. How long a removal candidate
  # may sit unused before it counts as retained for the cleanup pass. An
  # unset key, an explicit 0 and a negative value are not refused — they all
  # read as 24 (the default) through the effective getter. Settable via PUT
  # /api/config (key autonomous.automation.cleanup_retention_hours), CLI
  # `datawatch config set autonomous.automation.cleanup_retention_hours=48`,
  # comm `configure autonomous.automation.cleanup_retention_hours=48`, and
  # the MCP autonomous_config_set tool (automation_cleanup_retention_hours).
  #
  # cleanup_max_removals_per_pass: whole number >= 0. The maximum removals
  # one cleanup pass may perform. An unset key, an explicit 0 and a negative
  # value are not refused — they all read as 10 (the default) through the
  # effective getter. Settable via PUT /api/config (key
  # autonomous.automation.cleanup_max_removals_per_pass), CLI `datawatch
  # config set autonomous.automation.cleanup_max_removals_per_pass=5`, comm
  # `configure autonomous.automation.cleanup_max_removals_per_pass=5`, and
  # the MCP autonomous_config_set tool
  # (automation_cleanup_max_removals_per_pass).
  #
  # disk_alert_percent: whole number, clamped to 1..100. The disk-usage
  # percent at or above which a disk alert is raised. An unset key (0) reads
  # the 85 default; a stored value below 1 reads as 1 and above 100 reads as
  # 100 — the clamp happens on read, the write is never refused for range.
  # Settable via PUT /api/config (key autonomous.automation.disk_alert_percent),
  # CLI `datawatch config set autonomous.automation.disk_alert_percent=90`,
  # comm `configure autonomous.automation.disk_alert_percent=90`, and the MCP
  # autonomous_config_set tool (automation_disk_alert_percent).
  #
  # uncommitted_work_policy: string, `hold` (default), `warn` or `off`. What
  # an Automaton that commits its own work does when a task has finished and
  # its files are still uncommitted in the worktree, and again before the
  # Automaton is reported finished. `hold` commits the task's own declared
  # files, then holds the task (or blocks the Automaton at the finished
  # check) with the reason and the files and raises one question offering
  # commit, discard or retry. `warn` still commits the declared files but
  # only records a warning for what is left, and lets the work complete.
  # `off` does no check and no commit attempt. An unset key, an empty value
  # and an unrecognized word read as `hold` from a hand-edited config file;
  # any other word is refused on every write path and nothing is saved.
  # Read live, no restart. Settable via PUT /api/config (key
  # autonomous.automation.uncommitted_work_policy; GET /api/config shows the
  # effective value), PUT /api/autonomous/config (automation object), CLI
  # `datawatch config set autonomous.automation.uncommitted_work_policy
  # warn`, comm `configure autonomous.automation.uncommitted_work_policy=warn`,
  # the PWA (Settings -> General -> Automata settings -> Uncommitted-work
  # check), and the MCP autonomous_config_set tool
  # (automation_uncommitted_work_policy).
  #
  # uncommitted_work_scope: string, `task_files` (default) or `worktree`.
  # Which files the per-task check counts. `task_files` counts only the
  # files the task itself changed (files already modified or untracked
  # before the task started are left out); `worktree` counts every
  # uncommitted file in the worktree. The check before an Automaton is
  # reported finished always covers the whole worktree, whatever the scope.
  # An unset key, an empty value and an unrecognized word read as
  # `task_files` from a hand-edited config file; any other word is refused on
  # every write path. Read live, no restart. Settable via PUT /api/config
  # (key autonomous.automation.uncommitted_work_scope), PUT
  # /api/autonomous/config, CLI `datawatch config set
  # autonomous.automation.uncommitted_work_scope worktree`, comm `configure
  # autonomous.automation.uncommitted_work_scope=worktree`, the PWA (same
  # group), and the MCP autonomous_config_set tool
  # (automation_uncommitted_work_scope). The status is read with GET
  # /api/autonomous/uncommitted-work, MCP autonomous_uncommitted_work, CLI
  # `datawatch autonomous uncommitted-work` and the chat verb `autonomous
  # uncommitted-work`.
  #
  # protected_paths: list of strings (YAML list; a comma separated string on
  # the command line, the chat channel and PUT /api/config). Default: unset,
  # which reads the default list: the project rules file
  # (autonomous.rules_file, AGENT.md when unset),
  # docs/plans/2026-10-17-supervisor-rules-and-lessons.md, CODEOWNERS and
  # .github/workflows/. The paths an Automaton task may not change without a
  # decision. Each entry is repository-relative and is one of three forms,
  # matched case-sensitively: a file (`CODEOWNERS`), a directory (a trailing
  # slash or /**, `ops/`, matches everything below it at any depth) or a glob
  # using * ? [ ] matched against the whole path (`docs/plans/*.md`; a * never
  # crosses a slash). An explicit list replaces the default list entirely; an
  # empty or unset list reads the default. An absolute entry, an entry with a
  # .. segment, an entry over 256 bytes and a list over 100 entries are
  # refused on every write path with a message naming the entry, and nothing
  # is saved. Read live, no restart. Settable via YAML (autonomous ->
  # automation -> protected_paths), PUT /api/config (key
  # autonomous.automation.protected_paths; a JSON array or one comma
  # separated string; GET /api/config shows the effective list), PUT
  # /api/autonomous/config (automation object), CLI `datawatch config set
  # autonomous.automation.protected_paths "AGENT.md,ops/"`, comm `configure
  # autonomous.automation.protected_paths=AGENT.md,ops/`, the PWA (Settings ->
  # General -> Automata settings -> Protected paths), and the MCP config_set
  # tool. The paths one Automaton may change without a decision are its own
  # authorised list (see the how-to), not a key in this file.
  #
  # protected_paths_action: string, `hold` (default), `warn`, `block` or
  # `off`. What happens when a task changes a protected path the Automaton is
  # not authorised for. `hold` parks the task as blocked with the changed
  # paths and raises one question offering approve, reject or change the spec;
  # nothing changes until it is answered. `warn` records a decision, an audit
  # event and a warning alert and lets the task go on. `block` parks the task
  # as blocked with the changed paths and raises no question; the operator
  # authorises the path or edits the task, then resets it. `off` does no
  # check. The gate never reverts or rewrites anything itself. An unset key,
  # an empty value and an unrecognized word read as `hold` from a hand-edited
  # config file; any other word is refused on every write path. Read live, no
  # restart. Settable via YAML, PUT /api/config (key
  # autonomous.automation.protected_paths_action), PUT /api/autonomous/config,
  # CLI `datawatch config set autonomous.automation.protected_paths_action
  # warn`, comm `configure autonomous.automation.protected_paths_action=warn`,
  # the PWA (same group), and the MCP config_set tool.
  #
  # rules_review_source: string, `base_commit` (default) or `worktree`. Where
  # the rules review reads the project rules (the rules file and the context
  # file) from. `base_commit` gives the judge the text of the files as they
  # were at the commit the Automaton's work started from, so a task cannot
  # change the rubric it is judged by or skip the review by deleting the rules
  # file; when no base commit can be resolved the run falls back to the
  # working tree and records a rules_review_source_fallback decision.
  # `worktree` tells the judge to read the files from the task's working
  # directory. The rules review itself runs only when `rules-review` is in the
  # Automaton's guardrail list. An unset key, an empty value and an
  # unrecognized word read as `base_commit` from a hand-edited config file;
  # any other word is refused on every write path. Read live, no restart.
  # Settable via YAML, PUT /api/config (key
  # autonomous.automation.rules_review_source), PUT /api/autonomous/config,
  # CLI `datawatch config set autonomous.automation.rules_review_source
  # worktree`, comm `configure autonomous.automation.rules_review_source=
  # worktree`, the PWA (same group), and the MCP config_set tool. The status
  # is read with GET /api/autonomous/protected-paths, MCP
  # autonomous_protected_paths, CLI `datawatch autonomous protected-paths` and
  # the chat verb `autonomous protected-paths`. One Automaton's authorised
  # paths are set with POST /api/autonomous/prds/{id}/set_authorized_paths,
  # MCP autonomous_prd_set_authorized_paths, CLI `datawatch autonomous
  # authorize-paths` and the chat verb `autonomous authorize-paths`.
  #
  # Automation objects themselves (members, edges, budget policy, defaults) are
  # runtime data in the automation store, created through the Automation verbs
  # (including `automation import-graph`), not keys in this file.
  #
  # Automation-level model defaults are NOT YAML keys. The execution, verification
  # and planning defaults an Automation hands to the member Automata it runs are
  # runtime data stored on each Automation record (fields backend, model, effort,
  # verification_backend, verification_model, verification_effort,
  # planning_backend, planning_model), so nothing is set in this file. The
  # Automation level sits between the Automaton and the global default:
  #   execution backend, model and effort, and the verification LLM resolve
  #   task -> story -> Automaton -> Automation -> global
  # Backend and model come from the same level; effort resolves independently.
  # The global default is autonomous.verification_backend / verification_model /
  # verification_effort for verification, and the daemon's configured backend
  # for execution. Planning has its own optional pair (planning_backend,
  # planning_model); unset means the global autonomous.planning_backend /
  # planning_model. It is used only when a member is decomposed and never
  # changes the run or verify default. Each task run records executor_source
  # (task | story | prd | automation | global) beside verifier_source.
  # Set them while the Automation is draft, active, paused or blocked:
  #   REST   POST /api/automations/{id}/set_llm
  #          (backend, model, effort, planning_backend, planning_model) and
  #          POST /api/automations/{id}/set_verification_llm
  #          (backend, model, effort)
  #   MCP    automation_set_llm and automation_set_verification_llm
  #   CLI    `datawatch automation set-llm <id> --backend B --model M`
  #          `datawatch automation set-verification-llm <id> --effort high`
  #   comm   `automation set-llm <id> backend=B model=M effort=E`
  #          `automation set-verification-llm <id> backend=B model=M`
  # Fields are presence-aware (omitted keeps, empty clears). expected_version is
  # optional (0 or omitted skips the check; a stale positive value is a 409).
  # See docs/api/autonomous.md.
  automation:
    idle_alert_minutes: 0
    triage_alert_minutes: 30
    merge_pending_mode: off
    merge_pending_alert_minutes: 30
    merged_member_policy: completed
    agent_insert_policy: allow
    # Repo CI watch: lets the automation coordinator watch the CI runs of
    # external repositories. On each poll it lists the workflows on the head
    # of main and on the newest release tags of every watched repository, records
    # each run, classifies failures and hung runs, and — in on mode only —
    # cancels a hung run, reruns an infra failure and deletes superseded failed
    # runs. alert_minutes (0 or unset) is how long a run may stay unresolved
    # (failing, hung or pending) before one alert is raised for that episode;
    # 0 turns the alert off, and shadow mode never raises one.
    #
    # Every key is settable at runtime, with no restart, on every configuration
    # channel:
    #   PUT /api/config {"autonomous.automation.repo_ci_watch.poll_seconds": 600}
    #   (GET /api/config shows the block under autonomous.automation), MCP
    #   autonomous_config_set, CLI `datawatch config set
    #   autonomous.automation.repo_ci_watch.poll_seconds 600`, comm `configure
    #   autonomous.automation.repo_ci_watch.poll_seconds=600`, and the PWA
    #   Settings fields under Settings -> General -> Automate.
    # A refused value (an invalid mode or delete_superseded, a poll below 60
    # seconds, a hung threshold below 1, a negative alert or tag count,
    # a non-absolute repository path, an empty workflow name) is rejected
    # (400 on PUT /api/config, an error on config load) and nothing is written.
    #
    # mode: off (default; empty also reads off), shadow or on — case-insensitive;
    #   any other value is refused on the write paths. off does nothing. shadow
    #   records every run and logs every action it would take (would_do on the
    #   record) without cancelling, rerunning, deleting or raising an alert. on
    #   carries the actions out and raises the alert.
    # repos: list of absolute repository paths to watch (a repository is never
    #   inferred from the working directory, and a non-absolute path is refused
    #   on the write paths). Empty (or unset) means nothing is watched.
    # poll_seconds: whole seconds between polls of a watched repository. Minimum
    #   60 — a value below 60 is refused on the write paths, not rounded up.
    #   Unset reads the 300-second default. Default below: 300.
    # alert_minutes: whole minutes >= 0. How long a run may stay unresolved
    #   before the one alert for that episode is raised. An explicit 0 turns
    #   the alert off and survives a round trip; an unset value reads the 30-
    #   minute default. A negative value is refused on the write paths. While
    #   mode is off or shadow, no alert is raised regardless.
    # tag_count: how many of the newest release tags of a watched repository are
    #   tracked. An explicit 0 means no tags are watched; an unset value reads
    #   the 5 default. A negative value is refused on the write paths.
    # hung_after_minutes: whole minutes >= 1 (a value below 1 is refused on the
    #   write paths). A run in progress older than this many whole minutes is
    #   reported as hung. Unset reads the 60-minute default.
    # security_workflows: the workflow names to watch for the security signals.
    #   Unset reads the default list [CodeQL, dependency-review, owasp-zap,
    #   secret-scan, security-scan]; an explicitly empty list means no security
    #   workflows are watched. An empty workflow name is refused on the write
    #   paths.
    # delete_superseded: report (default; empty also reads report) or delete —
    #   any other value is refused on the write paths. report only names a
    #   superseded failed run (a later green run of the same workflow on a
    #   descendant commit) in that run's record; delete also removes it — but
    #   only in on mode and only on a later poll (the poll that names a
    #   superseded run never deletes it, and shadow never deletes).
    # The per-repository infra retry budget (how many automatic reruns on mode
    # allows) is not a key here: unset reads 0, meaning no automatic reruns.
    #
    # Operator docs: docs/howto/automation-repo-ci-watch.md (the how-to, the
    # shadow run and the operations), the "Repo CI watch" section of
    # docs/operations.md, the two "Repo CI watch" and "Shadow" entries in
    # docs/datawatch-definitions.md, and the "Repo CI watch" section of
    # docs/implementation.md. Read surfaces: GET /api/autonomous/repo-ci-watch
    # (repo and status filters; body: mode, alert_minutes, repos, last_poll_at,
    # records[]), the autonomous_repo_ci_watch MCP tool, `datawatch autonomous
    # repo-ci-watch`, the comm `repo-ci-watch` verb, and the read-only status
    # line on the Automaton view (hidden when the endpoint is unavailable, so
    # never a stale state).
    repo_ci_watch:
      mode: off
      repos: []
      poll_seconds: 300
      alert_minutes: 30
      tag_count: 5
      hung_after_minutes: 60
      security_workflows: [CodeQL, dependency-review, owasp-zap, secret-scan, security-scan]
      delete_superseded: report
    # Security failure: switches the coordinator's security-failure handling
    # on, off, or into shadow. The one key is mode: off, shadow or on
    # (case-insensitive; any other value is refused on every write path).
    # Unset (empty) reads shadow — the first-release default: the feature is
    # switched on in shadow mode first, with no behaviour change. The one
    # default is applied in exactly one place (the EffectiveMode accessor),
    # so no call site hard-codes it.
    # The security workflow set is not a key here: it is read from
    # repo_ci_watch.security_workflows above (unset reads
    # [CodeQL, dependency-review, owasp-zap, secret-scan, security-scan]),
    # and the alert time is the existing
    # autonomous.automation.triage_alert_minutes above.
    # Every key is settable at runtime, with no restart, on every
    # configuration channel:
    #   PUT /api/config {"autonomous.automation.security_failure.mode": "on"}
    #   (GET /api/config shows the block under autonomous.automation), MCP
    #   config_set (the generic MCP tool; autonomous_config_set does not
    #   carry this key), CLI `datawatch config set
    #   autonomous.automation.security_failure.mode on`, and comm `configure
    #   autonomous.automation.security_failure.mode=on`.
    # Operator docs: docs/howto/automation-security-failure.md and the
    # "Security failure report" section of docs/operations.md. Read surfaces
    # (all read-only): GET /api/autonomous/security-failures (repo and status
    # filters), the security_failure_list MCP tool, `datawatch autonomous
    # security-failure`, the comm `security-failure [run-id]` verb, and the
    # Security failure card in the Automation view.
    security_failure:
      mode: shadow
    # Supervisor watch: the daemon-side version of the supervisor script
    # (scripts/supervisor-watch.py). On each coordinator poll, with no model
    # call, it runs the script's checks and keeps one finding per kind and
    # subject: tmux_restart, daemon_inactive, model_not_resident, task_failed,
    # task_review_needed, automaton_not_merged, idle_lane_eligible_work,
    # worktree_no_gomod, worktree_not_registered, worktree_silent,
    # verify_script_not_executable, main_checkout_dirty, ci_red and ci_stuck.
    # It is report-only in every mode: it never merges, starts, holds, cancels
    # or retries an Automaton and never restarts a service. A finding about one
    # Automaton is also noted on that Automaton's triage record the first time
    # it is seen. A check that cannot tell (a failed probe, an unreachable node)
    # reports nothing.
    #
    # Every key is settable at runtime, with no restart, on every configuration
    # channel:
    #   PUT /api/config {"autonomous.automation.supervisor_watch.alert_minutes": 15}
    #   (GET /api/config shows the block under autonomous.automation, with the
    #   defaults filled in), CLI `datawatch config set
    #   autonomous.automation.supervisor_watch.alert_minutes 15`, comm
    #   `configure autonomous.automation.supervisor_watch.alert_minutes=15`, and
    #   the PWA Settings fields under Settings -> General.
    # A refused value (an unknown mode, a negative minute threshold, a
    # poll_seconds below 60, a path or model name that is not text) is rejected (400 on PUT
    # /api/config, an error on config load) and nothing is written.
    #
    # mode: off, shadow (default; empty also reads shadow) or on —
    #   case-insensitive; any other value is refused on the write paths. off
    #   does nothing. shadow runs every check, records the findings and the
    #   comparison, and marks a finding "would alert" when it has been open for
    #   alert_minutes, without raising an alert. on raises the alert, once per
    #   episode. The watch ships in shadow first; compare it with the script for
    #   a day (docs/howto/automation-supervisor-watch.md) before switching to on.
    # alert_minutes: whole minutes >= 0. How long a finding may stay open before
    #   its one alert for the episode (on mode). An explicit 0 turns the alert
    #   off and survives a round trip; an unset value reads the 30-minute
    #   default, the same one autonomous.automation.triage_alert_minutes uses. A
    #   negative value is refused on the write paths.
    # silent_minutes: whole minutes >= 0. How long a running Automaton that has
    #   a task in progress or being verified may show no activity (no file
    #   changed in its worktree, no worker transcript written) before
    #   worktree_silent. An explicit 0 is legal; unset reads the 60-minute
    #   default. A negative value is refused on the write paths.
    # poll_seconds: whole seconds. The poll interval the script record's
    #   freshness is judged against: a record older than three times this value
    #   is "script output unavailable" and no comparison is recorded for that
    #   pass (it is never counted as a disagreement). The coordinator runs the
    #   pass at most once a minute. Minimum 60 — a value below 60 is refused on
    #   the write paths, not rounded up. Unset (0) reads the 60-second default.
    #   Default below: 60.
    # script_output_path: the file scripts/supervisor-watch.py writes when it is
    #   run with --record <path>. Set, every pass compares its findings with the
    #   script's and records the comparison (last 500, plus the days of full
    #   agreement). Empty (default) means no comparison is made.
    # tmux_restart_baseline: the starting point (restart count and active-since
    #   time of the terminal-session service) tmux_restart compares against.
    #   Empty (default) means no starting point is configured and that check
    #   reports nothing.
    # main_checkout: the path of the main checkout inspected for modified
    #   tracked files (main_checkout_dirty). Empty (default) turns that check
    #   off.
    # working_model: the model every registered compute node is expected to keep
    #   loaded (model_not_resident). A node that does not have it loaded, a
    #   context variant of the model's base name counting as loaded, raises the
    #   finding. Text, trimmed. Empty (default) means no working model is set and
    #   that one check reports nothing; there is no built-in default model.
    #
    # Operator docs: docs/howto/automation-supervisor-watch.md (the how-to, the
    # shadow run, the comparison and the operations), the "Supervisor watch"
    # section of docs/operations.md and the "Supervisor watch" entry in
    # docs/datawatch-definitions.md. Read surfaces (all read-only): GET
    # /api/autonomous/supervisor-watch (body: mode, last_poll_at, findings[],
    # comparison), the supervisor_watch_list MCP tool, `datawatch autonomous
    # supervisor-watch`, the comm `supervisor-watch` verb, and the Supervisor
    # watch card in the Automation view (hidden when the endpoint is
    # unavailable, so never a stale state).
    supervisor_watch:
      mode: shadow
      alert_minutes: 30
      silent_minutes: 60
      poll_seconds: 60
      script_output_path: ""
      tmux_restart_baseline: ""
      main_checkout: ""
      working_model: ""
    create_search_mode: shadow
    create_search_threshold: 0.5
    # decision_assistant — no daemon config key; default OFF. The optional
    # local-model decision assistant is runtime data on the Automation record
    # (decision_assistant) and, as an override that wins over it, on a member.
    # It is set while the Automation is draft, active, paused or blocked with
    #   REST   POST /api/automations/{id}/set_decision_assistant
    #   MCP    automation_set_decision_assistant
    #   CLI    `datawatch automation set-decision-assistant <id> --backend B --model M`
    #   comm   `automation set-decision-assistant <id> backend=B model=M`
    # and read back as decision_assistant on automation get and on the status rows.
    # Empty (no backend) means off, and `clear` (or an empty backend) turns it off
    # again. Shape of the `decision_assistant` object; the fields replace the whole
    # setting:
    #
    #   backend:    an LLM registry name (a compute_node/Ollama-style backend).
    #               Required with model; empty = off.
    #   model:      the model on that backend. Required with backend.
    #   mode:       shadow (default) | live. `shadow` only records what the
    #               assistant would have done; `live` acts on a decision at or
    #               above the hook's threshold.
    #   hooks:      list of enabled hook points, none by default:
    #               empty_edge | skip_member | insert_member | budget_breach.
    #   thresholds: per-hook confidence threshold, a number in (0,1]. Below it
    #               the assistant must escalate to the operator. Defaults:
    #               0.9 for empty_edge, skip_member and insert_member, 0.95 for
    #               budget_breach.
    #
    # The assistant only picks among already-allowed options. Destroying state
    # or history, raising a budget ceiling and anything a guardrail marks as
    # needing human sign-off stay with the operator. Each change is audited as
    # automation_set_decision_assistant. See docs/api/autonomous.md.
    # budget_policy — no daemon config key. The spending limit of an
    # Automation is runtime data on the Automation record (and on a member as
    # an override), set with POST /api/automations/{id}/set_budget, MCP
    # automation_set_budget, `datawatch automation set-budget <id>` or comm
    # `automation set-budget <id> key=value...`; it is not read from this file.
    # Shape of the `budget_policy` object (a member's override has the same
    # shape and narrows the Automation's, it never widens it):
    #
    #   ceiling_type:  dollar | allocation_pct. `dollar` is the only type that
    #                  can stop work; `allocation_pct` is accepted but is an
    #                  estimate only and never pauses or blocks. Required.
    #   ceiling_value: number > 0, in dollars (or percent for allocation_pct).
    #   window:        automation (lifetime of the Automation) | day | week |
    #                  month. Required. The lifetime window has no reset.
    #   pacing:        none (default) | even. `even` holds a member start while
    #                  spend is ahead of an even spread across the window; it is
    #                  a hold, not a breach, and is ignored for the lifetime
    #                  window.
    #   on_breach:     pause (default) | block. On a dollar breach the
    #                  Automation pauses and resumes by itself at the window
    #                  rollover only when the reset time is known (a day, week
    #                  or month window the daemon defines itself, or a reset time
    #                  parsed from a rate-limit message); when the reset time is
    #                  unknown, or on_breach is `block`, it goes to blocked and
    #                  waits for the operator. An alert is raised either way.
    #   backend:       optional LLM whose spend is measured; empty = every
    #                  member's spend. Needed for peer_window, and for the
    #                  lifetime window to learn a reset time from a rate-limit
    #                  message.
    #   allocation_estimate: bool, default false. Adds an estimated
    #                  share-of-allocation figure to the budget view. Always
    #                  labelled estimated, never used to pause or block. The
    #                  notional allocation comes from
    #                  autonomous.plan_tier_allocation_usd (above) for the
    #                  backend's plan tier; nothing is shown when it is unset.
    #   peer_window:   list of federation peer names, default empty (none).
    #                  Another daemon's usage of `backend` counts toward the
    #                  ceiling only for the peers named here. Nothing writes
    #                  to this list: a confirmed fingerprint match does not
    #                  change it, so it stays your explicit choice (the
    #                  exchange — the fingerprint_sync / billing_group fields
    #                  below — can help you decide which peers truly share the
    #                  account). An unreachable peer counts as zero.
    #   reset_time:    24h HH:MM. Day, week and month windows reset at this
    #                  clock time; unset = local midnight in the daemon's zone.
    #   reset_weekday: monday..sunday. Week windows only; unset = Monday.
    #   reset_day:     1..28. Month windows only; unset = the 1st.

  # Lane fill: keeps every execution lane busy. On each poll the planner looks
  # at the queue and the lanes and decides what each idle lane should start.
  # In shadow mode (the default) it computes and records every decision and
  # starts nothing. Every key is settable at runtime, with no restart, on:
  #   PUT /api/config {"autonomous.lane_fill.gpu_lanes": 2} (GET /api/config
  #   shows it under autonomous.lane_fill), MCP autonomous_config_set, CLI
  #   `datawatch config set autonomous.lane_fill.gpu_lanes 2`, comm
  #   `configure autonomous.lane_fill.gpu_lanes=2`, and Settings -> General ->
  #   Autonomous in the web app.
  # A bad value is rejected (400 on PUT /api/config, an error on config load)
  # and nothing is written. None of the keys is omitted from a saved file, so
  # an explicit 0 survives a round trip; count_verifier_wait, stale_after_hours
  # and the four true/false switches are the exceptions — an absent key reads
  # as its default, while an explicit false or 0 survives.
  #
  # mode: off | shadow | on (case-insensitive). Empty means shadow. off does
  #   nothing. shadow computes and records every decision and starts nothing.
  #   on starts the work it decides on.
  # gpu_lanes: whole number >= 0. How many GPU lanes exist. Default 2.
  # claude_lanes: whole number >= 0. How many Claude lanes exist. Default 3;
  #   0 means no Claude lane.
  # idle_alert_minutes: whole number >= 0. How long a lane may sit idle with
  #   eligible work queued before one alert is raised for that idle episode.
  #   Default 30; 0 turns the alert off.
  # decompose_ahead_min: whole number >= 0. The minimum number of decomposed
  #   Automata kept ready per lane. Default 2.
  # poll_seconds: whole number >= 0. Seconds between planner polls. Default 60;
  #   0 means 60 and any value below 5 is raised to 5.
  # gpu_backend: the backend the GPU lanes run. Default pi-prompt.
  # gpu_model: the model the GPU lanes run. Empty (the default) means the
  #   backend's own default model.
  # claude_backend: the backend the Claude lanes run. Default claude-code.
  # count_verifier_wait: bool, default true (an absent key reads as true).
  #   When true, a Claude lane whose Automaton occupies it only while waiting
  #   on a verifier slot counts as available within the Claude lane count, so
  #   lane fill may place other work there while it waits. When false the lane
  #   stays busy, as before. This key only changes which lanes count as
  #   available; the lane fill mode still decides whether anything starts —
  #   shadow starts nothing.
  # stale_after_hours: whole number >= 0, default 72. How many hours a queued
  #   Automaton (draft, approved or waiting for review) may go without any
  #   update before lane fill calls it stale (reason code "stale") and does not
  #   start it. An absent key reads 72; an explicit 0 turns the stale rule off
  #   and survives a round trip.
  # require_confirmed_proposal: bool, default true (an absent key reads true).
  #   An implementation Automaton is taken only when a proposal file named in
  #   its spec (docs/plans/<name>.md, read from the base repository) has a line
  #   starting "Confirmed: yes" in its first 200 lines. Otherwise it is refused
  #   as proposal_not_confirmed (the file has no such line) or proposal_missing
  #   (no readable file is named). Research, operational and personal
  #   Automata are exempt. false turns the rule off.
  # check_main_carries: bool, default true. An Automaton whose work the default
  #   branch already carries (a merge or task commit for it, or its branch is
  #   entirely on the default branch) is refused as main_carries_work. A check
  #   that cannot be made never refuses. false turns the check off.
  # require_worktree: bool, default true. An Automaton with a recorded
  #   worktree is taken only when that worktree exists, has a .git entry and
  #   is in the repository's registered worktree list; otherwise it is refused
  #   as worktree_invalid. An Automaton with no worktree yet is fine. false
  #   turns the check off.
  # lane_counts_from_caps: bool, default true. With it on, a lane type's count
  #   is the sum of the in-flight caps of the enabled LLM entries on its
  #   backend (the same caps the capacity pools use). An unlimited entry, no
  #   matching entry or no cap source keeps the configured gpu_lanes or
  #   claude_lanes count, and a configured 0 stays none. The status
  #   lane_counts object shows the configured count, the count in use and its
  #   source (llm_caps or config) for gpu and claude. false uses gpu_lanes and
  #   claude_lanes as written.
  # gpu_mode, claude_mode: off | shadow | on (case-insensitive), string, the
  #   mode for one lane kind only. Empty (the default) inherits mode, so the
  #   shipped default stays shadow for both kinds. Only the decisions of a
  #   kind whose mode is on are carried out; a kind set to off plans nothing
  #   for its lanes. Turn GPU lanes on first (gpu_mode: on), watch, and only
  #   then claude_mode. Each change is written to the audit log as
  #   lane_fill_mode. See docs/howto/automation-lane-fill.md.
  lane_fill:
    mode: shadow
    gpu_lanes: 2
    claude_lanes: 3
    idle_alert_minutes: 30
    decompose_ahead_min: 2
    poll_seconds: 60
    gpu_backend: pi-prompt
    gpu_model: ""
    claude_backend: claude-code
    count_verifier_wait: true
    stale_after_hours: 72
    require_confirmed_proposal: true
    check_main_carries: true
    require_worktree: true
    lane_counts_from_caps: true
    gpu_mode: ""
    claude_mode: ""

  # Checks: mode of each automatic check. Every key is a mode:
  #   off    the check is not run.
  #   shadow the check runs and its findings are recorded through the triage
  #          record; nothing is alerted and nothing is blocked.
  #   on     the check runs, records, alerts and, for pre_start_verifier,
  #          blocks a task start.
  # A mode value is matched without regard to case; an unknown value is
  # rejected with an error naming the key. An unset key reads its default.
  #
  # pre_start_verifier: off | shadow | on. Default on. Runs the task's
  #   verification script before the task starts; on blocks the start when it
  #   fails.
  # block_when_missing: true | false. Default true. With pre_start_verifier on,
  #   a task that has no verification script is blocked too; false lets it
  #   start.
  # plan_rules: off | shadow | on. Default on. Checks a plan against the rules;
  #   findings only, never blocks.
  # after_done: off | shadow | on. Default on. Report-only check after a task
  #   reports done.
  # registry_readme: off | shadow | on. Default on. Report-only check of the
  #   registry README; never rewrites a row.
  # projects: map keyed by project directory. Each entry may set any of the
  #   keys above (pre_start_verifier, block_when_missing, plan_rules,
  #   after_done, registry_readme); a key left out inherits the global value.
  #   An empty map (the default) means every project follows the global values.
  checks:
    pre_start_verifier: on
    block_when_missing: true
    plan_rules: on
    after_done: on
    registry_readme: on
    projects: {}
    # projects:
    #   /path/to/project:
    #     pre_start_verifier: shadow
    #     after_done: off

  # Ship: policy for the push, tag and CI-watch steps after a merge. The three
  # step keys use the same modes as autonomous.checks, matched without regard
  # to case; an unknown value is rejected with an error naming the key:
  #   off    the step is skipped.
  #   shadow the step is planned and the exact command is recorded, but not run.
  #   on     the step runs.
  #
  # push: off | shadow | on. Default on. Pushes the merged commit to remote.
  # tag: off | shadow | on. Default on. Creates and pushes the release tag.
  # ci_watch: off | shadow | on. Default on. Watches CI for the pushed commit.
  # tag_format: tag name template. Default "v{version}". Must contain the
  #   {version} placeholder; a value without it is rejected.
  # remote: git remote to push to. Default origin.
  # ci_workflows: list of workflow names to watch. Default [] (empty), meaning
  #   every run on the pushed commit is watched.
  # projects: map keyed by project directory. Each entry may set any of the
  #   keys above; a key left out inherits the global value. An empty map (the
  #   default) means every project follows the global values.
  ship:
    push: on
    tag: on
    ci_watch: on
    tag_format: "v{version}"
    remote: origin
    ci_workflows: []
    projects: {}
    # projects:
    #   /path/to/project:
    #     push: shadow
    #     remote: upstream
    #     ci_workflows: [release]
  # Priority by kind (autonomous.priority_by_kind): the priority a work
  # item gets, by the kind of work it is. The shipped table is
  # bug: 80, maintenance: 70, feature: 20, other: 0. A kind you set here
  # overrides its shipped value (a zero you set means no priority), and any
  # kind of your own that is not in the shipped table is kept as written;
  # kinds you leave out fall back to their shipped value. It is a starting
  # ranking, not a fixed rule — adjust it to fit how you queue work.
  # priority_by_kind:
  #   bug: 80
  #   maintenance: 70
  #   feature: 20
  #   other: 0
  #
  # Defect intake automation (autonomous.defect_intake_automation): the name
  # of the Automaton in this installation that takes defect intake on. The
  # default is empty, on purpose — each installation names its own, and the
  # daemon ships no opinion about which one that is.
  # defect_intake_automation: ""

  # Infrastructure retry: a task that fails because the machinery around it
  # failed (not because of its own work) is retried on a back-off schedule and
  # the failure is not counted against the task. Every key is settable at
  # runtime, with no restart, on:
  #   PUT /api/config {"autonomous.infra_retry.max_tries": 5} (GET /api/config
  #   shows the block under autonomous.infra_retry with defaults filled in),
  #   MCP autonomous_config_set (infra_retry_<key> arguments) or config_set,
  #   CLI `datawatch config set autonomous.infra_retry.max_tries 5`, comm
  #   `configure autonomous.infra_retry.max_tries=5`, and Settings -> General
  #   -> Autonomous in the web app.
  # Read the retried and held tasks with GET /api/autonomous/infra-retries,
  # MCP autonomous_infra_retries, CLI `datawatch autonomous infra-retries`
  # and comm `autonomous infra-retries`.
  # A bad value on those write surfaces is rejected (400 on PUT /api/config)
  # and nothing is written. A bad value typed by hand into config.yaml is not
  # checked on load: a max_tries below 1 reads as 3, an unknown exhausted_action
  # reads as hold, a negative delay waits no time and an unknown class is never
  # retried. An unset key reads its default. The two lists keep "unset" (reads
  # the default) apart from an explicit empty list (kept as written).
  #
  # enabled: true | false. Default true. false makes an infrastructure failure
  #   an ordinary failure.
  # max_tries: whole number from 1 to 1000. Default 3. Infrastructure retries a
  #   task gets in a row before exhausted_action applies.
  # backoff_seconds: list of whole seconds, each 0 to 604800, at most 1000
  #   entries (a JSON array or a comma list on the other surfaces). Default
  #   [60, 300, 540]: 1, 5 and 9 minutes, 15 minutes in all. The delay before
  #   each retry; the last entry repeats when there are more tries than
  #   entries. An explicit [] means retry with no delay.
  # categories: list of failure classes treated as transient. Allowed values:
  #   spawn_error (the worker could not be started), storage_write (the device
  #   is full, the quota is used up or the file system is read-only),
  #   session_killed_before_delivery (the worker session ended before the task
  #   reached it) and daemon_restart (the daemon restarted while the task ran).
  #   Default all four. A class left out takes the ordinary failure path; an
  #   explicit [] retries none.
  # exhausted_action: hold | count. Default hold. hold parks the task for the
  #   operator with the cause on it (one alert, and one question when
  #   raise_question is on); count books one ordinary failed attempt.
  # retry_dependents: true | false. Default true. Marks dependents failed
  #   behind an infrastructure failure and returns them to pending when the
  #   root task is no longer failed, cancelled or held.
  # raise_question: true | false. Default true. Raises one operator question
  #   when a task is held; needs autonomous.questions.enabled.
  # infra_retry:
  #   enabled: true
  #   max_tries: 3
  #   backoff_seconds: [60, 300, 540]
  #   categories:
  #     - spawn_error
  #     - storage_write
  #     - session_killed_before_delivery
  #     - daemon_restart
  #   exhausted_action: hold
  #   retry_dependents: true
  #   raise_question: true

  # Merge pipeline (autonomous.merge_pipeline): where a project's merge pipeline
  # comes from and how a merge conflict is handled. Every key can be overridden
  # for one project under autonomous.merge_pipeline.projects.<project>.<key>;
  # an unset key inherits the global value, then the default. Settable at
  # runtime through YAML, PUT /api/config, `datawatch config set`, MCP
  # autonomous_config_set (merge_pipeline_<key> arguments) or config_set, the
  # comm `configure` verb and Settings -> Automation -> Merge pipeline.
  # file_name: the pipeline file in a project, relative to it. Default
  #   .datawatch/merge-pipeline.yaml. An absolute or escaping path is refused.
  # source_order: sources tried first to last, from file, record. Default
  #   [file, record]. The built-in pipeline always applies after them.
  # fallback_on_bad_file: record | default | none. Default record. What is used
  #   when the project file exists but cannot be used; the problem is reported.
  # conflict_policy: stop_and_ask | mechanical | mechanical_and_model. Default
  #   mechanical_and_model. A policy that needs a model degrades to
  #   stop_and_ask when no model is set or none can be reached.
  # conflict_model: a name in the LLM registry. Unset reads the built-in default
  #   name (claude-opus-5-5); an explicit empty string means no model. Never adds
  #   or changes a registry entry.
  # conflict_mode: shadow | on. Default shadow. shadow runs the conflict model
  #   without acting on its proposal; on acts on the proposal.
  # conflict_confirm_first_n: a whole number. Default 5. How many of a project's
  #   first conflict proposals need confirmation. 0 turns confirmation off; a
  #   negative value is refused.
  # version_files: project files, relative to the project, that carry the
  #   `var Version = "X.Y.Z"` line the release-version step sets. Default none.
  # release_size_map: how much a merge steps the version, per Automaton kind.
  #   Built-in (always present): feature=minor, bug=patch. A global or
  #   project entry adds to or overrides the built-in. A value must be
  #   patch, minor, major or none; a major entry is stored but never used -
  #   a major is only ever an explicit release_size: major or a completed
  #   milestone Automation. Unset reads the built-in map.
  # major_trigger: manual | milestone | never. Default manual. manual: the
  #   explicit major is the only route besides a breaking change; milestone:
  #   a completed Automation marked `milestone` also steps major; never: a
  #   milestone never steps a major.
  # release_cadence: per_merge. Default per_merge. batch and manual are
  #   named values refused as not available yet; any other name is invalid.
  # version_scheme: semver. Default semver. Any other name is refused as not
  #   available yet.
  # release_approval: one mode per size of release - release_approval.patch,
  #   .minor and .major - each auto | ask | manual (anything else is refused
  #   with the key named). Defaults: patch auto, minor auto, major ask; a
  #   release whose size cannot be read resolves to ask, never to shipping.
  #   An unset size inherits the project's
  #   autonomous.merge_pipeline.projects.<project>.release_approval, then the
  #   global value, then that default. The merge run honours these modes:
  #   auto ships a release whose checks pass and reports afterwards; ask raises
  #   one "Ship this release?" decision and ships only on a yes; manual prepares
  #   and reports, and a person ships. A failed check holds the release in every
  #   mode. Example, one project ships minor releases by hand:
  #     projects:
  #       myproject:
  #         release_approval:
  #           minor: manual
  # merge_pipeline:
  #   file_name: .datawatch/merge-pipeline.yaml
  #   source_order: [file, record]
  #   fallback_on_bad_file: record
  #   conflict_policy: mechanical_and_model
  #   conflict_model: claude-opus-5-5
  #   conflict_mode: shadow
  #   conflict_confirm_first_n: 5
  #   version_files: []
  #   release_size_map: {feature: minor, bug: patch}
  #   major_trigger: manual
  #   release_cadence: per_merge
  #   version_scheme: semver
  #   release_approval:
  #     patch: auto
  #     minor: auto
  #     major: ask
  #   projects: {}

  # Post-ship hooks (autonomous.merge_pipeline.post_ship): the small steps a
  # project runs once a merge pipeline's push step succeeded. Off by default
  # at two levels: the block's enabled switch and each hook's own. A failed
  # hook never blocks or fails the ship - its failure is recorded on its own
  # step with the detail redacted, the run keeps the result the pipeline's
  # steps set, and the later hooks still run. Global only: unlike the other
  # merge pipeline keys it has no per-project form. Settable at runtime
  # through YAML, PUT /api/config, CLI `datawatch autonomous merge-pipeline
  # post-ship set <key> <value>` (show reads it back), MCP
  # autonomous_merge_pipeline_get (its post_ship block), the comm
  # `configure` verb and Settings -> the Merge pipeline card -> the
  # Post-ship hooks card directly below it.
  # enabled: true | false. Default false. Turns the whole block on; a hook
  #   that is listed but not enabled produces no step at all.
  # hooks: at most 20, in run order. Each entry is {name, builtin or command
  #   (give one of the two, never both), enabled (default false)}. The
  #   built-in names are registry_row, parity_issue, tag and notify.
  # registry_file: the registry file the registry_row hook marks shipped,
  #   relative to the project. May contain {project}.
  # registry_row_pattern: the text that must match exactly one row of that
  #   file; the row's status cell is what gets updated.
  #   May contain {project} and {version}.
  # companion_repository: the owner/name the parity_issue hook files its
  #   issue in - the companion, never the project that was merged.
  # issue_title_template: the parity_issue title. May contain
  #   {project} and {version}.
  # notify_template: the notify hook's message body; also the parity issue's
  #   body when set, without which the issue gets a default one.
  #   May contain {project} and {version}.
  # A built-in whose target is empty fails its step and says which setting is
  # missing; the daemon never guesses a registry file, a repository or a
  # message body. The {project} and {version} placeholders are substituted at
  # run time; any other {placeholder} is left as written.
  # post_ship:
  #   enabled: false
  #   hooks: []
  #   registry_file: docs/registry.md
  #   registry_row_pattern: myproject
  #   companion_repository: owner/parity-tracker
  #   issue_title_template: "Parity: {project} {version}"
  #   notify_template: "Shipped {version} of {project}"

  # Model request progress (the request watch): the daemon observes the
  # in-flight model request of a worker or verifier session whose model runs on
  # a registered compute node, so a hung request can be told from a slow one.
  # Observation only: it makes no model call and never ends a worker, retries
  # on another backend or unloads a model. Every key is settable at runtime,
  # with no restart, on:
  #   PUT /api/config {"autonomous.request_watch.no_progress_minutes": 45}
  #   (GET /api/config shows the block under autonomous.request_watch with
  #   defaults filled in), MCP autonomous_config_set (request_watch_<key>
  #   arguments) or config_set, CLI `datawatch config set
  #   autonomous.request_watch.no_progress_minutes 45`, comm `configure
  #   autonomous.request_watch.no_progress_minutes=45`, and Settings -> General
  #   -> Automata settings -> Model request watch in the web app.
  # Read the observations with GET /api/autonomous/request-watch (optional
  # session and automaton query parameters), MCP autonomous_request_watch, CLI
  # `datawatch autonomous request-watch [--session ID] [--automaton ID]
  # [--json]` and comm `autonomous request-watch`.
  # A bad value on those write surfaces is rejected (400 on PUT /api/config) and
  # nothing is written; a bad value typed by hand into config.yaml is rejected
  # when the file loads. An unset key reads its default. The list keeps "unset"
  # (reads all four options) apart from an explicit empty list (keep_waiting
  # only).
  #
  # enabled: true | false. Default true. false takes no sample, keeps no
  #   observation and raises no alert or question; the read surfaces return an
  #   empty list.
  # poll_seconds: whole number, 1 or more. Default 30. How often each watched
  #   request is sampled.
  # no_progress_minutes: whole number, 1 or more. Default 30. Minutes without a
  #   sign of progress before a request is over the threshold. Raise it for
  #   slow hardware or a big model that takes long to give a first response.
  # observe_workers: true | false. Default true. Watch worker sessions.
  # observe_verifiers: true | false. Default true. Watch verifier sessions.
  # use_gpu_signal: true | false. Default true. Read the GPU activity of a node
  #   that has an attached observer as a sign of progress.
  # gpu_busy_percent: whole number, 1 to 100. Default 10. The GPU load at or
  #   above which the node counts as generating.
  # unreachable_counts: true | false. Default true. Time with the node
  #   unreachable counts as no progress; false never takes a request over the
  #   threshold while the node is unreachable.
  # raise_alert: true | false. Default true. One alert when a request passes the
  #   threshold.
  # raise_question: true | false. Default true. One non-blocking operator
  #   question when a request passes the threshold; needs
  #   autonomous.questions.enabled. Answering it only records the choice and
  #   performs nothing.
  # remediation_options: list of the choices the question offers. Allowed
  #   values: keep_waiting, end_worker, retry_other_backend,
  #   unload_reload_model (a JSON array or a comma list on the other surfaces).
  #   Default unset, which reads as all four. keep_waiting is always offered,
  #   first, and is always the default answer. An explicit [] offers
  #   keep_waiting only.
  # request_watch:
  #   enabled: true
  #   poll_seconds: 30
  #   no_progress_minutes: 30
  #   observe_workers: true
  #   observe_verifiers: true
  #   use_gpu_signal: true
  #   gpu_busy_percent: 10
  #   unreachable_counts: true
  #   raise_alert: true
  #   raise_question: true
  #   remediation_options:
  #     - keep_waiting
  #     - end_worker
  #     - retry_other_backend
  #     - unload_reload_model
  # Model routing: what happens when a model is pinned on an Automaton, a story
  # or a task (or set as a verifier model) and no registered compute node
  # serves it, and where a task and its verification job run. Each node's
  # served models are read from the node (Ollama and opencode nodes at
  # /api/tags, OpenWebUI nodes at /api/v1/models). Only a model that runs on a
  # local engine reached through a compute node is checked; a hosted backend
  # such as claude-code is never refused. Every key is settable at runtime,
  # with no restart, on:
  #   PUT /api/config {"autonomous.model_routing.refusal_mode": "warn"} (GET
  #   /api/config shows the block under autonomous.model_routing with defaults
  #   filled in), MCP autonomous_config_set (model_routing_<key> arguments) or
  #   config_set, CLI `datawatch config set autonomous.model_routing.refusal_mode
  #   warn`, comm `configure autonomous.model_routing.refusal_mode=warn`, and
  #   Settings -> General -> Autonomous in the web app.
  # Read what each node serves with GET /api/compute/served-models, MCP
  # compute_served_models, CLI `datawatch compute node served-models` and comm
  # `compute node models`. A bad value on the write surfaces is rejected (400
  # on PUT /api/config) and nothing is written; a bad value typed by hand into
  # config.yaml stops the daemon loading it, with an error naming the key.
  #
  # refusal_mode: refuse | warn. Default refuse. refuse turns a pin down when no
  #   registered node serves the model, and the message names the model and
  #   every node checked. warn applies the pin, records a
  #   model_not_served_warning decision on the Automaton and raises a warning.
  #   A node that is not registered is refused in both modes.
  # served_models_cache_seconds: whole number >= 0. Default 300. How long a
  #   node's served models are kept (a failed read is kept too). 0 reads the
  #   node every time.
  # verifier_follows_worker_node: true | false. Default true. Runs a task's
  #   verification job on the node its worker ran on and waits for that node
  #   instead of moving. false places the verifier like any other job.
  # unknown_node_policy: assume_serves | assume_not. Default assume_serves. How
  #   a node whose served models cannot be read counts: as serving the model,
  #   or as not serving it.
  # probe_timeout_seconds: whole number >= 1. Default 8. How long one read of a
  #   node's served models may take before the node counts as unreadable.
  # alert_on_refusal: true | false. Default true. Raises an alert when a pin is
  #   refused (error level) or applied with a warning (warning level).
  model_routing:
    refusal_mode: refuse
    served_models_cache_seconds: 300
    verifier_follows_worker_node: true
    unknown_node_policy: assume_serves
    probe_timeout_seconds: 8
    alert_on_refusal: true

  # Progress metrics engine. Every parameter of the engine is a key here; none
  # is fixed in code. Each is also settable at runtime, with no restart, on
  # every configuration channel (shown for lanes; the others use the same form):
  #   PUT /api/config {"autonomous.progress.lanes": 5} (GET /api/config shows it
  #   under autonomous.progress), CLI `datawatch config set
  #   autonomous.progress.lanes 5`, comm `configure autonomous.progress.lanes=5`,
  #   MCP `config_set`, and Settings -> General -> Autonomous in the web app.
  # A bad value is rejected (400 on PUT /api/config, an error on config load) and
  # nothing is written.
  #
  # lanes: whole number >= 0. How many parallel lanes of Automata the
  #   utilization figures assume. 0 (the default) means 5.
  # inactive_gap_hours: number >= 0. A gap of at least this many hours between
  #   two activity events counts as an inactive window. 0 (the default) means 3.
  # backlog_path: path of the machine-readable backlog file. A relative path
  #   resolves against autonomous.worktree_base_repo when that is set, else the
  #   daemon's working directory. Empty means docs/plans/README.md.
  # since: first day counted, YYYY-MM-DD. Empty (the default) means the first
  #   record's creation date. Any other format is rejected.
  # snapshot_retention_days: whole number >= 0. How long saved progress
  #   snapshots are kept. 0 (the default) means 90.
  progress:
    lanes: 0
    inactive_gap_hours: 0
    backlog_path: docs/plans/README.md
    since: ""
    snapshot_retention_days: 0

  # Tag browser for the Automata list: the attention view and the tag tree.
  # Every key below is settable on every configuration channel: PUT /api/config {"autonomous.tags.<name>": <value>}
  # (GET /api/config shows them under autonomous.tags), CLI `datawatch config
  # set autonomous.tags.<name> <value>` (read with `datawatch config get
  # autonomous.tags.<name>`), MCP `config_set` with key autonomous.tags.<name>
  # (requires mcp.allow_self_config=true), comm `configure
  # autonomous.tags.<name>=<value>`, and Settings -> General -> Automata ->
  # "Tag browser" group in the web app. An invalid value is refused on every
  # surface with the same message (for example "autonomous.tags.default_match_mode:
  # must be any or all") and nothing is written.
  tags:
    # Which view the Automata list opens on. auto (default): the attention view
    # when at least one Automaton needs attention, otherwise the tag browser.
    # attention: always the attention view. tags: always the tag browser.
    # Valid values: auto, attention, tags.
    default_view: auto
    # Automaton statuses that place an Automaton in the attention group. Valid
    # statuses: draft, planning, needs_review, approved, revisions_asked,
    # running, completed, rejected, cancelled, archived, blocked, failed,
    # paused. Any other entry is refused; an empty list takes the defaults.
    # Also, a paused Automaton is in the attention group, and an Automaton
    # with a task held for operator review also appears in the attention group.
    # Default: [blocked, needs_review, paused].
    attention_statuses: [blocked, needs_review, paused]
    # How selecting several tags in the tag browser combines. any (default):
    # an Automaton matches when it carries at least one selected tag, which
    # widens the list. all: it must carry every selected tag, which narrows it.
    # Valid values: any, all.
    default_match_mode: any
    # When true, each tag shows its direct count (Automata tagged with that tag
    # itself) as a tooltip beside its subtree count. false (default) hides the
    # tooltip.
    direct_counts_visible: false
    # Federation peer name of the daemon that keeps the shared tag registry.
    # Empty (default) means standalone: this daemon keeps its own tags and
    # nothing syncs. Set it to this daemon's own name to keep the registry, or
    # to another federation peer's name to follow that keeper. A name that is
    # not a federation peer leaves this daemon stale.
    registry_keeper: ""
    # How often, in whole seconds, the shared tag registry syncs with the
    # keeper peer named in registry_keeper. Minimum 5; default 30.
    registry_sync_seconds: 30

    # Placement tags: automatic tags that record where a piece of work ran, one
    # tag per enabled axis. `enabled` is the master switch (default true):
    # false turns the whole block off. Each named axis has `enabled` and a
    # `template` that must contain that axis's placeholder, which is replaced
    # with the fact value. A piece of work missing an axis's fact value
    # yields no tag for that axis. All built-in axes default on, each with
    # its conventional template ("<axis>:<placeholder>"): compute, peer,
    # backend, lane, role, project, automaton, automation, stage and kind.
    # Set an axis off by writing `enabled: false` for it.
    placement:
      enabled: true
      # Replaced with the compute node name.
      compute:
        enabled: true
        template: "compute:{node}"
      # Replaced with the peer name.
      peer:
        enabled: true
        template: "peer:{peer}"
      # Replaced with the backend name.
      backend:
        enabled: true
        template: "backend:{backend}"
      # Replaced with the lane.
      lane:
        enabled: true
        template: "lane:{lane}"
      # Replaced with the role.
      role:
        enabled: true
        template: "role:{role}"
      # Replaced with the project alias.
      project:
        enabled: true
        template: "project:{project}"
      # Replaced with the Automaton (PRD) id of the work the session runs.
      automaton:
        enabled: true
        template: "automaton:{automaton}"
      # Replaced with the Automation that owns the work.
      automation:
        enabled: true
        template: "automation:{automation}"
      # Replaced with the stage the work runs in.
      stage:
        enabled: true
        template: "stage:{stage}"
      # Replaced with the kind the work is (e.g. task, step, fork, join).
      kind:
        enabled: true
        template: "kind:{kind}"
      # User-defined axes (empty by default). Each entry has:
      #   name: lowercase letters, digits and hyphens; unique; not a built-in
      #     axis name (compute, peer, backend, lane, role, project, automaton,
      #     automation, stage, kind).
      #   field: one of the session fields Name, Backend, Model, Node, PRDID,
      #     Role, Project, Automaton, Automation, Stage, Kind.
      #   template: must contain the placeholder {value}, replaced with the
      #     field's value.
      #   enabled: on or off for this axis.
      custom: []
  # Auto tagging: the tags an Automaton gives itself as it runs, so the tag
  # browser and counts stay current without a human. Every key below is settable
  # on every configuration channel: PUT /api/config {"autonomous.auto_tags.<name>":
  # <value>} (GET /api/config shows them under autonomous.auto_tags), CLI
  # `datawatch config set autonomous.auto_tags.<name> <value>` (read with
  # `datawatch config get autonomous.auto_tags.<name>`), MCP `config_set` with
  # key autonomous.auto_tags.<name> (requires mcp.allow_self_config=true), comm
  # `configure autonomous.auto_tags.<name>=<value>`, and the web app. An
  # invalid value is refused on every surface with the same message (for
  # example "autonomous.auto_tags.kind_template: placeholder {owner} is not one of {automation}, {stage}, {kind}") and nothing is written.
  # A template may reference only the placeholders {automation}, {stage} and
  # {kind}; it must render to a non-empty name with no newline.
  auto_tags:
    # Whether auto tagging runs at all. false turns it off daemon-wide (and an
    # Automation's own override can still say false, which wins either way).
    enabled: true
    # Template for the Automation's tag. {automation} is the Automation's
    # slug. Default: automation:{automation}.
    automation_template: "automation:{automation}"
    # Template for the stage tag. {stage} is the current stage name.
    # Default: stage:{stage}.
    stage_template: "stage:{stage}"
    # Template for the kind tag. {kind} renders as the kind's label from
    # kind_labels below. Default: kind:{kind}.
    kind_template: "kind:{kind}"
    # What {kind} renders as, per Automaton kind. The default vocabulary is
    # feature: feature, bug: bug, other: maintenance. Rename a label (e.g.
    # other: support) to change what kind:other tags say; kinds without an
    # entry fall back to that default. kind_labels are shared across all
    # Automations (an Automation's override cannot carry its own).
    kind_labels:
      feature: feature
      bug: bug
      other: maintenance

  # The LLM registry entry's `billing_group` field (set in PWA Settings →
  # Compute → LLM edit, comm `llm add|update ... billing_group=<label>`, REST
  # `PUT /api/llms/{name}`, MCP `llm_add`/`llm_update`, or `datawatch llm
  # add|update --billing-group <label>`; 64 chars max, default empty, and an
  # empty value on update clears it): a label on LLM entries that bill against
  # one shared cloud/billing account across federated peers. Label only — the
  # value is hashed with a per-peer-pair key before it ever leaves the daemon.
  # When two daemons that opted each other in (the `fingerprint_sync` peer
  # field above) both carry the same label, a pending "shared billing account"
  # match appears that you confirm or reject; confirming changes nothing here.
  # See docs/howto/federation-fingerprint.md.
    #   reset_zone:    IANA zone name for the anchors above; unset = the
    #                  daemon's local zone.
    #
    # A member may also carry `estimated_cost_usd` (>= 0, members that run an
    # Automaton only): the expected cost, used to hold a start that would cross
    # the ceiling. Without it a member starts whenever spend is below the
    # ceiling; a member being resumed uses its spend so far as the estimate.
    # Example (set through the operation above, shown as JSON):
    #   {"ceiling_type": "dollar", "ceiling_value": 40, "window": "week",
    #    "pacing": "even", "on_breach": "pause", "backend": "claude-code",
    #    "reset_weekday": "monday", "reset_time": "09:00",
    #    "reset_zone": "America/New_York", "peer_window": ["edge"]}
  notify:
    # Global default set of lifecycle event kinds — the third, lowest
    # tier of the notify-event resolution (an Automaton's own
    # notify_events list, then its guardrail profile's notify_events
    # list, then this list; an Automaton or profile with its own list
    # uses that instead). The shipped default is the five baseline
    # kinds below (see internal/autonomous.DefaultNotifyEvents);
    # set an explicit empty list (`default_events: []`) to turn the
    # global tier off (no kinds from it). Custom replacement example:
    #   [prd.needs_review, prd.completed, prd.failed, task.session_started,
    #    task.completed, task.failed]
    # Note: task.session_started, task.session_cleared, scope_warning and
    # guardrail_warn are opt-in kinds (not in the five-kind baseline) —
    # list them wherever that notification should fire. `prd.updated` is never a valid
    # notify kind.
    default_events: [prd.needs_review, prd.blocked, prd.failed, prd.completed, prd.cancelled]
    # Per-queue retention for the mcp_queue subscription sink: each named
    # pending-events queue keeps at most this many events in memory and
    # evicts the oldest first (a polling client then sees dropped=true).
    # Values below 1 fall back to 500. Readable and settable as
    # autonomous.notify.pending_events_max; applied at daemon start.
    pending_events_max: 500
    # Outbound webhook sink: each lifecycle event a webhook subscription
    # selects is POSTed over HTTPS to the receiver, signed with HMAC-SHA256.
    # Ships DISABLED. Every key below is readable and settable through the
    # same names: autonomous.notify.webhook.<key> (REST PUT /api/config, the
    # Settings card, `datawatch config set`, comm `configure`). A change applies
    # to the next event, with no restart.
    #
    # The retry numbers, the signature wire format and the payload shape are
    # the recommended defaults in the lifecycle proposal, pending operator
    # confirmation. A value below 1 (and an empty backoff list) means the
    # default shown in the comment.
    #
    # SECRETS: a webhook subscription's signing secret is never a literal value
    # in this file or in any subscription. It is a ${secret:name} reference into
    # the secrets vault, resolved at send time. A literal value is refused.
    webhook:
      # autonomous.notify.webhook.enabled — false refuses webhook subscriptions
      # at creation and makes any already stored deliver nothing.
      enabled: false
      # autonomous.notify.webhook.allow_hosts — the only hosts that may receive
      # an event. Each entry is an exact host or host:port, case-insensitive, with
      # no scheme, path, wildcard or userinfo. Empty = nothing can receive.
      # Example: ["hooks.example.net", "hooks.example.net:8443"]
      allow_hosts: []
      # autonomous.notify.webhook.max_attempts — total attempts per delivery,
      # the first included. Default 5.
      max_attempts: 5
      # autonomous.notify.webhook.backoff_seconds — delay after each failed
      # attempt; the last entry repeats. Default [1, 4, 16, 64].
      backoff_seconds: [1, 4, 16, 64]
      # autonomous.notify.webhook.jitter_percent — +- spread on each delay.
      # Default 20 (jitter cannot be turned off).
      jitter_percent: 20
      # autonomous.notify.webhook.attempt_timeout_seconds — bound on one attempt
      # (connect, request and response). Default 10.
      attempt_timeout_seconds: 10
      # autonomous.notify.webhook.max_body_bytes — cap on the serialised
      # envelope, also the size a forwarding receiver accepts. Default 65536.
      max_body_bytes: 65536
      # autonomous.notify.webhook.signature_tolerance_seconds — the replay window
      # a receiver enforces on the signed timestamp. Default 300.
      signature_tolerance_seconds: 300
    # Peer forwarding: a lifecycle event a peer subscription selects is sent to a
    # federated peer (registered in the peer registry, with autonomous:write) and
    # re-emitted there. Ships DISABLED. Keys: autonomous.notify.forwarding.<key>
    # (same surfaces and the same live effect as the webhook keys above).
    forwarding:
      # autonomous.notify.forwarding.enabled — false refuses peer subscriptions at
      # creation and makes this daemon refuse to receive forwarded events.
      enabled: false
      # autonomous.notify.forwarding.max_hops — hop cap of a forwarded event,
      # counting the sender. A receiver refuses an event past it. Default 3.
      max_hops: 3
      # autonomous.notify.forwarding.max_attempts — total attempts per forwarded
      # event. Default 5.
      max_attempts: 5
      # autonomous.notify.forwarding.backoff_seconds — delay after each failed
      # attempt; the last entry repeats. Default [1, 4, 16, 64].
      backoff_seconds: [1, 4, 16, 64]
      # autonomous.notify.forwarding.jitter_percent — +- spread on each delay.
      # Default 20.
      jitter_percent: 20
      # autonomous.notify.forwarding.attempt_timeout_seconds — bound on one
      # attempt. Default 10.
      attempt_timeout_seconds: 10
  # ── Operator question channel ──
  # The question channel is the operator path for a question an Automaton
  # asks at decision time: POST /api/questions (plus list, get, answer,
  # withdraw, answers). While false every /api/questions endpoint refuses
  # service, a raise announces nothing, the question.answered /
  # question.withdrawn events never fire, and an answer delivers no session
  # line. Everything else in the daemon is untouched while it is off.
  # Default false (off): the daemon ships with the channel closed.
  # Every key below is settable through the config file, PUT /api/config
  # (dotted keys), the MCP config tools, `datawatch config set`, a comm
  # channel `configure` instruction, and the PWA settings card (Settings →
  # the Autonomous section, the four question rows); a change takes effect
  # immediately, no restart needed.
  questions:
    # autonomous.questions.enabled — the channel switch (off = nothing in
    # this section has any effect).
    enabled: false
    # autonomous.questions.notify_messaging — while the channel is on,
    # send one line per successful raise to every active messaging
    # route. True when the key is absent. Off: the raise still stores
    # and the WebSocket message and (for a high-priority raise) the
    # alert still fire.
    notify_messaging: true
    # autonomous.questions.notify_alert — while the channel is on, record
    # a warning-level alert in the alert store (and broadcast it) for
    # every high-priority raise. Normal-priority raises never alert.
    # True when the key is absent.
    notify_alert: true
    # autonomous.questions.return_path — while the channel is on, allow a
    # raise that opts in (return_path: true + session_id at raise time)
    # to receive one DATAWATCH_ANSWER: line in the asking session when
    # its answer is recorded. The default return path for every
    # question — the question_raised WebSocket message plus polling
    # GET /api/questions/{id} (which carries the answer once recorded) —
    # is always on regardless of this key; it only gates the opt-in
    # session line. True when the key is absent.
    return_path: true
    # autonomous.questions.decision_gate — the decision gate. A task whose
    # spec names an operator decision waits, instead of running, until
    # that decision has been answered on the question channel. On when the
    # key is absent. The gate only sees decisions while the question
    # channel above is on (decisions are raised and answered through it),
    # so keep the channel on whenever the gate is on. Turning the gate off
    # sends any task it is holding back to pending and stops further
    # waiting.
    # Change it with PUT /api/config {"autonomous.questions.decision_gate": false},
    # the comm channel (`configure autonomous.questions.decision_gate=false`),
    # the CLI (`datawatch config set autonomous.questions.decision_gate false`)
    # or the MCP config_set tool (key autonomous.questions.decision_gate,
    # value false). Takes effect at once, no restart needed.
    decision_gate: true
    # autonomous.questions.decision_gate_mode — what the gate does when it is
    # on. "shadow" (the default, and what the first release ships with):
    # the gate works out which tasks it would hold and records that once
    # per task on the Automaton's decision log, but holds nothing, so you
    # can watch it before trusting it. "on": a task waiting on an
    # unanswered decision is actually held until the answer arrives; its
    # dependents wait behind it. Any other value is refused
    # (PUT /api/config answers 400 and changes nothing).
    # Change it with PUT /api/config {"autonomous.questions.decision_gate_mode": "on"},
    # the comm channel (`configure autonomous.questions.decision_gate_mode=on`),
    # the CLI (`datawatch config set autonomous.questions.decision_gate_mode on`)
    # or the MCP config_set tool (key autonomous.questions.decision_gate_mode,
    # value on). Takes effect at once, no restart needed.
    decision_gate_mode: shadow
    # autonomous.questions.quality_mode — how a question is checked for being
    # readable before the operator sees it. "warn" (the default): a question
    # that is too short, names an internal tracker identifier or has an option
    # with no trade-offs written is raised anyway and the problems are listed
    # back to the asker. "refuse": the same check, and the raise is refused
    # with the problems listed. "off": no check. Any other value is refused
    # (PUT /api/config answers 400 and changes nothing).
    # Change it with PUT /api/config {"autonomous.questions.quality_mode": "refuse"},
    # the comm channel (`configure autonomous.questions.quality_mode=refuse`),
    # the CLI (`datawatch config set autonomous.questions.quality_mode refuse`)
    # or the MCP config_set tool (key autonomous.questions.quality_mode,
    # value refuse). Takes effect at once, no restart needed.
    quality_mode: warn
    # autonomous.questions.quality_min_text_chars — the fewest characters a
    # question's text may have before the check flags it as too short. A whole
    # number >= 0; default 60. 0 turns the length check off. A negative or
    # non-numeric value is refused (PUT /api/config answers 400).
    # Change it with PUT /api/config {"autonomous.questions.quality_min_text_chars": 80},
    # the comm channel (`configure autonomous.questions.quality_min_text_chars=80`),
    # the CLI (`datawatch config set autonomous.questions.quality_min_text_chars 80`)
    # or the MCP config_set tool (key autonomous.questions.quality_min_text_chars,
    # value 80). Takes effect at once, no restart needed.
    quality_min_text_chars: 60
    # autonomous.questions.quality_tracker_id_pattern — a regular expression
    # (Go syntax) the check uses to spot an internal tracker identifier in a
    # question, such as a short run of capital letters followed by digits. The
    # default matches that shape; set your own to match the identifiers your
    # planning registry uses. Empty reads as the default. A pattern that does
    # not compile is refused (PUT /api/config answers 400).
    # Change it with PUT /api/config {"autonomous.questions.quality_tracker_id_pattern": "\\b[A-Z]{2,4}-[0-9]+\\b"},
    # the comm channel (`configure autonomous.questions.quality_tracker_id_pattern=<pattern>`),
    # the CLI (`datawatch config set autonomous.questions.quality_tracker_id_pattern '<pattern>'`)
    # or the MCP config_set tool (key autonomous.questions.quality_tracker_id_pattern,
    # value the pattern). Takes effect at once, no restart needed.
    quality_tracker_id_pattern: '\b[A-Z]{1,3}[0-9]{2,4}\b'
    # autonomous.questions.queue_preview_lines — how many lines of a question
    # the queue row shows before the expand control. A whole number >= 1;
    # default 3. A value below 1 or a non-numeric value is refused
    # (PUT /api/config answers 400).
    # Change it with PUT /api/config {"autonomous.questions.queue_preview_lines": 5},
    # the comm channel (`configure autonomous.questions.queue_preview_lines=5`),
    # the CLI (`datawatch config set autonomous.questions.queue_preview_lines 5`)
    # or the MCP config_set tool (key autonomous.questions.queue_preview_lines,
    # value 5). Takes effect at once, no restart needed.
    queue_preview_lines: 3
    # autonomous.questions.worker_marker — whether a worker session may ask
    # the operator a question by printing a DATAWATCH_QUESTION: line (the
    # marker, then one line of JSON) in its output. Off when the key is
    # absent. When on, and the question channel above is on too, the daemon
    # raises the line as an ordinary operator question asked by
    # "worker-<short session id>", linked to its task, and announces it like
    # any other raise. A line with "blocked": true also parks the task on
    # the question (wait reason "await_decision: <question id>", capacity
    # slot given back, no retry counted) until the coordinator tick sees the
    # answer; a line that fails validation is dropped and audited as
    # question_marker_refused without its text. With the key off, or the
    # channel off, the line is ignored like any other output. One-shot
    # print-mode backends are not covered yet.
    # Change it with PUT /api/config {"autonomous.questions.worker_marker": true},
    # the comm channel (`configure autonomous.questions.worker_marker=true`),
    # the CLI (`datawatch config set autonomous.questions.worker_marker true`)
    # or the MCP config_set tool (key autonomous.questions.worker_marker,
    # value true). Takes effect at once, no restart needed.
    worker_marker: false
    # autonomous.questions.held_mode — the held-question pass: the daemon
    # raises its own operator question when an Automaton sits in a held
    # state (blocked, review_held, revision_requested, awaiting_decision
    # or pending_insert) waiting on a decision it will not make for the
    # operator. "shadow" (the default, and what an absent key reads as):
    # the pass computes each held Automaton and records one append-only
    # note per (item, state) on the Automaton's record — no question is
    # raised. "on": one question per held (item, state), deduped by a
    # stable key that survives a restart; every question carries the
    # state's real actions as options plus hold, which is always the
    # default, and a fixed-table recommendation. "off": the pass detects
    # nothing and writes nothing. Any other value is refused on write.
    # Change it with PUT /api/config {"autonomous.questions.held_mode": "on"},
    # the comm channel (`configure autonomous.questions.held_mode=on`),
    # the CLI (`datawatch config set autonomous.questions.held_mode on`)
    # or the MCP config_set tool (key autonomous.questions.held_mode,
    # value on). Takes effect on the next pass, no restart needed.
    # Read the report with GET /api/autonomous/held-questions (the
    # autonomous_held_questions MCP tool, `datawatch question held`), and
    # answer a raised question like any operator question — PWA,
    # REST, MCP `question_answer`, CLI `datawatch question answer`, chat.
    held_mode: shadow
    # autonomous.questions.held_states — the held state ids the pass
    # covers: blocked, review_held, revision_requested, awaiting_decision,
    # pending_insert. Absent (no list) means all five; an explicit empty
    # list means none; an unknown id is refused on write.
    held_states:
      - blocked
      - review_held
      - revision_requested
      - awaiting_decision
      - pending_insert

  # Decision records: a structured record of one operator decision (a title, the
  # situation in plain words, what is being decided, the options with a line of
  # cost and risk each, a recommendation and a forced default). The daemon
  # raises its queue question from the record, never from caller prose. Every
  # key below is settable through the config file, PUT /api/config (dotted keys,
  # for example "autonomous.decisions.clarity_mode"), the MCP config tools
  # (config_set), `datawatch config set autonomous.decisions.<key> <value>`, a
  # comm channel `configure autonomous.decisions.<key>=<value>`; a change takes
  # effect at once, no restart needed. A bad value is refused (PUT /api/config
  # answers 400 and changes nothing; the config file load names the key). No key
  # is tied to a repository; each default is the operator's answer. The block is
  # commented out: every key reads its default shown here until you uncomment
  # it and set a value.
  # decisions:
    # autonomous.decisions.enabled — type bool, default true. Master switch for
    # decision records.
    # enabled: true
    # autonomous.decisions.folder — type text (a folder), default empty. A
    # folder of decision files the daemon watches; empty turns the folder watch
    # off.
    # folder: ""
    # autonomous.decisions.folder_glob — type text, default "*.md". Which files
    # in the folder are read.
    # folder_glob: "*.md"
    # autonomous.decisions.front_matter_delimiter — type text, default "---".
    # The line that opens and closes the front matter of a decision file; it may
    # not be empty.
    # front_matter_delimiter: "---"
    # autonomous.decisions.front_matter_separator — type text, default ":". Splits
    # a front matter line into its key and its value; it may not be empty.
    # front_matter_separator: ":"
    # autonomous.decisions.front_matter_field_separator — type text, default "|".
    # Separates the parts of an option or recommendation line; it may not be
    # empty.
    # front_matter_field_separator: "|"
    # autonomous.decisions.front_matter_keys — type map of text to text, default
    # empty (files use the canonical names). Maps a canonical key name to the
    # name your files use for it, for example {title: Title}.
    # front_matter_keys: {}
    # autonomous.decisions.folder_withdraw_on_delete — type bool, default true.
    # Deleting a decision file withdraws its record.
    # folder_withdraw_on_delete: true
    # autonomous.decisions.clarity_mode — type text, one of off, warn or refuse,
    # default warn. How a record is checked for being readable before the
    # operator sees it: warn raises it and lists the problems, refuse refuses it,
    # off does no check.
    # clarity_mode: warn
    # autonomous.decisions.clarity_min_text_chars — type whole number >= 0,
    # default 60. The fewest characters the situation and the deciding text may
    # have; 0 turns the length check off.
    # clarity_min_text_chars: 60
    # autonomous.decisions.clarity_require_tradeoffs — type bool, default true.
    # Every option needs a one-line cost and risk.
    # clarity_require_tradeoffs: true
    # autonomous.decisions.clarity_require_label — type bool, default true. A
    # record needs a short human label.
    # clarity_require_label: true
    # autonomous.decisions.clarity_tracker_id_pattern — type regular expression
    # (Go syntax), default empty (the built-in pattern for a short run of capital
    # letters followed by digits). Spots an internal tracker identifier in a
    # record.
    # clarity_tracker_id_pattern: ""
    # autonomous.decisions.doc_root — type text (a folder), default empty (the
    # daemon's working directory). Document paths on a record resolve against it
    # and must stay inside it.
    # doc_root: ""
    # autonomous.decisions.doc_status_mode — type text, one of off, report or on,
    # default report. Whether an answer is written back to the status line of the
    # linked document: report shows what would change, on changes it, off does
    # nothing.
    # doc_status_mode: report
    # autonomous.decisions.doc_status_pattern — type regular expression (Go
    # syntax), default '^Confirmed:.*$'. Finds the status line in the document.
    # doc_status_pattern: '^Confirmed:.*$'
    # autonomous.decisions.doc_status_template — type text, default
    # 'Confirmed: {choice} - "{quote}" ({actor}, {date})'. The text the status
    # line is replaced with. Placeholders: {choice}, {choice_label}, {quote},
    # {actor}, {date}, {decision_id}.
    # doc_status_template: 'Confirmed: {choice} - "{quote}" ({actor}, {date})'
    # autonomous.decisions.follow_ups — type list of {name, kind, target},
    # default empty (nothing runs unless you configure it). kind is
    # start_template (target is a template id) or open_automaton (target is an
    # Automaton id). A name may not be empty or repeat; kind and target may not be
    # empty. Example:
    #   follow_ups:
    #     - {name: start the build, kind: start_template, target: my-template}
    # follow_ups: []
  # Daemon-wide default for how many independent tasks of one Automaton run
  # at once. An Automaton's own max_concurrent_tasks overrides it. 1 = one
  # task at a time (sequential). Tasks of different Automata are not limited
  # by this key.
  max_concurrent_tasks: 1
  # How recent an Automaton's last activity must be for the daemon to resume
  # it automatically at startup (seconds). A PRD left in "running" state when
  # the daemon stopped is resumed on boot only if its newest activity is
  # within this many seconds — 0 = never auto-resume, -1 = no age limit.
  # A live worker session on an in-progress task counts as activity, so an
  # Automaton with a live worker is not treated as stale. A parked
  # Automaton is resumed with the resume action (REST, MCP, CLI, chat or
  # the PWA Resume button), not by approving it.
  # The resume also always requires the PRD's project directory to still
  # exist; a missing directory parks the PRD as blocked (with a reason) and
  # raises an operator alert either way. Default 3600.
  # resume_max_age_seconds: 3600
  # First-attempt cost. first_attempt maps a task kind (implementation, docs,
  # note, final_gate) to the backend and model its first attempt runs on. An
  # absent or empty entry keeps today's choice. A backend that needs a model
  # (pi, pi-prompt, ollama) must name one.
  # first_attempt:
  #   docs:
  #     backend: pi-prompt
  #     model: qwen3.8:27b
  # Default: empty (no kind is routed). Set per kind with
  # `datawatch config set autonomous.first_attempt.<kind>.model <name>` (set the model before a pi, pi-prompt or ollama backend). How-to: docs/howto/failure-escalation.md#choosing-the-first-attempt-worker
  # Failed attempts before the next attempt moves to the stronger choice.
  # Default 1 (the first failure escalates). Range 0-20. How-to: docs/howto/failure-escalation.md#choosing-the-first-attempt-worker
  # first_attempt_escalate_after_failures: 1
  # Largest prior-context size, in tokens, a retry may resume with. Default
  # 150000. 0 means every retry starts a fresh session. Range 0-2000000. How-to: docs/howto/failure-escalation.md#retry-resume-continuing-the-previous-session
  # retry_resume_max_context_tokens: 150000
  # Number of local-model sessions one compute node runs at once. Default 1;
  # values below 1 are clamped to 1. The cap applies only to sessions whose
  # model runs on a local engine on that node (pi, pi-prompt, ollama, opencode,
  # opencode-acp). Hosted backends such as claude-code are not gated by this key.
  # Sessions past the cap wait in the node queue (see docs/operations.md →
  # "Compute-node queue").
  # A compute node that hosts a local engine takes its own count: the node's
  # session_slots when the operator set one, otherwise one slot per GPU from
  # observer data (limited by free GPU memory), or with no GPU data its free
  # system memory against the model size. This key is the count for such a
  # node with neither. A node that hosts no local engine keeps its
  # max_concurrent_sessions limit instead. These are the executor's slots;
  # a node's verifier runs take their own pool (compute_nodes[].verifier_slots,
  # see the block under "Compute node slot override" below) and do not draw on
  # this count.
  max_engines_per_node: 1
  # host_load_alert: the host load check. When the load average stays above
  # `multiple` times the core count for `minutes` minutes, the daemon raises ONE
  # warning alert for that episode ("Host load high: Automata may be slowed")
  # naming the busiest process groups and whether each belongs to a worktree or
  # scratch folder of a running or ended session. The episode ends when the load
  # falls back under the limit, and the next breach alerts again. The check runs
  # from the daemon once a minute and reads the live setting each time, so a
  # change needs no restart.
  #   mode: string, `off`, `alert` (default) or `reap`. `off` does nothing.
  #     `alert` only reports. `reap` also ends processes of ENDED sessions that
  #     the orphan reaper's evidence rule proves belong to the session (by exact
  #     process id; nothing is ever ended by name, and a running session is
  #     never touched). An absent or empty value reads as `alert`; any other
  #     value is refused on load, on PUT /api/config and on PUT
  #     /api/autonomous/config with 400, and nothing is written.
  #   multiple: number >= 0. Load-to-cores multiple that counts as a breach.
  #     0 or absent reads as 1.5. Negative is refused.
  #   minutes: whole number >= 0. How long a breach must last before it alerts.
  #     0 or absent reads as 10. Negative or fractional is refused.
  # Settable via PUT /api/config (keys autonomous.host_load_alert.mode,
  # .multiple and .minutes; GET /api/config shows the effective values),
  # PUT /api/autonomous/config (host_load_alert object), CLI `datawatch
  # autonomous config-set --host-load-alert-mode reap --host-load-alert-multiple 2
  # --host-load-alert-minutes 15` (or the JSON object), comm `configure
  # autonomous.host_load_alert.mode=reap`, the MCP autonomous_config_set tool
  # (host_load_alert_mode, host_load_alert_multiple, host_load_alert_minutes),
  # and the PWA Settings > General > Autonomous fields
  # (settings_host_load_alert_mode, _multiple, _minutes).
  host_load_alert:
    mode: alert
    multiple: 1.5
    minutes: 10
  # max_parallel_tasks: DEPRECATED — never had any effect; accepted and ignored
  # with a startup warning for one release, then removed. Use max_concurrent_tasks.
  # BL428 §3a (docs/plans/2026-10-14-concurrency-and-budget-design.md) — how
  # Automaton task writes that target the same project tree are serialized.
  # "advisory" (default): the daemon enforces an exclusive per-canonical-tree
  # lock at admission — tasks on the same tree queue, different trees run in
  # parallel. "parallel": RESERVED but DISABLED — recognized and accepted
  # until the real mechanism lands in the follow-up implementation PRD; the
  # daemon still enforces the advisory lock and logs a startup warning.
  # Any other value is a config error and the daemon refuses to start.
  # Operator guide: docs/operations.md → "Project-tree write serialization";
  # mechanism: docs/implementation.md → "Per-tree write lock (Automata)".
  project_write_serialization: advisory
  # BL428 §3a ii — admission-time companion: when true, task admission
  # hard-fails (error naming the dirty file count and the options — commit
  # or stash first, git clean, or set this back to false) if the PRD's
  # project tree has uncommitted changes (git status --porcelain
  # non-empty). Default false.
  refuse_dirty_tree_start: false
  # Parallel tasks inside one Automaton (autonomous.parallel.*). Every default
  # below is the operator's choice for this installation; other users may
  # change any of them. Operator guide: docs/howto/automaton-parallel-tasks.md;
  # terms: docs/datawatch-definitions.md -> "Read-only tasks", "Parallel task
  # worktrees" and "Parallel speedup". Changeable from the web app, PUT
  # /api/config, `datawatch config set`, chat `configure` and MCP
  # `autonomous_config_set` (parallel_* arguments), with no restart.
  parallel:
    # read_only_tasks: a task flagged read_only skips the per-tree write lock
    # and runs beside other tasks. Default true. An explicit false is kept and
    # makes every task take the lock.
    read_only_tasks: true
    # worktree_per_task: each task that runs alongside others gets its own
    # worktree and branch off the Automaton branch; the branch is merged back
    # in dependency order when the task is verified. Default true. false keeps
    # all tasks in the one worktree.
    worktree_per_task: true
    # merge_conflict_policy: what happens when a task branch does not merge
    # cleanly. additive_then_model (default) keeps both sides of additive
    # changes and asks merge_conflict_model for the rest; block holds the task
    # at once; triage raises the conflict as an operator question. Any other
    # value is refused.
    merge_conflict_policy: additive_then_model
    # merge_conflict_model: the model that resolves a conflict. Default empty,
    # which uses the strongest configured planning model.
    merge_conflict_model: ""
  # Capacity-aware admission: tasks wait for a free host / compute-node / LLM
  # slot (status waiting_capacity) instead of failing. Default true.
  # Per-node limit: compute node session_slots (0 = derive from observer GPU
  # data; hosting nodes only), capped by max_concurrent_sessions; a node's
  # verifier runs take the node's own verifier pool (verifier_slots, unset = 1
  # on a node that hosts a local engine, 0 = no verifier runs there) instead of
  # drawing on these executor slots; per-LLM: max_inflight
  # (0 = unlimited) or, when an explicit max_inflight is absent, the LLM entry's
  # plan_tier mapped through plan_tier_max_inflight below; per-Automaton queue
  # order: priority (set_priority).
  # v8.36.0 — the same node:/llm: pools are now also enforced for: (1) an
  # interactive session start (see session.capacity_wait_seconds above —
  # short timeout, since that's a synchronous HTTP request, not a background
  # retry loop), and (2) the BL25 verifier's own /api/ask call, which
  # previously had zero capacity interaction at all.
  capacity_enabled: true
  # Longest a task may wait for capacity before failing (seconds). Default 14400.
  capacity_wait_timeout_seconds: 14400
  # Pool fall-through (default false). When a task's requested LLM pool is full
  # and another allowed backend/model can take it now, admit it there instead
  # of waiting. Off = a task always waits for its own pool.
  capacity_fallthrough: false
  # Node over-admission rules (all default true; false restores the earlier
  # behaviour). capacity_strict_node_limit: a session adopted onto a full node
  # (a resumed worker, or a verifier) is held outside the node's pool yet still
  # counts against it, so the pool never reads over its limit.
  # capacity_count_pool_by_node: an llm: pool counts the sessions on each node
  # up to that node's own limit. capacity_adopt_before_admit: after a restart,
  # new requests wait until resumed workers are adopted, at most
  # capacity_adoption_wait_seconds (default 30; 0 = 30).
  capacity_strict_node_limit: true
  capacity_count_pool_by_node: true
  capacity_adopt_before_admit: true
  capacity_adoption_wait_seconds: 30
  # How often the daemon re-checks LLM role tags for contention (seconds):
  # two enabled entries claiming one role, or two roles that have converged on
  # one entry since the last check. Warnings only; nothing is blocked. Unset or
  # < 1 => 300. Every llms write also runs the check immediately.
  role_scan_interval_seconds: 300
  # Session priority (a session field, not a config.yaml key): an integer that
  # orders a session's calls in the capacity wait queue, higher first, default
  # 0. Set it when starting a session (REST `priority`, MCP start_session,
  # CLI `session new --priority`, comm `new: priority=<n>: <task>`) or later
  # with POST /api/sessions/set_priority, MCP set_session_priority, CLI
  # `session priority <id> <n>` or comm `priority <id> <n>`. A
  # non-integer value is refused on every surface. Same ordering rule as the
  # per-Automaton priority (set_priority) above.
  # LLM plan-tier inflight caps (map tier -> max concurrent autonomous
  # sessions, 0 = unlimited). An LLM registry entry can carry a plan_tier
  # (unset | pro | max_5x | max_20x | api — the operator's subscription tier
  # for that LLM, editable in Settings > Compute > LLM edit, or via REST
  # PUT /api/llms/{name} / MCP llm_update; see docs/api-mcp-mapping.md). Its
  # llm:<name> pool limit is then the value mapped above, unless an explicit
  # max_inflight > 0 on that entry wins outright. An entry with neither gets
  # a conservative kind default (1 for subscription kinds such as claude-code,
  # unlimited for local Ollama/OpenWebUI kinds — which stay governed by the
  # node: pools and max_engines_per_node — and for dollar-metered API kinds).
  # The default table is operator policy, not a technical limit: pro=1,
  # max_5x=2, max_20x=4, api=0 (unlimited; cap dollars instead with a
  # per-LLM budget, see plan_tier_allocation_usd below). Unknown tiers or negative caps are config errors — the daemon
  # refuses to start naming the key. Same key over REST / MCP config_set.
  plan_tier_max_inflight:
    pro: 1
    max_5x: 2
    max_20x: 4
    api: 0
  # Operator-declared notional dollar allocation per budget window, at API
  # rates, for each plan tier (map tier -> dollars; pro | max_5x | max_20x |
  # api; 0 or absent = not declared). This is operator policy, not a measured
  # limit: you declare the figure you want the estimate measured
  # against. It feeds only the
  # allocation_pct estimate of an LLM budget (below) and never blocks, gates or
  # throttles anything. Unknown tiers or negative values are config errors —
  # the daemon refuses to start naming the key. Default is empty (nothing
  # declared). Same key over REST / MCP config_set / the Settings page.
  plan_tier_allocation_usd: {}
  #   pro: 20
  #   max_5x: 100
  #   max_20x: 200
  # Per-LLM workload roles (LLM registry entry, not a config.yaml key). Every
  # llms[] entry may carry an optional "roles" list naming the workloads it
  # serves (open set of strings such as planning or verification). Set in
  # Settings > Compute > LLM edit, or over REST PUT /api/llms/{name}, MCP
  # llm_add / llm_update, CLI "datawatch llm add|update --role <role>"
  # (repeatable), comm "llm add|update ... roles=<csv>". Roles are trimmed,
  # lower-cased and de-duplicated; an empty role is refused. On update, omit
  # the field to keep the stored roles and send an empty list to clear them.
  # An explicit per-call-site backend or model always wins over a role lookup.
  # Only enabled entries claim a role; when several do, the first by name is
  # used and a contention warning is raised (see role_scan_interval_seconds
  # above). Resolved table: GET /api/llm-roles. Shape:
  #
  #   llms:
  #     - name: big-gpu
  #       roles: [planning, verification]
  #
  # Per-LLM dollar budget (LLM registry entry, not a config.yaml key). Every
  # LLM entry may carry an optional "budget" object, set in Settings > Compute
  # > LLM edit, or over REST PUT /api/llms/{name}, MCP llm_add / llm_update,
  # CLI "datawatch llm add|update --budget-*". An LLM with no budget is never
  # limited by dollars. Shape:
  #
  #   budget:
  #     ceiling_usd: 50        # dollars one window may spend; required, > 0
  #     # Pick exactly one window style:
  #     hours: 168             # rolling window of the trailing N hours (1-720)
  #     # weekday: monday      # weekly window that resets at this weekday...
  #     # time: "09:00"        # ...at this 24h HH:MM clock time (default 00:00)
  #     # zone: America/New_York  # ...read in this IANA zone (default UTC)
  #     allocation_pct: false  # opt in to an estimated share-of-allocation
  #                            # figure in the budget status. Always marked
  #                            # estimated and never blocks anything. Needs the
  #                            # LLM's plan_tier and plan_tier_allocation_usd.
  #     peer_window: []        # federation peer names whose spend also counts
  #                            # toward the ceiling. Empty and off by default;
  #                            # only peers you list are counted, and an
  #                            # unreachable peer is skipped, never a stall.
  #
  # While the window is full, autonomous work for that LLM waits with the
  # reason "budget window full: ..." and resumes by itself when the window
  # rolls over. Operator-started sessions are never held back. The check
  # happens at admission, so work already admitted when the ceiling is crossed
  # may overshoot it. Spend is persisted under <data_dir>/autonomous/ so a
  # restart does not forget it. Read it with GET /api/budget, MCP
  # budget_status, "datawatch budget status" or the comm "budget" command.
  #
  # Audit events. The capacity gate, the usage back-off (usage_backoff and
  # backoff_max_wait_minutes) and the budget write these audit actions, each
  # once per change and never per poll: autonomous_capacity_wait,
  # autonomous_capacity_admitted, autonomous_usage_backoff_set,
  # autonomous_usage_backoff_cleared, autonomous_usage_backoff_auto_cleared,
  # autonomous_usage_backoff_patterns_rechecked, autonomous_budget_ceiling_wait,
  # autonomous_budget_window_resumed and autonomous_budget_window_rollover.
  # Read them with GET /api/audit (action=autonomous_* lists the family;
  # subject= narrows to one task, backend or LLM), MCP audit_query,
  # "datawatch audit" or the comm "audit" command. No new config keys were
  # added for this: the events follow the settings above.
  # Hold new tasks while a node's busiest GPU is at/above this percent (0 = off).
  capacity_gpu_util_pct: 0
  # Rate ceiling applied to each llm: pool, on top of its concurrency limit.
  # capacity_rate_requests caps lease grants (task and verifier starts) per
  # rolling window; capacity_rate_tokens caps the tokens recorded from session
  # usage per window. 0 = no ceiling on that dimension (the default, so
  # existing installs are unchanged); negative values are rejected.
  # capacity_rate_window_seconds is the window length; 0 = 3600, and it only
  # matters when a ceiling is set. A pool at its ceiling makes new work wait
  # until the oldest counted use leaves the window.
  capacity_rate_requests: 0
  capacity_rate_tokens: 0
  capacity_rate_window_seconds: 0
  # LLM backend used for the planning/decompose call. Any configured LLM name works:
  # opencode/claude-code spawn a full session with codebase tool access (recommended);
  # ollama/openwebui run headless via /api/ask. Old key "decomposition_backend" accepted on read.
  # Per-PRD override: set decomposition_profile via POST /api/autonomous/prds/{id}/set_llm,
  # the PWA Settings modal, or CLI --decomposition-profile. Per-PRD value takes priority.
  planning_backend: ""
  # Planning routing and retry ladder: choose the planner per Automaton by rule.
  # Off by default, no rules. An Automaton's own planning fields win over routing;
  # when routing is off or no rule matches, the global planner above is used.
  # Rules are walked in order and the first match wins. Settable from YAML, the
  # CLI (datawatch autonomous planning-routing), the PWA Settings card,
  # PUT /api/autonomous/planning-routing, the comm channel and MCP
  # (planning_routing_set). A bad block is rejected and nothing is applied.
  planning_routing:
    # Turn routing on. false = the normally resolved planner is used.
    enabled: false
    # Record the routed decision (see would-route counts in the scorecard)
    # without changing the planner. Use before turning rules on.
    shadow: false
    # Ordered rules, first match wins. Empty list = no routing. Each rule:
    #   name:     unique name (also usable as an override)
    #   match:    kind, tags, project, risk_class (lists; empty = any, any entry
    #             matches), spec_size_min / spec_size_max (bytes, 0 = unbounded),
    #             override (free-form tag)
    #   planners: ordered [{backend, model}]; first is the planner, the rest are
    #             its escalation targets (at least one)
    #   ladder:   a name under ladders; empty = default
    # The two example rules below are examples only and are NOT active; copy one,
    # use backends and models from your own LLM registry, and try it in shadow
    # mode first.
    rules: []
    #  - name: security-strong
    #    match:
    #      risk_class: [security]
    #      tags: [security]
    #    planners:
    #      - {backend: claude-code, model: claude-opus-5-5}
    #      - {backend: pi-prompt, model: "qwen3.8:27b"}
    #  - name: design-strong
    #    match:
    #      tags: [design, ui]
    #    planners:
    #      - {backend: claude-code, model: claude-opus-5-5}
    #      - {backend: pi-prompt, model: "qwen3.8:27b"}
    # Retry ladders by name. The built-in "default" exists even if omitted.
    # A count of 0 reads as its default; counts cannot be negative.
    ladders:
      default:
        # Most touch-up passes (the planner fixes only the flagged tasks).
        touch_up_max: 1
        # Most replans (the findings are fed back and the planner plans again).
        replan_max: 1
        # Failed attempts at one planner before the next planner in the rule.
        escalate_after_attempts: 2
    # Risk classes by name: tags on the Automaton or path globs on the files its
    # tasks touch ("dir/**" matches everything under dir). An entry with a
    # built-in name replaces the built-in. Built-ins are security (tag security;
    # globs security/**, internal/server/auth*) and design (tags design, ui).
    classes:
      security:
        tags: [security]
        path_globs: ["security/**", "internal/server/auth*"]
      design:
        tags: [design, ui]
  # Fallback backend for autonomous task sessions. Task backend resolution
  # checks (1) task.backend, (2) prd.backend, (3) this field, (4) the global
  # session.llm_backend. Set to "opencode" to ensure all autonomous tasks run
  # via opencode even after a reset_to_draft clears the PRD's backend field.
  execution_backend: ""
  # BL25 verifier backend. Empty = default to the PRD's own backend (v8.36.0)
  # when it resolves to an ask-compatible kind (ollama/openwebui, or a
  # directly-configured Claude API entry) — falls back to the global
  # "ollama" default when the PRD's backend is session-only (claude-code,
  # opencode, ...), which has no single-shot /api/ask adapter regardless of
  # whose backend it is. Set explicitly to force a different backend (e.g.
  # ollama when planning backend is claude-code) for cross-backend
  # independence, or to pin a specific model via verification_model below.
  verification_backend: ""
  # BL25 verifier model override. Empty = default to the PRD's own model
  # when verification_backend was also left empty and the PRD's backend was
  # ask-compatible (v8.36.0); otherwise the resolved backend's own default
  # model.
  verification_model: ""
  # v9.10.18 — pinned model for the guardrail JUDGE (rules-review, ci-watch,
  # per-task / per-story guardrails, rejudge). Tier 3 of the 5-tier
  # precedence chain that replaces the old silent backend-default fallback:
  # PRD guardrail_model → task guardrail_model → this field →
  # verification_model → planning_model. Empty = the tier falls through to
  # the next; if ALL tiers resolve to nothing servable on the judge
  # backend, the record gets a loud non-retried infra-category block
  # (ErrNoGuardrailModel) — a pi-family judge NEVER runs on the backend's
  # built-in default model. Pairing is validated per tier (a bare Claude
  # alias on a pi-family backend, or a provider-qualified model on
  # claude-code, is skipped with a recorded reason).
  guardrail_model: ""
  # BL41 effort hint for the planning LLM call.
  # BL304: renamed from decomposition_effort; old key still accepted on read.
  planning_effort: "thorough"
  # BL41 effort hint for the verifier.
  # Per-task / per-story / per-Automaton overrides (set_*_verification_llm) take precedence over verification_backend / verification_model / verification_effort.
  verification_effort: "normal"
  # Bound in seconds for one verifier or per-task guardrail judgment session.
  # 0 or negative falls back to the 1800-second (30m) default. Local models can
  # need more than this; the old hard-coded limit was 10m and timed out slow
  # local models.
  verification_timeout_seconds: 1800
  # Keep the classify-mode score vector and the route (node, model, read path)
  # on every verification result so a verdict can be reproduced. Default true
  # when unset. false keeps only the verifier mode. Shown on the verdict in the
  # web app and by `datawatch llm classifier verdicts`.
  verification_record_scores: true
  # Scope-breadth classifier. When true, a task whose verification fails on its
  # content is asked whether it bundles several separable units, and the failure
  # is marked scope_too_broad so the split signal can act on it. Needs a
  # classify-mode judge (see the llm verification_mode setting). Default false.
  scope_breadth_enabled: false
  # Judge routing (PRD guardrail, plan-review and other autonomous judges).
  # judge_policy is the ordered list of backends the judges try, one attempt
  # each; the attempts total the list length. A judge moves to the next backend
  # only when its run hits the time limit. Empty (default) = the judges follow
  # the verifier routing policy (the same modes and backends the verifiers use),
  # one attempt per backend it offers. A unit with its own task or PRD
  # guardrail backend override keeps that one backend.
  judge_policy: []
  # Time limit in seconds for one judge run, counted from the judge's start;
  # the wait for a capacity slot does not count. 0 or negative falls back to
  # the 1800-second (30-minute) default.
  judge_timeout_seconds: 1800
  # Size-aware judge routing. When the change under review is larger than this
  # many changed lines (added plus deleted, on the Automaton branch against its
  # merge base, lock files left out), the judge tries claude-code first and the
  # other backends follow in their usual order, still one attempt per backend.
  # In balance mode the load still decides and the order only breaks ties.
  # 0 turns the rule off. Default 400.
  judge_size_threshold_lines: 400
  # Strong judge backend for size-aware routing: the backend a diff at or
  # above judge_size_threshold_lines is routed to first. Empty (the default)
  # resolves to the last backend in judge_policy (the strong Claude judge
  # when the chain is "local then Claude"); a value not in judge_policy
  # leaves the judge backend order unchanged. Any LLM backend name is
  # accepted; the key is not validated against a backend list.
  judge_strong_backend: ""
  # Per-commit judge verdict cache, on by default (an unset value reads
  # true). A completed pass, or a block whose category is a real finding,
  # is stored keyed on (commit sha, judge policy, rules) and replayed on
  # the same triple instead of running the judge again. A review timed out
  # (a judge that hit its limit; category judge-timeout) never produces a
  # completed verdict, so it is never cached; the same is true of a
  # verdict that crashed or returned unparseable output, so a later retry
  # still gets its genuine chance to run. An explicit false
  # disables the cache and re-judges every guardrailed commit for real.
  # Cache file: judge_verdict_cache.json in the PRD store directory; it
  # survives daemon restarts.
  judge_verdict_cache_enabled: true
  # Judge prompt size limit, in lines. A judge prompt longer than this is
  # written to a file and the judge is told to read it, instead of the whole
  # text being typed into its session. 0 turns the file route off (the full
  # prompt is always sent). Whole number, 0 to 100000. Default 300.
  judge_prompt_file_threshold_lines: 300
  # Extra seconds a judge run waits for a long prompt to be delivered, added
  # for every 1000 lines of the prompt. 0 adds no extra wait. Whole number,
  # 0 to 3600. Default 60.
  judge_delivery_wait_per_thousand_lines_seconds: 60
  # --- Plan review before approval (off by default) ---
  # LLM backend that reviews each PRD's plan (spec vs. decomposed stories/
  # tasks) after decompose. Empty (default) = no review; the PRD goes to
  # needs_review unchanged. Any configured LLM works (same rules as
  # planning_backend). The reviewer gets a bounded projection of the plan
  # (spec + story/task titles, specs, dependencies, kinds, verification
  # scripts, each capped), not the whole repository.
  plan_review_backend: ""
  # Model for the plan reviewer. Empty (default) = the backend's own
  # default model.
  plan_review_model: ""
  # Plan-review mode:
  #   "" / off   (default) - no review; approval is never affected
  #   warn        - review runs and its verdict is recorded on the PRD
  #                 (visible in the PWA, REST, MCP) but never blocks approval
  #   block       - a verdict of ok:false refuses POST .../approve until it
  #                 is replaced (re-run the review until it passes, or
  #                 re-decompose). A reviewer outage or unparseable verdict
  #                 (reviewer_failed) is recorded but never blocks approval
  #                 in any mode.
  # Unknown values are a config error (a typo cannot silently disable a gate).
  # Re-run a review any time: PWA re-run button, POST /api/autonomous/prds/{id}/plan-review,
  # MCP autonomous_prd_plan_review, comm `autonomous plan-review <id>`,
  # CLI `datawatch autonomous prd-plan-review <id>`.
  plan_review_mode: ""
  # LLM that VERIFIES the plan's own smoke / final-gate verification task —
  # i.e. the judge for the plan's verification script, independent of the
  # task's worker and of the plan reviewer. Decompose sets kind="smoke" on
  # that task; the final-gate task (kind="final_gate") runs the script. Both
  # accept an explicit per-task verifier (set-task-verification-llm) and the
  # per-task value always wins; these keys are the default surface and never
  # clobber an explicit choice (including a deliberate clear). Empty (default)
  # = no split; verification resolves exactly as before.
  smoke_verification_backend: ""
  smoke_verification_model: ""
  # autonomous
  # Idle nudge for PRD-owned claude-code workers: after this many seconds idle the
  # worker is sent one message asking it to print its completion line or continue.
  # 0 or unset => 180.
  # Read-only effective value: GET /api/config (autonomous section) returns
  # worker_idle_nudge_effective_seconds, the window the daemon applies (180 when unset).
  worker_idle_nudge_seconds: 180
  # Seconds, counted from the nudge, a nudged worker may stay silent before it is
  # stopped and retried. 0 or unset => 600.
  # Read-only effective value: GET /api/config (autonomous section) returns
  # worker_idle_nudge_stall_effective_seconds, the window the daemon applies (600 when unset).
  worker_idle_nudge_stall_seconds: 600
  # Consecutive infra verifier failures on one task after which that task's next
  # verification runs on fallback_verification_backend (then the count resets).
  # 0 or unset => 2.
  verifier_infra_escalation_threshold: 2
  # Backend used for that one escalated verification. Empty => claude-code.
  fallback_verification_backend: claude-code
  session_idle_timeout_seconds: 900   # bound on one worker/verifier session sitting in waiting_input/idle with no live child process; exceeded => infra failure 'session idle without completion', alert raised, auto_fix_retries budget handles the retry
  descendant_stall_seconds: 2700   # bounds a pi-prompt worker whose only liveness is a work child process: no output, file change or log write for this long (default 2700) => reaped as an infra failure
  # A claude-code autonomous session must show a sign of work within this many
  # seconds of starting: an assistant turn, a tool call (line or spinner), a
  # process it started, a pane change or a channel event after delivery. Still
  # in waiting_input with no sign of work past this => 'session never started'
  # failure (alert carries the last 20 transcript lines), up to 2 start failures
  # retried before the task stays failed. The silence is measured from the last
  # evidence of life: the last sign of work, or for a worker the daemon launched
  # that has shown none yet, the first check that finds it silent. One start
  # tracker applies to a claude-code worker the daemon launches and to one it
  # adopts after a restart; an adopted worker's clock starts from its last
  # evidence of life before the restart.
  # 0 or unset falls back to the 120s default
  # (NormalizeSessionStartConfirmSeconds).
  verifier_no_progress_timeout_seconds: 900   # a verifier session with no output file, no pane activity, no live runner process and no held capacity slot for this long is ended as an infra failure ('verifier no-progress watchdog'); 0 or negative => 900
  session_start_confirm_seconds: 120
  # Orphan sweep grace period, in seconds. A live task worker session
  # (name "autonomous:<title>", with a PRD/task link) that is not the current
  # session of any non-terminal task is reported when first seen and ended once
  # it has stayed orphaned longer than this. Verifier, decompose, guardrail
  # judge, council and eval sessions are never swept. 0 or unset falls back to
  # the 300s default (NormalizeOrphanGraceSeconds).
  orphan_grace_seconds: 300
  # Which live session survives when two or more match one task (a daemon
  # restart or a pre-spawn lookup finds duplicates): "older" (default) keeps
  # the older session until it ends; "newer" keeps the newer one. The other
  # sessions are ended through the session killer, only after their process
  # exit is confirmed, never by name pattern. Each decision is recorded on the
  # task (session_decisions) and in the audit log.
  duplicate_session_keep: older
  # What a requested daemon restart does about running work. "immediate"
  # (default) restarts at once. "wait_quiet" waits up to
  # restart_quiet_timeout_seconds for zero running tasks, then proceeds or
  # aborts per restart_on_timeout. "drain" stops new tasks starting, lets the
  # running ones finish, then restarts. Every restart logs, and its REST/MCP
  # reply carries, the count of running tasks and live sessions it interrupts
  # (GET /api/autonomous/restart-interruptions reads the same count).
  restart_policy: immediate
  restart_quiet_timeout_seconds: 600   # wait_quiet only; 0 or unset => 600
  restart_on_timeout: proceed          # wait_quiet only: "proceed" or "abort"
  loop_detect_turns: 3   # pi worker observability (docs/operations.md): how many of the worker's most recent assistant turns the live loop detector compares (announce-without-acting or identical-call repeats => loop rescue); 0 = loop detection off; negative rejected
  # Stall window for a running worker, in seconds. A worker counts as stalled
  # only when, for this many seconds, it has no output, no live child process,
  # no backend activity, and no file change in its work directory. 0 or
  # negative inherits session.stale_timeout_seconds.
  stale_task_seconds: 900
  # Stuck-running watchdog bound, in seconds. An Automaton that stays in
  # running with every task finished, no live worker session and no live
  # executor for this long has its completion roll-up re-fired once; if it is
  # still stuck after a second full bound it is moved to blocked. 0 or unset
  # falls back to the 900s default (NormalizeStuckRunningSeconds).
  stuck_running_seconds: 900
  # Automata checks. Each mode is off, shadow (record the finding only) or on.
  # An unknown mode is rejected. Per-project overrides live under
  # autonomous.checks.projects.<project_dir>.
  checks:
    # Before a task starts: its verification script exists, is executable and
    # starts with a shebang line.
    pre_start_verifier: on
    # When the pre-start verifier is on, block the start of a task whose
    # verification script is missing (false records the finding and lets it start).
    block_when_missing: true
    # Plan-rule findings on a decomposed plan.
    plan_rules: on
    # The after-done checklist when an Automaton finishes (version files, change
    # log, configuration reference, parity issue, registry row).
    after_done: on
    # The registry table compared against the plan documents.
    registry_readme: on
  # Ship steps for a finished release. Modes as above; shadow records the
  # command it would run and runs nothing. Per-project overrides live under
  # autonomous.ship.projects.<project_dir>.
  ship:
    push: on
    tag: on
    ci_watch: on
    # Tag name template; must contain {version}.
    tag_format: "v{version}"
    remote: origin
    # Workflow names the CI watch follows; empty watches all of them.
    ci_workflows: []
  # Wall-clock cap on one task attempt, in seconds. When it expires the
  # attempt is stopped and failed with the max-attempt reason. 0 (the
  # default) means off. Recommended: 5400 (90 min).
  task_max_attempt_seconds: 0
  # Seconds one task attempt may go without progress before it is stopped
  # and failed ("no progress for N seconds: no output, no file changes,
  # no commits"). Progress is any of: terminal output growth, a changed
  # tracked or untracked file in the work directory (harness scratch files
  # ignored), a new commit, or a live child process using CPU. 0 (the
  # default) means off. Recommended: 1800 (30 min). In both cases the
  # uncommitted work is saved to a ref before the worker is stopped and
  # never discarded, and the normal retry budget applies.
  task_no_progress_seconds: 0
  # Save a killed attempt's uncommitted work to refs/datawatch/attempts/<task>/<n>
  # and restore it on the next attempt, unless that attempt was started with
  # clean_restart (reset_task). false disables the save and restore.
  preserve_attempt_work: true
  # How many content auto-fix retries each Automaton gets (0 turns content
  # auto-fix off). Each retry is one corrective task created from the
  # completion review's findings; the retry budget is consumed only after
  # that task exists. When the completion review still blocks and the
  # retries are spent (or auto-fix is off), the Automaton is set to
  # needs_review with the findings attached — not blocked, not running — so
  # the operator or supervisor adds a corrective task with the normal
  # add-task call and approves it. The total retry ceiling
  # (retry_ceiling_total) also applies on top of this budget.
  auto_fix_retries: 1
  # BL366 — bytes of git diff injected into the verifier prompt for
  # evidence grounding. 0 = default (8192). Raise for large PRDs;
  # lower to reduce token cost.
  verifier_diff_max_bytes: 0
  # Run the nightwire-port security pattern scan over modified files
  # before marking a task complete.
  security_scan: true
  # Snapshot and automatic-staging paths (the refs/datawatch/attempts
  # attempt snapshots and the other automatic commits) must never stage
  # candidates whose repo-relative path matches these patterns, matched
  # from the repository root: an entry ending in "/" names a root
  # directory (it and everything under it are refused — "data/" covers
  # "data/notes" but not "build/data/notes"), a slash-free glob is also
  # matched against the candidate's file name ("*.tmp" refuses at any
  # depth), and anything else names an exact path or a root-level
  # leading directory (a pattern nothing can match is simply inert).
  # The shipped list covers scratch, temp and local data folders
  # (scratch/, tmp/, temp/, .tmp/, data/, .data/, *.tmp). Omit the key
  # to keep the shipped defaults;
  # an explicit empty list disables every never-stage rule, which is a
  # different state from "unset" and survives a config round trip (the
  # key carries no omitempty for that reason). Blank entries are rejected
  # on load and by the config write paths.
  snapshot_never_stage: [scratch/, tmp/, temp/, .tmp/, data/, .data/, "*.tmp"]
  # Default false (halt): the moment any story rolls up to "failed", the
  # PRD stops (status -> blocked) instead of continuing into later,
  # independent stories — so the operator can re-edit/rerun the failed
  # story rather than the executor barreling ahead unattended. Set true
  # to restore the old "continue regardless" behavior. Per-PRD override:
  # POST /api/autonomous/prds/{id}/set_continue_on_story_failure.
  continue_on_story_failure: false
  # BL191 Q4 (v5.9.0) — recursive child-PRDs. Tasks with spawn_prd=true
  # treat their spec as a child PRD spec and recurse through Decompose
  # → (auto-)Approve → Run. max_recursion_depth caps the parent→child
  # chain length; 0 disables recursion entirely. auto_approve_children
  # skips the operator review gate on spawned children — needed for any
  # useful recursion (otherwise every level hangs on /approve).
  max_recursion_depth: 5
  auto_approve_children: true
  # BL191 Q6 (v5.10.0) — guardrails at story + task level. Empty list =
  # disabled at that level; PRD-level guardrails stay with the BL117
  # orchestrator. Names: the 4 built-in scan guardrails (sast-scan,
  # secrets-scan, deps-scan, project-rules-scan — the last one runs
  # scan.project_rules filtered to this level's own granularity, BL406
  # Phase 3) plus the orchestrator-surface names (rules, security,
  # release-readiness, docs-diagrams-architecture). A `block` outcome
  # halts the parent PRD with status=blocked for operator review; the
  # non-scan guardrail prompt + parsing is the same `/api/ask` loopback
  # the BL25 verifier uses (verification_backend / verification_effort
  # apply).
  per_task_guardrails: []
  per_story_guardrails: []
  # v9.5.5 — Automaton lifecycle statuses that accept task-level and story-level
  # LLM override calls (set_task_llm / set_story_llm and the per-task
  # guardrail / verification LLM setters).
  # Empty list = the defaults: needs_review, revisions_asked, cancelled,
  # blocked. Automaton-level overrides (the set_llm-style endpoints) are NOT
  # affected by this and remain limited to those 3 pre-Run statuses.
  # Valid names: draft, planning, needs_review, approved, revisions_asked,
  # active, running, completed, rejected, cancelled, archived, blocked,
  # failed, paused. Settable through any config surface: YAML,
  # REST PUT /api/config, MCP autonomous_config_set, CLI
  # `datawatch config set autonomous.task_override_statuses blocked,running`,
  # comm channel `configure autonomous.task_override_statuses=blocked,running`.
  task_override_statuses: []
  # Whether a task-level or story-level LLM override call that the gate above
  # refuses (most often: the PRD is `running` but the target task has not
  # started yet) is still accepted and applied to the unstarted tasks. When
  # on — the default; unset reads as true — the call is accepted and the
  # reply reports the changed tasks (unstarted: pending, queued,
  # waiting_capacity, waiting_decision, awaiting_approval, or never
  # scheduled) and the tasks left alone (started, finished or parked) with
  # the reason; a `waiting_capacity` task gets its queued capacity request
  # retargeted to the new backend's pool (`capacity_moved: true`). A
  # task-level call aimed at a task that already started or finished is not
  # refused — it answers 2xx with the task in `left_alone`. When explicitly
  # false the classic refusal is restored: any status outside
  # task_override_statuses is a 400. Applies to set_task_llm /
  # set_story_llm and the Automaton-level set_llm worker pair on a running
  # PRD; guardrail / verification LLM setters are never affected.
  # Settable through any config surface: YAML, REST PUT /api/config,
  # MCP autonomous_config_set, CLI
  # `datawatch config set autonomous.override_queued_tasks false`,
  # comm channel `configure autonomous.override_queued_tasks=false`.
  override_queued_tasks: true
  # Plan-requirement coverage gate mode — how the deterministic, no-LLM
  # plan-requirement coverage check (internal/autonomous/plan_coverage.go,
  # recorded on the PRD at decompose time) gates PRD approval. Valid values
  # off, warn, block; anything else is rejected. Default block: approving a
  # PRD with a failing plan-coverage report is blocked until the operator
  # acknowledges that exact failing surface (REST POST
  # /api/autonomous/prds/\u003cid\u003e/plan_coverage/acknowledge with a non-empty note,
  # the web PRD coverage panel, MCP autonomous_prd_plan_coverage_acknowledge,
  # or CLI autonomous prd-ack-coverage). warn: a failing report is stored and
  # shown on the PRD but approval proceeds. off: no gating; the report is
  # still recorded for visibility. Reachable via REST PUT /api/config (this
  # dotted key), REST GET/PUT /api/autonomous/config (bare plan_coverage_check),
  # MCP autonomous_config_set, CLI `datawatch config set
  # autonomous.plan_coverage_check=block`, comm `configure
  # autonomous.plan_coverage_check=block`, and the PWA Settings field
  # (settings_plan_coverage). See docs/operations.md (plan coverage gate)
  # and docs/plans/2026-10-20-plan-coverage-gate.md.
  plan_coverage_check: block
  # Reactive usage back-off mode. pause_backend (default): when a session on
  # a backend hits a rate/usage limit, autonomous dispatch to that backend is
  # held until its reset time (or the max wait below). off: no automatic
  # flags are set; an operator can still set one by hand. Interactive session
  # starts are never blocked either way. Reachable via REST PUT /api/config
  # (this dotted key), MCP autonomous_config_set, CLI `datawatch config set
  # autonomous.usage_backoff=off`, comm `configure autonomous.usage_backoff=off`
  # and the PWA Settings field. Manual flags: `datawatch usage-backoff`,
  # /api/usage-backoff. See docs/howto/automata-capacity.md.
  usage_backoff: pause_backend
  # Longest an automatic back-off lasts, in whole minutes, when the backend's
  # rate-limit message carries no parseable reset time. Default 60; a value
  # below 1 is treated as 60. Same surfaces as autonomous.usage_backoff.
  backoff_max_wait_minutes: 60
  # Minimum covered/extractable-requirement ratio a plan must meet for
  # coverage to pass. Value must be in (0,1]; zero or negative normalizes to
  # 1.0 (require full coverage) and values above 1 clamp to 1.0 (see
  # internal/config/plan_coverage.go, NormalizePlanCoverageRatio). The gate
  # also fails on ANY structural finding (dangling DependsOn, dependency
  # cycles, missing file provenance, missing verification reason, tracker-ID
  # naming) regardless of ratio. Reachable via REST PUT /api/config (this
  # dotted key), REST GET/PUT /api/autonomous/config (bare
  # plan_coverage_min_ratio), MCP autonomous_config_set, CLI `datawatch
  # config set autonomous.plan_coverage_min_ratio=0.9`, comm `configure
  # autonomous.plan_coverage_min_ratio=0.9`, and the PWA Settings field
  # (settings_plan_coverage_min_ratio).
  plan_coverage_min_ratio: 1.0
  # Plan-coverage filters — what the gate reports; both on by default.
  # They shape the findings and the requirement set of a NEWly computed
  # report; a stored report keeps the values it was computed with (pinned at
  # compute time, like the gate mode and the ratio), and a config change
  # applies on the next decompose. See
  # docs/operations.md#plan-coverage-filters.
  #
  # Filter 1: a file a task says it creates, adds, writes or generates, or
  # that is new in the plan's own file list, is not a missing-file finding —
  # while its parent folder exists or is created by the plan; a path in a
  # folder nothing creates is still a finding. false = no allowance. The
  # withheld created-file count and the filters the report was computed
  # under are shown on the PWA plan coverage panel, GET
  # /api/autonomous/prds/<id>/plan_coverage, the
  # autonomous_prd_plan_coverage_get MCP tool, the CLI `datawatch
  # autonomous prd-coverage <id>` and the comm verb `autonomous
  # plan-coverage <id>`; the withheld count is NOT part of the
  # acknowledgement fingerprint. PWA Settings row:
  # settings_plan_coverage_suppress_created_files. Unset reads true (on).
  # plan_coverage_suppress_created_files: true
  # Filter 2: requirements are extracted only from the sections named by
  # plan_coverage_requirement_sections, with a minimum sentence length from
  # plan_coverage_min_requirement_chars; a path or config key counts only
  # through the numbered item, obligation sentence or test sentence that
  # holds it (standalone path/key tokens, loose file names, backend names
  # and quoted phrases do not count). A spec with none of the named sections
  # falls back to the whole spec. false = whole-spec extraction with the
  # standalone-token pass, as before. Same read surfaces as filter 1 (the
  # withheld-requirements count); withheld count also outside the
  # acknowledgement fingerprint. PWA Settings row:
  # settings_plan_coverage_scoped_requirements. Unset reads true (on).
  # plan_coverage_scoped_requirements: true
  # The section names (filter 2) whose sentences count as requirements:
  # comma separated, names trimmed and lowercased, duplicates and blanks
  # dropped; an empty list restores the default scope,constraints. PWA
  # Settings row: settings_plan_coverage_requirement_sections.
  # plan_coverage_requirement_sections: scope,constraints
  # The shortest sentence, in characters, that counts as a requirement
  # (filter 2): 0 or negative reads the default 30. Same read surfaces as
  # the two booleans; PWA Settings row:
  # settings_plan_coverage_min_requirement_chars.
  # plan_coverage_min_requirement_chars: 30
  # Generated artefacts: which artefacts an Automaton produces from its
  # change record (internal/changerecord). Every switch defaults to on when
  # unset; set one to false to turn that artefact off.
  # Read and change at runtime without restart: GET /api/config shows the
  # effective set; PUT /api/config takes autonomous.generated_artefacts.<name>
  # (booleans only; anything else is a 400); `datawatch config set` and the
  # comm channel `configure` use the same dotted keys. REST: GET
  # /api/autonomous/generated-artefacts, GET .../prds/{id}/change-record,
  # GET .../prds/{id}/generated/{kind}, POST .../generated/{kind}/regenerate;
  # MCP: generated_artefacts_get, autonomous_prd_change_record,
  # autonomous_prd_generated_artefact, autonomous_prd_regenerate_artefact.
  # change_record: no change record is built or stored when off.
  # gate_report / changelog_draft / parity_draft / tracker_rows / registry_row:
  #   that artefact is not generated when off.
  # combined_docs_task: decompose does not ask for the combined docs task.
  # generated_artefacts:
  #   change_record: true
  #   gate_report: true
  #   changelog_draft: true
  #   parity_draft: true
  #   tracker_rows: true
  #   registry_row: true
  #   combined_docs_task: true
  # BL418 — PRD-completion rules review opt-in. Empty (default) means
  # runPRDCompletionRulesReview never fires, even when a rules/context
  # file exists. Add "rules-review" here (or to a PRD's own
  # per_prd_guardrails) to turn it on: a judgment review of the PRD's
  # real diff against whatever rules_file/context_file is configured.
  # Add "ci-watch" (opt-in the same way) to make an Automaton, at
  # completion, wait up to ci_watch_timeout_seconds (below) for the CI
  # runs of the commit it pushed; a failed run is judged by the
  # configured LLM against the project's rules file. Skipped when
  # nothing was pushed or origin is not a GitHub remote. Both names:
  #   per_prd_guardrails: [rules-review, ci-watch]
  per_prd_guardrails: []
  # BL410 Phase 1 — per-category retry budgets. "content"/"policy" fall
  # back to auto_fix_retries above when absent (backward-compat anchor).
  # Keys: infra, content, scope, policy. Defaults seeded by the daemon
  # when unset: infra=4, scope=0.
  retry_policy: {}
  # Total auto-retries summed across every category, for one PRD's
  # whole lifecycle (default 5 — a normal release PRD failing more
  # than ~5 times means the spec needs updating or datawatch itself is
  # broken). Raise per-PRD or via a retry_profile for genuinely
  # iterative work (e.g. a CVE test-and-fix PRD).
  retry_ceiling_total: 0
  # Same-config infra retries before falling back to the global
  # backend/model default (default 2).
  infra_retry_escalate_after: 0
  # Longest the optional ci-watch completion guardrail (add "ci-watch"
  # to per_prd_guardrails) waits for the CI runs of the commit an
  # Automaton pushed (seconds). Default 1500 (25 minutes).
  ci_watch_timeout_seconds: 1500
  # Byte cap for each heavy output text field (memory_report, task error,
  # prior_attempt_hint, start-failure tail, attempt refs, verdict and verifier
  # text) in the default GET /api/autonomous/prds/{id} reply. Capped fields
  # end with a marker and are listed in "truncated" with the URL of the full
  # text. The Automaton spec, story descriptions and task specs are always
  # returned whole, and spec/description writes answer 400 for text that
  # carries the truncation marker. Stored data is never cut; ?full=1 and
  # GET .../prds/{id}/outputs return everything.
  # Default 4096; 0 uses the default; a negative value turns the cap off.
  detail_text_cap_bytes: 4096
  # Lifetime (seconds) of the shared cache of inherited (system) tags per
  # Automaton that the session manager builds when listing sessions. Applied
  # live on write (no restart). 0 uses the default (15); a negative value
  # turns the cache off (the index is rebuilt on every read).
  inherited_tags_cache_seconds: 15
  # Whether a content-category guardrail block (a real judgment, e.g.
  # rules-review finding a real issue) gets auto-corrective retry.
  # Default true.
  content_auto_fix_enabled: true
  # Whether synthesized corrective work bypasses per-story approval.
  # Default true (fully unattended).
  auto_fix_skip_approval: true
  # Foreign-file drift: after a task commits, files its own commit swept
  # in that were already uncommitted before the task started (and were
  # not in its planned files) are recorded on the task as
  # foreign_file_drift plus a file_drift_detected decision. Enforcement
  # for those pre-existing findings is governed by drift_mode below
  # ("block" is the default and blocks the task); an explicit
  # block_on_file_drift=false set on an Automaton itself or on its
  # guardrail profile is the operator's opt-out for that Automaton and
  # keeps it warn-only. This flag's daemon-wide false default is the
  # legacy opt-in shape and, on its own, no longer means "warn for
  # everyone". Findings for edits made by the task's own worker
  # (committed files that were clean before the task started) are always
  # warn-only, in any mode. Worktree-mode Automata are never checked
  # (their worktree starts clean).
  block_on_file_drift: false
  # Pre-existing foreign-file-drift enforcement mode: "block" (default)
  # or "warn". "block" (also what an empty or unknown value resolves to
  # — an unrecognized mode never silently relaxes enforcement) turns a
  # task whose own commit swept in pre-existing uncommitted files it
  # never planned into a blocked task, with the Automaton stopping its
  # task walk. "warn" only records the finding (task
  # foreign_file_drift, file_drift_detected decision, audit event) and
  # the task still completes. Global-only: an Automaton or its
  # guardrail profile does not override the mode; per-Automaton opt-out
  # is block_on_file_drift=false on the Automaton or its profile. Only
  # "block" and "warn" are accepted; any other value is rejected at the
  # config surface.
  drift_mode: block
  # Undeclared-edit enforcement: what happens when a task's own worker
  # commits files that are in neither the task's planned files nor its
  # generated files (and were clean before the task started, so they are
  # not pre-existing drift). A file is never reported by both this check
  # and drift_mode. off = skip the check; warn = record the finding on the
  # task (undeclared_edits), log an undeclared_edit_detected decision and
  # raise a warn-level alert, the task continues (default); block = the
  # task is set to blocked and the Automaton stops walking its tasks.
  # Global-only. Only off, warn and block are accepted; any other value is
  # rejected at the config surface and resolves to warn if stored anyway.
  # The check never reverts or modifies any file.
  undeclared_edit_mode: warn
  # Pre-spawn scope lint: checks each task's spec and planned files against
  # the Automaton's read and write directories before the task spawns.
  # "off" skips the lint entirely. "warn" records each problem as a
  # scope_lint_warn decision and spawns the task anyway. "enforce" blocks
  # the task and does not spawn it. Default "enforce"; an empty or unknown
  # value also resolves to enforce. Placeholder and quoted pattern text
  # (for example <name>, globs, $VAR, ~user, or a path inside quotes after
  # grep or search) is never flagged in any mode.
  scope_lint: enforce
  # BL367 — default quality gate config applied to every PRD that does not
  # set its own quality_gates at creation time. When enabled, a test
  # baseline is captured before the first task runs, and tests are re-run
  # after each task completes; a regression blocks the task when
  # block_on_regression is true. 0 timeout = no per-command cap.
  default_quality_gates:
    enabled: false
    # ONE string, run through a shell (`sh -c`) in the Automaton's project
    # directory, so compound commands ("a && b") work. The baseline is
    # validated when the gate is set and when the Automaton starts; a
    # baseline that cannot produce usable results is marked invalid
    # (quality_gate_status: "invalid") and the gate then only warns - it
    # never blocks. Regressions are compared by failing test name and
    # confirmed by one re-run. Operators guide: docs/operations.md
    # -> "Quality gate".
    test_command: ""
    timeout: 0
    block_on_regression: false
    # How much of the test suite a gate task runs (the gate_scope).
    # Accepted values:
    #   full              - the whole command (the default when empty)
    #   touched-plus-smoke- touched packages plus the smoke set below
    #   touched           - touched packages only
    # Empty inherits the default (full). Only these three values are
    # accepted; any other value is rejected when it is written.
    scope: ""
    # Package patterns the touched-plus-smoke scope adds to the touched set
    # (e.g. "./internal/pipeline", "./cmd/datawatch"). Empty = the built-in
    # smoke set. Only consulted when scope is touched-plus-smoke.
    smoke_packages: []

  # What happens when a task's own verification PASSED but the quality gate
  # found a confirmed regression from a VALID baseline:
  #   warn  (default) - the task completes; the disagreement is recorded on
  #                     the task (gate_disagreement) and in the decision log.
  #   block           - the task fails with a "gate_disagreement: ..." error
  #                     naming the new failing tests.
  # Only "warn" and "block" are accepted; anything else is rejected when it
  # is written. This never applies to an INVALID gate: an unusable baseline
  # warns only and never blocks under either value.
  gate_disagreement: warn

  # Failure escalation: what happens when a task keeps failing. Attempts are
  # counted as failed attempts since the last operator action. Step i covers
  # `attempts` consecutive failed attempts (default 1) and the last step
  # covers every remaining attempt. A step with no backend uses the task's
  # normally resolved worker, and no steps at all means every attempt does.
  # After max_failures failed attempts the task is held for operator review
  # (status review_needed) instead of being marked failed. An Automaton or a
  # single task can override each of enabled, max_failures and steps on its
  # own (task beats Automaton beats this default).
  #   enabled      - true (default). false restores the old behaviour: retry
  #                  up to auto_fix_retries, then mark the task failed.
  #   max_failures - 3 by default; 4 or more is allowed, the minimum is 1.
  #   steps        - up to 8 entries of backend, model, effort, attempts.
  failure_escalation:
    enabled: true
    max_failures: 3
    steps: []
    # Example ladder: two tries on the local model, then a Claude model.
    # steps:
    #   - {backend: pi-prompt, model: "ollama/qwen3.8:27b", attempts: 2}
    #   - {backend: claude-code, model: claude-opus-5-5, effort: high}

  # ── Prompt injection guard (v8.18.0) ──
  # Scans user-supplied PRD/task specs for known prompt injection phrases
  # (role overrides, template boundary markers, instruction-override
  # fragments) at the API boundary on create and edit. Findings are always
  # logged. Set block_on_injection: true to hard-reject suspicious input.
  # Data-boundary tags (<user_data>) are always applied to LLM prompt
  # call sites regardless of this setting.
  injection_guard: false
  block_on_injection: false

  # ── BL221 Phase 3 (v6.2.0) — scan framework ──
  # Security + project-rules scan run against a PRD's project_dir, on
  # demand (POST /api/autonomous/prds/{id}/scan) and (once BL406 Phase 3
  # ships) at task/story/PRD-completion checkpoints. Config lives here
  # (daemon-wide); GET/PUT /api/autonomous/scan/config is the dedicated
  # read/write surface (richer than the generic PUT /api/config patch
  # below, which only exposes it read-only for consistency with
  # default_quality_gates above).
  scan:
    enabled: true
    sast_enabled: true
    secrets_enabled: true
    deps_enabled: true
    fail_on_severity: error # info | warning | error | critical
    max_findings: 0 # 0 = unlimited
    rules_grader_enabled: false # LLM verdict on findings; needs an ask-compatible backend
    fix_loop_enabled: false # auto-create a fix child-PRD on scan failure
    fix_loop_max_retries: 0
    # BL406 — the fourth, operator-defined scan category. Each entry:
    # {id, name, type: content|consistency|presence|parity|scope_drift,
    #  granularity: task_complete|story_complete|prd_complete,
    #  pattern, severity, action: ""|file_upstream_issue, upstream_target}.
    # Full-replace via PUT, not a merge — omit the key entirely to leave
    # the existing list untouched. Default (shown here) is one built-in
    # rule, shipped on by default once the engine existed (BL406 Phase
    # 2): a story must inherit its parent plan's declared Parity
    # surface — a candidate detector (warning, not error), since "was
    # there a stated reason" for a narrowed surface needs the
    # rules_grader_enabled LLM judgment call below, not a regex alone.
    project_rules:
      - id: parity-inheritance
        name: "Story must inherit the parent plan's Parity surface"
        type: parity
        granularity: story_complete
        severity: warning
      # BL406 Phase 5 / B112, AGENT.md's BL384 mitigation #3 — opt-in,
      # NOT shipped on by default like parity-inheritance above. Flags
      # a task spec containing code-creation language ("Implement ...",
      # "Write code for ...", "Create .go files ...") whenever the
      # parent PRD spec itself declares doc-only/no-code-changes work.
      # Deliberately conditional on that PRD-level signal — a normal
      # PRD with no such constraint saying "Implement X" is expected
      # work, not drift, so defaulting this rule on would false-positive
      # on the common case. Uncomment to opt in for doc-only PRDs:
      # - id: scope-drift
      #   name: "Task spec must not contain code-creation language in a doc-only PRD"
      #   type: scope_drift
      #   granularity: task_complete
      #   severity: warning

  # ── BL406 — project-rules enforcement ──
  # rules_file/context_file are operator-configured paths, never
  # hardcoded, so another project's differently-named equivalents work
  # without renaming anything. Both relative to a PRD's project_dir.
  rules_file: "" # default "AGENT.md" applied at read time when empty
  # Descriptive "state of the project" doc. Explicitly optional — not
  # every project has one; leave empty if you don't.
  context_file: "" # default "CONTEXT.md" applied at read time, only if that file exists
  # Rules and context policy: which files carry a project's working rules and
  # background, and how a rules digest is handed to a backend that cannot read
  # files. File names are relative to the project directory (no leading "/",
  # no ".."). Resolution per project, first value wins field by field: the
  # entry in projects, then these global values, then the older rules_file and
  # context_file keys above, then the defaults. Read when an Automaton is
  # decomposed; a change needs no restart.
  #   rules_file: one file name. Default "AGENT.md" when unset.
  #   context_files: up to 8 file names. Default ["CONTEXT.md"] when unset.
  #   digest_mode: off | no_tools | all. Default no_tools (digest only for a
  #     backend without file tools); all = every backend; off = never.
  #   digest_max_bytes: 0 (unset, use 4096) or 512 to 65536.
  #   projects: list of overrides, each with project_dir (required) and any of
  #     the four keys above; a key left out inherits. Default empty.
  rules_context:
    rules_file: ""
    context_files: []
    digest_mode: no_tools
    digest_max_bytes: 4096
    projects: []
    # projects:
    #   - project_dir: /srv/my-repo
    #     rules_file: RULES.md
    #     context_files: [CONTEXT.md, DATAWATCH-CONTEXT.md]
    #     digest_mode: all
    #     digest_max_bytes: 8192

  # Worker session profiles: what a worker session starts with (MCP servers,
  # tools, skills, project context, model, effort). Built-in names: minimal,
  # digest, full, datawatch-tools; a user profile may not reuse them.
  #   worker_profiles: map of profile name to a profile. Profile fields are
  #     name (must match the key or be empty), mcp {mode: none|datawatch|list,
  #     servers}, tools {mode: all|allow, allow}, skills (bool), context:
  #     minimal|digest|full, model, effort. Default empty.
  #   worker_profile_defaults.role: planner|worker|verifier|judge -> profile
  #     name. worker_profile_defaults.kind: implementation|docs|note|final_gate
  #     -> profile name. Empty value = no default. Default empty.
  #   worker_profile: global profile name; empty = the role default.
  #   Refused at load: a built-in name reused, an invalid profile, a value
  #   naming an unknown profile, an unknown role or kind key.
  worker_profiles: {}
  #   reviewer:
  #     mcp: {mode: list, servers: [github]}
  #     tools: {mode: allow, allow: [Read, Grep]}
  #     context: digest
  worker_profile_defaults:
    role: {}
    kind: {}
  worker_profile: ""

  # Named upstream repos a project-rule's file_upstream_issue action can
  # reference (e.g. a parity gap this repo's own PRD can't close alone).
  upstream_repos: [] # [{name: "app", owner_repo: "org/repo"}, ...]

  # ── BL407 Phase 1 — local git-worktree isolation ──
  # Empty (default) = feature off, fully backward compatible: a PRD
  # with no explicit project_dir/project_profile/cluster_profile runs
  # the same way it always has. Set worktree_base_repo to the repo a
  # PRD's isolated worktree should be created from (e.g. this
  # checkout, for self-build/dogfooding work) and every future PRD
  # that doesn't explicitly set one of those three fields gets its own
  # git worktree + branch under worktree_dir automatically — it never
  # runs bare in worktree_base_repo's own checkout. Worktrees are
  # removed on a PRD that completes + opens a PR (BL407 Phase 2); kept
  # on a failed/blocked/cancelled PRD for operator inspection.
  worktree_base_repo: ""
  worktree_dir: "" # default ~/.datawatch/prd-worktrees when empty

  # ── BL407 Phase 5 — daemon-wide AutoPR default ──
  # false (default) = every new PRD still starts with Git.AutoPR off,
  # the same explicit per-PRD opt-in as before this phase. Set true to
  # have every future PRD start with AutoPR already on (applied once,
  # at creation time); an operator can always override it afterward on
  # a specific PRD via the autonomous_prd_set_git tool / POST
  # .../set_git / PWA PRD Settings' Git section.
  default_auto_pr: false

  # ── Shipped state (shipped-status feature, 2026-11-01) ──
  # Controls the shipped-state surface for Automata (PRDs) and Automations:
  # a record can carry *shipped state* (release version the work landed in,
  # merge time, main-branch merge commit that proved it), which is orthogonal
  # to the stored status — a cancelled PRD whose work landed stays cancelled
  # AND carries shipped state. While `enabled` is on, a record with shipped
  # state displays as "shipped" in effective-status views and, while
  # `count_separately` is on, counts in its own "shipped" bucket instead of
  # its stored status. Every key below is settable on every configuration
  # channel: PUT /api/config, CLI `datawatch config set`, MCP `config_set`,
  # comm `configure`, and Settings → Automate in the web app. See
  # docs/howto/automata-shipped-status.md and docs/implementation.md
  # ("Shipped state").
  shipped:
    # Master switch for the shipped-state surface. Default true. When false,
    # the display status "shipped" is no longer reported and records count
    # under their stored status everywhere; the stored fields and the recording
    # endpoints are not affected (recording never changes the stored status).
    enabled: true
    # Render the shipped chip on shipped items in the list views. Default
    # true. The PWA does not render a shipped chip or offer a shipped
    # selection today (companion-app parity item); the setting reserves the
    # knob and the server reports the effective value on the shipped-counts
    # surface (the shipped query parameter still works everywhere).
    show_chip: true
    # The list view's shipped selection when the client sends none. One of
    # `all` (default), `shipped` (only records that carry shipped state),
    # `unshipped` (only records that do not). Applies to GET /api/autonomous/prds,
    # GET /api/automations, the MCP list tools and any other client that
    # reads a list. (An invalid `shipped` query value is a 400 regardless.)
    filter_default: all
    # Count shipped records under their own "shipped" bucket instead of their
    # stored status (GET /api/autonomous/shipped/counts, status-bucket views).
    # Default true. When false every record counts under its stored status.
    # Requires `enabled` to have any effect.
    count_separately: true
    # Run one shipped-state backfill pass at daemon start (walks the base
    # repository's main branch for `automaton/<id>` merge commits and records
    # release/merge time/commit on the matching records). Default false: the
    # pass is idempotent and is normally run deliberately (see howto) or via
    # the release verification script. When true the daemon runs it once per
    # start, in the background; failures are logged and never block startup.
    backfill_on_start: false

  # ── Defect queue (autonomous.defect_queue) ──
  # Tunes how queued defects are grouped into batches and when a defect
  # qualifies as a "tiny fix" (a small, low-risk change that needs no operator
  # review). Every key has a built-in default, so an absent block behaves like
  # the values shown. Settable on every configuration channel: PUT /api/config,
  # CLI `datawatch config set`, MCP `config_set` and comm `configure`, using the
  # dotted key (autonomous.defect_queue.batch.size_cap, ...). GET /api/config
  # returns the effective values under autonomous.defect_queue. A bad value in
  # config.yaml refuses startup; a bad value in a write is a 400 with the same
  # message. Precedence for any batch / tiny_fix key: the project entry under
  # `projects`, then this block, then the built-in default.
  defect_queue:
    # Master switch for the defect queue. Default true.
    enabled: true
    batch:
      # Most defects one batch holds. Whole number >= 1. Default 5.
      size_cap: 5
      # Attributes defects are grouped on. Any of project_area, shared_files,
      # shared_surfaces; at least one. Over the API / chat, a JSON list or a
      # comma-separated string. Default: all three.
      grouping_keys: [project_area, shared_files, shared_surfaces]
      # Let defects that share no grouping key land in one batch. Default false.
      allow_unrelated: false
      # How a batch takes its priority from its members: highest_member (the
      # highest-priority member's priority) or first_member (the priority of
      # the member that joined first). Default highest_member.
      priority_rule: highest_member
    tiny_fix:
      # Switch tiny-fix handling. Default true.
      enabled: true
      # Most files a tiny fix may touch. Whole number >= 1. Default 3.
      max_files: 3
      # Paths a tiny fix may touch. Default (shown): test files, docs, scripts
      # and lint / rule configuration. A non-empty list replaces the default.
      allowed_path_globs:
        - "**/*_test.go"
        - "**/testdata/**"
        - "tests/**"
        - "test/**"
        - "docs/**"
        - "**/*.md"
        - "scripts/**"
        - ".golangci.yml"
        - ".golangci.yaml"
        - ".trivyignore"
        - ".gitleaks.toml"
        - ".markdownlint*"
      # Change kinds that qualify as a tiny fix. Any of test_only, docs_only,
      # script_only, rule_tweak, lint_tweak; at least one. Default: all five.
      allowed_kinds: [test_only, docs_only, script_only, rule_tweak, lint_tweak]
      # Paths whose change is operator-visible; a change touching one is never
      # a tiny fix. Default (shown).
      operator_visible_path_globs:
        - "internal/server/web/**"
        - "cmd/**"
        - "internal/server/api.go"
    # Per-project overrides, keyed by project name. An entry may set any batch.*
    # or tiny_fix.* key above (not `enabled`); only the keys it sets replace the
    # block value. Over the API: autonomous.defect_queue.projects.<project>.
    # <batch.size_cap | tiny_fix.max_files | ...>; a null value clears that
    # override. Default: no overrides.
    projects: {}
    #   datawatch-app:
    #     batch:
    #       size_cap: 3
    #       priority_rule: first_member
    #     tiny_fix:
    #       max_files: 2
    #       allowed_kinds: [test_only, docs_only]
  # ── Decompose lint (the fresh-decomposition quality check) ──
  # The quality check over each fresh decomposition, run at decompose time
  # before the plan is stored. A decompose is NEVER failed by this check:
  # findings are attached to the stored plan (recorded, never fatal), and
  # off is a complete no-op (no templates, no lint pass, no record).
  # How to: docs/howto/automaton-decompose-lint.md.
  #
  # mode: off (no check, no record) | shadow (one lint pass, recorded,
  # never retries — DEFAULT; empty/unset normalizes to shadow) | enforce
  # (while block findings remain and the retry budget is unspent, the
  # decomposer is re-run with the block findings fed back; each retry is
  # re-parsed, re-templated and re-linted) — case-insensitive; anything
  # else is a config error (a typo cannot quietly mean "enforce").
  #
  # max_retries: the enforce retry budget. Default 2 (1 initial pass + at
  # most 2 retries; attempts = 1 + retries consumed, at most
  # 1 + max_retries). 0 is a valid explicit value (enforce then lints,
  # records and stops — no auto-retry). Negatives clamp to 0; the cap is
  # 5. Only block findings trigger retries; warn findings are reported,
  # never retried.
  decompose_lint:
    mode: shadow
    max_retries: 2
    # Operator rules: additions, same-id replacements and disables of the
    # built-in default pack (internal/autonomous/decompose_lint_rules.go —
    # eight rules: six block, two warn; the pack is the floor, your rules
    # the ceiling over it). Empty (below) = the built-in pack, unmodified.
    # A same-id entry replaces the built-in at its original position; a new
    # id is appended. Severity: block | warn (empty normalizes to warn;
    # anything else is a config error). A rule's message is required on an
    # active rule. match combines present conditions with AND —
    # spec_regex / title_regex / files_regex over their fields, the
    # read_only tri-state (absent = don't check),
    # verification_script_empty, report_path_empty (no usable report path
    # under .datawatch/reports/), verification_script_unexecutable (the
    # script is a command string or not a runnable file), and any_of (at least one member) / all_of
    # (every member), recursively (nesting capped at depth 8).
    # A bare {id, disabled: true} entry is the canonical way to disable a
    # built-in: its severity/message/match stay unused and unvalidated.
    rules: []
    # Ids dropped from the effective set regardless of origin (unknown ids
    # are ignored, no error). Either mechanism drops the rule: disabled
    # here, or a {id, disabled: true} entry above.
    disabled_rules: []
  # ── Task templates — on screen called the *standard tasks* (usable task ──
  #     definitions offered at decompose time) ──
  # Reusable task definitions appended to a story when the planner did not
  # produce a task for them. Applied in shadow AND enforce (off applies
  # nothing), idempotently — a task a previous apply added (or one the
  # planner marked template:<id>, or whose title closely matches) is
  # detected and never added twice. Slots {{feature}}, {{files}} and
  # {{files_list}} are filled from the feature name and the union of the
  # story's task files; depends_on lists template ids the entry runs after
  # (it also depends on the story's other tasks).
  # The built-in pack is the floor (internal/autonomous/
  # task_templates_defaults.go): changelog_entry, parity_issue_draft,
  # docs_set, bounded_load_step (the load-step rule), final_gate
  # (read-only) and version_bump_left_to_merge (a note, never an edit) —
  # written to hold two hard properties for every feature
  # name: no blocking decompose-lint finding, and no hosting-CLI side
  # effects. Each standard task runs in the `model session` mode.
  # Your templates are the ceiling over it: same id replaces the
  # built-in at its position, new id appends. Template ids must be
  # well-shaped ([a-z0-9_.-]+) and unique — the daemon validates before
  # applying, and a duplicate id is a 400, not a merge.
  # Time cap, in whole seconds, on one script gate run. Default 900. 0 = no
  # cap (the gate may run as long as its script needs); a negative value is
  # refused at load time. The cap stops a runaway gate script, so keep it
  # above the longest honest run of your build-and-test command. How-to:
  # howto/automaton-daemon-task-modes.md.
  script_gate_timeout_seconds: 900
  # The project's own build-and-test command, run by the script gate as one
  # line of shell text, for example "make test" or "npm test". Empty (the
  # default) = unset. Not tied to any language. A value with a line break,
  # a NUL byte or over 1024 bytes is refused. A project's policy block can
  # override it per project (projects.<name>.policy.project_gate_command);
  # an explicit empty string there unsets it for that project only. See the
  # "Projects: per-project automation policy" section below. How-to:
  # howto/automaton-daemon-task-modes.md.
  project_gate_command: ""
  task_templates:
    # Global gate. Default true. false turns template apply off everywhere
    # (per-project overrides below can still force a project on/off).
    enabled: true
    # Setting: autonomous.task_templates.mode (one template:
    # autonomous.task_templates.mode.<id>). Values:
    #   llm    - a worker session runs the task as a normal task, verifier included
    #   daemon - the daemon does the task itself, with no model session
    #   off    - the task is not added to the story at all
    # Default: the shipped default per template, as listed below; llm for an id
    # outside the built-in pack. daemon is accepted only for changelog_entry,
    # parity_issue_draft, bounded_load_step and version_bump_left_to_merge;
    # final_gate takes llm or off only.
    # Ways to set it: the per-template select in the Settings autonomous card,
    # PUT /api/config with the dotted per-template key, datawatch config set,
    # configure on the chat or comm channels, the MCP autonomous_config_set
    # task_templates_mode argument, and this YAML block itself.
    # The decompose-lint surfaces (REST PUT /api/autonomous/decompose-lint/config,
    # the MCP autonomous_decompose_lint_config_set tool and the decompose-lint
    # card) replace the whole task_templates block when they send it. The card
    # sends back the block it loaded with only its enabled checkbox changed.
    # Who carries out each template's task. Three values:
    #   llm    — a model session does the task (the default for most templates)
    #   daemon — the daemon does the task itself with no model call; only the
    #            four daemon-capable ids accept it: changelog_entry,
    #            parity_issue_draft, bounded_load_step and
    #            version_bump_left_to_merge
    #   off    — the task is not generated at all
    # Shipped defaults per built-in template id:
    #   changelog_entry             daemon
    #   parity_issue_draft          daemon
    #   bounded_load_step           daemon
    #   version_bump_left_to_merge  daemon
    #   docs_set                    llm
    #   final_gate                  llm (daemon is refused: it is a read-only gate)
    # An id you do not list here falls back to the shipped default for that id
    # (an id outside the built-in pack falls back to llm). Keys must be
    # well-shaped template ids; an unknown mode value, or daemon on an id that
    # cannot take it, is a validation error, not a silent fallback.
    # Empty (the default) keeps every shipped default. Example override, to
    # send the changelog entry through a model session instead of the daemon:
    #   changelog_entry: llm
    mode: {}
    # Operator template definitions (empty = the built-in pack,
    # unmodified). {id, title, spec, files, kind, read_only, report_path,
    # depends_on, applies_when, verification_script_reason}.
    # verification_script_reason is the explicit reason a task from the
    # template has no verification script (note templates carry one); it
    # is copied onto that task. verification_script must be one repo-relative script
    # file (for example scripts/verify.sh), never a command string such as
    # "go build ./... && go test ./...": the PUT that carries it is refused,
    # and a template that still carries one is never applied.
    # verification_script_reason is optional: a note-kind template that
    # changes nothing carries its B124 exemption here — the stated reason
    # it has no verification script to run (the built-in note templates
    # carry one).
    templates: []
    # Per-project overrides, keyed by project directory or alias. An absent
    # flag means follow the global; a new project inherits the global
    # enabled. Overrides are resolved per project at apply time.
    projects: {}
  # ── Decompose guidance (the block the planner's prompt carries) ──
  # The guidance appended to the decompose prompt (under a
  # --- Decompose guidance --- header). Precedence: (1) set to literal
  # text — used verbatim (prose is never mistaken for a file); (2) naming
  # an existing readable file — the file's contents; (3) a path-like value
  # with a missing, unreadable or empty file — the generated block stands
  # in (a dead path is not prose to ship); (4) UNSET (empty, default) —
  # generated from the active rule pack, one line per rule (id, severity,
  # message) in pack order. So the rules explain themselves to the
  # planner until you give your own.
  decompose_guidance: ""
  # ── Supervisor loop ──
  # The standing loop that keeps every Automaton moving. Each pass runs eight
  # mechanical steps (no model call) and three model jobs, and keeps a run
  # record for each. Every key may be omitted; the value shown is the default.
  # Read: GET /api/supervisor-loop/jobs and /runs, `datawatch supervisor-loop
  # jobs|runs`, MCP supervisor_loop_jobs/_runs, comm `supervisor jobs|runs`.
  # See docs/howto/supervisor-loop.md.
  # Keys are flat dotted names and each carries the full supervisor_loop. prefix;
  # an unprefixed key such as lane_count.max is rejected as an unknown setting.
  supervisor_loop:
    # Master switch for the whole loop.
    "supervisor_loop.enabled": true
    # Mechanical steps, each with its own switch (default on).
    "supervisor_loop.close_finished_records.enabled": true     # closes the records of finished Automata
    "supervisor_loop.deploy_after_ship.enabled": true          # runs your deploy step once per shipped release
    "supervisor_loop.retry_failed_infra.enabled": true         # retries tasks held after infrastructure retries ran out
    "supervisor_loop.cleanup_sweep.enabled": true              # sweeps leftover worktrees and scratch files
    "supervisor_loop.apply_answers.enabled": true              # applies your answers to held questions
    "supervisor_loop.lane_count.enabled": true                 # moves the lane count, only inside min..max
    "supervisor_loop.start_next_chain_step.enabled": true      # starts the next Automaton in a chain
    "supervisor_loop.run_merge_until_conflict.enabled": true   # runs merges until one conflicts
    # Model jobs. style is oneshot (a single call) or session (a full session).
    # An empty backend or model uses the decision assistant's; with none
    # configured the job escalates to you and never falls back to a hosted model.
    "supervisor_loop.draft_spec.style": oneshot
    "supervisor_loop.draft_spec.backend": ""
    "supervisor_loop.draft_spec.model": ""
    "supervisor_loop.classify_ci_failure.style": oneshot
    "supervisor_loop.classify_ci_failure.backend": ""
    "supervisor_loop.classify_ci_failure.model": ""
    "supervisor_loop.pick_backend.style": oneshot
    "supervisor_loop.pick_backend.backend": ""
    "supervisor_loop.pick_backend.model": ""
    # Extra attempts after a model answer fails its check (0 or more).
    "supervisor_loop.validator_retries": 2
    # Failed attempts in one run before you are asked (1 or more). Keep it at or
    # below validator_retries + 1.
    "supervisor_loop.escalate_after_failures": 2
    # How many recent run records are kept (1 or more).
    "supervisor_loop.run_retention": 500
    # Grace in minutes before a cancelled Automaton is archived, measured
    # from its most recent cancel (0 or more). 0 archives it at once. A
    # cancelled Automaton whose branch holds commits that are not on the
    # base branch is not archived by the loop until you archive it, its
    # work is merged, or its branch is deleted.
    "supervisor_loop.archive_cancelled_after_minutes": 60
    # Lane count bounds for the lane_count step. max 0 means no bounds, so the
    # step moves nothing. When set, max must be at least min.
    "supervisor_loop.lane_count.min": 0
    "supervisor_loop.lane_count.max": 0
  # ── Automation requirements (requirements report + capability minimums ──
  # The requirements report answers "can this daemon run the automations it is
  # configured to run": the built-in capability minimums (capability → minimum
  # Ollama version, today `classification_verdict` = 0.35.0) against every
  # registered Compute Node that is an Ollama backend (meets / fails / unknown),
  # the backends configured for each workload slot (execution, planning,
  # verification — Claude and the local model pool optional, but at least one
  # provider required), and every unmet line. Read surfaces: GET
  # /api/automation/requirements-report (the ?format=text rendering is byte-
  # identical to the others), the MCP tool automation_requirements_report,
  # `datawatch automation requirements-report [--format text|json]`, the chat
  # verbs `automation requirements-report [text|json]` and
  # `auto req text|json`, and the PWA card. It is a report, not a gate: nothing
  # is blocked on it. Behavior: docs/howto/automation-requirements.md.
  #
  # min_ollama: maps a capability name to a minimum Ollama version override
  # (autonomous.requirements.min_ollama.<capability>). An absent key means
  # "use the built-in table"; an empty value under a known capability clears
  # its built-in floor. Every key must be a known capability (today
  # `classification_verdict`), and every non-empty value must parse as a
  # dotted semantic version. Anything else — an unknown capability, an empty
  # key, or a value like "latest" — is a 400 on every write surface and
  # nothing is written. Enforced: enabling a capability on a
  # node below its effective minimum is refused naming the node, the found
  # version and the required version; a node that later falls below it is
  # flagged and the capability fails closed (unavailable) until a recheck
  # finds it back at or above the minimum. Settable via PUT /api/config (key
  # autonomous.requirements.min_ollama.<capability>), MCP config_set (key
  # autonomous.requirements.min_ollama.classification_verdict) / the
  # requirements surfaces, CLI `datawatch config set
  # autonomous.requirements.min_ollama.classification_verdict=0.40.0`,
  # comm `configure autonomous.requirements.min_ollama.classification_verdict=0.40.0`.
  # Applies without a restart (read at report/enable time).
  requirements:
    min_ollama:
      # classification_verdict: "0.40.0"  # raise the built-in 0.35.0 floor

  # ── Model pull consent gate (model pull gate) ──
  # Operator pre-approval gate for model pulls; both the compute-node model
  # pull and the marketplace task pull must pass it before anything is pulled.
  # Default-deny: a model may be pulled when it is listed with allowed: true,
  # or when it is unlisted and its publisher is on publishers (a listed
  # entry's publisher, else the leading "publisher/model" segment of the
  # name; plain names carry no publisher). A listed entry with allowed: false
  # is an explicit refusal and its note travels with the refusal; everything
  # else is refused and the refusal names the key to set. Matching is
  # case-insensitive and ignores the ":tag" suffix (a listed "gpt-oss"
  # matches a pull of "gpt-oss:20b"). The set is complete: any write
  # surface replaces the stored lists, it does not append (an example
  # policy, commented here):
  #   models:
  #     - { name: gpt-oss:120b, allowed: true }        # with or without :tag
  #     - { name: big-model-65b, allowed: false,
  #         note: "too large for the pool" }         # refusal + its reason
  #   publishers: [mistralai]   # each entry allows every model of that publisher
  # Validation (every write surface): empty model names, duplicate model
  # names (case-insensitive, tag-ignoring) and empty publisher entries are
  # a 400 and nothing is written (the bad key rejects the whole PUT on
  # /api/config). Set/changed via PUT /api/config (keys
  # autonomous.model_pull_consent.models / autonomous.model_pull_consent
  # .publishers), the REST routes GET/PUT /api/automation/model-consent
  # (audited as model_pull_consent_changed), the MCP tools
  # automation_model_pull_consent_get / automation_model_pull_consent_set,
  # `datawatch automation model-consent get|set`, comm
  # `autonomous model-pull-consent-get` and `model-pull-consent-set`, and
  # the PWA settings section “Model pull consent”. Applies without a
  # restart (the gate is read at pull time). Operator guide:
  # howto/model-pull-consent.md; internals: docs/implementation.md
  # ("Automation requirements and the model pull gate").
  model_pull_consent:
    # models:
    #   - name: gpt-oss:120b
    #     allowed: true
    #   - name: big-model-65b
    #     allowed: false
    #     note: too big for the local pool
    # publishers: [mistralai]
# ── Dashboard (operator console + card visibility) ──
# The dashboard.* block switches gate the PWA dashboard board and the
# operator console one-glance summary (GET /api/dashboard/console, MCP
# dashboard_console_get, datawatch dashboard console, chat verb
# `dashboard console`). Every key is a boolean and reads its default,
# true, while absent; an explicit false sticks through saves and YAML
# round trips. See docs/howto/dashboard-operator-console.md.
dashboard:
  # true (default): dashboard feature cards with no live data stay out of
  # the grid and out of the Add-Card picker. false: keep them visible so
  # you can pin your layout.
  hide_inactive_cards: true
  # The operator console block. Each subkey is a boolean that reads its
  # default, true, while absent.
  console:
    # true (default): the console is on. false: every section reports
    # itself unavailable and the PWA drops its console cards from the
    # board.
    enabled: true
    # true (default): the questions_waiting section (open operator
    # questions, held questions and worker-marker questions).
    show_questions: true
    # true (default): the held_blocked section (failed/blocked triage
    # states and uncommitted-work holds).
    show_held_blocked: true
    # true (default): the lanes section (lane fill and the capacity
    # admission wait queue).
    show_lanes: true
    # true (default): the usage section (burn guard state and the usage
    # calculator projection).
    show_usage: true
    # true (default): the ci_release section (repo CI watch records and
    # the latest-release check).
    show_ci_release: true

# ── Orchestrator (BL117 — v4.0.0) ──
# PRD-DAG orchestrator with guardrail sub-agents. Composes BL24
# autonomous PRDs into a graph; each PRD is attested by configured
# guardrails (rules/security/release-readiness/docs) before the DAG
# advances. See docs/api/orchestrator.md.
orchestrator:
  # Opt-in switch. When false every /api/orchestrator/* returns 503.
  enabled: false
  # Guardrails applied to each PRD by default (order does not matter;
  # block from any halts the graph).
  default_guardrails: ["rules", "security", "release-readiness", "docs-diagrams-architecture"]
  # Per-guardrail invocation timeout (ms). Default 120000 = 2 min.
  guardrail_timeout_ms: 120000
  # LLM backend for guardrail workers. Empty = inherit session.llm_backend.
  guardrail_backend: ""
  # Max concurrent PRD nodes per graph.
  max_parallel_prds: 2

# ── Compute node slot override ──
# Each compute node may set session_slots, a whole number of workers it takes at
# once. 0 (the default) derives the count from the node's observer data: one slot
# per GPU, limited by free GPU memory against the served model; with no GPU data,
# free system memory divided by the model size, at least one slot. A positive value
# wins over the derived count, and max_concurrent_sessions still caps it. Applies
# only to a node that hosts a local engine; other nodes keep max_concurrent_sessions.
# A negative value is rejected when the config loads. Set it in the PWA node form,
# `datawatch compute node update <name> --session-slots N`, or REST
# PUT /api/compute/nodes/{name}.
#
# Verifier slots live beside it, as three more per-node keys:
# verifier_slots              the node's verifier worker count. Leave it out and
#                             the node takes one verifier slot when it hosts a
#                             local engine and none when it does not; set it to 0
#                             explicitly to take no verifier runs at all.
# verifier_min_free_mem_mb    the free GPU memory in MB a new verifier slot wants
#                             before it starts. Leave it out for the default of
#                             1024; 0 turns the check off.
# verifier_context_mb         the context memory in MB one verifier slot holds,
#                             used only for the advice figure the node reports
#                             (free GPU memory divided by this, whole slots).
#                             0 (the default) means unknown, so no figure.
# Verifiers then lease the node's own verifier pool instead of the executor's,
# so verification can run alongside workers on the same node. The advice figure
# is advice only: nothing applies it and it never raises the executor cap. A
# negative value on any of the three is rejected when the config loads. Set them
# in the PWA node form, `datawatch compute node add|update <name>
# --verifier-slots N --verifier-min-free-mem-mb N --verifier-context-mb N`, the
# comm channel's compute node add/update kv pairs, REST
# PUT /api/compute/nodes/{name}, or the MCP compute node tools.
#
# A node served over https is verified against the system roots by default. For a
# node whose certificate the system roots do not cover, use one of the TLS keys
# below. tls_ca_file and tls_cert_fingerprint may be used together (the chain must
# verify and the leaf must match); tls_insecure_skip_verify cannot be combined with
# either of them.
# compute_nodes:
#   - name: gpu-1
#     kind: ollama
#     address: http://gpu-1:11434
#     session_slots: 2
#     verifier_slots: 2               # leave out for the default; 0 = no verifier runs here
#     verifier_min_free_mem_mb: 2048  # leave out for the default of 1024; 0 = headroom check off
#     verifier_context_mb: 4096       # context MB per verifier slot for the advice figure; 0 = none
#     # tls_ca_file: /etc/datawatch/ca.pem      # private CA: trust this PEM bundle as well as the system roots
#     # tls_cert_fingerprint: "AB:CD:..."       # single self-signed cert: pin its SHA-256 leaf fingerprint (64 hex chars, colons optional)
#     # tls_insecure_skip_verify: false         # last resort only: turns verification off (shown in the node record, PWA and audit log)

# ── Compute pin keeper ──
# Node drain state (drained, drain_until, drain_reason) is runtime state kept in
# nodes.json, not in this file; set it with `datawatch compute node drain` and
# `undrain`, the REST routes, the MCP tools or the Compute page.
# Per-node model pins live on each compute node (compute_nodes[].node_pinned_model
# and allow_model_swap; set with `datawatch compute node add|update`). The
# keeper below is the one global setting. Runbook: docs/operations.md →
# "Pinning a model on a GPU node".
#
# Ollama unloads models when a request loads a different one. Without a pin,
# a datawatch caller (ask, session summaries, memory helpers) can evict the
# model a build depends on. A pinned node runs requests with no explicit model
# on its pin, and refuses an explicit request for another model unless the node
# sets allow_model_swap.
#
# How often the pin keeper re-checks each pinned node. When the pinned model is
# missing, the keeper loads it again and raises a warning alert. The check is
# skipped while a session is working on the node. The keeper is started once at
# daemon boot, so restart the daemon after changing this value. 0 = keeper off;
# pins still refuse requests for other models.
# Default 300.
pin_check_seconds: 300

# ── Observer (BL171 — v4.1.0) ──
# Unified stats + process-tree + sub-process monitoring subsystem.
# Shape A (in-process plugin) is the default; Shape B (standalone
# daemon) and Shape C (cluster container) share this same contract
# and come online in v4.2.x. See docs/api/observer.md.
observer:
  # Shape A toggle. Disabling falls /api/stats back to the v1
  # collector and returns 503 from /api/observer/*.
  plugin_enabled: true
  # Tick cadence (ms). The WebSocket broadcast fires on every tick.
  tick_interval_ms: 1000
  # Process-tree walk. Turn off only on very resource-constrained
  # hosts; host cpu/mem/disk/gpu still report.
  process_tree_enabled: true
  # Cap the per-broadcast process tree so WS payloads stay bounded.
  # Drill-downs via /api/observer/envelope are uncapped.
  top_n_broadcast: 200
  # Pull kernel threads into the tree (default false; noisy).
  include_kthreads: false
  # Group processes under each tmux-pane PID into a session envelope.
  session_attribution: true
  # Group known LLM backend processes (+ their children) into a
  # backend envelope (claude, ollama, aider, goose, openwebui, …).
  backend_attribution: true
  # Correlate processes to docker containers via /proc/<pid>/cgroup.
  docker_discovery: true
  # Annotate envelopes with nvidia-smi per-process GPU usage where
  # available.
  gpu_attribution: true
  # eBPF per-process net capture. Values: auto | true | false.
  # - auto (default): loads when CAP_BPF is granted, silently
  #   degrades to /proc-only otherwise
  # - true: fails daemon boot if the kernel refuses the program
  # - false: never attempts load
  # Shape A + B enable by running `datawatch setup ebpf`; Shape C
  # via k8s/docker manifest capabilities.
  ebpf_enabled: auto

# ── Secrets Manager (BL242 — v6.4.0+) ──
# Centralized encrypted secrets store. All surfaces (REST, MCP, CLI, comm,
# PWA) read/write via the same store. Secrets referenced in datawatch.yaml
# as ${secret:name} are resolved at load time. Secrets scoped to
# "agent:<profile>" or "plugin:<name>" enforce least-privilege access.
# See docs/api/secrets.md for the full API reference.
secrets:
  # Backend selects the storage implementation:
  #   "builtin"     — AES-256-GCM encrypted JSON (default; key auto-generated
  #                   at ~/.datawatch/secrets.key, 0600). Override key path via
  #                   DATAWATCH_SECRETS_KEY env var.
  #   "keepass"     — KeePass database via keepassxc-cli (Phase 2).
  #   "onepassword" — 1Password vault via op CLI (Phase 3).
  backend: builtin

  # KeePass backend (backend: keepass)
  keepass_db: ""           # path to .kdbx file
  keepass_password: ""     # prefer DATAWATCH_KEEPASS_PASSWORD env var
  keepass_binary: ""       # default: keepassxc-cli
  keepass_group: ""        # optional group/folder scope inside the db

  # 1Password backend (backend: onepassword)
  op_binary: ""            # default: op
  op_vault: ""             # optional vault name or ID; omit = default vault
  op_token: ""             # prefer DATAWATCH_OP_TOKEN env var

# ── Tailscale k8s Sidecar (BL243 — v6.5.0+) ──
# Injects a Tailscale sidecar container into every F10 agent pod when enabled.
# Supports headscale (self-hosted, set coordinator_url) and commercial Tailscale
# (leave coordinator_url empty). auth_key and api_key accept ${secret:name} refs.
# Phase 2 (v6.5.1): OAuth device flow. Phase 3 (v6.5.2): ACL generator.
tailscale:
  enabled: false               # true → inject sidecar into all agent pods
  coordinator_url: ""          # headscale base URL (empty = commercial Tailscale)
  auth_key: ""                 # pre-auth key or "${secret:tailscale-authkey}"
  api_key: ""                  # headscale admin API key or "${secret:headscale-apikey}"
  image: ""                    # sidecar image (default: ghcr.io/tailscale/tailscale:latest)
  tags: []                     # ACL tags for spawned sidecars (default: [tag:dw-agent])
  acl:
    allowed_peers: []          # node names/tags that need access to the dw mesh
    managed_tags: []           # ACL tags owned by datawatch; default: 4 dw tags

# ── Usage and cost calculator ──
# Settings for the weekly usage calculator. Every key is optional and settable
# at runtime without a restart. A saved value that is no longer allowed (for
# example a retired variant) falls back to its default and the daemon logs one
# line saying so. Access methods for every key below:
#   YAML          this block in ~/.datawatch/config.yaml
#   REST API      PUT /api/config with {"usage.calculator.<key>": value};
#                 GET /api/config returns the effective values under
#                 usage.calculator. An invalid value is a 400 and changes nothing.
#   Comm channel  `configure usage.calculator.<key>=<value>`
#   MCP           the generic config_set tool, key usage.calculator.<key>
#   CLI           `datawatch config set usage.calculator.<key> <value>`
#   Web UI        the Settings field arrives with the calculator screen; until
#                 then use one of the methods above.
usage:
  calculator:
    # Layout shown: pace-gauge | lane-planner | burn-ledger | all. Default all
    # (the three side by side; the operator picks one later).
    variant: all
    # Advice target: use-all (run until the allowance is used up), pace (aim
    # safety_points under the pace line) or finish-early (run flat out until
    # the remaining work is done). Default use-all.
    policy: use-all
    # Margin under the pace line for the pace policy, in points of the weekly
    # allowance. 0 to 50, default 5.
    safety_points: 5
    # Weekly points one queued task is estimated to cost, used to compute the
    # remaining work for finish-early. Above 0, default 0.1. A starting figure:
    # calibrate it against real readings.
    cost_per_task_points: 0.1
    # Idle burn in points per 24 hours with no lane running. 0 to 20, default 3.
    baseline_per_24h: 3
    # Largest lane count the planner offers. 1 to 8, default 3.
    max_lanes: 3
    # Apply the calculator's lane advice automatically. When true the daemon
    # changes the lanes itself to follow the advice; when false (the default)
    # the advice is only shown and lane changes stay with the operator.
    auto_lanes: false
    # Operator maximum lane count the daemon never exceeds while auto-lanes
    # is on, even when the advice asks for more. 1 to 8, default 2.
    auto_lanes_max: 2
    # An open automaton whose capacity priority is at or above this value
    # counts as a special item while auto-lanes weighs the lanes. A whole
    # number 0 or above (0 makes every open automaton special). Default 1.
    auto_lanes_special_priority: 1
    # When the weekly allowance resets: a weekday (sunday..saturday), a local
    # 24-hour HH:MM clock time and an IANA zone name. The zone's own rules are
    # followed, so a daylight saving change stays correct. A fixed UTC offset
    # such as +05:00 or Etc/GMT-5 is never accepted; an unknown zone name is
    # rejected. Defaults: sunday, 08:00, empty (empty means the zone the
    # daemon runs in, falling back to UTC).
    reset_weekday: sunday
    reset_time: "08:00"
    reset_zone: ""
    # Name of the federation peer that keeps the shared readings (the weekly
    # allowance belongs to the account, not to one daemon). Empty means this
    # daemon keeps them.
    keeper: ""
  # Burn guard: compares the projected weekly burn with the usage calculator's
  # pace line each interval and steps down a ladder of responses when the
  # projection runs over. Every key is optional and settable at runtime.
  #   REST API      PUT /api/config with {"usage.burn_guard.<key>": value}, or
  #                 PUT /api/usage/burn-guard/config with bare keys; GET /api/config
  #                 returns the live values under usage.burn_guard.
  #   Comm channel  `configure usage.burn_guard.<key>=<value>`
  #   MCP           burn_guard_config_set (or the generic config_set tool)
  #   CLI           `datawatch usage burn-guard config <key>=<value>`
  #   Web UI        Settings > Usage burn guard, and the burn guard card
  # An invalid value is a 400 and changes nothing.
  burn_guard:
    # Turn the guard on. Default true.
    enabled: true
    # How often the guard evaluates, in minutes. 1 to 1440, default 60.
    interval_minutes: 60
    # Points the projection may run over the pace line before the guard acts.
    # 0 to 50, default 2.
    margin_points: 2
    # Largest gap in points allowed between the projection and the pace line.
    # 0 means never compare. 0 to 100, default 25.
    max_projection_gap_points: 25
    # Ordered rungs applied while over the line. Allowed: lower_inflight,
    # route_pi_prompt, hold_claude. Default is all three in that order.
    ladder: [lower_inflight, route_pi_prompt, hold_claude]
    # Undo rungs in reverse once the projection is back under the line.
    # Default true.
    step_back: true
    # Outbound mode: false (default) one alert per change, no question; true also keeps at most one open question per change.
    ask_on_change: false
    # Cache token prices in weekly points per million tokens. Above 0 and at
    # most 1000. Defaults 0.373 (write) and 0.0069 (read).
    cache_write_points_per_million: 0.373
    cache_read_points_per_million: 0.0069
    # Refit the cost model whenever a new usage reading arrives. Default true.
    refit_on_reading: true
    # Task kind to ceiling: low | medium | high | cheaper_backend. Set per
    # Automation with automation_set_effort_ceiling / `datawatch automation
    # set-effort-ceiling`; the default caps docs, parity, live_check and
    # final_gate at low.
    effort_ceiling:
      docs: low
      parity: low
      live_check: low
      final_gate: low
    # Most retries of one task on Claude. 0 to 20, default 2.
    retry_limit_claude: 2
  # Billing profiles: per-provider pricing model. Open map keyed by provider
  # (claude-code, openai, gemini, or any other operator-chosen key). A
  # provider with no profile reads the assumed default (api_metered, unit
  # percent) flagged as an assumption so surfaces can label it.
  billing:
    claude-code:
      # bundled_plan | api_metered | free_local. Unset resolves to api_metered
      # (an assumption, not a fact about the provider).
      mode: bundled_plan
      # Free text; for claude-code the accepted plans are pro, max_5x, max_20x
      # (the same plan_tier vocabulary the LLM entries use). When the tier has
      # no autonomous.plan_tier_allocation_usd entry, monthly_price stands in
      # for it (derived at read time, never copied into that table).
      plan: pro
      # Monthly price of the plan, finite number >= 0, in currency (0 = free).
      monthly_price: 20
      # ISO 4217 code (USD, EUR, ...).
      currency: USD
      # Weekly allowance reset (optional), same vocabulary as usage.calculator.
      reset_weekday: monday
      reset_time: "00:00"
      # percent (default) | requests | tokens — unit of the weekly allowance.
      allowance_unit: percent

# ── Plugin Framework (BL33 — v3.11.0) ──
# Subprocess plugins discovered under <data_dir>/plugins/<name>/ with
# manifest.yaml + executable entry. Line-oriented JSON-RPC over stdio.
# Security: plugins run with daemon privileges — install only reviewed
# plugins. See docs/api/plugins.md.
# Manifest v3 fields (kind: automation|service, connection, lifecycle;
# v9.0.31) live in each plugin's manifest.yaml, not here — see
# docs/api/plugins.md "Manifest" + "Service-kind plugins". No new daemon
# config keys were added for them.
plugins:
  # Opt-in switch. When false every /api/plugins/* returns 503 and
  # discovery is skipped.
  enabled: false
  # Discovery root. Empty = <data_dir>/plugins.
  dir: ""
  # Per-invocation wall-clock budget (timeouts treated as pass).
  timeout_ms: 2000
  # Names to skip at discovery (manifests parsed but Enabled=false).
  disabled: []
  # kind: service plugins datawatch may start, health-check, restart and
  # stop (managed mode, v9.0.32). Only honoured when the plugin's manifest
  # lists `managed` in lifecycle.supported_modes. Empty = never managed.
  # See docs/api/plugins.md.
  managed: []
  # Service-plugin watch settings: the attach-only health-probe cadence,
  # the enrichment-backlog growth streak, the model-use report's thresholds,
  # and the per-plugin lifecycle mode. Every field is optional and reads its
  # documented default; a value outside its range fails config load (the
  # process refuses to start) and the REST PUT is rejected naming the field,
  # value, rule and default — so the stored value is always exactly the
  # value the watchers use.
  services:
    # How often the daemon health-probes an attach-only service plugin.
    # Default: 60; minimum: 5 (seconds).
    health_interval_seconds: 0

    # Consecutive model-node task passes in which the service's
    # enrichment-backlog depth rose (each >= the service's own minimum
    # rise) before the daemon says the backlog is growing.
    # Default: 3; minimum: 1.
    backlog_growth_pulls: 0

    # The node-overloaded threshold for the model-use report (the average
    # CPU utilization ratio that marks a node loaded).
    # Default: 1.5; must be > 0.
    node_load_ratio: 0

    # A model at or above this many billion parameters is not a small model
    # for the model-use findings. Default: 8.0; must be > 0.
    small_model_max_params_billions: 0

    # The context length (tokens) above which a small model raises the
    # large-context finding. Default: 8192; must be >= 1.
    small_model_context_tokens: 0

    # Per-plugin entries keyed by plugin name. An absent entry means "the
    # only mode the plugin's manifest supports, or attach_only when it
    # supports both"; lifecycle_mode is one of attach_only | managed (""
    # = unset, the default) and only takes effect when the manifest
    # declares it in lifecycle.supported_modes — so managed means a managed
    # service only when the author opted in. See docs/api/plugins.md.
    per_service:
      # e.g.
      # mcp: {lifecycle_mode: attach_only}
      # ollama: {lifecycle_mode: managed}
      "": {}

# ── Council Mode (v6.11.0 / v7.0.0) ──
# Multi-persona structured debate orchestrator. All fields configurable at
# runtime via PATCH /api/council/config, `datawatch council config set`,
# Settings → Automata → Council Mode config section (PWA), or comm verb
# `council config set <key> <value>`.
council:
  # LLM registry entry name used for all persona inference and synthesis.
  # Empty = uses the default entry if only one is registered. Set to the
  # name of any entry from `datawatch llm list`.
  llm_ref: "ollama"

  # Backend pool: LLM registry names available for per-persona assignment
  # (Settings UI's backend multi-select). llm_ref above stays the actual
  # default a persona with no backend override resolves to; this list
  # doesn't replace it — it's the set the Settings UI's per-persona
  # "Backend" picker offers, plus whatever the operator checks here.
  # Empty = Settings UI falls back to listing every registry entry.
  backends: []

  # Per-round maximum concurrent persona calls. 0 = fully serial.
  # Higher values speed up long debates but increase load on the LLM node.
  max_parallel: 2

  # When true, every persona_response event is pushed to all configured
  # comm channels (Signal/Telegram/etc.) in addition to the always-on
  # milestone events (run_started, round_completed, synthesis, run_completed).
  # Default false = milestones only.
  comm_firehose: false

  # How long persona-wizard draft entries are retained before auto-GC.
  # 0 disables garbage collection entirely.
  draft_retention_days: 7

# ── Scheduled Job Results ──
# Per-schedule result history: every scheduled run posts a result payload
# (title required; status ok/warn/error; summary, metrics, tables, optional
# markdown). Each schedule name retains only the most recent
# schedule_history_limit entries, oldest evicted first. The store lives
# under data_dir and survives daemon restarts, independent of the posting
# session.
results:
  # Number of latest result entries kept per schedule name.
  # Default: 20. Values below 1 are rejected; the effective limit is
  # always at least 1. Changing it applies from the next posted result.
  schedule_history_limit: 20

# ── Cost report ──
# Knobs for the cost report (internal/costreport): one view over the
# spend the daemon already records (tokens per session, plus a USD
# estimate where a rate is configured for the backend), grouped over a
# since/until window by one of four group_bys.
# Tokens come first: a row's usd_estimate is present only when a rate is
# configured for every backend in that row (see cost_rates above);
# otherwise the field is absent and rate_configured is false.
cost_report:
  # default_group_by: grouping a report request that names none is
  # built under. Allowed values and their meaning:
  # automaton: group by the owning automaton
  # automation: group by the owning automation (the automation that ran the work)
  # backend: group by backend family
  # week: group by week, using week_start below
  # Default: automaton. Unset or an unrecognized value reads automaton.
  default_group_by: automaton
  # default_window_days: the window, in days, the report falls back to
  # when a request has no since bound: until minus this many days.
  # (until itself falls back to now.) Default: 7. Values below 1 read
  # the default.
  default_window_days: 7
  # show_usd_estimates: whether rows may carry a usd_estimate at all,
  # on top of a rate being configured for the row's backends. Default
  # true. Set false for a tokens-only report even where rates exist.
  show_usd_estimates: true
  # week_start: the day that starts a week for group_by: week reports
  # (row keys are the week-start date in UTC, YYYY-MM-DD).
  # monday: week runs Monday 00:00 to Sunday 23:59 (default)
  # sunday: week runs Sunday 00:00 to Saturday 23:59
  # Unset or any other value reads monday.
  week_start: monday
  # include_peer_spend: whether rows also include spend recorded by
  # federation peers that opted into reporting it to this daemon.
  # Default false: peer spend is excluded from the report.
  include_peer_spend: false

# ── Standard-task packs ──
# The standard-task pack feature: installable, named, versioned folders that
# ship Automaton task prompts, verification scripts and Automaton templates.
# Off by default, so a daemon that never sets packs.* behaves as before.
packs:
  # Turn the pack feature on. Default false.
  # Turning it on should need at least one enabled skills registry source (the
  # community registry by default). Turning it on through a surface is refused
  # (HTTP 409) by that check (packs.CheckEnable); a hand edit of this file
  # skips it. With this key false, only "builtin" applies.
  # Install, accept, remove, the inputs and the settings are on REST, MCP,
  # CLI, the comm channel and the web Settings card; see docs/howto/packs.md.
  enabled: false
  # The packs in use, in order. Each name is "builtin" (the standard tasks and
  # Automaton templates compiled into the binary, always valid; the repository's
  # test fixture folder is not read) or the name of an installed pack. A name that is
  # neither, an empty name or a repeated name is rejected by validation.
  # This is the global list: an Automaton's own list wins over it when set, and
  # lists are never merged (packs.ActivePacks). There is no per-project list key.
  # Default: [builtin].
  active:
    - builtin

# ── Onboarding report ──
# The Automation onboarding report: what is configured, what is missing and
# what to try next. Read from the PWA card, `datawatch automation
# onboarding-report`, the onboarding_report MCP tool, the comm verb
# onboarding-report and GET /api/automation/onboarding-report.
onboarding_report:
  # Turn the report on. Default true. When false every surface says the report
  # is disabled and no check runs.
  enabled: true
  # Add the ordered "try next" suggestions. Default true.
  include_next_steps: true
  # Check ids left out of the report, from backends, models, projects,
  # channels, memory, merge_pipeline. Default empty. An unknown id is ignored.
  disabled_checks: []

# ── Projects: per-project automation policy ──
# The middle tier of the three policy tiers the daemon resolves every Automaton
# setting through: Automaton over project over daemon defaults. A project with
# no policy at all reads exactly like it did before policies existed, because
# every key below is optional and inherits the daemon's own value when absent.
# A key that is set wins for every Automaton in that project unless the Automaton
# overrides the same key. Read the effective value with
# `datawatch projects policy show <name> --effective`, the project_policy_effective
# MCP tool, or GET /api/projects/{name}/policy/effective (with ?automaton=<id>
# to include the top tier). See docs/howto/project-automation-policy.md.
projects:
  # One entry per project alias. `dir` is the project directory; `policy` is
  # optional and the block below shows every key the daemon validates.
  core-api:
    dir: ~/projects/core-api
    policy:
      # ── Plan checks (apply before any Automaton's own settings) ──
      # plan_coverage_check: what the coverage gate does to a short plan:
      #   off: let every plan through (daemon default)
      #   warn: leave the plan as-is, name the shortfall
      #   block: refuse to accept the plan
      plan_coverage_check: warn
      # plan_coverage_min_ratio: coverage ratio a plan must reach; in (0, 1].
      plan_coverage_min_ratio: 0.85
      # plan_review_mode: plan-quality review gate: off | warn | block.
      # plan_review_mode: warn
      # scope_lint: task-scope lint: off | warn | enforce.
      # scope_lint: enforce
      # ── Retry & escalation ──
      # retry_policy: per-category retry budgets, whole number of attempts >= 0
      # for each of infra, content, scope, policy. A category left out keeps
      # the daemon's number for that category only.
      retry_policy:
        infra: 2
        # content: 1
        # scope: 0
        # policy: 0
      # retry_ceiling_total: cap across all of a task's categories; >= 0.
      # auto_fix_retries: retries an auto-fix run may get; 0 turns auto-fix off.
      # infra_retry_escalate_after: after how many infra retries a task may escalate
      # instead of retrying; 0 reads as never, keep retrying.
      # failure_escalation: the escalation level reached when a task's retries are
      # spent (tier, backend/model/effort, attempts per step).
      # ── Git defaults ──
      # default_auto_pr: whether a task may open a PR without asking per task.
      # parallel_read_only_tasks: whether read-only tasks may run in parallel.
      # parallel_worktree_per_task: whether each parallel task gets its own worktree.
      # ── Lane limits ──
      # max_concurrent_tasks: the project's in-flight task cap; >= 1.
      max_concurrent_tasks: 4
      # plan_tier_max_inflight: per plan tier, Automata in flight at once (map).
      # lane_fill_gpu_lanes / lane_fill_claude_lanes: lanes the project may hold
      # from the pools; 0 reads as no preference (daemon caps apply).
      # ── Others ──
      # uncommitted_work_policy: hold | ask | discard (hold = daemon default).
      # uncommitted_work_scope: commit | worktree (worktree = default, stricter).
      # burn_guard_ask_on_change: confirmation question (true) or silent write
      # (false, daemon default) for burn-guard changes to this project's tasks.
      # project_gate_command: the build-and-test command the script gate runs for
      # this project, one line, same rules as autonomous.project_gate_command.
      # Absent = inherit the daemon value; an explicit "" unsets it for this
      # project only, so its gate runs no project command.
      # project_gate_command: make test

# ── Auto-Update ──
# Automatic self-update configuration.
update:
  # Enable automatic background updates
  enabled: false
  # Check frequency: hourly, daily, weekly
  schedule: ""
  # Time of day for daily/weekly checks (HH:MM)
  time_of_day: ""
