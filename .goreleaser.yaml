version: 2

project_name: datawatch

builds:
  - id: datawatch
    main: ./cmd/datawatch/
    binary: datawatch
    ldflags:
      - -s -w -X main.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

  - id: datawatch-stats
    main: ./cmd/datawatch-stats/
    binary: datawatch-stats
    ldflags:
      - -s -w -X main.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  - id: datawatch-channel
    main: ./cmd/datawatch-channel/
    binary: datawatch-channel
    ldflags:
      - -s -w
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: datawatch
    builds: [datawatch]
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "datawatch_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - CHANGELOG.md
      - docs/

  - id: datawatch-stats
    builds: [datawatch-stats]
    format: tar.gz
    name_template: "datawatch-stats_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - CHANGELOG.md

  - id: datawatch-channel
    builds: [datawatch-channel]
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "datawatch-channel_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: dmz006
    name: datawatch
  draft: false
  prerelease: auto
  make_latest: latest-stable
  name_template: "v{{.Version}}"
