  - id: cve/CVE-2026-6276
    kind: container
    package: "curl, libcurl4"
    version: "7.88.1-10+deb12u15"
    severity: high
    images:
      - agent-base
      - agent-gemini
      - agent-aider
      - parent-full
    impact:
      traced: true
      reachable: "no"
      method: "grep of Go sources, hook/entrypoint scripts and image Dockerfiles for runtime curl invocations, checking each for redirect-following (-L) and cookie options (-b/-c)"
      analysis: "Cookie leak on cross-origin redirect needs curl to both hold cookies (cookie engine enabled by -b/-c) and follow a redirect (-L) to another origin. Runtime curl callers in the repo: internal/hookinstaller/install.go POSTs to the local daemon with curl -ks and no -L/-b/-c; internal/memory/hooks.go does the same to DATAWATCH_URL; internal/llm/backends/openwebui/backend.go runs curl -s -N against the configured Open WebUI endpoint with a Bearer header, no cookie jar and no -L. docker/entrypoint.sh has no curl at all. Dockerfile curl -fsSL calls (agent-base rtk, agent-gemini nodesource, parent-full signal-cli) run at build time only, with no cookies, so nothing is leaked at runtime. No datawatch code path combines cookies with redirects, so the flaw is unreachable from datawatch itself. An agent could in theory run curl -b -L by hand; that is operator-trusted work, not an exposed path."
    first_added: "2026-05-19"
    added: "2026-05-19"
    expires: "2026-06-18"
    validated_by: "claude-session"
    reason: "No fix available in Debian bookworm as of this migration; re-check each release cycle (BL398 Phase 1's live rescan baseline)."

  - id: cve/CVE-2023-2953
    kind: container
    package: "libldap-2.5-0"
    version: "2.5.13+dfsg-5"
    severity: high
    images:
      - agent-base
      - agent-gemini
      - agent-aider
      - parent-full
    impact:
      traced: true
      reachable: "no"
      method: "grep of Go sources, scripts and Dockerfiles for ldap usage; apt dependency reasoning for how libldap-2.5-0 enters the images"
      analysis: "Null pointer dereference in OpenLDAP ber_memalloc_x, triggered only when an LDAP client library parses a malformed response from an LDAP server. The earlier note blamed OpenSSH; in Debian bookworm libldap-2.5-0 is actually a dependency of libcurl4 and libcurl3-gnutls (curl is built with LDAP/LDAPS scheme support), which agent-base installs via curl and git. grep for ldap across internal/, cmd/, scripts/ and the agent-base, agent-gemini, agent-aider and parent-full Dockerfiles finds no LDAP use, no ldap URL, and no slapd or ldap-utils package. The only way to reach the code is curl being handed an ldap:// or ldaps:// URL pointing at a hostile server; every curl call in the repo targets http(s) endpoints (local daemon, operator-configured LLM URL, github/nodesource at build time). The library cannot be removed without removing curl and git, so no removal is recommended."
    first_added: "2026-05-19"
    added: "2026-05-19"
    expires: "2026-06-18"
    validated_by: "claude-session"
    reason: "No fix available in Debian bookworm as of this migration; re-check each release cycle (BL398 Phase 1's live rescan baseline)."

  - id: cve/CVE-2025-69720
    kind: container
    package: "ncurses (libncursesw6, libtinfo6, ncurses-base)"
    version: "6.4-4"
    severity: high
    images:
      - agent-base
      - agent-gemini
      - agent-aider
      - parent-full
    impact:
      traced: true
      reachable: "no"
      method: "docker run --network none on the built agent-base image: dpkg-query, apt-cache rdepends --installed, which infocmp/tic/tput; grep of Dockerfiles and internal/ cmd/ Go sources; CVE description read"
      analysis: "CVE-2025-69720 is a stack buffer overflow in analyze_string() in progs/infocmp.c, i.e. in the infocmp command-line tool, not in the terminal escape-sequence parser the earlier wording described (ncurses before 6.5-20251213). Only the infocmp binary reaches that function, and infocmp ships in ncurses-bin, which is NOT installed in agent-base (dpkg-query finds no ncurses-bin; which infocmp tic toe tput clear finds nothing). The flagged packages are only libraries: libtinfo6 is linked by bash, tmux, less, util-linux, libreadline8 and procps, libncursesw6 by procps and pinentry-curses, ncurses-base is terminfo data. None of them contains analyze_string. No Dockerfile or entrypoint and no Go source under internal/ or cmd/ invokes infocmp, and the container runs as uid 10001. Unreachable; the libraries are required by tmux, bash and less."
    first_added: "2026-05-19"
    added: "2026-05-19"
    expires: "2026-06-18"
    validated_by: "claude-session"
    reason: "No fix available in Debian bookworm as of this migration; re-check each release cycle (BL398 Phase 1's live rescan baseline)."

  - id: cve/CVE-2026-9538
    kind: container
    package: "perl, perl-base, perl-modules-5.36, libperl5.36"
    version: "5.36.0-7+deb12u4"
    severity: high
    images:
      - agent-base
      - agent-gemini
      - agent-aider
      - parent-full
    impact:
      traced: true
      reachable: "no"
      method: "docker run --network none on the built agent-base image: dpkg Depends of git, apt-cache rdepends --installed perl, grep for Archive::Tar in /usr/lib/git-core, dpkg -S /usr/bin/ptar; grep of Go sources and Dockerfiles; CVE description read"
      analysis: "CVE-2026-9538 is a memory-exhaustion flaw in Perl's Archive::Tar before 3.10: the entry size is read from the 12-byte tar header with no upper bound, so a crafted archive makes Perl allocate a huge buffer (denial of service). It only triggers when a Perl program calls Archive::Tar on an untrusted archive. In agent-base, perl is needed by git (git Depends: perl, liberror-perl, so it cannot be dropped while git stays) and by debconf and adduser; git 2.39.5's Perl scripts do not use Archive::Tar (grep of /usr/lib/git-core finds none) and git archive and git clone are C code. The only Archive::Tar callers are the perl-provided ptar, ptardiff, ptargrep and instmodsh utilities in /usr/bin, which nothing runs. No datawatch Go source or image Dockerfile or entrypoint executes perl or those tools, and tar is extracted with GNU tar. The path is unreachable."
    first_added: "2026-05-31"
    added: "2026-05-31"
    expires: "2026-06-30"
    validated_by: "claude-session"
    reason: "No fix available in Debian bookworm. GH#163 (2026-10-07) already removed CVE-2026-42496/42497/48962/8376 from this block once a fix shipped for those four -- same removal process applies here if/when one ships."

  - id: cve/CVE-2026-53615
    kind: container
    package: "bsdutils, libblkid1, libmount1, libsmartcols1, libuuid1, mount, util-linux, util-linux-extra"
    version: "1:2.38.1-5+deb12u3"
    severity: high
    images:
      - agent-base
    impact:
      traced: true
      reachable: "no"
      method: "docker run --network none on the built agent-base image: dpkg-query, apt-cache rdepends --installed for libblkid1/libmount1/mount, ldd of tmux and git, which blkid lsblk mount; grep of Go sources and Dockerfiles; CVE description read"
      analysis: "CVE-2026-53615 is in libblkid's parse_dos_extended(): a 32-bit sum for the extended-partition start sector and missing bounds checks let a crafted DOS extended-partition table be misreported. It needs libblkid to probe a block device or disk image holding that table. In agent-base the library is pulled in by util-linux, mount and libmount1 (apt-cache rdepends); the blkid, lsblk, mount, umount, findmnt and wipefs binaries exist, but ldd shows neither tmux nor git links libblkid or libmount. No Dockerfile or entrypoint calls them, and no Go source under internal/ or cmd/ runs blkid, lsblk, mount or fdisk (internal/observer/disk_linux.go only parses /proc mount information and calls statfs). The container runs as uid 10001 with no /dev/sd*, nvme or loop devices, so nothing can probe a crafted partition table. Unreachable; util-linux is essential and cannot be removed."
    first_added: "2026-10-21"
    added: "2026-10-21"
    expires: "2026-11-20"
    validated_by: "claude-session"
    reason: "No fix available in Debian bookworm: security-tracker.debian.org/tracker/CVE-2026-53615 (checked 2026-10-21) lists bookworm 2.38.1-5+deb12u3 as vulnerable with no fixed version (Debian bug 1140197); fixed only in trixie 2.41.5-0+deb13u1. Review by 2026-11-20 and remove once Debian ships a bookworm util-linux update (see docs/plans/2026-10-21-cve-2026-53615-agent-base.md)."

  - id: cve/CVE-2026-55453
    kind: container
    package: "libcups2"
    version: "2.4.2-3+deb12u9"
    severity: high
    images:
      - parent-full
    impact:
      traced: true
      reachable: "no"
      method: "grep of Dockerfiles, docker/entrypoint.sh and Go sources for cups/lp/lpr/ipp; dpkg and apt-cache inspection of the built agent-base image (docker run --network none); parent-full Dockerfile and internal/signal read; CVE description read"
      analysis: "CVE-2026-55453 is in the CUPS scheduler/backend: quote_string() in backend/ipp.c keeps CR/LF in a printer-supplied marker message, so a hostile IPP printer can inject a PPD control line that cupsd saves, which only matters when cupsd later runs a print job on a Foomatic-backed queue. In parent-full the package is only the libcups2 client library, pulled in by Dockerfile.parent-full line 23 (install_packages openjdk-17-jre-headless) on top of agent-base, where dpkg shows no libcups2, no cups, cups-daemon, cups-browsed or cups-filters. So there is no scheduler, no backend/ipp binary, no queue and no PPD store in the image; the vulnerable function lives in the cups daemon backend, not in libcups2. The only Java program run is signal-cli (internal/signal/javafix.go runs signal-cli --version and the daemon); it is headless and never calls javax.print. grep of cmd/, internal/, docker/ and scripts/ finds no lp, lpr, lpstat, cupsd, ipp:// or .ppd use. Unreachable; libcups2 is a hard Depends of openjdk-17-jre-headless so it cannot be removed separately."
    first_added: "2026-10-21"
    added: "2026-10-21"
    expires: "2026-11-20"
    validated_by: "claude-session"
    reason: "No fix available in Debian bookworm: security-tracker.debian.org/tracker/CVE-2026-55453 (checked 2026-10-21) lists bookworm 2.4.2-3+deb12u9 as vulnerable with no fixed version (Debian bug 1150560); fixed only in sid 2.4.20-1. Review by 2026-11-20 and remove once Debian ships a bookworm cups update (see docs/plans/2026-10-21-trivy-aider-parent-full.md)."

  - id: cve/CVE-2026-7210
    kind: container
    package: "python3.11, libpython3.11-*"
    version: "3.11.2-6+deb12u9"
    severity: critical
    images:
      - agent-gemini
      - agent-aider
    impact:
      traced: true
      reachable: "yes"
      method: "docker run --network none on the built agent-gemini and agent-aider images: dpkg -l, apt-cache rdepends --installed python3.11-minimal, grep of the aider pipx venv site-packages for xml.etree/xml.dom/pyexpat imports, read of the litellm and botocore call sites; Dockerfile.agent-gemini/aider read"
      analysis: "CVE-2026-7210 is a use-after-free in Python 3.11's expat bindings (xml.parsers.expat, used by xml.etree.ElementTree) triggered by crafted XML. agent-gemini: python3.11 is not installed by its Dockerfile; apt-cache rdepends lists nodejs and rsync as the dependents, there is no Python application in the image (gemini is a node program), and a grep finds no caller, so there it is dormant. agent-aider: Dockerfile.agent-aider installs python3 and runs aider from a pipx venv whose interpreter is /usr/bin/python3 (3.11.2), so the stdlib expat module is live. Grep of the venv shows ElementTree used by botocore (botocore/serialize.py and compat.py parse AWS service XML responses), by litellm (get_blog_posts.py calls ET.fromstring on an RSS feed fetched over httpx; prompt_templates/factory.py parse_xml_params calls ET.fromstring on model-produced function-call XML) and by networkx gexf. So untrusted XML from an LLM provider, AWS endpoint or remote feed can reach the vulnerable parser in agent-aider. Reachable in agent-aider, conditional on a hostile or compromised provider response; the datawatch Go service itself never parses XML in Python."
    first_added: "2026-05-31"
    added: "2026-11-02"
    expires: "2026-12-02"
    validated_by: "operator 2026-11-02, queue answer: accept for 30 days"
    reason: "Operator accepted this finding for 30 days on 2026-11-02 (queue answer, option accept). Debian bookworm lists python3.11 as open with no fixed version; re-check Debian each week and remove the entry as soon as a fixed version ships. The aider image runs sandboxed and aider is optional."

