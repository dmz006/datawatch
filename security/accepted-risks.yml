      analysis: "CVE-2026-126190 is a polynomial-time denial of service (ReDoS) in Soup Sieve's CSS selector handling, so it is only triggered when an attacker controls the selector string passed to soupsieve (through bs4's select or select_one). Aider uses beautifulsoup4 only to scrape pages it fetches itself and its own code contains no select, select_one or soupsieve call, so no selector string, attacker-controlled or not, reaches soupsieve from aider. Page content cannot supply a selector. Not patched because the fixed soupsieve (4.0.0) requires Python >=3.11.5, as does every release from 3.0.2 on, and the image runs Debian 12's Python 3.11.2, so pip refuses it. Forcing it with --ignore-requires-python is not done because upstream yanked 3.0 and 3.0.1 for breakage on older Pythons. Cleared by moving the aider venv to Python >=3.11.5 (follow-up filed separately), after which soupsieve can be upgraded and this entry removed."
