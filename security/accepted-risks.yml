      analysis: "CVE-2026-11822 is FTS5 memory corruption that needs an FTS5 virtual table in a crafted database file; The earlier claim that the gh CLI uses SQLite is wrong: gh is built from source in the ghbuilder stage with CGO_ENABLED=0 and is a statically linked Go ELF, so it links no libsqlite3. In agent-base the only installed package depending on libsqlite3-0 is gpg (ldd confirms /usr/bin/gpg is the only binary linking it, via its TOFU trust database); git, apt, curl, tmux and openssh do not link it, and agent-base has no python3. Nothing in datawatch Go sources, scripts or entrypoints invokes gpg; gnupg is only used at image build time for the nodesource apt key. datawatch itself uses the pure-Go modernc.org/sqlite driver (internal/memory, websearch, council, docsindex), built CGO_ENABLED=0, so it never loads the system library. agent-aider adds python3 whose _sqlite3 module links libsqlite3-0 (aider's diskcache and tags cache use fixed SQL, no FTS5, and no attacker-supplied SQL or FTS5 tables). agent-gemini adds only nodejs and gnupg. parent-full adds a headless JRE. No path reaches the vulnerable code with attacker input."
