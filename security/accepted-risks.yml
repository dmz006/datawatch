  - id: cve/CVE-2026-115506
    kind: container
    package: "libexpat1"
    version: "2.5.0-1+deb12u5"
    severity: high
    images:
      - agent-base
      - agent-gemini
      - agent-aider
      - parent-full
    impact:
      traced: true
      reachable: "unknown"
      method: "docker run --network none --entrypoint sh on the built agent-base 9.93.0 image: dpkg -l libexpat1 shows 2.5.0-1+deb12u5, identical to the scanned version; apt-cache rdepends --installed libexpat1 lists only git; ldd of every ELF in /usr/bin, /usr/lib/git-core and /usr/lib/x86_64-linux-gnu shows that only git-http-push links libexpat. The same two commands on the older datawatch-agent-aider and datawatch-agent-gemini 8.73.2 images (libexpat1 2.5.0-1+deb12u4) list git and python3.11-minimal; a grep of the installed aider package for xml.etree, xml.dom, xml.sax, pyexpat and plistlib finds nothing. Debian tracker page read: bookworm and bookworm-security are vulnerable, fixed only in sid 2.10.0-1. A built parent-full image was not inspected."
      analysis: "A denial of service in libexpat through 2.9.0: the billion-laughs amplification check in accountingDiffTolerated() fires too late, so a moderately sized XML document with a large DTD and nested entities can burn tens of seconds of CPU per parse. It needs attacker supplied XML handed to an expat parser. In agent-base the only dependent is git and the only git program that links it is git-http-push, the WebDAV push helper, which datawatch never runs (it clones and pushes over ssh and smart HTTPS). The datawatch binary is pure Go (CGO_ENABLED=0) and uses Go's own XML parser, not libexpat. The residual is the Python-based images: agent-aider and agent-gemini carry python3.11 whose pyexpat module links libexpat1, so any script run in a worker session that parses attacker XML with Python's expat-based parsers would hit this. No datawatch code and no aider code found by the grep does that, but a worker can run arbitrary commands, so reachability in those images is not ruled out and is recorded as unknown. The impact is bounded CPU use in a disposable worker container, not code execution."
    first_added: "2026-11-06"
    added: "2026-11-06"
    expires: "2026-12-06"
    validated_by: "claude-session"
    reason: "The Trivy scan of agent-base in the 9.100.1 Release run (run 42190519222) lists CVE-2026-115506 (HIGH) on libexpat1 2.5.0-1+deb12u5 as affected with no fixed version; the Debian security tracker (read 2026-11-06) lists bookworm as vulnerable with no fixed bookworm version; re-check security-tracker.debian.org each release and remove this entry when a fix ships."
  - id: cve/CVE-2026-119374
    kind: container
    package: "libsqlite3-0"
    version: "3.40.1-2+deb12u2"
    severity: high
    images:
      - agent-base
      - agent-gemini
      - agent-aider
      - parent-full
    impact:
      traced: true
      reachable: "unknown"
      method: "docker run --network none --entrypoint sh on the built agent-base 9.93.0 image: dpkg -l libsqlite3-0 shows 3.40.1-2+deb12u2, identical to the scanned version; apt-cache rdepends --installed libsqlite3-0 lists only gpg; ldd of every ELF in /usr/bin, /usr/sbin, /usr/lib/git-core and /usr/local/bin shows that only /usr/bin/gpg links libsqlite3; grep -a of gpg for sqlite3_ symbols shows only basic calls (open, prepare_v2, step, bind, exec, close) and no changeset or fts5 strings; libsqlite3.so.0 contains the fts5 module. On the older datawatch-agent-aider 8.73.2 image: rdepends lists libpython3.11-stdlib (the _sqlite3 module) and gpg, diskcache 5.6.3 is installed in the aider pipx venv, and aider/repomap.py sets TAGS_CACHE_DIR to .aider.tags.cache.v<N>, a SQLite cache inside the repository being worked on. Debian tracker page read: bookworm vulnerable, fixed only in sid 3.54.1-2. A built parent-full image was not inspected."
      analysis: "A heap buffer overflow in SQLite's FTS5 fts5DoSecureDelete() (SQLite before 3.54.0), triggered by a crafted database file whose FTS5 index has corrupt footer key offsets, when rows are deleted from that FTS5 table with FTS5 secure-delete enabled. In agent-base the only consumer is gpg, which uses SQLite solely for its optional TOFU trust database with fixed SQL statements; it never creates or deletes from an FTS5 table, and TOFU is off under the default trust model. The datawatch binary uses modernc.org/sqlite, a pure-Go implementation (CGO_ENABLED=0), never the Debian libsqlite3. The agent-aider image is different: python3's sqlite3 module links libsqlite3, and aider opens a diskcache SQLite file stored in the repository (.aider.tags.cache). A hostile repository could commit a crafted cache.db; diskcache itself issues no FTS5 statements, but SQLite runs triggers stored in an opened database file, so a planted trigger on diskcache's own tables that deletes from an FTS5 table is a plausible, unproven path to this bug. That path was not exercised here, so reachability is recorded as unknown, not no. The impact is a heap overflow in the aider process inside a disposable worker container; the mitigation is that aider workers only clone repositories the operator configured."
    first_added: "2026-11-06"
    added: "2026-11-06"
    expires: "2026-12-06"
    validated_by: "claude-session"
    reason: "The Trivy scan of agent-base in the 9.100.1 Release run (run 42190519222) lists CVE-2026-119374 (HIGH) on libsqlite3-0 3.40.1-2+deb12u2 as affected with no fixed version; the Debian security tracker (read 2026-11-06) lists bookworm as vulnerable with no fixed bookworm version; re-check security-tracker.debian.org each release and remove this entry when a fix ships."
  - id: cve/CVE-2026-119379
    kind: container
    package: "libsqlite3-0"
    version: "3.40.1-2+deb12u2"
    severity: high
    images:
      - agent-base
      - agent-gemini
      - agent-aider
      - parent-full
    impact:
