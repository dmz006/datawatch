# Accepted (suppressed) container-image security findings.
# Security acceptance standard (operator, 2026-10-08; shared with
# datawatch-app, dmz006/datawatch#197). Schema matches datawatch-app's
# security/accepted-risks.yml (main 9f9849ad) field-for-field.
#
# Generates .trivyignore and docs/security-review.md's container-scanning
# table -- do not hand-edit either generated file; edit this registry and
# run `python3 scripts/gen_trivyignore.py`. Validate with
# `python3 scripts/check_accepted_risks.py` (CI runs it; see that script's
# docstring for the exact rules, ESCALATE conditions and the --base check).
#
# Entries are written/migrated by hand, one at a time -- never generated by
# scraping another file. This file's initial 70 entries ARE a migration,
# but a deliberate one: analysis text is preserved from .trivyignore's own
# already-reviewed rationale, and images/version/first_added below come
# from real git history + a live Trivy rescan (BL398 Phases 0-1), not from
# re-parsing the old file's own (sometimes wrong -- see BL398 Phase 0)
# metadata.
#
# MIGRATION HONESTY NOTE: impact.traced is true for exactly one entry below
# (cve/CVE-2026-19445, traced this session). The other 69 are prose
# reasoning about exploit preconditions, not independently verified traces
# -- this project's real state before today, not a bug introduced by this
# migration. Under this standard's 30-day untraced expiry, most of them
# import already past expires relative to their real first_added/added
# date. That is deliberate and is BL398 Phase 2's actual remaining
# backlog -- see docs/plans/2026-10-08-bl398-trivyignore-cve-review.md.
# check_accepted_risks.py does not fail the build on an expired entry
# (per the shared standard, expiry is a daily-watch/reporting concern, not
# a lint-blocking one); it only fails on structural/schema violations.
entries:
  - id: cve/CVE-2023-45853
    kind: container
    package: "zlib1g"
    version: "1:1.2.13.dfsg-1"
    severity: critical
    images:
      - agent-base
      - agent-gemini
      - agent-aider
      - parent-full
    impact:
      traced: true
      reachable: "no"
      method: "grep of docker/dockerfiles (agent-base, agent-gemini, agent-aider, parent-full) for minizip/zip tooling plus grep of internal/ and cmd/ Go sources for zlib/compress use; CVE description read"
      analysis: "CVE-2023-45853 is an integer overflow in zlib's contrib MiniZip (zipOpenNewFileInZip4_64) when a caller passes an overlong filename, comment or extra field while WRITING a zip. It is not in inflate() (the earlier wording was wrong) and Debian ships MiniZip as separate libminizip packages, not in zlib1g. zlib1g stays installed only as an essential dependency of git, curl, libcurl4, openssh-client and tmux. grep of agent-base, agent-gemini, agent-aider and parent-full Dockerfiles finds no minizip/libminizip package; zip/unzip (Info-ZIP) bundle their own code and do not link MiniZip. datawatch Go sources use only the stdlib compress/gzip (server.go, api_gzip.go, main.go), which is pure Go and never calls libz. No MiniZip caller exists, so the vulnerable function is unreachable. zlib1g cannot be removed (essential)."
    first_added: "2026-05-19"
    added: "2026-05-19"
    expires: "2026-06-18"
    validated_by: "claude-session"
    reason: "No fix available in Debian bookworm as of this migration; re-check each release cycle (BL398 Phase 1's live rescan baseline)."

  - id: cve/CVE-2025-7458
    kind: container
    package: "libsqlite3-0"
    version: "3.40.1-2+deb12u2"
    severity: critical
    images:
      - agent-base
      - agent-gemini
      - agent-aider
      - parent-full
    impact:
      traced: true
      reachable: "no"
      method: "docker run --network none on a built agent-base image: dpkg Depends scan for libsqlite3-0 and ldd over /usr/bin, git-core and /usr/local/bin; Dockerfile and Go/script grep for sqlite, gpg and python use"
      analysis: "CVE-2025-7458 is an integer overflow in SQLite core that needs attacker-supplied SQL text or a crafted database; The earlier claim that the gh CLI uses SQLite is wrong: gh is built from source in the ghbuilder stage with CGO_ENABLED=0 and is a statically linked Go ELF, so it links no libsqlite3. In agent-base the only installed package depending on libsqlite3-0 is gpg (ldd confirms /usr/bin/gpg is the only binary linking it, via its TOFU trust database); git, apt, curl, tmux and openssh do not link it, and agent-base has no python3. Nothing in datawatch Go sources, scripts or entrypoints invokes gpg; gnupg is only used at image build time for the nodesource apt key. datawatch itself uses the pure-Go modernc.org/sqlite driver (internal/memory, websearch, council, docsindex), built CGO_ENABLED=0, so it never loads the system library. agent-aider adds python3 whose _sqlite3 module links libsqlite3-0 (aider's diskcache and tags cache use fixed SQL, no FTS5, and no attacker-supplied SQL or FTS5 tables). agent-gemini adds only nodejs and gnupg. parent-full adds a headless JRE. No path reaches the vulnerable code with attacker input."
    first_added: "2026-05-19"
    added: "2026-05-19"
    expires: "2026-06-18"
    validated_by: "claude-session"
    reason: "No fix available in Debian bookworm as of this migration; re-check each release cycle (BL398 Phase 1's live rescan baseline)."

  - id: cve/CVE-2026-11822
