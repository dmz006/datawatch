  - id: cve/CVE-2026-84782
    kind: container
    package: "libssl3"
    version: "3.0.20-1~deb12u2"
    severity: high
    images:
      - agent-base
      - agent-gemini
      - agent-aider
      - parent-full
      - stats-cluster
    impact:
      traced: false
      reachable: "unknown"
      analysis: "DTLS retransmission logic flaw in OpenSSL. DTLS is TLS over UDP (WebRTC, CoAP, some VPNs); datawatch's containers serve and call only regular TCP-based TLS/HTTPS, never originating or accepting a DTLS connection -- the flawed code path is never reached. Phase 1's live rescan found this spans all 5 images, not only stats-cluster as originally scoped when it blocked v8.35.0's release CI."
    first_added: "2026-09-29"
    added: "2026-09-29"
    expires: "2026-10-29"
    validated_by: "claude-session"
    reason: "No fix available in Debian bookworm as of this migration; re-check each release cycle (BL398 Phase 1's live rescan baseline)."

