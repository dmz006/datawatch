# Accepted (suppressed) container-image security findings.
# Security acceptance standard (operator, 2026-10-08; shared with
# datawatch-app, dmz006/datawatch#197). Schema matches datawatch-app's
# security/accepted-risks.yml (main 9f9849ad) field-for-field.
#
# Generates .trivyignore and docs/security-review.md's container-scanning
# table -- do not hand-edit either generated file; edit this registry and
# run `python3 scripts/gen_trivyignore.py`. Validate with
# `python3 scripts/check_accepted_risks.py` (CI runs it; see that script's
# docstring for the exact rules, ESCALATE conditions and the --base check).
#
# Entries are written/migrated by hand, one at a time -- never generated by
# scraping another file. This file's initial 70 entries ARE a migration,
# but a deliberate one: analysis text is preserved from .trivyignore's own
# already-reviewed rationale, and images/version/first_added below come
# from real git history + a live Trivy rescan (BL398 Phases 0-1), not from
# re-parsing the old file's own (sometimes wrong -- see BL398 Phase 0)
# metadata.
#
# MIGRATION HONESTY NOTE: impact.traced is true for exactly one entry below
# (cve/CVE-2026-19445, traced this session). The other 69 are prose
# reasoning about exploit preconditions, not independently verified traces
# -- this project's real state before today, not a bug introduced by this
# migration. Under this standard's 30-day untraced expiry, most of them
# import already past expires relative to their real first_added/added
# date. That is deliberate and is BL398 Phase 2's actual remaining
# backlog -- see docs/plans/2026-10-08-bl398-trivyignore-cve-review.md.
# check_accepted_risks.py does not fail the build on an expired entry
# (per the shared standard, expiry is a daily-watch/reporting concern, not
# a lint-blocking one); it only fails on structural/schema violations.
entries:
  - id: cve/CVE-2023-45853
    kind: container
    package: "zlib1g"
    version: "1:1.2.13.dfsg-1"
    severity: critical
    images:
      - agent-base
      - agent-gemini
      - agent-aider
      - parent-full
    impact:
      traced: false
      reachable: "unknown"
      analysis: "Integer overflow in inflate(). Only exploitable processing attacker-controlled deflate streams with a specific window size. curl and git in this image decompress only trusted responses from operator-configured remotes; not network-exposed via datawatch APIs."
    first_added: "2026-05-19"
    added: "2026-05-19"
    expires: "2026-06-18"
    validated_by: "claude-session"
    reason: "No fix available in Debian bookworm as of this migration; re-check each release cycle (BL398 Phase 1's live rescan baseline)."

