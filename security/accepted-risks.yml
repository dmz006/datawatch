      reachable: "no"
      method: "docker run --network none --entrypoint sh on the built agent-base 9.93.0 image: dpkg -l libsqlite3-0 shows 3.40.1-2+deb12u2, identical to the scanned version; apt-cache rdepends --installed libsqlite3-0 lists only gpg; ldd scan of all ELF files shows only /usr/bin/gpg links libsqlite3, and grep -a of gpg for sqlite3_ symbols and for changeset finds no session or changeset call; libsqlite3.so.0 exports sqlite3changeset_apply. On the older datawatch-agent-aider 8.73.2 image: grep -rl changeset over the installed aider and diskcache Python packages finds nothing. Debian tracker page read: bookworm vulnerable, fixed only in sid 3.54.1-2. A built parent-full image was not inspected."
      analysis: "A heap buffer overflow in the sqlite3changeset_apply() C API of SQLite's session extension (SQLite before 3.54.0), triggered by a crafted changeset blob whose table name repeats with a larger column count. It is reached only by a program that calls the session API and feeds it an untrusted changeset; a database file or an SQL statement cannot invoke it. The library exports the function, but no program in agent-base calls it (gpg's SQLite calls are limited to open, prepare, bind, step, exec and close), Python's standard sqlite3 module has no binding for the session extension, and neither aider nor diskcache references changesets. The datawatch binary uses pure-Go modernc.org/sqlite, not libsqlite3. No caller exists, so the vulnerable function is unreachable."
