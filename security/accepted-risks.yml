  - id: cve/CVE-2026-85091
    kind: container
    package: "zlib1g"
    version: "1:1.2.13.dfsg-1"
    severity: high
    images:
      - agent-base
      - agent-gemini
      - agent-aider
      - parent-full
    impact:
      traced: true
      reachable: "no"
      method: "docker run --network none --entrypoint sh on the built agent-base 9.93.0 image: dpkg -l zlib1g shows 1:1.2.13.dfsg-1, identical to the scanned version; apt-cache rdepends --installed zlib1g lists sudo, wget, util-linux, apt, rsync, openssh-client, curl, git, gpg, dpkg and others; a loop over every ELF in /usr/bin, /usr/sbin, /usr/lib/git-core, /usr/local/bin and /usr/lib/x86_64-linux-gnu that links libz.so.1 with grep -a for the gz API names finds gzdopen and gzwrite in dpkg-deb and wget, gzdopen, gzflush and gzwrite in sudo_logsrvd, gzdopen in sudoreplay and sudo_sendlog, and no program that references gzprintf, gzvprintf, gzputs, gzputc, gzbuffer or gzsetparams; grep -c gz_vacate on libz.so.1 returns 0. Debian tracker page read: bookworm is listed vulnerable, fixed only in sid 1:1.3.dfsg+really1.3.2-4, and its notes say non-blocking support in the gz routines was introduced in zlib v1.3.1.2."
      analysis: "A heap buffer overflow in gz_vacate() in zlib versions 1.3.1.2 through 1.3.2, triggered when a program using the gz* routines in non-blocking mode calls gzprintf() or gzvprintf() after a gzwrite() stall. Two things keep it out of reach. First, the scanned package is zlib 1.2.13, which predates the non-blocking gz* support (added in 1.3.1.2) that the Debian tracker notes name as the origin of the flaw, so the Debian vulnerable status looks like an unversioned default. Second, no program in the image calls gzprintf or gzvprintf, and the few gzwrite users (dpkg-deb, wget, sudo log tools) use ordinary blocking files, not non-blocking descriptors. The datawatch binary is pure Go (CGO_ENABLED=0) and uses the stdlib compress packages, never libz; Python's zlib module in the aider and gemini images uses deflate and inflate, not the gz* API. zlib1g cannot be removed because dpkg, curl, git and others depend on it. A built parent-full image was not inspected."
    first_added: "2026-11-06"
    added: "2026-11-06"
    expires: "2026-12-06"
    validated_by: "claude-session"
    reason: "The Trivy scan of agent-base in the 9.100.1 Release run (run 42190519222) lists CVE-2026-85091 (HIGH) on zlib1g 1:1.2.13.dfsg-1 as affected with no fixed version; the Debian security tracker (read 2026-11-06) lists bookworm as vulnerable with no fixed bookworm version; re-check security-tracker.debian.org each release and remove this entry when a fix ships."
