# v8.0 E2E test configuration.
# Loaded by docs/testing/docker-compose.test.yml for the primary datawatch service.
# Template vars replaced by run-tests.sh / write_test_config:
#   port: 8080      → TEST_PORT
#   tls_port: 8443  → TEST_TLS_PORT
#   sse_port: 9090  → TEST_MCP_PORT

hostname: dw-e2e-test
data_dir: /data

session:
  llm_backend: shell
  max_sessions: 50
  input_idle_timeout: 10
  tail_lines: 20
  alert_context_lines: 5
  skip_permissions: false
  channel_enabled: true
  auto_git_init: false
  auto_git_commit: false
  kill_sessions_on_exit: true

server:
  enabled: true
  host: 0.0.0.0
  port: 8080
  token: ""
  tls_enabled: true
  tls_auto_generate: true
  tls_port: 8443

mcp:
  enabled: true
  sse_enabled: true
  sse_host: 0.0.0.0
  sse_port: 9090
  token: ""
  allow_self_config: true

memory:
  enabled: true
  backend: sqlite
  embedder: ollama
  embedder_model: nomic-embed-text
  embedder_host: http://localhost:11434

autonomous:
  enabled: true
  planning_backend: ollama

council:
  enabled: true
  llm_ref: ollama-johnnyjohnny

ollama:
  enabled: true
  model: qwen3:1.7b
  host: http://johnnyjohnny:11434

llms:
  - name: ollama-johnnyjohnny
    kind: ollama
    url: http://johnnyjohnny:11434
    model: qwen3:1.7b
    enabled: true
  - name: ollama-localhost
    kind: ollama
    url: http://localhost:11434
    model: qwen3:1.7b
    enabled: true

openwebui:
  enabled: true
  url: http://datawatch:3000
  api_key: sk-11ef286387204367945339a85728622f
  model: qwen3:1.7b

shell_backend:
  enabled: true

whisper:
  enabled: false
  model: medium
  language: en
  venv_path: /home/dmz/.datawatch/.venv

# Vision backend — disabled by default; runner enables via PUT /api/config for TS-658+.
# Points to the test ollama instance (port 21434 in docker-compose.test.yml;
# port 11434 on the host network when running natively against johnnyjohnny).
vision:
  enabled: true
  backend: ollama
  endpoint: http://localhost:11434
  model: moondream:latest
  max_image_bytes: 0

# Lightweight webhook backend: provides a comm responder so pipeline,
# channel-responder tests, and routing-rules tests run without Signal/Slack.
webhook:
  enabled: true
  addr: 127.0.0.1:19080
  token: "WEBHOOK_NOAUTH"

compute_nodes:
  - name: datawatch-ollama
    kind: ollama
    address: http://johnnyjohnny:11434
    scheduling_priority: 90
    declared_capacity:
      gpus: 1
      max_concurrent_models: 3
  - name: datawatch-ollama-b
    kind: ollama
    address: http://localhost:11434
    scheduling_priority: 80
    declared_capacity:
      gpus: 1
      max_concurrent_models: 2

observer:
  peers:
    allow_register: true

dns_channel:
  enabled: true
  mode: server
  domain: dw-test.local
  listen: "127.0.0.1:19053"
  secret: "dw-e2e-test-dns-secret-0000000000"

ntfy:
  enabled: true
  server_url: http://127.0.0.1:19180

plugins:
  enabled: true

web_search:
  enabled: true
  provider: searxng
  url: http://datawatch:3001
  engine: bing

goose:
  enabled: true
  binary: /home/dmz/.local/bin/goose

opencode:
  enabled: false
  binary: opencode
  default_model: opencode/big-pickle

update:
  enabled: false
