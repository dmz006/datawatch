# Dependabot configuration (version 2).
#
# Purpose:
#   - Dependabot runs for security alerts and security updates only. Every
#     ecosystem below sets open-pull-requests-limit: 0, which turns off
#     version-update pull requests; security updates are not limited by it, so
#     each advisory still gets its own reviewable PR.
#   - Version updates come from the weekly dependency update Automation (see
#     docs/howto/automation-dependency-update.md), not from Dependabot.
#   - scripts/check-dependabot-security-only.sh keeps the limit at zero.
#
# Repository settings (cannot be checked from this file):
#   - "Dependabot security updates" must stay ENABLED in the hosting settings
#     (Settings -> Code security and analysis), or the security PRs above will
#     never appear. This file alone does not turn them on.
#
# Merge policy:
#   - No auto-merge anywhere in this file. A human merges every Dependabot PR
#     first; nothing here targets a branch other than the default.
#   - No custom labels are set: a label that does not exist in the repo is
#     skipped with a warning, and Dependabot's default "dependencies" labels
#     are enough.
#   - No cooldown: security updates ignore it, and no one has asked for one.
#   - No ignore entries: an ignore rule could hide a security update.
#
# Maintainer guide: see the upstream-monitoring proposal under docs/plans/
# (search for "upstream-monitoring"); it covers the whole tooling policy,
# including what Dependabot cannot see (FROM lines built from ARGs), which the
# weekly Automation covers.

version: 2

updates:
  # Go modules.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"

  # Docker base images.
  # Directories cover docker/dockerfiles/Dockerfile.* (dependabot matches any
  # file name containing "dockerfile" case-insensitively) and the repo-root
  # Dockerfile.dev.
  # GAP BY DESIGN: FROM lines built from ARGs (golang:${GO_VERSION}-...,
  # ${REGISTRY}/agent-base:${BASE_TAG}) are invisible to Dependabot. The
  # weekly dependency update Automation covers them - do not try to pin those
  # tags here.
  - package-ecosystem: docker
    directories:
      - "/docker/dockerfiles"
      - "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions in .github/workflows.
  # Every `uses:` is pinned by commit SHA with a trailing `# vN` comment.
  # Dependabot updates both the SHA and that version comment, so keep
  # pinning new actions the same way - do not switch to bare tags.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(ci)"
