name: Release CI Summary

# Appends (or refreshes) a CI status table on the GitHub release page.
#
# When it runs:
#   - after a "Release" run completes for a release tag (vX.Y.Z) pushed to this
#     repository, including a re-run of it; the tag is taken from that event;
#   - by hand (workflow_dispatch) with a tag, to refresh the table.
#
# It does not run after main-branch, pull request or scheduled runs. A result
# that arrives or changes after "Release" has completed (for example owasp-zap,
# or a re-run of CI) reaches the table on the next manual run.
#
# Finding the tagged commit takes at most two API requests. Do not search the
# tags or releases for a commit: the workflow token has an hourly request limit
# shared with every other workflow in the repository.
#
# A workflow listed under `workflow_run` is of use only if it starts on a tag
# push; the job's `if` skips every other run.
#
# The table appears at the bottom of the release body under "## CI Status".
# It is replaced in-place on every update, so re-runs keep the section current.
#
# Checked by tests/test-release-ci-summary.sh.

on:
  workflow_run:
    workflows:
      - Release
    types: [completed]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to update (e.g. v8.0.0)"
        required: true

permissions:
  contents: write   # gh release edit
  actions: read     # gh api /actions/runs

jobs:
  update-release-status:
    # A pull request can come from a branch with any name, so the tag-like name
    # counts only for a push to this repository. The exact vX.Y.Z form is
    # checked in the first step.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag from triggering run or manual input
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          # For a run started by a tag push, head_branch holds the tag name.
          RUN_REF: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::The tag input is not a version tag such as v8.0.0."
              exit 1
            fi
          else
            TAG="$RUN_REF"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "The triggering run is not for a release tag; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Prints "<object type> <object id>". A failed request fails the step:
          # without the commit the table could list runs of other commits.
          lookup() {
            gh api "repos/$REPO/$1" --jq '.object.type + " " + .object.sha'
          }

          if ! OBJ=$(lookup "git/ref/tags/$TAG"); then
            echo "::error::Could not look up tag $TAG."
            exit 1
          fi
          read -r OBJ_TYPE OBJ_SHA <<< "$OBJ"
          # An annotated tag points to a tag object, which points to the commit.
          if [[ "$OBJ_TYPE" == "tag" ]]; then
            if ! OBJ=$(lookup "git/tags/$OBJ_SHA"); then
              echo "::error::Could not read the annotated tag $TAG."
              exit 1
            fi
            read -r OBJ_TYPE OBJ_SHA <<< "$OBJ"
          fi
          if [[ "$OBJ_TYPE" != "commit" || ! "$OBJ_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Tag $TAG does not resolve to a commit."
            exit 1
          fi

          if [[ "$EVENT_NAME" != "workflow_dispatch" && "$OBJ_SHA" != "$RUN_SHA" ]]; then
            echo "::warning::Tag $TAG now points to $OBJ_SHA, not to this run's commit $RUN_SHA; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "tag=$TAG"
            echo "sha=$OBJ_SHA"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"

      - name: Build CI status table and update release
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          python3 - <<'PYEOF'
          import os, json, subprocess, re
          from datetime import datetime, timezone

          repo = os.environ["REPO"]
          tag  = os.environ["TAG"]
          sha  = os.environ["SHA"]

          def gh(*args):
              r = subprocess.run(["gh", "api"] + list(args), capture_output=True, text=True)
              if r.returncode != 0:
                  return None
              return json.loads(r.stdout)

          # Fetch all workflow runs for this commit SHA (up to 100)
          runs_data = gh(f"repos/{repo}/actions/runs?head_sha={sha}&per_page=100")
          runs = runs_data.get("workflow_runs", []) if runs_data else []

          # Deduplicate: keep the most-recent run per workflow name
          seen = {}
          for run in sorted(runs, key=lambda r: r.get("run_started_at", ""), reverse=True):
              name = run["name"]
              if name not in seen:
                  seen[name] = run

          ICON = {
              "success":   "✅",
              "failure":   "❌",
              "cancelled": "⛔",
              "skipped":   "⏭️",
              "timed_out": "⏱️",
          }

          rows = []
          for run in sorted(seen.values(), key=lambda r: r["name"]):
              name       = run["name"]
              status     = run["status"]          # queued / in_progress / completed
              conclusion = run.get("conclusion")  # success / failure / cancelled / …
              url        = run["html_url"]

              # Duration
              dur_str = "—"
              start = run.get("run_started_at") or run.get("created_at")
              end   = run.get("updated_at")
              if start and end and conclusion:
                  try:
                      fmt = "%Y-%m-%dT%H:%M:%SZ"
                      s = datetime.strptime(start, fmt)
                      e = datetime.strptime(end,   fmt)
                      secs = int((e - s).total_seconds())
                      dur_str = f"{secs // 60}m {secs % 60}s" if secs >= 60 else f"{secs}s"
                  except Exception:
                      pass

              if conclusion:
                  icon  = ICON.get(conclusion, "❓")
                  label = conclusion
              else:
                  icon  = "🔄"
                  label = status  # in_progress / queued

              rows.append(f"| [{name}]({url}) | {icon} {label} | {dur_str} |")

          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          table = "\n".join([
              "## CI Status",
              "",
              "| Workflow | Result | Duration |",
              "|---|---|---|",
              *rows,
              "",
              f"_Updated: {now}_",
          ])

          # Fetch current release body.
          # Patch releases (X.Y.Z with Z>0) are not published as GH releases
          # per release-discipline rules — only minor/major releases are.
          # Skip gracefully instead of failing when no release exists.
          rel = gh(f"repos/{repo}/releases/tags/{tag}")
          if not rel:
              print(f"Release {tag} not found — patch release with no GH release, skipping CI summary update.")
              raise SystemExit(0)

          body = rel.get("body") or ""

          # Replace existing CI Status section (from ## CI Status to next ## or EOF)
          body = re.sub(r"\n## CI Status\n.*?(?=\n## |\Z)", "", body, flags=re.DOTALL)
          body = body.rstrip()

          new_body = body + "\n\n" + table

          # Update release
          r = subprocess.run(
              ["gh", "release", "edit", tag, "--repo", repo, "--notes", new_body],
              capture_output=True, text=True
          )
          if r.returncode != 0:
              print("gh release edit failed:", r.stderr)
              raise SystemExit(1)

          print(f"✅  Updated release {tag} with {len(rows)} workflow rows.")
          PYEOF
