# v5.26.58 — operator-asked CI parity with datawatch-app: OWASP ZAP
# baseline scan. Runs against the daemon deployed directly as a Go
# binary (no KIND/Docker/Helm). The "baseline" scan is passive — no
# active attacks; just spider + analyse — safe to run against any
# environment.
#
# v5.26.59 — five passes target each interface class:
#
#   1. pwa-baseline    — passive spider against the PWA root
#                         (zaproxy/action-baseline)
#   2. api-scan        — schema-driven scan against /api/ using the
#                         daemon's OpenAPI spec at docs/api/openapi.yaml
#                         (zaproxy/action-api-scan)
#   3. diagrams-scan   — separate baseline run focused on /diagrams.html
#                         so static-surface findings don't get drowned
#                         out by the PWA's bigger surface area
#   4. pwa-active      — full active scan (SQLi/XSS/cmd-injection
#                         payloads) against the PWA root (v5.26.70)
#   5. api-active      — full active scan (-t) against /api/, schema-
#                         constrained so JSON-typed bodies don't trip
#                         spurious findings (v5.26.70)
#
# v5.26.70 — operator confirmed "zap didn't need auth" so passes 4+5
# can hit the daemon directly. Active scans send real attack payloads —
# only safe against an ephemeral test daemon, not any shared environment.
#
# v8.8.6 — replaced KIND+Docker+Helm cluster setup with a direct Go
# binary launch. Cuts setup from ~15 min to ~2 min, eliminates the
# systematic SIGTERM failures that plagued KIND builds without cache.
# The daemon starts at port 8080 with a minimal ephemeral config.

name: owasp-zap

# Trigger automatically after the Release workflow completes on a tag.
# This way ZAP scans the freshly-released version and the HTML reports
# are attached to the release page for user visibility.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

  workflow_dispatch:
    inputs:
      target_host:
        description: 'Target host:port for scans (default: localhost:8080 from binary)'
        required: false
        default: 'localhost:8080'

permissions:
  contents: write  # upload ZAP reports as release assets
  issues: write    # ZAP creates issues for findings above thresholds

jobs:
  zap-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Seed docs index stub for build
        run: |
          mkdir -p internal/docsindex/assets
          [ -f internal/docsindex/assets/docs-bm25-index.json ] || echo '{}' > internal/docsindex/assets/docs-bm25-index.json

      - name: Build datawatch binary
        run: go build -o ./datawatch ./cmd/datawatch

      - name: Start datawatch daemon
        run: |
          set -euxo pipefail
          mkdir -p /tmp/dw-zap-data
          # Minimal config — no messaging, no memory, default port 8080.
          # ZAP confirmed to need no auth (operator decision v5.26.70).
          cat > /tmp/dw-zap-config.yaml <<'DWTESTCFG'
          data_dir: /tmp/dw-zap-data
          server:
            port: 8080
          DWTESTCFG
          ./datawatch start --foreground \
            --config /tmp/dw-zap-config.yaml \
            2>/tmp/dw-daemon.log &
          echo "DW_PID=$!" >> "$GITHUB_ENV"
          # Wait up to 60 s for the health endpoint to respond
          for i in $(seq 1 60); do
            curl -sf "http://localhost:8080/api/health" >/dev/null && echo "Daemon ready after ${i}s" && break
            sleep 1
          done
          # Fail early if daemon didn't start
          curl -sf "http://localhost:8080/api/health" >/dev/null

      # ── Pass 1: PWA baseline (passive spider + analyse) ──────────
      - name: ZAP PWA baseline scan
        uses: zaproxy/action-baseline@6c5a007541891231cd9e0ddec25d4f25c59c9874  # v0.15.0
        with:
          target: "http://${{ inputs.target_host || 'localhost:8080' }}/"
          cmd_options: '-a -j -m 5'
          # .zap/rules.tsv documents accepted risks + confirmed false positives.
          rules_file_name: '.zap/rules.tsv'
          fail_action: true
          allow_issue_writing: true
          issue_title: 'OWASP ZAP — PWA baseline'

      # ── Pass 2: API scan against the OpenAPI spec ────────────────
      - name: ZAP API scan (OpenAPI-driven)
        uses: zaproxy/action-api-scan@bd24b11e76da11ab60302c8ae87f091cbb11f034  # v0.10.0
        with:
          # action-api-scan v0.11+: target IS the spec file/URL (api_definition removed).
          # The daemon's server URL comes from the spec's servers[] block (localhost:8080).
          target: 'docs/api/openapi.yaml'
          format: openapi
          rules_file_name: '.zap/rules.tsv'
          fail_action: true
          allow_issue_writing: true
          issue_title: 'OWASP ZAP — API scan'

      # ── Pass 3: diagrams.html baseline (separate so its findings
      #            don't get masked by the bigger PWA surface) ─────
      - name: ZAP diagrams.html baseline scan
        uses: zaproxy/action-baseline@6c5a007541891231cd9e0ddec25d4f25c59c9874  # v0.15.0
        with:
          target: "http://${{ inputs.target_host || 'localhost:8080' }}/diagrams.html"
          cmd_options: '-a -j -m 3'
          rules_file_name: '.zap/rules.tsv'
          fail_action: false  # diagrams is largely static; advisory
          allow_issue_writing: true
          issue_title: 'OWASP ZAP — diagrams.html baseline'

      # ── Pass 4: PWA full active scan (v5.26.70) ─────────────────
      # Operator-asked: zap didn't need auth. The daemon runs without a
      # bearer token in this CI flow, so the active scanner can hit every
      # endpoint directly. Active scans send real attack payloads
      # (SQLi, XSS, command-injection probes) — only safe against an
      # ephemeral test daemon.
      - name: ZAP PWA full active scan
        uses: zaproxy/action-full-scan@d479641f7e99facb91d7738171b3448e3f3c7bba  # v0.10.0
        with:
          target: "http://${{ inputs.target_host || 'localhost:8080' }}/"
          cmd_options: '-a -j -m 10'
          fail_action: false  # advisory until the active baseline is set
          allow_issue_writing: true
          issue_title: 'OWASP ZAP — PWA full active scan'

      # ── Pass 5: API full active scan (v5.26.70) ─────────────────
      # OpenAPI-driven active scan. Same payload set as Pass 4 but
      # constrained to /api/ endpoints with the schema's parameter
      # types — fewer false positives on JSON-typed bodies.
      - name: ZAP API full active scan
        uses: zaproxy/action-api-scan@bd24b11e76da11ab60302c8ae87f091cbb11f034  # v0.10.0
        with:
          target: 'docs/api/openapi.yaml'
          format: openapi
          # -t turns active rules on (api-scan defaults to passive).
          cmd_options: '-a -j -m 10 -t'
          fail_action: false
          allow_issue_writing: true
          issue_title: 'OWASP ZAP — API full active scan'

      - name: Stop daemon
        if: always()
        run: |
          kill "${DW_PID:-0}" 2>/dev/null || true
          cat /tmp/dw-daemon.log 2>/dev/null | tail -20 || true

      # ── Upload ZAP HTML reports as artifacts ─────────────────────
      # ZAP actions write reports to the workspace root. Collect and
      # upload so they're accessible from the Actions run and, for
      # release-triggered runs, we can attach them to the release.
      - name: Upload ZAP reports artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        if: always()
        with:
          name: owasp-zap-reports
          path: |
            report_pwa-baseline.html
            report_api-scan.html
            report_diagrams-scan.html
            report_pwa-active.html
            report_api-active.html
            zap*.json
          retention-days: 90

      # ── Attach reports to GitHub release (release-triggered runs) ─
      - name: Resolve release tag from triggering workflow
        id: release_tag
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TAG=$(gh api "repos/$REPO/git/refs/tags?per_page=30" --jq '.[].ref | ltrimstr("refs/tags/")' 2>/dev/null | \
          while read t; do
            OBJ=$(gh api "repos/$REPO/git/ref/tags/$t" --jq '[.object.type, .object.sha] | @tsv' 2>/dev/null || continue)
            OBJ_TYPE=$(echo "$OBJ" | cut -f1)
            OBJ_SHA=$(echo "$OBJ" | cut -f2)
            if [[ "$OBJ_TYPE" == "tag" ]]; then
              COMMIT_SHA=$(gh api "repos/$REPO/git/tags/$OBJ_SHA" --jq '.object.sha' 2>/dev/null || echo "")
            else
              COMMIT_SHA="$OBJ_SHA"
            fi
            if [[ "$COMMIT_SHA" == "$SHA" ]]; then echo "$t"; fi
          done | head -1)
          echo "tag=${TAG:-}" >> "$GITHUB_OUTPUT"

      - name: Attach ZAP reports to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        if: github.event_name == 'workflow_run' && steps.release_tag.outputs.tag != ''
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            report_pwa-baseline.html
            report_api-scan.html
          fail_on_unmatched_files: false
