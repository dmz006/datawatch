# v5.26.58 — operator-asked CI parity with datawatch-app: secret
# scanning. gitleaks scans the repo on every PR + scheduled weekly
# pass on main. Baseline is `clean` — any net-new committed secret
# fails the workflow.
#
# BL398/GH#197 (2026-10-08): switched from gitleaks/gitleaks-action to
# the plain CLI binary and made the scan BLOCKING. The Action wrapper
# enforces a GITLEAKS_LICENSE check via the GitHub API; on rate-limit
# (or a repo without a paid tier) that check itself fails and the Action
# treats it as an error indistinguishable from a real secret finding —
# that's why this was continue-on-error before. The CLI has no license
# requirement, so a failure here now only ever means gitleaks actually
# found something.
#
# Action SHAs pinned per the v5.26.38 fleet-wide convention.

name: secret-scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly Monday 03:17 UTC (off-peak, doesn't collide with the
    # tag-push containers workflow).
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          # gitleaks needs the full history to scan past commits on
          # scheduled / push runs. PR runs only need the diff.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL --retry 5 --retry-delay 10 \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks
      - name: Run gitleaks (blocking)
        run: gitleaks detect --source . --redact --exit-code 1
