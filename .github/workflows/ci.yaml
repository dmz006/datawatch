name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test + lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          # check-version-bump.sh needs HEAD^ to exist; the default
          # shallow (depth 1) checkout only has the triggering commit.
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version-file: go.mod
          cache: true

      # Generate the docs BM25 index so //go:embed is satisfied
      - name: sync-docs + docs-index
        run: |
          mkdir -p internal/docsindex/assets
          echo '{}' > internal/docsindex/assets/docs-bm25-index.json
          make sync-docs docs-index

      # 2026-10-07 — catches a range reusing the version its base
      # already had (found by a compliance audit: commit 71397878
      # shipped real changes with no bump). Runs on every push/PR, not
      # just at release time, so it's caught immediately. Now
      # range-based: compares the range from the push base (passed as
      # github.event.before; the script falls back to CHECK_VERSION_BASE,
      # PR merge base, or the default branch merge base when it's empty
      # or the all-zeros sha) through head, and passes when the range's
      # head version is numerically newer than the base version — so a
      # push that ends on a non-bumping PRD task commit is no longer a
      # false negative. fetch-depth: 0 above is required because the
      # base sha (and merge base) must exist in the local object store.
      - name: version bump check
        run: bash scripts/check-version-bump.sh "${{ github.event.before }}"

      # 2026-10-07 — internal-ref leak audit, promoted from release-time
      # only to every push/PR for earlier feedback.
      - name: internal-ref leak check
        run: bash scripts/check-no-internal-refs.sh

      # Unscoped `tmux kill-server` / `kill-session -a` audit.
      - name: unscoped tmux kill check
        run: bash scripts/check-no-unscoped-tmux.sh

      # 2026-10-09 — a Dockerfile's exact-pinned ARG GO_VERSION can fall
      # behind go.mod's `go` directive without anything catching it until
      # the actual release workflow runs a container build against a
      # pushed tag (v9.0.0: Dockerfile.agent-base's GO_VERSION=1.26.6 vs.
      # go.mod's `go 1.26.9` was the directive then — go mod download
      # failed, cascading into 6 skipped agent-* images). Every push/PR,
      # not just release time.
      - name: dockerfile GO_VERSION drift check
        run: bash scripts/check-dockerfile-go-versions.sh

      - name: go toolchain pin floor check
        run: bash scripts/check-go-toolchain-pins.sh && bash scripts/check-go-toolchain-pins.sh --self-test

      - name: dockerfile certifi floor check
        run: bash scripts/check-dockerfile-certifi.sh && bash scripts/check-dockerfile-certifi.sh --self-test

      - name: go test
        run: go test ./... -count=1 -timeout 12m

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m
          # The action's default cache key isn't branch/commit-scoped, so
          # concurrent pushes/PRs race on the same restore+save slot.
          # Observed repeatedly this session: a corrupted restore produces
          # spurious SA5011 (staticcheck) false positives on files the
          # triggering commit never touched (internal/agents/*_test.go),
          # confirmed 0 issues locally every time with the same
          # golangci-lint version. Disabling the cache trades a little
          # run time for eliminating this flake class entirely.
          skip-cache: true

      - name: build (compile check)
        run: make build
        env:
          # Stamp CI build number into the binary version for traceability
          # e.g. 7.2.2-build0 in code → 7.2.2-build42 in CI artifact
          BUILD_NUMBER: ${{ github.run_number }}

  build-stamp:
    name: stamp build number
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: sync-docs + docs-index
        run: |
          mkdir -p internal/docsindex/assets
          echo '{}' > internal/docsindex/assets/docs-bm25-index.json
          make sync-docs docs-index

      - name: build with stamped version
        run: |
          # Replace -build0 suffix with the real run number for this artifact
          BASE_VER=$(grep 'var Version' cmd/datawatch/main.go | sed 's/.*"\(.*\)".*/\1/' | sed 's/-build[0-9]*//')
          STAMPED="${BASE_VER}-build${{ github.run_number }}"
          go build \
            -ldflags="-X main.Version=${STAMPED} -X github.com/dmz006/datawatch/internal/server.Version=${STAMPED}" \
            -o bin/datawatch-linux-amd64-${STAMPED} \
            ./cmd/datawatch/
          echo "Built: bin/datawatch-linux-amd64-${STAMPED}"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: datawatch-build-${{ github.run_number }}
          path: bin/datawatch-linux-amd64-*
          retention-days: 14
