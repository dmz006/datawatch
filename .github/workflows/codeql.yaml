# Advanced CodeQL setup. Replaces the repository default setup, which must be
# disabled in Settings > Code security before this workflow can upload
# (the two cannot both upload the same category).
#
#   - analyze (BLOCKING) — one job per language, each with a unique category
#     and `upload: always` so results reach code scanning even when the
#     queries report findings.
#   - alert-gate (BLOCKING) — after every upload has been processed, lists
#     open alerts at severity high or critical for this ref and fails with the
#     counts. Only alerts in state "open" count, so any alert dismissed in
#     code scanning is excluded. The gate does not read
#     security/accepted-risks.yml; that registry documents the reason for each
#     dismissal, which the operator applies in GitHub.
#
# Concurrency is keyed on the ref so two runs on the same commit cannot upload
# the same category at once.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: always

  alert-gate:
    name: Open high/critical alerts
    needs: analyze
    if: always() && needs.analyze.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: read
      contents: read
    steps:
      - name: Fail on open high or critical alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          alerts=$(gh api --paginate \
            "repos/${REPO}/code-scanning/alerts?state=open&ref=${REF}&per_page=100" \
            --jq '.[] | select(.rule.security_severity_level == "high" or .rule.security_severity_level == "critical") | [.rule.security_severity_level, .number, .rule.id, .most_recent_instance.location.path] | @tsv')
          if [ -z "$alerts" ]; then
            echo "No open high or critical code-scanning alerts on ${REF}."
            exit 0
          fi
          crit=$(printf "%s\n" "$alerts" | grep -c "^critical" || true)
          high=$(printf "%s\n" "$alerts" | grep -c "^high" || true)
          echo "::error title=Open code-scanning alerts::${crit} critical and ${high} high alerts are open on ${REF}. Fix them or dismiss with a registered reason in security/accepted-risks.yml."
          printf "%s\n" "$alerts" | sort
          exit 1
