# v5.26.29 — automate the AGENT.md "Pre-release security scan" rule.
#
# Operator runs this locally before tagging; v5.26.29 mirrors the same
# command into CI so the scan can't be forgotten. Two jobs:
#
#   - govulncheck (BLOCKING) — fails on any reachable Go vulnerability.
#     The historical pass rate is 100% since v5.26.3 closed the two
#     transitive flags (GO-2026-4503 + GO-2026-4559); a regression here
#     is genuinely actionable.
#
#   - gosec (BLOCKING, baseline-diff) — runs with the existing
#     `.gosec-exclude` rule list. Live finding count is compared
#     against `.gosec-baseline.json`; CI fails on net-new findings.
#     Documented accepted set lives in `docs/security-review.md`.
#     v5.26.40 made this blocking after the baseline mechanism
#     landed (was advisory pre-v5.26.40).
#
# Triggers on PRs to main (catch new findings before they land), direct
# pushes to main (SEC-026, 2026-10-08 — a PR-only trigger left ~5 months
# of direct-to-main commits completely unscanned until the next release
# tag happened to run release.yaml's own gosec/govulncheck step), and
# manual dispatch (for spot checks). Tag-push trigger stays removed —
# release.yaml already runs govulncheck + gosec before goreleaser.
#
#   - govulncheck-latest-advisory (NON-BLOCKING, GH#201/BL399
#     2026-10-09) — the same scan against Go's latest "stable" release
#     instead of the pinned one above, so an upgrade that would fix (or
#     newly flag) something is visible without making every push to
#     main hostage to whatever Go shipped that morning.
#
#   - security-registry (BLOCKING, schema-only) — validates
#     security/accepted-risks.yml against the shared datawatch/
#     datawatch-app acceptance standard (GH#197) with
#     scripts/check_accepted_risks.py, and fails if .trivyignore or
#     docs/security-review.md's generated table has drifted from the
#     registry (scripts/gen_trivyignore.py, diffed against HEAD).
#     Does NOT fail on an expired entry — that's the daily watch's job
#     (.github/workflows/image-refresh.yaml), not this gate's; see
#     check_accepted_risks.py's own docstring for why.

name: security-scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    # GH#201/BL399 (2026-10-09) — was `go-version: stable`, which installs
    # whatever Go release is newest AT CI-RUN TIME, not the version this
    # repo actually ships with (go.mod's 1.26.6, same as ci.yaml's build
    # job). That meant a brand-new upstream Go release landing with a
    # freshly-disclosed CVE broke this gate on the very next push to
    # main, for every commit, regardless of whether that commit changed
    # anything — happened literally the push after this comment was
    # written (go1.27.1 flagged, fixed in go1.27.2, zero datawatch code
    # involved in any flagged call chain). Pinned to go.mod's version so
    # this job checks what we actually ship, not a moving target; see
    # the advisory job below for the "should we upgrade" signal this
    # pin alone would otherwise lose.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck against the shipped Go version (blocking)
        run: $(go env GOPATH)/bin/govulncheck ./...

  govulncheck-latest-advisory:
    # GH#201/BL399 (2026-10-09) — the "should we upgrade Go" signal the
    # pinned job above deliberately no longer provides as a blocker.
    # Runs the identical scan against whatever Go is newest today;
    # continue-on-error so a new upstream release — or its CVEs — never
    # blocks CI, but still shows up as a visibly failed (non-blocking)
    # step for the operator to actually look at, not silently discarded.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: stable
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck against latest-stable Go (advisory, non-blocking)
        run: $(go env GOPATH)/bin/govulncheck ./...

  gosec:
    runs-on: ubuntu-latest
    # v5.26.40 — baseline-diff gate. Job is BLOCKING on net-new
    # findings (continue-on-error removed). Total finding count is
    # compared against .gosec-baseline.json; CI fails when the live
    # count exceeds the baseline. See docs/security-review.md for
    # the documented set of accepted findings; bump the baseline
    # file deliberately when a new finding is reviewed and accepted.
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: stable
          cache: true
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run gosec + baseline-diff
        # Mirror the AGENT.md command shape so local operator runs and
        # CI runs produce identical output. .gosec-exclude carries the
        # global rule suppressions (currently just G104).
        run: |
          set +e
          EXCLUDE=$(grep -v '^#' .gosec-exclude | tr '\n' ',' | sed 's/,$//')
          $(go env GOPATH)/bin/gosec -exclude="$EXCLUDE" -exclude-dir=.claude -severity=high -confidence=medium -fmt=json -quiet ./... > /tmp/gosec.json
          set -e
          python3 - <<'PY'
          import json, sys
          from collections import Counter
          live = json.load(open("/tmp/gosec.json"))
          base = json.load(open(".gosec-baseline.json"))
          live_issues = live.get("Issues", [])
          live_n = len(live_issues)
          base_n = base["total"]
          live_by = Counter(i["rule_id"] for i in live_issues)
          base_by = base.get("by_rule", {})
          print(f"gosec: live={live_n}  baseline={base_n}")
          for rule in sorted(set(live_by) | set(base_by)):
              l = live_by.get(rule, 0)
              b = base_by.get(rule, 0)
              flag = "" if l == b else (f"  (+{l-b})" if l > b else f"  (-{b-l})")
              print(f"  {rule:6s}  live={l:3d}  baseline={b:3d}{flag}")
          if live_n > base_n:
              print(f"::error::gosec: {live_n - base_n} net-new findings exceed baseline {base_n}. Review them and either fix or bump .gosec-baseline.json with rationale in docs/security-review.md.")
              sys.exit(1)
          if live_n < base_n:
              print(f"::notice::gosec: live count {live_n} BELOW baseline {base_n}. Once stable, lower the baseline so regressions get caught at the new lower bar.")
          PY

  security-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml
      - name: Validate security/accepted-risks.yml (blocking on schema, advisory ESCALATE lines)
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          python3 scripts/check_accepted_risks.py --base "$BASE_REF"
      - name: Regenerate .trivyignore + docs/security-review.md and diff against committed output
        run: |
          python3 scripts/gen_trivyignore.py
          if ! git diff --exit-code .trivyignore docs/security-review.md; then
            echo "::error::.trivyignore or docs/security-review.md is out of sync with security/accepted-risks.yml. Run 'python3 scripts/gen_trivyignore.py' and commit the result."
            exit 1
          fi
