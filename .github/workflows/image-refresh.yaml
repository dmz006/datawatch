# Daily container image refresh.
#
# Released images are built once, at release time, so OS-package and base-image
# fixes published afterwards never reach them. This workflow runs daily:
#
#   1. plan   — resolve the latest published release, scan its published images
#               with the same blocking Trivy policy the release uses. A rebuild
#               is triggered when any image fails that scan, an image is missing,
#               it is Monday (weekly baseline refresh), or a manual run forces it.
#   2. base   — rebuild agent-base / validator / stats-cluster from the release
#               tag's source with no cache and freshly pulled bases, push to a
#               staging tag, scan it (blocking), and only then promote it to the
#               release version tag and :latest.
#   3. agents — same for the agent-* images and parent-full, layered on the
#               freshly promoted agent-base.
#
# A failing scan never replaces a published image: the staging tag is simply
# left for ghcr-cleanup to prune. The workflow run then fails, which emails the
# owner. Build recipes (docker/dockerfiles) and .trivyignore are taken from main
# so recipe and policy fixes reach released versions; the datawatch source built
# into agent-base is always the release tag's.
#
# See docs/howto/container-image-refresh.md.

name: image-refresh

on:
  schedule:
    - cron: '30 5 * * *'   # daily 05:30 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if published images scan clean'
        required: false
        default: 'false'
      version:
        description: 'Release version to refresh (e.g. 8.34.1); default = latest release'
        required: false
        default: ''

concurrency:
  group: image-refresh
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  TRIVY_VERSION: v0.73.0

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
      rebuild: ${{ steps.decide.outputs.rebuild }}
      stamp: ${{ steps.decide.outputs.stamp }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: main
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve release version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          v="${INPUT_VERSION:-}"
          if [[ -z "$v" ]]; then
            v="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          fi
          v="${v#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Refreshing images for release $v"
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | \
            sh -s -- -b /usr/local/bin "$TRIVY_VERSION"
      - name: Decide whether to rebuild
        id: decide
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -uo pipefail
          echo "stamp=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          reason=""
          if [[ "${FORCE:-false}" == "true" ]]; then reason="forced"; fi
          if [[ -z "$reason" && "$(date -u +%u)" == "1" ]]; then reason="weekly baseline refresh"; fi
          if [[ -z "$reason" ]]; then
            for name in agent-base validator stats-cluster agent-claude agent-opencode agent-aider agent-gemini agent-goose parent-full; do
              img="ghcr.io/dmz006/datawatch-$name:$VERSION"
              if ! trivy image --quiet --severity HIGH,CRITICAL --ignorefile .trivyignore --exit-code 1 --format table "$img" > /tmp/scan-$name.txt 2>&1; then
                reason="$name has HIGH/CRITICAL findings or is missing"
                cat /tmp/scan-$name.txt | tail -40
                break
              fi
            done
          fi
          if [[ -n "$reason" ]]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            echo "::notice::Rebuilding images for $VERSION: $reason"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "reason=all published images scan clean" >> "$GITHUB_OUTPUT"
            echo "::notice::No rebuild needed for $VERSION: all published images scan clean"
          fi

  base:
    name: refresh / ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-base
            file: docker/dockerfiles/Dockerfile.agent-base
          - name: validator
            file: docker/dockerfiles/Dockerfile.validator
          - name: stats-cluster
            file: docker/dockerfiles/Dockerfile.stats-cluster
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: v${{ needs.plan.outputs.version }}
          fetch-depth: 0
      - name: Overlay build recipes and scan policy from main
        run: |
          git fetch --no-tags origin main
          git checkout origin/main -- docker/dockerfiles .trivyignore
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push ${{ matrix.name }} (staging tag)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.plan.outputs.version }}
          no-cache: true
          pull: true
          tags: ghcr.io/dmz006/datawatch-${{ matrix.name }}:refresh-${{ needs.plan.outputs.stamp }}
          push: true
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | \
            sh -s -- -b /usr/local/bin "$TRIVY_VERSION"
      - name: Scan ${{ matrix.name }} staging image (blocking)
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignorefile .trivyignore \
            --exit-code 1 \
            --format table \
            ghcr.io/dmz006/datawatch-${{ matrix.name }}:refresh-${{ needs.plan.outputs.stamp }}
      - name: Promote ${{ matrix.name }} to release tag and latest
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          STAMP: ${{ needs.plan.outputs.stamp }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          src="ghcr.io/dmz006/datawatch-$NAME:refresh-$STAMP"
          args=(-t "ghcr.io/dmz006/datawatch-$NAME:$VERSION" -t "ghcr.io/dmz006/datawatch-$NAME:latest")
          if [[ "$NAME" == "agent-base" ]]; then
            # Slash-namespaced path used as FROM by the agent-* images.
            args+=(-t "ghcr.io/dmz006/datawatch/agent-base:$VERSION" -t "ghcr.io/dmz006/datawatch/agent-base:latest")
          fi
          docker buildx imagetools create "${args[@]}" "$src"

  recheck-ignored-cves:
    # Catches the scenario image-refresh's own "rebuild" decision can't: a
    # .trivyignore entry whose CVE has since been fixed upstream, but whose
    # PUBLISHED image still scans clean today because the scan is always run
    # *with* --ignorefile. That comparison can never reveal a stale
    # suppression on its own.
    #
    # v2 (2026-10-03): the original version of this job scanned a synthetic
    # `FROM bitnami/minideb:bookworm` + upgrade image that never installed
    # any of the packages the real suppressions are actually about (gawk,
    # curl, rsync, python3.11, perl, ...) — every suppressed CVE scored as
    # "stale" by construction, a 100%-false-positive bug (see GH#163). Fixed
    # by rebuilding and scanning every REAL shipped image fresh (--no-cache
    # --pull, same Dockerfiles the base/agents jobs below ship), unioned
    # together — a CVE only counts as truly fixed if it's gone from all of
    # them. Single-arch (linux/amd64) is enough: Debian package advisories
    # don't vary by CPU arch, and this just needs to know which package
    # versions landed, not produce a shippable multi-arch image.
    #
    # When it finds genuinely-stale entries, it removes them (scripts/
    # apply-stale-cve-removal.py), bumps the patch version, adds a CHANGELOG
    # entry, and opens a PR — never pushes straight to main. The PR is the
    # approval gate: a normal GitHub PR notification, review the diff,
    # merge. Merging auto-tags (see cve-patch-release.yaml), which triggers
    # the normal release.yaml pipeline exactly like any manual tag push.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: plan
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: main
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | \
            sh -s -- -b /usr/local/bin "$TRIVY_VERSION"
      - name: Build + scan every real shipped image fresh, without .trivyignore
        id: scan
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          STAMP: cve-recheck-${{ github.run_id }}
        run: |
          set -uo pipefail  # no -e: a single image failing to build/scan must not abort the rest
          : > /tmp/all-vulnerable.txt

          extract_ids() {
            python3 -c "
          import json, sys
          try:
              d = json.load(open(sys.argv[1]))
          except Exception as e:
              print('EXTRACT_FAILED: ' + repr(e), file=sys.stderr)
              sys.exit(0)
          ids = set()
          for res in d.get('Results', []) or []:
              for v in res.get('Vulnerabilities', []) or []:
                  ids.add(v['VulnerabilityID'])
          print(f'DEBUG: {sys.argv[1]}: {len(d.get(\"Results\") or [])} result group(s), {len(ids)} unique vuln ID(s)', file=sys.stderr)
          print('\n'.join(sorted(ids)))
          " "$1"
          }

          # Phase 1 — images with no in-repo base dependency.
          for pair in "agent-base:docker/dockerfiles/Dockerfile.agent-base" \
                      "validator:docker/dockerfiles/Dockerfile.validator" \
                      "stats-cluster:docker/dockerfiles/Dockerfile.stats-cluster"; do
            name="${pair%%:*}"; file="${pair#*:}"
            img="ghcr.io/dmz006/datawatch-${name}:${STAMP}"
            echo "::group::build ${name}"
            if docker buildx build --no-cache --pull --platform linux/amd64 \
                 --build-arg VERSION="$VERSION" -f "$file" -t "$img" --push .; then
              if [[ "$name" == "agent-base" ]]; then
                # agent-* Dockerfiles FROM ${REGISTRY}/agent-base:${BASE_TAG} (slash path).
                docker buildx imagetools create -t "ghcr.io/dmz006/datawatch/agent-base:${STAMP}" "$img"
              fi
              trivy image --severity HIGH,CRITICAL --ignorefile /dev/null --format json -o "/tmp/scan-${name}.json" "$img" || true
              extract_ids "/tmp/scan-${name}.json" >> /tmp/all-vulnerable.txt
            else
              echo "::warning::build failed for ${name} — skipping its scan this run"
            fi
            echo "::endgroup::"
          done

          # Phase 2 — images that build FROM the throwaway agent-base above.
          for pair in "agent-claude:docker/dockerfiles/Dockerfile.agent-claude" \
                      "agent-opencode:docker/dockerfiles/Dockerfile.agent-opencode" \
                      "agent-aider:docker/dockerfiles/Dockerfile.agent-aider" \
                      "agent-gemini:docker/dockerfiles/Dockerfile.agent-gemini" \
                      "agent-goose:docker/dockerfiles/Dockerfile.agent-goose" \
                      "parent-full:docker/dockerfiles/Dockerfile.parent-full"; do
            name="${pair%%:*}"; file="${pair#*:}"
            img="ghcr.io/dmz006/datawatch-${name}:${STAMP}"
            echo "::group::build ${name}"
            if docker buildx build --no-cache --pull --platform linux/amd64 \
                 --build-arg VERSION="$VERSION" \
                 --build-arg REGISTRY=ghcr.io/dmz006/datawatch \
                 --build-arg BASE_TAG="${STAMP}" \
                 -f "$file" -t "$img" --push .; then
              trivy image --severity HIGH,CRITICAL --ignorefile /dev/null --format json -o "/tmp/scan-${name}.json" "$img" || true
              extract_ids "/tmp/scan-${name}.json" >> /tmp/all-vulnerable.txt
            else
              echo "::warning::build failed for ${name} — skipping its scan this run"
            fi
            echo "::endgroup::"
          done

          sort -u -o /tmp/all-vulnerable.txt /tmp/all-vulnerable.txt
          echo "scanned_count=$(ls /tmp/scan-*.json 2>/dev/null | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Delete every throwaway recheck image
        # None of the ghcr.io/dmz006/datawatch{,-*} CVE-recheck tags are real
        # product artifacts — not in ghcr-cleanup.yaml's known-package
        # matrix, so this job cleans up after itself. Runs even if an
        # earlier build/scan step failed.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          TAG: cve-recheck-${{ github.run_id }}
        run: |
          set -uo pipefail
          for pkg in datawatch-agent-base datawatch-validator datawatch-stats-cluster \
                     datawatch-agent-claude datawatch-agent-opencode datawatch-agent-aider \
                     datawatch-agent-gemini datawatch-agent-goose datawatch-parent-full \
                     "agent-base"; do
            versions=$(gh api "/users/$OWNER/packages/container/$pkg/versions" --paginate 2>/dev/null \
              || gh api "/orgs/$OWNER/packages/container/$pkg/versions" --paginate 2>/dev/null \
              || echo '[]')
            vid=$(echo "$versions" | jq -r --arg tag "$TAG" '.[] | select(((.metadata.container.tags // []) | index($tag)) != null) | .id' | head -1)
            if [[ -n "$vid" ]]; then
              gh api -X DELETE "/users/$OWNER/packages/container/$pkg/versions/$vid" 2>/dev/null \
                || gh api -X DELETE "/orgs/$OWNER/packages/container/$pkg/versions/$vid" 2>/dev/null \
                || echo "::warning::failed to delete $pkg:$TAG"
            fi
          done

      - name: Diff .trivyignore against the unioned fresh scans
        id: diff
        run: |
          set -euo pipefail
          grep -oE '^CVE-[0-9]+-[0-9]+$' .trivyignore | sort -u > /tmp/suppressed.txt
          comm -23 /tmp/suppressed.txt /tmp/all-vulnerable.txt > /tmp/stale.txt || true
          count=$(wc -l < /tmp/stale.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "images scanned this run: ${{ steps.scan.outputs.scanned_count }} / 9"
          echo "--- suppressed ---"; cat /tmp/suppressed.txt
          echo "--- still vulnerable across all real images (fresh, unsuppressed) ---"; cat /tmp/all-vulnerable.txt
          echo "--- stale (fix now available in every real image, safe to remove) ---"; cat /tmp/stale.txt

      - name: Open a PR removing the now-stale suppressions
        if: steps.diff.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "datawatch-bot"
          git config user.email "actions@users.noreply.github.com"

          python3 scripts/apply-stale-cve-removal.py .trivyignore /tmp/stale.txt > /tmp/pr-cve-body.md
          if ! git diff --quiet .trivyignore; then
            NEW_VERSION=$(python3 -c "
          v = '$OLD_VERSION'.split('.')
          v[-1] = str(int(v[-1]) + 1)
          print('.'.join(v))
          ")
            sed -i "s/var Version = \"$OLD_VERSION\"/var Version = \"$NEW_VERSION\"/" \
              cmd/datawatch/main.go internal/server/api.go

            STALE_COUNT=$(wc -l < /tmp/stale.txt | tr -d ' ')
            printf -v changelog_entry '## v%s — fix(security): remove stale CVE suppressions now fixed upstream\n\n### Fixed\n- **Removed %s .trivyignore suppression(s) with a fix now available in Debian bookworm** — found by the daily `image-refresh` recheck, which rebuilds every shipped image fresh and scans without `.trivyignore` applied. See the PR for exactly which CVEs and which images.\n' \
              "$NEW_VERSION" "$STALE_COUNT"
            python3 -c "
          import sys
          entry = sys.argv[1]
          path = 'CHANGELOG.md'
          with open(path) as f:
              content = f.read()
          marker = '## [Unreleased]\n'
          idx = content.index(marker) + len(marker)
          content = content[:idx] + '\n' + entry + '\n' + content[idx:]
          with open(path, 'w') as f:
              f.write(content)
          " "$changelog_entry"

            BRANCH="auto/cve-cleanup-$(date -u +%Y%m%d)"
            git checkout -b "$BRANCH"
            git add .trivyignore cmd/datawatch/main.go internal/server/api.go CHANGELOG.md
            git commit -m "fix(security): remove stale CVE suppressions now fixed upstream

          Found by the daily image-refresh recheck-ignored-cves job: these
          suppressions no longer appear in a fresh, unsuppressed scan of every
          real shipped image. Patch version bump per this repo's versioning
          convention (fix, no feature/behavior change)."

            {
              echo "Opened automatically by \`image-refresh.yaml\`'s \`recheck-ignored-cves\` job."
              echo
              echo "Every image this repo ships (agent-base, validator, stats-cluster, each"
              echo "agent-*, parent-full) was rebuilt fresh (\`--no-cache --pull\`) and scanned"
              echo "**without** \`.trivyignore\` applied. The CVEs below are suppressed in"
              echo "\`.trivyignore\` but did not appear in ANY of those fresh scans — a fix is"
              echo "now available upstream for all of them."
              echo
              cat /tmp/pr-cve-body.md
              echo "---"
              echo "Bumped \`$OLD_VERSION\` → \`$NEW_VERSION\` (patch — fix only, no feature/behavior"
              echo "change) and added a CHANGELOG entry. **Merging this PR auto-tags \`v$NEW_VERSION\`**"
              echo "(see \`cve-patch-release.yaml\`), which triggers the normal release pipeline."
              echo
              echo "Please skim the diff before merging — in particular any \"partially trimmed\""
              echo "block above, where the suppression comment's prose may now overstate the"
              echo "remaining CVE count and could use a tidy-up (not required to merge safely,"
              echo "just a readability nit)."
            } > /tmp/pr-full-body.md

            git push origin "$BRANCH"
            gh pr create --title "fix(security): remove $(wc -l < /tmp/stale.txt | tr -d ' ') stale CVE suppression(s) — v$NEW_VERSION" \
              --body-file /tmp/pr-full-body.md \
              --label security \
              --reviewer "${{ github.repository_owner }}"
          fi

      - name: File or update tracking issue (always — audit trail even when nothing is stale)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="chore: stale .trivyignore suppressions ready to remove"
          body_file=/tmp/issue-body.md
          {
            if [[ "${{ steps.diff.outputs.count }}" == "0" ]]; then
              echo "No stale suppressions found as of this run — every currently-suppressed"
              echo "CVE still reproduces on a fresh, unsuppressed scan of at least one real"
              echo "shipped image."
            else
              echo "A PR removing these was opened automatically: see the linked PR above"
              echo "(or search \`is:pr auto/cve-cleanup\` if this comment predates it)."
              echo
              echo "**Stale CVE IDs (this run):**"
              echo
              while read -r cve; do echo "- \`$cve\`"; done < /tmp/stale.txt
            fi
            echo
            echo "_Last checked: $(date -u +%Y-%m-%dT%H:%M:%SZ) — run ${{ github.run_id }},"
            echo "${{ steps.scan.outputs.scanned_count }}/9 real images scanned successfully._"
          } > "$body_file"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --search "in:title \"$title\"" --state open --json number -q '.[0].number' || true)
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body_file" --label "security"
          fi

  agents:
    name: refresh / ${{ matrix.name }}
    needs: [plan, base]
    if: needs.plan.outputs.rebuild == 'true' && needs.base.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-claude
            file: docker/dockerfiles/Dockerfile.agent-claude
          - name: agent-opencode
            file: docker/dockerfiles/Dockerfile.agent-opencode
          - name: agent-aider
            file: docker/dockerfiles/Dockerfile.agent-aider
          - name: agent-gemini
            file: docker/dockerfiles/Dockerfile.agent-gemini
          - name: agent-goose
            file: docker/dockerfiles/Dockerfile.agent-goose
          - name: parent-full
            file: docker/dockerfiles/Dockerfile.parent-full
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: v${{ needs.plan.outputs.version }}
          fetch-depth: 0
      - name: Overlay build recipes and scan policy from main
        run: |
          git fetch --no-tags origin main
          git checkout origin/main -- docker/dockerfiles .trivyignore
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push ${{ matrix.name }} (staging tag)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.plan.outputs.version }}
            REGISTRY=ghcr.io/dmz006/datawatch
            BASE_TAG=${{ needs.plan.outputs.version }}
          no-cache: true
          pull: true
          tags: ghcr.io/dmz006/datawatch-${{ matrix.name }}:refresh-${{ needs.plan.outputs.stamp }}
          push: true
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | \
            sh -s -- -b /usr/local/bin "$TRIVY_VERSION"
      - name: Scan ${{ matrix.name }} staging image (blocking)
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignorefile .trivyignore \
            --exit-code 1 \
            --format table \
            ghcr.io/dmz006/datawatch-${{ matrix.name }}:refresh-${{ needs.plan.outputs.stamp }}
      - name: Promote ${{ matrix.name }} to release tag and latest
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          STAMP: ${{ needs.plan.outputs.stamp }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "ghcr.io/dmz006/datawatch-$NAME:$VERSION" \
            -t "ghcr.io/dmz006/datawatch-$NAME:latest" \
            "ghcr.io/dmz006/datawatch-$NAME:refresh-$STAMP"
