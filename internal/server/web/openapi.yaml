openapi: 3.0.3
info:
  title: Datawatch API
  description: |
    REST and WebSocket API for the datawatch daemon.

    ## Authentication
    If a token is configured, pass it as:
    - `Authorization: Bearer <token>` header, OR
    - `?token=<token>` query parameter

    ## Network Access
    The API is designed to be accessed over Tailscale (encrypted overlay network).
    TLS is optional — Tailscale provides transport encryption.

    ## Response compression
    `/api/*` responses carry `Vary: Accept-Encoding`. With
    `server.api_gzip` on (default), a JSON / text / YAML response larger
    than `server.api_gzip_min_bytes` (default 1024) is sent with
    `Content-Encoding: gzip` when the request sends
    `Accept-Encoding: gzip`. Streams, WebSocket upgrades, file downloads
    and `/api/proxy/` paths are never compressed. Advertised as `api.gzip`
    in `/api/info` `capabilities`.
  version: 0.4.0
  license:
    name: Polyform Noncommercial 1.0.0
    url: https://github.com/dmz006/datawatch/blob/main/LICENSE
  contact:
    url: https://github.com/dmz006/datawatch

servers:
  - url: http://localhost:8080
    description: Local development
  - url: http://{tailscale_ip}:8080
    description: Tailscale access
    variables:
      tailscale_ip:
        default: "100.x.x.x"
        description: Your machine's Tailscale IP

security:
  - BearerToken: []
  - QueryToken: []
  - NoAuth: []

paths:
  /api/sessions:
    get:
      summary: List all sessions
      description: Returns all sessions managed by this host, including completed ones.
      operationId: listSessions
      tags: [Sessions]
      parameters:
        - name: name
          in: query
          required: false
          description: Glob filter by session name
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: Filter by session state
          schema:
            type: string
        - name: backend
          in: query
          required: false
          description: >-
            Filter by the session's LLM backend family, and as a backend
            axis shortcut: a
            session matches when its backend family equals the value or it
            carries the backend:<value> tag, so no earlier result is lost
          schema:
            type: string
        - name: alive
          in: query
          required: false
          description: Filter by claude_alive status
          schema:
            type: string
            enum: ["true", "false"]
        - name: tag
          in: query
          required: false
          description: >-
            Keep only the sessions that carry this tag — their own, a system
            tag, or one they inherit from their Automaton; repeat the parameter
            for several (or pass a comma list), combined with tag_match
          schema:
            type: string
        - name: tag_match
          in: query
          required: false
          description: Whether the listed tags must all be present (all) or any of them (any, the default)
          schema:
            type: string
            enum: ["any", "all"]
            default: "any"
        - name: project
          in: query
          required: false
          description: "Axis shortcut - expands to the `project:<value>` tag filter (combines with `tag` under `tag_match`; blank values are ignored)"
          schema:
            type: string
        - name: automaton
          in: query
          required: false
          description: "Axis shortcut - expands to the `automaton:<value>` tag filter"
          schema:
            type: string
        - name: automation
          in: query
          required: false
          description: "Axis shortcut - expands to the `automation:<value>` tag filter"
          schema:
            type: string
        - name: stage
          in: query
          required: false
          description: "Axis shortcut - expands to the `stage:<value>` tag filter"
          schema:
            type: string
        - name: kind
          in: query
          required: false
          description: "Axis shortcut - expands to the `kind:<value>` tag filter"
          schema:
            type: string
        - name: role
          in: query
          required: false
          description: "Axis shortcut - expands to the `role:<value>` tag filter"
          schema:
            type: string
        - name: lane
          in: query
          required: false
          description: "Axis shortcut - expands to the `lane:<value>` tag filter"
          schema:
            type: string
        - name: compute
          in: query
          required: false
          description: "Axis shortcut - expands to the `compute:<value>` tag filter (the compute node the work was placed on)"
          schema:
            type: string
        - name: view
          in: query
          required: false
          description: |
            `summary` returns the compact list: `task`, `prompt_context`,
            `last_response` and `last_summary_long` are cut to
            `server.session_summary_text_chars` characters (ending in `…`)
            and named in each record's `truncated_fields`; only the newest
            `server.session_summary_terminal_limit` terminal sessions
            (complete / failed / killed) are kept, and
            `X-Datawatch-Sessions-Omitted` reports how many were dropped.
            Without `view`, `since` or `states` the response is the
            unchanged, uncapped full list. Advertised as
            `sessions.view_summary` in `/api/info` `capabilities`.
          schema:
            type: string
            enum: [summary]
        - name: limit
          in: query
          required: false
          description: "Page size (1-500). Supplying `limit` or `cursor` implies `view=summary` and returns the paged envelope `{sessions, next_cursor, total}`. Rows are ordered by `updated_at` desc, then `full_id`."
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: cursor
          in: query
          required: false
          description: Opaque `next_cursor` from the previous page. Stable across inserts; no gaps or duplicates.
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Comma list of states to include (`active` expands to every non-terminal state). Implies `view=summary`.
          schema:
            type: string
        - name: active
          in: query
          required: false
          description: "`1` keeps only non-terminal sessions. Implies `view=summary`."
          schema:
            type: string
            enum: ["1"]
        - name: q
          in: query
          required: false
          description: Case-insensitive substring match on name, id, full id and the first 256 characters of the task. Implies `view=summary`.
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          description: ETag from a previous summary or paged response; a match returns 304 with no body. The legacy full array carries no ETag.
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: Only sessions whose `updated_at` is after this time (RFC3339 or unix seconds).
          schema:
            type: string
            example: "2026-10-14T12:00:00Z"
        - name: states
          in: query
          required: false
          description: Comma list of states to include. `active` expands to every non-terminal state.
          schema:
            type: string
            example: "active"
      responses:
        "200":
          description: "Array of sessions. `view=summary` (or any paging/filter parameter) returns row-only summaries (id, full_id, name, state, backend, llm_ref, project_dir, hostname, created_at, updated_at, last_activity, parent_id, est_cost_usd, tokens, scheduled_count, status_line) with no task, output, transcript or prompt context; with `limit`/`cursor` the body is `{sessions, next_cursor, total}` instead of an array. `GET /api/sessions/{id}` returns the full record."
          headers:
            ETag:
              description: Hash of the body (summary and paged responses only).
              schema:
                type: string
            X-Datawatch-Sessions-Total:
              description: Filtered row count (summary and paged responses).
              schema:
                type: integer
            X-Datawatch-Sessions-Omitted:
              description: "`view=summary` only — number of older terminal sessions dropped by the cap. Absent when nothing was dropped."
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/Session"
                    - type: object
                      properties:
                        scheduled_count:
                          type: integer
                          description: Pending schedules for the session (when schedules are enabled).
                        truncated_fields:
                          type: array
                          items:
                            type: string
                          description: "`view=summary` only — fields that were cut. Fetch `/api/sessions/{id}` for the full record."
        "304":
          description: "`If-None-Match` matched the current ETag."
        "400":
          description: Unknown `view`, unparseable `since`, unknown/empty `states` or `status`, bad `limit` or `cursor`.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/output:
    get:
      summary: Get session output
      description: Returns the last N lines of a session's log output.
      operationId: getSessionOutput
      tags: [Sessions]
      parameters:
        - name: id
          in: query
          required: true
          description: Session ID (short 4-char or full hostname-id)
          schema:
            type: string
            example: "a3f2"
        - name: n
          in: query
          required: false
          description: Number of lines to return (default 50)
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Plain text output
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Session not found
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/command:
    post:
      summary: Execute a command
      description: |
        Execute any command using the same syntax as the Signal interface.

        Available commands:
        - `new: <task>` — start a new session
        - `list` — list sessions
        - `status <id>` — get recent output
        - `send <id>: <text>` — send input to waiting session
        - `kill <id>` — terminate session
        - `tail <id> [n]` — last N lines
        - `attach <id>` — get tmux attach command
        - `help` — show help
      operationId: executeCommand
      tags: [Commands]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandRequest"
            examples:
              new_session:
                summary: Start a new session
                value:
                  text: "new: write a fibonacci function in Go"
              list_sessions:
                summary: List sessions
                value:
                  text: "list"
              send_input:
                summary: Send input to waiting session
                value:
                  text: "send a3f2: yes, proceed"
      responses:
        "200":
          description: Command result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        "400":
          description: Bad request
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/link/start:
    post:
      summary: Start Signal device linking
      description: |
        Starts the signal-cli device linking process. Returns a stream ID.
        Use `/api/link/stream?id=<stream_id>` to receive the QR URI via SSE.

        The QR code should be scanned from Signal on your phone:
        Settings → Linked Devices → Link New Device
      operationId: startLinking
      tags: [Setup]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                device_name:
                  type: string
                  description: Name for this linked device
                  example: "hal9000"
      responses:
        "200":
          description: Linking started
          content:
            application/json:
              schema:
                type: object
                properties:
                  stream_id:
                    type: string
                    description: Use this with /api/link/stream
        "409":
          description: Already linked
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/link/stream:
    get:
      summary: Stream linking status via SSE
      description: |
        Server-Sent Events stream for the linking process.
        Events:
        - `qr`: QR URI string (sgnl://...) — render as QR code
        - `linked`: linking complete
        - `error`: error message
      operationId: streamLinking
      tags: [Setup]
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: Stream ID not found
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/link/status:
    get:
      summary: Check linking status
      operationId: getLinkStatus
      tags: [Setup]
      responses:
        "200":
          description: Linking status
          content:
            application/json:
              schema:
                type: object
                properties:
                  linked:
                    type: boolean
                  account_number:
                    type: string
                  device_name:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/backends:
    get:
      summary: List LLM backends
      description: Returns the list of registered LLM backends and which one is active.
      operationId: listBackends
      tags: [System]
      responses:
        "200":
          description: Backend list
          content:
            application/json:
              schema:
                type: object
                properties:
                  llm:
                    type: array
                    items:
                      type: string
                    description: Registered LLM backend names
                    example: ["claude-code", "aider"]
                  active:
                    type: string
                    description: Currently active backend name
                    example: "claude-code"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/files:
    get:
      summary: Browse directory
      description: |
        Returns the contents of a directory for use in the PWA directory picker.
        Entries are sorted: directories first, then files, both alphabetically.
      operationId: listFiles
      tags: [System]
      parameters:
        - name: path
          in: query
          required: false
          description: "Absolute path to browse (default: user home directory)"
          schema:
            type: string
            example: "projects"
      responses:
        "200":
          description: Directory entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                    description: The resolved path that was listed
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        is_dir:
                          type: boolean
                        path:
                          type: string
                          description: Full absolute path (use for next request)
        "400":
          description: Path is not a directory or cannot be read
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Upload a file
      description: |
        Upload a file to the server's file-service root (multipart/form-data).
        The `path` field sets the destination path relative to the file-service root.
        Requires `CapConfigWrite` federation capability.
        Used by the PWA and Android app for image attachment in the session input bar.
      operationId: uploadFile
      tags: [System]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, path]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload (image, document, etc.)
                path:
                  type: string
                  description: Destination filename (relative or absolute within file-service root)
                  example: "dw_attach_1234567890_photo.jpg"
      responses:
        "200":
          description: File uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                    description: Absolute server path of the uploaded file
                  bytes:
                    type: integer
                    description: Number of bytes written
        "400":
          description: Missing file or path field, or parse error
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Path traversal outside file-service root
    delete:
      summary: Delete a file
      description: |
        Delete a file from the server filesystem.
        Requires `CapConfigWrite` federation capability.
        Body: JSON `{"path": "<absolute-path>"}`.
      operationId: deleteFile
      tags: [System]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: Absolute path of the file to delete
      responses:
        "200":
          description: File deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: string
                    description: Path of the deleted file
        "400":
          description: Missing or empty path
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Path traversal outside file-service root
        "404":
          description: File not found

  /api/sessions/start:
    post:
      summary: Start a new session
      description: |
        Start a new AI coding session with optional name, project directory, and backend override.
        This endpoint provides more control than the command-based `/api/command` endpoint.
      operationId: startSession
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSessionRequest"
            examples:
              basic:
                summary: Basic session
                value:
                  task: "refactor the auth module"
              named:
                summary: Named session with backend
                value:
                  task: "refactor the auth module"
                  name: "auth refactor"
                  project_dir: "projects/myapp"
                  backend: "aider"
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Bad request (missing task, backend not found, an unknown `launch_role` or `launch_kind`, etc.). A refused launch field returns 400 and the session is not started.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/sessions/restart:
    post:
      summary: Restart a session in-place
      description: |
        Restart a completed, failed, or killed session using the same session ID,
        tmux session, and tracking directory. If the backend supports resume, the
        LLM conversation is resumed via the deterministic session UUID.
      operationId: restartSession
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  description: Session ID (short or full)
                  example: "a3f2"
      responses:
        "200":
          description: Session restarted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Bad request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Session not found or not in a terminal state

  /api/sessions/rename:
    post:
      summary: Rename a session
      description: Set or update the human-readable name for a session.
      operationId: renameSession
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id:
                  type: string
                  description: Session ID (short or full)
                  example: "a3f2"
                name:
                  type: string
                  description: New human-readable name
                  example: "auth refactor"
      responses:
        "200":
          description: Renamed successfully
        "404":
          description: Session not found
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/sessions/tags:
    get:
      summary: List the tags in use across live and archived sessions
      description: |
        The tag inventory: every tag a live or archived session carries — its
        own, its system tags, or tags inherited from its Automaton — with the
        tag split into its axis and value and the number of sessions that
        carry it. A session is counted once per tag no matter which of those
        three tag sets carries the tag. Tags without an axis sort last; order
        is by axis, then count descending. Read-only: it needs the sessions
        list capability, not the sessions write capability the POST on this
        same route uses.
      operationId: listSessionTagInventory
      tags: [Sessions]
      responses:
        "200":
          description: The tag inventory
          content:
            application/json:
              schema:
                type: object
                required: [tags]
                properties:
                  tags:
                    type: array
                    items:
                      type: object
                      required: [tag, axis, value, count]
                      properties:
                        tag:
                          type: string
                          description: The tag text
                          example: "stage:build"
                        axis:
                          type: string
                          description: Axis (empty for tags without one)
                          example: "stage"
                        value:
                          type: string
                          description: Value part (the whole tag when there is no axis)
                          example: "build"
                        count:
                          type: integer
                          description: Number of sessions that carry the tag
                          example: 3
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Replace a session's own tags
      description: |
        Replace the tags a session carries itself. `id` is the full or short
        session ID. Duplicate tag IDs are dropped (first wins). An unknown tag
        ID is refused with 404 and nothing is written. The response is the
        updated session with `tags` and `inherited_tags`; inherited tags come
        from the owning Automaton and are read-only here.
      operationId: setSessionTags
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, tag_ids]
              properties:
                id:
                  type: string
                  description: Session ID (short or full)
                  example: "a3f2"
                tag_ids:
                  type: array
                  items:
                    type: string
                  description: Tag IDs the session carries itself (replaces the current list)
                  example: ["5e6f7a8b", "1a2b3c4d"]
      responses:
        "200":
          description: Tags replaced; the updated session is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Bad request, or the tag registry is not available
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The federation peer lacks the sessions write capability
        "404":
          description: Session not found, or a tag ID is unknown

  /api/sessions/{session_id}/result:
    post:
      summary: Post a session's structured result
      description: |
        A scheduled job posts the result of its run for this session.
        Two gates apply: the caller needs the `sessions:result_write`
        capability, and a session-scoped credential may only post for the
        session it belongs to (posting for any other session returns 403).

        The payload must carry a non-empty `title`; `status` is either
        absent or one of `ok` / `warn` / `error`. When the session belongs
        to a named schedule the entry is appended to that schedule's
        retained history (oldest evicted first past
        `results.schedule_history_limit`). The session's status board
        always reflects the latest result, even for unscheduled sessions.
      operationId: postSessionResult
      tags: [Sessions]
      parameters:
        - name: session_id
          in: path
          required: true
          description: Session ID (short or full)
          schema:
            type: string
            example: "a3f2"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResultPayload"
      responses:
        "200":
          description: Result accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  session_id:
                    type: string
                  full_id:
                    type: string
                  schedule_name:
                    type: string
                    description: Empty when the session is not bound to a named schedule
                  stored:
                    type: boolean
                    description: True when the entry was written to the schedule history
                  count:
                    type: integer
                    description: Number of schedule names with retained results
        "400":
          description: Invalid payload (typed validation error in the body)
        "403":
          description: Caller lacks `sessions:result_write`, or posted for a session it does not own
        "404":
          description: Session not found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Schedule result store not available
  /api/sessions/{id}/progress:
    get:
      summary: Live progress snapshot for one session
      description: |
        Parses the session's own pi JSONL log and returns how far it has
        gotten: assistant turns, per-tool call counts, the most recent action
        (tool name, arguments, and the agent's last-stated intent), and
        cumulative tokens. Same `progress` shape the autonomous prd-get
        returns per running task. The route never reads a pi log from
        another session: a non-pi session gets 404 even when a stale pi
        log sits in its project directory (9.31.3).
      operationId: getSessionProgress
      tags: [Sessions]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}, description: "Session ID (short or full)"}
      responses:
        "200":
          description: Progress snapshot
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      session_id: {type: string}
                      full_id: {type: string}
                      state: {type: string, description: "Session state: running, completed, failed, killed"}
                      log_path: {type: string, description: "The JSONL log the snapshot was parsed from"}
                  - $ref: "#/components/schemas/TaskProgress"
        "404":
          description: "Session not found; not a pi session (a stale pi log from another session is never read); or no locatable pi log (not yet flushed)"
        "405":
          description: Method not allowed (GET only)
        "401":
          $ref: "#/components/responses/Unauthorized"

  # Operator identity — read, write, backups, restore and the explicit reset
  /api/identity:
    get:
      summary: Read the operator identity
      operationId: getIdentity
      tags: [Identity]
      responses:
        "200": {description: The identity, content: {application/json: {schema: {$ref: "#/components/schemas/Identity"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: Identity is disabled (no identity manager wired)}
    put:
      summary: Replace the operator identity
      description: |
        Replaces the whole identity after copying the file it replaces into the backups.
        An all-empty body over a saved identity is refused with 409 (`identity_wipe_refused`)
        and nothing is written; use `POST /api/identity/reset` to clear on purpose.
      operationId: putIdentity
      tags: [Identity]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/Identity"}}}}
      responses:
        "200": {description: The identity as saved, content: {application/json: {schema: {$ref: "#/components/schemas/Identity"}}}}
        "400": {description: Body is not valid JSON}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Token lacks config:write}
        "409": {description: Refused - an empty body over a saved identity; nothing was written, content: {application/json: {schema: {$ref: "#/components/schemas/IdentityWipeRefused"}}}}
        "500": {description: The identity could not be written}
        "503": {description: Identity is disabled}
    patch:
      summary: Merge fields into the operator identity
      description: Merges the non-empty body fields; omitted and empty fields keep their saved value, so an all-empty body changes nothing.
      operationId: patchIdentity
      tags: [Identity]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/Identity"}}}}
      responses:
        "200": {description: The merged identity, content: {application/json: {schema: {$ref: "#/components/schemas/Identity"}}}}
        "400": {description: Body is not valid JSON}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Token lacks config:write}
        "409": {description: Refused - the write would leave the saved identity empty, content: {application/json: {schema: {$ref: "#/components/schemas/IdentityWipeRefused"}}}}
        "500": {description: The identity could not be written}
        "503": {description: Identity is disabled}
    post:
      summary: Merge fields into the operator identity (alias of PATCH)
      operationId: postIdentity
      tags: [Identity]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/Identity"}}}}
      responses:
        "200": {description: The merged identity, content: {application/json: {schema: {$ref: "#/components/schemas/Identity"}}}}
        "400": {description: Body is not valid JSON}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Token lacks config:write}
        "409": {description: Refused - the write would leave the saved identity empty, content: {application/json: {schema: {$ref: "#/components/schemas/IdentityWipeRefused"}}}}
        "500": {description: The identity could not be written}
        "503": {description: Identity is disabled}
  /api/identity/backups:
    get:
      summary: List identity backups, newest first, with the retention limit
      operationId: listIdentityBackups
      tags: [Identity]
      responses:
        "200": {description: "Backups and the effective identity.backups_to_keep", content: {application/json: {schema: {$ref: "#/components/schemas/IdentityBackupList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Token lacks config:read}
        "405": {description: Method not allowed (GET only)}
        "500": {description: The backup directory could not be read}
        "503": {description: Identity is disabled}
  /api/identity/restore:
    post:
      summary: Restore the identity from a backup name or `latest`
      description: The identity being replaced is backed up first, so a restore can be undone. Audit action `identity_restore`.
      operationId: restoreIdentity
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [backup], properties: {backup: {type: string, description: "A name from GET /api/identity/backups, or latest"}}}
      responses:
        "200": {description: The restored identity, content: {application/json: {schema: {$ref: "#/components/schemas/Identity"}}}}
        "400": {description: Bad JSON or no backup given}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Token lacks config:write}
        "404": {description: Unknown backup, or a name that is not a backup file name}
        "405": {description: Method not allowed (POST only)}
        "422": {description: The backup has no operator content}
        "500": {description: The identity could not be written}
        "503": {description: Identity is disabled}
  /api/identity/reset:
    post:
      summary: Clear the identity on purpose (backs it up first)
      description: The only way to empty a saved identity. Audit action `identity_reset`.
      operationId: resetIdentity
      tags: [Identity]
      responses:
        "200": {description: The empty identity, content: {application/json: {schema: {$ref: "#/components/schemas/Identity"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Token lacks config:write}
        "405": {description: Method not allowed (POST only)}
        "500": {description: The identity could not be written}
        "503": {description: Identity is disabled}

  /api/config:
    get:
      summary: Get configuration
      description: |
        Returns the current daemon configuration with sensitive fields masked.
        Token, password, and secret fields are replaced with `"***"` when non-empty.
      operationId: getConfig
      tags: [System]
      responses:
        "200":
          description: Masked configuration object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      summary: Update configuration
      description: |
        Apply one or more configuration changes using dot-path keys.
        Changes are written to the config file immediately.

        Supported keys: `telegram.enabled`, `discord.enabled`, `slack.enabled`,
        `matrix.enabled`, `twilio.enabled`, `ntfy.enabled`, `email.enabled`,
        `webhook.enabled`, `github_webhook.enabled`, `server.enabled`,
        `server.host`, `server.port`, `server.token`, `server.tls_enabled`,
        `autonomous.parallel.read_only_tasks` (true|false, default true; tasks flagged read_only skip the tree lock),
        `autonomous.parallel.worktree_per_task` (true|false, default true; each parallel task runs in its own worktree and its branch is merged back into the PRD branch),
        `autonomous.parallel.merge_conflict_policy` (additive_then_model|block|triage, default additive_then_model; what happens when a task branch conflicts on merge),
        `autonomous.parallel.merge_conflict_model` (string, default empty = the strongest configured planning model; the model that resolves a merge conflict),
        `autonomous.parallel.merge_retry_seconds` (whole seconds >= 0, default 60; seconds between timed merge retry passes, 0 turns the timer off),
        `autonomous.plan_coverage_check` (off|warn|block, default block),
        `autonomous.plan_coverage_min_ratio` (0-1, default 1.0),
        `autonomous.plan_coverage_suppress_created_files` (true|false, default true; hide findings for files the plan itself creates),
        `autonomous.plan_coverage_scoped_requirements` (true|false, default true; only count requirement wording inside the configured spec sections),
        `autonomous.plan_coverage_requirement_sections` (comma-separated string of spec section names, default "scope,constraints"; empty restores the default),
        `autonomous.plan_coverage_min_requirement_chars` (whole number >= 0, 0 reads the 30-character default; the shortest requirement sentence that counts),
        `autonomous.generated_artefacts.change_record`, `.gate_report`, `.changelog_draft`, `.parity_draft`, `.tracker_rows`, `.registry_row`, `.combined_docs_task` (true|false, default true; which artefacts an Automaton generates from its change record; applies without restart),
        `autonomous.stuck_running_seconds` (whole seconds >= 0, default 900; how long an
        Automaton may stay running with every task finished and no live session before the
        stuck-running watchdog re-fires its roll-up once, then blocks it; 0 uses the default),
        `autonomous.task_max_attempt_seconds` (whole seconds >= 0, default 0 = off; wall-clock
        cap on one task attempt, recommended 5400),
        `autonomous.task_no_progress_seconds` (whole seconds >= 0, default 0 = off; stops an
        attempt with no output, file change, commit or CPU-using child process for this long,
        recommended 1800),
        `autonomous.task_templates.mode` (an object of template id to `llm`, `daemon` or `off`;
        empty keeps the shipped defaults: `daemon` for changelog_entry, parity_issue_draft,
        bounded_load_step and version_bump_left_to_merge, `llm` for docs_set and final_gate;
        `daemon` is refused for final_gate and for any id that is not daemon-capable; set it
        and a bad value rejects the whole PUT with 400),
        `autonomous.script_gate_timeout_seconds` (whole seconds >= 0, default 900; the time cap
        on one script gate run, where 0 means no cap; a negative value is rejected with 400),
        `autonomous.project_gate_command` (one line of shell text, at most 1024 bytes, default
        unset; the build-and-test command the script gate runs; a line break or NUL byte is
        rejected with 400; a project's `projects.<name>.policy.project_gate_command` overrides it,
        and an explicit empty string there unsets it for that project only),
        `autonomous.automation.idle_alert_minutes` (whole minutes >= 0, default 0 =
        off; a negative or non-integer value is rejected with 400),
        `autonomous.automation.triage_alert_minutes` (whole minutes >= 0; an unset
        key reads as 30 and an explicit `0` turns triage alerts off; a negative or
        non-integer value is rejected with 400),
        `autonomous.automation.pending_item_policy` (hold|skip, default hold),
        `autonomous.automation.pending_item_auto_resume` (true|false, default true),
        `autonomous.automation.pending_item_source.path` (a file path; empty = no file
        registry), `autonomous.automation.pending_item_source.id_pattern` (a regular
        expression, default `^\S+$`), `autonomous.automation.pending_item_source.id_column`
        and `.title_column` and `.state_column` (a header name or a 1-based column
        number; defaults `1`, `2` and empty), `autonomous.automation.pending_item_source.done_values`
        (a list of words, comma-separated here; default done, closed, shipped) and
        `autonomous.automation.pending_item_source.on_missing_row` (keep|drop, default
        keep); a bad pending item value rejects the whole PUT with 400 naming the allowed
        words and nothing is written,
        `autonomous.progress.lanes` (whole number >= 0, default 0 = 5),
        `autonomous.progress.inactive_gap_hours` (number >= 0, default 0 = 3),
        `autonomous.progress.backlog_path` (string, default docs/plans/README.md; a
        relative path resolves against `autonomous.worktree_base_repo` when set, else
        the daemon working directory),
        `autonomous.progress.since` (YYYY-MM-DD, empty = the first record's creation
        date), `autonomous.progress.snapshot_retention_days` (whole number >= 0,
        default 0 = 90); a bad progress value is rejected with 400 and nothing is written,
        `autonomous.plan_review_backend`, `autonomous.plan_review_model`,
        `autonomous.plan_review_mode` (off | warn | block),
        `autonomous.smoke_verification_backend`, `autonomous.smoke_verification_model`,
        `autonomous.lane_fill.mode` (off | shadow | on; empty means shadow; any other
        value is rejected with 400), `autonomous.lane_fill.gpu_lanes` (whole number
        >= 0, default 2), `autonomous.lane_fill.claude_lanes` (whole number >= 0,
        default 3; 0 means no Claude lane), `autonomous.lane_fill.idle_alert_minutes`
        (whole number >= 0, default 30; 0 = off), `autonomous.lane_fill.decompose_ahead_min`
        (whole number >= 0, default 2), `autonomous.lane_fill.poll_seconds` (whole number
        >= 0, default 60; values below 5 are raised to 5), `autonomous.lane_fill.gpu_backend`
        (default pi-prompt), `autonomous.lane_fill.gpu_model` (string; empty = the
        backend's own model), `autonomous.lane_fill.claude_backend` (default
        claude-code), `autonomous.lane_fill.count_verifier_wait` (true|false, default
        true), `autonomous.lane_fill.stale_after_hours` (whole number >= 0; an unset
        key reads as 72 and an explicit `0` turns the stale rule off),
        `autonomous.lane_fill.host_down_after_minutes` (whole number >= 0, default 10;
        minutes a pool host may stay unreachable before it is treated as down; `0` =
        never treat an unreachable host as down),
        `autonomous.lane_fill.require_confirmed_proposal` (true|false, default true),
        `autonomous.lane_fill.check_main_carries` (true|false, default true),
        `autonomous.lane_fill.require_worktree` (true|false, default true),
        `autonomous.lane_fill.lane_counts_from_caps` (true|false, default true; when
        false only `gpu_lanes` and `claude_lanes` set the lane counts) and
        `autonomous.lane_fill.gpu_mode` and `autonomous.lane_fill.claude_mode`
        (off | shadow | on, or empty to follow `autonomous.lane_fill.mode`; they set
        the mode for one lane kind). A bad lane fill value rejects the whole PUT with
        400 and nothing is written. GET returns the values in effect and the running planner picks up
        changes without a restart.
        `autonomous.failure_escalation.enabled` (true|false, default true),
        `autonomous.failure_escalation.max_failures` (whole number of 1 or more, default 3),
        `autonomous.failure_escalation.steps` (a JSON array of step objects, or the text
        `backend:model[@attempts],...`; empty clears the ladder),
        `autonomous.infra_retry.enabled` (true|false, default true),
        `autonomous.infra_retry.max_tries` (whole number from 1 to 1000, default 3),
        `autonomous.infra_retry.backoff_seconds` (a JSON array of whole seconds, or a
        comma list such as `60,300,540`; each 0 to 604800; the last entry repeats when
        there are more tries than entries; an empty list means no delay),
        `autonomous.infra_retry.categories` (a JSON array of failure classes, or a
        comma list; `spawn_error`, `storage_write`, `session_killed_before_delivery`,
        `daemon_restart`; an empty list retries no class),
        `autonomous.infra_retry.exhausted_action` (`hold` or `count`, default `hold`),
        `autonomous.infra_retry.retry_dependents` (true|false, default true) and
        `autonomous.infra_retry.raise_question` (true|false, default true). A bad
        infrastructure retry value rejects the whole PUT with 400 and nothing is
        written. GET returns all seven values in effect under `autonomous.infra_retry`
        and the running Automaton manager picks up changes without a restart.
        `autonomous.merge_pipeline.file_name` (a file name inside the project, default
        `.datawatch/merge-pipeline.yaml`), `autonomous.merge_pipeline.source_order` (a JSON
        array or comma list of `file` and `record`, default `file,record`),
        `autonomous.merge_pipeline.fallback_on_bad_file` (`record`, `default` or `none`,
        default `record`), `autonomous.merge_pipeline.conflict_policy` (`stop_and_ask`,
        `mechanical` or `mechanical_and_model`, default `mechanical_and_model`),
        `autonomous.merge_pipeline.conflict_model` (an LLM registry entry name; an empty
        string means no model), `autonomous.merge_pipeline.release_size_map` (a JSON object or kind=size pairs such as `feature=minor,bug=patch`; each size is `patch`, `minor`, `major` or `none`; kinds named here override the built-in map of feature = minor and bug = patch, and a major is never a default), `autonomous.merge_pipeline.major_trigger` (`manual`, `milestone` or `never`, default `manual`: when an Automation raises a major release step), `autonomous.merge_pipeline.release_cadence` (`per_merge`, the default and the only cadence available; `batch` and `manual` are refused with a 400 saying the cadence is not available yet) and `autonomous.merge_pipeline.version_scheme` (`semver`, the default and the only scheme available; any other name is refused with a 400 saying the scheme is not available yet), `autonomous.merge_pipeline.version_files` (a JSON
        array or comma list of file names inside the project) and the release approval
        modes `autonomous.merge_pipeline.release_approval.patch`, `autonomous.merge_pipeline.release_approval.minor`
        and `autonomous.merge_pipeline.release_approval.major` (each `auto`, `ask` or `manual`;
        default `auto` for patch and minor, `ask` for major). In plain terms: `auto` ships the
        release when the checks pass and reports afterwards; `ask` prepares everything and raises
        one decision for the operator; `manual` prepares and reports, and a person ships. Each of
        the ten keys above and the three release approval modes can be set for one project as
        `autonomous.merge_pipeline.projects.<project>.<key>`, where the release modes use the key
        `release_approval.patch`, `release_approval.minor` or `release_approval.major`; a project
        mode that is left out inherits the global mode;
        null clears a key back to its default, and null on
        `autonomous.merge_pipeline.projects.<project>` removes that project's overrides.
        The post-ship hook keys are global for every project and take no projects.<project> prefix: `autonomous.merge_pipeline.post_ship.enabled` (true|false; default false, and no hook runs while it is false), `autonomous.merge_pipeline.post_ship.registry_file` (the registry_row built-in's registry file, relative to the project) and `autonomous.merge_pipeline.post_ship.registry_row_pattern` (its row line template), `autonomous.merge_pipeline.post_ship.companion_repository` (the owner/name the parity_issue built-in files its issue in) and `autonomous.merge_pipeline.post_ship.issue_title_template` (its issue title), `autonomous.merge_pipeline.post_ship.notify_template` (the notify built-in's message body, and the parity_issue body; may name {project} and {version}) and `autonomous.merge_pipeline.post_ship.hooks` (a JSON array of objects; each has a non-empty unique name, exactly one of a built-in name — registry_row, parity_issue, tag or notify — or a command line, and an optional enabled flag that is false by default; at most 20). An enabled built-in is refused by name when its target is unset in the applied block, so one PUT may set the target and the hook together. 
        A bad merge pipeline value or an unknown key rejects the whole PUT with 400 and
        nothing is written. GET returns the values in effect under
        `autonomous.merge_pipeline`, with the per-project overrides under `projects`.
        `autonomous.request_watch.enabled` (true|false, default true),
        `autonomous.request_watch.poll_seconds` (whole number of seconds from 1 to 86400,
        default 30), `autonomous.request_watch.no_progress_minutes` (whole number of
        minutes from 1 to 10080, default 30), `autonomous.request_watch.observe_workers`
        (true|false, default true), `autonomous.request_watch.observe_verifiers`
        (true|false, default true), `autonomous.request_watch.use_gpu_signal`
        (true|false, default true), `autonomous.request_watch.gpu_busy_percent` (whole
        number from 1 to 100, default 10), `autonomous.request_watch.unreachable_counts`
        (true|false, default true), `autonomous.request_watch.raise_alert` (true|false,
        default true), `autonomous.request_watch.raise_question` (true|false, default
        true) and `autonomous.request_watch.remediation_options` (a JSON array of option
        ids, or a comma list: `keep_waiting`, `end_worker`, `retry_other_backend`,
        `unload_reload_model`; keep_waiting is always offered; an empty list offers
        keep_waiting only; null clears the key back to unset, which offers all four).
        A bad request watch value rejects the whole PUT with 400 and a message that
        names the key and the allowed values, and nothing is written. GET returns all
        eleven values in effect under `autonomous.request_watch` (an unset key shows its
        default and `remediation_options` is the list in effect, keep_waiting first) and
        the watcher picks up changes on its next poll without a restart.
        `autonomous.model_routing.refusal_mode` (`refuse` or `warn`, default `refuse`;
        whether a worker pinned to a model that no node serves is turned away or only
        warned about),
        `autonomous.model_routing.served_models_cache_seconds` (whole number >= 0,
        default 300; how long a node's list of served models is kept; 0 reads it from
        the node every time),
        `autonomous.model_routing.verifier_follows_worker_node` (true|false, default
        true; the verifier runs on the node its worker ran on),
        `autonomous.model_routing.unknown_node_policy` (`assume_serves` or
        `assume_not`, default `assume_serves`; how a node whose models cannot be read
        counts),
        `autonomous.model_routing.probe_timeout_seconds` (whole number >= 1, default 8;
        how long a read of a node's models may take) and
        `autonomous.model_routing.alert_on_refusal` (true|false, default true; raise an
        alert when a worker is turned away). The block can also be sent whole as an
        object under `autonomous.model_routing`. A bad model routing value rejects the
        whole PUT with 400 naming the key and nothing is written. GET returns all six
        values in effect under `autonomous.model_routing` and a change applies without
        a restart.
        `autonomous.verifier_policy.mode` (fixed | prefer-free | balance | gpu-only |
        claude-only; empty = fixed), `autonomous.verifier_policy.backends` (ordered
        list, or comma-separated), `autonomous.verifier_policy.claude_session_cap`
        (whole number >= 0, 0 = unlimited),
        `autonomous.verifier_policy.claude_cap_window_minutes` (whole number >= 0,
        0 = 60), `autonomous.verifier_policy.force_stronger_on_retry`,
        `autonomous.verifier_policy.final_gate_stronger`,
        `autonomous.verifier_policy.stronger_backend` and
        `autonomous.verifier_policy.stronger_model`. An unknown mode, an empty
        backend entry, a negative number or an unknown `verifier_policy` key rejects
        the whole PUT with 400. The policy applies to the next verification with no
        restart.

        Decision record keys under `autonomous.decisions` (a structured record of one
        operator decision; the daemon raises its queue question from the record):
        `autonomous.decisions.enabled` (true|false, default true),
        `autonomous.decisions.folder` (string; empty = folder watch off),
        `autonomous.decisions.folder_glob` (default `*.md`),
        `autonomous.decisions.front_matter_delimiter` (default `---`),
        `autonomous.decisions.front_matter_separator` (default `:`),
        `autonomous.decisions.front_matter_field_separator` (default `|`),
        `autonomous.decisions.front_matter_keys` (object mapping a canonical key name to
        the name used in files; empty = canonical names),
        `autonomous.decisions.folder_withdraw_on_delete` (true|false, default true),
        `autonomous.decisions.clarity_mode` (off | warn | refuse, default warn),
        `autonomous.decisions.clarity_min_text_chars` (whole number >= 0, default 60),
        `autonomous.decisions.clarity_require_tradeoffs` (true|false, default true),
        `autonomous.decisions.clarity_require_label` (true|false, default true),
        `autonomous.decisions.clarity_tracker_id_pattern` (regular expression; empty =
        the built-in pattern), `autonomous.decisions.doc_root` (string; empty = the
        daemon's working directory), `autonomous.decisions.doc_status_mode` (off | report
        | on, default report), `autonomous.decisions.doc_status_pattern` (regular
        expression, default `^Confirmed:.*$`), `autonomous.decisions.doc_status_template`
        (text with the placeholders {choice}, {choice_label}, {quote}, {actor}, {date}
        and {decision_id}) and `autonomous.decisions.follow_ups` (a JSON array of
        `{name, kind, target}` objects, default empty; `kind` is `start_template` or
        `open_automaton`). A mode outside its set, a regular expression that does not
        compile, a negative `clarity_min_text_chars`, an empty delimiter or separator,
        or a follow-up with an empty or repeated name, an unknown kind or an empty
        target rejects the whole PUT with 400 and nothing is written. Absent keys read
        their defaults, and a change applies with no restart.

        `usage.calculator.variant` (pace-gauge | lane-planner | burn-ledger | all),
        `usage.calculator.policy` (use-all | pace | finish-early),
        `usage.calculator.safety_points` (number >= 0; a negative value rejects the PUT with 400),
        `usage.calculator.cost_per_task_points` (number >= 0 points/week/task; 0 disables the
        finish-early estimate), `usage.calculator.baseline_per_24h` (number >= 0, the idle burn),
        `usage.calculator.max_lanes` (whole number from 1 to 8), `usage.calculator.reset_weekday`
        (sunday..saturday), `usage.calculator.reset_time` (HH:MM, 24-hour),
        `usage.calculator.reset_zone` (IANA time zone name; empty means "follow the daemon's
        local zone" and PUTs back empty — saving "UTC" pins UTC) and `usage.calculator.keeper`
        (the daemon that keeps the shared record); an invalid value rejects the whole PUT
        with 400 and nothing is written. GET returns, alongside `usage.calculator.reset_zone`
        (the effective zone), `usage.calculator.reset_zone_source` (`configured` when the
        operator set the zone, `server` when it follows the daemon's local zone) and
        `usage.calculator.reset_zone_fell_back` (true when no zone could be resolved and the
        reset runs in UTC; the `/api/usage/advice` result then carries a note under
        `notes` telling the operator to set the zone explicitly, and its `zone` field
        reports the effective zone with `server_zone` set when the operator left it unset).

        `session.dismiss_ui_prompts` (true|false; an unset key reads as true,
        and an explicit `false` turns UI prompt dismissal off — a string such
        as `"true"` is not a boolean like `1` in JSON and is rejected with 400),
        `session.ui_prompt_dismiss_delay_seconds` (whole seconds >= 0; an unset
        key reads as 5 and an explicit `0` sends at once),
        `session.ui_prompt_clear_bound_seconds` (whole seconds >= 1; an unset key
        reads as 30) and `session.ui_prompt_max_attempts` (whole number >= 1;
        an unset key reads as 2). A wrong type (a string, a fraction, a
        boolean or null), a non-integer, a zero or a negative value where the
        key requires at least 1 all rejects the whole PUT with 400 — nothing
        is written. GET returns the values in effect. None of these values is
        hard-coded: the daemon re-reads the config on every use, so a PUT
        takes effect immediately with no restart.

        `ui.splash_min_seconds` (whole number from 0 to 60; an unset key
        reads as 6 — the minimum number of whole seconds the UI splash stays
        on screen before it may dismiss — and an explicit `0` keeps the
        legacy timing, i.e. no minimum dwell) and
        `ui.splash_min_seconds_new_version` (whole number from 0 to 60; an
        unset key reads as 9 — the same minimum dwell when the splash is
        shown for a new version — and an explicit `0` keeps the legacy
        timing). A wrong type (a string, a fraction, a boolean or null), a
        negative value, or a value over 60 rejects the whole PUT with 400
        and a message that names the key — nothing is written. GET returns
        the two values in effect under `ui` (an unset key shows its default)
        and the daemon re-reads the config on every use, so a PUT takes
        effect with no restart.
      operationId: updateConfig
      tags: [System]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              example:
                telegram.enabled: true
                server.port: 9090
      responses:
        "200":
          description: Changes applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
        "400":
          description: Invalid request body
        "401":
          $ref: "#/components/responses/Unauthorized"

