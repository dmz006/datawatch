    delete:
      summary: Delete an output filter
      description: Remove a filter pattern by ID.
      operationId: deleteFilter
      tags: [Filters]
      parameters:
        - name: id
          in: query
          required: true
          description: Filter ID
          schema:
            type: string
      responses:
        "200":
          description: Deleted
        "404":
          description: Not found
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/autonomous/lane-fill:
    get:
      summary: Lane fill status
      description: |
        The lane fill status: the mode (off, shadow or on), each GPU and Claude lane
        with what it runs or why it is idle, the queued Automata that could start on
        each lane type, the evidence from the last poll (active GPU sessions and loaded
        models), the newest planner decisions and the idle alerts. `modes` gives the
        mode in effect for each lane kind and `lane_counts` the lane counts the last
        poll used. A decision that refused an Automaton carries `eligibility_reason`,
        the stable code for the refusal. `limit` caps the decision history, newest first. Needs the autonomous read capability when
        called by a federated peer.
      operationId: autonomousLaneFillStatus
      tags: [Autonomous]
      parameters:
        - {name: limit, in: query, required: false, description: "Decisions to return, newest first; a whole number from 1 to 1000, default 50", schema: {type: integer, minimum: 1, maximum: 1000, default: 50}}
      responses:
        "200":
          description: Lane fill status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaneFillStatus"
        "400": {description: limit is not a whole number from 1 to 1000}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed}
        "503": {description: Autonomous is disabled}

  /api/autonomous/infra-retries:
    get:
      summary: Infrastructure retries
      description: |
        The infrastructure retry policy in effect (`enabled`, `max_tries`,
        `backoff_seconds`, `categories`, `exhausted_action`, `retry_dependents` and
        `raise_question`) and the tasks that were retried, or are held, because the
        machinery around them failed: a worker that could not be spawned, a failed
        storage write, a session killed before the task was delivered or a daemon
        restart. Each task lists its retries with the failure class, the reason, when
        each was decided, the delay and when it was due. A task is `held` while it
        waits for the operator after its retries ran out, with `held_cause` and, when
        an operator question is open for it, `question_id`. Tasks are listed with the
        most recently retried first. `automaton` limits the list to one Automaton; an
        Automaton that does not exist gives an empty list. `count` is the number of
        tasks listed. Read-only; needs the autonomous read capability when called by
        a federated peer.
      operationId: autonomousInfraRetries
      tags: [Autonomous]
      parameters:
        - {name: automaton, in: query, required: false, description: Only the tasks of this Automaton, schema: {type: string}}
        - {name: limit, in: query, required: false, description: "Tasks to return, most recently retried first; a whole number from 1 to 1000, default 50", schema: {type: integer, minimum: 1, maximum: 1000, default: 50}}
      responses:
        "200":
          description: The retry policy and the tasks retried or held
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfraRetryStatus"
        "400": {description: limit is not a whole number from 1 to 1000}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed}
        "501": {description: The Automaton manager does not offer the infrastructure retry read}
        "503": {description: Autonomous is disabled}

  /api/autonomous/decisions:
    get:
      summary: Operator decisions
      description: |
        The operator decisions, newest first. Each entry carries the decision's id,
        question, label, state (`open`, `answered`, `withdrawn` or `expired`), who
        asked it and when, the Automaton it belongs to, the tasks of that Automaton
        whose spec names it (`task_ids`), the ones held on it right now
        (`waiting_task_ids` and `waiting_tasks` with each task's wait reason) and the
        current answer. `answer` is null until the decision is answered; then it holds
        the answer id, the operator's words verbatim in `quote`, the sha256 of the
        quote, the actor, the surface and the time. A withdrawn or expired decision is
        listed with that state. The filters are exact matches and combine; a filter
        that matches nothing is an empty `decisions` array, not an error. Read-only;
        needs the autonomous read capability when called by a federated peer.
      operationId: autonomousDecisions
      tags: [Autonomous]
      parameters:
        - {name: prd_id, in: query, required: false, description: Only the decisions linked to this Automaton, schema: {type: string}}
        - {name: state, in: query, required: false, description: Only decisions in this state, schema: {type: string, enum: [open, answered, withdrawn, expired]}}
        - {name: limit, in: query, required: false, description: "At most this many decisions; a positive whole number, default 100, a value above 1000 is capped to 1000, not refused", schema: {type: integer, minimum: 1, default: 100}}
      responses:
        "200":
          description: The decisions, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionLine"
        "400": {description: "state is not open, answered, withdrawn or expired, or limit is not a positive whole number"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed}
        "503": {description: "Autonomous is disabled, or the question store is not available"}

  /api/autonomous/decision-records:
    post:
      summary: Create a decision record
      description: |
        Creates a decision record and raises its operator question from it. A
        decision record is the structured description of one decision: a title, the
        situation, what exactly is being decided, two to twenty options with their
        cost and risk, an optional recommendation, a default (an option id or `hold`)
        and optional links to a document, an Automaton and a registry row. The
        daemon builds the question from the record, so a decision always reads the
        same way, and exactly one question exists per record.

        The body carries the content fields only (`label`, `title`, `situation`,
        `deciding`, `options`, `recommendation`, `default`, `links`); any other field
        is a 400. The record is stored with `source` `rest`. An empty `label` becomes
        `decision`.

        The clarity check runs on the question built from the record, in the mode of
        `autonomous.decisions.clarity_mode`. In `warn` mode the record is stored and
        the findings come back as `warnings`; in `refuse` mode a record with findings
        is refused with 422 and nothing is stored. The answer is 201 with the stored
        `record`, its `question_id` and the `warnings` (an empty array when there are
        none). Body cap 64 KiB; content after the JSON object is malformed. Needs the
        autonomous write capability when called by a federated peer.

        Records and questions need both `autonomous.decisions.enabled` and
        `autonomous.questions.enabled`; while either is off the answer is 503 and the
        message names it.
      operationId: decisionRecordCreate
      tags: [Autonomous]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DecisionRecordContent"}
      responses:
        "201":
          description: The stored record, its question id and the clarity warnings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DecisionRecordResponse"}
        "400":
          description: "Malformed body, a field outside the content fields, or an invalid record; the message names every problem found. Nothing is stored"
          content: {"application/json": {schema: {$ref: "#/components/schemas/DecisionRecordError"}}}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous write capability}
        "405": {description: Method not allowed}
        "413":
          description: Body over the 64 KiB cap
          content: {"application/json": {schema: {$ref: "#/components/schemas/DecisionRecordError"}}}
        "422":
          description: "Refuse mode: the record is not clear enough. The findings say what to fix; nothing is stored"
          content: {"application/json": {schema: {$ref: "#/components/schemas/DecisionRecordRefused"}}}
        "500":
          description: The record could not be stored
          content: {"application/json": {schema: {$ref: "#/components/schemas/DecisionRecordError"}}}
        "503":
          description: "A switch the records need is off (the message names `autonomous.decisions.enabled` or `autonomous.questions.enabled`), or the service is not available"
          content: {"application/json": {schema: {$ref: "#/components/schemas/DecisionRecordError"}}}
    get:
      summary: List decision records
      description: |
        The decision records, newest first, each with the state of its question. An
        answered record carries the `answer` (the operator's words verbatim in
        `quote`, the actor, the surface, the chosen option and the time); `doc_change`
        and `follow_up` appear once the answer was applied to the linked document or a
        configured follow-up ran. The body also carries the status of the decision
        folder watch (`autonomous.decisions.folder`): whether it is on, the folder,
        how many files the last scan saw, the files it could not use and why, and the
        time of the last scan. The filters are exact matches and combine; a filter
        that matches nothing is an empty `decision_records` array, not an error. Needs
        the autonomous read capability when called by a federated peer.
      operationId: decisionRecordList
      tags: [Autonomous]
      parameters:
        - {name: state, in: query, required: false, description: Only records in this state, schema: {type: string, enum: [open, answered, withdrawn]}}
        - {name: prd_id, in: query, required: false, description: Only the records linked to this Automaton, schema: {type: string}}
        - {name: limit, in: query, required: false, description: "At most this many records; a positive whole number, default 100, a value above 1000 is capped to 1000, not refused", schema: {type: integer, minimum: 1, default: 100}}
      responses:
        "200":
          description: The records, newest first, and the folder watch status
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DecisionRecordList"}
        "400":
          description: "state is not open, answered or withdrawn, or limit is not a positive whole number"
          content: {"application/json": {schema: {$ref: "#/components/schemas/DecisionRecordError"}}}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed}
        "503":
          description: The service is not available
          content: {"application/json": {schema: {$ref: "#/components/schemas/DecisionRecordError"}}}

  /api/autonomous/decision-records/{id}:
    get:
      summary: Read one decision record
      description: |
        One decision record with the state of its question and, once answered, the
        answer. Needs the autonomous read capability when called by a federated peer.
      operationId: decisionRecordGet
      tags: [Autonomous]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The record and its question id
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DecisionRecordResponse"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "404":
          description: Unknown decision record id
          content: {"application/json": {schema: {$ref: "#/components/schemas/DecisionRecordError"}}}
        "405": {description: Method not allowed}
        "503":
          description: The service is not available
          content: {"application/json": {schema: {$ref: "#/components/schemas/DecisionRecordError"}}}
    put:
      summary: Replace the content of an open decision record
      description: |
        Replaces the content of an open record with the body (the same content fields
        as the create, all of them) and applies the rebuilt text to the same open
        question, so the question never changes id. The clarity check runs as it does
        on create. A record that is answered or withdrawn cannot be changed: the
        answer is 409 with a plain message. Body cap 64 KiB. Needs the autonomous
        write capability when called by a federated peer.
      operationId: decisionRecordUpdate
      tags: [Autonomous]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DecisionRecordContent"}
      responses:
        "200":
          description: The updated record, its question id and the clarity warnings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DecisionRecordResponse"}
        "400":
          description: "Malformed body, a field outside the content fields, or an invalid record; the message names every problem found"
          content: {"application/json": {schema: {$ref: "#/components/schemas/DecisionRecordError"}}}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous write capability}
        "404":
          description: Unknown decision record id
          content: {"application/json": {schema: {$ref: "#/components/schemas/DecisionRecordError"}}}
        "405": {description: Method not allowed}
        "409":
          description: The record is answered or withdrawn, or its question was already decided
          content: {"application/json": {schema: {$ref: "#/components/schemas/DecisionRecordError"}}}
        "413":
          description: Body over the 64 KiB cap
          content: {"application/json": {schema: {$ref: "#/components/schemas/DecisionRecordError"}}}
        "422":
          description: "Refuse mode: the new content is not clear enough; the record is unchanged"
          content: {"application/json": {schema: {$ref: "#/components/schemas/DecisionRecordRefused"}}}
        "500":
          description: The record could not be updated
          content: {"application/json": {schema: {$ref: "#/components/schemas/DecisionRecordError"}}}
        "503":
          description: "A switch the records need is off (the message names it), or the service is not available"
          content: {"application/json": {schema: {$ref: "#/components/schemas/DecisionRecordError"}}}

  /api/autonomous/decision-records/{id}/withdraw:
    post:
      summary: Withdraw a decision record
      description: |
        Withdraws the record and its open question without an answer. The body is
        optional; `reason` is free text kept with the withdrawal. Withdrawing a record
        that is already withdrawn changes nothing and answers 200. A record that is
        answered cannot be withdrawn (409). Needs the autonomous write capability when
        called by a federated peer.
      operationId: decisionRecordWithdraw
      tags: [Autonomous]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DecisionRecordWithdraw"}
      responses:
        "200":
          description: The record in its new state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DecisionRecordResponse"}
        "400":
          description: Malformed body, or a field other than reason
          content: {"application/json": {schema: {$ref: "#/components/schemas/DecisionRecordError"}}}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous write capability}
        "404":
          description: Unknown decision record id
          content: {"application/json": {schema: {$ref: "#/components/schemas/DecisionRecordError"}}}
        "405": {description: Method not allowed}
        "409":
          description: The record is answered
          content: {"application/json": {schema: {$ref: "#/components/schemas/DecisionRecordError"}}}
        "413":
          description: Body over the 64 KiB cap
          content: {"application/json": {schema: {$ref: "#/components/schemas/DecisionRecordError"}}}
        "500":
          description: The record could not be withdrawn
          content: {"application/json": {schema: {$ref: "#/components/schemas/DecisionRecordError"}}}
        "503":
          description: The service is not available
          content: {"application/json": {schema: {$ref: "#/components/schemas/DecisionRecordError"}}}

  /api/autonomous/triage:
    get:
      summary: Triage records
      description: |
        The triage records of the failed and blocked Automata, newest first. Each
        record places the Automaton in its Automation, says when it was first seen
        failed or blocked, carries the failed task (id, name, the error and the session
        end reason, each truncated to 2000 chars), the retry-budget categories with
        their limit, used and left values, and the notes appended over the record's
        life. The body also states the triage alert threshold currently in force
        (`alert_minutes`, the `autonomous.automation.triage_alert_minutes` setting;
        0 = off). `status` accepts only `failed` or `blocked`. A read that matches
        nothing is an empty `records` array, not an error. Read-only; needs the
        autonomous read capability when called by a federated peer.
      operationId: autonomousTriage
      tags: [Autonomous]
      parameters:
        - {name: automation_id, in: query, required: false, description: Records of the Automata in this Automation, schema: {type: string}}
        - {name: prd_id, in: query, required: false, description: Only the record of this Automaton, schema: {type: string}}
        - {name: status, in: query, required: false, description: "Only failed or blocked", schema: {type: string, enum: [failed, blocked]}}
      responses:
        "200":
          description: Triage records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageList"
        "400": {description: status is not failed or blocked}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed}
        "503": {description: Autonomous is disabled}

  /api/autonomous/event-log:
    get:
      summary: Automata event log
      description: |
        One newest-first list of Automata events merged from the watch, lane fill
        decisions, infrastructure retries, checks, safe-to-delete, cleanup, repo CI
        watch and error sources. Filters: `kind` (comma list of event kinds),
        `project` (exact match), `q` (case-insensitive text over summary, detail,
        project, automaton and automation). Paging: `limit` (default 50, max 200)
        and `before` (the opaque `next_cursor` from the previous page). `next_cursor`
        is empty on the last page; `total` counts every event that matches the
        filters. A bad limit, cursor or kind is a 400. Read-only; needs the
        autonomous read capability when called by a federated peer.
      operationId: autonomousEventLog
      tags: [Autonomous]
      parameters:
        - {name: kind, in: query, required: false, schema: {type: string}, description: Comma list of watch, decision, retry, check, cleanup, alert or error}
        - {name: project, in: query, required: false, schema: {type: string}}
        - {name: q, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: before, in: query, required: false, schema: {type: string}}
      responses:
        "200": {description: Events page}
        "400": {description: Bad limit, cursor or kind}
        "405": {description: Only GET is allowed}
        "503": {description: Autonomous is disabled}

  /api/autonomous/checks:
    get:
      summary: Checks policy and findings
      description: |
        The resolved mode of each automatic check (`pre_start_verifier`, `plan_rules`,
        `after_done`, `registry_readme`: `off`, `shadow` or `on`, plus
        `block_when_missing`) and the findings the checks recorded on the Automata's
        triage records, newest first. `prd_id` narrows the findings to one Automaton;
        `project_dir` resolves the per-project policy. Read-only; needs the autonomous
        read capability when called by a federated peer. The settings are the
        `autonomous.checks.*` keys on `/api/config`.
      operationId: autonomousChecks
      tags: [Autonomous]
      parameters:
        - {name: prd_id, in: query, required: false, description: Only the findings of this Automaton, schema: {type: string}}
        - {name: project_dir, in: query, required: false, description: Resolve the policy for this project directory, schema: {type: string}}
      responses:
        "200":
          description: Checks policy and findings
          content:
            application/json:
              schema: {type: object}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed}
        "503": {description: Autonomous is disabled}

  /api/autonomous/ship:
    get:
      summary: Ship policy and outcomes
      description: |
        The resolved ship settings (`push`, `tag` and `ci_watch` modes, `tag_format`,
        `remote`, `ci_workflows`) and the push, tag and CI-watch outcomes recorded
        on the Automata's triage records, newest first. `prd_id` narrows the outcomes
        to one Automaton; `project_dir` resolves the per-project policy. Read-only;
        needs the autonomous read capability when called by a federated peer. The
        settings are the `autonomous.ship.*` keys on `/api/config`.
      operationId: autonomousShip
      tags: [Autonomous]
      parameters:
        - {name: prd_id, in: query, required: false, description: Only the outcomes of this Automaton, schema: {type: string}}
        - {name: project_dir, in: query, required: false, description: Resolve the policy for this project directory, schema: {type: string}}
      responses:
        "200":
          description: Ship policy and outcomes
          content:
            application/json:
              schema: {type: object}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed}
        "503": {description: Autonomous is disabled}

  /api/autonomous/restart-interruptions:
    get:
      summary: What a restart now would interrupt
      description: |
        The running tasks (executing worker, running tests or verifying) and the
        live sessions a daemon restart now would interrupt, with their ids and
        counts, and the configured restart policy (`autonomous.restart_policy`:
        `immediate`, `wait_quiet` or `drain`, with `restart_quiet_timeout_seconds`
        and `restart_on_timeout`). `launch_draining` is true while a drain holds
        new tasks back. Read-only; needs the autonomous read capability when
        called by a federated peer.
      operationId: autonomousRestartInterruptions
      tags: [Autonomous]
      responses:
        "200":
          description: The running tasks and live sessions a restart would interrupt
          content:
            application/json:
              schema: {type: object}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed}
        "503": {description: Autonomous is disabled}
  /api/autonomous/rules-context:
    get:
      summary: Rules and context settings
      description: |
        The configured rules and context settings, the policy resolved for a project
        directory, and, when `prd` is given, the planning record of that Automaton.
        The record lists the rules and context files the planner was pointed at, with
        presence, content hash and size, the missing-file notes and the digest outcome.
        It never contains file content. Needs the autonomous read capability when
        called by a federated peer. The settings are the `autonomous.rules_context.*`
        keys on `/api/config`.
      operationId: autonomousRulesContextGet
      tags: [Autonomous]
      parameters:
        - {name: project_dir, in: query, required: false, description: Resolve the policy for this project directory (omit for the global policy), schema: {type: string}}
        - {name: prd, in: query, required: false, description: Include the planning record of this Automaton, schema: {type: string}}
      responses:
        "200":
          description: Settings, resolved policy and optional planning record
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RulesContextSettings"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "404": {description: The named Automaton does not exist}
        "405": {description: Method not allowed}
        "503": {description: Config is not available}
    put:
      summary: Replace rules and context settings
      description: |
        Replaces the whole rules and context configuration (global values and the
        per-project overrides), then saves it to the config file and installs it in
        the running policy, the same as the matching `/api/config` keys. Nothing is
        changed when any value is invalid. File names must be relative to the project
        directory (no leading slash, no `..`), at most 8 context files per scope,
        `digest_mode` is `off`, `no_tools` or `all`, and `digest_max_bytes` is 0 (use
        the default) or between 512 and 65536. Needs the autonomous write capability
        when called by a federated peer. The response is the same as the GET.
      operationId: autonomousRulesContextPut
      tags: [Autonomous]
      parameters:
        - {name: project_dir, in: query, required: false, description: Resolve the returned policy for this project directory, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RulesContextConfig"}
      responses:
        "200":
          description: Saved settings and the resolved policy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RulesContextSettings"}
        "400": {description: "Invalid body or value (the message names the key and the rule), for example an absolute path, an unknown digest mode, or a byte cap out of range"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous write capability}
        "405": {description: Method not allowed}
        "500": {description: The config file could not be saved}
        "503": {description: Config is not available}

  /api/autonomous/merge:
    get:
      summary: Automaton merge status
      description: |
        The merge-pending state of the finished Automata. `mode` is the
        `autonomous.automation.merge_pending_mode` setting in effect (`off`, `shadow`
        or `on`) and `alert_minutes` the `merge_pending_alert_minutes` threshold in
        whole minutes (0 = alerts off). `automata` has one entry per completed
        Automaton that has a work branch: its id, name, branch, the merge state, the
        commits it is ahead of main, when it was first seen merge pending
        (`pending_since`) and when the alert fired (`alerted_at`); both are null when
        they do not apply. In shadow mode each entry also carries `would_alert`, and
        `shadow_decisions` lists what the pass recorded without acting, newest first.
        The state is read from the coordinator's in-memory cache, so a read never runs
        git and no field is added to the Automaton; an Automaton the pass has not
        compared yet reads `unknown`. While the mode is `off` both lists are empty.
        Read-only; only GET is served, and a federated peer needs the autonomous read
        capability.
      operationId: autonomousMerge
      tags: [Autonomous]
      responses:
        "200":
          description: Merge status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed}
        "503": {description: Autonomous is disabled}

  /api/automation/onboarding-report:
    get:
      summary: Automation onboarding report
      description: |
        A read-only report that helps a user set up and use datawatch for Automation.
        It answers three questions in order. `configured` lists the backends and
        models available, the project directories registered, the comm channels, whether
        memory is on, and the merge pipeline source (`file`, `record` or `default`)
        each project uses. `checks` says what is missing: each check has an `id`, a
        plain `title`, a `status` of `ok`, `missing` or `optional`, and a one-sentence
        `reason`. `next_steps` lists ordered suggestions for every check that is not
        `ok`, each with a `howto` path, a definitions `anchor`, and the `command`, MCP
        tool (`mcp_tool`) or web app place (`pwa_place`) that does it. The
        `onboarding_report` settings switch the report: `enabled` (default true),
        `include_next_steps` (default true) and `disabled_checks` (check ids left out).
        With `?format=text` the answer is the plain text every surface shows. The
        report never changes configuration. A federated peer needs the autonomous read
        capability.
      operationId: automationOnboardingReport
      tags: [Automation]
      parameters:
        - {name: format, in: query, required: false, description: "json (default) or text", schema: {type: string, enum: [json, text]}}
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: {type: boolean, description: "False when the report is switched off; nothing else is set"}
                  configured:
                    type: object
                    properties:
                      backends: {type: array, items: {type: string}}
                      models: {type: array, items: {type: string}}
                      projects:
                        type: array
                        items:
                          type: object
                          properties:
                            name: {type: string}
                            dir: {type: string}
                      channels: {type: array, items: {type: string}}
                      memory: {type: boolean}
                      merge_pipeline:
                        type: array
                        items:
                          type: object
                          properties:
                            project: {type: string}
                            source: {type: string, enum: [file, record, default]}
                  checks:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        title: {type: string}
                        status: {type: string, enum: [ok, missing, optional]}
                        reason: {type: string}
                  next_steps:
                    type: array
                    items:
                      type: object
                      properties:
                        check_id: {type: string}
                        title: {type: string}
                        howto: {type: string}
                        anchor: {type: string}
                        command: {type: string}
                        mcp_tool: {type: string}
                        pwa_place: {type: string}
            text/plain:
              schema: {type: string}
        "400": {description: The format is not json or text}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed}
        "503": {description: The daemon configuration is not available}

  /api/automation/requirements-report:
    get:
      summary: Automation backend requirements report
      description: |
        Read-only report of what automation needs to run: one block per
        capability (its effective Ollama minimum, whether it is an operator
        override, and the node rows under it — each with the version found, the
        required minimum, and whether it is enabled and flagged); the configured
        automation backends (execution, planning, verification, plus the
        Claude and local-pool flags); and `missing`, the list of every unmet
        requirement in words (empty when `ok` is true).
        With `?format=text` the answer is the plain text every surface shows.
        The report never changes configuration. A federated peer needs the
        autonomous read capability. 503 when the requirements engine is not
        wired into the daemon.
      operationId: automationRequirementsReport
      tags: [Automation]
      parameters:
        - {name: format, in: query, required: false, description: "json (default) or text", schema: {type: string, enum: [json, text]}}
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated_at: {type: string, format: date-time}
                  ok: {type: boolean, description: "True when Missing is empty"}
                  missing: {type: array, items: {type: string}, description: "Every unmet requirement, human-readable; empty when ok"}
                  capabilities:
                    type: array
                    items:
                      type: object
                      properties:
                        capability: {type: string}
                        minimum_ollama: {type: string}
                        override: {type: boolean, description: "True when the operator overrode the built-in minimum"}
                        satisfied: {type: boolean}
                        nodes:
                          type: array
                          items:
                            type: object
                            properties:
                              name: {type: string}
                              found: {type: string, description: "The node's reported version; absent when unknown"}
                              required: {type: string}
                              enabled: {type: boolean}
                              flagged: {type: boolean}
                  backends:
                    type: object
                    properties:
                      execution: {type: array, items: {type: string}}
                      planning: {type: array, items: {type: string}}
                      verification: {type: array, items: {type: string}}
                      claude_configured: {type: boolean}
                      local_pool_configured: {type: boolean}
            text/plain:
              schema: {type: string}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed}
        "503": {description: The requirements engine is not available}

  /api/automation/model-consent:
    get:
      summary: Model-pull consent policy
      description: |
        The consent policy that gates model pulls: the listed models with
        their allowed flag (and note), the publisher allow-list, and
        `decision_rule` — the rule the gate implements, in words. A federated
        peer needs the autonomous read capability.
      operationId: automationModelConsentGet
      tags: [Automation]
      responses:
        "200":
          description: The policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      type: object
                      required: [name, allowed]
                      properties:
                        name: {type: string, description: "The model name, with or without its :tag suffix (matching ignores case and tag)"}
                        publisher: {type: string, description: "The model's publisher hint; optional"}
                        allowed: {type: boolean}
                        note: {type: string, description: "Operator note; typical on refused entries"}
                  publishers: {type: array, items: {type: string}, description: "The publisher allow-list; each allows every model of that publisher"}
                  decision_rule: {type: string}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
    put:
      summary: Set the model-pull consent policy
      description: |
        Replaces the stored policy with the complete policy in the body
        (it does not append). A model item may be a name (string, allowed)
        or an object `{name, allowed, note, publisher?}`. Invalid input is
        400; on success the change is audited as `model_pull_consent_changed`
        and 200 `\"status\":\"ok\"`. A federated peer needs the config-write
        capability.
      operationId: automationModelConsentSet
      tags: [Automation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                models:
                  type: array
                  items:
                    oneOf:
                      - {type: string}
                      - type: object
                        required: [name, allowed]
                        properties:
                          name: {type: string}
                          publisher: {type: string}
                          allowed: {type: boolean}
                          note: {type: string}
                publishers: {type: array, items: {type: string}}
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: {type: object, properties: {status: {type: string, example: ok}}}
        "400": {description: The body is not a valid consent policy}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the config-write capability}

  /api/autonomous/merge-pipeline:
    get:
      summary: Merge pipeline in effect for a project
      description: |
        The steps a merge would run for the project, where they came from and why.
        `source` is `file` (the pipeline file in the project's own repository),
        `record` (the pipeline the daemon keeps for the project) or `default` (the
        built-in pipeline); `reason` says in plain words why that source was chosen,
        and `file_error` names any problem found with the project's file even when
        another source stands in for it. `definition` is null when the file is
        unusable and the `fallback_on_bad_file` setting allows no substitute.
        `settings` holds the file name, source order, bad-file fallback and version
        files in effect for the project. `conflict_policy` and `conflict_model` are
        what is configured for merge conflicts; `conflict_policy_in_effect` and
        `conflict_model_in_effect` are what would be acted on, which fall back to
        `stop_and_ask` with no model when the policy needs a model that is not set
        or not available (`conflict_degraded_reason` says why). `release_approval_in_effect`
        holds the mode acted on for each release size (`patch`, `minor` and `major`; each `auto`,
        `ask` or `manual`): `auto` ships the release when the checks pass and reports afterwards,
        `ask` prepares everything and raises one decision, and `manual` prepares and reports while
        a person ships. The defaults are `auto` for patch and minor and `ask` for major. `overrides` holds
        the per-project values set for this project, or null. `record_updated_at` is
        when the daemon's record was last set, when it is the source. The project
        directory is the directory registered for the project, or the merge base
        repository when the name is its base name. Read-only; a federated peer needs
        the autonomous read capability.
      operationId: autonomousMergePipeline
      tags: [Autonomous]
      parameters:
        - {name: project, in: query, required: false, description: "The project name; when left out, the base name of the merge base repository", schema: {type: string, maxLength: 200}}
      responses:
        "200":
          description: The pipeline in effect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergePipelineView"
        "400": {description: The project is missing, too long or has control characters}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed}
        "500": {description: The daemon's pipeline records could not be read}
        "503": {description: The daemon configuration is not available}

  /api/autonomous/merge-pipeline/record:
    put:
      summary: Set a project's merge pipeline record
      description: |
        Sets the pipeline the daemon keeps for a project, replacing any earlier one.
        The record is used when the project's repository has no pipeline file (or
        when `source_order` puts it first). Give the pipeline as `definition` (the
        steps as JSON) or as `yaml` (the text of a pipeline file), not both. The
        pipeline is checked first and a pipeline with any problem is refused with a
        400 that lists every problem; nothing is stored then. The project comes from
        the `project` query value, or from `project` in the body. Needs the
        autonomous write capability when called by a federated peer.
      operationId: autonomousMergePipelineRecordSet
      tags: [Autonomous]
      parameters:
        - {name: project, in: query, required: false, description: "The project name; may instead be given in the body", schema: {type: string, maxLength: 200}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergePipelineRecordRequest"
      responses:
        "200":
          description: The stored record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergePipelineRecord"
        "400": {description: The body is not valid JSON, the project is missing, or the pipeline is missing, given twice or invalid}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous write capability}
        "405": {description: Method not allowed}
        "500": {description: The record could not be saved}
        "503": {description: The daemon configuration is not available}
    delete:
      summary: Remove a project's merge pipeline record
      description: |
        Removes the pipeline the daemon keeps for the project. The project's own
        pipeline file, if any, is untouched, and a project with neither falls back to
        the built-in pipeline. Needs the autonomous write capability when called by a
        federated peer.
      operationId: autonomousMergePipelineRecordDelete
      tags: [Autonomous]
      parameters:
        - {name: project, in: query, required: true, description: The project name, schema: {type: string, maxLength: 200}}
      responses:
        "200":
          description: The record was removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [deleted]}
                  project: {type: string}
        "400": {description: The project is missing, too long or has control characters}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous write capability}
        "404": {description: The daemon holds no record for the project}
        "405": {description: Method not allowed}
        "500": {description: The record could not be removed}
        "503": {description: The daemon configuration is not available}

  /api/autonomous/merge-pipeline/validate:
    post:
      summary: Check a merge pipeline without saving it
      description: |
        Checks a pipeline and saves nothing. Give a pipeline in the body (`definition`
        or `yaml`), or set `file` to check a file in a project's repository: `true`
        checks the file name in effect for the project, a text value names another
        file inside the project. `project` names the project for a file check. A
        pipeline that does not pass is a normal answer: `valid` is false and `errors`
        lists every problem found. A request that cannot be read, such as one that
        gives both a body pipeline and a file, is a 400. A file that does not exist
        is reported in `errors`. Read-only in effect; a federated peer needs the
        autonomous read capability.
      operationId: autonomousMergePipelineValidate
      tags: [Autonomous]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergePipelineValidateRequest"
      responses:
        "200":
          description: The result of the check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergePipelineValidation"
        "400": {description: "The body is not valid JSON, has no pipeline and no file, gives both, or names a file outside the project"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "404": {description: The project has no directory on this daemon}
        "405": {description: Method not allowed}
        "503": {description: The daemon configuration is not available}

  /api/autonomous/release-readiness:
    get:
      summary: Release readiness of one size, judged from the stored shadow-merge comparisons
      description: |
        Judges whether a release of the given size is ready, from the stored
        shadow-merge comparisons: how many of the plans held up against the
        landed state, how many of those merges would have had conflicts, how
        many of them touched the PWA, and whether any comparison found a
        defect that blocks the release. The bar is the default (10 records,
        2 conflicts, 2 PWA changes). A size with no comparisons is not
        hidden: the answer is the same full shape with zero counts and a
        sentence for each short condition. `project` keeps only the
        comparisons whose plan belongs to that project. Read-only; needs the
        autonomous read capability when called by a federated peer.
      operationId: releaseReadiness
      tags: [Autonomous]
      parameters:
        - {name: size, in: query, required: true, description: "The release size to judge; required", schema: {type: string, enum: [patch, minor, major]}}
        - {name: project, in: query, required: false, description: "Optional. Keep only the comparisons whose plan belongs to this project", schema: {type: string}}
      responses:
        "200":
          description: The readiness for the size, zeros included
          content:
            application/json:
              schema:
                type: object
                properties:
                  size: {type: string, description: The size that was evaluated}
                  project: {type: string, description: The project filter applied, empty when none}
                  readiness: {$ref: "#/components/schemas/ReleaseReadiness"}
                  bar: {$ref: "#/components/schemas/ReleaseReadinessBar"}
        "400": {description: size is missing or not patch, minor or major; the error names the size it got}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed}
        "500": {description: The comparison or plan store exists but cannot be read}
        "503": {description: The daemon configuration is not available}

  /api/autonomous/repo-ci-watch:
    get:
      summary: Repo CI watch state
      description: |
        The repo CI watch state at a glance: the mode in effect (`mode`, off / shadow /
        on), the alert threshold currently in force (`alert_minutes`, whole minutes,
        0 while the watch is off), the configured repository paths (`repos`; empty
        when nothing is watched), the instant the coordinator last polled
        (`last_poll_at`, the zero time when it never has), and the stored watch
        records (`records`, newest first: repository, ref, sha, workflow, run
        identity, status, classification, reruns, notes and verdict). `repo`
        narrows `records` to one repository path, `status` to one watch status
        (green, failing, pending, hung, rerunning, superseded); an unknown status
        is refused with a 400 that names the allowed values. A read that matches
        nothing is an empty `records` array, not an error. Read-only; needs the
        autonomous read capability when called by a federated peer.
      operationId: autonomousRepoCIWatch
      tags: [Autonomous]
      parameters:
        - {name: repo, in: query, required: false, description: Only the records of this repository path, schema: {type: string}}
        - {name: status, in: query, required: false, description: "Only green, failing, pending, hung, rerunning or superseded", schema: {type: string, enum: [green, failing, pending, hung, rerunning, superseded]}}
      responses:
        "200":
          description: Repo CI watch state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoCIWatchList"
        "400": {description: status is not one of the watch statuses}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed}
        "503": {description: Autonomous is disabled}

  /api/autonomous/safe-to-delete:
    get:
      summary: Safe-to-delete report
      description: |
        The local Automaton work branches, and their worktrees, whose commits are all
        on main (or that have none), so an operator can review what is safe to clean
        up. Branches that are still pending, need a look, cannot be compared, or whose
        worktree has uncommitted changes are listed under `held`. The report only
        reads; nothing is deleted, merged or pushed. Only GET is served, and a
        federated peer needs the autonomous read capability.
      operationId: autonomousSafeToDelete
      tags: [Autonomous]
      responses:
        "200":
          description: Safe-to-delete report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafeDeleteReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed}
        "500": {description: The branches could not be listed}
        "503": {description: Autonomous is disabled, or no worktree base repo is configured for Automata}

  /api/autonomous/protected-paths:
    get:
      summary: Automaton protected-paths status
      description: |
        The protected-paths state of the Automata. Some files, such as the
        project rules file, the supervisor rules document, CODEOWNERS and the
        workflows directory, must not change inside an Automaton task without the
        operator. When a task commit changes one, `action` decides what happens.
        `action` (hold|warn|block|off) and `rules_source` (base_commit|worktree)
        are the settings in effect (`autonomous.automation.protected_paths_action`
        and `autonomous.automation.rules_review_source`). `paths` is the
        effective protected list (`autonomous.automation.protected_paths`; the
        default list when none is set). `held` lists every task held because its
        commit changed protected paths: `paths` the changed protected paths,
        `action` the action in force when the hold was raised, `reason` why,
        `question_id` the operator question that waits for an answer (approve,
        reject or change the spec), `since` when the hold was raised,
        `base_commit` the commit the task started from and `awaiting_spec_change`
        true once the operator chose to change the task instructions. `authorized`
        lists every Automaton that authorises protected paths in advance (see
        `POST /api/autonomous/prds/{id}/set_authorized_paths`). `paths`, `held`
        and `authorized` are empty lists, never null. The read is built from the
        stored Automata and makes no git call. Read-only; only GET is served, and
        a federated peer needs the autonomous read capability.
      operationId: autonomousProtectedPaths
      tags: [Autonomous]
      parameters:
        - name: automaton
          in: query
          required: false
          schema: {type: string}
          description: Narrow the held and authorized lists to this Automaton id. An id that matches nothing reads empty lists.
      responses:
        "200":
          description: Protected-paths status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedPathsStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405":
          description: Method not allowed; only GET is served
          headers:
            Allow:
              schema: {type: string, example: GET}
        "503": {description: Autonomous is disabled}

  /api/autonomous/security-failures:
    get:
      summary: Security failure reports
      description: |
        The stored security failure reports, newest first, as a list. Each entry
        names the failing security run it belongs to (repository, ref kind and name,
        workflow, run ID, run URL and watch status) and carries the report stored for
        it under `report`: the dependency, the advisory identifiers, the fixed
        version, the accepted-risk registry result, the recommendation and the mode
        and action the Automaton line received. `repo` narrows the list to one
        repository path, `status` to one watch status (green, failing, pending, hung,
        rerunning, superseded); an unknown status is refused with a 400 that names
        the allowed values. A read that matches nothing is an empty array, not an
        error. Read-only; needs the autonomous read capability when called by a
        federated peer.
      operationId: autonomousSecurityFailures
      tags: [Autonomous]
      parameters:
        - {name: repo, in: query, required: false, description: Only the reports of this repository path, schema: {type: string}}
        - {name: status, in: query, required: false, description: "Only green, failing, pending, hung, rerunning or superseded", schema: {type: string, enum: [green, failing, pending, hung, rerunning, superseded]}}
      responses:
        "200":
          description: Security failure reports, newest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/SecurityFailureEntry"}
        "400": {description: status is not one of the watch statuses}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed}
        "503": {description: Autonomous is disabled}

  /api/autonomous/cleanup:
    get:
      summary: Automation cleanup status
      description: |-
        The status of both Automaton cleanup passes, the disk readings behind
        them and the rate-limited disk alert. `worktrees` is the
        finished-worktrees pass (owned vs net finished entries, removal or
        dry-run counts, bytes freed, last error); `temp` the daemon temp-file
        sweep. `worktree_disk` and `temp_disk` (when present) are the disk
        readings behind the two passes; a pass that has not run has no
        reading. `disk_alert_percent` is the threshold in effect,
        `disk_alert` whether the rate-limited alert (once per
        autonomous.automation.disk_alert_interval_minutes, default 60) is
        currently due, `last_disk_alert_at` the last fire (null until then).
        The status comes from the in-memory watch, so a read never scans the
        disk again. Read-only; needs the autonomous read capability when
        called by a federated peer.
      operationId: autonomousCleanup
      tags: [Autonomous]
      responses:
        "200":
          description: Cleanup status
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CleanupStatus"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed}
        "503": {description: Autonomous is disabled}

  /api/autonomous/uncommitted-work:
    get:
      summary: Automaton uncommitted-work status
      description: |
        The uncommitted-work holds of the Automata. After a task finishes in an
        Automaton that commits its own work, the worktree must be clean; when
        files are still uncommitted the policy decides what happens. `policy`
        (hold|warn|off) and `scope` (task_files|worktree) are the settings in
        effect (`autonomous.automation.uncommitted_work_policy` and
        `autonomous.automation.uncommitted_work_scope`). `held` lists every task
        and every Automaton currently held: `kind` is `task` for a hold on one
        task and `worktree` for files no single task owns, `files` the held
        paths, `outside_scope` the subset the task did not declare, `reason` why
        the hold was raised, `question_id` the operator question that waits for
        an answer (commit, discard or retry) and `held_at` when the hold was
        raised. `held` is an empty list, never null, when nothing is held or the
        `automaton` filter matches nothing. The read is built from the stored
        Automata and makes no git call. Read-only; only GET is served, and a
        federated peer needs the autonomous read capability.
      operationId: autonomousUncommittedWork
      tags: [Autonomous]
      parameters:
        - name: automaton
          in: query
          required: false
          schema: {type: string}
          description: Narrow the list to the holds of this Automaton id. An id that matches nothing reads an empty list.
      responses:
        "200":
          description: Uncommitted-work status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UncommittedWorkStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405":
          description: Method not allowed; only GET is served
          headers:
            Allow:
              schema: {type: string, example: GET}
        "503": {description: Autonomous is disabled}

  /api/autonomous/request-watch:
    get:
      summary: Request watch status
      description: |
        The in-flight model request of the worker and verifier sessions of
        running Automata whose model runs on a registered compute node, so a
        hung request can be told from a slow one. `enabled`, `poll_seconds` and
        `no_progress_minutes` are the settings in effect
        (`autonomous.request_watch`). `observations` holds one entry per watched
        session: `state` is `generating`, `idle`, `unreachable` or `unknown`
        (before the first sample), `last_change` when the node last showed a
        sign of progress, `no_progress_seconds` how long it has not, `last_poll`
        when the node was last read, `over_threshold` whether the no-progress
        time has reached `no_progress_minutes`, `error` why a node could not be
        read (absent when it could) and `summary` a plain-text line. The watch
        is observation only: it makes no model call and never ends a worker,
        retries it on another backend or unloads a model. `observations` is an
        empty list, never null, when nothing is watched, the feature is
        disabled, or a filter matches nothing. Read-only; only GET is served,
        and a federated peer needs the autonomous read capability.
      operationId: autonomousRequestWatch
      tags: [Autonomous]
      parameters:
        - name: session
          in: query
          required: false
          schema: {type: string}
          description: Narrow the list to this session id. An id that matches nothing reads an empty list.
        - name: automaton
          in: query
          required: false
          schema: {type: string}
          description: Narrow the list to the sessions of this Automaton id. An id that matches nothing reads an empty list.
      responses:
        "200":
          description: Request watch status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestWatchStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405":
          description: Method not allowed; only GET is served
          headers:
            Allow:
              schema: {type: string, example: GET}
        "503": {description: The request watch is not running}

  /api/autonomous/supervisor-watch:
    get:
      summary: Supervisor watch state
      description: |
        The supervisor watch state at a glance: the mode in effect (`mode`,
        off / shadow / on; an unset mode reads shadow — the release default,
        reports only, never acts), the instant the coordinator last polled
        (`last_poll_at`, the zero time when it never has), the stored findings
        (`findings`, open first, most recently seen first: kind, subject, the
        operator line, first and last seen, the shadow would-alert mark and the
        raised-alert instant), and the comparison view (`comparison`: the last
        recorded comparison against the script's record file, the days of full
        agreement, and the last comparison's one-sided differences; an
        unavailable script record is never recorded, so `last` is `null` until
        one was). Read-only; needs the autonomous read capability when called
        by a federated peer.
      operationId: autonomousSupervisorWatch
      tags: [Autonomous]
      responses:
        "200":
          description: Supervisor watch state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupervisorWatchStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed}
        "503": {description: Autonomous is disabled}

  /api/autonomous/supervisor-watch/stats:
    get:
      summary: Supervisor watch stats
      description: |
        The supervisor watch as numbers for monitoring: the mode in effect
        (`mode`), the instant the coordinator last polled (`last_poll_at`) and
        how many seconds ago (`last_poll_age_seconds`, -1 when it never has),
        the unresolved findings (`findings_open`, of which `findings_would_alert`
        shadow marked alert-due and `findings_alerted` raised an alert), the
        resolved ones (`findings_resolved`) and the days of full agreement with
        the supervisor script (`agreed_days`). The same numbers ride in the
        stats snapshot (`supervisor_watch_*`) and the Prometheus gauges
        `datawatch_supervisor_watch_findings`, `datawatch_supervisor_watch_agreed_days`
        and `datawatch_supervisor_watch_last_poll_age_seconds`. Read-only; needs
        the autonomous read capability when called by a federated peer.
      operationId: autonomousSupervisorWatchStats
      tags: [Autonomous]
      responses:
        "200":
          description: Supervisor watch stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupervisorWatchStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed}
        "503": {description: Autonomous is disabled}

  /api/supervisor-loop/jobs:
    get:
      summary: Supervisor loop jobs
      description: |
        The supervisor loop's jobs: the loop's enabled state (`enabled`) and, per
        job, its name, kind (`mechanical` step or `model` job), the model job's
        style, backend and model, whether the job is enabled, and its last outcome
        and run instant. Read-only; needs the autonomous read capability when
        called by a federated peer.
      operationId: supervisorLoopJobs
      tags: [Autonomous]
      responses:
        "200":
          description: Supervisor loop jobs
          content:
            application/json:
              schema: {type: object}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed}

  /api/supervisor-loop/runs:
    get:
      summary: Supervisor loop run records
      description: |
        The loop's stored run records, newest first: job, style, backend, model,
        outcome (`ok`, `validator_failed`, `escalated` or `error`), result,
        validator failures, retries, escalations, duration and started instant.
        Filters: `job`, `outcome`, `limit` (1..500, default 50). Read-only; needs
        the autonomous read capability when called by a federated peer.
      operationId: supervisorLoopRuns
      tags: [Autonomous]
      parameters:
        - {name: job, in: query, required: false, schema: {type: string}}
        - {name: outcome, in: query, required: false, schema: {type: string, enum: [ok, validator_failed, escalated, error]}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500}}
      responses:
        "200":
          description: Supervisor loop run records
          content:
            application/json:
              schema: {type: object}
        "400": {description: A filter value is not valid}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed}

  /api/supervisor-loop/stats:
    get:
      summary: Supervisor loop stats
      description: |
        The supervisor loop as numbers for monitoring: whether it is on
        (`enabled`), its job count (`jobs`) and enabled jobs (`jobs_enabled`), the
        stored runs (`runs`) split by outcome (`runs_ok`, `runs_validator_failed`,
        `runs_escalated`, `runs_error`), the retries used (`retries`) and how many
        seconds ago the last run started (`last_run_age_seconds`, -1 when none has
        run). The same numbers ride in the stats snapshot (`supervisor_loop_*`),
        the Monitor tab's Supervisor loop card and the Prometheus gauges
        `datawatch_supervisor_loop_runs`, `datawatch_supervisor_loop_jobs_enabled`
        and `datawatch_supervisor_loop_last_run_age_seconds`. Read-only; needs the
        autonomous read capability when called by a federated peer.
      operationId: supervisorLoopStats
      tags: [Autonomous]
      responses:
        "200":
          description: Supervisor loop stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupervisorLoopStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed}

  /api/supervisor-loop/jobs/{name}/run:
    post:
      summary: Run one supervisor loop job now
      description: |
        Runs the named job once and returns its result; the run is recorded like
        any other. The body may carry `input` (text for the job) and `candidates`
        (a list, for the model jobs that choose among candidates). An unknown job
        name is a 404. Needs the autonomous run capability when called by a
        federated peer.
      operationId: supervisorLoopRunJob
      tags: [Autonomous]
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                input: {type: string}
                candidates: {type: array, items: {type: string}}
      responses:
        "200":
          description: The run's result (`job`, `ok`, `result`, and `error` when it failed)
          content:
            application/json:
              schema: {type: object}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous run capability}
        "404": {description: Unknown job}
        "405": {description: Method not allowed}
        "503": {description: The supervisor loop is not running}

  /api/supervisor-loop/eval:
    post:
      summary: Evaluate a supervisor loop model job
      description: |
        Runs a model job's eval cases against each listed model and returns, per
        model, the cases, passed count, validator failures, retries, median and
        maximum duration and escalations. When no listed model is reachable the
        answer is a 502 naming each. Needs the autonomous run capability when
        called by a federated peer.
      operationId: supervisorLoopEval
      tags: [Autonomous]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job, models]
              properties:
                job: {type: string, enum: [draft_spec, classify_ci_failure, pick_backend]}
                models: {type: array, items: {type: string}}
                cases_dir: {type: string}
      responses:
        "200":
          description: The per-model eval report
          content:
            application/json:
              schema: {type: object}
        "400": {description: Bad job, models or cases_dir}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous run capability}
        "405": {description: Method not allowed}
        "502": {description: No listed model is reachable}
        "503": {description: The supervisor loop is not running}

  /api/autonomous/pending-items:
    get:
      summary: Automaton pending items
      description: |
        The pending item registry. A pending item is a named piece of work that has
        no Automaton yet; an Automation can carry it as a member and holds at it
        until an Automaton is attached. The reply holds `policy` (hold|skip) and
        `auto_resume` in effect (`autonomous.automation.pending_item_policy` and
        `autonomous.automation.pending_item_auto_resume`), `source` (the file
        registry settings in effect; `configured` is false while no path is set),
        `last_refresh` (when the file registry was last read, with the counts, or
        the error), `items` (every item with the Automations that carry it) and
        `held` (every Automation waiting on a waiting item right now, with since
        when and why). `items` and `held` are empty lists, never null. The optional
        `state` filter keeps the items in one state; an unknown word is refused with
        400. The optional `automation_id` filter keeps the items one Automation
        carries and its holds. Read-only; a federated peer needs the autonomous
        read capability.
      operationId: autonomousPendingItems
      tags: [Autonomous]
      parameters:
        - name: state
          in: query
          required: false
          schema: {type: string, enum: [waiting, attached, done]}
          description: Keep only the items in this state.
        - name: automation_id
          in: query
          required: false
          schema: {type: string}
          description: Keep only the items this Automation carries as members, and only its holds. An id that matches nothing reads empty lists.
      responses:
        "200":
          description: The pending item registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingItemsReply"
        "400": {description: "400: state must be waiting, attached or done"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed; GET and POST are served}
        "503": {description: Autonomous is disabled, or the pending item registry is unavailable}
    post:
      summary: Record a waiting pending item
      description: |
        Records a new pending item in the waiting state. The daemon generates the
        id (8 hex characters). `title` must not be blank and must not be longer than 300
        characters. `ref` is an optional
        outside label, free text. The reply is the new item. Any other
        method is a 405. A federated peer needs the autonomous write capability.
      operationId: autonomousPendingItemCreate
      tags: [Autonomous]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: {type: string, description: "The name of the work; must not be blank and at most 300 characters"}
                ref: {type: string, description: "Optional outside label for the item, for example the id it has in a file registry"}
                actor: {type: string, description: "Who is acting (audit log); defaults to operator"}
      responses:
        "201":
          description: The new item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingItem"
        "400": {description: "400: the title is blank, the title is longer than 300 characters, or the body is not valid JSON"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous write capability}
        "405": {description: Method not allowed; GET and POST are served}
        "503": {description: Autonomous is disabled, or the pending item registry is unavailable}

  /api/autonomous/pending-items/{id}/attach:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Pending item ID (8 hex characters)"}
    post:
      summary: Attach an Automaton to a pending item
      description: |
        Attaches an Automaton to a waiting pending item. Every Automation member
        that waits on the item is converted in place into an ordinary Automaton
        member for that Automaton (same position, edges and status; the member keeps
        the item id as a note of where it came from), and a held insert for the item
        is converted the same way. The item moves from waiting to attached. An
        Automation that was blocked on the member resumes when
        `autonomous.automation.pending_item_auto_resume` is on; when it is off the
        Automation stays blocked and `notes` says so. The Automaton must exist (404 otherwise). It
        must not be a template, a child of another Automaton, already attached to
        another pending item or already a member of an Automation; each of those is
        a 409. A missing `automaton_id` is a 400. A federated peer needs the autonomous write
        capability.
      operationId: autonomousPendingItemAttach
      tags: [Autonomous]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [automaton_id]
              properties:
                automaton_id: {type: string, description: "The Automaton to attach"}
                actor: {type: string, description: "Who is acting (audit log); defaults to operator"}
      responses:
        "200":
          description: What the attach did
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingItemAttachResult"
        "400": {description: "400: automaton_id is missing"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous write capability}
        "404": {description: "404: the pending item or the Automaton does not exist"}
        "405": {description: Method not allowed; only POST is served}
        "409": {description: "409: the item is not waiting (attaching twice is refused), or the Automaton cannot be attached because it is a template, a child Automaton run by its parent, already attached to another pending item, or already a member of an Automation"}
        "503": {description: Autonomous is disabled, or the pending item registry is unavailable}

  /api/autonomous/pending-items/refresh:
    post:
      summary: Read the pending item file registry now
      description: |
        Reads the file registry (`autonomous.automation.pending_item_source.path`)
        now instead of waiting for the next daemon start. A new row becomes a waiting
        item with source file; a row whose title changed updates the title; a row
        whose state is one of the done values moves the item to done; an item whose
        row disappeared follows `pending_item_source.on_missing_row` (keep leaves it,
        drop removes it while it is still waiting and belongs to no Automation). The
        daemon only reads the file, it never writes to it. The body is ignored. With
        no registry path set the reply says `configured` is false and nothing
        changes. A file that cannot be read is reported in `error` and leaves the
        registry as it was. Reading an unchanged file changes nothing. A federated
        peer needs the autonomous write capability.
      operationId: autonomousPendingItemsRefresh
      tags: [Autonomous]
      responses:
        "200":
          description: What the read did
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingItemRefreshResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous write capability}
        "405": {description: Method not allowed; only POST is served}
        "503": {description: Autonomous is disabled, or the pending item registry is unavailable}

  /api/autonomous/progress:
    get:
      summary: Progress metrics
      description: |
        The one metrics object every surface returns: counts by kind (feature, bug,
        other) and in total, throughput per active day, worker utilization, lead time
        per stage, the inactive windows left out of every rate, the remaining work
        split into known records and estimated work, and the completion range in days
        with the method behind each figure. The backlog is read from the configured
        path; a missing file gives `backlog_available: false`, not an error. Explicit
        inactive windows are read from `operator-wait-windows.tsv` next to the backlog
        file. `since` falls back to the configured date, then to the first record's
        creation date. Needs the autonomous read capability when called by a federated
        peer.
      operationId: autonomousProgress
      tags: [Autonomous]
      parameters:
        - {name: automation_id, in: query, required: false, description: Count only the Automata of this Automation, schema: {type: string}}
        - {name: tag_id, in: query, required: false, description: Count only the Automata carrying this tag, schema: {type: string}}
        - {name: since, in: query, required: false, description: "First day counted, YYYY-MM-DD", schema: {type: string, format: date}}
        - {name: until, in: query, required: false, description: "Last day counted, YYYY-MM-DD, inclusive", schema: {type: string, format: date}}
      responses:
        "200":
          description: Metrics object
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated_at: {type: string, format: date-time}
                  since: {type: string, format: date-time}
                  scope: {type: string, description: "all, automation:<id>, tag:<id> or the two joined with +"}
                  calendar_days: {type: number}
                  active_days: {type: number}
                  lanes: {type: integer}
                  groups: {type: object, description: "feature, bug and other, each a count block", additionalProperties: {type: object}}
                  totals: {type: object, description: Count block over all kinds}
                  completed_prds: {type: integer}
                  running_prds: {type: integer}
                  throughput: {type: object}
                  utilization: {type: object}
                  lead_time: {type: object}
                  inactive: {type: object}
                  remaining: {type: object, description: "known, estimated and combined remaining work"}
                  completion: {type: object, description: "Completion range in days (low_days, high_days) with drivers and the method behind each figure"}
                  unfiled_rows: {type: array, items: {type: object}}
                  backlog_available: {type: boolean}
                  not_measured: {type: array, items: {type: string}}
        "400": {description: Invalid since or until, or until before since}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed}
        "503": {description: Autonomous is disabled}

  /api/autonomous/progress/trend:
    get:
      summary: Progress trend
      description: |
        The saved daily snapshots reduced to the figures the trend view plots, oldest
        first, and the way the completion range is moving (`converging`, `widening`,
        `flat` or `unknown`). Without saved snapshots the list is empty and the
        direction is `unknown`. Needs the autonomous read capability when called by a
        federated peer.
      operationId: autonomousProgressTrend
      tags: [Autonomous]
      parameters:
        - {name: days, in: query, required: false, description: "How many days back to read, 1 to 365 (default 30)", schema: {type: integer, minimum: 1, maximum: 365, default: 30}}
      responses:
        "200":
          description: Trend over the saved snapshots
          content:
            application/json:
              schema:
                type: object
                properties:
                  days: {type: integer}
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        date: {type: string, format: date}
                        reason: {type: string, description: "daily or milestone"}
                        completion_low_days: {type: number, nullable: true}
                        completion_high_days: {type: number, nullable: true}
                        known_tasks: {type: integer}
                        estimated_tasks: {type: number}
                        throughput_3d: {type: number}
                        utilization: {type: number}
                        completed_prds: {type: integer}
                  direction: {type: string, enum: [converging, widening, flat, unknown]}
        "400": {description: days is not a whole number from 1 to 365}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed}
        "503": {description: Autonomous is disabled}

  /api/autonomous/timeline:
    get:
      summary: Timeline chart
      description: |
        Read-only interval chart of the Automata that moved in the last N days:
        one project at a time, each with its Automata, each with its stages and
        tasks as bars with their start and end, blocked and waiting intervals with
        their reason, and the projected finish with the reason behind it. `today`
        is the server clock; `counts` totals what the chart shows. Optional query
        `project`, `automaton` (id or title — with it only that Automaton's chart
        comes back), `stage` (id or title), `kind` (`feature`, `bug` or `other`)
        and `tag`; every parameter optional, an unknown value comes back as an
        empty chart, not an error. Changes no state. Needs the autonomous read
        capability when called by a federated peer.
      operationId: autonomousTimeline
      tags: [Autonomous]
      parameters:
        - {name: project, in: query, required: false, description: Only the Automata of this project directory, schema: {type: string}}
        - {name: automaton, in: query, required: false, description: Only this Automaton, by id or title, schema: {type: string}}
        - {name: stage, in: query, required: false, description: Only this stage (story), by id or title, schema: {type: string}}
        - {name: kind, in: query, required: false, description: Only Automata of this kind, schema: {type: string, enum: [feature, bug, other]}}
        - {name: tag, in: query, required: false, description: Only the Automata carrying this tag, schema: {type: string}}
      responses:
        "200":
          description: The timeline chart. Empty `projects` (an array) when nothing matches.
          content:
            application/json:
              schema:
                type: object
                properties:
                  today: {type: string, format: date-time, description: The server clock the chart is drawn against}
                  projects:
                    type: array
                    items:
                      type: object
                      properties:
                        project: {type: string}
                        automata:
                          type: array
                          items:
                            type: object
                            properties:
                              id: {type: string}
                              title: {type: string}
                              project: {type: string}
                              kind: {type: string, enum: [feature, bug, other]}
                              tags: {type: array, items: {type: string}}
                              status: {type: string}
                              start: {type: string, format: date-time, nullable: true}
                              end: {type: string, format: date-time, nullable: true, description: Set only when the Automaton is finished}
                              stages:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id: {type: string}
                                    title: {type: string}
                                    status: {type: string}
                                    start: {type: string, format: date-time, nullable: true}
                                    end: {type: string, format: date-time, nullable: true, description: Set only when the stage is done}
                                    members:
                                      type: array
                                      items:
                                        type: object
                                        properties:
                                          id: {type: string}
                                          title: {type: string}
                                          status: {type: string}
                                          start: {type: string, format: date-time, nullable: true}
                                          end: {type: string, format: date-time, nullable: true}
                                          intervals: {type: array, items: {type: object, description: "kind (blocked or waiting), start, end (null while open), reason"}}
                              intervals: {type: array, items: {type: object, description: "kind (blocked or waiting), start, end (null while open), reason"}}
                              projected_finish: {type: string, format: date-time, nullable: true}
                              projection_reason: {type: string, description: Why the projection is absent or "finished"}
                  counts:
                    type: object
                    properties:
                      projects: {type: integer}
                      automata: {type: integer}
                      stages: {type: integer}
                      members: {type: integer}
                      blocked: {type: integer}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed}
        "503": {description: Autonomous is disabled}

  /api/compute/served-models:
    get:
      summary: Models each compute node serves
      description: |
        Lists what every registered compute node serves, read from the node
        itself (Ollama and OpenCode nodes at `/api/tags`, OpenWebUI nodes at
        `/api/v1/models`). Answers are remembered for
        `autonomous.model_routing.served_models_cache_seconds` (default 300; 0
        reads the node every time) and the age of a remembered answer is
        reported. A node whose models cannot be read is listed with
        `known: false` and the reason in `error`. A disabled node is listed with
        `disabled: true` and is never read.

        With `model`, the answer also carries a `check`: whether any node serves
        that model. It comes from the same check an Automaton uses when a model
        or a node is pinned, so this answer and a refused pin always agree. The
        check honours `autonomous.model_routing.unknown_node_policy` for nodes
        whose models cannot be read. With `node` as well, only that node is
        checked.
      operationId: computeServedModels
      tags: [Compute]
      parameters:
        - {name: node, in: query, required: false, description: List one node only. An unknown name is a 404., schema: {type: string}}
        - {name: model, in: query, required: false, description: "Check whether a node serves this model (for example ollama/qwen3.8:27b). Adds the check object to the answer.", schema: {type: string}}
        - {name: backend, in: query, required: false, description: "Backend the model would run on. A backend that does not run on a compute node makes the check not applicable. Only used with model.", schema: {type: string}}
        - {name: refresh, in: query, required: false, description: "true reads every node now instead of using remembered answers, and replaces them.", schema: {type: boolean}}
      responses:
        "200":
          description: The served models of each node, and the model check when model was given
          content:
            application/json:
              schema:
                type: object
                properties:
                  cache_seconds: {type: integer, minimum: 0, description: "How long a node's answer is remembered, from autonomous.model_routing.served_models_cache_seconds"}
                  refusal_mode: {type: string, enum: [refuse, warn], description: "What a pin does when no node serves its model, from autonomous.model_routing.refusal_mode"}
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        node: {type: string}
                        kind: {type: string, description: "Node kind, for example ollama"}
                        models: {type: array, items: {type: string}, description: Model names the node serves. Empty when unknown or disabled.}
                        known: {type: boolean, description: "False when the models could not be read"}
                        cached: {type: boolean, description: "True when the answer came from a remembered read"}
                        age_seconds: {type: integer, minimum: 0, description: "Age of a remembered answer; 0 for a fresh read"}
                        fetched_at: {type: string, format: date-time, description: "When the node was read. Empty for a disabled node"}
                        error: {type: string, description: "Why the models could not be read. Empty when known"}
                        disabled: {type: boolean, description: "Present and true for a disabled node, which is not read"}
                  check:
                    type: object
                    description: Present only when model was given.
                    properties:
                      model: {type: string}
                      applicable: {type: boolean, description: "False when the backend does not run on a compute node. Nothing is refused then"}
                      refused: {type: boolean, description: "True when no node serves the model"}
                      node_unknown: {type: boolean, description: "True when the node argument is not a registered node"}
                      served_by: {type: array, items: {type: string}, description: Nodes that serve the model, or are assumed to under unknown_node_policy.}
                      checked:
                        type: array
                        items:
                          type: object
                          properties:
                            node: {type: string}
                            state: {type: string, enum: [serves, not_serving, unknown]}
                            reason: {type: string}
                      message: {type: string, description: "For a refusal, names the model and the nodes checked"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the compute read capability}
        "404": {description: The node named in node is not registered}
        "405": {description: Method not allowed}
        "503": {description: The compute registry or the served-models cache is not available}

  /api/compute/nodes:
    get:
      summary: List compute nodes
      description: 'The registered nodes plus two additive reports. observed_peers lists observer peers that no node is bound to (name and shape); submitting the add-node request for one makes it disappear. unanswered_auto_created lists nodes marked auto_created whose address has never answered a probe (name, address, kind, created_at); nothing is deleted or disabled automatically. Both keys are always present, as empty arrays when there is nothing to report.'
      operationId: computeNodeList
      tags: [Compute]
      responses:
        "200":
          description: Nodes and reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items: {type: object}
                  observed_peers:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        shape: {type: string}
                  unanswered_auto_created:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        address: {type: string}
                        kind: {type: string}
                        created_at: {type: string, format: date-time}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the compute read capability}
        "503": {description: The compute registry is not available}

  /api/compute/nodes/{name}:
    get:
      summary: Fetch one compute node
      description: 'The node record. session_slots is the operator''s slot override for a node that hosts a local engine; 0 means the count is derived from observer GPU data. The verifier settings are nullable: an absent verifier_slots (or verifier_min_free_mem_mb) means "unset" — the node then hosts one verifier slot if it runs a local engine, else none, and the 1024 MB headroom default applies; an explicit 0 verifier_slots means no verifier slots.'
      operationId: computeNodeGet
      tags: [Compute]
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The node record
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: {type: string}
                  kind: {type: string}
                  max_concurrent_sessions:
                    type: integer
                    minimum: 0
                    description: Ceiling on autonomous sessions in flight on the node (0 = unlimited).
                  session_slots:
                    type: integer
                    minimum: 0
                    description: Operator-set worker count (0 = derive from observer GPU data, one slot per GPU limited by free GPU memory). Capped by max_concurrent_sessions when that is set.
                  verifier_slots:
                    type: integer
                    minimum: 0
                    nullable: true
                    description: Worker slots for verifiers on the node; absent when unset (1 if the node hosts a local engine, else 0), 0 when the operator set none.
                  verifier_min_free_mem_mb:
                    type: integer
                    minimum: 0
                    nullable: true
                    description: Free GPU memory in MB required before a new verifier slot starts here; absent when unset (1024 MB), 0 when the operator turned the check off.
                  verifier_context_mb:
                    type: integer
                    minimum: 0
                    description: Extra context memory in MB one verifier slot holds; used to size the advice figure from the node's free GPU memory. 0 = none.
                  verify_tls:
                    type: boolean
                    description: When true, model pulls to this node verify its https certificate against the system roots. Always returned, including an explicit false. Default false.
    put:
      summary: Replace one compute node
      description: 'Replaces the whole node. Omitting session_slots clears the override, omitting the verifier settings resets them to their defaults, and omitting max_concurrent_sessions clears the ceiling. A verifier_slots above 1 is refused with 409 unless the node''s fresh headroom measurement supports it (the message names the node, the measured free memory and the shortfall). Omitting verify_tls sets it to false. Negative verifier values are refused ("compute node: verifier_slots %d must be >= 0" and the like).'
      operationId: computeNodePut
      tags: [Compute]
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                max_concurrent_sessions: {type: integer, minimum: 0}
                session_slots: {type: integer, minimum: 0, description: Operator-set worker count; 0 derives the count from observer GPU data.}
                verifier_slots: {type: integer, minimum: 0, nullable: true, description: Worker slots for verifiers on the node; absent = unset (1 if the node hosts a local engine, else 0), 0 = no verifier slots.}
                verifier_min_free_mem_mb: {type: integer, minimum: 0, nullable: true, description: Free GPU MB required before a new verifier slot starts; absent = 1024 MB, 0 = check off.}
                verifier_context_mb: {type: integer, minimum: 0, description: Extra context MB one verifier slot holds, used to size the advice figure (0 = none).}
                verify_tls: {type: boolean, description: When true, model pulls to this node verify its https certificate against the system roots. Default false. Update replaces the whole node so omitting it means false.}
      responses:
        "200":
          description: The updated node record
        "409":
          description: verifier_slots above 1 is not supported by the node's fresh headroom measurement; nothing is saved and the effective cap stays 1

  /api/compute/nodes/{name}/headroom:
    get:
      summary: Stored headroom measurement of a compute node
      description: |
        Reads the last headroom measurement stored for the node, with its age,
        whether it is still fresh under the configured age bound and the verifier
        cap it supports. Read only: nothing is measured. The measurement is taken
        only by the POST on this path, on demand.
      operationId: computeNodeHeadroomGet
      tags: [Compute]
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The stored measurement and its view
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    node: {type: string}
                    free_mb: {type: integer, description: "Free memory on the node with its resident model loaded (free GPU MB when the node reports GPUs, else free system MB)."}
                    per_request_mb: {type: integer, description: "Memory one extra parallel request needs, from the observer or one probe request."}
                    resident_model: {type: string}
                    measured_at: {type: string, format: date-time}
                    age_seconds: {type: integer, minimum: 0, description: "Seconds since the measurement."}
                    fresh: {type: boolean, description: "True while the measurement is within autonomous.verifier_headroom_max_age_hours."}
                    min_free_mb: {type: integer, minimum: 0, description: "The configured free-memory floor (autonomous.verifier_min_free_mem_mb; 0 = check off)."}
                    max_age_hours: {type: integer, minimum: 0, description: "The configured age bound in hours (24 when unset)."}
                    supported_cap: {type: integer, minimum: 0, description: "The verifier cap this measurement supports: 1 when stale or the floor leaves no room, 0 when unbounded (zero per-request cost), else the largest cap that fits."}
        "404":
          description: The node has never been measured.
        "503":
          description: The headroom store is not wired.
    post:
      summary: Measure a compute node's headroom now (idle nodes only)
      description: |
        Measures the node on demand and stores the result in the daemon's one
        headroom store, which the verifier_slots write gate and the admission
        gate read. It never runs on a timer. A node holding any lease is refused
        with 409 (the measurement is idle-only). The probe model and the resident
        model must both be pull-allowed under autonomous.model_pull_consent, or
        the measurement is refused with 403. Sends one small request to the node
        unless the observer reports a per-request figure.
      operationId: computeNodeHeadroomMeasure
      tags: [Compute]
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The measurement just taken, stored, with its view
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    node: {type: string}
                    free_mb: {type: integer, description: "Free memory on the node with its resident model loaded (free GPU MB when the node reports GPUs, else free system MB)."}
                    per_request_mb: {type: integer, description: "Memory one extra parallel request needs, from the observer or one probe request."}
                    resident_model: {type: string}
                    measured_at: {type: string, format: date-time}
                    age_seconds: {type: integer, minimum: 0, description: "Seconds since the measurement."}
                    fresh: {type: boolean, description: "True while the measurement is within autonomous.verifier_headroom_max_age_hours."}
                    min_free_mb: {type: integer, minimum: 0, description: "The configured free-memory floor (autonomous.verifier_min_free_mem_mb; 0 = check off)."}
                    max_age_hours: {type: integer, minimum: 0, description: "The configured age bound in hours (24 when unset)."}
                    supported_cap: {type: integer, minimum: 0, description: "The verifier cap this measurement supports: 1 when stale or the floor leaves no room, 0 when unbounded (zero per-request cost), else the largest cap that fits."}
        "409":
          description: The node holds a lease (it is busy). Nothing is measured or stored. The body names the node and the held count.
          content:
            application/json:
              schema: {type: object, properties: {error: {type: string}, node: {type: string}, held: {type: integer}}}
        "403":
          description: No pull-allowed model is served by the node, or its resident model is not pull-allowed (autonomous.model_pull_consent). Nothing is measured.
          content:
            application/json:
              schema: {type: object, properties: {error: {type: string}, node: {type: string}}}
        "404":
          description: Unknown compute node (on POST), or no measurement stored yet (on GET).
        "502":
          description: The probe could not read the node or its request failed.
        "503":
          description: The headroom store or the node registry is not wired.

  /api/compute/nodes/{name}/detail:
    get:
      summary: Compute node detail from the observer
      description: Pulls the node's monitoring snapshot (or the cached observer snapshot) and adds the slot figures — the executor pair (session_slots, derived_slots) and, beside it, the verifier pair (the verifier settings and the daemon's last-seen verifier admission state). The observer fields are passed through unchanged. The reader-backed figures (verifier_slots_effective, suggested_verifier_slots, headroom_ok, headroom_reason, free_gpu_mb) are absent until the daemon's capacity wiring has synced the node.
      operationId: computeNodeDetail
      tags: [Compute]
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The observer snapshot with the slot figures added
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_slots:
                    type: integer
                    minimum: 0
                    description: The operator's slot override (0 = derive).
                  derived_slots:
                    type: integer
                    minimum: 0
                    description: The slot count in effect, the node's pool limit. Equals session_slots when that is set. Absent when the node has no pool limit yet.
                  executor_slots:
                    type: integer
                    minimum: 0
                    description: The same figure as derived_slots — the executor pair shown beside the verifier pair. Absent when the node has no pool limit yet.
                  verifier_slots:
                    type: integer
                    minimum: 0
                    nullable: true
                    description: The operator's verifier_slots; null when unset (1 if the node hosts a local engine, else 0 is effective).
                  verifier_slots_effective:
                    type: integer
                    minimum: 0
                    description: The verifier cap the daemon last applied for this node.
                  suggested_verifier_slots:
                    type: integer
                    minimum: 0
                    nullable: true
                    description: The advice figure for this node's free GPU data; null when there is no usable figure. Advice only — it is never applied automatically.
                  verifier_min_free_mem_mb:
                    type: integer
                    minimum: 0
                    nullable: true
                    description: The operator's setting; null when unset (1024 MB is effective).
                  verifier_min_free_mem_mb_effective:
                    type: integer
                    minimum: 0
                    description: The effective setting — 1024 MB when the operator left it unset.
                  verifier_context_mb:
                    type: integer
                    minimum: 0
                    description: The operator's verifier_context_mb (extra context MB one verifier slot holds).
                  headroom_ok:
                    type: boolean
                    description: Whether a new verifier slot would start under this node's free-GPU requirement.
                  headroom_reason:
                    type: string
                    description: Short reason for the headroom verdict (free vs required MB; "headroom check off" when the operator turned it off). Empty when there is no requirement and no data.
                  free_gpu_mb:
                    type: integer
                    minimum: 0
                    description: The node's free GPU memory in MB from the last sync.
        "503":
          description: The node has no monitoring endpoint and no cached observer snapshot

  /api/compute/nodes/{name}/versions:
    get:
      summary: Compute node backend versions
      description: |
        The node's reported backend version (with when it was recorded) and the
        per-capability minimums applied to it.
        Each capability row has the required minimum, `ok` (null when the
        version is unknown), `unknown` and a `reason`. An unknown version
        fails closed. The Ollama minimums are applied only to Ollama nodes
        (or legacy nodes whose version was probed against Ollama).
        The node must exist (404 otherwise). A federated peer needs the
        compute read capability.
      operationId: computeNodeBackendVersions
      tags: [Compute]
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The version rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: {type: string}
                  kind: {type: string}
                  address: {type: string}
                  backend: {type: string, description: "The backend the version belongs to; absent when none"}
                  backend_version: {type: string, description: "The reported version; empty when never recorded"}
                  version_probed_at: {type: string, format: date-time, description: "When the version was recorded; absent when never recorded"}
                  capabilities:
                    type: array
                    items:
                      type: object
                      properties:
                        capability: {type: string}
                        minimum: {type: string}
                        ok: {type: boolean, nullable: true, description: "Null when the version is unknown"}
                        unknown: {type: boolean}
                        reason: {type: string}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403": {description: Federated peer lacks the compute read capability}
        "404": {description: The node is not found}

  /api/capacity:
    get:
      summary: Capacity admission status
      description: Pools (host, node:<name>, llm:<name>) with limits and holders, active leases, and the queue of Automata tasks waiting for capacity with reasons.
      operationId: capacityStatus
      tags: [Autonomous]
      parameters:
        - {name: prd_id, in: query, required: false, description: Limit the tasks object to one Automaton, schema: {type: string}}
      responses:
        "200":
          description: Ledger snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  pools:
                    type: array
                    description: Pool rows. A pool with a rate ceiling also carries rate_requests, rate_tokens, rate_window_seconds, requests_in_window, tokens_in_window and rate_resets_at; a pool without one serialises as before.
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        limit: {type: integer}
                        held: {type: integer}
                        holders: {type: array, items: {type: string}}
                        holder_names:
                          type: array
                          items: {type: object, additionalProperties: true}
                          description: Resolved readable holder rows for a node pool; absent on older daemons.
                        usage:
                          allOf:
                            - {$ref: "#/components/schemas/NodeUsage"}
                          nullable: true
                          description: The node_usage object. Present on a node:<name> pool when the daemon reports per-node usage; the daemon prints a short line here per loaded model and GPU. Absent on host and llm pools and on older daemons.
                        verifier_limit:
                          type: integer
                          minimum: 0
                          description: The node's verifier pool (node-verify:<name>) limit, for node pools, alongside this pool's own limit and held. Absent until the node's verifier pool has a limit.
                        verifier_held:
                          type: integer
                          minimum: 0
                          description: The node's verifier pool (node-verify:<name>) held count, for node pools.
                        free_gpu_mb:
                          type: integer
                          minimum: 0
                          description: The node's last-seen free GPU memory in MB (daemon verifier admission cache); for node pools, absent until the node has been synced.
                        headroom_ok:
                          type: boolean
                          description: The last headroom verdict for new verifier work on this node; for node pools.
                        headroom_reason:
                          type: string
                          description: Short reason for that verdict (free vs required MB).
                  leases:
                    type: array
                    description: Held leases. node_unknown is true on a lease adopted after a daemon restart whose compute node could not be determined; it holds no node:<name> pool but still counts against its host and llm:<name> pools. Absent otherwise.
                    items:
                      type: object
                      properties:
                        node_unknown: {type: boolean, description: "True when the lease's compute node was expected and could not be determined at adoption. The lease holds no node pool. Absent when false"}
                  waiting: {type: array, items: {type: object}}
                  backoff:
                    type: array
                    description: Active usage back-off flags.
                    items:
                      type: object
                      properties:
                        backend: {type: string}
                        until: {type: string, format: date-time}
                        reason: {type: string}
                        reset_known:
                          type: boolean
                          description: False when the rate-limit message named no reset time and until is only the maximum back-off applied.
                  tasks:
                    type: object
                    description: Why each queued task is waiting and what each running task holds. Both arrays are always present.
                    properties:
                      waiting:
                        type: array
                        items:
                          type: object
                          properties:
                            task_id: {type: string}
                            prd_id: {type: string}
                            prd_title: {type: string}
                            task_title: {type: string}
                            cause: {type: string, enum: [pool_full, node_busy, backoff, budget, global_cooldown, await_external, await_decision, tree_lock, rate_ceiling]}
                            reason: {type: string, description: "Plain-language wait reason. A task parked on an open blocking worker question reads `await_decision: <question id>` (cause `await_decision`)."}
                            since: {type: string, format: date-time}
                            resets_at: {type: string, format: date-time, description: Present only when the daemon knows when the wait ends}
                            holder: {type: string, description: The task or session the wait depends on, when there is one}
                      running:
                        type: array
                        items:
                          type: object
                          properties:
                            task_id: {type: string}
                            prd_id: {type: string}
                            task_title: {type: string}
                            pools: {type: array, items: {type: string}}
                            node: {type: string}
                            session_id: {type: string}
                            since: {type: string, format: date-time}
                            note: {type: string, description: Sentence for a task parked while holding resources}

  /api/capacity/admission:
    get:
      summary: Capacity admission query
      description: Whether a start of the given backend would be admitted now, queued (with its position) or could use an alternate pool. Resolves the same host, llm and node pools a real start uses. Read-only - takes no lease and changes no state.
      operationId: capacityAdmission
      tags: [Autonomous]
      parameters:
        - {name: backend, in: query, required: true, description: Backend or named LLM to start (llm is accepted as an alias), schema: {type: string}}
        - {name: llm, in: query, required: false, description: Alias for backend, schema: {type: string}}
        - {name: node, in: query, required: false, description: Compute node the start would use, schema: {type: string}}
        - {name: model, in: query, required: false, description: Model wanted, schema: {type: string}}
        - {name: role, in: query, required: false, description: Dispatch role, schema: {type: string, enum: [worker, verifier, planner, interactive]}}
        - {name: priority, in: query, required: false, description: Integer queue priority; higher runs first, schema: {type: integer}}
        - {name: prd_id, in: query, required: false, description: Automaton the start would belong to, schema: {type: string}}
      responses:
        "200":
          description: Admission decision
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: {type: string, enum: [admit, queued, alternate_available]}
                  queue_position: {type: integer, description: 1-based; 0 when admitted}
                  reason: {type: string}
                  resets_at: {type: string, format: date-time}
                  alternates:
                    type: array
                    items:
                      type: object
                      properties:
                        pool: {type: string}
                        node: {type: string}
                        model: {type: string}
        "400":
          description: Missing or unknown backend, or an invalid priority or role
  /api/autonomous/prds/{id}/set_priority:
    post:
      summary: Set a PRD's capacity-queue priority
      description: >-
        Higher priority Automata are admitted first when compute capacity is
        contended. Default 0. The response is the updated Automaton and
        carries priority plus priority_source ("explicit") — an explicitly
        pinned priority always wins over the kind table for that Automaton.
        A non-integer value is refused with 400.
      operationId: autonomousPRDSetPriority
      tags: [Autonomous]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priority]
              properties:
                priority: {type: integer}
      responses:
        "200": {description: Updated PRD}

  /api/autonomous/prds/{id}/set_kind:
    post:
      summary: Set the kind of an Automaton
      description: |
        Sets the Automaton kind to `feature`, `bug` or `other`. An empty kind clears the
        setting, so the kind is derived again from the title and spec. The change is
        recorded on the decision timeline. Needs the autonomous write capability when
        called by a federated peer.
      operationId: autonomousPRDSetKind
      tags: [Autonomous]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: {type: string, enum: [feature, bug, other, ""]}
      responses:
        "200": {description: Updated Automaton}
        "400": {description: Unknown kind}
        "403": {description: Federated peer lacks the autonomous write capability}
        "404": {description: Unknown Automaton id}
        "405": {description: Method not allowed}

  /api/autonomous/prds/{id}/set_release_size:
    post:
      summary: Set the release size of an Automaton
      description: |
        Sets the explicit release size to `patch`, `minor`, `major` or `none`. An empty
        value clears the setting, so the size is resolved again from the Automation
        milestone rule, the project's kind-to-size map and the built-in default
        (feature = minor, bug = patch). An unknown size is refused and is never stored.
        The change is recorded on the decision timeline and audit-logged as
        `set_release_size`. Needs the autonomous write capability when called by a
        federated peer.
      operationId: autonomousPRDSetReleaseSize
      tags: [Autonomous]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [release_size]
              properties:
                release_size: {type: string, enum: [patch, minor, major, none, ""]}
      responses:
        "200": {description: Updated Automaton}
        "400": {description: Unknown release size}
        "403": {description: Federated peer lacks the autonomous write capability}
        "404": {description: Unknown Automaton id}
        "405": {description: Method not allowed}

  /api/autonomous/prds/{id}/set_breaking_change:
    post:
      summary: Set or clear the breaking-change flag of an Automaton
      description: |
        Sets the breaking-change flag. A breaking change raises the Automaton's release to
        the major approval mode, so it is never merged quietly. `breaking_change` is
        required, so an omitted value is refused rather than clearing the flag. The
        change is recorded on the decision timeline and audit-logged as
        `set_breaking_change`. Needs the autonomous write capability when called by a
        federated peer.
      operationId: autonomousPRDSetBreakingChange
      tags: [Autonomous]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [breaking_change]
              properties:
                breaking_change: {type: boolean}
      responses:
        "200": {description: Updated Automaton}
        "400": {description: breaking_change missing or not a boolean}
        "403": {description: Federated peer lacks the autonomous write capability}
        "404": {description: Unknown Automaton id}
        "405": {description: Method not allowed}

  /api/autonomous/branch-refresh/stats:
    get:
      summary: Branch refresh numbers
      description: |
        Returns the daemon setting `autonomous.branch_refresh_enabled` and the
        behind limit in effect (`behind_limit`, 0 reads as 5), how many Automata
        have a recorded refresh (`tracked`) and how many of them ended in each
        result (`clean`, `conflict`, `skipped`, `error`), how many have
        refreshing stopped by a conflict (`stopped`) and how many carry a
        per-Automaton override (`override_on`, `override_off`). Needs the
        autonomous read capability when called by a federated peer.
      operationId: autonomousBranchRefreshStats
      tags: [Autonomous]
      responses:
        "200":
          description: The branch refresh numbers
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: {type: boolean}
                  behind_limit: {type: integer}
                  tracked: {type: integer}
                  clean: {type: integer}
                  conflict: {type: integer}
                  skipped: {type: integer}
                  error: {type: integer}
                  stopped: {type: integer}
                  override_on: {type: integer}
                  override_off: {type: integer}
        "403": {description: Federated peer lacks the autonomous read capability}
        "405": {description: Method not allowed}
        "501": {description: The autonomous manager does not support the numbers}
        "503": {description: Autonomous is disabled}
  /api/autonomous/prds/{id}/branch-refresh:
    post:
      summary: Set or clear the branch refresh override of an Automaton
      description: |
        Sets the per-Automaton branch refresh override. `true` refreshes the
        Automaton's branch from its base between tasks even when the daemon
        setting `autonomous.branch_refresh_enabled` is off, `false` never
        refreshes it, and `null` clears the override so the daemon setting
        applies again. The reply is the Automaton record with its refresh state:
        `branch_refresh` (the last refresh, null when none has run),
        `branch_refresh_override` (true, false or null) and
        `branch_refresh_enabled` (the setting in effect for this Automaton).
        Setting the override also resets a refresh that a merge conflict
        stopped, so the next gap tries the merge again.
        Needs the autonomous write capability when called by a federated peer.
      operationId: autonomousPRDSetBranchRefreshOverride
      tags: [Autonomous]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean, nullable: true, description: "true, false or null (clear the override)"}
      responses:
        "200": {description: Updated Automaton with branch_refresh, branch_refresh_override and branch_refresh_enabled}
        "400": {description: enabled missing or not true, false or null}
        "403": {description: Federated peer lacks the autonomous write capability}
        "404": {description: Unknown Automaton id}
        "405": {description: Method not allowed}
        "501": {description: The autonomous manager does not support the override}
  /api/autonomous/prds/{id}/set_lane_preference:
    post:
      summary: Set the lane preference of an Automaton
      description: |
        Sets which kind of lane the Automaton should run on: `gpu`, `claude` or `any`.
        An empty value clears the preference, which means any lane. The change is
        recorded on the decision timeline. Needs the autonomous write capability when
        called by a federated peer.
      operationId: autonomousPRDSetLanePreference
      tags: [Autonomous]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lane_preference]
              properties:
                lane_preference: {type: string, enum: [gpu, claude, any, ""]}
      responses:
        "200": {description: Updated Automaton, which carries lane_preference when one is set}
        "400": {description: Unknown lane preference; the message names gpu, claude and any}
        "403": {description: Federated peer lacks the autonomous write capability}
        "404": {description: Unknown Automaton id}
        "405": {description: Method not allowed}
  /api/autonomous/prds/{id}/set_authorized_paths:
    post:
      summary: Set the authorised protected paths of an Automaton
      description: |
        Sets the protected paths this Automaton's tasks may change without an
        operator decision. Each entry is a repository-relative exact file, a
        directory (trailing slash) or a glob; entries are trimmed, cleaned and
        de-duplicated. An empty list clears the authorisation. An entry that is
        absolute, has a `..` segment or is longer than 256 bytes, or a list of
        more than 100 entries, is refused with 400 and a message naming it. The
        change is recorded on the decision timeline and audited. Needs the
        autonomous write capability when called by a federated peer.
      operationId: autonomousPRDSetAuthorizedPaths
      tags: [Autonomous]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths]
              properties:
                paths: {type: array, items: {type: string}, description: "The authorised protected paths; an empty list clears them"}
      responses:
        "200": {description: Updated Automaton, which carries authorized_paths when any are set}
        "400": {description: A refused entry; the message names it}
        "403": {description: Federated peer lacks the autonomous write capability}
        "404": {description: Unknown Automaton id}
        "405": {description: Method not allowed}
  /api/autonomous/prds/{id}/set_tags:
    post:
      summary: Replace the tags on an Automaton
      description: |
        Replaces the full list; an empty array clears it. Every ID must be an
        existing tag. The optional primary_tag_id picks the tag a tag browser
        sorts the Automaton under; it never hides a membership. Absent keeps the
        current primary while it is still a tag. Empty clears it. Any other value
        must be one of tag_ids, or the call is refused with 400. Removing the
        primary tag from the Automaton clears the primary.
        A body with primary_tag_id and no tag_ids keeps the current tags and changes
        only the primary.
      operationId: autonomousPRDSetTags
      tags: [Autonomous]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tag_ids: {type: array, items: {type: string}, description: "Omit with primary_tag_id alone to keep the current tags."}
                primary_tag_id: {type: string, description: "Optional. One of tag_ids, or empty to clear. Default none."}
      responses:
        "200": {description: "The updated Automaton, carrying tag_ids and primary_tag_id"}
        "400": {description: "primary_tag_id is not one of tag_ids"}
        "404": {description: "Unknown tag, or an unknown Automaton when primary_tag_id is sent without tag_ids"}

  /api/autonomous/prds/{id}/set_notify_events:
    post:
      summary: Set the lifecycle event kinds an Automaton notifies on
      description: |
        The Automaton's notification list is the most specific tier of the
        notify_events precedence chain (Automaton > guardrail profile > global
        default). A missing `notify_events` key, `null` or an empty array
        clears the list, so the Automaton inherits from its assigned guardrail
        profile and, behind that, the global default set. The reply is the
        updated Automaton and carries the computed read-time view
        `notify_events_effective` — `{events, source}` where `source` is
        `automaton`, `profile` or `global`, the tier that actually supplied
        the effective list. POST only; any other method is rejected with 405.
      operationId: autonomousPRDSetNotifyEvents
      tags: [Autonomous]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notify_events:
                  type: array
                  items: {type: string}
                  description: "Lifecycle event kinds, e.g. prd.completed, task.completed; absent/null/empty clears (inherit)"
      responses:
        "200": {description: "Updated Automaton; carries notify_events and notify_events_effective"}
        "400": {description: "An invalid entry — message names the offending kind (or its index) and lists the valid kinds; nothing is changed"}
        "405": {description: "POST-only action"}

  /api/autonomous/prds/{id}/rejudge:
    post:
      summary: Re-run the rules-review completion guardrail for a blocked Automaton
      description: |
        Runs a fresh completion review for a PRDBlocked Automaton whose work
        is fully done — every task in every story at `task_completed` —
        without resetting or editing any task. The review reads the current
        head commit of the Automaton's working tree, starts a judge session on
        the configured judge backends, and records a new verdict with its own
        time and the commit it judged. That verdict replaces the blocked
        state: a pass unblocks the Automaton (status `prd_completed`), a block
        keeps it `prd_blocked` with its blocked reason set from the new
        verdict. No tasks are retried afterwards — a pass ends the Automaton
        and a block waits for operator action again.
        The stored verdict is reused instead only when the head commit and the
        rules text the judge reads are both unchanged since it was made (and
        the judge verdict cache is on). The reply `message` (carried by the
        compact reply, `?view=compact`; the default full reply is the bare
        Automaton with no message) and the
        `guardrail_rejudge` decision (naming the acting `actor`) then say
        plainly that the stored verdict was reused and why, and no new verdict
        is added; otherwise they say a new review ran on the named commit. The
        decision carries `judged_commit_sha` and `verdict_reused` either way.
        There is one verdict per review that ran, never a duplicate copy.
        `backend` is the reroute of the review state whose `action` is
        `reroute`: it names the judge backend the re-judgment runs on, beating
        the resolved tier (pinned, and even making the run possible when no
        tier resolves) — typically the Automaton's stronger guardrail
        backend. Omit it to re-run the resolved tier. Needs the autonomous
        write capability when called by a federated peer; any other method is
        rejected with 405.
      operationId: autonomousPRDRejudge
      tags: [Autonomous]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: {type: string, description: "Who asked; recorded on the guardrail_rejudge decision. Default the operator."}
                backend: {type: string, description: "Optional judge backend reroute (the review state action `reroute`); empty = the resolved tier"}
      responses:
        "200": {description: "Rejudge complete. The reply message says whether a new review ran on the head commit (the new verdict and outcome are in the Automaton's decision log) or the stored verdict was reused because the head commit and the rules text are unchanged since it was made (no new review ran, no verdict added)"}
        "400": {description: "Refused: unknown Automaton, not PRDBlocked, a task not completed (the message names the first offending task and its status), or no verdict was produced — each refusal says why"}
        "403": {description: "Federated peer lacks the autonomous write capability"}
        "405": {description: "POST-only action"}

  /api/autonomous/tags:
    get:
      summary: List Automata tags
      description: |
        Returns every tag (a tree via parent_id) with the number of Automata
        carrying it. With counts=true each tag also carries subtree_count (distinct
        Automata carrying the tag or any descendant), direct_count (Automata
        carrying exactly this tag), session_subtree_count and session_direct_count
        (the same for sessions, where a session counts through its own tags and
        through the tags it inherits from its Automaton), and the reply carries an
        untagged object {count, session_count}. count keeps its include_sub meaning.

        The reply also carries registry, the status of the shared tag registry on
        this daemon (see the TagRegistry schema): its role (standalone, keeper or
        peer), the keeper it syncs from, whether that keeper is stale, the last sync
        time and revision, how many tags are pending sync, the merge and
        removed-on-keeper notes, and the last sync error. On a peer the tag tree is
        a cached copy of the keeper's tags, so it matches the keeper after a sync,
        apart from tags the peer created while the keeper was unreachable.
      operationId: autonomousTagList
      tags: [Autonomous]
      parameters:
        - {name: include_sub, in: query, required: false, schema: {type: boolean, default: false}, description: "Roll counts up to include descendant tags"}
        - {name: counts, in: query, required: false, schema: {type: boolean, default: false}, description: "Add the subtree, direct and session counts and the untagged totals"}
      responses:
        "200":
          description: "{tags:[{id,name,parent_id,color,description,created_at,updated_at,count}], untagged?:{count,session_count}, registry:{...}}; with counts=true each tag also has subtree_count, direct_count, session_subtree_count, session_direct_count"
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items: {type: object}
                  untagged:
                    type: object
                    description: "Present only with counts=true"
                    properties:
                      count: {type: integer}
                      session_count: {type: integer}
                  registry: {$ref: "#/components/schemas/TagRegistry"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      summary: Create a tag
      description: |
        On a peer daemon the create is forwarded to the keeper of the shared tag
        registry. While the keeper is unreachable the tag is still created on the
        peer, marked pending_sync true, and it is pushed to the keeper when the keeper
        next answers; a same-name tag under the same parent then merges into the
        keeper's tag, and a merge note records it. A create is never refused with 503.
      operationId: autonomousTagCreate
      tags: [Autonomous]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                parent_id: {type: string}
                color: {type: string}
                description: {type: string}
      responses:
        "200": {description: "Created tag. On a peer while the keeper is unreachable it carries pending_sync: true"}
        "400": {description: Invalid name or unknown parent}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/autonomous/tags/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    patch:
      summary: Rename, recolor, describe or reparent a tag
      description: |
        Omitted fields are unchanged. A parent_id of "" makes the tag a root. A move
        that would make a tag its own ancestor is refused with 409 and nothing is changed.

        On a peer daemon the edit is forwarded to the keeper of the shared tag
        registry, and the reply shows the keeper's value. When the keeper decided a
        conflict for a field this edit also changed, the reply carries
        "conflict": true and "conflict_field" (name, parent, color or description);
        the keeper's value is kept. While the keeper is unreachable on a peer, a
        rename, re-parent, recolor or describe is refused with 503, and the message
        says the last copy is shown.
      operationId: autonomousTagUpdate
      tags: [Autonomous]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                parent_id: {type: string}
                color: {type: string}
                description: {type: string}
      responses:
        "200": {description: "Updated tag. Carries conflict and conflict_field when the keeper decided a conflict"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {description: "Unknown tag (kind not_found)"}
        "409": {description: "Cycle, or the keeper refused the move (kind cycle or has_children)"}
        "503": {description: "Keeper unreachable on a peer (kind unreachable). Nothing is changed; the last copy is shown"}
    delete:
      summary: Delete a tag
      description: |
        Refused with 409 while the tag has child tags, and refused with 409 plus a count of Automata using it while it is still assigned. Nothing is changed on a refusal.

        On a peer daemon the delete is forwarded to the keeper. While the keeper is
        unreachable it is refused with 503. On the keeper, a tag deleted there that a
        peer still has assignments on shows up on that peer as a removed-on-keeper note.
      operationId: autonomousTagDelete
      tags: [Autonomous]
      responses:
        "200": {description: "{deleted: id}"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {description: Unknown tag}
        "409": {description: "Has child tags, or assigned to Automata (body carries count, kind has_children or in_use)"}
        "503": {description: "Keeper unreachable on a peer (kind unreachable); nothing is deleted"}

  /api/autonomous/tags/registry:
    get:
      summary: Read the keeper's shared tag registry snapshot
      description: |
        Keeper-to-peer protocol route. A peer daemon pulls this snapshot from the
        daemon it names in autonomous.tags.registry_keeper, so the peer can keep its
        cached copy of the registry. The reply is the keeper's revision, every tag
        (with its origin node) and the merge and removed-on-keeper notes. Operators
        do not need this route: the status of a daemon's own registry is the registry
        object on GET /api/autonomous/tags.

        A peer daemon answers 409, because only the keeper holds the registry.
      operationId: autonomousTagRegistrySnapshot
      tags: [Autonomous]
      responses:
        "200":
          description: "{revision, tags, notes}"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TagRegistrySnapshot"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: "Federated peer lacks the autonomous read capability"}
        "405": {description: "GET only"}
        "409": {description: "This daemon is a peer, not the keeper (kind not_keeper)"}
        "503": {description: "Tag registry is not wired into this server"}

  /api/autonomous/tags/registry/write:
    post:
      summary: Apply one forwarded tag write on the keeper
      description: |
        Keeper-to-peer protocol route. A peer forwards each tag create, rename,
        re-parent, recolor, describe or delete here. The keeper applies it to its own
        registry and returns the result: the keeper's value for the tag, the revision,
        any conflict, and any merge note. The peer relays that result to the operator.
        Operators do not call this route; use the tag routes on the peer instead.

        A daemon that is not the keeper answers 409.
      operationId: autonomousTagRegistryWrite
      tags: [Autonomous]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TagRegistryWrite"}
      responses:
        "200":
          description: The keeper's result for the write
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TagRegistryWriteResult"}
        "400": {description: "Malformed body, or an invalid edit (kind invalid)"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: "Federated peer lacks the autonomous write capability"}
        "404": {description: "Unknown tag (kind not_found)"}
        "405": {description: "POST only"}
        "409": {description: "This daemon is not the keeper (kind not_keeper), or the edit is refused (kind has_children, in_use with count, or cycle)"}
        "503": {description: "Tag registry is not wired into this server"}

  /api/autonomous/tags/registry/notes/{id}/dismiss:
    parameters: [{name: id, in: path, required: true, schema: {type: string}, description: "Note ID, as listed in the registry notes"}]
    post:
      summary: Dismiss a merge or removed-on-keeper note on this daemon
      description: |
        Dismisses one note on this daemon only. A dismissed note stops appearing in
        the registry object, and it stays dismissed when later keeper snapshots are
        applied. Dismissing a note does not change any tag or any assignment.
      operationId: autonomousTagRegistryDismissNote
      tags: [Autonomous]
      responses:
        "200": {description: "{dismissed: id}"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: "Federated peer lacks the autonomous write capability"}
        "404": {description: "No such note on this daemon (kind note_not_found)"}
        "405": {description: "POST only"}
        "503": {description: "Tag registry is not wired into this server"}

  /api/autonomous/attention:
    get:
      summary: List the Automata that need the operator's attention
      description: |
        The items are the Automata whose status is one of the attention statuses,
        plus every Automaton with a task held for operator review. The statuses
        field names the attention statuses in force: blocked, needs_review and
        paused by default, so a paused Automaton is in the group. Each item is an
        Automaton summary view and carries blocked_reason.
      operationId: autonomousAttention
      tags: [Autonomous]
      responses:
        "200": {description: "{statuses:[string], items:[SummaryView]}"}
        "405": {description: Only GET is allowed}
        "503": {description: autonomous disabled}

  /api/autonomous/guardrail_profiles:
    get:
      summary: List guardrail profiles
      operationId: autonomousGuardrailProfileList
      tags: [Autonomous]
      responses: {"200": {description: "[profiles]"}}
    post:
      summary: Create a guardrail profile
      description: A profile is a named bundle of guardrail settings. `notify_events` seeds the profile tier of the notification precedence chain; an absent or empty list means the profile inherits the global default.
      operationId: autonomousGuardrailProfileCreate
      tags: [Autonomous]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                description: {type: string}
                guardrails: {type: array, items: {type: string}}
                block_on_file_drift: {type: boolean}
                notify_events: {type: array, items: {type: string}}
      responses: {"201": {description: "Created profile, carries notify_events"}, "400": {description: "Invalid name or entry — message lists the valid kinds"}}

  /api/autonomous/guardrail_profiles/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      summary: Read one guardrail profile
      operationId: autonomousGuardrailProfileGet
      tags: [Autonomous]
      responses: {"200": {description: "The profile, with its notify_events list"}, "404": {description: "Unknown profile"}}
    put:
      summary: Update a guardrail profile
      description: >
        Omitted fields are unchanged. notify_events follows the same key
        rule — a key left out keeps the list as-is, an explicit empty array
        clears it, a present list replaces it.
      operationId: autonomousGuardrailProfileUpdate
      tags: [Autonomous]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                description: {type: string}
                guardrails: {type: array, items: {type: string}}
                block_on_file_drift: {type: boolean}
                notify_events: {type: array, items: {type: string}}
      responses: {"200": {description: "Updated profile"}, "400": {description: "Invalid entry or unknown profile"}, "404": {description: "Unknown profile"}}
    delete:
      summary: Delete a guardrail profile
      operationId: autonomousGuardrailProfileDelete
      tags: [Autonomous]
      responses: {"204": {description: Deleted}, "404": {description: Unknown profile}}

  /api/alerts:
    get:
      summary: List alerts
      description: |
        Returns system alerts (newest first) and the count of unread alerts.

        Without `limit`, `unread` or `before` the response is the full list
        with `alerts` and `unread_count` only. Supplying any of them returns
        one page and adds `total`, `has_more` and `next_before`; pass
        `next_before` back as `before` to fetch the next (older) page.
        Clients can detect support via the `alerts.paging` entry in
        `/api/info` `capabilities`.
      operationId: listAlerts
      tags: [Alerts]
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
          description: Only return alerts with this source (e.g. `system`).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Maximum alerts to return. `0` returns no alerts, only the counts.
        - name: unread
          in: query
          required: false
          schema:
            type: string
            enum: ["1", "0", "true", "false"]
          description: "`1` returns only unread alerts."
        - name: before
          in: query
          required: false
          schema:
            type: string
          description: Return only alerts older than this alert ID (the previous page's `next_before`). Unknown IDs return 400.
      responses:
        "200":
          description: Alerts list with unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Alert"
                  unread_count:
                    type: integer
                    description: Number of unread alerts
                  total:
                    type: integer
                    description: Paged form only — total stored alerts (matching `source` when set).
                  has_more:
                    type: boolean
                    description: Paged form only — more matching alerts exist past this page.
                  next_before:
                    type: string
                    description: Paged form only — ID of the last returned alert; omitted when `has_more` is false.
        "400":
          description: Invalid `limit`/`unread` value or unknown `before` alert ID
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Mark alerts as read
      description: Mark one or all alerts as read.
      operationId: markAlertsRead
      tags: [Alerts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Alert ID to mark read. Omit to mark all alerts as read.
                all:
                  type: boolean
                  description: Set true to mark all alerts as read.
      responses:
        "200":
          description: Marked as read
        "404":
          description: Alert not found
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/alerts/count:
    get:
      summary: Alert counts
      description: |
        Returns only the unread and total alert counts — a cheap badge poll.
        Advertised as `alerts.count` in `/api/info` `capabilities`.
      operationId: countAlerts
      tags: [Alerts]
      responses:
        "200":
          description: Alert counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread_count:
                    type: integer
                  total:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Federation peer lacks the alerts-list capability

  /ws:
    get:
      summary: WebSocket connection
      description: |
        Upgrade to WebSocket for real-time bidirectional communication.

        ### Server to Client messages

        | type | description |
        |------|-------------|
        | `sessions` | Full session list (sent on connect and on any change) |
        | `session_state` | One session's state changed |
        | `output` | New output lines from a session |
        | `needs_input` | Session is waiting for user input |
        | `notification` | General text notification |
        | `alert` | New system alert pushed to Web UI clients |
        | `alerts_read` | Alerts were marked read: `{"ids": ["..."], "unread_count": N}` or `{"all": true, "unread_count": 0}` |
        | `hello_ack` | Reply to `hello`: `{"session_list": "full"\|"delta", "session_view": "full"\|"summary", "output": "all"\|"subscribed", "capabilities": [...]}` — the modes now in effect |
        | `session_removed` | `session_list=delta` clients only: `{"session_id": "..."}` — a session left the list |
        | `prd_update` | An Automaton was saved or changed status: `{"prd_id": "...", "status": "..."}`, or `{"prd_id": "...", "deleted": true}` |
        | `tag_update` | A tag or tag assignment changed: `{"kind": "created"\|"renamed"\|"reparented"\|"recolored"\|"deleted"\|"assigned"\|"session_assigned", "tag_id"?: "...", "prd_id"?: "...", "session_id"?: "..."}`. IDs only; refetch `GET /api/autonomous/tags?counts=true`. Sent to every client |

        ### Client to Server messages

        | type | description |
        |------|-------------|
        | `command` | `{"text": "new: my task"}` — any command string |
        | `new_session` | `{"task": "...", "name": "...", "project_dir": "...", "backend": "..."}` |
        | `send_input` | `{"session_id": "a3f2", "text": "yes"}` |
        | `subscribe` | `{"session_id": "a3f2"}` — stream output for session (full or short ID) |
        | `unsubscribe` | `{"session_id": "a3f2"}` — stop output for the session and stop the screen capture `subscribe` started |
        | `hello` | `{"session_list": "delta", "session_view": "summary", "output": "subscribed"}` — negotiate a lighter stream; every key optional, unknown keys/values ignored |
        | `ping` | keepalive |

        ### Lighter streams (`hello`)

        - `session_list: delta` — no `sessions` frames; one `session_state`
          per new or changed session and one `session_removed` per removed
          session. Fetch the starting list with
          `GET /api/sessions?view=summary` after `hello_ack`.
        - `session_view: summary` — `session_state` carries the compact
          `view=summary` record (with `truncated_fields`).
        - `output: subscribed` — `output`, `raw_output`, `pane_capture`
          and `chat_message` frames only for subscribed sessions.

        Clients that never send `hello` get `server.ws_session_list_default`
        and `server.ws_output_scope_default` (`full` / `all` by default).

        All messages are JSON-wrapped in `{"type":"...", "data":{...}, "ts":"..."}`.
      operationId: connectWebSocket
      tags: [WebSocket]
      responses:
        "101":
          description: Switching Protocols

  # ─── Autonomous PRD decomposition (BL24+BL25, v3.10.0) ─────────
  /api/autonomous/status:
    get:
      summary: Loop status snapshot
      description: |
        Besides the loop counters, the snapshot carries `automations`: one row
        per non-terminal Automation (draft, active, paused or blocked). Each
        row has `id`, `name`, `status`, `current_member_id`, `current_prd_id`,
        `current_prd_title`, `pending_members`, `idle_since` and
        `idle_seconds` (set while no member is running), and `blocked_reason`
        (blocked only). Each row also carries `active_cursors`, one entry per
        live member (`member_id`, `prd_id` for an Automaton member, `automation_id`
        for a nested one, and `status`), sorted by member ID and always present
        (empty when idle). `join_wait` is present only while a join waits on
        its branches: `join_member_id`, `rule`, `pending_branches` and
        `failed_branches`. The array is omitted when there are none.
        A row whose Automation has a budget policy also carries `spent_usd`,
        `ceiling_display` (for example `$12.40 of $40.00 (week)`) and `budget`,
        the computed budget view. The estimated allocation figure appears
        only inside `budget.allocation_estimate`, always marked estimated.
        The snapshot also carries `notify`: `default_events`, the in-effect
        global default kinds, and `overrides`, one entry per non-terminal
        Automaton whose effective list resolves from the `automaton` or
        `profile` tier (`id`, `source` — `automaton` or `profile`, the
        tier supplying its list — and `events`). Sorted by Automaton ID and
        capped at 100. Both arrays are always lists: empty, never null.
      operationId: autonomousStatus
      tags: [Autonomous]
      responses:
        "200":
          description: Loop status
          content:
            application/json:
              schema:
                type: object
                properties:
                  automations:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        name: {type: string}
                        status: {type: string, enum: [draft, active, paused, blocked]}
                        current_member_id: {type: string}
                        current_prd_id: {type: string}
                        current_prd_title: {type: string}
                        pending_members: {type: integer}
                        idle_since: {type: string, format: date-time}
                        idle_seconds: {type: integer}
                        blocked_reason: {type: string}
                        active_cursors:
                          type: array
                          items:
                            type: object
                            properties:
                              member_id: {type: string}
                              prd_id: {type: string}
                              automation_id: {type: string}
                              status: {type: string}
                        join_wait:
                          type: object
                          description: "Present only while a join waits on its branches"
                          properties:
                            join_member_id: {type: string}
                            rule: {type: string, enum: [all_must_succeed, any_one_is_enough, continue_anyway]}
                            pending_branches: {type: array, items: {type: string}}
                            failed_branches: {type: array, items: {type: string}}
                  notify:
                    type: object
                    description: "Notify-event resolution: the in-effect global default and the non-terminal Automata whose list resolves from the automaton or profile tier (sorted by Automaton ID, capped at 100). Both arrays are always lists - empty, never null."
                    properties:
                      default_events: {type: array, items: {type: string}, description: "In-effect global default kinds"}
                      overrides:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: string}
                            source: {type: string, enum: [automaton, profile], description: "Tier supplying this Automaton's effective list"}
                            events: {type: array, items: {type: string}}
  /api/autonomous/config:
    get:
      summary: Read autonomous config
      description: |
        The response includes the plan-requirement coverage gate settings under
        `plan_coverage_check` (off|warn|block, default block) and
        `plan_coverage_min_ratio` (covered/extractable ratio required for a passing
        report, 0-1, default 1.0). Both are settable here and via /api/config PUT.
        The finding filters are also exposed: `plan_coverage_suppress_created_files`
        (boolean, default true) and `plan_coverage_scoped_requirements` (boolean,
        default true), `plan_coverage_requirement_sections` (comma-separated string,
        default "scope,constraints") and `plan_coverage_min_requirement_chars`
        (whole number >= 0, 0 reads the 30-character default). A wrong type on any of
        them is rejected with 400, same as the two gate fields above.
        `scope_lint` (off|warn|enforce, default enforce) is the pre-spawn scope
        lint mode: the effective, normalized value is returned.
        It also carries `undeclared_edit_mode` (off|warn|block, default warn), the
        enforcement for files a task's worker edited without declaring them.
        The `verifier_policy` object holds the global verifier policy: `mode`,
        `backends`, `claude_session_cap`, `claude_cap_window_minutes`,
        `force_stronger_on_retry`, `final_gate_stronger`, `stronger_backend` and
        `stronger_model`. The judge settings are `judge_policy` (ordered backends,
        one attempt each; empty = the judges follow the verifier routing policy)
        and `judge_timeout_seconds` (time limit for one judge run, default 1800).
        `judge_size_threshold_lines` is the number of changed lines (added plus
        deleted, on the Automaton branch against its merge base, lock files left
        out) above which the judges try `claude-code` first, default 400; 0 turns
        the size rule off.
        `judge_prompt_file_threshold_lines` (whole number 0 to 100000; PUT key
        `autonomous.judge_prompt_file_threshold_lines`) is the judge prompt length
        in lines above which the prompt is delivered as a file; 0 always sends the
        full prompt. `judge_delivery_wait_per_thousand_lines_seconds` (whole number
        0 to 3600; PUT key `autonomous.judge_delivery_wait_per_thousand_lines_seconds`)
        is the extra delivery wait per thousand prompt lines. Out-of-range values
        are rejected with 400.
        `priority_by_kind` is the kind → capacity-queue priority table:
        kind name → integer, higher values line up closer to the front.
        Shipped defaults: bug=80, maintenance=70, feature=20, other=0
        (the fallback row for a kind with no row of its own; an
        installation may name kinds of its own). Read here — always the
        effective table, operator entries layered onto the shipped
        defaults — and writable here or via PUT /api/config
        (autonomous.priority_by_kind). Integer values only: a non-number,
        a value with a fraction part, a negative, or a boolean is refused
        with 400 and a clear message, and so is an empty kind name. An
        empty table ({}) is a valid "clear my edits" edit and leaves the
        shipped defaults in effect. A priority pinned on a single Automaton
        (set_priority) always wins for that Automaton.
        `defect_intake_automation` (string, empty by default) names the
        Automation that new kind:bug defect filings are recorded under;
        empty means the filing is recorded, not filed into any Automation.
        Writable here or via PUT /api/config
        (autonomous.defect_intake_automation); a present non-string is
        refused with 400.
        `judge_strong_backend` (empty = unset) is the stronger backend that
        guarded or should guard a review: when the review's judge timed out on
        every backend it tried and none of them was this one, the review state's
        action is `reroute` (run the judge on that backend instead) instead of
        `retry`. `judge_verdict_cache_enabled` (boolean; an unset key reads
        true) is the per-run-id judge verdict cache: a verdict that ran is
        reused for the same run id and never re-judged.
        `scope_lint` (off|warn|enforce, default enforce) is the pre-spawn scope
        lint mode: the effective, normalized value is returned.
        The `automation` object carries the search-before-create settings:
        `create_search_mode` (off|shadow|on, default shadow) and
        `create_search_threshold` (above 0 and at most 1, default 0.5).
        It also carries the cleanup settings: `cleanup_mode` (off|report|on,
        default report), `cleanup_retention_hours` (whole hours >= 1, default
        24), `cleanup_max_removals_per_pass` (whole number >= 1, default 10)
        and `disk_alert_percent` (whole percent 1-100, default 85).
        The `automation` object also carries the uncommitted-work settings:
        `uncommitted_work_policy` (hold|warn|off, default hold) and
        `uncommitted_work_scope` (task_files|worktree, default task_files);
        a key that was never set is omitted and reads its default.
        The `request_watch` object carries the request watch settings with every
        default filled in: `enabled`, `poll_seconds`, `no_progress_minutes`,
        `observe_workers`, `observe_verifiers`, `use_gpu_signal`, `gpu_busy_percent`,
        `unreachable_counts`, `raise_alert`, `raise_question` and `remediation_options`
        (the list in effect, keep_waiting first).
        It also carries the protected-paths settings: `protected_paths` (the
        list of paths a task commit must not change without the operator; unset
        reads the default list), `protected_paths_action` (hold|warn|block|off,
        default hold) and `rules_review_source` (base_commit|worktree, default
        base_commit); a key that was never set is omitted and reads its default.
        The `automation` object also carries the nine pending item settings:
        `pending_item_policy` (hold|skip, default hold), `pending_item_auto_resume`
        (true|false, default true) and the `pending_item_source` object with `path`
        (default empty = no file registry), `id_pattern` (default `^\S+$`),
        `id_column` (default `1`), `title_column` (default `2`), `state_column`
        (default empty = none), `done_values` (default done, closed, shipped) and
        `on_missing_row` (keep|drop, default keep).
      operationId: autonomousConfigGet
      tags: [Autonomous]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope_lint:
                    type: string
                    enum: [off, warn, enforce]
                    default: enforce
                    description: "Pre-spawn scope lint mode (autonomous.scope_lint). off skips the lint; warn spawns the task and records a scope_lint_warn decision; enforce blocks the task before its session starts."
                  automation:
                    type: object
                    description: "Search-before-create settings under autonomous.automation"
                    properties:
                      create_search_mode:
                        type: string
                        enum: [off, shadow, on]
                        default: shadow
                        description: "off never searches; shadow searches and records the warnings in the audit log; on adds overlap_warnings to the create reply (autonomous.automation.create_search_mode)."
                      create_search_threshold:
                        type: number
                        default: 0.5
                        description: "The over-duplication score at or above which an existing Automaton counts as an overlap. Above 0 and at most 1 (autonomous.automation.create_search_threshold)."
                      cleanup_mode:
                        type: string
                        enum: [off, report, "on"]
                        default: report
                        description: "The cleanup mode in effect (autonomous.automation.cleanup_mode): off never removes anything, report removes nothing and records what it would remove, on performs the removals."
                      cleanup_retention_hours:
                        type: integer
                        default: 24
                        description: "Whole hours >= 1; only finished entries older than this are candidates for the worktrees pass (autonomous.automation.cleanup_retention_hours)."
                      cleanup_max_removals_per_pass:
                        type: integer
                        default: 10
                        description: "Whole number >= 1; a pass removes at most this many entries and leaves the rest for the next pass (autonomous.automation.cleanup_max_removals_per_pass)."
                      disk_alert_percent:
                        type: integer
                        default: 85
                        description: "Whole percent 1-100; the disk-usage threshold at or above which the rate-limited cleanup disk alert fires (autonomous.automation.disk_alert_percent)."
                      uncommitted_work_policy:
                        type: string
                        enum: [hold, warn, off]
                        default: hold
                        description: "What happens to a task whose work is not committed when it finishes: hold parks the task and asks the operator, warn records and alerts only, off skips the check (autonomous.automation.uncommitted_work_policy)."
                      uncommitted_work_scope:
                        type: string
                        enum: [task_files, worktree]
                        default: task_files
                        description: "Which files the per-task check covers: task_files only the files the task declared, worktree every file in the Automaton worktree (autonomous.automation.uncommitted_work_scope)."
                      protected_paths:
                        type: array
                        items: {type: string}
                        description: "Paths a task commit must not change without the operator: repository-relative exact files, directories (trailing slash) or globs. Unset or empty reads the default list (autonomous.automation.protected_paths)."
                      protected_paths_action:
                        type: string
                        enum: [hold, warn, block, off]
                        default: hold
                        description: "What happens when a task commit changes a protected path: hold parks the task and asks the operator, warn records and alerts only, block refuses the commit, off skips the check (autonomous.automation.protected_paths_action)."
                      rules_review_source:
                        type: string
                        enum: [base_commit, worktree]
                        default: base_commit
                        description: "Where the rules review reads the project rules: base_commit the rules as committed on the base the work branched from, worktree the rules file in the task working tree (autonomous.automation.rules_review_source)."
                      pending_item_policy:
                        type: string
                        enum: [hold, skip]
                        default: hold
                        description: "What an Automation does when it reaches a pending item that is still waiting for an Automaton: hold waits at the member, skip passes over it (autonomous.automation.pending_item_policy)."
                      pending_item_auto_resume:
                        type: boolean
                        default: true
                        description: "Whether an attach resumes an Automation that was blocked on the item (autonomous.automation.pending_item_auto_resume)."
                      pending_item_source:
                        type: object
                        description: "The pending item file registry settings (autonomous.automation.pending_item_source.*). An unset key reads its default. A bad value rejects the whole PUT with 400 naming the allowed words."
                        properties:
                          path:
                            type: string
                            description: "The file registry to read; empty (the default) means no file registry (autonomous.automation.pending_item_source.path)."
                          id_pattern:
                            type: string
                            description: "Go regular expression an id cell must match to count as an item; default ^\\S+$ (autonomous.automation.pending_item_source.id_pattern). An invalid expression is rejected."
                          id_column:
                            type: string
                            description: "The id column: a header name (matched without regard to case) or a 1-based column number; default 1 (autonomous.automation.pending_item_source.id_column)."
                          title_column:
                            type: string
                            description: "The title column: a header name (matched without regard to case) or a 1-based column number; default 2 (autonomous.automation.pending_item_source.title_column)."
                          state_column:
                            type: string
                            description: "The state column: a header name (matched without regard to case) or a 1-based column number; empty (the default) means the table has none (autonomous.automation.pending_item_source.state_column)."
                          done_values:
                            type: array
                            items: {type: string}
                            description: "State words that mean the item is done, compared without regard to case; default done, closed, shipped (autonomous.automation.pending_item_source.done_values)."
                          on_missing_row:
                            type: string
                            enum: [keep, drop]
                            default: keep
                            description: "What happens to a file item whose row is gone: keep leaves it, drop removes it while it is still waiting (autonomous.automation.pending_item_source.on_missing_row); default keep."
    put:
      summary: Replace autonomous config
      description: |
        Accepts partial JSON. Among the valid fields are `plan_coverage_check`
        (off|warn|block, default block) and `plan_coverage_min_ratio` (0-1,
        default 1.0), plus the finding filters `plan_coverage_suppress_created_files`
        (boolean, default true), `plan_coverage_scoped_requirements` (boolean,
        default true), `plan_coverage_requirement_sections` (comma-separated string,
        empty = the "scope,constraints" default) and `plan_coverage_min_requirement_chars`
        (whole number >= 0, 0 = the 30-character default). Values outside the allowed
        range are rejected with 400.
        `scope_lint` (off|warn|enforce, default enforce) sets the pre-spawn scope
        lint mode; any other value is rejected with 400. `PUT /api/config` accepts
        it as `autonomous.scope_lint`.
        `undeclared_edit_mode` (off|warn|block, default warn) is also accepted;
        any other value is rejected with 400.
        `verifier_policy` is an object merged onto the current policy field by
        field: `mode` (fixed | prefer-free | balance | gpu-only | claude-only),
        `backends` (array of backend names; an empty list clears it),
        `claude_session_cap` and `claude_cap_window_minutes` (whole numbers >= 0),
        `force_stronger_on_retry`, `final_gate_stronger` (booleans),
        `stronger_backend` and `stronger_model` (strings). An unknown mode, an empty
        backend entry, a negative number or an unknown key is rejected with 400 and
        changes nothing. The policy applies to the next verification with no restart.
        `judge_policy` is an ordered list of backend names (an empty list clears it);
        `judge_timeout_seconds` is a whole number of seconds (0 or negative = 1800).
        `judge_size_threshold_lines` is a whole number of changed lines of 0 or more
        (0 = size-aware judge routing off, default 400). `PUT /api/config` with the
        key `autonomous.judge_size_threshold_lines` rejects anything else with 400.
        `judge_strong_backend` (string; `PUT /api/config` key
        `autonomous.judge_strong_backend`) is the stronger guardrail backend named
        by reroute reviews - a non-string is rejected with 400 naming the key, and
        the empty string clears it. `judge_verdict_cache_enabled` (JSON boolean;
        key `autonomous.judge_verdict_cache_enabled`) is the per-run-id judge
        verdict cache (true = a verdict that ran for a run id is reused, never
        re-judged; false = off); a non-boolean - including null - is rejected with
        400 naming the key. Each change applies to the next review without a
        restart.
        `scope_lint` (off|warn|enforce, default enforce) sets the pre-spawn scope
        lint mode; any other value is rejected with 400. `PUT /api/config` accepts
        it as `autonomous.scope_lint`.
        `automation.create_search_mode` (off|shadow|on) and
        `automation.create_search_threshold` (above 0 and at most 1) set the
        search-before-create settings; any other value is rejected with 400 and
        changes nothing. `PUT /api/config` accepts them as
        `autonomous.automation.create_search_mode` and
        `autonomous.automation.create_search_threshold`.
        The cleanup settings under `automation` follow the same rule: an absent
        key keeps the current value, and a present one must be a value a GET
        reads back verbatim — `cleanup_mode` (off|report|on),
        `cleanup_retention_hours` and `cleanup_max_removals_per_pass` (whole
        numbers of at least 1) and `disk_alert_percent` (a whole percent in
        1-100) — otherwise the whole PUT is rejected with 400 and changes
        nothing.
        The uncommitted-work settings under `automation` are strict in the same
        way: `uncommitted_work_policy` must be hold, warn or off and
        `uncommitted_work_scope` must be task_files or worktree; any other word
        rejects the whole PUT with 400 and a message naming the allowed words.
        `PUT /api/config` accepts them as
        `autonomous.automation.uncommitted_work_policy` and
        `autonomous.automation.uncommitted_work_scope`. A change takes effect
        without a restart.
        `request_watch` is an object of the request watch keys (`enabled`,
        `poll_seconds`, `no_progress_minutes`, `observe_workers`, `observe_verifiers`,
        `use_gpu_signal`, `gpu_busy_percent`, `unreachable_counts`, `raise_alert`,
        `raise_question`, `remediation_options`) merged onto the current block key by
        key. `poll_seconds` and `no_progress_minutes` are whole numbers of 1 or more,
        `gpu_busy_percent` is a whole number from 1 to 100, `remediation_options` is an
        array of known option ids (an empty array offers keep_waiting only), and the
        flags are true or false. A bad value or an unknown key rejects the whole PUT
        with 400 and a message naming the key and the allowed values, and changes
        nothing. `PUT /api/config` accepts the same keys as `autonomous.request_watch.<key>`.
        The protected-paths settings under `automation` are strict too:
        `protected_paths_action` must be hold, warn, block or off,
        `rules_review_source` must be base_commit or worktree, and every entry of
        `protected_paths` must be repository-relative (not absolute, no `..`
        segment, at most 256 bytes) with at most 100 entries; a refused value
        rejects the whole PUT with 400 and a message that names the allowed words
        or the offending entry. `PUT /api/config` accepts them as
        `autonomous.automation.protected_paths` (a JSON array or a comma
        separated string; an empty list reads the default list),
        `autonomous.automation.protected_paths_action` and
        `autonomous.automation.rules_review_source`.
        The pending item settings under `automation` are strict in the same way:
        `pending_item_policy` must be hold or skip, `pending_item_auto_resume` a
        boolean, and `pending_item_source` an object whose `id_pattern` is a valid
        regular expression, whose `id_column`, `title_column` and `state_column` are
        a header name or a 1-based column number, whose `done_values` is a list of
        words and whose `on_missing_row` is keep or drop; any other value rejects the
        whole PUT with 400 and a message naming the allowed words. `PUT /api/config`
        accepts them as `autonomous.automation.pending_item_policy`,
        `autonomous.automation.pending_item_auto_resume` and
        `autonomous.automation.pending_item_source.path`, `.id_pattern`, `.id_column`,
        `.title_column`, `.state_column`, `.done_values` and `.on_missing_row`. They are
        read live: a change applies to the next hold or attach with no restart.
      operationId: autonomousConfigSet
      tags: [Autonomous]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                automation:
                  type: object
                  description: "Search-before-create settings under autonomous.automation"
                  properties:
                    create_search_mode:
                      type: string
                      enum: [off, shadow, on]
                      default: shadow
                      description: "off never searches; shadow searches and records the warnings in the audit log; on adds overlap_warnings to the create reply (autonomous.automation.create_search_mode)."
                    create_search_threshold:
                      type: number
                      default: 0.5
                      description: "The over-duplication score at or above which an existing Automaton counts as an overlap. Above 0 and at most 1 (autonomous.automation.create_search_threshold)."
                    cleanup_mode:
                      type: string
                      enum: [off, report, "on"]
                      description: "The cleanup mode: off never removes anything, report removes nothing and records what it would remove, on performs the removals (autonomous.automation.cleanup_mode). Any other value rejects the PUT with 400."
                    cleanup_retention_hours:
                      type: integer
                      description: "Whole hours >= 1; only finished entries older than this are candidates (autonomous.automation.cleanup_retention_hours). Zero, a negative, a fractional or a non-numeric value rejects the PUT with 400."
                    cleanup_max_removals_per_pass:
                      type: integer
                      description: "Whole number >= 1; a pass removes at most this many entries (autonomous.automation.cleanup_max_removals_per_pass). Zero, a negative, a fractional or a non-numeric value rejects the PUT with 400."
                    disk_alert_percent:
                      type: integer
                      description: "Whole percent in 1-100 (autonomous.automation.disk_alert_percent); fractional or out-of-range rejects the PUT with 400."
                    uncommitted_work_policy:
                      type: string
                      enum: [hold, warn, off]
                      description: "The uncommitted-work policy (autonomous.automation.uncommitted_work_policy). Any other value rejects the PUT with 400 naming hold, warn and off."
                    uncommitted_work_scope:
                      type: string
                      enum: [task_files, worktree]
                      description: "The uncommitted-work scope (autonomous.automation.uncommitted_work_scope). Any other value rejects the PUT with 400 naming task_files and worktree."
                    pending_item_policy:
                      type: string
                      enum: [hold, skip]
                      default: hold
                      description: "What an Automation does when it reaches a pending item that is still waiting for an Automaton: hold waits at the member, skip passes over it (autonomous.automation.pending_item_policy). Any other value rejects the PUT with 400 naming the allowed words."
                    pending_item_auto_resume:
                      type: boolean
                      default: true
                      description: "Whether an attach resumes an Automation that was blocked on the item (autonomous.automation.pending_item_auto_resume). A value that is not true or false rejects the PUT with 400."
                    pending_item_source:
                      type: object
                      description: "The pending item file registry settings (autonomous.automation.pending_item_source.*). An unset key reads its default. A bad value rejects the whole PUT with 400 naming the allowed words."
                      properties:
                        path:
                          type: string
                          description: "The file registry to read; empty (the default) means no file registry (autonomous.automation.pending_item_source.path)."
                        id_pattern:
                          type: string
                          description: "Go regular expression an id cell must match to count as an item; default ^\\S+$ (autonomous.automation.pending_item_source.id_pattern). An invalid expression is rejected."
                        id_column:
                          type: string
                          description: "The id column: a header name (matched without regard to case) or a 1-based column number; default 1 (autonomous.automation.pending_item_source.id_column)."
                        title_column:
                          type: string
                          description: "The title column: a header name (matched without regard to case) or a 1-based column number; default 2 (autonomous.automation.pending_item_source.title_column)."
                        state_column:
                          type: string
                          description: "The state column: a header name (matched without regard to case) or a 1-based column number; empty (the default) means the table has none (autonomous.automation.pending_item_source.state_column)."
                        done_values:
                          type: array
                          items: {type: string}
                          description: "State words that mean the item is done, compared without regard to case; default done, closed, shipped (autonomous.automation.pending_item_source.done_values)."
                        on_missing_row:
                          type: string
                          enum: [keep, drop]
                          default: keep
                          description: "What happens to a file item whose row is gone: keep leaves it, drop removes it while it is still waiting (autonomous.automation.pending_item_source.on_missing_row); default keep."
                request_watch:
                  type: object
                  description: "Request watch settings (autonomous.request_watch). A bad value, or an unknown key, rejects the PUT with 400 naming the key and the allowed values."
                  properties:
                    enabled: {type: boolean, description: "Whether the watch is on (default true)"}
                    poll_seconds: {type: integer, minimum: 1, maximum: 86400, description: "Seconds between polls (default 30)"}
                    no_progress_minutes: {type: integer, minimum: 1, maximum: 10080, description: "Minutes without progress before a request counts as over the threshold (default 30)"}
                    observe_workers: {type: boolean, description: "Watch worker sessions (default true)"}
                    observe_verifiers: {type: boolean, description: "Watch verifier sessions (default true)"}
                    use_gpu_signal: {type: boolean, description: "Read the node GPU load to tell generating from idle (default true)"}
                    gpu_busy_percent: {type: integer, minimum: 1, maximum: 100, description: "GPU utilisation at or above which the node counts as generating (default 10)"}
                    unreachable_counts: {type: boolean, description: "Count time with an unreachable node as no progress (default true)"}
                    raise_alert: {type: boolean, description: "Raise an alert at the threshold (default true)"}
                    raise_question: {type: boolean, description: "Raise a non-blocking operator question at the threshold (default true)"}
                    remediation_options:
                      type: array
                      items: {type: string, enum: [keep_waiting, end_worker, retry_other_backend, unload_reload_model]}
                      description: "Options the question offers; keep_waiting is always offered. Unset offers all four; an empty array offers keep_waiting only."
                    protected_paths:
                      type: array
                      items: {type: string}
                      description: "The protected-path list (autonomous.automation.protected_paths). An absolute entry, an entry with a .. segment, an entry over 256 bytes or a list over 100 entries rejects the PUT with 400 naming it. An empty list reads the default list."
                    protected_paths_action:
                      type: string
                      enum: [hold, warn, block, off]
                      description: "The protected-paths action (autonomous.automation.protected_paths_action). Any other value rejects the PUT with 400 naming hold, warn, block and off."
                    rules_review_source:
                      type: string
                      enum: [base_commit, worktree]
                      description: "Where the rules review reads the project rules (autonomous.automation.rules_review_source). Any other value rejects the PUT with 400 naming base_commit and worktree."
                scope_lint:
                  type: string
                  enum: [off, warn, enforce]
                  default: enforce
                  description: "Pre-spawn scope lint mode (autonomous.scope_lint). off skips the lint; warn spawns the task and records a scope_lint_warn decision; enforce blocks the task before its session starts."
      responses: {"200": {description: OK}, "400": {description: Bad Request}}
  /api/autonomous/overlap:
    get:
      summary: Search before create - overlaps for a title and spec
      description: |
        The read an operator or an agent runs before it creates an Automaton. It runs
        the same finder as the create route, over every Automaton in the store, the
        plans-registry rows in `docs/plans/README.md` and the unmerged `automaton/`
        branches. No Automaton is excluded. A match needs at least three shared words
        and a score at or above the threshold. The warnings come back best match first,
        at most `limit` of them.
        The route writes nothing and works in every search-before-create mode. `mode`
        reports the mode in force, so the caller can tell whether the create route
        would act on the warnings. A search that fails answers 500, never an empty
        list. A federated peer needs the autonomous read capability.
      operationId: autonomousOverlapSearch
      tags: [Autonomous]
      parameters:
        - {name: title, in: query, required: false, schema: {type: string}, description: "Title of the plan about to be created. Give a title, a spec, or both"}
        - {name: spec, in: query, required: false, schema: {type: string}, description: "Spec of the plan about to be created. Give a title, a spec, or both"}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 50, default: 10}, description: "Most warnings returned: a whole number from 1 to 50"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  warnings:
                    type: array
                    description: "Overlaps, best match first, at most limit long"
                    items:
                      type: object
                      properties:
                        kind: {type: string, enum: [automaton, registry, branch, unavailable]}
                        id: {type: string, description: "Automaton id (automaton kind)"}
                        status: {type: string, description: "Automaton status (automaton kind)"}
                        row: {type: integer, description: "Registry row number (registry kind)"}
                        branch: {type: string, description: "Branch name (branch kind)"}
                        score: {type: number, description: "Overlap score, rounded to two decimals"}
                        shared_terms: {type: array, items: {type: string}, description: "At most five shared terms"}
                        reason: {type: string, description: "One sentence of operator copy"}
                        read_hint: {type: string, description: "How to read the underlying item"}
                  threshold: {type: number, description: "Match threshold in force"}
                  mode: {type: string, enum: [off, shadow, on], description: "Search-before-create mode in force"}
        "400":
          description: "Both title and spec are blank, or limit is not a whole number from 1 to 50"
        "403":
          description: "The federation token lacks the autonomous read capability"
        "500":
          description: "The overlap search failed"
        "503":
          description: "Autonomous is disabled"
  /api/autonomous/prds:
    get:
      summary: List PRDs (newest first)
      operationId: autonomousPRDList
      tags: [Autonomous]
      parameters:
        - {name: tag, in: query, required: false, schema: {type: string}, description: "Only Automata carrying this tag ID"}
        - {name: include_sub, in: query, required: false, schema: {type: boolean, default: true}, description: "With tag: also include Automata carrying any descendant tag"}
        - name: shipped
          in: query
          required: false
          schema: {type: string, enum: [all, shipped, unshipped], default: all}
          description: "Shipped-state selection: all (default), only records that carry a shipped record, or only records that do not. Any other value is a 400."
      responses:
        "200":
          description: PRD list (newest first); each item carries the PRD's git state including its push outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomousPrdList'
        "404": {description: Unknown tag}
    post:
      summary: Create a draft PRD
      operationId: autonomousPRDCreate
      tags: [Autonomous]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec]
              properties:
                spec: {type: string}
                project_dir: {type: string}
                backend: {type: string}
                effort: {type: string}
                kind: {type: string, enum: [feature, bug, other], description: "Optional Automaton kind; omit to derive it from the title and spec"}
                lane_preference: {type: string, enum: [gpu, claude, any, ""], description: "Optional lane preference: gpu, claude or any. Omit or leave empty for any lane. An unknown value is refused before anything is created"}
      responses:
        "200":
          description: "OK. The Automaton is created in every search-before-create mode. In on mode the reply also carries overlap_warnings."
          content:
            application/json:
              schema:
                type: object
                properties:
                  overlap_warnings:
                    type: array
                    description: "Present only when autonomous.automation.create_search_mode is on. Overlap warnings for the new Automaton, best match first; an empty list when none match. In shadow mode the warnings go to the audit log instead, and in off mode nothing is searched."
                    items:
                      type: object
                      properties:
                        kind: {type: string, enum: [automaton, registry, branch, unavailable]}
                        id: {type: string, description: "Automaton id (automaton kind)"}
                        status: {type: string, description: "Automaton status (automaton kind)"}
                        row: {type: integer, description: "Registry row number (registry kind)"}
                        branch: {type: string, description: "Branch name (branch kind)"}
                        score: {type: number, description: "Overlap score, rounded to two decimals"}
                        shared_terms: {type: array, items: {type: string}, description: "At most five shared terms"}
                        reason: {type: string, description: "One sentence of operator copy"}
                        read_hint: {type: string, description: "How to read the underlying item"}
  /api/autonomous/prds/{id}/shipped:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    post:
      summary: Record an Automaton's shipped state
      description: |
        The record that its work landed in a release: the release name, the
        merge time, the merge commit on the default branch, and where they
        came from. Recording never changes the Automaton's status — a
        cancelled one can be shipped; cancelled is the state it was put in,
        shipped is the state its work reached. The commit is what makes the
        record shipped (it must be non-empty), and `source` must be
        `merge_step` (recorded as the work landed) or `backfill` (recovered
        afterwards); the release name and the time are optional (the time may
        be left unset).

        The call is idempotent per commit: a repeat with the same commit is a
        no-op that leaves the stored fields, the revision and the updated
        time alone, while a different commit overwrites all four fields.
        Audited as `record_shipped`.
      operationId: autonomousPRDShippedRecord
      tags: [Autonomous]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippedRecordRequest'
      responses:
        "200":
          description: "OK — the Automaton as stored"
          content:
            application/json:
              schema: {type: object}
        "400": {description: "Empty commit, unknown source, unparseable time, or a store save failure"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: "Federated peer lacks the autonomous write capability"}
        "404": {description: "Unknown Automaton id"}
        "503": {description: "autonomous disabled"}
        "405": {description: "Only POST is provided here"}
  /api/automations/{id}/shipped:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    post:
      summary: Record the Automation's shipped state
      description: |
        The same four fields and the same rules as on an Automaton: the commit
        is what makes the record shipped, the status is never touched, and the
        call is idempotent per commit. Specific to the Automation, the record
        goes through the Automation store's write path, so its version and
        ownership rules keep applying (recording never blocks on them). Audited
        as `automation_shipped_record`.
      operationId: automationShippedRecord
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShippedRecordRequest"
      responses:
        "200":
          description: "OK — the Automation as stored"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": {description: "Empty commit, unknown source, unparseable time, or a store write failure"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {description: "Unknown Automation id"}
        "503": {description: "autonomous disabled"}
  /api/autonomous/defects/intake:
    post:
      summary: Route one incoming defect
      description: |
        Decides whether the defect is a tiny fix, joins an open draft batch of
        its project and area, or starts a new batch, applies that decision and
        logs it. When the tiny-fix lane refuses a change that looked eligible,
        `tiny_fix_refusal` carries the reason and the defect goes to a batch.
      operationId: autonomousDefectIntake
      tags: [Autonomous]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, title, project]
              properties:
                id: {type: string}
                title: {type: string}
                project: {type: string}
                description: {type: string}
                files: {type: array, items: {type: string}}
                kind: {type: string, enum: [test_only, docs_only, script_only, rule_tweak, lint_tweak]}
                area: {type: string}
                priority: {type: integer}
      responses:
        "200":
          description: The intake decision
          content:
            application/json:
              schema:
                type: object
                required: [route, reason]
                properties:
                  route: {type: string, enum: [tiny_fix, open_batch, new_batch]}
                  reason: {type: string}
                  batch_id: {type: string}
                  tiny_fix_refusal: {type: string}
        "400": {description: "Missing id, title or project, or invalid JSON"}
        "409": {description: "Defect queue disabled for the project"}
        "503": {description: "Defect queue unavailable"}
  /api/autonomous/defects/batches:
    get:
      summary: List open defect batches
      description: Open batches with the story-to-defect mapping of each. Read-only.
      operationId: autonomousDefectBatches
      tags: [Autonomous]
      parameters:
        - name: project
          in: query
          required: false
          schema: {type: string}
      responses:
        "200":
          description: Open batches
          content:
            application/json:
              schema:
                type: object
                required: [batches, total]
                properties:
                  total: {type: integer}
                  batches:
                    type: array
                    items:
                      type: object
                      required: [id, project, status, size, stories]
                      properties:
                        id: {type: string}
                        project: {type: string}
                        area: {type: string}
                        status: {type: string}
                        size: {type: integer}
                        stories:
                          type: array
                          items:
                            type: object
                            required: [story_id, defect_id]
                            properties:
                              story_id: {type: string}
                              defect_id: {type: string}
                              title: {type: string}
        "503": {description: "Defect queue unavailable"}
  /api/autonomous/defects/batches/{id}/split:
    post:
      summary: Split a story out of a defect batch
      description: Moves one story into its own new Automaton and returns that Automaton's id.
      operationId: autonomousDefectBatchSplit
      tags: [Autonomous]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [story_id]
              properties:
                story_id: {type: string}
      responses:
        "200":
          description: The new Automaton
          content:
            application/json:
              schema:
                type: object
                required: [automaton_id, batch_id, story_id]
                properties:
                  automaton_id: {type: string}
                  batch_id: {type: string}
                  story_id: {type: string}
        "400": {description: "Missing story_id or invalid JSON"}
        "404": {description: "Unknown batch or story"}
        "503": {description: "Defect queue unavailable"}
  /api/autonomous/defects/tiny-fix/check:
    post:
      summary: Check whether a change is a tiny fix
      description: |
        Classifies the change against the tiny-fix criteria and runs the
        operator-visible re-check. Creates nothing.
      operationId: autonomousDefectTinyFixCheck
      tags: [Autonomous]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files, kind]
              properties:
                files: {type: array, minItems: 1, items: {type: string}}
                kind: {type: string}
                project: {type: string}
      responses:
        "200":
          description: Eligibility and the reason
          content:
            application/json:
              schema:
                type: object
                required: [eligible, reason]
                properties:
                  eligible: {type: boolean}
                  reason: {type: string}
                  refused_paths: {type: array, items: {type: string}}
        "400": {description: "Empty files, missing kind, or invalid JSON"}
  /api/autonomous/shipped/counts:
    get:
      summary: Per-status counts under the shipped-state surface
      description: |
        One count per displayed status across the whole stored Automaton store
        and the whole stored Automation store, under the in-force
        `autonomous.shipped` settings: while the state is on and counted
        separately, a record whose work landed counts as **shipped** regardless
        of the status it carries, so the shipped list is that bucket and a
        cancelled-and-shipped record is both. The four in-force settings
        (`enabled`, `show_chip`, `filter_default`, `count_separately`) ride
        along. Read-only; the response carries an `ETag`. The Shipped
        dashboard card loads this live.
      operationId: autonomousShippedCounts
      tags: [Autonomous]
      responses:
        "200":
          description: "Per-status counts of both stores plus the in-force settings"
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippedCountsResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "405": {description: "Method not allowed"}
        "503": {description: "autonomous disabled"}
  /api/autonomous/shipped/backfill:
    post:
      summary: Run one shipped-state backfill pass
      description: |
        One pass over the base repository's default branch (the `MAIN_BRANCH`
        env var, or `main` when unset): every merge commit naming an
        `automaton/<id>` branch records shipped state (`source` `backfill`) on
        the matching Automaton — where one exists — and on each Automation that
        has a non-skipped member whose non-skipped members are all shipped. It
        never touches any status: a cancelled Automaton whose merge commit
        is on the branch is marked shipped while staying cancelled, and one
        with no merge stays plain cancelled (what `left_cancelled`
        counts). A record that already carries shipped state is left
        alone (counted, not re-recorded). `?dry_run=true` scans and computes
        the report without writing any record; absent, the default is to
        write. `prds_marked` and `prds_would_mark_cancelled` are the same
        in both modes — the dry run counts what it would mark, so it and
        the real run agree on them. One bad record lands in the
        report's `errors` and the pass carries on. Audited as
        `shipped_backfill`.
      operationId: autonomousShippedBackfill
      tags: [Autonomous]
      parameters:
        - {name: dry_run, in: query, required: false, schema: {type: boolean, default: false}, description: "Scan and compute the report without writing any record. A value that cannot be parsed is a 400."}
      responses:
        "200":
          description: "The pass's report"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippedBackfillReport"
        "400": {description: "Unparseable `dry_run` value, or the pass could not run (for instance the repository is not present)"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: "Federated peer lacks the autonomous write capability"}
        "405": {description: "Only POST is provided"}
        "503": {description: "autonomous disabled"}
  /api/autonomous/prds/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      summary: Fetch one PRD with story+task tree
      description: |
        Each task may carry `undeclared_edits`: an array of
        `{path: string, lines_changed: integer}` for files the task's worker
        committed that are in neither the task's planned nor generated files
        (lines summed across retries). Absent when there are none. Enforcement
        is `autonomous.undeclared_edit_mode` (off|warn|block, default warn).
        `detail` picks the response level: `full` (default) is the whole PRD;
        `tasks` is per-task rows (id, title, status, error, verification,
        session id) without specs or story text; `summary` is ids, titles,
        statuses and counts.
        Tasks that are actively running (status in_progress or verifying)
        additionally carry `progress` — the live snapshot shown in
        TaskProgress — and `looping_warning`, set when the worker appears to
        re-issue the same tool call on consecutive polls. `progress` is
        stripped the instant a task leaves the active statuses, so its
        absence means the task's worker is not running right now.
        A task row (the `tasks` detail level, and each task of the `full` detail)
        carries `model_request` when the request watch observes that task's
        worker or verifier waiting on a model request: the same observation
        the request-watch route lists (RequestWatchObservation), whose
        `summary` says in plain words whether the request is generating or has
        made no progress for N minutes. It is omitted when there is none, and
        the task's `status` is unchanged.
        A task's `status` can be `waiting_decision`: its spec names an operator
        decision that has no answer yet and the decision gate is holding it. The
        task has not started; it is not a failure and not a retry. Its
        `wait_reason` is one plain sentence naming the decision (and, while the
        decision is open, the first 160 characters of the question), and when the
        decision is answered the task goes back to `pending` by itself and the
        reason clears. The gate holds tasks only when
        `autonomous.questions.decision_gate_mode` is `on`; in `shadow` (the default)
        no task has this status. Treat `waiting_decision` as an active status, not a
        finished one. The `decisions` array is the Automaton's decision log, each
        entry shaped as AutomatonDecisionLogEntry; its entries for operator
        decisions carry `question_id`, `answer_id` and `decision_state`.
        The summary shape still carries `push_state` and `push_warning` at the
        top level of the reply; the full shape carries the PRD's git state with
        its push outcome (`push_state`, `pushed_ref`, `pushed_sha`, `pushed_at`,
        `push_warning`).
        An Automaton carries `authorized_paths` (the protected paths its tasks
        may change without an operator decision, set by
        `POST /api/autonomous/prds/{id}/set_authorized_paths`) when any are set.
        A task held because its commit changed protected paths carries
        `protected_path_hold` (shaped as ProtectedPathHold), and a task whose
        protected paths the operator approved carries `approved_protected_paths`,
        the paths its commit may change. All three are absent when empty.
      operationId: autonomousPRDGet
      tags: [Autonomous]
      parameters:
        - {name: detail, in: query, required: false, schema: {type: string, enum: [full, tasks, summary], default: full}}
      responses:
        "200":
          description: The PRD (full detail shown; summary and tasks are subsets of it)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomousPrdListItem'
        "404": {description: Not found}
        "400": {description: "Bad detail value (expected full, tasks or summary)"}
    delete:
      summary: Cancel + archive a PRD
      description: |
        Bare DELETE cancels the PRD; `?hard=true` permanently deletes it
        (plus spawned child PRDs). Either way the PRD's worker sessions are
        killed (best-effort) and the response names them so an operator can
        verify no unrelated session was stopped.
      operationId: autonomousPRDCancel
      tags: [Autonomous]
      parameters:
        - {name: hard, in: query, required: false, schema: {type: boolean}, description: "true = permanent delete instead of cancel"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  status: {type: string, enum: [cancelled, deleted]}
                  killed_sessions: {type: integer, description: "Number of session slots recorded on the PRD's tasks (may include empty slots)"}
                  killed_live_sessions: {type: integer, description: "How many of those sessions were still live (not already ended) when the cancel began, counted before any kill was issued"}
                  killed_session_ids: {type: array, items: {type: string}, description: "Session IDs a kill was attempted on; always an array, [] when none"}
                  kill_errors: {type: object, additionalProperties: {type: string}, description: "Present only when a kill failed; session ID -> error"}
                  memory_strategy: {type: string, description: "Hard delete only: keep | purge | archive"}
  /api/autonomous/prds/{id}/plan_coverage/acknowledge:
    post:
      summary: Acknowledge the PRD's failing plan-coverage report
      description: |
        Operator-acknowledge the PRD's stored failing plan-requirement coverage
        report (the block-mode gate). The ack is pinned to the exact failing
        surface at the time it is recorded (unmatched requirements + structural
        findings), so approving after the plan changed needs a fresh ack.
        A non-empty `note` is required.
      operationId: autonomousPRDAcknowledgePlanCoverage
      tags: [Autonomous]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                actor: {type: string, description: "Operator identity recorded on the ack (default `operator` when absent)"}
                note: {type: string, description: "Non-empty justification for accepting the failing coverage surface"}
      responses:
        "200": {description: Acknowledged PRD}
        "400": {description: No report to ack, already acked, or missing `note`}
  /api/autonomous/prds/{id}/plan_coverage:
    get:
      summary: Read an Automaton's stored plan coverage record
      description: |
        Read-only view of an Automaton's plan-coverage state: `plan_coverage`
        is the stored record (null when no report has been computed yet); it
        pins its own `filters` as they were in effect when the report was
        computed and carries the operator acknowledgement. The top-level
        `filters` is the filterset in effect NOW (`autonomous.
        plan_coverage_suppress_created_files`, `autonomous.
        plan_coverage_scoped_requirements`, `autonomous.
        plan_coverage_requirement_sections`, `autonomous.
        plan_coverage_min_requirement_chars`), so the two can differ after a
        config change. The top-level `suppressed` repeats the record's own
        per-category withheld-finding counts plus their `total`, and is all
        zeroes when the record is absent. Read-only: only GET is served, and a
        federated peer needs the autonomous read capability.
      operationId: autonomousPRDPlanCoverage
      tags: [Autonomous]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200":
          description: The stored plan coverage record and the filters in effect now
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, description: "Automaton id"}
                  status: {type: string, description: "Automaton status"}
                  plan_coverage:
                    nullable: true
                    description: "The stored record; null when no report has been computed yet"
                    allOf: [{$ref: "#/components/schemas/PlanCoverageRecord"}]
                  filters: {$ref: "#/components/schemas/PlanCoverageFilters"}
                  suppressed: {$ref: "#/components/schemas/PlanCoverageSuppressed"}
        "404": {description: Not found}
        "405": {description: Method not allowed}
  /api/autonomous/generated-artefacts:
    get:
      summary: Generated-artefact settings and kinds
      description: |
        The effective `autonomous.generated_artefacts.*` switches (unset reads
        as on) plus every artefact kind with its format description and its
        default tracked path (the placeholder `<automaton-id>` stands for the
        Automaton id). Read-only; a federated peer needs the autonomous read
        capability. Writable through `PUT /api/config` with the dotted keys
        `autonomous.generated_artefacts.change_record`, `.gate_report`,
        `.changelog_draft`, `.parity_draft`, `.tracker_rows`, `.registry_row`
        and `.combined_docs_task` (booleans); a change applies to a running
        daemon without restart.
      operationId: autonomousGeneratedArtefacts
      tags: [Autonomous]
      responses:
        "200":
          description: Settings in effect and the artefact kinds
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                    properties:
                      change_record: {type: boolean}
                      gate_report: {type: boolean}
                      changelog_draft: {type: boolean}
                      parity_draft: {type: boolean}
                      tracker_rows: {type: boolean}
                      registry_row: {type: boolean}
                      combined_docs_task: {type: boolean}
                  kinds:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: {type: string, enum: [gate_report, changelog_draft, parity_draft, tracker_rows, registry_row]}
                        enabled: {type: boolean}
                        format: {type: string}
                        tracked_path: {type: string}
        "405": {description: Method not allowed}
  /api/autonomous/prds/{id}/change-record:
    get:
      summary: Read an Automaton's stored merged change record
      description: |
        The merged change record (files, packages, settings, routes, locale
        keys, tests added, commands run). When only per-task records exist they
        are merged on the fly. 404 for an unknown id or when no record is
        stored. Read-only; needs the autonomous read capability.
      operationId: autonomousPRDChangeRecord
      tags: [Autonomous]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: The change record, content: {application/json: {schema: {type: object}}}}
        "404": {description: Unknown id, or no change record stored}
        "405": {description: Method not allowed}
  /api/autonomous/prds/{id}/generated/{kind}:
    get:
      summary: Preview a generated artefact without writing it
      description: |
        Renders the artefact from the stored change record and returns the
        text and its tracked path. Nothing is written. `enabled` is false and
        `content` empty when the kind is switched off. 404 for an unknown id
        or kind. Needs the autonomous read capability.
      operationId: autonomousPRDGeneratedArtefact
      tags: [Autonomous]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: kind, in: path, required: true, schema: {type: string, enum: [gate_report, changelog_draft, parity_draft, tracker_rows, registry_row]}}
      responses:
        "200":
          description: The rendered preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  kind: {type: string}
                  path: {type: string}
                  enabled: {type: boolean}
                  content: {type: string}
                  warnings: {type: array, items: {type: string}}
        "404": {description: Unknown id or kind}
        "405": {description: Method not allowed}
  /api/autonomous/prds/{id}/generated/{kind}/regenerate:
    post:
      summary: Re-render a generated artefact and write it
      description: |
        Re-renders the artefact and writes it to its tracked path. A file a
        person edited is kept: the result is `skipped` with a `reason`. A kind
        that is switched off returns `disabled`. Needs the autonomous write
        capability.
      operationId: autonomousPRDRegenerateArtefact
      tags: [Autonomous]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: kind, in: path, required: true, schema: {type: string, enum: [gate_report, changelog_draft, parity_draft, tracker_rows, registry_row]}}
      responses:
        "200":
          description: The write outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  kind: {type: string}
                  status: {type: string, enum: [written, skipped, disabled]}
                  path: {type: string}
                  reason: {type: string}
                  warnings: {type: array, items: {type: string}}
        "404": {description: Unknown id or kind}
        "405": {description: Method not allowed}
  /api/autonomous/prds/{id}/decompose:
    post:
      summary: Run LLM decomposition for a PRD
      operationId: autonomousPRDDecompose
      tags: [Autonomous]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: OK}}
  /api/autonomous/prds/{id}/plan-review:
    post:
      summary: Run (or re-run) the pre-approval plan review
      description: |
        Runs the configured plan reviewer over the PRD's current plan — a
        bounded projection of the spec plus the stories'/tasks' titles, specs,
        dependencies, kinds and verification scripts — and records a fresh
        `plan_review` verdict on the PRD. Mode effects (all modes allow the
        re-run):
        - `off` (default): no review runs and approval is never affected;
          a re-run is a no-op that returns the PRD as stored.
        - `warn`: the verdict is recorded and visible but never blocks approval.
        - `block`: a verdict with `ok: false` refuses
          `POST /api/autonomous/prds/{id}/approve` until the verdict is
          replaced (re-run this endpoint until it passes, or re-decompose).
        A reviewer outage or unparseable verdict is recorded with
        `reviewer_failed: true` and never blocks approval in any mode.
        Only the latest verdict counts — re-running or re-decomposing
        replaces the previous one. Reviewer cost/tokens appear on the
        verdict when the backend reports them (`est_cost_usd`,
        `tokens_in` / `tokens_out`; 0 when unavailable).
        Config: `autonomous.plan_review_backend`, `autonomous.plan_review_model`,
        `autonomous.plan_review_mode` (off | warn | block), settable here,
        via MCP `autonomous_config_set`, comm
        `configure autonomous.plan_review_mode=...`, CLI
        `datawatch config set`, or `~/.datawatch/config.yaml`.
      operationId: autonomousPRDPlanReview
      tags: [Autonomous]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: {type: string, description: "Operator identity, recorded on the decision row"}
                note: {type: string, description: "Free-text note for the decision row"}
      responses:
        "200":
          description: Updated PRD carrying the new `plan_review` verdict
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AutonomousPRD"}
        "400":
          description: "PRD not found, the review call failed, or the plan-review surface is not wired (old binary shape)"
        "403":
          description: "Federation peer or scoped session token lacks the autonomous-write capability"
        "409":
          description: "State conflict — the PRD is not in a reviewable (decomposed) state"
        "405":
          description: "Method not allowed (plan review is POST-only)"
  /api/autonomous/prds/{id}/run:
    post:
      summary: Kick the executor for a PRD
      operationId: autonomousPRDRun
      tags: [Autonomous]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: OK}}
  /api/autonomous/prds/{id}/set_llm:
    post:
      summary: Set a PRD's worker-LLM override fields
      description: Sets the PRD-level worker LLM override. Fields the caller omits are left unchanged; an empty string ("") clears that field (falls back to global). Applied settings are audit-logged and appended to the PRD's decision log.
      operationId: autonomousPRDSetLLM
      tags: [Autonomous]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                backend: {type: string, description: "Omitted = unchanged; empty string = cleared"}
                effort: {type: string, description: "Omitted = unchanged; empty string = cleared"}
                model: {type: string, description: "Omitted = unchanged; empty string = cleared"}
                decomposition_profile: {type: string, description: "Omitted = unchanged; empty string = cleared"}
                guardrail_backend: {type: string, description: "Optional; omitted = unchanged; empty string = cleared"}
                guardrail_model: {type: string, description: "Optional; omitted = unchanged; empty string = cleared"}
      responses:
        "200": {description: Updated PRD}
  /api/autonomous/prds/{id}/set_task_node:
    post:
      summary: Pin a task to a compute node
      description: |
        Makes a task's worker run on the named compute node, or clears the pin
        when `node` is empty. The node must be registered and must serve the
        model the task resolves to. When it does not, what happens follows
        `autonomous.model_routing.refusal_mode`: `refuse` (the default) rejects
        the pin with 400 and a message that names the model and the node, `warn`
        applies the pin and records a warning in the Automaton's decision log. A
        node that is not registered is always rejected. Accepted under the same
        status rule as `set_task_llm` (`autonomous.task_override_statuses`). The
        task then carries `pinned_node`. Applied pins are audit-logged and
        appended to the Automaton's decision log.
      operationId: autonomousPRDSetTaskNode
      tags: [Autonomous]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id]
              properties:
                task_id: {type: string}
                node: {type: string, description: "Compute node name. Empty clears the pin"}
                actor: {type: string, description: "Who made the change. Defaults to operator"}
      responses:
        "200": {description: The updated Automaton}
        "400": {description: "task_id missing, the task is unknown, the status does not allow the change, or the pin was refused because the node is not registered or does not serve the model"}
        "403": {description: "Federation peer or scoped session token lacks the autonomous-write capability"}
        "405": {description: Method not allowed}
  /api/autonomous/prds/{id}/set_story_node:
    post:
      summary: Pin a story to a compute node
      description: |
        Makes the workers of every task in a story that has no pin of its own run
        on the named compute node, or clears the story's pin when `node` is empty.
        The rules, the refusal and the warning are those of `set_task_node`; the
        model checked is the one the story's tasks resolve to. The story then
        carries `pinned_node`.
      operationId: autonomousPRDSetStoryNode
      tags: [Autonomous]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [story_id]
              properties:
                story_id: {type: string}
                node: {type: string, description: "Compute node name. Empty clears the pin"}
                actor: {type: string, description: "Who made the change. Defaults to operator"}
      responses:
        "200": {description: The updated Automaton}
        "400": {description: "story_id missing, the story is unknown, the status does not allow the change, or the pin was refused because the node is not registered or does not serve the model"}
        "403": {description: "Federation peer or scoped session token lacks the autonomous-write capability"}
        "405": {description: Method not allowed}
  /api/autonomous/prds/{id}/set_verifier_policy:
    post:
      summary: Set an Automaton's verifier policy override
      description: |
        Overrides the verifier policy mode and backend list for every task of the
        Automaton that has no task-level override. Precedence is task, then
        Automaton, then the global `autonomous.verifier_policy`; the mode and the
        backend list resolve independently. Fields the caller omits are left
        unchanged; an empty `mode` or an empty `backends` list clears that field,
        and clearing both makes the Automaton inherit again. Accepted only while the
        Automaton is `needs_review`, `revisions_asked` or `cancelled`; any other
        status is rejected with 400. Applied settings are audit-logged and appended
        to the Automaton's decision log.
      operationId: autonomousPRDSetVerifierPolicy
      tags: [Autonomous]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VerifierPolicyOverrideRequest"}
      responses:
        "200": {description: Updated Automaton}
        "400": {description: Unknown mode, empty or unknown backend entry, or the Automaton is locked}
        "403": {description: "Federation peer or scoped session token lacks the autonomous-write capability"}
  /api/autonomous/prds/{id}/set_task_verifier_policy:
    post:
      summary: Set a task's verifier policy override
      description: |
        Overrides the verifier policy mode and backend list for one task, the most
        specific level. Presence-aware like `set_verifier_policy`. Accepted while
        the Automaton's status is listed in `autonomous.task_override_statuses`;
        any other status is rejected with 400. Applied settings are audit-logged and
        appended to the Automaton's decision log.
      operationId: autonomousPRDSetTaskVerifierPolicy
      tags: [Autonomous]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/VerifierPolicyOverrideRequest"}
                - type: object
                  required: [task_id]
                  properties:
                    task_id: {type: string, description: "Task to override"}
      responses:
        "200": {description: Updated task}
        "400": {description: Missing task_id, unknown mode, empty or unknown backend entry, or the Automaton is locked}
        "403": {description: "Federation peer or scoped session token lacks the autonomous-write capability"}
  /api/autonomous/prds/{id}/edit_task:
    post:
      summary: Edit a task's spec, read-only mark or report path
      description: |
        Rewrites a task's spec and/or sets its `read_only` mark and/or its
        `report_path`. At least one of `new_spec`, `read_only` and
        `report_path` is required; an omitted field is left unchanged.
        A read-only task is one that changes no files, so it may skip the tree lock
        when `autonomous.parallel.read_only_tasks` is on. A `report_path` is the one
        clean repo-relative file the task may write (under `.datawatch/reports/`);
        it is only accepted when the task is read-only, including via a
        `read_only: true` in the same call.
        The same status gates as a
        spec edit apply to both fields: needs_review, revisions_asked and cancelled
        Automata, and a blocked Automaton's failed, blocked or review_needed (held)
        task. Editing never changes the task's status: a held task is requeued with
        resolve_task_review. A completed task is immutable.
      operationId: autonomousPRDEditTask
      tags: [Autonomous]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id]
              properties:
                task_id: {type: string, description: Task to edit}
                new_spec: {type: string, description: "New spec text; omit to keep the current spec"}
                read_only: {type: boolean, description: "Mark (true) or clear (false) the read-only flag; omit to leave it unchanged"}
                report_path: {type: string, description: "The one clean repo-relative report file the read-only task may write (under .datawatch/reports/); requires the task to be read-only; omit to leave it unchanged"}
                actor: {type: string, description: "Defaults to operator"}
      responses:
        "200": {description: Updated Automaton}
        "400": {description: "Missing task_id, none of new_spec / read_only / report_path given, truncated spec, invalid or non-read-only report_path, locked Automaton or task, or unknown task"}
        "403": {description: "Federation peer or scoped session token lacks the autonomous-write capability"}
  /api/autonomous/prds/{id}/add_task:
    post:
      summary: Add a task to a story
      description: |
        Appends a task to an existing story without re-running decompose. Allowed
        while the Automaton is needs_review, revisions_asked or cancelled. Set
        `read_only` true for a task that changes no files, and `report_path` to the
        one report (under `.datawatch/reports/`) it may write — a `report_path`
        is only accepted with `read_only` true.
      operationId: autonomousPRDAddTask
      tags: [Autonomous]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [story_id, title]
              properties:
                story_id: {type: string}
                title: {type: string}
                spec: {type: string}
                depends_on: {type: array, items: {type: string}, description: Task IDs in the same Automaton that must complete first}
                read_only: {type: boolean, default: false, description: "The task changes no files and may skip the tree lock"}
                report_path: {type: string, description: "The one clean repo-relative report file this read-only task may write (under .datawatch/reports/); requires read_only true"}
                actor: {type: string, description: "Defaults to operator"}
      responses:
        "200": {description: Updated Automaton}
        "400": {description: "Missing story_id or title, report_path without read_only, invalid report path, unknown dependency, or locked Automaton"}
        "403": {description: "Federation peer or scoped session token lacks the autonomous-write capability"}
  /api/autonomous/prds/{id}/set_failure_escalation:
    post:
      summary: Set or clear the failure escalation override on an Automaton or one task
      description: |
        Sets the failure escalation policy for one Automaton, or for one of its
        tasks when `task_id` is given. Each field of the policy (enabled,
        max_failures, steps) resolves on its own: a task's value beats the
        Automaton's, which beats the daemon default. Send `"policy": null` to
        remove the override at that level. Each failed attempt moves the task to
        the next worker on its ladder; after max_failures failed attempts the
        task is held for operator review. Applied changes are audit-logged and
        appended to the Automaton's decision log. Requires the `autonomous:write`
        capability for federation peers.
      operationId: autonomousPRDSetFailureEscalation
      tags: [Autonomous]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy]
              properties:
                task_id: {type: string, description: "Optional. Omitted or empty sets the override on the Automaton; a task ID sets it on that task."}
                policy:
                  nullable: true
                  description: "The override, or null to clear it at this level."
                  allOf:
                    - $ref: "#/components/schemas/FailureEscalationPolicy"
                actor: {type: string, description: "Who made the change; defaults to operator."}
      responses:
        "200": {description: Updated Automaton}
        "400": {description: "The policy is not valid, or the body could not be read"}
        "403": {description: "Caller lacks the autonomous:write capability"}
        "404": {description: "No Automaton, or no task with that ID in it"}
        "501": {description: "The daemon does not offer failure escalation operations"}
  /api/autonomous/prds/{id}/resolve_task_review:
    post:
      summary: Retry or cancel a task held for operator review
      description: |
        The operator's decision on a task whose status is review_needed. A
        retry requeues the task; it may carry a replaced spec, a worker (backend,
        model and effort for this task), a narrowed list of files it may
        change, a `read_only` mark and a `report_path` (the one clean repo-relative
        file a read-only task may write, under `.datawatch/reports/`). Every change
        is checked before anything is written; a refused change (a bad report
        path, a report path on a task that is not read-only, or a read-only task
        left with planned files) answers 400 and leaves the task held. The held
        attempt report is cleared, and the operator's note is
        given to the next attempt. A cancel cancels the task. The call works
        while the Automaton is running other tasks: it answers at once and starts
        no second executor, because the running executor picks the decision up.
        A task that is not held answers 409. Requires the `autonomous:write` capability for
        federation peers.
      operationId: autonomousPRDResolveTaskReview
      tags: [Autonomous]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, action]
              properties:
                task_id: {type: string, description: "The held task"}
                action: {type: string, enum: [retry, cancel]}
                spec: {type: string, description: "Retry only. A replacement task spec."}
                backend: {type: string, description: "Retry only. Worker backend for this task."}
                model: {type: string, description: "Retry only. Worker model for this task."}
                effort: {type: string, description: "Retry only. Worker effort for this task."}
                files: {type: array, items: {type: string}, description: "Retry only. The narrowed list of files the task may change."}
                read_only: {type: boolean, description: "Retry only. Mark (true) or clear (false) the read-only flag; omit to leave it unchanged."}
                report_path: {type: string, description: "Retry only. The one clean repo-relative report file the read-only task may write (under .datawatch/reports/); requires the task to be read-only after the change; omit to leave it unchanged."}
                note: {type: string, description: "Recorded on the decision log and given to the next attempt."}
                actor: {type: string, description: "Who made the decision; defaults to operator."}
      responses:
        "200": {description: Updated Automaton}
        "400": {description: "The action or a change is not valid, or the body could not be read"}
        "403": {description: "Caller lacks the autonomous:write capability"}
        "404": {description: "No Automaton, or no task with that ID in it"}
        "409": {description: "The task is not held for review"}
        "501": {description: "The daemon does not offer failure escalation operations"}
  /api/autonomous/learnings:
    get:
      summary: List extracted post-task learnings
      operationId: autonomousLearnings
      tags: [Autonomous]
      responses: {"200": {description: OK}}
  /api/autonomous/subscriptions:
    get:
      summary: List lifecycle event subscriptions
      description: |
        Returns the persisted lifecycle event subscriptions, optionally narrowed
        with the `owner` query parameter. Requires the `autonomous:read`
        capability.
      operationId: autonomousSubscriptionList
      tags: [Autonomous]
      parameters:
        - {name: owner, in: query, required: false, schema: {type: string}}
      responses:
        "200": {description: "The subscription records"}
        "503": {description: "Lifecycle subscriptions not wired"}
    post:
      summary: Create a lifecycle event subscription
      description: |
        Persists a new subscription (filter, sink, action, coalesce, one_shot,
        expires_at; the server assigns the id, a client-supplied id is not
        honoured) and returns it with 201. The new subscription takes effect
        live, without a daemon restart. Requires the `autonomous:write`
        capability.
      operationId: autonomousSubscriptionCreate
      tags: [Autonomous]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filter, sink]
              properties:
                owner: {type: string, description: "Optional owner tag; also usable as the list filter."}
                filter:
                  type: object
                  description: "At least one of kinds or level; level is prd|task|automation."
                  properties:
                    kinds: {type: array, items: {type: string}, description: "Known lifecycle event kinds."}
                    level: {type: string}
                    prd_id: {type: string}
                    task_id: {type: string}
                sink:
                  type: object
                  description: "comm, session, topic, alert or mcp_queue target."
                  properties:
                    type: {type: string}
                    target: {type: string}
                    text_template: {type: string}
                    send_input: {type: boolean}
                action: {type: object, description: "Optional labelled action text; not used by the test event."}
                coalesce: {type: boolean, description: "Human-facing sinks batch per Automaton during a quiet window."}
                one_shot: {type: boolean, description: "Fire once, then delete."}
                expires_at: {type: string, format: date-time}
      responses:
        "201": {description: "The created subscription record"}
        "400": {description: "Malformed body or failed validation"}
        "503": {description: "Lifecycle subscriptions not wired"}
    delete:
      summary: Delete a lifecycle event subscription
      description: |
        Deletes the subscription named by the `id` query parameter and
        returns 204. Requires the `autonomous:write` capability.
      operationId: autonomousSubscriptionDelete
      tags: [Autonomous]
      parameters:
        - {name: id, in: query, required: true, schema: {type: string}}
      responses:
        "204": {description: "Deleted"}
        "404": {description: "Unknown subscription id"}
        "503": {description: "Lifecycle subscriptions not wired"}
  /api/autonomous/subscriptions/{id}:
    put:
      summary: Replace a lifecycle subscription's mutable fields
      description: |
        Full replace of filter, sink, action, coalesce, one_shot and expires_at;
        owner is kept unless supplied. The id and created_at are kept. The
        change takes effect live. Requires the `autonomous:write` capability.
      operationId: autonomousSubscriptionUpdate
      tags: [Autonomous]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200": {description: "The updated subscription record"}
        "400": {description: "Malformed body or failed validation"}
        "403": {description: "Caller lacks the autonomous:write capability"}
        "404": {description: "Unknown subscription id"}
        "503": {description: "Lifecycle subscriptions not wired"}
    delete:
      summary: Delete a lifecycle event subscription
      description: |
        Deletes the subscription named in the path and returns 204. Also
        available as `DELETE /api/autonomous/subscriptions?id=` on the
        collection path. Requires the `autonomous:write` capability.
      operationId: autonomousSubscriptionDeleteByPath
      tags: [Autonomous]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "204": {description: "Deleted"}
        "404": {description: "Unknown subscription id"}
        "503": {description: "Lifecycle subscriptions not wired"}
  /api/autonomous/subscriptions/{id}/test:
    post:
      summary: Deliver a test event to a subscription's sink
      description: |
        Sends a synthetic prd.updated event whose message starts with `[test] `
        to just this subscription's sink. The action text is never used and a
        one-shot subscription is not consumed. Requires the `autonomous:write`
        capability.
      operationId: autonomousSubscriptionTest
      tags: [Autonomous]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Delivery outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  sink: {type: string}
                  error: {type: string}
        "403": {description: "Caller lacks the autonomous:write capability"}
        "404": {description: "Unknown subscription id"}
        "503": {description: "Test delivery not available"}
  /api/autonomous/events:
    get:
      summary: Poll the pending lifecycle events of a named queue
      description: |
        Reads the bounded pending-events queue fed by an `mcp_queue` lifecycle
        subscription sink (the queue name is the sink target). Returns the events
        after `since`, oldest first; pass the returned `next_cursor` back as
        `since` on the next call. `dropped` is true when events the caller had not
        yet seen were evicted from the queue. Requires the `autonomous:read`
        capability. 503 when the daemon runs without the subscription engine.
      operationId: autonomousEventsPending
      tags: [Autonomous]
      parameters:
        - {name: queue, in: query, required: true, schema: {type: string}, description: "Queue name (the target of an mcp_queue subscription)"}
        - {name: since, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}, description: "Return only events with a cursor greater than this"}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, default: 50, maximum: 200}, description: "Maximum events to return; values above 200 are capped"}
      responses:
        "200":
          description: Pending events page
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PendingEventsPage"}
        "400": {description: "Missing queue, or non-numeric since/limit"}
        "403": {description: "Caller lacks the autonomous:read capability"}
        "503": {description: "Pending events queue not wired"}

  # ─── Plugin framework (BL33, v3.11.0) ──────────────────────────
  /api/plugins:
    get:
      summary: List discovered plugins
      operationId: pluginsList
      tags: [Plugins]
      responses: {"200": {description: OK}}
  /api/plugins/reload:
    post:
      summary: Rescan the plugins directory
      operationId: pluginsReload
      tags: [Plugins]
      responses: {"200": {description: OK}}
  /api/plugins/{name}:
    parameters: [{name: name, in: path, required: true, schema: {type: string}}]
    get:
      summary: Fetch plugin manifest + invocation stats
      operationId: pluginGet
      tags: [Plugins]
      responses: {"200": {description: OK}, "404": {description: Not found}}
  /api/plugins/{name}/enable:
    post:
      summary: Enable a plugin
      operationId: pluginEnable
      tags: [Plugins]
      parameters: [{name: name, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: OK}}
  /api/plugins/{name}/disable:
    post:
      summary: Disable a plugin
      operationId: pluginDisable
      tags: [Plugins]
      parameters: [{name: name, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: OK}}
  /api/plugins/{name}/test:
    post:
      summary: Synthetic hook invocation for debugging
      operationId: pluginTest
      tags: [Plugins]
      parameters: [{name: name, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hook]
              properties:
                hook: {type: string}
                payload: {type: object}
      responses: {"200": {description: OK}, "400": {description: Bad Request}}
  /api/plugins/{name}/tokens:
    get:
      summary: The secrets a plugin references and the service tokens minted for it
      description: |
        Operator auth only — a federation peer (even full control) and a
        session-scoped credential are refused (403). Per secret the manifest
        references: the manifest fields that carry the reference
        (connection.auth.token, env.<KEY>) and whether the secret exists in
        the store. Plus the names and creation times of the service tokens
        minted for the service. Never returns a secret value or a token value.
      operationId: pluginTokensList
      tags: [Plugins]
      parameters: [{name: name, in: path, required: true, schema: {type: string}}]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  plugin: {type: string}
                  secrets:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        fields: {type: array, items: {type: string}}
                        exists: {type: boolean}
                  service_tokens:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        created_at: {type: string, format: date-time}
        "403": {description: Not an operator token (peer or session-scoped credential)}
        "404": {description: Unknown plugin}
        "405": {description: Method not allowed (GET only)}
        "503": {description: Plugin source not wired}
  # Plugin widgets (BL403). "token" is a reserved widget id: manifests may
  # not declare it, so the token path never collides with {widget_id}.
  /api/plugins/{name}/widgets:
    get:
      summary: List a plugin's declared widgets merged with their latest values
      description: Operator auth. Each entry is the manifest widget plus `value` (a WidgetValue, or null before any value arrived).
      operationId: pluginWidgetsList
      tags: [Plugins]
      parameters: [{name: name, in: path, required: true, schema: {type: string}}]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  plugin: {type: string}
                  widgets: {type: array, items: {$ref: '#/components/schemas/PluginWidgetView'}}
        "404": {description: Unknown plugin}
        "503": {description: Plugin widgets not wired}
  /api/plugins/{name}/widgets/token:
    post:
      summary: Mint (or rotate) the plugin's widget push token
      description: |
        Operator auth. The plugin must exist. The plaintext token is returned
        once; only its bcrypt hash is stored (<data_dir>/plugins/widget_tokens.json).
        Calling again rotates the token and invalidates the previous one.
      operationId: pluginWidgetTokenMint
      tags: [Plugins]
      parameters: [{name: name, in: path, required: true, schema: {type: string}}]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string}
        "404": {description: Unknown plugin}
  /api/plugins/{name}/widgets/{widget_id}:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string}}
      - {name: widget_id, in: path, required: true, schema: {type: string}}
    get:
      summary: One declared widget with its latest value
      description: Operator auth.
      operationId: pluginWidgetGet
      tags: [Plugins]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginWidgetView'}
        "404": {description: Unknown plugin, or widget not declared by the plugin}
    post:
      summary: Push a value for a push-mode widget
      description: |
        Authenticated with the plugin's own push token (`Authorization: Bearer <token>`
        from POST /api/plugins/{name}/widgets/token), not the operator token. The
        request body is the widget value itself: any JSON document, stored as-is
        (no {"data": ...} envelope), up to 65536 bytes.
      operationId: pluginWidgetPush
      tags: [Plugins]
      security: [{BearerToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {description: Any JSON value}
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated_at: {type: string, format: date-time}
        "400": {description: Body is not valid JSON}
        "401": {description: Missing, malformed or wrong push token}
        "404": {description: Unknown plugin, or widget not declared by the plugin}
        "409": {description: Widget is pull-mode; push is not accepted}
        "413": {description: Body over 65536 bytes}

