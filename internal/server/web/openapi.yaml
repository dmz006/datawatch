      responses:
        "200":
          description: Retained result entries, oldest to newest
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleResultEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller lacks the `autonomous:read` capability
        "404":
          description: No results recorded for this schedule
        "503":
          description: Schedule result store not available

  /api/servers:
    get:
      summary: List remote servers
      description: Returns the list of configured remote datawatch server connections.
      operationId: listServers
      tags: [System]
      responses:
        "200":
          description: Array of remote server entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RemoteServer"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/commands:
    get:
      summary: List saved commands
