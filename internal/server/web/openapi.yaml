      responses: {"200": {description: Subscribed}, "400": {description: Bad Request}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /api/discussion-subs/{discussion_id}/{session_name}:
    parameters:
      - {name: discussion_id, in: path, required: true, schema: {type: string}}
