        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/exit-hooks/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    put:
      summary: Update an exit hook
      operationId: exitHooksUpdate
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                action: {type: string, enum: [restart, notify]}
                notify_session: {type: string}
                notify_message: {type: string}
                cooldown_seconds: {type: integer}
