    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      summary: Disable an exit hook
      operationId: exitHooksDisable
      tags: [Sessions]
      responses: {"200": {description: Disabled}, "404": {description: Not found}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /api/exit-hooks/{id}/enable:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      summary: Enable an exit hook
      operationId: exitHooksEnable
      tags: [Sessions]
      responses: {"200": {description: Enabled}, "404": {description: Not found}, "401": {$ref: "#/components/responses/Unauthorized"}}

  # Routing rules (BL20)
  /api/routing-rules:
    get:
      summary: List backend auto-selection routing rules
      operationId: routingRulesList
      tags: [Routing]
      responses: {"200": {description: OK}}
    put:
      summary: Replace the routing rules set
      operationId: routingRulesSet
      tags: [Routing]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"200": {description: OK}, "400": {description: Bad Request}}
  /api/routing-rules/test:
    post:
      summary: Test which backend a given task string would route to
      operationId: routingRulesTest
      tags: [Routing]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [task], properties: {task: {type: string}, project_dir: {type: string}}}}}}
      responses: {"200": {description: OK}}

  # Federation (F19)
  /api/federation/sessions:
    get:
      summary: Aggregated session list across all federated peers
      operationId: federationSessions
      tags: [Federation]
      responses: {"200": {description: OK}}
  /api/federation/fingerprints:
    get:
      summary: This daemon's resource fingerprints for the calling peer — the operator's own labels and keyed hashes only, never the identity values behind them
      operationId: federationFingerprints
      tags: [Federation]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  fingerprints:
                    type: array
                    items:
                      type: object
                      required: [kind, name, hash]
                      properties:
                        kind: {type: string}
                        name: {type: string}
                        hash: {type: string}
        "400": {description: No peer identity for this token — /fingerprints is for federation peer tokens, not the admin token}
        "403": {description: Fingerprint exchange is not enabled for this peer}

  /api/federation/fingerprint-matches:
    get:
      summary: Fingerprint match records surfaced during reconciliation, for operator decision — each proposes that this daemon and a peer hold the same resource; identities travel as 8-char hash prefixes, never full values
      operationId: federationFingerprintMatches
      tags: [Federation]
      parameters:
        - name: state
          in: query
          required: false
          description: Optional filter — pending, confirmed or rejected
          schema: {type: string, enum: [pending, confirmed, rejected]}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: array
                    items:
                      type: object
                      required: [id, peer, kind, local_name, peer_name, state]
                      properties:
                        id: {type: string}
                        peer: {type: string}
                        kind: {type: string}
                        local_name: {type: string}
                        peer_name: {type: string}
                        hash_prefix: {type: string}
                        state: {type: string, enum: [pending, confirmed, rejected]}
                        first_seen: {type: string}
                        updated_at: {type: string}
        "403": {description: The caller lacks the federation:list capability}
        "503": {description: Fingerprint match store not configured on this daemon}
  /api/federation/fingerprint-matches/{id}/confirm:
    post:
      summary: Confirm one fingerprint match record (operator decision) — once confirmed, matching budget pools may be treated as the same resource
      operationId: federationFingerprintMatchConfirm
      tags: [Federation]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: The updated match record}
        "403": {description: The caller lacks the federation:write capability}
        "404": {description: No such match record}
        "503": {description: Fingerprint match store not configured on this daemon}
  /api/federation/fingerprint-matches/{id}/reject:
    post:
      summary: Reject one fingerprint match record (operator decision) — rejecting a previously confirmed match takes its resource pools back apart
      operationId: federationFingerprintMatchReject
      tags: [Federation]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: The updated match record}
        "403": {description: The caller lacks the federation:write capability}
        "404": {description: No such match record}
        "503": {description: Fingerprint match store not configured on this daemon}

  # Splash (BL69)
  /api/splash/info:
    get:
      summary: Render context for splash (logo, tagline, version)
      operationId: splashInfo
      tags: [Splash]
      responses: {"200": {description: OK}}
  /api/splash/logo:
    get:
      summary: Splash logo image
      operationId: splashLogo
      tags: [Splash]
      responses: {"200": {description: OK, content: {image/svg+xml: {}, image/png: {}}}}

  # Operator-facing singletons
  /api/ask:
    post:
      summary: Single-shot LLM ask — no session, no tmux
      operationId: ask
      tags: [Singletons]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: {type: string}
                backend: {type: string}
                model: {type: string}
      responses: {"200": {description: OK}, "503": {description: Backend not configured}}
  /api/assist:
    post:
      summary: Quick-response assistant — uses the configured assistant backend
      operationId: assist
      tags: [Singletons]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [text], properties: {text: {type: string}}}}}}
      responses: {"200": {description: OK}, "503": {description: Assistant backend not configured}}
  /api/audit:
    get:
      summary: Query the operator-action audit log
      operationId: auditQuery
      tags: [Singletons]
      parameters:
        - {name: actor, in: query, required: false, schema: {type: string}}
        - {name: action, in: query, required: false, description: "Exact match, or a prefix match when it ends in '*' (autonomous_budget_*, autonomous_*)", schema: {type: string}}
        - {name: subject, in: query, required: false, description: Exact match on the entry subject (task id, backend or LLM name), schema: {type: string}}
        - {name: session_id, in: query, required: false, schema: {type: string}}
        - {name: since, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: until, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: limit, in: query, required: false, schema: {type: integer}}
      responses: {"200": {description: OK}, "400": {description: since or until is not RFC 3339}}
  /api/cooldown:
    get:
      summary: Current global rate-limit cooldown state
      operationId: cooldownGet
      tags: [Singletons]
      responses: {"200": {description: OK}}
    put:
      summary: Set or clear the global cooldown
      operationId: cooldownSet
      tags: [Singletons]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"200": {description: OK}}
  /api/usage-backoff:
    get:
      summary: Active per-backend usage back-off flags, effective config, pattern staleness (patterns_version, patterns_stale) and claude_cli_version
      operationId: usageBackoffGet
      tags: [Singletons]
      responses: {"200": {description: OK}}
    post:
      summary: Set a back-off flag for a backend (minutes or until, optional reason)
      operationId: usageBackoffSet
      tags: [Singletons]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backend]
              properties:
                backend: {type: string}
                minutes: {type: integer, minimum: 1}
                until: {type: string, format: date-time}
                reason: {type: string}
      responses: {"200": {description: OK}, "400": {description: Invalid request}}
    delete:
      summary: Clear one backend's back-off flag, or all flags when no backend is given
      operationId: usageBackoffClear
      tags: [Singletons]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                backend: {type: string}
      responses: {"200": {description: OK}}
  /api/usage-backoff/recheck:
    post:
      summary: Record the current rate-limit patterns and claude_cli_version as rechecked (clears patterns_stale)
      operationId: usageBackoffRecheck
      tags: [Singletons]
      responses: {"200": {description: OK}}
  /api/usage/readings:
    get:
      summary: The account's shared usage record — the keeper's live series, or the peer's copy of the keeper (its last known copy when the keeper is unreachable, marked stale / copied_at)
      operationId: usageReadingsGet
      tags: [Singletons]
      responses:
        "200":
          description: OK. Each reading carries the Claude lane count the keeper stamped on it (lanes) and where that count came from (lanes_source)
          content:
            application/json:
              schema:
                type: object
                properties:
                  readings:
                    type: array
                    items: {$ref: "#/components/schemas/UsageReading"}
                  is_keeper: {type: boolean, description: True when this daemon owns the series}
                  stale: {type: boolean, description: On a peer, true when the keeper could not be read and the record is the last copy found on disk}
                  stale_reason: {type: string, description: Why the record is stale; present only when stale}
                  copied_at: {type: string, format: date-time, description: When the stale copy was taken; present only when stale}
        "503": {description: No series locally or from the peer, or the series is not available}
    post:
      summary: Append one reading to the shared record. source must be typed; pasted and account are planned and return 501. On a peer the write is forwarded to the keeper, which refuses the write when it is unreachable
      operationId: usageReadingAdd
      tags: [Singletons]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [percent]
              properties:
                at: {type: string, format: date-time, description: Defaults to now; more than 5 minutes in the future is rejected}
                percent: {type: number, minimum: 0, maximum: 1000}
                lanes:
                  type: integer
                  deprecated: true
                  description: Deprecated and ignored, accepted whatever it holds so older callers still work. The keeper stamps each reading with the Claude lanes running in its ledger; the stamp comes back as lanes and lanes_source on the stored reading
                source: {type: string, enum: [typed], description: empty means typed; pasted and account return 501}
      responses:
        "200":
          description: Appended; the stored reading is returned, carrying the lane stamp
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UsageReading"}
        "400": {description: Invalid reading, or an unknown source}
        "403": {description: Missing the usage write capability}
        "501": {description: source is planned but not built yet (pasted, account)}
        "503": {description: The keeper could not be reached (peer); nothing was stored}
    delete:
      summary: Remove one reading by id (operator form)
      operationId: usageReadingDelete
      tags: [Singletons]
      parameters:
        - {name: id, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: Removed}
        "400": {description: No id query parameter}
        "404": {description: No such reading}
  /api/usage/readings/{id}:
    delete:
      summary: Remove one reading by id (peer wire form)
      operationId: usageReadingDeleteById
      tags: [Singletons]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Removed}
        "404": {description: No such reading}
  /api/usage/remaining-work:
    put:
      summary: Set the typed remaining-work figure (daemon-local; 0 replaces the queued-tasks estimate)
      operationId: usageRemainingWorkSet
      tags: [Singletons]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points]
              properties:
                points: {type: number, minimum: 0}
      responses:
        "200": {description: Stored}
        "400": {description: Invalid figure}
        "503": {description: The calculator is not wired on this daemon}
    delete:
      summary: Clear the typed remaining-work figure (the finish-early estimate falls back to queued-task costing)
      operationId: usageRemainingWorkClear
      tags: [Singletons]
      responses: {"200": {description: Cleared}, "503": {description: The calculator is not wired on this daemon}}
  /api/usage/extra-credit:
    put:
      summary: Set the extra credit points (0 clears) on the shared record
      operationId: usageExtraCreditSet
      tags: [Singletons]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points]
              properties:
                points: {type: number}
      responses:
        "200": {description: Stored}
        "400": {description: Invalid figure}
        "503": {description: The keeper could not be reached, or the series is not available}
  /api/usage/advice:
    get:
      summary: Usage calculator advice — one set of numbers, three renderings; variant and policy are independent per-call overrides, lanes and cost are the finish-early ones
      operationId: usageAdvice
      tags: [Singletons]
      parameters:
        - {name: variant, in: query, required: false, schema: {type: string, enum: [pace-gauge, lane-planner, burn-ledger, all]}}
        - {name: policy, in: query, required: false, schema: {type: string, enum: [use-all, pace, finish-early]}}
        - name: lanes
          in: query
          required: false
          schema: {type: integer, minimum: 0}
          description: The what-if lane count (0 included). The advice plans with this many Claude lanes for this call only; it is not saved and does not change how many lanes are running. Without it the advice uses the lanes running now. The count the ledger reports is returned as lanes_running_now
        - name: cost
          in: query
          required: false
          schema: {type: number, minimum: 0}
          description: Per-task cost override (points/week) for the finish-early estimate
      responses:
        "200":
          description: The advice (numbers plus the selected rendering); carries X-Usage-Stale / X-Usage-Copied-At when the series is stale
          content:
            application/json:
              schema:
                type: object
                properties:
                  lanes_running_now:
                    type: integer
                    nullable: true
                    description: The Claude lane count in the capacity ledger at the moment of the call; null when no ledger is wired. Kept apart from lanes_stamped (the stamp on the newest usable reading) and what_if_lanes (the count asked for with the lanes parameter)
                  lanes_stamped: {type: integer, nullable: true, description: The lane count stamped on the newest reading whose lanes_source is live, recorded or current; null when no reading has one}
                  what_if_lanes: {type: integer, description: Present only when the call set the lanes parameter; never saved}
        "400": {description: Unknown variant or policy, or a malformed lanes / cost value}
        "503": {description: The calculator is not wired on this daemon}
  /api/usage/autolanes:
    get:
      summary: Auto-lanes status — the usage.calculator.auto_lanes settings, the cap the daemon currently enforces, the auto-lanes decision for the current advice (same rule as the hourly loop), special items, the last change and the daemon's auto-lanes decisions newest first
      operationId: usageAutoLanesStatus
      tags: [Singletons]
      responses:
        "200":
          description: The status; target and direction are null while auto_lanes is disabled or the advice cannot be evaluated
          content:
            application/json:
              schema:
                type: object
                required: [enabled, policy, max, special_items, recent_changes]
                properties:
                  enabled: {type: boolean, description: usage.calculator.auto_lanes}
                  policy: {type: string, description: The policy in force (use-all, pace, finish-early)}
                  max: {type: integer, description: The operator max (usage.calculator.auto_lanes_max)}
                  current_max_inflight:
                    type: integer
                    nullable: true
                    description: The cap enforced on this daemon — the max_inflight of the first enabled claude-code LLM entry; null when there is none
                  target:
                    type: integer
                    nullable: true
                    description: The cap the auto-lanes decision lands on for the current advice (operator_max clamps it); null while disabled or when the advice cannot be evaluated
                  direction:
                    type: string
                    nullable: true
                    enum: [up, down, unchanged]
                    description: The target relative to current_max_inflight; null together with target
                  last_change:
                    type: object
                    nullable: true
                    description: The newest recorded decision that actually moved the cap; null until the loop has moved it
                    properties:
                      at: {type: string, format: date-time}
                      from: {type: integer}
                      to: {type: integer}
                      reason: {type: string}
                  special_items:
                    type: integer
                    minimum: 0
                    description: Open items at the configured auto_lanes_special_priority threshold (the auto-lanes guardrail); 0 before the first count is known
                  recent_changes:
                    type: array
                    description: The auto-lanes decision log, newest first, at most 50 entries
                    items:
                      type: object
                      properties:
                        at: {type: string, format: date-time}
                        from: {type: integer}
                        to: {type: integer}
                        reason: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Missing the usage read capability}
        "405": {description: This endpoint accepts GET only}
        "503": {description: auto_lanes is enabled but the calculator is not wired on this daemon}
  /api/usage/burn-guard:
    get:
      summary: Burn guard status — state, the current rung, the projection against the pace line and the last decision
      operationId: burnGuardStatus
      tags: [Singletons]
      responses:
        "200":
          description: The status; state is off when the guard is not running on this daemon
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: {type: boolean}
                  state: {type: string, enum: [off, idle, guarding, waiting]}
                  rung: {type: string, description: The rung currently in force; empty when none}
                  level: {type: integer, description: How many rungs of the ladder are applied}
                  applied: {type: array, items: {type: string}, description: The rungs applied now}
                  line: {type: number, description: The pace line in weekly points}
                  margin: {type: number}
                  last_projection: {type: object, description: "Projected weekly burn (projected), the pace line (line), the margin and how far it is over (over_by)"}
                  last_decision: {type: object, description: "The last evaluation: direction (hold, climb, step_back, disabled), rung, level, previous and reason"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/usage/burn-guard/run:
    post:
      summary: Evaluate the burn guard now and return the decision with the refreshed status
      operationId: burnGuardRun
      tags: [Singletons]
      responses:
        "200": {description: The decision and the refreshed status}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: The burn guard is not running on this daemon}
  /api/usage/burn-guard/config:
    get:
      summary: The live usage.burn_guard settings
      operationId: burnGuardConfigGet
      tags: [Singletons]
      responses:
        "200":
          description: "The settings: enabled, interval_minutes, margin_points, ladder, step_back, ask_on_change, cache_write_points_per_million, cache_read_points_per_million, refit_on_reading, effort_ceiling, retry_limit_claude, max_projection_gap_points"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BurnGuardConfig"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    put:
      summary: Change burn guard settings; one invalid value rejects the whole body and nothing is stored
      description: |
        The body is a flat map of bare keys, for example
        `{"margin_points": 3, "ladder": ["lower_inflight"]}`. The values go through
        the same validation and save as `PUT /api/config` with
        `usage.burn_guard.<key>`. The effort ceiling is set per Automation, not here.
      operationId: burnGuardConfigPut
      tags: [Singletons]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BurnGuardConfig"}
      responses:
        "200": {description: "{ok: true, config: the stored settings}"}
        "400": {description: A body that is empty, an unknown key or an invalid value}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/budget:
    get:
      summary: Dollar budget state of every LLM that has a budget, or one LLM with ?llm=
      operationId: budgetGet
      tags: [Singletons]
      parameters:
        - {name: llm, in: query, required: false, schema: {type: string}}
      responses: {"200": {description: OK}, "404": {description: The LLM has no budget}}
  /api/budget/usage:
    get:
      summary: This daemon's own spend for an LLM, never including peer spend; from and to default to this daemon's window
      operationId: budgetUsageGet
      tags: [Singletons]
      parameters:
        - {name: llm, in: query, required: true, schema: {type: string}}
        - {name: from, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: false, schema: {type: string, format: date-time}}
      responses: {"200": {description: OK}, "400": {description: Invalid request}, "404": {description: No budget window to default to}}
  /api/diagnose:
    get:
      summary: Diagnostic snapshot — backend reachability, config validity, recent errors
      description: |
        In addition to the snapshot, the response carries one informational
        `listener_<name>` check per daemon listener: listener_rest,
        listener_rest_tls, listener_mcp_sse, listener_proxy_sandbox,
        listener_webhook, listener_github_webhook, listener_twilio_webhook.
        Each is posture reporting, not a failure: `ok` is always `true` and
        the overall `ok` flag is unaffected by listener auth posture (an
        exposed, unauthenticated listener still reports every other check
        normally).
        Each check's detail string has the form
        `address=… enabled=… auth_required=… loopback=… acknowledged=… exposed=…`.
        `exposed` is true exactly when the listener is enabled, bound to a
        non-loopback address, and not token-protected. `acknowledged`
        reflects `server.acknowledge_unauthenticated` (default false).
      operationId: diagnose
      tags: [Singletons]
      responses: {"200": {description: OK}}
  /api/analytics:
    get:
      summary: Aggregate analytics — session counts, backend distribution, cost summary
      operationId: analytics
      tags: [Singletons]
      responses: {"200": {description: OK}}
  /api/reload:
    post:
      summary: Hot config reload — equivalent to SIGHUP
      operationId: reload
      tags: [Singletons]
      responses: {"200": {description: Reloaded}, "400": {description: Config invalid}}
  /api/project/summary:
    get:
      summary: Project overview — git status + sessions + stats
      operationId: projectSummary
      tags: [Singletons]
      parameters:
        - {name: dir, in: query, required: true, schema: {type: string}}
      responses: {"200": {description: OK}, "400": {description: Missing dir}}

  # Work Queue (BL357)
  /api/queue:
    get:
      summary: List work queue items
      operationId: queueList
      tags: [Queue]
      parameters:
        - {name: role, in: query, required: false, schema: {type: string}}
        - {name: state, in: query, required: false, schema: {type: string, enum: [pending, claimed, complete, failed]}}
      responses:
        "200":
          description: Array of queue items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueueItem"
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/queue/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    delete:
      summary: Delete a queue item
      operationId: queueDelete
      tags: [Queue]
      responses: {"200": {description: Deleted}, "404": {description: Not found}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /api/queue/claim:
    post:
      summary: Claim a queue item for processing
      operationId: queueClaim
      tags: [Queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, claimed_by]
              properties:
                role: {type: string}
                claimed_by: {type: string}
                lease_seconds: {type: integer}
      responses:
        "200":
          description: Claimed item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueItem"
        "404": {description: No pending item for this role}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/queue/complete:
    post:
      summary: Mark a queue item as complete
      operationId: queueComplete
      tags: [Queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: {type: string}
                result: {type: object}
      responses: {"200": {description: Completed}, "404": {description: Not found}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /api/queue/fail:
    post:
      summary: Mark a queue item as failed
      operationId: queueFail
      tags: [Queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, error]
              properties:
                id: {type: string}
                error: {type: string}
      responses: {"200": {description: Marked failed}, "404": {description: Not found}, "401": {$ref: "#/components/responses/Unauthorized"}}
  /api/queue/push:
    post:
      summary: Push a new item onto the work queue
      operationId: queuePush
      tags: [Queue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: {type: string}
                payload: {type: object}
      responses:
        "200":
          description: Item enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueItem"
        "400": {description: Bad Request}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/projects:
    get:
      summary: List project aliases
      operationId: projectsList
      tags: [Singletons]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: {type: string}
                    dir: {type: string}
                    default_backend: {type: string}
                    description: {type: string}
                    policy: {$ref: "#/components/schemas/ProjectPolicy"}
    post:
      summary: Upsert a project alias
      operationId: projectsUpsert
      tags: [Singletons]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, dir]
              properties:
                name: {type: string, description: "Project alias"}
                dir: {type: string, description: "Absolute directory"}
                default_backend: {type: string}
                description: {type: string}
                policy:
                  description: The per-project policy tier (optional); unset keys inherit from the daemon tier.
                  $ref: "#/components/schemas/ProjectPolicy"
                owner: {type: string, description: "Project record. Absent keeps the stored value; empty clears it"}
                repository: {type: string, description: "Project record: owner/name or URL"}
                default_branch: {type: string, description: "Project record: default git branch"}
                arcs:
                  type: array
                  description: "Project record: the ordered arc list. Absent keeps it; [] clears it"
                  items: {type: object}
                target:
                  type: object
                  properties:
                    name: {type: string}
                    definition_of_done: {type: string}
                lane_defaults:
                  type: object
                  properties:
                    lane: {type: string, description: "gpu, claude or any"}
                    backend: {type: string}
                    model: {type: string}
                weekly_share: {type: integer, minimum: 0, maximum: 100, description: "Percent of the weekly usage budget"}
                branch_retention_days: {type: integer, minimum: 0, description: "Days to keep finished Automaton branches"}
                major_trigger: {type: string, enum: [manual, milestone, never]}
      responses:
        "200": {description: OK}
        "400":
          description: name or dir missing, dir not absolute, or a policy field holds a value the key does not know — the body names the offending field
          content: {"text/plain": {schema: {type: string}}}
  /api/projects/{name}/rollup:
    get:
      summary: Project roll-up of arcs, Automata, task progress, points and throughput
      description: |
        Groups the project's Automata by the arc whose Automation holds them.
        Each arc reports its Automata with their session ids, task progress
        (done/total), cost in usage points and throughput. Automata of this
        project that no arc holds are in `unassigned`. An Automaton is placed in a
        project by its own project link, then the project of the Automation holding
        it, then its parent Automaton's project, then its directory; one resolved to
        another project is never in this project. Automata without a project (no
        link and no directory match, in no arc) are in `without_project`, which is
        the same whichever project is asked for and is not part of `total`;
        `total` sums the arcs and `unassigned`.
        Costs are points from the billing profile's point calibration, never
        API dollars. Throughput counts Automata finished in the window and tasks
        finished in the window, per day. An Automaton is finished when it is
        completed, when it is cancelled or archived and its work branch is already
        on the project's default branch, or when it carries a shipped record; its
        finish time is the merge or ship time when known, else its last update. A
        task counts from its own completion time, whatever the Automaton's final
        status, and never twice.
      operationId: projectsRollup
      tags: [Singletons]
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}, description: "Project alias"}
        - {name: window, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 365, default: 7}, description: "Window in days for throughput and cost"}
      responses:
        "200":
          description: The project roll-up
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: {type: string}
                  window_days: {type: integer}
                  generated_at: {type: string, format: date-time}
                  points_priced: {type: boolean, description: "True when at least one Automaton has a point figure"}
                  arcs: {type: array, items: {$ref: "#/components/schemas/ProjectRollupGroup"}}
                  unassigned: {$ref: "#/components/schemas/ProjectRollupGroup"}
                  without_project:
                    allOf: [{$ref: "#/components/schemas/ProjectRollupGroup"}]
                    description: "Automata without a project. Each is listed once, with its own tasks, points and throughput, and is not counted in total."
                  total: {$ref: "#/components/schemas/ProjectRollupGroup"}
        "400":
          description: window is not a whole number of days from 1 to 365
        "404":
          description: Unknown project
        "405":
          description: Method other than GET
        "503":
          description: Automations are not available
  /api/projects/{name}/history:
    get:
      summary: Project history of finished and archived Automata, daily progress and Gantt rows
      description: |
        Lists the project's completed and archived Automata (including earlier
        release work) merged with the project's daily progress snapshots, newest
        first and paged. `gantt` gives one row per Automaton and one per task
        with start, end and state from the stored timestamps. Gantt rows cover
        every matching Automaton and are not paged.
      operationId: projectsHistory
      tags: [Singletons]
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}, description: "Project alias"}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}, description: "Entries per page"}
        - {name: cursor, in: query, required: false, schema: {type: string}, description: "next_cursor of the previous page"}
      responses:
        "200":
          description: The project history page
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: {type: string}
                  generated_at: {type: string, format: date-time}
                  limit: {type: integer}
                  total: {type: integer}
                  has_more: {type: boolean}
                  next_cursor: {type: string}
                  items: {type: array, items: {type: object}}
                  gantt: {type: array, items: {type: object}}
        "400": {description: Bad limit or cursor}
        "404": {description: Unknown project}
        "503": {description: Automations not available}
  /api/projects/{name}/policy/effective:
    get:
      summary: Effective policy for one project
      description: |
        Resolves every policy setting for the project across the three tiers —
        the Automaton's own overrides, the project's policy block, and the
        daemon defaults — and returns each setting with the value in force
        and the tier (`automaton`, `project` or `daemon`) that supplied it.
        Pass `?automaton=\<id\>` to resolve with that Automaton's own policy
        fields; omitted, every setting resolves from the project and daemon
        tiers.
      operationId: projectsPolicyEffective
      tags: [Singletons]
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}, description: "Project alias"}
        - {name: automaton, in: query, required: false, schema: {type: string}, description: "Automaton ID whose own policy fields act as the top tier"}
      responses:
        "200":
          description: The resolved policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: {type: string}
                  automaton: {type: string, description: "The Automaton ID passed in, or absent"}
                  policy:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        value: {description: "The value in force; the shape follows the setting"}
                        source: {type: string, enum: [automaton, project, daemon]}
        "404":
          description: The project does not exist, or (with `?automaton=`) the Automaton does not
          content: {"text/plain": {schema: {type: string}}}
        "503":
          description: Autonomations are not available, so the Automaton tier cannot be resolved
          content: {"text/plain": {schema: {type: string}}}
  /api/projects/{name}:
    get:
      summary: Read one project alias and its record
      description: |
        Returns the project's directory, default backend, description, policy and
        the optional record fields (owner, repository, default branch, arcs, target,
        lane defaults, weekly share, branch retention and major trigger).
      operationId: projectsGet
      tags: [Singletons]
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}, description: "Project alias"}
      responses:
        "200": {description: The project record}
        "404": {description: Unknown project}
        "503": {description: Config not available}
    delete:
      summary: Delete a project alias
      description: Removes the alias only. The project directory is not touched.
      operationId: projectsDelete
      tags: [Singletons]
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}, description: "Project alias"}
      responses:
        "200": {description: Deleted}
        "404": {description: Unknown project}
  /api/projects/{name}/arcs:
    put:
      summary: Replace a project's ordered arc list
      description: |
        Body is a JSON array of arcs, or an object `{"arcs": [...]}`. Array position
        is the arc order. Each arc has `automation_id` (required, unique within the
        project), `priority` (integer) and `state` (`planned`, `active` or `done`;
        empty means planned). An empty list clears the arcs. Returns the project
        record.
      operationId: projectsSetArcs
      tags: [Singletons]
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}, description: "Project alias"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: array
                  items:
                    type: object
                    required: [automation_id]
                    properties:
                      automation_id: {type: string}
                      priority: {type: integer}
                      state: {type: string, enum: [planned, active, done]}
                - type: object
                  properties:
                    arcs:
                      type: array
                      items: {type: object}
      responses:
        "200": {description: The project record with the new arcs}
        "400": {description: Empty body, malformed JSON, duplicate or missing automation_id, or an unknown state; the message names the problem}
        "404": {description: Unknown project}
        "413": {description: Body larger than 1 MiB}
  /api/templates:
    get:
      summary: List session-start templates
      operationId: templatesList
      tags: [Singletons]
      responses: {"200": {description: OK}}
    post:
      summary: Upsert a template
      operationId: templatesUpsert
      tags: [Singletons]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"200": {description: OK}}
    delete:
      summary: Delete a template
      operationId: templatesDelete
      tags: [Singletons]
      parameters:
        - {name: name, in: query, required: true, schema: {type: string}}
      responses: {"200": {description: OK}}
  /api/servers/health:
    get:
      summary: Health of every configured remote datawatch server (proxy pool)
      operationId: serversHealth
      tags: [Singletons]
      responses: {"200": {description: OK}}
  /api/stats:
    get:
      summary: Legacy v1 stats (host + cpu + mem + disk, plus the `ui_prompts` Claude Code interstitial-prompt dismissal counts). Pass ?v=2 for the structured StatsResponse v2 (Observer)
      operationId: stats
      tags: [Singletons]
      parameters:
        - {name: v, in: query, required: false, schema: {type: string}, description: "Pass 2 for the structured v2 payload"}
      responses: {"200": {description: OK}}
  /api/ollama/stats:
    get:
      summary: Ollama-specific stats — running models, queue depth
      operationId: ollamaStats
      tags: [Singletons]
      responses: {"200": {description: OK}, "503": {description: Ollama not configured}}
  /api/git/secret-scan/stats:
    get:
      summary: Pre-push secret-scan counters plus the effective git.secret_scan mode
      description: |
        In-memory counters since daemon start (reset on restart). `mode` is
        the effective `git.secret_scan.mode` (off, shadow or enforce — unset
        defaults to shadow); `stats` carries `runs`, `findings`,
        `shadow_reports`, `refusals`, `last_run_at` and `last_refusal_at`
        (RFC 3339; `0001-01-01T00:00:00Z` when never recorded).
        Read-only; needs the health capability when called by a federation peer.
      operationId: gitSecretScanStats
      tags: [Singletons]
      responses:
        "200": {description: OK}
        "403": {description: Caller lacks the health capability}
        "405": {description: Method not allowed (GET only)}

  /api/questions:
    get:
      summary: List operator questions
      description: |
        Lists stored questions, filterable by `state`, `context`, `asker` and
        `text`, newest first up to `limit`. Every row is the stored question
        plus a computed `context_ref` (see the QuestionContextRef schema); the
        reference is built for this read and is not part of the stored record.
        Needs the autonomous read capability and `autonomous.questions.enabled`.
      operationId: listQuestions
      tags: [Questions]
      parameters:
        - {name: state, in: query, required: false, schema: {type: string, enum: [open, answered, withdrawn, expired, all]}}
        - {name: context, in: query, required: false, schema: {type: string, enum: [none, prd, task, proposal, registry_row, all]}}
        - {name: asker, in: query, required: false, schema: {type: string}}
        - {name: text, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: The matching questions
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: {type: integer}
                  questions:
                    type: array
                    items:
                      type: object
                      description: The stored question fields, plus the computed context_ref.
                      properties:
                        context_ref: {$ref: "#/components/schemas/QuestionContextRef"}
        "400": {description: Unknown state or context filter, or a bad limit, content: {"text/plain": {schema: {type: string}}}}
        "403": {description: Missing the autonomous read capability, content: {"text/plain": {schema: {type: string}}}}
        "503": {description: Operator questions are disabled or not available, content: {"text/plain": {schema: {type: string}}}}
    post:
      summary: Raise an operator question
      description: |
        Raises a question for the operator: text, at least two options, a
        context and a default. The optional `tradeoffs` object maps an option
        id to trade-off text; each entry fills that option's own `tradeoffs`
        when it has none, and an id that matches no option is a 400 naming it.

        After the question validates and before it is stored, the question
        quality check runs under `autonomous.questions.quality_mode`. It
        flags options without trade-offs, question text shorter than
        `quality_min_text_chars`, and text that matches
        `quality_tracker_id_pattern`. In `off` mode nothing is checked. In
        `warn` mode (the default) the question is stored and the 201 body
        carries the findings in `warnings`. In `refuse` mode nothing is
        stored and the answer is 422 with the findings, so the asker can fix
        the question and send it again. Needs the autonomous write
        capability and `autonomous.questions.enabled`.
      operationId: raiseQuestion
      tags: [Questions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context, text, options, default]
              properties:
                label: {type: string}
                asked_by: {type: string}
                asker_kind: {type: string}
                session_id: {type: string}
                context: {type: string}
                text: {type: string}
                options:
                  type: array
                  items:
                    type: object
                    required: [id, label]
                    properties:
                      id: {type: string}
                      label: {type: string}
                      tradeoffs: {type: string}
                tradeoffs:
                  type: object
                  description: Trade-off text keyed by option id; fills an option that has none of its own.
                  additionalProperties: {type: string}
                recommendation:
                  type: object
                  properties:
                    option_id: {type: string}
                    rationale: {type: string}
                default: {type: string}
                risk: {type: string}
                priority: {type: string}
                return_path: {type: boolean}
      responses:
        "201":
          description: The question was stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  question: {type: object}
                  warnings:
                    type: array
                    description: Quality findings, present only in warn mode when the check found something.
                    items:
                      type: object
                      properties:
                        code: {type: string, enum: [no_tradeoffs, text_too_short, tracker_id]}
                        message: {type: string}
        "400": {description: The question is malformed, or tradeoffs names an option that does not exist, content: {"text/plain": {schema: {type: string}}}}
        "403": {description: Missing the autonomous write capability, content: {"text/plain": {schema: {type: string}}}}
        "413": {description: Body larger than 64 KiB, content: {"text/plain": {schema: {type: string}}}}
        "422":
          description: Refused by the question quality check (refuse mode); nothing was stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string}
                  findings:
                    type: array
                    items:
                      type: object
                      properties:
                        code: {type: string, enum: [no_tradeoffs, text_too_short, tracker_id]}
                        message: {type: string}
        "503": {description: Operator questions are disabled or not available, content: {"text/plain": {schema: {type: string}}}}

  /api/questions/quality:
    get:
      summary: Effective question quality policy
      description: |
        The effective values of the question quality keys under
        `autonomous.questions`: `quality_mode` (off, warn or refuse),
        `quality_min_text_chars`, `quality_tracker_id_pattern` and
        `queue_preview_lines`. Absent keys read their defaults. Needs the
        autonomous read capability and `autonomous.questions.enabled`.
      operationId: questionQuality
      tags: [Questions]
      responses:
        "200":
          description: The effective policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: {type: string, enum: [off, warn, refuse]}
                  min_text_chars: {type: integer}
                  tracker_id_pattern: {type: string}
                  queue_preview_lines: {type: integer}
        "403": {description: Missing the autonomous read capability, content: {"text/plain": {schema: {type: string}}}}
        "405": {description: Method not allowed, content: {"text/plain": {schema: {type: string}}}}
        "503": {description: Operator questions are disabled, content: {"text/plain": {schema: {type: string}}}}

  /api/questions/{id}:
    get:
      summary: One operator question with its answer metadata
      description: |
        The question, the number of answers ever recorded, the id of the
        currently effective answer and that answer's summary (`answer` is null
        until the question is answered). The `question` object is the stored
        record plus a computed `context_ref`: the kind of context the question
        was raised in, a title, the id, and for a proposal the
        repository-relative `doc_path` and the in-app documents viewer link in
        `viewer_url`. The reference is built for this read and is not part of
        the stored record. Needs the autonomous read capability and
        `autonomous.questions.enabled`.
      operationId: getQuestion
      tags: [Questions]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The question and its answer metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  question:
                    type: object
                    description: The stored question fields, plus the computed context_ref.
                    properties:
                      context_ref: {$ref: "#/components/schemas/QuestionContextRef"}
                  answer_count: {type: integer}
                  current_answer_id: {type: string}
                  answer:
                    type: object
                    nullable: true
                    properties:
                      id: {type: string}
                      chosen_option_id: {type: string}
                      quote: {type: string}
                      actor: {type: string}
                      surface: {type: string}
                      created_at: {type: string, format: date-time}
        "403": {description: Missing the autonomous read capability, content: {"text/plain": {schema: {type: string}}}}
        "404": {description: Unknown question, content: {"text/plain": {schema: {type: string}}}}
        "503": {description: Operator questions are disabled or not available, content: {"text/plain": {schema: {type: string}}}}

  /api/questions:
    post:
      summary: Raise an operator question
      description: |
        Records an operator decision and returns it. Raise never blocks the
        asker, and the question is kept until it is answered or withdrawn —
        there is no deadline. An omitted asker and asker kind default to the
        caller and `operator`; an omitted context is not defaulted, the body
        must name one of `none`, `prd`, `task`, `proposal` or `registry_row`
        (the matching link, `prd_id` / `task_id` / `proposal_path` /
        `registry_row_key` present, `none` carrying none of them). One of the
        options or `hold` must be named as the default, so no choice is ever
        silent. Body cap 64 KiB; content after the JSON object is malformed.
        Needs the autonomous write capability when called by a federated
        peer.

        A question raised here is stored with `source` `rest` and is never
        `blocking`. A worker session can also raise a question without this
        route: a `DATAWATCH_QUESTION:` line in its output, acted on only while
        `autonomous.questions.enabled` and `autonomous.questions.worker_marker`
        are both on, is stored through the same path with `source` `marker`.
        A blocking one parks its task with the wait reason
        `await_decision: <question id>`. A marker line that fails validation
        is never stored; it is audited as `question_marker_refused` (session
        id, reason category and the SHA-256 of the line, never the text).
      operationId: questionRaise
      tags: [Questions]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QuestionRaise"}
      responses:
        "201": {description: "The stored question record"}
        "400": {description: "Malformed body, or a validation rule failed (every offending field named); nothing is stored", content: {"text/plain": {schema: {type: string}}}}
        "403": {description: "Federated peer lacks the autonomous write capability", content: {"text/plain": {schema: {type: string}}}}
        "405": {description: "Method not allowed", content: {"text/plain": {schema: {type: string}}}}
        "413": {description: "Body over the 64 KiB cap", content: {"text/plain": {schema: {type: string}}}}
        "500": {description: "The store could not append or replay the question", content: {"text/plain": {schema: {type: string}}}}
        "503": {description: "The autonomous.questions.enabled switch is off (named in the message), or the question store is not wired", content: {"text/plain": {schema: {type: string}}}}
    get:
      summary: List operator questions
      description: |
        Matches questions, newest first, with `count` (the returned length) and
        a `questions` array (empty array, never null, when nothing matches).
        `text` is a case-insensitive substring over the question text, the
        option labels and tradeoffs, and the answer quotes; `asker` is an
        exact match on `asked_by`. `limit` is a positive integer, default 100,
        capped at 1000. Needs the autonomous read capability when called by a
        federated peer.
      operationId: questionList
      tags: [Questions]
      parameters:
        - {name: state, in: query, required: false, schema: {type: string, enum: [open, answered, withdrawn, expired, all]}}
        - {name: context, in: query, required: false, schema: {type: string, enum: [none, prd, task, proposal, registry_row, all]}}
        - {name: asker, in: query, required: false, schema: {type: string}, description: "Exact match on asked_by"}
        - {name: text, in: query, required: false, schema: {type: string}, description: "Case-insensitive substring over question text, option labels and tradeoffs, and answer quotes"}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, default: 100, maximum: 1000}}
      responses:
        "200": {description: "count and questions, newest first"}
        "400": {description: "An unknown state or context (named in the error), or a limit that is not a positive integer (\"limit must be a positive integer\")", content: {"text/plain": {schema: {type: string}}}}
        "403": {description: "Federated peer lacks the autonomous read capability", content: {"text/plain": {schema: {type: string}}}}
        "405": {description: "Method not allowed", content: {"text/plain": {schema: {type: string}}}}
        "503": {description: "The autonomous.questions.enabled switch is off, or the question store is not wired", content: {"text/plain": {schema: {type: string}}}}

  /api/questions/{id}:
    get:
      summary: Read one operator question with answer metadata
      description: |
        The question record (state, priority, return_path, options and the
        asker's recommendation included on the record itself) plus a caller's
        full return path in the same read: `answer_count` (every answer ever
        recorded, superseded ones included — they are decided and never
        deleted), `current_answer_id` (the answer in force, empty when
        there is none) and `answer` — null while the question has no
        answer, otherwise the standing answer's summary (id, chosen
        option, the verbatim quote exactly as stored, actor, surface,
        created_at). An asker that cannot subscribe polls this one read
        for the whole return path. The full answer log, with text, is the
        answers read.
      operationId: questionGet
      tags: [Questions]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "question (state, priority, return_path included on the record), answer_count, current_answer_id, and the standing answer's summary, or null while it has no answer"}
        "404": {description: Unknown question id, content: {"text/plain": {schema: {type: string}}}}
        "405": {description: Method not allowed, content: {"text/plain": {schema: {type: string}}}}
        "503": {description: "The autonomous.questions.enabled switch is off, or the question store is not wired", content: {"text/plain": {schema: {type: string}}}}

  /api/questions/{id}/answer:
    post:
      summary: Record an answer to an operator question
      description: |
        Records the operator's decision: a chosen option, the operator's own
        words as `quote` (or both), and who answered. At least one of
        `chosen_option_id` and a non-blank `quote` is required. The quote is
        stored exactly as received — no trimming, normalising or re-encoding —
        with its SHA-256 recorded alongside. `surface` is the surface the
        answer arrived on: `pwa`, `android`, `ios`, `cli`, `rest`, `mcp` or
        `comm:<channel name>`; empty defaults to `rest`.

        An answer is immutable: a changed mind is a new answer that supersedes
        the old one via `supersedes` (which must name the current answer of an
        answered question; a supersedes on an open question is a 409 — there
        is no current answer to replace).

        An answer whose text looks like a secret is refused 422, is never
        stored, and the response never echoes any part of the submitted text
        — `error` is the fixed phrase `matched: secret pattern` (not the
        name of the specific rule that matched) and `suggestion` lists the
        two safe routes (the datawatch secrets store via ${secret:name},
        or the filesystem); the matched rule's name is recorded in the
        `question_answer_refused` audit entry, not in this body. Well-formed
        ${secret:name} references pass the scan.

        Body cap 64 KiB plus the 16 KiB quote cap. Needs the autonomous write
        capability when called by a federated peer.
      operationId: questionAnswer
      tags: [Questions]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QuestionAnswer"}
      responses:
        "201": {description: "The stored answer record (quote hash included) and the question's new state"}
        "400": {description: "Malformed body; an unknown surface; neither an option nor a non-blank quote; an option id the question does not have; a quote that is not valid UTF-8", content: {"application/json": {schema: {$ref: "#/components/schemas/QuestionError"}}}}
        "403": {description: "Federated peer lacks the autonomous write capability", content: {"text/plain": {schema: {type: string}}}}
        "404": {description: Unknown question id, content: {"application/json": {schema: {$ref: "#/components/schemas/QuestionError"}}}}
        "409": {description: "Answering a withdrawn or expired question; a supersedes on an open question (no current answer to replace); a supersedes that is absent or wrong on an answered question", content: {"application/json": {schema: {$ref: "#/components/schemas/QuestionError"}}}}
        "413": {description: "Body over the cap, or a quote over 16 KiB", content: {"application/json": {schema: {$ref: "#/components/schemas/QuestionError"}}}}
        "422": {description: "The answer looks like a secret — the fixed phrase and the safe routes, no echo of the submitted text; no rule name in the body", content: {"application/json": {schema: {$ref: "#/components/schemas/QuestionSecretRefusal"}}}}
        "500": {description: "The store could not append or replay the answer", content: {"application/json": {schema: {$ref: "#/components/schemas/QuestionError"}}}}
        "503": {description: "The autonomous.questions.enabled switch is off, or the question store is not wired", content: {"text/plain": {schema: {type: string}}}}

  /api/questions/{id}/withdraw:
    post:
      summary: Withdraw an open operator question
      description: |
        Withdrawing an open question closes it without an answer; a question
        that has already moved on (answered, or withdrawn before) is refused.
        `reason` is free text; `actor` defaults to the caller.
        Needs the autonomous write capability when called by a federated peer.
      operationId: questionWithdraw
      tags: [Questions]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QuestionWithdraw"}
      responses:
        "200": {description: "The question in its new state"}
        "400": {description: Malformed body, content: {"application/json": {schema: {$ref: "#/components/schemas/QuestionError"}}}}
        "403": {description: "Federated peer lacks the autonomous write capability", content: {"text/plain": {schema: {type: string}}}}
        "404": {description: Unknown question id, content: {"application/json": {schema: {$ref: "#/components/schemas/QuestionError"}}}}
        "409": {description: "The question is not open", content: {"application/json": {schema: {$ref: "#/components/schemas/QuestionError"}}}}
        "413": {description: "Body over the 64 KiB cap", content: {"application/json": {schema: {$ref: "#/components/schemas/QuestionError"}}}}
        "500": {description: "The store could not append or replay the withdrawal", content: {"application/json": {schema: {$ref: "#/components/schemas/QuestionError"}}}}
        "503": {description: "The autonomous.questions.enabled switch is off, or the question store is not wired", content: {"text/plain": {schema: {type: string}}}}

  /api/questions/{id}/answers:
    get:
      summary: Read an operator question's answer log
      description: |
        The full answer log, oldest first, each answer carrying its derived
        superseded state (`superseded`, `superseded_by`), plus
        `current_answer_id` (the answer in force, empty when there is none).
        The superseded flags are derived on read from the log; the answer
        lines themselves never change.
      operationId: questionAnswers
      tags: [Questions]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "answers (oldest first, each with derived superseded state) and current_answer_id"}
        "404": {description: Unknown question id, content: {"application/json": {schema: {$ref: "#/components/schemas/QuestionError"}}}}
        "405": {description: Method not allowed, content: {"text/plain": {schema: {type: string}}}}
        "503": {description: "The autonomous.questions.enabled switch is off, or the question store is not wired", content: {"text/plain": {schema: {type: string}}}}

  /api/questions/stats:
    get:
      summary: Worker question marker counters
      description: |
        Counters for the worker question marker since daemon start - `raised`
        (marker lines stored as new questions), `duplicate` (a repeat of a
        question still open), `refused` (lines that failed validation and
        stored nothing), `parked` (tasks parked on a blocking question) and
        `resumed` (parked tasks resumed after the decision) - plus
        `open_marker_questions` and `open_blocking_questions` now, and the
        two live switches `questions_enabled` and `worker_marker_enabled`.
        Answers 200 whether or not the channel is on, so a monitor can tell
        off from idle. Needs the autonomous read capability. The same object
        is the MCP `question_stats` tool; the counters are also in the stats
        snapshot (`worker_questions_*`) and the
        `datawatch_worker_questions_total{outcome}` metric.
      operationId: questionStats
      tags: [Questions]
      responses:
        "200":
          description: The counters and switches
          content:
            application/json:
              schema:
                type: object
                properties:
                  questions_enabled: {type: boolean}
                  worker_marker_enabled: {type: boolean}
                  open_marker_questions: {type: integer}
                  open_blocking_questions: {type: integer}
                  raised: {type: integer}
                  duplicate: {type: integer}
                  refused: {type: integer}
                  parked: {type: integer}
                  resumed: {type: integer}
        "403": {description: Missing the autonomous read capability, content: {"text/plain": {schema: {type: string}}}}
        "405": {description: Method not allowed, content: {"text/plain": {schema: {type: string}}}}

  /api/trace/session/{id}:
    get:
      summary: Trace of one session
      description: |
        The recorded trace events of one session (tool calls, results, model requests,
        state changes, capability and permission decisions, loop warnings, errors), in the
        order they happened, plus the session roll-up and its index entry (counts, first and
        last event, how much of the backend's activity the trace covers). Event text is
        redacted when it is stored. `tool`, `backend`, `kind` and `errors` narrow the events;
        `limit` keeps the last N. The roll-up always covers the whole session. A federated
        peer needs the analytics read capability.
      operationId: traceSession
      tags: [Trace]
      parameters:
        - {name: id, in: path, required: true, description: Session full id, schema: {type: string}}
        - {name: tool, in: query, required: false, description: Keep events with this tool name, schema: {type: string}}
        - {name: backend, in: query, required: false, description: Keep events from this backend, schema: {type: string}}
        - {name: kind, in: query, required: false, description: Keep one event kind, schema: {type: string, enum: [tool_call, tool_result, model_request, state_change, capability_check, permission_decision, loop_warning, error]}}
        - {name: errors, in: query, required: false, description: "true keeps only error events and failed outcomes", schema: {type: boolean}}
        - {name: limit, in: query, required: false, description: Keep the last N events (0 = all), schema: {type: integer, minimum: 0}}
        - {name: loop_threshold, in: query, required: false, description: "Repeat count that raises a loop warning in the roll-up (default 5)", schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: The session trace
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: {type: string}
                  total: {type: integer, description: Events matching the filters before `limit`}
                  events: {type: array, items: {$ref: "#/components/schemas/TraceEvent"}}
                  rollup: {$ref: "#/components/schemas/TraceRollup"}
                  index: {type: object, description: "Index entry: session, task, story, automaton, agent, backend, counts, total, errors, coverage, first_at, last_at", additionalProperties: true}
        "400": {description: Bad filter value, content: {"text/plain": {schema: {type: string}}}}
        "403": {description: Missing the analytics read capability, content: {"text/plain": {schema: {type: string}}}}
        "404": {description: No trace for that session, content: {"text/plain": {schema: {type: string}}}}
        "405": {description: Method not allowed, content: {"text/plain": {schema: {type: string}}}}
        "503": {description: Tracing is not available, content: {"text/plain": {schema: {type: string}}}}

  /api/trace/automaton/{id}:
    get:
      summary: Trace of one Automaton
      description: |
        The trace events of every session that ran for an Automaton, ordered by time, and the
        Automaton roll-up. Takes the same filters as the session trace.
      operationId: traceAutomaton
      tags: [Trace]
      parameters:
        - {name: id, in: path, required: true, description: Automaton id, schema: {type: string}}
        - {name: tool, in: query, required: false, schema: {type: string}}
        - {name: backend, in: query, required: false, schema: {type: string}}
        - {name: kind, in: query, required: false, schema: {type: string}}
        - {name: errors, in: query, required: false, schema: {type: boolean}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 0}}
        - {name: loop_threshold, in: query, required: false, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: The Automaton trace
          content:
            application/json:
              schema:
                type: object
                properties:
                  automaton: {type: string}
                  sessions: {type: array, items: {type: string}}
                  total: {type: integer}
                  events: {type: array, items: {$ref: "#/components/schemas/TraceEvent"}}
                  rollup: {$ref: "#/components/schemas/TraceRollup"}
        "400": {description: Bad filter value, content: {"text/plain": {schema: {type: string}}}}
        "403": {description: Missing the analytics read capability, content: {"text/plain": {schema: {type: string}}}}
        "404": {description: No trace for that Automaton, content: {"text/plain": {schema: {type: string}}}}
        "405": {description: Method not allowed, content: {"text/plain": {schema: {type: string}}}}
        "503": {description: Tracing is not available, content: {"text/plain": {schema: {type: string}}}}

  /api/trace/rollup:
    get:
      summary: Trace roll-ups
      description: |
        Roll-ups of the whole trace store along one dimension (`session`, `task`, `story`,
        `automaton`, `agent` or `backend`): tool counts, slowest tools, error rate, repeated-call
        loop warnings, capability denials, and model requests with tokens. `key` keeps one group.
      operationId: traceRollup
      tags: [Trace]
      parameters:
        - {name: dimension, in: query, required: false, description: "Grouping axis (default session)", schema: {type: string, enum: [session, task, story, automaton, agent, backend]}}
        - {name: key, in: query, required: false, description: Keep only this group, schema: {type: string}}
        - {name: loop_threshold, in: query, required: false, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: The roll-ups
          content:
            application/json:
              schema:
                type: object
                properties:
                  dimension: {type: string}
                  rollups: {type: array, items: {$ref: "#/components/schemas/TraceRollup"}}
        "400": {description: Unknown dimension or bad value, content: {"text/plain": {schema: {type: string}}}}
        "403": {description: Missing the analytics read capability, content: {"text/plain": {schema: {type: string}}}}
        "405": {description: Method not allowed, content: {"text/plain": {schema: {type: string}}}}
        "503": {description: Tracing is not available, content: {"text/plain": {schema: {type: string}}}}

  /api/trace/coverage:
    get:
      summary: Trace coverage list
      description: |
        How much of each traced session's backend activity the trace captures: `full`,
        `partial`, `events-only` or `unknown` (not recorded). Lists each session and counts
        the levels per backend, so a gap in a backend's trace is visible before relying on it.
      operationId: traceCoverage
      tags: [Trace]
      parameters:
        - {name: backend, in: query, required: false, description: Only this backend, schema: {type: string}}
      responses:
        "200":
          description: The coverage list
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        session: {type: string}
                        backend: {type: string}
                        automaton: {type: string}
                        coverage: {type: string, enum: [full, partial, events-only, unknown]}
                        events: {type: integer}
                  by_backend:
                    type: object
                    additionalProperties: {type: object, additionalProperties: {type: integer}}
        "403": {description: Missing the analytics read capability, content: {"text/plain": {schema: {type: string}}}}
        "405": {description: Method not allowed, content: {"text/plain": {schema: {type: string}}}}
        "503": {description: Tracing is not available, content: {"text/plain": {schema: {type: string}}}}

  /api/trace/stats:
    get:
      summary: Trace store stats
      description: |
        Totals held in the trace store (sessions, events, error events) and the write counters
        since the daemon started (events appended, failed writes, events pruned by retention),
        with the time of the newest event. The same numbers appear on the Monitor Tracing card
        and as `trace_*` fields of the system stats and `datawatch_trace_*` Prometheus series.
      operationId: traceStats
      tags: [Trace]
      responses:
        "200":
          description: The trace store stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions: {type: integer}
                  events: {type: integer}
                  error_events: {type: integer}
                  appended_total: {type: integer, format: int64}
                  append_errors_total: {type: integer, format: int64}
                  pruned_total: {type: integer, format: int64}
                  last_event_at: {type: string, format: date-time}
        "403": {description: Missing the analytics read capability, content: {"text/plain": {schema: {type: string}}}}
        "405": {description: Method not allowed, content: {"text/plain": {schema: {type: string}}}}
        "503": {description: Tracing is not available, content: {"text/plain": {schema: {type: string}}}}

components:
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
    QueryToken:
      type: apiKey
      in: query
      name: token
    NoAuth:
      type: http
      scheme: basic
      description: No authentication (when token is not configured)

  responses:
    Unauthorized:
      description: Authentication required
      content:
        text/plain:
          schema:
            type: string
            example: "unauthorized"

  schemas:
    TraceEvent:
      type: object
      properties:
        session_id: {type: string}
        task_id: {type: string}
        story_id: {type: string}
        automaton_id: {type: string}
        agent: {type: string}
        backend: {type: string}
        kind: {type: string}
        name: {type: string}
        arg_summary: {type: string}
        outcome: {type: string}
        duration_ms: {type: integer}
        tokens_in: {type: integer}
        tokens_out: {type: integer}
        timestamp: {type: string, format: date-time}
    TraceRollup:
      type: object
      properties:
        dimension: {type: string}
        key: {type: string}
        events: {type: integer}
        tool_counts: {type: object, additionalProperties: {type: integer}}
        slowest_tools:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              calls: {type: integer}
              errors: {type: integer}
              total_ms: {type: integer}
              max_ms: {type: integer}
              avg_ms: {type: integer}
        tool_calls: {type: integer}
        errors: {type: integer}
        error_rate: {type: number}
        loop_warnings:
          type: array
          items:
            type: object
            properties:
              tool: {type: string}
              arg_summary: {type: string}
              count: {type: integer}
        recorded_loop_warnings: {type: integer}
        capability_denials: {type: integer}
        model_requests: {type: integer}
        tokens_in: {type: integer}
        tokens_out: {type: integer}
    RulesContextProject:
      type: object
      required: [project_dir]
      properties:
        project_dir: {type: string, description: Project directory the override applies to}
        rules_file: {type: string, description: Rules file name relative to the project directory}
        context_files: {type: array, items: {type: string}, description: Context file names relative to the project directory}
        digest_mode: {type: string, enum: [off, no_tools, all]}
        digest_max_bytes: {type: integer, description: "0 uses the default; otherwise 512 to 65536"}
    RulesContextConfig:
      type: object
      properties:
        rules_file: {type: string, description: Rules file name relative to the project directory}
        context_files: {type: array, items: {type: string}, maxItems: 8, description: Context file names relative to the project directory}
        digest_mode: {type: string, enum: [off, no_tools, all]}
        digest_max_bytes: {type: integer, description: "0 uses the default; otherwise 512 to 65536"}
        projects:
          type: array
          items: {$ref: "#/components/schemas/RulesContextProject"}
    RulesContextPolicy:
      type: object
      properties:
        project_dir: {type: string}
        rules_file: {type: string}
        context_files: {type: array, items: {type: string}}
        digest_mode: {type: string}
        digest_max_bytes: {type: integer}
    RulesContextFileRef:
      type: object
      properties:
        name: {type: string}
        kind: {type: string, description: rules or context}
        present: {type: boolean}
        sha256: {type: string, description: Content hash; the content itself is never returned}
        bytes: {type: integer}
    RulesContextRecord:
      type: object
      properties:
        prd_id: {type: string}
        recorded: {type: boolean, description: False when no planning record has been captured yet}
        captured_at: {type: string, format: date-time}
        file_count: {type: integer}
        present_count: {type: integer}
        missing_count: {type: integer}
        files: {type: array, items: {$ref: "#/components/schemas/RulesContextFileRef"}}
        missing: {type: array, items: {type: string}}
        notes: {type: array, items: {type: string}}
        digest_mode: {type: string}
        digest_injected: {type: boolean}
        digest_bytes: {type: integer}
    RulesContextSettings:
      type: object
      properties:
        config: {$ref: "#/components/schemas/RulesContextConfig"}
        policy: {$ref: "#/components/schemas/RulesContextPolicy"}
        record: {$ref: "#/components/schemas/RulesContextRecord"}
    Identity:
      type: object
      description: The operator identity; every field is optional.
      properties:
        role: {type: string}
        north_star_goals: {type: array, items: {type: string}}
        current_projects: {type: array, items: {type: string}}
        values: {type: array, items: {type: string}}
        current_focus: {type: string}
        context_notes: {type: string}
        updated_at: {type: string, format: date-time}
    IdentityWipeRefused:
      type: object
      description: 409 body for a write that would replace a saved identity with an empty one.
      required: [error, code, fields_kept]
      properties:
        error: {type: string}
        code: {type: string, enum: [identity_wipe_refused]}
        fields_kept: {type: array, items: {type: string}}
    IdentityBackup:
      type: object
      required: [name, created_at, size_bytes, role, field_count]
      properties:
        name: {type: string}
        created_at: {type: string, format: date-time}
        size_bytes: {type: integer, format: int64}
        role: {type: string}
        field_count: {type: integer}
    IdentityBackupList:
      type: object
      required: [backups, keep]
      properties:
        backups: {type: array, items: {$ref: "#/components/schemas/IdentityBackup"}}
        keep: {type: integer}
    DecisionLine:
      type: object
      description: The operator decisions, as GET /api/autonomous/decisions returns them.
      required: [decisions]
      properties:
        decisions:
          type: array
          description: Newest first; empty when nothing matches
          items: {$ref: "#/components/schemas/DecisionLineEntry"}
    DecisionLineEntry:
      type: object
      description: One operator decision.
      properties:
        id: {type: string, description: "The decision id (q- followed by lowercase hex)"}
        question: {type: string, description: The question text}
        label: {type: string, description: "Short label such as decision or approval; may be empty"}
        state: {type: string, enum: [open, answered, withdrawn, expired]}
        asked_by: {type: string}
        asked_at: {type: string, format: date-time, nullable: true}
        prd_id: {type: string, description: "The Automaton the decision belongs to; empty when it is not linked to one"}
        task_ids:
          type: array
          description: Tasks of that Automaton whose spec names this decision; always an array
          items: {type: string}
        waiting_task_ids:
          type: array
          description: The tasks among task_ids that are held on the decision right now (status waiting_decision); always an array
          items: {type: string}
        waiting_tasks:
          type: array
          description: The same held tasks with the reason each one shows; always an array
          items: {$ref: "#/components/schemas/DecisionLineWait"}
        answer:
          allOf:
            - {$ref: "#/components/schemas/DecisionLineAnswer"}
          nullable: true
          description: The current answer; null until the decision is answered
        record_id: {type: string, description: "The decision record this decision was raised from (`dr-` followed by hex); an empty string when it has no record"}
    DecisionLineWait:
      type: object
      properties:
        task_id: {type: string}
        wait_reason: {type: string, description: "The plain sentence the held task shows, naming the decision and, while it is open, the first 160 characters of the question"}
    DecisionLineAnswer:
      type: object
      properties:
        id: {type: string, description: Answer id}
        quote: {type: string, description: "The operator's words exactly as stored; never trimmed, cut or re-cased"}
        quote_sha256: {type: string, description: The sha256 recorded with the quote}
        actor: {type: string}
        surface: {type: string, description: The surface the answer came from}
        answered_at: {type: string, format: date-time, nullable: true}
    AutomatonDecisionLogEntry:
      type: object
      description: |
        One entry of an Automaton's decision log (the `decisions` array on the
        Automaton). Entries for operator decisions add `question_id`, `answer_id`
        and `decision_state`; each is left out when empty. Show an unknown `kind`
        as plain text.
      properties:
        at: {type: string, format: date-time}
        kind:
          type: string
          description: |
            What the entry records. Among the kinds: `operator_decision` (a decision
            was raised for the Automaton), `operator_answer` (it was answered) and
            `decision_gate_shadow` (in shadow mode, a task the gate would have held;
            written once per task and reason).
        actor: {type: string, description: "operator, autonomous or verifier"}
        note: {type: string}
        question_id: {type: string, description: "The operator decision the entry records"}
        answer_id: {type: string, description: "The answer the entry records; answer entries only"}
        decision_state: {type: string, enum: [open, answered, withdrawn, expired], description: "The decision state the entry stands for"}
    QuestionContextRef:
      type: object
      description: |
        Where a question was raised, computed on every read from the stored
        context links. Never stored on the question record.
      properties:
        kind: {type: string, enum: [proposal, automaton, task, registry_row, none], description: "none when the question has no context or its link is missing"}
        title: {type: string, description: "A proposal's file name; an Automaton's or task's stored name when it can be resolved and its id otherwise; a registry row's key"}
        id: {type: string, description: "The Automaton id, task id or registry row key; empty for a proposal or no context"}
        doc_path: {type: string, description: "A proposal's repository-relative path; empty when the stored path is not repository-relative"}
        viewer_url: {type: string, description: "The in-app documents viewer link for a proposal that is a markdown file inside the served docs tree (for example /diagrams.html#docs/plans/plan.md); empty for any other path"}
    InfraRetryStatus:
      type: object
      description: The infrastructure retry policy in effect and the tasks retried or held, as GET /api/autonomous/infra-retries returns it.
      properties:
        enabled: {type: boolean}
        max_tries: {type: integer, description: "Tries a task gets before the exhausted action applies"}
        backoff_seconds:
          type: array
          items: {type: integer}
          description: "Delay in seconds before each retry; the last entry repeats"
        categories:
          type: array
          items: {type: string, enum: [spawn_error, storage_write, session_killed_before_delivery, daemon_restart]}
        exhausted_action: {type: string, enum: [hold, count]}
        retry_dependents: {type: boolean}
        raise_question: {type: boolean}
        tasks:
          type: array
          items: {$ref: "#/components/schemas/InfraRetryTask"}
        count: {type: integer, description: "Number of tasks listed"}
    InfraRetryTask:
      type: object
      description: A task with infrastructure retries, or held for an infrastructure reason.
      properties:
        automaton_id: {type: string}
        automaton_title: {type: string}
        task_id: {type: string}
        task_title: {type: string}
        status: {type: string, description: "The task's status, for example review_needed while it is held"}
        retry_count: {type: integer, description: "Consecutive retries in the current incident; 0 once the task got a fair attempt"}
        max_tries: {type: integer}
        retries:
          type: array
          items: {$ref: "#/components/schemas/InfraRetryEntry"}
        held: {type: boolean, description: "True while the task waits for the operator after its retries ran out"}
        held_cause: {type: string, description: "The failure class and cause; present only while held"}
        question_id: {type: string, description: "The open operator question for the hold; present only when one is open"}
    InfraRetryEntry:
      type: object
      description: One scheduled retry of a task.
      properties:
        number: {type: integer}
        class: {type: string, enum: [spawn_error, storage_write, session_killed_before_delivery, daemon_restart]}
        reason: {type: string}
        at: {type: string, format: date-time, description: "When the retry was decided"}
        delay_seconds: {type: integer}
        next_at: {type: string, format: date-time, description: "When the retry was due"}
    UsageReading:
      type: object
      description: One usage reading in the shared series.
      properties:
        id: {type: string}
        at: {type: string, format: date-time}
        percent: {type: number}
        spend_usd: {type: number}
        session_percent: {type: number}
        lanes: {type: integer, description: "The Claude lane count the keeper stamped on the reading; absent when lanes_source is unavailable"}
        lanes_source:
          type: string
          enum: [live, recorded, current, unavailable, typed]
          description: "Where the lane count came from: live (the ledger count at the clock), recorded (an earlier time the lane history covers), current (an earlier time the history does not cover, so the ledger count now), unavailable (no ledger wired; no count), typed (a reading stored before the stamp existed; kept as it was and never feeds the advice)"
        source: {type: string}
    LaneFillStatus:
      type: object
      description: The lane fill status, as GET /api/autonomous/lane-fill returns it.
      properties:
        mode: {type: string, enum: [off, shadow, on], description: "shadow records decisions and starts nothing"}
        modes:
          type: object
          description: The mode in effect for each lane kind; a kind with no mode of its own takes the base `mode`
          properties:
            gpu: {type: string, enum: [off, shadow, on]}
            claude: {type: string, enum: [off, shadow, on]}
        lane_counts:
          $ref: "#/components/schemas/LaneFillLaneCounts"
        last_poll_at: {type: string, format: date-time}
        lanes:
          type: array
          items: {$ref: "#/components/schemas/LaneFillLane"}
        queued_eligible:
          type: object
          description: Queued Automata that could start on each lane type
          properties:
            gpu: {type: integer}
            claude: {type: integer}
        evidence:
          type: object
          properties:
            checked_at: {type: string, format: date-time}
            gpu_active_sessions: {type: integer}
            loaded_models:
              type: array
              items:
                type: object
                properties:
                  host: {type: string}
                  model: {type: string}
            error: {type: string, description: "Why the last poll could not read the pool; empty when it could"}
            degraded:
              type: array
              description: Pool hosts that could not be read but hold no work and have been unreachable past autonomous.lane_fill.host_down_after_minutes; they do not block the lanes. Empty when nothing is degraded.
              items:
                type: object
                properties:
                  host: {type: string}
                  error: {type: string}
                  since: {type: string, format: date-time, description: When the host first failed}
        decisions:
          type: array
          description: Planner decisions, newest first
          items: {$ref: "#/components/schemas/LaneFillDecision"}
        alerts:
          type: array
          items: {$ref: "#/components/schemas/LaneFillAlert"}
    LaneFillLaneCounts:
      type: object
      description: The lane counts of the last poll, per lane kind
      properties:
        gpu: {$ref: "#/components/schemas/LaneFillLaneCount"}
        claude: {$ref: "#/components/schemas/LaneFillLaneCount"}
    LaneFillLaneCount:
      type: object
      description: The lane count of one lane kind
      properties:
        configured: {type: integer, description: "The count set by autonomous.lane_fill.gpu_lanes or claude_lanes"}
        effective: {type: integer, description: "The count the last poll used"}
        source:
          type: string
          enum: [config, llm_caps]
          description: "Where the effective count came from: config (the configured count) or llm_caps (the sum of the in-flight caps of the enabled LLM entries for the lane kind's backend)"
        reason: {type: string, description: "Why the configured count was used, present when source is config and the caps could not apply"}
    LaneFillLane:
      type: object
      properties:
        id: {type: string}
        type: {type: string, enum: [gpu, claude]}
        state: {type: string, enum: [occupied, idle, waiting_verifier], description: "waiting_verifier: a Claude lane whose Automaton waits on a verifier slot and the verifier-wait rule counts available"}
        occupant:
          nullable: true
          description: The Automaton the lane is running; null when the lane is idle
          type: object
          properties:
            prd_id: {type: string}
            title: {type: string}
            backend: {type: string}
            waiting_on_verifier: {type: boolean, description: "True when its work is all blocked waiting for a verifier slot"}
            wait_reason: {type: string, description: "The occupant's readable wait reason, present with waiting_on_verifier"}
        blocker: {type: string, description: Why an idle lane is not being filled}
        waiting_on_verifier: {type: boolean, description: "True when the lane's occupant is blocked waiting for a verifier slot"}
        wait_reason: {type: string, description: "The occupant's readable wait reason, present with waiting_on_verifier"}
        eligible_waiting: {type: integer, description: Queued Automata this lane could take}
    LaneFillDecision:
      type: object
      properties:
        at: {type: string, format: date-time}
        mode: {type: string, enum: [off, shadow, on]}
        lane_id: {type: string}
        lane_type: {type: string, enum: [gpu, claude]}
        action:
          type: string
          enum: [start_prd, report_merge, decompose, decompose_ahead, blocked, idle]
        prd_id: {type: string}
        title: {type: string}
        reason: {type: string}
        blocker: {type: string}
        eligibility_reason:
          type: string
          enum: [stale, held, sequenced_after_unshipped, proposal_not_confirmed, proposal_missing, main_carries_work, worktree_invalid]
          description: "absent when the decision is not a refusal. The stable code for why the Automaton was refused: stale (the Automaton has had no update for longer than the stale limit), held (a HOLD line, the words do not run or sequenced last, or a judge that timed out while review is needed), sequenced_after_unshipped (it is sequenced after an Automaton that has not completed, or one that cannot be found), proposal_not_confirmed (its proposal file carries no Confirmed: yes line), proposal_missing (it names no proposal file, or none can be read), main_carries_work (the base branch already carries its work) or worktree_invalid (its recorded worktree is gone, has no .git entry or is not a registered worktree of its repository)"
        wait_reason: {type: string, description: "The waiting occupant's reason, present when the decision rests on a lane the verifier-wait rule counted available"}
        executed: {type: boolean, description: "False in shadow mode, where the decision is recorded and nothing starts"}
        error: {type: string}
        repeat_count: {type: integer, description: How many polls chose the same action again}
        last_seen_at: {type: string, format: date-time}
    LaneFillAlert:
      type: object
      description: An idle lane that sat with eligible work queued past the idle alert threshold
      properties:
        at: {type: string, format: date-time}
        lane_id: {type: string}
        work: {type: string, description: Title of the work waiting for the lane}
    MergePipelineStep:
      type: object
      description: One step of a merge pipeline. Exactly one of `command` and `action` is set.
      required: [name, kind]
      properties:
        name: {type: string, description: "A name that is unique within the pipeline"}
        kind: {type: string, enum: [test, lint, version_bump, changelog, ship, tag, deploy, post_ship_hook, custom], description: "What the step is for"}
        command: {type: string, description: "A shell command line to run in the project"}
        action: {type: string, enum: [rebase_onto_main, check_branch_versions, merge_branches, set_release_version, insert_changelog_heading, set_readme_release_line, commit_release_bump, tag_release, validate_release_bump, push_release, deploy_latest], description: "A built-in action to run instead of a command"}
        dir: {type: string, description: "A directory inside the project to run in; empty means the project root"}
        on_failure: {type: string, enum: [stop, continue], description: "What the pipeline does when the step fails; stop by default"}
        requires_make_target: {type: string, description: "Run the step only when the project's Makefile defines this target"}
        timeout: {type: integer, description: "The step's time limit in nanoseconds; 0 uses the runner's default"}
    MergePipelineDefinition:
      type: object
      description: An ordered list of merge pipeline steps.
      required: [steps]
      properties:
        steps:
          type: array
          items: {$ref: "#/components/schemas/MergePipelineStep"}
    MergePipelineOverride:
      type: object
      description: The merge pipeline values set for one project. A key that is left out inherits the global value.
      properties:
        file_name: {type: string, description: "The pipeline file, relative to the project"}
        source_order:
          type: array
          items: {type: string, enum: [file, record]}
          description: "The sources tried first to last"
        fallback_on_bad_file: {type: string, enum: [record, default, none], description: "What to use when the project's file exists but cannot be used"}
        conflict_policy: {type: string, enum: [stop_and_ask, mechanical, mechanical_and_model], description: "How a merge conflict is handled"}
        conflict_model: {type: string, description: "The LLM registry entry that proposes a conflict resolution; an empty string means no model"}
        version_files:
          type: array
          items: {type: string}
          description: "The project files, relative to the project, that carry the version line the release version step sets"
        release_approval:
          type: object
          description: "The release approval mode per release size for this project. A size that is left out inherits the global mode; the defaults are auto for patch and minor and ask for major."
          properties:
            patch: {type: string, enum: [auto, ask, manual], description: "Patch release mode: auto ships when the checks pass and reports afterwards; ask prepares everything and raises one decision; manual prepares and reports, and a person ships"}
            minor: {type: string, enum: [auto, ask, manual], description: "Minor release mode: auto ships when the checks pass and reports afterwards; ask prepares everything and raises one decision; manual prepares and reports, and a person ships"}
            major: {type: string, enum: [auto, ask, manual], description: "Major release mode: auto ships when the checks pass and reports afterwards; ask prepares everything and raises one decision; manual prepares and reports, and a person ships"}
    MergePipelineSettings:
      type: object
      description: The pipeline resolution settings in effect for a project.
      properties:
        file_name: {type: string}
        source_order:
          type: array
          items: {type: string, enum: [file, record]}
        fallback_on_bad_file: {type: string, enum: [record, default, none]}
        version_files:
          type: array
          items: {type: string}
    ReleaseReadinessBar:
      type: object
      description: The minimum counts a release of one size must reach before it is considered ready
      properties:
        records: {type: integer, description: Minimum number of plan-equal-or-better comparison records}
        conflicts: {type: integer, description: Minimum counted records that show conflicts}
        pwa_changes: {type: integer, description: Minimum counted records that show PWA changes}
    ReleaseReadiness:
      type: object
      description: The computed readiness of one release size
      properties:
        size: {type: string, description: The release size that was evaluated}
        records: {type: integer, description: Records where the plan was equal or better}
        conflicts: {type: integer, description: Counted records that show conflicts}
        pwa_changes: {type: integer, description: Counted records that show PWA changes}
        blocking_defects: {type: integer, description: Records with a blocking defect}
        required: {$ref: "#/components/schemas/ReleaseReadinessBar"}
        missing:
          type: array
          description: One operator-facing sentence per unmet condition; empty when ready
          items: {type: string}
        ready: {type: boolean, description: True only when missing is empty}
    MergePipelineView:
      type: object
      description: The merge pipeline in effect for a project, as GET /api/autonomous/merge-pipeline returns it.
      properties:
        project: {type: string}
        definition:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MergePipelineDefinition"
          description: "The steps in effect; null when none could be chosen"
        source: {type: string, enum: [file, record, default], description: "Where the pipeline came from"}
        reason: {type: string, description: "Why that source was chosen, in plain words"}
        file_error: {type: string, description: "The problem found with the project's file, if any"}
        settings: {$ref: "#/components/schemas/MergePipelineSettings"}
        conflict_policy: {type: string, enum: [stop_and_ask, mechanical, mechanical_and_model], description: "The conflict policy configured"}
        conflict_policy_in_effect: {type: string, enum: [stop_and_ask, mechanical, mechanical_and_model], description: "The conflict policy that is acted on"}
        conflict_model: {type: string, description: "The conflict model configured"}
        conflict_model_in_effect: {type: string, description: "The conflict model that would be used; empty when none"}
        conflict_degraded_reason: {type: string, description: "Why the policy in effect differs from the one configured"}
        release_approval_in_effect:
          type: object
          description: "The release approval mode acted on for each release size. auto ships when the checks pass and reports afterwards; ask prepares everything and raises one decision; manual prepares and reports, and a person ships. Defaults: auto for patch and minor, ask for major."
          properties:
            patch: {type: string, enum: [auto, ask, manual], description: "The patch release mode in effect"}
            minor: {type: string, enum: [auto, ask, manual], description: "The minor release mode in effect"}
            major: {type: string, enum: [auto, ask, manual], description: "The major release mode in effect"}
        post_ship:
          type: object
          description: "The global post-ship hook settings: whether the block is on, how many hooks are defined, and the names of the ones that would run"
          properties:
            enabled: {type: boolean, description: "False when the block is off; no hook runs while it is false"}
            hook_count: {type: integer, description: "How many hooks are defined"}
            enabled_hooks:
              type: array
              description: "The names of the hooks that would run"
              items: {type: string}
        overrides:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MergePipelineOverride"
          description: "The per-project values set for this project; null when there are none"
        record_updated_at: {type: string, format: date-time, description: "When the daemon's record was last set; present when the record is the source"}
    MergePipelineRecordRequest:
      type: object
      description: A pipeline to keep for a project. Give `definition` or `yaml`, not both.
      properties:
        project: {type: string, description: "The project name, when not given as a query value"}
        definition: {$ref: "#/components/schemas/MergePipelineDefinition"}
        yaml: {type: string, description: "The text of a pipeline file"}
    MergePipelineRecord:
      type: object
      description: The pipeline the daemon keeps for a project.
      properties:
        project: {type: string}
        definition: {$ref: "#/components/schemas/MergePipelineDefinition"}
        updated_at: {type: string, format: date-time}
    MergePipelineValidateRequest:
      type: object
      description: A pipeline to check, or a project file to check. Give a pipeline or `file`, not both.
      properties:
        project: {type: string, description: "The project name, for a file check"}
        definition: {$ref: "#/components/schemas/MergePipelineDefinition"}
        yaml: {type: string, description: "The text of a pipeline file"}
        file:
          description: "true checks the file name in effect for the project; a text value names another file inside the project"
          oneOf:
            - {type: boolean}
            - {type: string}
    MergePipelineValidation:
      type: object
      description: The result of a pipeline check.
      properties:
        valid: {type: boolean}
        errors:
          type: array
          items: {type: string}
          description: "Every problem found; empty when valid"
        definition:
          allOf:
            - $ref: "#/components/schemas/MergePipelineDefinition"
          description: "The pipeline that was read; present when valid"
        source: {type: string, enum: [body, file], description: "What was checked"}
        file: {type: string, description: "The file that was checked, for a file check"}
    MergeStatus:
      type: object
      description: |-
        The merge status, as GET /api/autonomous/merge returns it. Both lists are
        empty while `mode` is off; `shadow_decisions` is empty outside shadow mode.
      required: [mode, alert_minutes, automata, shadow_decisions]
      properties:
        mode: {type: string, enum: [off, shadow, "on"], description: The merge_pending_mode in effect}
        alert_minutes: {type: integer, description: The merge-pending alert threshold in minutes; 0 = off}
        automata:
          type: array
          description: One entry per completed Automaton with a work branch
          items: {$ref: "#/components/schemas/MergeAutomaton"}
        shadow_decisions:
          type: array
          description: What the pass recorded in shadow mode, newest first
          items: {$ref: "#/components/schemas/MergeShadowDecision"}
    MergeAutomaton:
      type: object
      description: A completed Automaton with a work branch, as the merge-pending pass last compared it
      required: [automaton_id, name, branch, state, commits_ahead, pending_since, alerted_at]
      properties:
        automaton_id: {type: string}
        name: {type: string, description: The Automaton's title, or its id when it has none}
        branch: {type: string, description: The Automaton's work branch}
        state:
          type: string
          enum: [merged, pending, needs_look, empty, unknown]
          description: The cached merge comparison state; unknown until the pass has compared the branch
        commits_ahead: {type: integer, description: Commits on the branch that are not on main}
        pending_since:
          type: string
          format: date-time
          nullable: true
          description: When the Automaton was first seen merge pending; null when it is not pending
        alerted_at:
          type: string
          format: date-time
          nullable: true
          description: When the merge-pending alert fired; null until it does
        would_alert: {type: boolean, description: "Shadow mode only: whether the pass would have alerted"}
    MergeShadowDecision:
      type: object
      description: One decision the merge-pending pass recorded in shadow mode
      properties:
        at: {type: string, format: date-time}
        automaton_id: {type: string}
        name: {type: string}
        branch: {type: string}
        state: {type: string, enum: [merged, pending, needs_look, empty, unknown]}
        commits_ahead: {type: integer}
        would_alert: {type: boolean}
        repeat_count: {type: integer, description: How many polls chose the same decision again}
        last_seen_at: {type: string, format: date-time}
    SafeDeleteReport:
      type: object
      description: The safe-to-delete report, as GET /api/autonomous/safe-to-delete returns it
      required: [safe, held, held_dirty]
      properties:
        safe:
          type: array
          items:
            type: object
            required: [branch, worktree, reason, commits]
            properties:
              branch: {type: string}
              worktree: {type: string, description: The checked-out worktree path; empty when none exists}
              reason: {type: string}
              commits: {type: integer, description: Commits on the branch that are not on main}
              dirty_check_skipped: {type: boolean, description: True when the dirty check was skipped because the Automaton is still running}
        held:
          type: array
          items:
            type: object
            required: [branch, worktree, state]
            properties:
              branch: {type: string}
              worktree: {type: string}
              state: {type: string, description: The merge comparison state}
              dirty: {type: boolean, description: True when the worktree has uncommitted changes}
              note: {type: string}
        held_dirty: {type: integer, description: Branches that are safe by state but held for uncommitted changes}
        computed_at: {type: string, format: date-time, description: When the report was computed (always present; UTC, RFC 3339)}
        stale: {type: boolean, description: True when the report is a stale read older than the cache lifetime; that stale read is being refreshed in the background}
    TriageList:
      type: object
      description: |-
        The triage record list, as GET /api/autonomous/triage returns it. `records`
        is newest first; `alert_minutes` is the triage alert threshold currently in
        force (the autonomous.automation.triage_alert_minutes setting; 0 = off).
      required: [records, alert_minutes]
      properties:
        records:
          type: array
          description: Triage records, newest first; empty when nothing matches
          items: {$ref: "#/components/schemas/TriageRecord"}
        alert_minutes: {type: integer, description: The triage alert threshold in force in minutes; 0 = off}
    TriageRecord:
      type: object
      description: |-
        One triage record for an Automaton that ended failed or blocked, filled and
        refreshed by the triage pass on every coordinator tick and cleared again when
        the Automaton leaves that state.
      required: [prd_id, status]
      properties:
        prd_id: {type: string, description: The Automaton}
        prd_title: {type: string}
        automation_id: {type: string, description: The Automation it is a member of; empty for standalone Automata}
        automation_name: {type: string}
        member_id: {type: string, description: The Automation member slot the Automaton holds}
        status:
          type: string
          enum: [failed, blocked]
          description: The state the record covers; cleared when the Automaton leaves it
        task_id: {type: string, description: The task that failed; empty for blocked Automata without one}
        task_title: {type: string}
        blocked_reason:
          type: string
          description: The blocked reason recorded on the Automaton; empty for failed ones without one
        error:
          type: string
          description: The failed task's error, truncated to 2000 chars by the pass
        session_end_reason:
          type: string
          description: The worker session's end reason, truncated to 2000 chars by the pass
        first_seen_at:
          type: string
          format: date-time
          description: When the Automaton first ended in this failed or blocked state (its own status timestamp)
        updated_at:
          type: string
          format: date-time
          description: When the triage pass last refreshed the record
        alerted_at:
          nullable: true
          description: When the triage alert for this episode fired; null until it does
          type: string
          format: date-time
        retry_budget:
          type: object
          description: |-
            The engine's existing retry budget, reused as-is and shown for all four
            categories. Informational: the pass neither spends nor resets any of it.
          properties:
            infra: {$ref: "#/components/schemas/TriageRetryCategory"}
            content: {$ref: "#/components/schemas/TriageRetryCategory"}
            scope: {$ref: "#/components/schemas/TriageRetryCategory"}
            policy: {$ref: "#/components/schemas/TriageRetryCategory"}
            ceiling_total: {type: integer, description: The overall retry ceiling, if one is set}
            ceiling_left: {type: integer, description: What remains of the overall ceiling}
        notes:
          type: array
          description: Appended over the life of the record, oldest first
          items: {$ref: "#/components/schemas/TriageNote"}
    TriageRetryCategory:
      type: object
      description: One retry-budget category
      required: [limit, used, left]
      properties:
        limit: {type: integer, description: The maximum}
        used: {type: integer, description: What has been consumed}
        left: {type: integer, description: What remains}
    TriageNote:
      type: object
      description: One appended note on a triage record
      required: [at, source, text]
      properties:
        at: {type: string, format: date-time}
        source: {type: string, description: Who appended the note, e.g. triage}
        text: {type: string}
    RepoCIWatchList:
      type: object
      description: >-
        The repo CI watch state, as GET /api/autonomous/repo-ci-watch returns it.
        `records` is newest first; `alert_minutes` is the alert threshold currently
        in force in whole minutes (0 while the watch is off); `last_poll_at` is the
        coordinator's last poll instant (the zero time when it never has).
      required: [mode, alert_minutes, repos, last_poll_at, records]
      properties:
        mode:
          type: string
          enum: [off, shadow, on]
          description: The watch mode in effect; an unset mode reads off
        alert_minutes: {type: integer, description: The alert threshold in minutes in effect; 0 = off or the watch itself is off}
        repos:
          type: array
          description: The configured repository paths; empty when nothing is watched
          items: {type: string}
        last_poll_at:
          type: string
          format: date-time
          description: When the coordinator last ran a poll pass; the zero time when it never has
        records:
          type: array
          description: Watch records, newest first; empty when nothing matches
          items: {$ref: "#/components/schemas/RepoCIWatchRecord"}
    CleanupStatus:
      type: object
      description: The automation cleanup status, as GET /api/autonomous/cleanup returns it
      required: [worktrees, temp, disk_alert_percent, disk_alert]
      properties:
        worktrees: {$ref: "#/components/schemas/CleanupPassStatus"}
        temp: {$ref: "#/components/schemas/CleanupPassStatus"}
        worktree_disk:
          allOf: [{$ref: "#/components/schemas/CleanupDiskCheck"}]
          description: The disk reading behind the worktrees pass; absent until that pass runs
        temp_disk:
          allOf: [{$ref: "#/components/schemas/CleanupDiskCheck"}]
          description: The disk reading behind the daemon temp-file sweep; absent until it runs
        disk_alert_percent: {type: integer, description: "The disk-usage threshold in force (autonomous.automation.disk_alert_percent)"}
        disk_alert: {type: boolean, description: "True while the rate-limited disk alert is due"}
        last_disk_alert_at: {type: string, nullable: true, format: date-time, description: When the rate-limited alert last fired; null until it does}
    UncommittedWorkStatus:
      type: object
      description: |-
        The uncommitted-work status, as GET /api/autonomous/uncommitted-work
        returns it. `held` is an empty list, never null, when nothing is held.
      required: [policy, scope, held]
      properties:
        policy: {type: string, enum: [hold, warn, off], description: "The uncommitted-work policy in effect (autonomous.automation.uncommitted_work_policy; default hold)"}
        scope: {type: string, enum: [task_files, worktree], description: "Which files the per-task check covers (autonomous.automation.uncommitted_work_scope; default task_files)"}
        held:
          type: array
          items: {$ref: "#/components/schemas/UncommittedWorkEntry"}
    UncommittedWorkEntry:
      type: object
      description: One task or Automaton held on files git still sees as uncommitted in the Automaton worktree.
      required: [automaton_id, name, kind, files, outside_scope, held_at]
      properties:
        automaton_id: {type: string, description: The held Automaton}
        name: {type: string, description: The Automaton title (its id when it has none)}
        task_id: {type: string, description: The held task; absent for a worktree hold}
        task_title: {type: string, description: The held task title; absent for a worktree hold}
        kind: {type: string, enum: [task, worktree], description: "task for a hold on one task; worktree for files no single task owns"}
        files: {type: array, items: {type: string}, description: The held paths}
        outside_scope: {type: array, items: {type: string}, description: The held paths the task did not declare}
        reason: {type: string, description: Why the hold was raised}
        question_id: {type: string, description: The operator question that waits for an answer (commit, discard or retry); absent when no question store was wired}
        held_at: {type: string, format: date-time, description: When the hold was raised}
    RequestWatchStatus:
      type: object
      description: |-
        The request watch status, as GET /api/autonomous/request-watch returns
        it. `observations` is an empty list, never null.
      required: [enabled, poll_seconds, no_progress_minutes, observations]
      properties:
        enabled: {type: boolean, description: "Whether the watch is on (autonomous.request_watch.enabled; default true)"}
        poll_seconds: {type: integer, minimum: 1, description: "Seconds between node reads (autonomous.request_watch.poll_seconds; default 30)"}
        no_progress_minutes: {type: integer, minimum: 1, description: "Minutes without progress before an observation is over the threshold (autonomous.request_watch.no_progress_minutes; default 30)"}
        observations:
          type: array
          items: {$ref: "#/components/schemas/RequestWatchObservation"}
    RequestWatchObservation:
      type: object
      description: The watch's report for one worker or verifier session waiting on a model request.
      required: [session_id, automaton_id, task_id, role, node, model, state, no_progress_seconds, over_threshold, summary]
      properties:
        session_id: {type: string, description: The watched session}
        automaton_id: {type: string, description: The Automaton the session belongs to}
        task_id: {type: string, description: The task the session works on}
        role: {type: string, enum: [worker, verifier], description: Whether the session is a worker or a verifier}
        node: {type: string, description: The registered compute node the model runs on}
        model: {type: string, description: The model the request is waiting on}
        state: {type: string, enum: [generating, idle, unreachable, unknown], description: "generating when the node showed a sign of progress at the last poll; idle when it was readable and showed none; unreachable when it could not be read; unknown before the first sample"}
        last_change: {type: string, format: date-time, description: "When the node last showed a sign of progress (RFC 3339); absent before the first sample"}
        no_progress_seconds: {type: integer, format: int64, description: Seconds since the last sign of progress}
        last_poll: {type: string, format: date-time, description: "When the node was last read (RFC 3339); absent before the first sample"}
        over_threshold: {type: boolean, description: True once no_progress_seconds has reached no_progress_minutes}
        error: {type: string, description: Why the node could not be read; absent when it could}
        summary: {type: string, description: "Plain-text line such as: waiting on a model request: no progress for 40 minutes"}
    ProtectedPathsStatus:
      type: object
      description: |-
        The protected-paths status, as GET /api/autonomous/protected-paths
        returns it. `paths`, `held` and `authorized` are empty lists, never null.
      required: [action, rules_source, paths, held, authorized]
      properties:
        action: {type: string, enum: [hold, warn, block, off], description: "The protected-paths action in effect (autonomous.automation.protected_paths_action; default hold)"}
        rules_source: {type: string, enum: [base_commit, worktree], description: "Where the rules review reads the project rules (autonomous.automation.rules_review_source; default base_commit)"}
        paths: {type: array, items: {type: string}, description: "The effective protected list (autonomous.automation.protected_paths; the default list when none is set)"}
        held:
          type: array
          items: {$ref: "#/components/schemas/ProtectedPathsHeldEntry"}
        authorized:
          type: array
          items: {$ref: "#/components/schemas/ProtectedPathsAuthorizedEntry"}
    ProtectedPathsHeldEntry:
      type: object
      description: One task held because its commit changed protected paths.
      required: [automaton_id, automaton_title, task_id, task_title, paths, action, since, awaiting_spec_change]
      properties:
        automaton_id: {type: string, description: The Automaton of the held task}
        automaton_title: {type: string, description: The Automaton title (its id when it has none)}
        task_id: {type: string, description: The held task}
        task_title: {type: string, description: The held task title}
        paths: {type: array, items: {type: string}, description: The changed protected paths, sorted}
        action: {type: string, description: The protected-paths action in force when the hold was raised}
        reason: {type: string, description: Why the hold was raised}
        question_id: {type: string, description: The operator question that waits for an answer (approve, reject or change the spec); absent when no question store was wired}
        since: {type: string, format: date-time, description: When the hold was raised}
        base_commit: {type: string, description: The commit the task started from, the state a rejection puts the paths back to}
        awaiting_spec_change: {type: boolean, description: True once the operator chose to change the task instructions and the task waits for that edit}
    ProtectedPathsAuthorizedEntry:
      type: object
      description: One Automaton that authorises protected paths in advance.
      required: [automaton_id, automaton_title, paths]
      properties:
        automaton_id: {type: string, description: The Automaton}
        automaton_title: {type: string, description: The Automaton title (its id when it has none)}
        paths: {type: array, items: {type: string}, description: The authorised protected paths, sorted}
    ProtectedPathHold:
      type: object
      description: The hold on a task whose commit changed protected paths, as a task carries it in `protected_path_hold`.
      required: [paths, action, since]
      properties:
        paths: {type: array, items: {type: string}, description: The changed protected paths}
        action: {type: string, description: The protected-paths action in force when the hold was raised}
        reason: {type: string, description: Why the hold was raised}
        question_id: {type: string, description: The operator question that waits for an answer}
        base_commit: {type: string, description: The commit the task started from}
        since: {type: string, format: date-time, description: When the hold was raised}
        awaiting_spec_change: {type: boolean, description: True once the operator chose to change the task instructions}
    PendingItem:
      type: object
      description: |-
        A named piece of work that has no Automaton yet, as POST
        /api/autonomous/pending-items returns it.
      required: [id, title, state, source, automations]
      properties:
        id: {type: string, description: "Eight hex characters, generated by the daemon"}
        ref: {type: string, description: "Optional outside label; free text. Empty when none"}
        title: {type: string, description: The name of the work}
        state: {type: string, enum: [waiting, attached, done], description: "waiting: no Automaton yet; attached: an Automaton is attached; done: the work is finished (final)"}
        source: {type: string, enum: [internal, file], description: "internal: recorded through the daemon; file: copied in from the file registry"}
        automaton_id: {type: string, description: "The attached Automaton; empty until an attach"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        attached_at: {type: string, format: date-time, description: "When an Automaton was attached; absent before"}
        done_at: {type: string, format: date-time, description: "When the item became done; absent before"}
        automations:
          type: array
          items: {$ref: "#/components/schemas/PendingItemAutomationRef"}
          description: The Automations that carry the item as a member; an empty list, never null
    PendingItemAutomationRef:
      type: object
      description: One Automation that carries a pending item as a member.
      required: [automation_id, name, member_id, held]
      properties:
        automation_id: {type: string}
        name: {type: string, description: The Automation name}
        member_id: {type: string, description: The member that carries the item}
        held: {type: boolean, description: "True when the Automation is blocked and this member holds its cursor"}
    PendingItemHeld:
      type: object
      description: One Automation waiting on a waiting pending item right now.
      required: [automation_id, name, member_id, item_id, since, reason]
      properties:
        automation_id: {type: string}
        name: {type: string, description: The Automation name}
        member_id: {type: string, description: The member that holds the cursor}
        item_id: {type: string, description: The waiting pending item}
        title: {type: string, description: The item title}
        ref: {type: string, description: The item ref; empty when none}
        since: {type: string, format: date-time, description: When the Automation began waiting}
        reason: {type: string, description: Why the Automation is blocked}
    PendingItemSource:
      type: object
      description: The file registry settings in effect. Every unset key reads its default.
      required: [configured, path, id_pattern, id_column, title_column, state_column, done_values, on_missing_row]
      properties:
        configured: {type: boolean, description: "False while no registry path is set"}
        path: {type: string, description: "autonomous.automation.pending_item_source.path; empty means no file registry"}
        id_pattern: {type: string, description: "autonomous.automation.pending_item_source.id_pattern; default ^\\S+$"}
        id_column: {type: string, description: "autonomous.automation.pending_item_source.id_column: a header name or a 1-based column number; default 1"}
        title_column: {type: string, description: "autonomous.automation.pending_item_source.title_column: a header name or a 1-based column number; default 2"}
        state_column: {type: string, description: "autonomous.automation.pending_item_source.state_column: a header name or a 1-based column number; empty means the table has none"}
        done_values: {type: array, items: {type: string}, description: "autonomous.automation.pending_item_source.done_values; default done, closed, shipped"}
        on_missing_row: {type: string, enum: [keep, drop], description: "autonomous.automation.pending_item_source.on_missing_row; default keep"}
    PendingItemLastRefresh:
      type: object
      description: The last read of the file registry. Without a read yet, only `configured` is set.
      required: [configured, rows, added, updated, done, dropped, kept, skipped, error]
      properties:
        configured: {type: boolean}
        at: {type: string, format: date-time, nullable: true, description: When the registry was last read; null before the first read}
        rows: {type: integer, description: Rows read from the file}
        added: {type: integer, description: New waiting items created}
        updated: {type: integer, description: Items whose title changed}
        done: {type: integer, description: Items moved to done}
        dropped: {type: integer, description: Waiting file items removed (on_missing_row drop)}
        kept: {type: integer, description: Items whose row vanished and that were left in the registry}
        skipped: {type: integer, description: "Rows not used: the id does not match the pattern, no title, or a duplicate id"}
        error: {type: string, description: "Why the file could not be read; empty on success"}
    PendingItemsReply:
      type: object
      description: |-
        The pending item registry, as GET /api/autonomous/pending-items returns it.
        `items` and `held` are empty lists, never null.
      required: [policy, auto_resume, source, last_refresh, items, held]
      properties:
        policy: {type: string, enum: [hold, skip], description: "What an Automation does at a waiting item (autonomous.automation.pending_item_policy; default hold)"}
        auto_resume: {type: boolean, description: "Whether an attach resumes a blocked Automation (autonomous.automation.pending_item_auto_resume; default true)"}
        source: {$ref: "#/components/schemas/PendingItemSource"}
        last_refresh: {$ref: "#/components/schemas/PendingItemLastRefresh"}
        items:
          type: array
          items: {$ref: "#/components/schemas/PendingItem"}
        held:
          type: array
          items: {$ref: "#/components/schemas/PendingItemHeld"}
    PendingItemAttachConversion:
      type: object
      description: What an attach converted in one Automation.
      required: [automation_id]
      properties:
        automation_id: {type: string}
        member_ids: {type: array, items: {type: string}, description: Pending item members that are now Automaton members}
        pending_insert_ids: {type: array, items: {type: string}, description: Held inserts that now carry the Automaton}
    PendingItemAttachResult:
      type: object
      description: What an attach did. `converted_automations` and `resumed_automations` are empty lists, never null.
      required: [item, converted_automations, resumed_automations]
      properties:
        item:
          allOf:
            - $ref: "#/components/schemas/PendingItem"
          description: The item after the attach (state attached)
        converted_automations:
          type: array
          items: {$ref: "#/components/schemas/PendingItemAttachConversion"}
        resumed_automations: {type: array, items: {type: string}, description: The Automations the attach resumed}
        notes: {type: array, items: {type: string}, description: "Automations left blocked, and why (for example auto-resume is off)"}
    PendingItemRefreshResult:
      type: object
      description: What a read of the file registry did.
      required: [configured, at, rows, added, updated, done, dropped, kept, skipped]
      properties:
        configured: {type: boolean, description: "False when no registry path is set; nothing was read or changed"}
        path: {type: string, description: The file that was read}
        at: {type: string, format: date-time}
        rows: {type: integer, description: Rows read from the file}
        added: {type: integer, description: New waiting items created}
        updated: {type: integer, description: Items whose title changed}
        done: {type: integer, description: Items moved to done}
        dropped: {type: integer, description: Waiting file items removed (on_missing_row drop)}
        kept: {type: integer, description: Items whose row vanished and that were left in the registry}
        skipped: {type: integer, description: "Rows not used: the id does not match the pattern, no title, or a duplicate id"}
        error: {type: string, description: "Why the file could not be read; absent on success"}
    CleanupPassStatus:
      type: object
      description: One cleanup pass; owner_* covers this daemon's own finished Automata, net_* the same pass's sweep of everything else
      required: [mode, last_run, removed, would_remove, skipped, failed, bytes_freed, last_error, owner_removed, net_removed, owner_bytes_freed, net_bytes_freed]
      properties:
        mode: {type: string, enum: [off, report, "on"], description: "The cleanup mode in effect when the pass last ran (autonomous.automation.cleanup_mode; default report)"}
        last_run: {type: string, nullable: true, format: date-time, description: When the pass last ran; null until it runs}
        removed: {type: integer, description: Entries removed on the last run}
        would_remove: {type: integer, description: "report mode: entries that would be removed"}
        skipped: {type: integer, description: Entries skipped on the last run}
        failed: {type: integer, description: Entries that failed on the last run}
        bytes_freed: {type: integer, format: int64, description: Bytes freed on the last run}
        last_error: {type: string, description: "The last error; empty when the pass succeeded"}
        owner_removed: {type: integer, description: "This daemon's own finished Automata entries"}
        net_removed: {type: integer, description: Everything else the same pass removed}
        owner_bytes_freed: {type: integer, format: int64}
        net_bytes_freed: {type: integer, format: int64}
    CleanupDiskCheck:
      type: object
      description: One disk-usage reading behind a cleanup pass
      properties:
        path: {type: string, description: The path the usage was measured for}
        percent: {type: integer, description: Disk usage used percent}
        alert: {type: boolean, description: "True when the reading is at or above the threshold"}
    SupervisorWatchStatus:
      type: object
      description: >-
        The supervisor watch state, as GET /api/autonomous/supervisor-watch
        returns it. `findings` is open first, most recently seen first;
        `last_poll_at` is the coordinator's last poll instant (the zero time
        when it never has); `mode` is the watch mode in effect (an unset mode
        reads shadow — reports only, never acts).
      required: [mode, last_poll_at, findings, comparison]
      properties:
        mode:
          type: string
          enum: [off, shadow, on]
          description: The watch mode in effect; an unset mode reads shadow
        last_poll_at:
          type: string
          format: date-time
          description: When the coordinator last ran a supervisor watch pass; the zero time when it never has
        findings:
          type: array
          description: The stored findings, open first, most recently seen first; empty when none are stored
          items: {$ref: "#/components/schemas/SupervisorWatchFinding"}
        comparison: {$ref: "#/components/schemas/SupervisorWatchComparisonView"}
    SupervisorLoopStats:
      type: object
      description: The supervisor loop as numbers, as GET /api/supervisor-loop/stats returns it.
      required: [enabled, jobs, jobs_enabled, runs, runs_ok, runs_validator_failed, runs_escalated, runs_error, retries, last_run_age_seconds]
      properties:
        enabled: {type: boolean, description: Whether the loop is on}
        jobs: {type: integer, description: How many jobs the loop has}
        jobs_enabled: {type: integer, description: How many jobs are enabled (0 when the loop is off)}
        runs: {type: integer, description: Stored run records}
        runs_ok: {type: integer}
        runs_validator_failed: {type: integer}
        runs_escalated: {type: integer}
        runs_error: {type: integer}
        retries: {type: integer, description: Extra attempts used across the stored runs}
        last_run_age_seconds: {type: integer, description: Seconds since the last run started; -1 when none has run}
    SupervisorWatchStats:
      type: object
      description: >-
        The supervisor watch as numbers, as GET /api/autonomous/supervisor-watch/stats
        returns it.
      required: [mode, last_poll_at, last_poll_age_seconds, findings_open, findings_would_alert, findings_alerted, findings_resolved, agreed_days]
      properties:
        mode:
          type: string
          enum: [off, shadow, on]
          description: The watch mode in effect; an unset mode reads shadow
        last_poll_at:
          type: string
          format: date-time
          description: When the coordinator last ran a supervisor watch pass; the zero time when it never has
        last_poll_age_seconds: {type: integer, description: "Whole seconds since the last poll; -1 when the coordinator never polled"}
        findings_open: {type: integer, description: Findings not yet resolved, including the would-alert and alerted ones}
        findings_would_alert: {type: integer, description: Open findings shadow marked alert-due without raising an alert}
        findings_alerted: {type: integer, description: Open findings an alert was raised for}
        findings_resolved: {type: integer, description: Stored findings whose check stopped reporting them}
        agreed_days: {type: integer, description: Calendar days whose comparisons with the supervisor script all agreed}
    SupervisorWatchFinding:
      type: object
      description: >-
        One open (or resolved) supervisor watch finding: what the daemon-side
        watch raised (or would have raised, in shadow mode) and records until an
        operator closes it. Kind and subject are the finding's identity.
      required: [kind, subject, first_seen_at, last_seen_at, resolved]
      properties:
        kind:
          type: string
          enum: [tmux_restart, daemon_inactive, model_not_resident, task_failed, task_review_needed, automaton_not_merged, idle_lane_eligible_work, worktree_no_gomod, worktree_not_registered, worktree_silent, verify_script_not_executable, main_checkout_dirty, ci_red, ci_stuck]
          description: What the finding is about, one of the stable finding kinds
        subject: {type: string, description: "The stable id the finding is about: an Automaton id, a node name, a lane name, a CI run id, or the main checkout's path"}
        text: {type: string, description: The operator-facing line for the finding; empty when not set}
        first_seen_at: {type: string, format: date-time, description: When the finding was first raised; preserved across refreshes}
        last_seen_at: {type: string, format: date-time, description: When the finding was last re-raised or touched}
        would_alert: {type: boolean, description: Shadow mode marked this finding alert-due without raising; false in on mode}
        alerted_at:
          nullable: true
          type: string
          format: date-time
          description: When the alert for the finding was raised; null until it does
        resolved: {type: boolean, description: The operator (or a later pass) closed the finding; a re-sighting re-opens it in place}
    SupervisorWatchComparisonView:
      type: object
      description: >-
        The comparison view the supervisor watch read route serves: the last
        recorded comparison between the watch's findings and the script's
        record file (null until one was recorded — an unavailable script record
        is never recorded), the days whose comparisons all agreed, and the last
        comparison's one-sided differences.
      properties:
        last:
          nullable: true
          description: The most recent recorded comparison
          oneOf:
            - type: 'null'
            - $ref: "#/components/schemas/SupervisorWatchComparison"
        agreed_days: {type: integer, description: Calendar days whose comparisons all agreed; a day with no comparisons does not count}
        only_watch:
          type: array
          description: The last comparison's entries the watch raised that the script did not
          items: {type: string}
        only_script:
          type: array
          description: The last comparison's entries the script raised that the watch did not
          items: {type: string}
    SupervisorWatchComparison:
      type: object
      description: >-
        One pass's comparison between the daemon-side supervisor watch's
        findings and the script's record file: the two sides' kind/subject
        sets, the two one-sided differences, and whether they agreed.
      required: [at, watch_kinds, script_kinds, only_watch, only_script, agreed]
      properties:
        at: {type: string, format: date-time, description: When the pass ran the comparison}
        watch_kinds: {type: array, description: The watch's kind/subject set, sorted and de-duplicated, items: {type: string}}
        script_kinds: {type: array, description: The script's kind/subject set, sorted and de-duplicated, items: {type: string}}
        only_watch: {type: array, description: Entries the watch raised that the script did not, items: {type: string}}
        only_script: {type: array, description: Entries the script raised that the watch did not, items: {type: string}}
        agreed: {type: boolean, description: The two sides raised exactly the same kind/subject set}
    SecurityFailureEntry:
      type: object
      description: >-
        One stored security failure report with the identity of the failing
        security run it belongs to, as GET /api/autonomous/security-failures
        returns it.
      required: [repo, ref_kind, ref_name, workflow, run_id, run_url, status, report]
      properties:
        repo: {type: string, description: The repository path, e.g. dmz006/datawatch}
        ref_kind: {type: string, enum: [main, tag], description: The kind of ref the run was watched at}
        ref_name: {type: string, description: The branch name or tag}
        workflow: {type: string, description: The workflow file name}
        run_id: {type: string, description: The CI run ID}
        run_url: {type: string}
        status:
          type: string
          enum: [green, failing, pending, hung, rerunning, superseded]
          description: The run's watch state
        report: {$ref: "#/components/schemas/SecurityFailureReport"}
    SecurityFailureReport:
      type: object
      description: >-
        The report stored for one failing security run: what failed, what the
        advisory lookup and the accepted-risks registry said, what was
        recommended, and what the Automaton line received.
      properties:
        dependency: {type: string}
        advisory_ids: {type: array, items: {type: string}}
        workflow: {type: string}
        run_id: {type: integer, format: int64}
        run_url: {type: string}
        sha: {type: string, description: The commit the run executed against}
        published_at: {type: string, description: When the advisory was published, as the lookup reported it; empty when unknown}
        fixed_version: {type: string}
        registry_found: {type: boolean, description: Whether the accepted-risks registry holds an entry for the advisory}
        registry_id: {type: string}
        registry_first_added: {type: string}
        registry_added: {type: string}
        registry_expires: {type: string}
        registry_error: {type: string, description: Why the registry could not be consulted; empty otherwise}
        lookup_error: {type: string, description: Why the advisory lookup failed; empty otherwise}
        recommendation: {type: string, enum: [upgrade, unknown, keep, keep_no_entry]}
        note: {type: string, description: Why the decision stopped at report_only or consulted nothing; empty otherwise}
        mode: {type: string, enum: [off, shadow, on], description: The security failure mode the report was made under}
        action: {type: string, enum: [report_only, would_stop, stopped], description: What the decision did or would do to the Automaton line}
        assessed_at: {type: string}
    RepoCIWatchRecord:
      type: object
      description: >-
        One record for a CI run watched at a repository's head of main or a tag
        while it waits for operator attention.
      required: [repo, ref_kind, ref_name, sha, workflow, run_id, status, first_seen_at, updated_at]
      properties:
        repo: {type: string, description: The repository path, e.g. dmz006/datawatch}
        ref_kind: {type: string, enum: [main, tag], description: The kind of ref being watched}
        ref_name: {type: string, description: The branch name or tag}
        sha: {type: string, description: The commit the run executed against}
        workflow: {type: string, description: The workflow file name}
        run_id: {type: string, description: The CI run ID the record is keyed on}
        run_url: {type: string}
        status:
          type: string
          enum: [green, failing, pending, hung, rerunning, superseded]
          description: The run's watch state
        classification:
          type: string
          enum: [code_or_test, infra, hung, security, policy, judging, none]
          description: The failure's resolved category; none until one is assigned
        first_seen_at: {type: string, format: date-time, description: When the run was first observed under watch; preserved across refreshes}
        updated_at: {type: string, format: date-time, description: When the record was last refreshed}
        alerted_at:
          nullable: true
          type: string
          format: date-time
          description: When the record was marked alerted; null until it does
        rerun_log:
          type: array
          description: One entry per automatic cancel or rerun performed on the run
          items:
            type: object
            properties:
              at: {type: string, format: date-time}
              action: {type: string, enum: [cancel, rerun]}
              run_id: {type: string}
        would_do:
          type: array
          description: "Shadow-mode log: what the watch would have done, had it not been shadowed"
          items:
            type: object
            properties:
              action: {type: string, enum: [cancel, rerun]}
              run_id: {type: string}
              reason: {type: string}
        superseded_run_ids:
          type: array
          description: The run's superseded predecessors, each with its run URL
          items:
            type: object
            properties:
              run_id: {type: string}
              run_url: {type: string}
        notes:
          type: array
          description: The append-only annotation list, oldest first
          items: {$ref: "#/components/schemas/TriageNote"}
        judge_verdict:
          type: object
          description: The judge's verdict cached for this record's run
          properties:
            run_id: {type: string}
            verdict: {type: string}
    NodeUsage:
      type: object
      description: |
        The node_usage object carried on a node:<name> pool in the GET /api/capacity
        response, when the daemon reports per-node usage. It shows the state of the
        node's model probe, the models loaded in memory (with their memory footprint
        and eviction time), and the GPU figures. A node of type ollama with an
        address has models_supported true.
      properties:
        state:
          type: string
          enum: [ok, unreachable, pending, no_data]
          description: |
            ok = the model server answered (or the node kind has no model probe);
            unreachable = the model server probe failed (timeout, connection error,
            non-200 response, or a response body that could not be read);
            pending = no cached figure yet and a refresh has been started;
            no_data = the node has no address and no observer data.
        checked_at:
          type: string
          format: date-time
          description: When the probe last ran.
        error:
          type: string
          description: Short reason for a failed probe; omitted when empty.
        models_supported:
          type: boolean
          description: True only for nodes of ollama kind that have an address.
        models:
          type: array
          description: Models currently loaded in memory. Always an array (empty when none).
          items:
            type: object
            properties:
              name: {type: string, description: The model name}
              size_bytes: {type: integer, description: Total memory the loaded model uses}
              size_vram_bytes: {type: integer, description: The part of that footprint in GPU memory}
              expires_at:
                type: string
                format: date-time
                description: When an eviction is scheduled; omitted when no_expiry.
              no_expiry:
                type: boolean
                description: True when the model stays loaded indefinitely (no eviction scheduled).
        gpu:
          type: array
          description: GPU figures from the node observer, filled whenever available - even when the model server is unreachable. Always an array (empty when none).
          items:
            type: object
            properties:
              name: {type: string}
              util_pct: {type: number, description: GPU utilization in percent}
              mem_used_bytes: {type: integer, description: GPU memory in use}
              mem_total_bytes: {type: integer, description: Total GPU memory}
    PendingEventsPage:
      type: object
      required: [events, next_cursor, dropped]
      properties:
        events:
          type: array
          description: Lifecycle events after the requested cursor, oldest first; never null
          items: {type: object, additionalProperties: true}
        next_cursor:
          type: integer
          description: Cursor to pass as `since` on the next call
        dropped:
          type: boolean
          description: True when unseen events were evicted from the bounded queue
    VerifierPolicyOverrideRequest:
      type: object
      description: |
        Presence-aware verifier policy override. Omitting a field leaves it
        unchanged; an empty `mode` or an empty `backends` list clears it.
      properties:
        mode:
          type: string
          description: "fixed | prefer-free | balance | gpu-only | claude-only. Empty string = clear (inherit). Any other value is rejected with 400."
        backends:
          type: array
          items: {type: string}
          description: "Ordered list of eligible verifier backends (LLM registry names). Empty list = clear (inherit). An empty entry or an unknown LLM name is rejected with 400."
        actor: {type: string, description: "Who made the change (default `operator`)"}
    PlanCoverageRecord:
      type: object
      description: |
        A stored plan-coverage record (the Automaton's `plan_coverage`). It
        pins the check settings and the finding filters from the moment the
        report was computed (so a later config change does not silently
        re-interpret the stored report) and carries the operator
        acknowledgement state.
      properties:
        mode: {type: string, enum: [off, warn, block], description: "Plan-coverage check mode in effect when the report was computed"}
        min_ratio: {type: number, description: "Minimum covered-requirement ratio (0,1] in effect when the report was computed; 1.0 = full coverage"}
        report: {description: "The coverage report from CheckPlanCoverage for the latest decomposition attempt"}
        ack:
          nullable: true
          type: object
          description: "The operator acknowledgement of a failing report, if one exists; absent (null) when unacknowledged"
          properties:
            by: {type: string, description: "Operator identity that acknowledged"}
            at: {type: string, format: date-time, description: "Acknowledgement time (UTC)"}
            note: {type: string, description: "Operator free-text justification"}
            fingerprint: {type: string, description: "Fingerprint of the failing report this acknowledgement covers"}
        findings: {type: array, description: "Structural findings from the same deterministic coverage check; absent when the stored plan had none"}
        suppressed:
          description: "Findings the finding filters removed from this report; zeroes when the filters were off or suppressed nothing"
          allOf: [{$ref: "#/components/schemas/PlanCoverageSuppressed"}]
        filters: {$ref: "#/components/schemas/PlanCoverageFilters", description: "The finding filters in effect when this record was computed, pinned like mode and min_ratio"}
    PlanCoverageSuppressed:
      type: object
      description: |
        Per-category count of findings the plan-coverage finding filters
        removed: rule-3 structural findings withheld for files the plan
        itself creates, and spec wording scoped requirement-extraction
        stopped counting as standalone requirements. In the read envelope
        (`suppressed` atop the GET /api/autonomous/prds/{id}/plan_coverage
        response) `total` is the sum of the two; inside a stored record the
        two fields carry the same counts without a total.
      properties:
        created_files: {type: integer, description: "Findings withheld for files the plan itself creates (rule 3)"}
        requirements: {type: integer, description: "Spec tokens scoped requirement extraction stopped counting as requirements"}
        total: {type: integer, description: "Sum of created_files and requirements; zero when there is no stored record. Present in the read envelope; a stored record carries the two fields without a total"}
    PlanCoverageFilters:
      type: object
      description: |
        The resolved plan-coverage finding filterset (effective config:
        both filters default on, sections default to scope,constraints,
        minimum requirement length defaults to 30).
      required: [suppress_created_files, scoped_requirements, requirement_sections, min_requirement_chars]
      properties:
        suppress_created_files: {type: boolean, description: "Hide findings for files the plan itself creates (default true)"}
        scoped_requirements: {type: boolean, description: "Only count requirement wording inside the configured spec sections (default true)"}
        requirement_sections: {type: array, items: {type: string}, description: "Spec section names to scope requirements to (default scope,constraints)"}
        min_requirement_chars: {type: integer, description: "Shortest requirement sentence, in characters, that counts (default 30)"}
    PlanReviewVerdict:
      type: object
      description: |
        Recorded verdict of the pre-approval plan reviewer (see
        `autonomous.plan_review_mode`). Only the latest verdict is stored —
        re-running the review or re-decomposing replaces it. A verdict with
        `reviewer_failed: true` is the placeholder for a reviewer outage or
        an unparseable response: it is displayed, but must never be treated
        as an approval blocker.
      properties:
        ok: {type: boolean, description: "Reviewer's overall judgment (false for a reviewer_failed placeholder)"}
        severity: {type: string, enum: [low, medium, high], description: "Worst finding's severity; 'high' blocks approval in block mode"}
        summary: {type: string, description: "One or two operator-actionable sentences"}
        findings: {type: array, items: {$ref: "#/components/schemas/PlanReviewFinding"}, description: "Empty for an ok:true verdict"}
        backend: {type: string, description: "Reviewer LLM backend actually used"}
        model: {type: string}
        mode: {type: string, enum: [warn, block], description: "plan_review_mode in effect when this verdict was produced"}
        at: {type: string, format: date-time}
        prompt_chars: {type: integer, description: "Size of the bounded plan projection that was judged"}
        response_chars: {type: integer}
        tokens_in: {type: integer, description: "Reviewer spend; 0 when the backend does not report it"}
        tokens_out: {type: integer}
        est_cost_usd: {type: number}
        reviewer_failed: {type: boolean, description: "Reviewer outage / unparseable verdict; never blocks approval"}
    PlanReviewFinding:
      type: object
      description: One concrete problem the reviewer located in the plan
      properties:
        task_id: {type: string, description: "Task the finding is about; empty when story- or plan-scoped"}
        task_title: {type: string}
        category: {type: string, enum: [missing, weakened, too_large, wrong_dependency, fragile_verification, out_of_scope]}
        detail: {type: string, description: "One specific, actionable sentence"}
    AutonomousPRD:
      type: object
      description: |
        Autonomous PRD shape relevant to plan review; the full
        story/task tree is returned by `GET /api/autonomous/prds/{id}`
        and by the plan-review endpoint above.
      properties:
        id: {type: string}
        spec: {type: string}
        status: {type: string}
        notify_events: {type: array, items: {type: string}, description: "Lifecycle event kinds that notify for this Automaton; absent or empty means inherit from the guardrail profile, then the global default"}
        notify_events_effective:
          type: object
          description: "Computed read-time view (never persisted): the effective kinds and the tier supplying them"
          properties:
            events: {type: array, items: {type: string}}
            source: {type: string, enum: [automaton, profile, global]}
        plan_review: {$ref: "#/components/schemas/PlanReviewVerdict", description: "Present once a review has run (warn/block modes)"}
        story:
          type: array
          items:
            type: object
            properties:
              title: {type: string}
              tasks: {type: array, items: {$ref: "#/components/schemas/AutonomousTask"}}
    AutonomousTask:
      type: object
      description: One task in the PRD's plan (subset of stored fields)
      properties:
        id: {type: string}
        title: {type: string}
        spec: {type: string}
        depends_on: {type: array, items: {type: string}}
        read_only: {type: boolean, description: "The task changes no files, so it may skip the tree lock when autonomous.parallel.read_only_tasks is on. Absent = false. Set through add_task and edit_task, or by decompose"}
        report_path: {type: string, description: "The one clean repo-relative report file this read-only task may write; under .datawatch/reports/. Absent = the task writes nothing. Only honored on a read-only task"}
        merge_state: {type: string, enum: [pending, merged, conflict, held], description: "State of the merge of the task branch into the PRD branch (worktree-per-task mode). Absent for a task that works in the PRD worktree"}
        merge_commit: {type: string, description: "The PRD branch commit that carries the task work once merge_state is merged"}
        kind: {type: string, enum: ['', decompose, smoke, final_gate], description: "Empty = ordinary task. 'smoke' marks the task that IS the plan's own smoke verification (judged by the verifier LLM from autonomous.smoke_verification_backend/models); 'final_gate' the terminal verification task that runs the plan's verification script"}
        verification_script: {type: string}
        status: {type: string}
        compute_node: {type: string, description: "Compute node the task's worker was started on; a daemon restart adopts the surviving worker onto it. Absent for a hosted backend or before the worker starts"}
        executor_source: {type: string, description: "task | story | prd | automation | global"}
    TaskProgress:
      type: object
      description: |
        Live progress snapshot parsed from a pi session's own JSONL log —
        carried by autonomous tasks while they are in progress (status
        in_progress or verifying) and returned by GET /api/sessions/{id}/progress.
        The autonomous store forces these fields off the moment a task leaves
        the active statuses, so their presence is the signal that the worker
        is running right now; they are omitted from JSON otherwise. It is
        task data: the PWA shows it on the running task's card, and
        GET /api/sessions/{id}/progress answers 404 for a non-pi session —
        a stale pi log from another session is never read (9.31.3).
      required: [last_event_at, assistant_turns]
      properties:
        last_event_at: {type: string, format: date-time, description: "Timestamp of the newest event in the log (RFC3339)"}
        assistant_turns: {type: integer, description: "Assistant-role messages so far (one per LLM reply, tool-calling ones included)"}
        tool_calls:
          type: object
          description: Per-tool-name call counts across the log so far
          additionalProperties: {type: integer}
        last_tool_name: {type: string, description: "Name of the most recent tool call (omitted when none yet)"}
        last_tool_args: {type: string, description: "Arguments of the most recent tool call as compact JSON, truncated to 500 characters"}
        last_summary: {type: string, description: "First 200 characters of the most recent thinking or text block — the agent's own last-stated intent"}
        tokens: {type: integer, description: "Cumulative tokens reported by the log's assistant messages"}
    AutonomousPrdGit:
      type: object
      description: |
        PRD-level git workflow state, returned as `git` inside an
        /api/autonomous/prds item. Provider/branch/PR URL are
        executor-managed; the push fields record the PRD's push outcome.
      properties:
        provider: {type: string, description: 'git provider ("<none>" when unset)'}
        url: {type: string, description: remote URL}
        base_branch: {type: string}
        branch: {type: string, description: 'worktree branch, `automaton/<sha8>`'}
        auto_pr: {type: boolean}
        pr_url: {type: string, description: created PR, if any}
        push_on_complete: {type: string, enum: ['', never, branch, default_branch], description: 'per-PRD push policy override; "" clears it'}
        push_state:
          type: string
          enum: [pushed, not_pushed]
          description: last recorded push outcome; absent when no push was attempted yet
        pushed_ref: {type: string, description: ref last successfully pushed (push_state=pushed only)}
        pushed_sha: {type: string, description: HEAD SHA last successfully pushed (push_state=pushed only), 40 hex}
        pushed_at: {type: string, format: date-time, description: UTC time of the last successful push (push_state=pushed only)}
        push_warning: {type: string, description: human reason no push was made (push_state=not_pushed only)}

    AutonomousPrdListItem:
      type: object
      description: One PRD as listed by GET /api/autonomous/prds.
      required: [id, status]
      properties:
        id: {type: string, description: '8-hex PRD id'}
        spec: {type: string}
        title: {type: string}
        status: {type: string}
        project_dir: {type: string}
        project_profile: {type: string}
        cluster_profile: {type: string}
        rev: {type: integer}
        git: {$ref: '#/components/schemas/AutonomousPrdGit'}
        push_state: {type: string, enum: [pushed, not_pushed], description: 'push outcome at the top level of a list or summary item'}
        push_warning: {type: string, description: 'reason no push was made (push_state=not_pushed only)'}
        stories: {type: array, items: {type: object}, description: story+task tree (full view)}
        ci_watch: {type: object, description: ci-watch completion guardrail result, when it ran}
        review_state: {$ref: '#/components/schemas/AutonomousPrdReviewState'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        merged_in_release: {type: string, description: 'shipped state: the release the work landed in. Present when the work shipped'}
        merged_at: {type: string, format: date-time, description: 'shipped state: when it merged (RFC 3339)'}
        merge_commit: {type: string, description: 'shipped state: the default-branch merge commit — its being non-empty is what makes the record shipped; recording it never changes the status'}
        shipped_source: {type: string, enum: [merge_step, backfill], description: 'shipped state: where the record came from'}

    AutonomousPrdReviewState:
      type: object
      description: |
        Where the Automaton's review stands, computed from the verdicts
        recorded on it (its own, then each story's and task's) and never stored:
        the newest block decides unless a strictly newer pass superseded it.
        `timed_out` is a judge-timeout hold - the judge hit its time limit on
        every backend it tried, so the review is held, not approved or blocked
        by a judgment; its `cause` names the backends that timed out and their
        time limit, and its `action` is `reroute` (the stronger guardrail
        backend is configured and none of the timed-out attempts tried it) or
        `retry` (run the judge again on the same backend list). `blocked` is a
        real judgment - the verdict's issues say what to fix (action `fix`).
        `passed` reads as passed with no action.
      required: [state, attempts]
      properties:
        state: {type: string, enum: [passed, blocked, timed_out, pending], description: 'review outcome'}
        cause: {type: string, description: 'one-line account of why the review is in this state; absent when there is nothing to name or it is pending with no warnings'}
        action: {type: string, enum: [fix, retry, reroute], description: 'the next step the review state points to; absent for pending'}
        attempts: {type: integer, description: 'judge attempts behind the deciding verdict (one record per backend); 0 for a single-judgment verdict and for pending'}

    AutonomousPrdList:
      type: object
      description: Response of GET /api/autonomous/prds.
      required: [prds]
      properties:
        prds:
          type: array
          items: {$ref: '#/components/schemas/AutonomousPrdListItem'}

    SessionAutomatonDetail:
      type: object
      description: |
        Autonomous task detail for a session, built from stored PRD/story/task
        data. Omitted for non-autonomous sessions or when the PRD cannot be loaded.
      required: [prd_id, cost]
      properties:
        prd_id: {type: string}
        prd_title: {type: string}
        prd_status: {type: string}
        story_id: {type: string}
        story_title: {type: string}
        task_id: {type: string}
        task_title: {type: string}
        task_spec: {type: string, description: "Task spec, cut to 600 characters (ellipsis appended when cut)"}
        task_spec_truncated: {type: boolean, description: "Present and true when task_spec was cut"}
        task_status: {type: string}
        executor_source: {type: string, description: "task | story | prd | automation | global"}
        wait_reason: {type: string}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        retry_count: {type: integer}
        error: {type: string}
        verification:
          type: object
          properties:
            ok: {type: boolean}
            severity: {type: string}
            summary: {type: string}
            issues: {type: array, items: {type: string}}
            verifier_backend: {type: string}
            verifier_model: {type: string}
            verifier_source: {type: string, description: "task | story | prd | automation | global | pool"}
        git:
          type: object
          properties:
            pre_task_sha: {type: string}
            base_sha: {type: string, description: "Git HEAD captured at the start of the task's first attempt; never overwritten by retries (pre_task_sha is per-attempt)"}
            attempt_commit_shas: {type: array, items: {type: string}, description: "Commit shas recorded for the task's finished attempts, in order"}
            files_planned: {type: array, items: {type: string}, description: "Task files, or the story's planned files when the task has none"}
            files_touched: {type: array, items: {type: string}}
            foreign_file_drift: {type: array, items: {type: string}}
        decisions:
          type: array
          description: Last 10 entries of the Automaton decision log
          items:
            type: object
            properties:
              at: {type: string, format: date-time}
              kind: {type: string}
              actor: {type: string}
              note: {type: string}
              verdict_outcome: {type: string}
        cost:
          type: object
          properties:
            tokens_in: {type: integer}
            tokens_out: {type: integer}
            est_cost_usd: {type: number}
    PluginWidgetView:
      type: object
      description: A manifest widget plus its latest stored value.
      properties:
        id: {type: string}
        surface: {type: string, enum: [dashboard, session]}
        kind: {type: string, enum: [stat_tile, table, list, sparkline, status_badge, markdown]}
        data_mode: {type: string, enum: [push, pull]}
        pull_path: {type: string}
        interval_seconds: {type: integer}
        value:
          nullable: true
          type: object
          properties:
            plugin: {type: string}
            widget_id: {type: string}
            data: {description: The widget value as pushed or pulled}
            updated_at: {type: string, format: date-time}
            source: {type: string, enum: [push, pull]}
            error: {type: string, description: Last pull error; data keeps the previous value}
    ChannelDiagnostics:
      type: object
      properties:
        bridge_kind:
          type: string
          description: '"go" or "js" — which bridge the daemon resolved'
          example: "go"
        bridge_path:
          type: string
          description: Resolved binary/script path
          example: "/usr/local/bin/datawatch-channel"
        global_port:
          type: integer
          description: server.channel_port config value (0 = auto/random)
          example: 0
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/ChannelSessionDiag"
        hints:
          type: array
          items:
            type: string
          description: Actionable remediation hints when problems are detected

    ChannelSessionDiag:
      type: object
      properties:
        session_id:
          type: string
          description: Short session hex ID
          example: "a3f2"
        session_name:
          type: string
          description: Human name if set
          example: "worker"
        channel_port:
          type: integer
          description: Port the bridge registered via POST /api/channel/ready (0 = not ready yet)
          example: 54321
        bridge_alive:
          type: boolean
          description: Result of a live GET http://127.0.0.1:PORT/health probe
          example: true
        probe_error:
          type: string
          description: Human-readable error when bridge_alive is false

    Session:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
          description: Tag IDs the session carries itself
        inherited_tags:
          type: array
          items:
            type: string
          description: Tag IDs inherited from the owning Automaton; computed on read, read-only, empty outside an Automaton
        model_request:
          $ref: "#/components/schemas/RequestWatchObservation"
          description: The request watch's observation of the session's in-flight model request, with state, node, model, no-progress time and a plain-text summary; computed on read, read-only, omitted when the session has none
        id:
          type: string
          description: Short 4-character hex ID
          example: "a3f2"
        full_id:
          type: string
          description: Full hostname-prefixed ID
          example: "hal9000-a3f2"
        name:
          type: string
        priority:
          type: integer
          default: 0
          description: Capacity-queue priority; higher is admitted first when capacity is contended
          description: Optional human-readable name (set at creation or via rename)
          example: "auth refactor"
        task:
          type: string
          description: Original task description
          example: "write a fibonacci function in Go"
        llm_backend:
          type: string
          description: LLM backend used for this session
          example: "claude-code"
        tmux_session:
          type: string
          description: tmux session name
          example: "cs-hal9000-a3f2"
        log_file:
          type: string
          description: Path to the session's output log
          example: ".datawatch/logs/hal9000-a3f2.log"
        state:
          $ref: "#/components/schemas/SessionState"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        hostname:
          type: string
          example: "hal9000"
        group_id:
          type: string
          description: Signal group ID this session was created from
        pending_input:
          type: string
          description: Set when waiting for user input
        last_prompt:
          type: string
          description: The prompt text that triggered waiting_input state

    SessionState:
      type: string
      enum: [running, waiting_input, complete, failed, killed]
      description: |
        - `running`: claude-code is actively running
        - `waiting_input`: claude-code is waiting for user response
        - `complete`: claude-code exited successfully
        - `failed`: claude-code exited with error
        - `killed`: session was manually terminated

    LLMEntry:
      type: object
      description: An LLM registry entry. Only the fields documented here are covered; the registry holds more (kind, models, compute nodes, budget).
      properties:
        name: {type: string}
        kind: {type: string}
        enabled: {type: boolean}
        plan_tier: {type: string}
        max_inflight: {type: integer, nullable: true}
        roles:
          type: array
          items: {type: string}
          description: Workloads this entry serves. Open set of strings, stored trimmed, lower-cased and de-duplicated.
        role_warnings:
          type: array
          items: {type: string}
          description: Contention warnings that name this entry. Set on the single-entry GET only.

    LLMWriteBody:
      type: object
      description: Body of an LLM create or update. Only the fields documented here are covered; the other entry fields are accepted as on the entry.
      properties:
        name: {type: string}
        kind: {type: string}
        roles:
          type: array
          items: {type: string}
          description: Workload roles this entry serves. On update, omit to keep the stored roles; an empty list clears them. An empty role string is rejected.

    LLMRoleTable:
      type: object
      properties:
        roles:
          type: array
          items:
            type: object
            properties:
              role: {type: string}
              entry: {type: string, description: Name of the registry entry the role resolves to}
        warnings:
          type: array
          items: {type: string}

    StartSessionRequest:
      type: object
      required: [task]
      properties:
        tags:
          type: array
          items:
            type: string
          description: Tag IDs the session carries from the start; an unknown ID refuses the start
          example: ["5e6f7a8b"]
        launch_role:
          type: string
          enum: [worker, verifier, planner, judge, supervisor]
          description: |
            Role the session plays. Stamps the `role:` placement tag. An unknown role is
            refused with 400 before the session starts. Omit for a plain session.
          example: "supervisor"
        launch_kind:
          type: string
          description: |
            Kind of session: `task`, `decompose`, `review`, `rejudge` or `auto-fix`. Stamps
            the `kind:` placement tag. An unknown kind is refused with 400 before the session
            starts. Omit for a plain session.
          example: "task"
        launch_stage:
          type: string
          description: Stage of the Automaton the session serves. Stamps the `stage:` placement tag.
          example: "build"
        launch_automaton:
          type: string
          description: Automaton the session belongs to. Stamps the `automaton:` placement tag.
          example: "3ab70001"
        task:
          type: string
          description: Task description passed to the LLM
          example: "refactor the auth module"
        name:
          type: string
          description: Optional human-readable name for the session
          example: "auth refactor"
        project_dir:
          type: string
          description: |
            Absolute path to the project directory. The LLM will be constrained to this tree.
            Defaults to session.default_project_dir from config.
          example: "projects/myapp"
        backend:
          type: string
          description: |
            LLM backend to use for this session. Must match a registered backend name.
            Defaults to the active backend from config.
          example: "aider"
        git:
          type: boolean
          default: false
          description: Opt in to git init, snapshot and automatic commit.
          example: true
        priority:
          type: integer
          default: 0
          description: Capacity-queue priority; higher is admitted first when capacity is contended. A non-integer value is a 400.

    CommandRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: Command string in Signal command format
          example: "new: build a REST API in Go"

    CommandResponse:
      type: object
      properties:
        result:
          type: string
          description: Human-readable result message

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        hostname:
          type: string
        version:
          type: string
        uptime_seconds:
          type: integer
        listeners:
          type: array
          description: One entry per daemon listener with its authentication posture. Computed live from the active config. Posture only — bind addresses and token/secret values are never included because this endpoint is reachable without auth.
          items:
            type: object
            properties:
              name:
                type: string
                example: "rest"
              enabled:
                type: boolean
              auth_required:
                type: boolean
              loopback:
                type: boolean
              acknowledged:
                type: boolean

    ConfigResponse:
      type: object
      description: Masked configuration. Sensitive fields (tokens, passwords, secrets) are replaced with "***".
      properties:
        telegram:
          type: object
          properties:
            enabled: { type: boolean }
            token: { type: string, example: "***" }
            chat_id: { type: string }
        discord:
          type: object
          properties:
            enabled: { type: boolean }
            token: { type: string, example: "***" }
            channel_id: { type: string }
        slack:
          type: object
          properties:
            enabled: { type: boolean }
            token: { type: string, example: "***" }
            channel_id: { type: string }
        matrix:
          type: object
          properties:
            enabled: { type: boolean }
            homeserver: { type: string }
            user_id: { type: string }
            access_token: { type: string, example: "***" }
            room_id: { type: string }
        twilio:
          type: object
          properties:
            enabled: { type: boolean }
            account_sid: { type: string }
            auth_token: { type: string, example: "***" }
            from_number: { type: string }
            to_number: { type: string }
        ntfy:
          type: object
          properties:
            enabled: { type: boolean }
            server_url: { type: string }
            topic: { type: string }
            token: { type: string, example: "***" }
        email:
          type: object
          properties:
            enabled: { type: boolean }
            host: { type: string }
            port: { type: integer }
            username: { type: string }
            from: { type: string }
            to: { type: string }
        webhook:
          type: object
          properties:
            enabled: { type: boolean }
            addr: { type: string }
        github_webhook:
          type: object
          properties:
            enabled: { type: boolean }
            addr: { type: string }
        server:
          type: object
          description: Web server section. `acknowledge_unauthenticated` (default false) silences the startup warning for enabled, token-unprotected, non-loopback listeners and sets their `acknowledged` flag in the /api/health `listeners` array and the listener_* diagnose checks; see "Unauthenticated listener startup warning" in the operations doc.
          properties:
            enabled: { type: boolean }
            host: { type: string }
            port: { type: integer }
            tls_enabled: { type: boolean }
            token: { type: string, example: "***" }
            acknowledge_unauthenticated: { type: boolean, description: "Operator ack for enabled, non-loopback, token-unprotected listeners. Default false. Silences the startup warning and sets the `acknowledged` flag in /api/health `listeners` and the listener_* diagnose detail; never changes bind address or tokens." }

    InfoResponse:
      type: object
      properties:
        hostname:
          type: string
        version:
          type: string
        llm_backend:
          type: string
          example: "claude-code"
        messaging_backend:
          type: string
          example: "signal"
        session_count:
          type: integer
        server:
          type: object
          properties:
            host:
              type: string
            port:
              type: integer
        capabilities:
          type: array
          description: |
            Optional API features this daemon supports. Check for an entry
            before using the feature; an older daemon omits the array or
            the entry. Strings are never renamed once shipped.
            `sessions.view_summary`, `alerts.paging`, `alerts.count`,
            `ws.alerts_read`, `ws.hello`, `ws.session_list_delta`,
            `ws.session_view_summary`, `ws.output_scoped`,
            `ws.unsubscribe`, and `api.gzip` (only while `server.api_gzip`
            is on).
          items:
            type: string
          example: ["sessions.view_summary", "alerts.paging", "alerts.count", "ws.hello", "api.gzip"]

    ScheduledCommand:
      type: object
      description: |
        One scheduled command. Either `cron` (recurring) or `run_at`
        (one-shot) is present; both are optional but at least one is
        required when creating a new entry. `command` is the body
        that will be executed when the schedule fires; `task` is
        accepted as a legacy alias for the new-session variant.
      properties:
        id:
          type: string
          description: Unique identifier for this scheduled entry
        session_id:
          type: string
          description: Session the schedule is attached to (optional — omitted for new-session schedules)
        command:
          type: string
          description: Command body to send when the schedule fires
          example: "status"
        task:
          type: string
          description: "Legacy alias for the new-session variant; prefer `command`"
          example: "run nightly tests"
        cron:
          type: string
          description: Cron expression (5-field standard format) — omit for one-shot
          example: "0 2 * * *"
        run_at:
          type: string
          format: date-time
          description: RFC3339 timestamp for one-shot schedules — omit for recurring
        session_name:
          type: string
          description: "BL353: Resolve target by session name at fire time (survives session restarts)"
        cron_expr:
          type: string
          description: "BL353: 5-field cron expression (alias for `cron`; preferred in new entries)"
          example: "*/5 * * * *"
        schedule_name:
          type: string
          description: "BL353: Human-readable label for lookup/cancel by name"
        state:
          type: string
          description: Lifecycle state
          enum: [pending, fired, cancelled, failed]
        enabled:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time

    ResultPayload:
      type: object
      required: [title]
      properties:
        title:
          type: string
          description: Required heading for the result
          example: "Nightly sweep"
        status:
          type: string
          description: Absent, `ok`, `warn`, or `error`
          enum: ["", ok, warn, error]
        summary:
          type: string
          description: One-paragraph human summary (strings over 2000 chars are truncated)
        metrics:
          type: object
          additionalProperties: true
          description: Free-form key/value metrics
          example:
            pass: 5
            fail: 0
        tables:
          type: array
          description: Up to 20 tables of at most 100 rows
          items:
            type: object
            properties:
              title:
                type: string
              columns:
                type: array
                items:
                  type: string
              rows:
                type: array
                items:
                  type: array
                  items:
                    type: string
        markdown:
          type: string
          description: Optional markdown report body

    ScheduleResultEntry:
      type: object
      description: "One posted result — the payload plus its provenance"
      properties:
        payload:
          $ref: "#/components/schemas/ResultPayload"
        session_id:
          type: string
          description: Session that posted the result
        schedule_name:
          type: string
          description: Schedule name the session belongs to
        posted_at:
          type: string
          format: date-time

    ScheduleResultSummary:
      type: object
      description: One grouped row of the schedule-results list
      properties:
        schedule_name:
          type: string
        latest:
          $ref: "#/components/schemas/ScheduleResultEntry"
        count:
          type: integer
          description: Number of retained entries for this schedule
        recent_statuses:
          type: array
          description: Recent `status` values, oldest → newest (capped at 50); empty when unset
          items:
            type: string

    RemoteServer:
      type: object
      properties:
        name:
          type: string
          description: Short identifier used with --server flag
          example: "nas"
        url:
          type: string
          description: Base URL of the remote datawatch instance
          example: "http://203.0.113.10:8080"
        token:
          type: string
          description: "Bearer token. Accepted on create/update requests; never returned in a response (SEC-014) — responses carry token_present/token_prefix instead, and omit this field entirely when redacted."
          example: "***"
        token_present:
          type: boolean
          description: "Response-only (SEC-014). Whether a token is set — never its value."
        token_prefix:
          type: string
          description: "Response-only (SEC-014). First 4 characters of the token, for operator identification only; cannot be used to reconstruct the token."
          example: "a1b2"
        enabled:
          type: boolean

    SavedCommand:
      type: object
      required: [name, command]
      properties:
        name:
          type: string
          description: Short name for the command
          example: "approve"
        command:
          type: string
          description: The command text to send
          example: "yes"

    FilterPattern:
      type: object
      properties:
        id:
          type: string
          description: Unique filter identifier
        pattern:
          type: string
          description: Regular expression to match against session output lines
          example: "^\\s*$"
        action:
          type: string
          description: Action to take on matching lines
          enum: [drop, highlight, alert]
          example: "drop"
        enabled:
          type: boolean
          default: true
        description:
          type: string
          description: Human-readable description of what this filter does
          example: "Drop blank lines"

    Alert:
      type: object
      properties:
        id:
          type: string
          description: Unique alert identifier
        message:
          type: string
          description: Alert message text
        level:
          type: string
          enum: [info, warning, error]
          example: "warning"
        read:
          type: boolean
          default: false
        created_at:
          type: string
          format: date-time

    ExitHookEntry:
      type: object
      description: A hook that fires when a monitored session exits or enters a failed/killed state.
      properties:
        id:
          type: string
        name:
          type: string
          description: Session name to monitor
        action:
          type: string
          enum: [restart, notify]
        notify_session:
          type: string
          description: "(notify only) session name to send the message to"
        notify_message:
          type: string
          description: "(notify only) message text"
        cooldown_seconds:
          type: integer
          description: Minimum seconds between firings (default 300)
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_fired_at:
          type: string
          format: date-time
          nullable: true

    QueueItem:
      type: object
      description: A single item in the work queue.
      properties:
        id:
          type: string
        role:
          type: string
        payload:
          type: object
          nullable: true
        state:
          type: string
          enum: [pending, claimed, complete, failed]
        claimed_by:
          type: string
          nullable: true
        lease_expiry:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true
        result:
          type: object
          nullable: true

    ResultEntry:
      type: object
      description: A named key/value entry in the result store.
      properties:
        name:
          type: string
        payload:
          type: object
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MergedMemberList:
      type: object
      description: "The merged-member decisions of one Automaton (automation_id set) or of all Automata (automation_id empty)."
      properties:
        automation_id: {type: string}
        count: {type: integer}
        merged_members:
          type: array
          items:
            $ref: "#/components/schemas/MergedMemberRow"
    MergedMemberRow:
      type: object
      properties:
        automation_id: {type: string}
        automation_name: {type: string}
        member: {type: string, description: "Member ID within the Automaton"}
        prd_id: {type: string}
        branch: {type: string}
        default_branch: {type: string, description: "The project default branch the member was proved merged into"}
        proving_commit: {type: string}
        policy: {type: string, enum: [completed, manual, block]}
        outcome: {type: string, enum: [advanced, blocked]}
        at: {type: string, format: date-time}
        note: {type: string}
    Automation:
      type: object
      description: |
        An Automation: a named graph of members advanced along outcome edges.
        A member is an Automaton, a nested Automation, or a fork/join control node.
        A fork starts its branches at once and its join waits for them. Once
        activated, the Automation advances itself as members finish.
      properties:
        id: {type: string, description: "Automation ID (8-hex)"}
        name: {type: string}
        description: {type: string}
        milestone: {type: boolean, description: "true marks the Automation as a milestone arc: when it completes, its release step is raised to major under the project's major_trigger setting"}
        status: {type: string, enum: [draft, active, paused, completed, blocked, cancelled]}
        entry_member_id: {type: string, description: "Member the Automation starts at"}
        current_member_id: {type: string, description: "Member the cursor is on for a linear Automation; see active_cursors for fork/join"}
        active_cursors:
          type: array
          description: "Member IDs currently in flight, sorted; one entry per live cursor"
          items: {type: string}
        members:
          type: array
          items:
            $ref: "#/components/schemas/AutomationMember"
        version: {type: integer, description: "Bumped on every write; send back as expected_version on update"}
        budget_policy: {$ref: "#/components/schemas/BudgetPolicy"}
        budget_state: {$ref: "#/components/schemas/BudgetState"}
        budget: {$ref: "#/components/schemas/BudgetView"}
        backend: {type: string, description: "Execution backend default for member runs"}
        model: {type: string, description: "Execution model default for member runs"}
        effort: {type: string, description: "Execution effort default for member runs"}
        verification_backend: {type: string, description: "Verifier backend default for member runs"}
        verification_model: {type: string, description: "Verifier model default for member runs"}
        merged_in_release: {type: string, description: "Shipped state: the release its work landed in"}
        merged_at: {type: string, format: date-time, description: "Shipped state: when it merged (RFC 3339)"}
        merge_commit: {type: string, description: "Shipped state: the default-branch merge commit — its being non-empty is what makes the record shipped; recording it never touches the status"}
        shipped_source: {type: string, enum: [merge_step, backfill], description: "Shipped state: where the record came from"}
        verification_effort: {type: string, description: "Verifier effort default for member runs"}
        project_dir: {type: string, description: "Working tree member runs operate in (informational)"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
        idle_since: {type: string, format: date-time, nullable: true, description: "Set when a member finished and no next member started yet"}
        decisions:
          type: array
          description: "Decision log entries; same shape as an Automaton's decision log"
          items: {$ref: "#/components/schemas/AutomatonDecisionLogEntry"}

    AutomationMember:
      type: object
      description: "One member of an Automation: a member Automaton, a nested Automation, or a fork/join control node, each with an outcome edge per result. Fork/join and nested members carry the kind fields below; Automaton members carry prd_id."
      properties:
        id: {type: string, description: "Stable member ID (8-hex, or operator-supplied)"}
        kind: {type: string, enum: [prd, automation, fork, join, pending_item], description: "Member kind; omitted means an Automaton member. pending_item waits for an Automaton to be attached"}
        pending_item_id: {type: string, description: "kind pending_item: the pending item this member waits on. An attached member keeps it as a note of where it came from"}
        prd_id: {type: string, description: "The member Automaton ID; Automaton members only"}
        automation_id: {type: string, description: "kind automation: the nested child Automation ID"}
        fork_members: {type: array, items: {type: string}, description: "kind fork: the branch member IDs started together (at least 2)"}
        join_members: {type: array, items: {type: string}, description: "kind join: the branch member IDs collected, equal to the paired fork's fork_members"}
        on_branch_failure: {type: string, enum: [all_must_succeed, any_one_is_enough, continue_anyway], description: "kind join only; omitted means all_must_succeed"}
        on_complete: {type: string, description: "Next member when this one completes; empty = the Automation completes"}
        on_blocked: {type: string, description: "Next member when this one is blocked; empty = the Automation is blocked"}
        on_failed: {type: string, description: "Next member when this one fails; empty = the Automation is blocked"}
        added_at: {type: string, format: date-time}
        added_by: {type: string, description: "Who enrolled it: operator (default) or an acting session/agent"}
        added_reason: {type: string}
        status: {type: string, enum: [pending, running, completed, blocked, failed, skipped, cancelled]}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
        outcome: {type: string, description: "Automaton status observed when this member last finished"}
        edge_taken: {type: string, description: "Edge followed at last finish: on_complete | on_blocked | on_failed | skip"}
        budget_policy: {$ref: "#/components/schemas/BudgetPolicy"}
        estimated_cost_usd: {type: number, description: "Declared expected cost of a prd member's Automaton; checked against the ceiling before it starts"}
      required: [id, status]

    BudgetPolicy:
      type: object
      description: |
        A budget guard-rail, applied per Automation or per member: a ceiling
        (dollar total, or a percentage of the window's allowance) and how it
        is enforced — pacing governs how quickly the ceiling may be consumed
        and on_breach what happens when it is hit.
      properties:
        ceiling_type: {type: string, enum: [dollar, allocation_pct]}
        ceiling_value: {type: number, description: "Dollar limit, or percent of the window's allowance"}
        window: {type: string, enum: [automation, day, week, month], description: "Scope the ceiling is measured over"}
        pacing: {type: string, enum: [none, even], description: "How the ceiling is spent: up front, or spread evenly across the window"}
        on_breach: {type: string, enum: [pause, block], description: "What happens when the ceiling is hit"}
        backend: {type: string, description: "When set, the ceiling applies only to spend on this backend"}
        allocation_estimate: {type: boolean, description: "Adds an estimated share of the plan allocation to the budget view; off by default and never used to pause or block"}
        peer_window: {type: array, items: {type: string}, description: "Federation peers whose usage counts toward the ceiling. Opt-in per peer; nothing confirms automatically that a peer shares the account"}
        reset_time: {type: string, description: "24h HH:MM at which a day, week or month window starts; default midnight"}
        reset_weekday: {type: string, description: "Week windows: monday to sunday; default monday"}
        reset_day: {type: integer, description: "Month windows: 1 to 28; default 1"}
        reset_zone: {type: string, description: "IANA zone the reset fields are read in; default is the daemon's local zone"}
      required: [ceiling_type, ceiling_value, window, on_breach]

    BudgetState:
      type: object
      description: "The stored record of the current budget breach or hold on an Automation. Written by the daemon; create and update ignore anything sent."
      properties:
        action: {type: string, enum: [paused, blocked, held], description: "paused: resumes by itself at resume_at; blocked: waits for the operator; held: a member is held back by pacing or its cost estimate and starts when the budget allows"}
        breached_at: {type: string, format: date-time}
        reason: {type: string}
        scope: {type: string, description: "automation, or member:<id>"}
        spent_usd: {type: number}
        ceiling_usd: {type: number}
        window: {type: string}
        resume_at: {type: string, format: date-time, nullable: true}
        reset_known: {type: boolean}
        reset_source: {type: string, enum: [window, rate_limit, ""]}

    BudgetAllocation:
      type: object
      description: "An estimated share of the plan allocation. Always an estimate; it is never used to pause or block."
      properties:
        allocation_pct: {type: number}
        estimated: {type: boolean, description: "Always true"}
        allocation_usd: {type: number}
        plan_tier: {type: string}
        basis: {type: string, description: "How the figure was worked out"}

    BudgetPeerLine:
      type: object
      description: "One federation peer in a budget view: whether its usage is counted toward the ceiling, and why not when it is not."
      properties:
        peer: {type: string}
        spend_usd: {type: number}
        counted: {type: boolean}
        reason: {type: string, description: "Why the peer is not counted"}
        note: {type: string, description: "On what basis the peer is counted; states that nothing confirms automatically that the peer shares the account"}

    BudgetView:
      type: object
      description: |
        The budget position of an Automation, computed on every read and never
        stored. It describes the policy with the least room left right now:
        the Automation's own, or the override of the member that is next to
        start. Dollar figures are actual spend; the allocation estimate is an
        estimate.
      properties:
        scope: {type: string, description: "automation, or member:<id>"}
        ceiling_type: {type: string, enum: [dollar, allocation_pct]}
        ceiling_usd: {type: number, description: "0 for an allocation_pct policy, which has no dollar ceiling"}
        spent_usd: {type: number, description: "Spend in the window, including opted-in peers"}
        remaining_usd: {type: number}
        window: {type: string, enum: [automation, day, week, month]}
        window_start: {type: string, format: date-time}
        window_end: {type: string, format: date-time, description: "Absent for the lifetime window (automation)"}
        pacing: {type: string, enum: [none, even]}
        pacing_allowed_usd: {type: number, description: "With even pacing, the spend allowed so far in the window"}
        on_breach: {type: string, enum: [pause, block]}
        ceiling_reached: {type: boolean, description: "True when the dollar ceiling stops members from starting"}
        hold: {type: string, enum: [pacing, estimate], description: "Set while a member is held back without a breach"}
        hold_reason: {type: string}
        reset_at: {type: string, format: date-time, description: "When the window frees up again"}
        reset_known: {type: boolean, description: "True when the daemon can act on reset_at by itself"}
        reset_source: {type: string, enum: [window, rate_limit], description: "window: a window the daemon defines itself; rate_limit: a reset time read from a rate-limit message"}
        state: {$ref: "#/components/schemas/BudgetState"}
        allocation_estimate: {$ref: "#/components/schemas/BudgetAllocation"}
        peers: {type: array, items: {$ref: "#/components/schemas/BudgetPeerLine"}}
        peer_spend_usd: {type: number}
        peer_basis: {type: string, description: "Present when peers are opted in: states that nothing confirms automatically that they share the account"}
        peer_note: {type: string, description: "Why named peers could not be counted"}
        note: {type: string, description: "Set when the policy is an estimate only"}
      required: [scope, ceiling_usd, spent_usd, remaining_usd, ceiling_reached, reset_known]

    BudgetSetRequest:
      type: object
      description: "Request body for POST /api/automations/{id}/set_budget."
      required: [expected_version]
      properties:
        expected_version: {type: integer, description: "The `version` you last observed; a stale value is rejected with 409"}
        member_id: {type: string, description: "Empty: the Automation's own policy. Set: that member's own override"}
        ceiling_type: {type: string, enum: [dollar, allocation_pct]}
        ceiling_value: {type: number, description: "Dollar limit, or percent for an allocation_pct estimate"}
        window: {type: string, enum: [automation, day, week, month]}
        pacing: {type: string, enum: [none, even]}
        on_breach: {type: string, enum: [pause, block]}
        backend: {type: string, description: "When set, only spend on this backend counts"}
        allocation_estimate: {type: boolean, description: "Show an estimated share of the plan allocation; off by default and never used to pause or block"}
        peer_window: {type: array, items: {type: string}, description: "Federation peers whose usage counts toward the ceiling (opt-in per peer)"}
        reset_time: {type: string, description: "24h HH:MM at which a day, week or month window starts"}
        reset_weekday: {type: string, description: "Week windows: monday to sunday"}
        reset_day: {type: integer, description: "Month windows: 1 to 28"}
        reset_zone: {type: string, description: "IANA zone the reset fields are read in; default is the daemon's local zone"}
        estimated_cost_usd: {type: number, description: "Members only: the expected cost of the member's Automaton, checked against the ceiling before it starts; 0 removes it"}
        clear: {type: boolean, description: "Remove the policy (or the member override); cannot be combined with other budget fields"}
        actor: {type: string, description: "operator (default) or the acting session/agent; recorded in the audit log"}
        reason: {type: string, description: "Why; recorded in the audit log"}


    AutomationCreate:
      type: object
      description: Request body for POST /api/automations (create a draft Automation).
      required: [members]
      properties:
        name: {type: string}
        description: {type: string}
        milestone: {type: boolean, description: "Optional. true marks the Automation as a milestone arc. On create omitted means false; on update omitted keeps the stored value."}
        entry_member_id: {type: string, description: "Entry member ID; when omitted, the first members entry is the entry"}
        members:
          type: array
          items:
            $ref: "#/components/schemas/AutomationMember"
        budget_policy: {$ref: "#/components/schemas/BudgetPolicy"}
        project_dir: {type: string}
        backend: {type: string}
        model: {type: string}
        effort: {type: string}
        verification_backend: {type: string}
        verification_model: {type: string}
        verification_effort: {type: string}
        actor: {type: string, description: "operator (default) or the acting session/agent; recorded in the audit log"}
        reason: {type: string, description: "Why this Automation is being created; recorded in the audit log"}

    AutomationUpdate:
      allOf:
        - $ref: "#/components/schemas/AutomationCreate"
        - type: object
          required: [expected_version]
          properties:
            expected_version: {type: integer, description: "The `version` you last observed; the write is rejected with 409 if it is stale"}

    FailureEscalationPolicy:
      description: "One level of the failure escalation policy. A missing or null field inherits from the next level up (task, then Automaton, then the daemon default)."
      type: object
      properties:
        enabled: {type: boolean, description: "Turns failure escalation on. False restores the older retry-then-fail behaviour."}
        max_failures: {type: integer, minimum: 1, description: "Failed attempts after which the task is held for review. Default 3."}
        steps:
          type: array
          maxItems: 8
          description: "The ladder of workers to try, in order. An empty list inherits."
          items: {$ref: "#/components/schemas/FailureEscalationStep"}
    FailureEscalationStep:
      description: "One rung of the ladder. The step covers its attempts failed attempts; the last step covers every remaining attempt."
      type: object
      properties:
        backend: {type: string, description: "Worker backend. Empty means the task's normally resolved worker."}
        model: {type: string, description: "Worker model. Needs a backend."}
        effort: {type: string, description: "Effort level: low, medium, high, max, quick, normal or thorough. Empty inherits the task's effort."}
        attempts: {type: integer, minimum: 1, description: "Failed attempts this step covers. Default 1."}
    ProjectPolicy:
      description: "The per-project policy tier (`projects.<name>.policy`), sitting between the daemon-wide autonomous defaults and the per-Automaton overrides. Every key is optional: an unset key inherits the daemon tier, and a set key must hold a value the field knows, so a wrong value fails validation with the field named rather than silently meaning its neighbour."
      type: object
      properties:
        plan_coverage_check: {type: string, enum: [off, warn, block], description: "Plan coverage check mode"}
        plan_coverage_min_ratio: {type: number, exclusiveMinimum: 0, maximum: 1, description: "Minimum plan-coverage ratio; 1 requires full coverage"}
        plan_review_mode: {type: string, enum: [off, warn, block], description: "Plan review mode"}
        scope_lint: {type: string, enum: [off, warn, enforce], description: "Scope-lint mode"}
        retry_policy:
          type: object
          description: "Per-category auto-retry budget (infra, content, scope, policy); a category outside that set is a validation error. Non-nil replaces the daemon's map wholesale."
          additionalProperties: {type: integer, minimum: 0}
        retry_ceiling_total: {type: integer, minimum: 0, description: "Caps auto-retries summed across a whole Automaton's lifecycle"}
        auto_fix_retries: {type: integer, minimum: 0, description: "Per-verifier-failure re-prompt budget"}
        infra_retry_escalate_after: {type: integer, minimum: 0, description: "Infra-failure count after which a task stops auto-retrying and is held"}
        failure_escalation: {$ref: "#/components/schemas/FailureEscalationPolicy"}
        default_auto_pr: {type: boolean, description: "Turns auto-PR on or off for this project's Automata"}
        max_concurrent_tasks: {type: integer, minimum: 1}
        verifier_min_free_mem_mb: {type: integer, minimum: 0, description: "Free GPU MB a node must keep with extra verifier slots running; gates verifier caps above 1 and verifier_slots writes above 1. Unset = 1024; 0 turns the check off; negative is a validation error."}
        verifier_headroom_max_age_hours: {type: integer, minimum: 0, description: "How old, in hours, a headroom measurement may be and still count as fresh for the verifier cap gates. 0 or unset = the default of 24 hours; negative is a validation error."}
        plan_tier_max_inflight:
          type: object
          description: "Per-plan-tier inflight caps; a negative budget is a validation error"
          additionalProperties: {type: integer, minimum: 0}
        lane_fill_gpu_lanes: {type: integer, minimum: 0, description: "0 turns the GPU lane kind off"}
        lane_fill_claude_lanes: {type: integer, minimum: 0, description: "0 turns the Claude lane kind off"}
        uncommitted_work_policy: {type: string, enum: [hold, warn, off], description: "What the post-verification uncommitted-work check does"}
        uncommitted_work_scope: {type: string, enum: [task_files, worktree], description: "Which files that check covers"}
        burn_guard_ask_on_change: {type: boolean, description: "True asks one open question per guard-rung change, false alerts only"}
        parallel_read_only_tasks: {type: boolean, description: "Read-only tasks skip the tree lock"}
        parallel_worktree_per_task: {type: boolean, description: "Each parallel task runs in its own worktree"}
    ReviewNeededEntry:
      description: "A task held for operator review, as listed in an Automaton summary. Only the identity, the failure count and the last worker are included, never the spec or the attempt report."
      type: object
      required: [task_id, story_id, failure_count, held_at]
      properties:
        task_id: {type: string}
        task_title: {type: string}
        story_id: {type: string}
        failure_count: {type: integer, description: "Failed attempts since the last operator action."}
        last_backend: {type: string, description: "Worker backend of the last attempt."}
        last_model: {type: string, description: "Worker model of the last attempt."}
        held_at: {type: string, format: date-time}
    TagRegistry:
      description: |
        The registry object on GET /api/autonomous/tags. It describes how this daemon
        takes part in the shared tag registry. A daemon is standalone when no keeper
        is configured (it keeps its own tags and syncs with nobody), the keeper when
        autonomous.tags.registry_keeper names this daemon, and a peer when it names
        another daemon. A peer keeps a cached copy of the keeper's tags, so it can
        still show them while the keeper is unreachable.
      type: object
      properties:
        role: {type: string, enum: [standalone, keeper, peer], description: "This daemon's role in the registry"}
        keeper: {type: string, description: "The keeper's peer name. Empty when standalone."}
        stale: {type: boolean, description: "True on a peer whose keeper has not answered since last_synced_at. The tags shown are then the last copy."}
        last_synced_at: {type: string, format: date-time, description: "When the keeper last answered with a snapshot. Omitted before the first answer."}
        revision: {type: integer, description: "The registry revision this daemon holds"}
        pending_sync_count: {type: integer, description: "Tags a peer created while the keeper was unreachable and that the keeper has not yet received"}
        notes:
          type: array
          description: "Merge and removed-on-keeper notes not yet dismissed on this daemon. Always an array."
          items: {$ref: "#/components/schemas/TagRegistryNote"}
        last_error: {type: string, description: "The last sync error. Empty when the last sync worked."}
    TagRegistryTag:
      description: "One tag of the shared registry, as this daemon holds it."
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        parent_id: {type: string, description: "Omitted for a root tag"}
        color: {type: string}
        description: {type: string}
        origin_node: {type: string, description: "Name of the daemon that created the tag"}
        pending_sync: {type: boolean, description: "True on a tag a peer created while the keeper was unreachable. Omitted otherwise."}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    TagRegistryNote:
      description: "A visible record of a merge or of a removal on the keeper. It stays until it is dismissed on this daemon."
      type: object
      properties:
        id: {type: string, description: "Note ID, used by the dismiss route"}
        kind:
          type: string
          enum: [merged, removed_on_keeper]
          description: "merged: a pending tag was merged into a keeper tag. removed_on_keeper: the keeper deleted a tag this daemon still had assignments on."
        name: {type: string}
        parent_path: {type: string, description: "Path of the parent tag, when there is one"}
        kept_id: {type: string, description: "merged: the keeper tag that was kept"}
        replaced_id: {type: string, description: "merged: the pending tag that was replaced"}
        tag_id: {type: string, description: "removed_on_keeper: the deleted tag"}
        nodes: {type: array, items: {type: string}, description: "Nodes the change touched"}
        merged_at: {type: string, format: date-time}
    TagRegistrySnapshot:
      description: "The keeper's registry, as a peer pulls it (GET /api/autonomous/tags/registry)."
      type: object
      properties:
        revision: {type: integer}
        tags: {type: array, items: {$ref: "#/components/schemas/TagRegistryTag"}}
        notes: {type: array, items: {$ref: "#/components/schemas/TagRegistryNote"}}
    TagRegistryWrite:
      description: "One edit a peer forwards to the keeper (POST /api/autonomous/tags/registry/write)."
      type: object
      required: [kind, tag_id, base_revision]
      properties:
        kind: {type: string, enum: [create, rename, reparent, recolor, describe, delete]}
        tag_id: {type: string, description: "The tag the edit applies to. For a create, the new tag's ID."}
        base_revision: {type: integer, description: "The registry revision the writer had when it made the edit. The keeper compares it with the last change to each field."}
        name: {type: string}
        parent_id: {type: string}
        color: {type: string}
        description: {type: string}
        origin_node: {type: string, description: "Name of the daemon that made the edit"}
        pending: {type: boolean, description: "True for a create made while the keeper was unreachable. A same-name tag under the same parent then merges into the keeper's tag."}
    TagRegistryWriteResult:
      description: "What the keeper returns for a forwarded write."
      type: object
      properties:
        tag:
          description: "The keeper's value after the write, or the kept tag of a merge. Empty for a delete."
          allOf: [{$ref: "#/components/schemas/TagRegistryTag"}]
        revision: {type: integer}
        conflict: {type: boolean, description: "True when the keeper kept its own value for a field the writer also edited. Omitted otherwise."}
        conflict_field: {type: string, enum: [name, parent, color, description], description: "The field the conflict is about"}
        merge:
          description: "Set when a pending create merged into the keeper tag named in tag"
          allOf: [{$ref: "#/components/schemas/TagRegistryNote"}]

    QuestionOption:
      description: "One named option of an operator question. A question must carry 2 to 20 options with unique ids."
      type: object
      required: [id, label]
      properties:
        id: {type: string, description: "Stable option id; referenced by `default`, `recommendation.option_id` and an answer's `chosen_option_id`."}
        label: {type: string, maxLength: 200, description: "What the option is. <= 200 bytes."}
        tradeoffs: {type: string, maxLength: 1000, description: "What the option buys and costs, optional. <= 1000 bytes."}

    DecisionRecordOption:
      type: object
      required: [id, label]
      properties:
        id: {type: string, description: "Unique within the record; up to 64 bytes"}
        label: {type: string, description: A short name for the choice}
        tradeoff: {type: string, description: "One line of cost and risk"}
    DecisionRecordRecommendation:
      type: object
      required: [option_id, reason]
      properties:
        option_id: {type: string, description: Must be one of the options}
        reason: {type: string}
    DecisionRecordLinks:
      type: object
      description: What the record is about. Every part is optional.
      properties:
        doc: {type: string, description: "A path relative to the document root; no leading slash and no `..` segment"}
        automaton: {type: string, description: An Automaton id}
        registry_row: {type: string, description: A registry row key}
    DecisionRecordContent:
      type: object
      description: |
        The content of a decision record, as POST and PUT take it. Fields outside this
        set are refused with 400.
      additionalProperties: false
      required: [title, situation, deciding, options, default]
      properties:
        label: {type: string, description: "A short word or two a person would recognise; defaults to `decision`"}
        title: {type: string, description: A plain-language title}
        situation: {type: string, description: What is going on, in full sentences}
        deciding: {type: string, description: What exactly is being decided}
        options:
          type: array
          minItems: 2
          maxItems: 20
          items: {$ref: "#/components/schemas/DecisionRecordOption"}
        recommendation: {$ref: "#/components/schemas/DecisionRecordRecommendation"}
        default: {type: string, description: "An option id or `hold`: the fallback when the decision is never answered"}
        links: {$ref: "#/components/schemas/DecisionRecordLinks"}
    DecisionRecordAnswer:
      type: object
      description: The answer applied to the record.
      properties:
        answer_id: {type: string}
        chosen_option_id: {type: string}
        quote: {type: string, description: "The operator's words exactly as stored; never trimmed, cut or re-cased"}
        actor: {type: string}
        surface: {type: string, description: The surface the answer came from}
        answered_at: {type: string, format: date-time}
    DecisionRecordDocChange:
      type: object
      description: What was done, or would be done, to the linked document after the answer.
      properties:
        mode: {type: string, description: "The `autonomous.decisions.doc_status_mode` in force: off, report or on"}
        path: {type: string}
        line: {type: integer}
        before: {type: string}
        after: {type: string}
        diff: {type: string}
        status: {type: string, enum: [reported, applied, unchanged, no_match, ambiguous, error]}
        at: {type: string, format: date-time}
    DecisionRecordFollowUp:
      type: object
      description: The configured follow-up the operator asked for with the answer.
      properties:
        requested: {type: boolean}
        name: {type: string, description: "The entry of `autonomous.decisions.follow_ups` that was named"}
        kind: {type: string, description: "`start_template` or `open_automaton`, filled when it runs"}
        target: {type: string}
        status: {type: string, description: "done, skipped or error"}
        result: {type: string, description: One line saying what happened}
        at: {type: string, format: date-time}
    DecisionRecord:
      type: object
      description: |
        A decision record as the routes return it: the content fields, the
        bookkeeping, and the state of its question.
      properties:
        id: {type: string, description: "`dr-` followed by 20 lowercase hex characters"}
        label: {type: string}
        title: {type: string}
        situation: {type: string}
        deciding: {type: string}
        options:
          type: array
          items: {$ref: "#/components/schemas/DecisionRecordOption"}
        recommendation: {$ref: "#/components/schemas/DecisionRecordRecommendation"}
        default: {type: string}
        links: {$ref: "#/components/schemas/DecisionRecordLinks"}
        state: {type: string, enum: [open, answered, withdrawn]}
        question_id: {type: string, description: The operator question raised from the record}
        question_state: {type: string, enum: [open, answered, withdrawn, expired], description: The state of that question}
        source: {type: string, enum: [rest, mcp, cli, comm, file], description: How the record arrived}
        source_ref: {type: string, description: "The file name for a record that came from the decision folder"}
        content_hash: {type: string, description: Lowercase hex sha256 of the content fields}
        answer: {$ref: "#/components/schemas/DecisionRecordAnswer"}
        doc_change: {$ref: "#/components/schemas/DecisionRecordDocChange"}
        follow_up: {$ref: "#/components/schemas/DecisionRecordFollowUp"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DecisionRecordFinding:
      type: object
      description: One clarity finding.
      properties:
        code: {type: string}
        message: {type: string, description: A plain sentence saying what to fix}
    DecisionRecordResponse:
      type: object
      required: [record, question_id]
      properties:
        record: {$ref: "#/components/schemas/DecisionRecord"}
        question_id: {type: string}
        warnings:
          type: array
          description: "The clarity findings in warn mode; an empty array when there are none. Present on create and update only"
          items: {$ref: "#/components/schemas/DecisionRecordFinding"}
    DecisionRecordProblem:
      type: object
      properties:
        file: {type: string, description: The file name; empty when the problem is with the folder itself}
        message: {type: string}
    DecisionRecordFolder:
      type: object
      description: The state of the decision folder watch.
      required: [enabled, path, files_seen, errors, last_scan]
      properties:
        enabled: {type: boolean, description: True when a folder is configured and both switches are on}
        path: {type: string, description: "The configured folder; empty when the watch is off"}
        files_seen: {type: integer, description: Files the last scan matched}
        errors:
          type: array
          description: Files the last scan could not use, each with a plain message
          items: {$ref: "#/components/schemas/DecisionRecordProblem"}
        last_scan: {type: string, format: date-time, nullable: true, description: Null before the first scan}
    DecisionRecordList:
      type: object
      required: [decision_records, folder]
      properties:
        decision_records:
          type: array
          description: Newest first; empty when nothing matches
          items: {$ref: "#/components/schemas/DecisionRecord"}
        folder: {$ref: "#/components/schemas/DecisionRecordFolder"}
    DecisionRecordWithdraw:
      type: object
      additionalProperties: false
      properties:
        reason: {type: string, description: Free text kept with the withdrawal}
    DecisionRecordError:
      type: object
      properties:
        error: {type: string}
    DecisionRecordRefused:
      type: object
      properties:
        error: {type: string}
        findings:
          type: array
          items: {$ref: "#/components/schemas/DecisionRecordFinding"}
    Question:
      description: |
        One operator decision, recorded when raised and kept until answered or
        withdrawn (no deadline). The kind of question is the `label`, not a
        different structure; the shipped labels are decision, design review,
        approval and information, but users may add their own. `default` is
        the declared fallback - always an option or `hold`, never silent.
      type: object
      required: [id, label, text, options, default, context, asker_kind, state, created_at]
      properties:
        id: {type: string}
        label: {type: string, description: "The kind of question; custom labels are accepted. Defaults to `decision`."}
        asked_by: {type: string, description: "The asker of record."}
        asker_kind: {type: string, enum: [session, supervisor, operator, system], description: "Who asked; defaults to `operator`."}
        session_id: {type: string, description: "Present when the asker is a session."}
        context: {type: string, enum: [none, prd, task, proposal, registry_row], description: "Where the decision belongs; the matching link must be present, `none` none of them."}
        prd_id: {type: string, description: "The Automaton id, for context `prd`."}
        task_id: {type: string, description: "The task id, for context `task`."}
        proposal_path: {type: string, description: "A repository-relative path into the working tree, for context `proposal`."}
        registry_row_key: {type: string, description: "The registry row key, for context `registry_row`."}
        text: {type: string, maxLength: 8192, description: "The decision in one line. <= 8192 bytes."}
        options:
          type: array
          minItems: 2
          maxItems: 20
          items: {$ref: "#/components/schemas/QuestionOption"}
        recommendation:
          type: object
          description: "Optional, the asker's own preference."
          properties:
            option_id: {type: string, description: "Must exist among the options."}
            rationale: {type: string, maxLength: 1000}
        default: {type: string, description: "An option id or `hold` - the declared fallback when the question is never answered."}
        risk: {type: string, enum: [normal, low], default: normal}
        priority: {type: string, enum: [normal, high], description: "How urgently an operator should act; omitted means `normal` (separate from `risk`, which says how dangerous a wrong answer is). A `high` raise additionally lands in the alert store while the channel is on."}
        return_path: {type: boolean, default: false, description: "This question opted in to the single `DATAWATCH_ANSWER:` line delivered to its `session_id` when the answer is recorded (needs `autonomous.questions.return_path` on). Default no: the return path is the events plus polling GET."}
        blocking: {type: boolean, description: "The asker said it cannot go on until the question is decided (the worker marker's `blocked`). While such a question is open its task is parked with the wait reason `await_decision: <question id>`. A REST raise is never blocking. Left out when false."}
        source: {type: string, enum: [marker, rest], description: "How the question arrived: `marker` (a worker's DATAWATCH_QUESTION: line, raised only while `autonomous.questions.worker_marker` and `autonomous.questions.enabled` are on) or `rest` (POST /api/questions). Left out on a record written before the field existed. A `marker` question carries a `session_id` and a `source_line_sha256`."}
        source_line_sha256: {type: string, pattern: "^[0-9a-f]{64}$", description: "Lowercase hex SHA-256 of the marker line a worker question came from. The dedupe key: the same line read again while its question is open raises nothing. Never the line text. Left out when empty."}
        decision_record_id: {type: string, description: "The decision record this question was raised from (`dr-` followed by hex). Left out for a question with no record. See /api/autonomous/decision-records."}
        state: {type: string, enum: [open, answered, withdrawn, expired]}
        created_at: {type: string, format: date-time}

    QuestionRaise:
      description: "The POST /api/questions body. The required shape is `text`, 2 to 20 options with unique ids, a named `default` (an option or `hold`) and a `context` (one of none, prd, task, proposal, registry_row) with its matching link."
      type: object
      required: [text, options, default, context]
      properties:
        label: {type: string, description: "Defaults to `decision`."}
        asked_by: {type: string, description: "Defaults to the caller."}
        asker_kind: {type: string, enum: [session, supervisor, operator, system], description: "Defaults to `operator`."}
        session_id: {type: string}
        context: {type: string, description: "One of none, prd, task, proposal, registry_row; an omitted context is not defaulted."}
        prd_id: {type: string}
        task_id: {type: string}
        proposal_path: {type: string, description: "Must be repository-relative (no leading /, no .. segment)."}
        registry_row_key: {type: string}
        text: {type: string, maxLength: 8192, description: "The decision in one line. <= 8192 bytes."}
        options:
          type: array
          minItems: 2
          maxItems: 20
          items: {$ref: "#/components/schemas/QuestionOption"}
        recommendation:
          type: object
          properties:
            option_id: {type: string, description: "Must exist among the options."}
            rationale: {type: string, maxLength: 1000}
        default: {type: string, description: "An option id of this question or `hold` - never silent."}
        risk: {type: string, enum: [normal, low], description: "Defaults to `normal`."}
        priority: {type: string, enum: [normal, high], description: "Defaults to `normal` (empty accepted). A `high` raise additionally lands in the alert store while the channel is on; anything else is a 400 naming the field."}
        return_path: {type: boolean, default: false, description: "Opt this one question in to the single `DATAWATCH_ANSWER:` line into its `session_id` at answer time (needs `autonomous.questions.return_path` on). Default false - the default return path is the events plus polling GET /api/questions/{id}."}

    Answer:
      description: |
        One recorded answer, immutable. A changed mind is a new answer whose
        `supersedes` names the replaced answer; superseded answers stay in the
        log and are derived on read, never deleted. The quote is stored
        exactly as received, with `quote_sha256` (the SHA-256 of its exact
        bytes) recorded alongside.
      type: object
      required: [id, question_id, actor, surface, created_at]
      properties:
        id: {type: string}
        question_id: {type: string}
        actor: {type: string, description: "The answering party of record."}
        surface: {type: string, description: "pwa, android, ios, cli, rest, mcp, or `comm:<channel name>`."}
        chosen_option_id: {type: string, description: "Present when the answer picked an option."}
        quote: {type: string, description: "The operator's own words, exactly as received. <= 16 KiB; empty when absent."}
        quote_sha256: {type: string, description: "Lowercase hex SHA-256 of the quote's exact bytes; empty when there is no quote."}
        supersedes: {type: string, description: "The id of the answer being replaced; present only on an answer that replaces another."}
        source_message_id: {type: string, description: "Present when the answer came over a comm channel."}
        created_at: {type: string, format: date-time}

    AnswerView:
      description: "An answer plus its derived superseded state, as returned by the answer log."
      allOf:
        - $ref: "#/components/schemas/Answer"
        - type: object
          properties:
            superseded: {type: boolean, description: "True when a later answer in the log names this one as the one it replaces."}
            superseded_by: {type: string, description: "The id of the answer that replaced it; present when superseded is true."}

    QuestionAnswer:
      description: "The POST /api/questions/{id}/answer body. At least one of chosen_option_id and a non-blank quote is required."
      type: object
      properties:
        chosen_option_id: {type: string, description: "Must name an option of the question."}
        quote: {type: string, description: "The operator's own words, stored exactly as received. <= 16384 bytes."}
        supersedes: {type: string, description: "The id of the answer being replaced (the current answer of an answered question). On an open question a supersedes is a 409 — there is no current answer to replace."}
        surface: {type: string, description: "pwa, android, ios, cli, rest, mcp, or `comm:<channel name>`. Defaults to `rest`; `system` is refused."}
        source_message_id: {type: string}
        actor: {type: string, description: "Defaults to the caller."}
        follow_up: {type: string, description: "The name of one entry of `autonomous.decisions.follow_ups`, to run once the answer is applied to the decision record. Needs a question that belongs to a decision record; an unknown name, an empty list of follow-ups or a question with no record is a 400 naming the problem and nothing is stored, and a daemon with no follow-ups wired answers 503."}

    QuestionWithdraw:
      description: "The POST /api/questions/{id}/withdraw body. Both fields optional."
      type: object
      properties:
        reason: {type: string, description: "Free text for the log."}
        actor: {type: string, description: "Defaults to the caller."}

    QuestionError:
      description: "The error body of the JSON-answering question endpoints (answer, withdraw, answer log). A secret refusal is the same object with `reason` and `suggestion` added — see QuestionSecretRefusal."
      type: object
      required: [error]
      properties:
        error: {type: string, description: "A human-readable reason, e.g. `answer carries neither an option nor non-blank text`, `answer quote is not valid UTF-8`, `answer must name the answer it supersedes`, `answer supersedes the wrong target`, `question is not open`."}

    QuestionSecretRefusal:
      description: "The 422 body of POST /api/questions/{id}/answer when an answer's text looks like a secret. Nothing from the submitted text is echoed: `error` is a fixed phrase and `suggestion` the two fixed safe routes. The matched rule's name is not in this body — it is recorded on the `question_answer_refused` audit entry."
      type: object
      required: [error, reason, suggestion]
      properties:
        error:
          type: string
          description: "Fixed text containing the phrase `matched: secret pattern` and the two safe routes; it does not name the specific rule that matched."
        reason:
          type: string
          enum: [secret_detected]
          description: "Always `secret_detected`."
        suggestion:
          type: array
          items: {type: string}
          description: "The two safe routes: store the secret in the datawatch secrets store and refer to it as ${secret:name}; or save it on the filesystem and point the session at the file."

    ShippedState:
      description: |
        The four fields that make up the shipped record, present on both the
        Automaton and the Automation. `merge_commit` — the merge commit on
        the default branch — is the only required part: it is its being
        non-empty that makes the record **shipped**, and shipped is
        orthogonal to status, because recording a shipped record never changes
        the status, and a cancelled Automaton can be shipped. While the
        shipped state is on and separately counted, the record goes into the
        **shipped** bucket of the counts regardless of the status it carries;
        the status itself keeps its stored value.
      type: object
      properties:
        merged_in_release:
          type: string
          description: "The release the work landed in (for example `v9.3.0`). Absent when unset"
        merged_at:
          type: string
          format: date-time
          description: "When it merged (RFC 3339). Absent when unset"
        merge_commit:
          type: string
          description: "The default-branch merge commit — non-empty makes the record shipped"
        shipped_source:
          type: string
          enum: [merge_step, backfill]
          description: "Where the record came from: the merge step or a backfill pass"

    ShippedRecordRequest:
      description: |
        Body of POST /api/autonomous/prds/{id}/shipped and of POST
        /api/automations/{id}/shipped. `merge_commit` is required and is
        trimmed — an empty or whitespace-only value is a 400 — and `source`
        must be one of the two known names; `merged_at` is RFC 3339 or absent
        (the zero time), and `merged_in_release` is optional.
      type: object
      required: [merge_commit, source]
      properties:
        merged_in_release: {type: string, description: "The release the work landed in"}
        merged_at: {type: string, format: date-time, description: "When it merged (RFC 3339). absent means unset"}
        merge_commit: {type: string, description: "The default-branch merge commit — required, non-empty after trimming"}
        source:
          type: string
          enum: [merge_step, backfill]
          description: "`merge_step` (recorded as the work landed) or `backfill` (recovered afterwards)"

    ShippedCountsResponse:
      description: |
        GET /api/autonomous/shipped/counts: one count per displayed status of
        both stores, under the in-force shipped-state surface (see
        `ShippedState`), plus the four in-force settings.
      type: object
      required: [prds, automations, settings]
      properties:
        prds:
          type: object
          additionalProperties: {type: integer}
          description: "One entry per displayed status in the stored Automaton store (shipped included when it is on and counted separately)"
        automations:
          type: object
          additionalProperties: {type: integer}
          description: "One entry per displayed status in the stored Automation store (shipped included when it is on and counted separately)"
        settings:
          type: object
          required: [enabled, show_chip, filter_default, count_separately]
          description: "The in-force `autonomous.shipped` surface"
          properties:
            enabled: {type: boolean}
            show_chip: {type: boolean}
            filter_default: {type: string, enum: [all, shipped, unshipped]}
            count_separately: {type: boolean}

    ShippedBackfillReport:
      description: |
        The accounting of one shipped-state backfill pass: the body of POST
        /api/autonomous/shipped/backfill and of `datawatch autonomous shipped
        backfill` (with `--json`).
      type: object
      required: [prds_scanned, prds_marked, prds_would_mark_cancelled, prds_already_marked, automations_marked, left_cancelled]
      properties:
        prds_scanned: {type: integer, description: "The Automata in the store the pass looked at"}
        prds_marked: {type: integer, description: "Automata that carried no shipped state and are marked by the pass — the dry run counts what it would mark, so it and the real run report the same number"}
        prds_would_mark_cancelled: {type: integer, description: "Those marked (or, in a dry run, that would be marked) whose stored status is cancelled: a cancelled Automaton whose merge commit is on the branch is marked shipped while staying cancelled. The dry run and the real run report the same number"}
        prds_already_marked: {type: integer, description: "Automata that already carried shipped state and were left alone"}
        automations_marked: {type: integer, description: "Automations the pass marked shipped"}
        left_cancelled: {type: integer, description: "Cancelled Automata whose work never merged — neither already shipped before, nor marked in this pass; they stay plain cancelled"}
        unmatched_ids:
          type: array
          items: {type: string}
          description: "8-hex ids the history names but the store does not hold, deduplicated and sorted. Absent when none"
        errors:
          type: array
          items: {type: string}
          description: "Per-record failures skipped without stopping the pass. Absent when none"
    BurnGuardConfig:
      type: object
      description: |
        The live `usage.burn_guard` settings, as `GET /api/usage/burn-guard/config`
        returns them. Writes are a flat partial map over the same bare keys; one
        unknown key or invalid value rejects the whole body and nothing is stored.
      additionalProperties: true
      properties:
        enabled: {type: boolean, description: "Turn the guard on. Default true"}
        interval_minutes: {type: integer, description: "How often the guard evaluates, in minutes, 1 to 1440. Default 60"}
        margin_points: {type: number, description: "Points the projection may run over the pace line before the guard acts, 0 to 50. Default 2"}
        ladder:
          type: array
          items: {type: string, enum: [lower_inflight, route_pi_prompt, hold_claude]}
          description: "Ordered rungs applied while over the line. Default: all three in that order"
        step_back: {type: boolean, description: "Undo rungs in reverse once the projection is back under the line. Default true"}
        ask_on_change:
          type: boolean
          description: |
            How the guard reaches out about a change. false (default): one alert
            per change and no question. true: at most one open question per
            change — a new change withdraws the open question, a step that
            changed no setting asks nothing, and stale guard questions are
            withdrawn at daemon start.
        cache_write_points_per_million: {type: number, description: "Cache token prices in weekly points per million tokens, above 0 and at most 1000. Default 0.373"}
        cache_read_points_per_million: {type: number, description: "Cache token prices in weekly points per million tokens, above 0 and at most 1000. Default 0.0069"}
        refit_on_reading: {type: boolean, description: "Refit the cost model whenever a new usage reading arrives. Default true"}
        effort_ceiling:
          type: object
          description: "Task kind to ceiling (low, medium, high, cheaper_backend); set per Automation, not here"
          additionalProperties: {type: string, enum: [low, medium, high, cheaper_backend]}
        retry_limit_claude: {type: integer, description: "Most retries of one task on Claude, 0 to 20. Default 2"}
        max_projection_gap_points: {type: number, minimum: 0, maximum: 100, description: "Largest allowed gap in points between the two usage projections before the guard stops trusting the comparison, 0 to 100; 0 never compares. Default 25"}
