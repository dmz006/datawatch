  # ─── Automations — stored orchestration records over member Automata ────
  #
  # An Automation is a named graph of member Automata (PRDs), run one at a
  # time by a single cursor. Each member names at most one next member per
  # outcome (on_complete / on_blocked / on_failed); an empty edge ends the
  # Automation in the status that outcome implies. For now these are stored
  # records only — nothing on the server advances from one member Automaton
  # to the next automatically.
  /api/automations:
    get:
      summary: List Automations
      description: |
        All Automation records, one object each, in store order. A record
        with a budget policy also carries a computed `budget` view; the view
        is worked out on each read and is never stored. Each record also carries
        a computed `tags` array: the union of the tag IDs of its member Automata,
        sorted. It is read-only and is never stored on the Automation.
        An empty store returns `[]`, never `null`. The response carries an
        `ETag`; a matching `If-None-Match` returns 304.
      operationId: automationsList
      tags: [Automations]
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
        - name: shipped
          in: query
          required: false
          schema:
            type: string
            enum: [all, shipped, unshipped]
            default: all
          description: "Shipped-state selection: all (default), only records that carry a shipped record, or only records that do not. Any other value is a 400."
      responses:
        "304":
          description: "`If-None-Match` matched the current ETag."
        "200":
          description: Array of Automations
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Automation"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}
    post:
      summary: Create an Automation
      description: |
        Creates a new Automation in `draft` status at version 1. Members
        reference existing Automata (PRDs) by `prd_id`; a member may belong
        to at most one non-terminal Automation. The per-outcome edges must
        form an acyclic graph rooted at `entry_member_id` (when
        `entry_member_id` is omitted, the first member is the entry).
        `actor` and `reason` are recorded in the audit log.
      operationId: automationsCreate
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationCreate"
      responses:
        "201":
          description: Created Automation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400":
          description: |
            Validation failure: unknown member or edge target, a cycle in
            the member graph, a member already owned by another Automation,
            or a template/owned PRD enrolled as a member.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}
  /api/automations/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    get:
      summary: Get an Automation
      description: |
        The stored record. When the Automation has a budget policy it also
        carries a computed `budget` view (spend, remaining, window, reset
        time, any hold, the stored breach state and the estimated allocation
        figure); the view is worked out on each read and is never stored.
      operationId: automationsGet
      tags: [Automations]
      responses:
        "200":
          description: Automation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "404": {description: Automation not found}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}
    put:
      summary: Update an Automation
      description: |
        Replaces name, description, budget policy, execution and verification
        defaults, `project_dir`, members and the entry member. A blank name
        keeps the existing one. Members and the entry member may only
        actually change while the Automation is a draft.
        Optimistic concurrency: send the last `version` you saw as
        `expected_version`; a stale value is rejected and the record is left
        unchanged.
      operationId: automationsUpdate
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationUpdate"
      responses:
        "200":
          description: Updated Automation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": {description: "Validation failure (same rules as create)"}
        "404": {description: Automation not found}
        "409":
          description: |
            `expected_version` does not match the stored version, or the
            member list / entry member is changing while the Automation is
            not in draft.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}
    delete:
      summary: Delete an Automation
      description: |
        Removes the record and frees its members (their PRDs are no longer
        reserved by an Automation). Only draft, completed or cancelled
        Automations may be deleted; an intermediate status is a 409.
        Optional body `{"actor": "...", "reason": "..."}` for the audit log;
        actor defaults to "operator".
      operationId: automationsDelete
      tags: [Automations]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: {type: string}
                reason: {type: string}
      responses:
        "204": {description: Deleted}
        "404": {description: Automation not found}
        "409": {description: "The Automation is active, paused or blocked and cannot be deleted; complete or cancel it first"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}

  /api/automations/import-graph/{graph_id}:
    parameters:
      - {name: graph_id, in: path, required: true, schema: {type: string}, description: "Orchestrator graph ID"}
    post:
      summary: Convert an orchestrator graph into a draft Automation
      description: |
        Reads the orchestrator graph and creates a draft Automation from it:
        Automaton nodes become members, a fan-out and its fan-in become a paired
        fork and join, and guardrail nodes are dropped with a warning. The graph
        is never changed. With `dry_run` true nothing is created or audited and
        the response carries the `input` that a real run would create, the
        `warnings` and `dry_run: true`. A real import writes one
        `automation_import_graph` audit entry.
      operationId: automationsImportGraph
      tags: [Automations]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run: {type: boolean}
      responses:
        "200":
          description: The new Automation, or for a dry run the converted input with warnings
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Automation"
                  - type: object
                    properties:
                      input: {type: object}
                      warnings: {type: array, items: {type: string}}
                      dry_run: {type: boolean}
        "404": {description: Graph not found}
        "409": {description: "A member Automaton already belongs to another Automation"}
        "422": {description: "The graph cannot be expressed as an Automation; the body gives the reason"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous or orchestrator disabled"}

  /api/automations/{id}/activate:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    post:
      summary: Activate a draft Automation
      description: |
        Validates the Automation, marks it active and enters its entry
        member through the same approval gate used between members, whatever
        its kind: a plain Automaton starts through its own gate (a paused one
        resumes); a fork fires its branches in sorted order, each through its
        own gate, and evaluates the paired join; a nested Automation member
        activates its child. A member the gate refuses to start leaves the
        Automation blocked with the reason. Only a draft can be activated.
        Optional body `{"actor": "...", "reason": "..."}` for the audit log;
        actor defaults to "operator".
      operationId: automationsActivate
      tags: [Automations]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: {type: string}
                reason: {type: string}
      responses:
        "200":
          description: The Automation after activation (active, or blocked with its reason in the status row)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": {description: "The Automation cannot be activated (for example it has no entry member)"}
        "404": {description: Automation not found}
        "409": {description: "The Automation is not a draft, or changed while it was being activated"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}

  /api/automations/{id}/return_to_draft:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    post:
      summary: Return a blocked Automation to draft
      description: |
        Returns a blocked Automation that never started a member back to the
        draft the operator can still edit: the status goes back to draft, the
        started time, cursors and budget episode are cleared, and every
        member is `pending` again with no timestamps — activating it
        afterwards runs it as if it had never started. Refused with a 409
        that names its status when it is not blocked, or when a member
        already started (a cursor sat on a member), in which case cancel it
        with the `cancel_in_flight` choice instead. Optional body
        `{"actor": "...", "reason": "...", "expected_version": n}`; actor
        defaults to "operator"; a non-zero expected_version that does not
        match the stored version is a 409.
      operationId: automationsReturnToDraft
      tags: [Automations]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: {type: string}
                reason: {type: string}
                expected_version: {type: integer, format: int64}
      responses:
        "200":
          description: The Automation back in draft, every member pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "404": {description: Automation not found}
        "409": {description: "The Automation is not blocked, a member already started or a cursor sat on a member, or expected_version does not match"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}

  /api/automations/{id}/pause:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    post:
      summary: Pause an active Automation
      description: |
        Moves an active Automation to paused. Members already running keep running
        and nothing is ended; a paused Automation moves on when a member finishes
        but starts nothing until resumed. Body: `{expected_version, actor?, reason?}`.
      operationId: automationsPause
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties:
        expected_version: {type: integer, format: int64, description: "The Automation version the caller read; a different current version is a 409"}
        actor: {type: string, description: "Who is acting (audit log); defaults to operator"}
        reason: {type: string, description: "Why (audit log)"}
      responses:
        "200":
          description: The Automation, now paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": {description: "Malformed body"}
        "404": {description: Automation not found}
        "409": {description: "Stale expected_version (the Automation changed since it was read), or the Automation is not in a state this operation accepts"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}

  /api/automations/{id}/resume:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    post:
      summary: Resume a paused Automation
      description: |
        Moves a paused Automation back to active; members that finished while it was
        paused are routed on and the next member is started. Body:
        `{expected_version, actor?, reason?}`.
      operationId: automationsResume
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties:
        expected_version: {type: integer, format: int64, description: "The Automation version the caller read; a different current version is a 409"}
        actor: {type: string, description: "Who is acting (audit log); defaults to operator"}
        reason: {type: string, description: "Why (audit log)"}
      responses:
        "200":
          description: The Automation, now active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": {description: "Malformed body"}
        "404": {description: Automation not found}
        "409": {description: "Stale expected_version (the Automation changed since it was read), or the Automation is not in a state this operation accepts"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}

  /api/automations/{id}/cancel:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    post:
      summary: Cancel an Automation
      description: |
        Cancels the Automation. `cancel_in_flight` is REQUIRED and has no default:
        `true` ends the session of every in-flight member, `false` leaves in-flight
        members running. A body without the key is a 400 naming both values. Members
        not yet run become cancelled either way. If the Automation is cancelled but
        ending an in-flight member session failed, the response is a 500 and the
        Automation stays cancelled.
      operationId: automationsCancel
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, cancel_in_flight]
              properties:
        expected_version: {type: integer, format: int64, description: "The Automation version the caller read; a different current version is a 409"}
        actor: {type: string, description: "Who is acting (audit log); defaults to operator"}
        reason: {type: string, description: "Why (audit log)"}
        cancel_in_flight: {type: boolean, description: "REQUIRED. true ends the session of every in-flight member; false leaves in-flight members running"}
      responses:
        "200":
          description: The Automation, now cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": {description: "cancel_in_flight is missing (the message names cancel_in_flight=true and cancel_in_flight=false), or the body is malformed"}
        "404": {description: Automation not found}
        "409": {description: "Stale expected_version (the Automation changed since it was read), or the Automation is not in a state this operation accepts"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}

  /api/automations/{id}/skip_member:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    post:
      summary: Skip an active member
      description: |
        Skips an active member and moves on along `edge`, as if the member had ended
        that way. A session the member is running is not ended. In a forked
        Automation with several active branches, `member_id` names the branch.
      operationId: automationsSkipMember
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties:
        expected_version: {type: integer, format: int64, description: "The Automation version the caller read; a different current version is a 409"}
        actor: {type: string, description: "Who is acting (audit log); defaults to operator"}
        reason: {type: string, description: "Why (audit log)"}
        member_id: {type: string, description: "Member ID"}
        edge: {type: string, enum: [on_complete, on_blocked, on_failed], default: on_complete}
      responses:
        "200":
          description: The Automation after the skip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": {description: "Invalid edge, or member_id missing or not an active branch"}
        "404": {description: Automation not found}
        "409": {description: "Stale expected_version (the Automation changed since it was read), or the Automation is not in a state this operation accepts"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}

  /api/automations/{id}/insert_member:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    post:
      summary: Insert an Automaton member
      description: |
        Inserts a new member: an Automaton (`member.prd_id`) or a pending item
        (`member.pending_item_id`, or `pending_item_id` at the top level), exactly one of the two.
        A pending item member holds the Automation at the cursor until an Automaton is attached
        (`POST /api/autonomous/pending-items/{id}/attach`). On a draft it lands in the graph at once; on a
        running Automation it is held as a pending insert until an operator approves it
        (`approve_insert`). `reason` is required. Only one urgent insert may be pending
        at a time. An urgent insert takes the next slot and must leave `after` empty.
      operationId: automationsInsertMember
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, reason]
              properties:
                expected_version: {type: integer, format: int64, description: "The Automation version the caller read; a different current version is a 409"}
                actor: {type: string, description: "Who is acting (audit log); defaults to operator"}
                reason: {type: string, description: "Why (audit log)"}
                member:
                  type: object
                  description: "The member to insert: an Automaton (prd_id) or a pending item (pending_item_id), exactly one of the two"
                  properties:
                    prd_id: {type: string, description: "The member Automaton to insert"}
                    pending_item_id: {type: string, description: "The pending item to insert (an id from GET /api/autonomous/pending-items). The item must be waiting and not a member of another Automation. The member waits at the cursor until an Automaton is attached"}
                    name: {type: string, description: "Optional display name"}
                pending_item_id: {type: string, description: "The top-level form of member.pending_item_id"}
                urgent: {type: boolean, description: "Take the next slot instead of the end of the chain"}
                after: {type: string, description: "Insert directly after this member ID; empty for the end of the chain"}
      responses:
        "200":
          description: The Automation after the insert (the pending insert is on the record when it was held)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": {description: "reason missing, neither or both of member.prd_id and member.pending_item_id given, or an invalid position"}
        "404": {description: Automation not found}
        "409": {description: "Stale expected_version (the Automation changed since it was read), or the Automation is not in a state this operation accepts"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}

  /api/automations/{id}/remove_member:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    post:
      summary: Remove a member
      description: |
        Removes a member that has not started and has no outgoing edges. The entry
        member, running or finished members, forks, joins and fork or join branches are
        refused with a 409.
      operationId: automationsRemoveMember
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, member_id]
              properties:
        expected_version: {type: integer, format: int64, description: "The Automation version the caller read; a different current version is a 409"}
        actor: {type: string, description: "Who is acting (audit log); defaults to operator"}
        reason: {type: string, description: "Why (audit log)"}
        member_id: {type: string, description: "Member ID"}
      responses:
        "200":
          description: The Automation without the member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": {description: "member_id missing"}
        "404": {description: Automation not found}
        "409": {description: "Stale expected_version (the Automation changed since it was read), or the Automation is not in a state this operation accepts"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}

  /api/automations/{id}/reorder_edges:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    post:
      summary: Rewire a member's edges
      description: |
        Rewires the three outgoing edges of a member that has not started. Each edge
        is the member ID it now names; empty or omitted clears it. A member that is
        running or finished is refused with a 409; unknown targets, self-edges and
        cycles are a 400.
      operationId: automationsReorderEdges
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, member_id]
              properties:
        expected_version: {type: integer, format: int64, description: "The Automation version the caller read; a different current version is a 409"}
        actor: {type: string, description: "Who is acting (audit log); defaults to operator"}
        reason: {type: string, description: "Why (audit log)"}
        member_id: {type: string, description: "Member ID"}
        on_complete: {type: string}
        on_blocked: {type: string}
        on_failed: {type: string}
      responses:
        "200":
          description: The Automation with the new edges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": {description: "Unknown target, self-edge, cycle, or member_id missing"}
        "404": {description: Automation not found}
        "409": {description: "Stale expected_version (the Automation changed since it was read), or the Automation is not in a state this operation accepts"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}

  /api/automations/{id}/approve_insert:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    post:
      summary: Approve a pending inserted member
      description: |
        Promotes a pending insert, named by `member_id` (the pending ID returned with
        the insert), into the graph at its reserved position. Only the operator may
        approve; an unknown pending ID is a 409.
      operationId: automationsApproveInsert
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, member_id]
              properties:
        expected_version: {type: integer, format: int64, description: "The Automation version the caller read; a different current version is a 409"}
        actor: {type: string, description: "Who is acting (audit log); defaults to operator"}
        reason: {type: string, description: "Why (audit log)"}
        member_id: {type: string, description: "Member ID"}
      responses:
        "200":
          description: The Automation with the member in the graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": {description: "member_id missing"}
        "404": {description: Automation not found}
        "409": {description: "Stale expected_version (the Automation changed since it was read), or the Automation is not in a state this operation accepts"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}

  /api/automations/{id}/set_budget:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    post:
      summary: Set or clear an Automation's budget policy
      description: |
        Sets, replaces or clears the budget policy of the Automation, or, with
        `member_id`, the override of one member. The policy fields replace the
        whole policy; `clear` removes the policy (or the member override) and
        cannot be combined with them. For a member, `estimated_cost_usd`
        declares what its Automaton is expected to cost; sent alone it changes
        only that estimate, and 0 removes it.

        Setting a policy never changes the Automation's status. A paused
        Automation resumes through its own tick when the window resets, and a
        blocked one when the operator resumes it. The Automation must not be
        completed or cancelled, and a member must not have finished.

        A dollar ceiling that is reached pauses the Automation and resumes it
        by itself at the window rollover when the reset time is known (a day,
        week or month window, anchored at `reset_time`, `reset_weekday`,
        `reset_day` and `reset_zone` or at the calendar default, or a reset time
        read from a rate-limit message). When the reset time is not known, or
        `on_breach` is `block`, it is blocked and waits for the operator. An
        alert is raised either way. An `allocation_pct` ceiling and
        `allocation_estimate` only add an estimated figure and never pause or
        block. Naming a peer in `peer_window` counts that peer's usage toward
        the ceiling; this is opt-in per peer and nothing confirms
        automatically that the peer shares the account.

        Send the last `version` you saw as `expected_version`. `actor` defaults
        to "operator"; `actor` and `reason` are recorded in the audit log as
        `automation_set_budget`.
      operationId: automationsSetBudget
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetSetRequest"
      responses:
        "200":
          description: The updated Automation, with its computed `budget` view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": {description: "Invalid input: an unknown ceiling type, window, pacing or on-breach rule, a ceiling that is not positive, a reset field that does not fit the window, clear combined with policy fields, a declared cost without a member, or a fork or join member"}
        "404": {description: "Automation or member not found"}
        "409": {description: "expected_version is stale, the Automation is completed or cancelled, or the member has already finished"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}
  /api/automations/{id}/set_effort_ceiling:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    post:
      summary: Set or clear an Automation's effort ceiling
      description: |
        Sets the effort ceiling of the Automation: a map of task kind (`docs`,
        `parity`, `live_check`, `final_gate`) to `low`, `medium`, `high` or
        `cheaper_backend`. A ceiling only lowers a task's effort or moves it to
        the cheaper backend; it never raises one. An empty or absent
        `effort_ceiling` clears it. Send the last `version` you saw as
        `expected_version`. `actor` and `reason` are recorded in the audit log
        as `automation_set_effort_ceiling`.
      operationId: automationsSetEffortCeiling
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                effort_ceiling:
                  type: object
                  additionalProperties: {type: string, enum: [low, medium, high, cheaper_backend]}
                expected_version: {type: integer}
                actor: {type: string}
                reason: {type: string}
      responses:
        "200":
          description: The updated Automation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": {description: "Unknown task kind or ceiling"}
        "404": {description: "Automation not found"}
        "409": {description: "expected_version is stale, or the Automation is completed or cancelled"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "501": {description: "effort ceiling is not available"}
        "503": {description: "autonomous disabled"}
  /api/automations/{id}/set_decision_assistant:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    post:
      summary: Set or clear an Automation's decision assistant
      description: |
        Sets or clears the optional local-model decision assistant of the
        Automation, or, with `member_id`, of one member. It is off by default.
        The fields replace the whole setting; `clear`, or an empty `backend`,
        turns it off, and `clear` cannot be combined with the setting fields.
        `mode` is `shadow` (the default) or `live`; `hooks` are `empty_edge`,
        `skip_member`, `insert_member` and `budget_breach`; `thresholds` map a
        hook to a confidence in (0,1] (defaults 0.9, `budget_breach` 0.95).
        The Automation's status is not changed. `actor` and `reason` are
        recorded in the audit log as `automation_set_decision_assistant`.
      operationId: automationsSetDecisionAssistant
      tags: [Automations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                member_id: {type: string}
                backend: {type: string}
                model: {type: string}
                mode: {type: string, enum: [shadow, live]}
                hooks:
                  type: array
                  items: {type: string, enum: [empty_edge, skip_member, insert_member, budget_breach]}
                thresholds:
                  type: object
                  additionalProperties: {type: number, exclusiveMinimum: 0, maximum: 1}
                clear: {type: boolean}
                expected_version: {type: integer}
                actor: {type: string}
                reason: {type: string}
      responses:
        "200":
          description: The updated Automation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400": {description: "Invalid setting, or nothing to set"}
        "404": {description: Automation or member not found}
        "409": {description: "expected_version is stale, or the Automation is completed or cancelled"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}

  /api/automations/merged-members:
    get:
      summary: Merged-member decisions of every Automaton
      description: |
        Read-only. Lists the merged-member decisions of all Automata, oldest
        first. A decision is written when a member of an Automaton ended
        cancelled or completed and its work was found already merged into the
        project default branch. Each row names the member, its branch, the
        default branch, the proving commit, the merged-member policy in force
        (`completed`, `manual` or `block`), the outcome (`advanced` when the
        chain moved on, `blocked` when the Automaton stayed blocked for the
        operator) and the time. Nothing is changed.
      operationId: automationsMergedMembersAll
      tags: [Automations]
      responses:
        "200":
          description: The merged-member decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergedMemberList"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}

  /api/automations/{id}/merged-members:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Automation ID (8-hex)"}
    get:
      summary: Merged-member decisions of one Automaton
      description: |
        Read-only. Lists the merged-member decisions in one Automaton's
        decision log, oldest first, with the same rows as
        `GET /api/automations/merged-members`. An Automaton with no such
        decision returns an empty list.
      operationId: automationsMergedMembers
      tags: [Automations]
      responses:
        "200":
          description: The merged-member decisions of the Automaton
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergedMemberList"
        "404": {description: Automation not found}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {description: "autonomous disabled"}

  # ─── Mobile-client parity endpoints (documented in v4.0.3) ────
  /api/backends/active:
    post:
      summary: Switch the default LLM backend for new sessions
      operationId: backendsActive
      tags: [Backends]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, example: "claude-code"}
      responses:
        "200": {description: "{status: ok, active: <name>}"}
        "400": {description: unknown backend}
  /api/channels:
    get:
      summary: List messaging channel backends with enabled state
      operationId: channelsList
      tags: [Channels]
      responses: {"200": {description: OK}}
    post:
      summary: Create a new channel (deferred; returns 501 in v4.0.3)
      operationId: channelsCreate
      tags: [Channels]
      responses: {"501": {description: Use PUT /api/config with the matching backend block}}
  /api/channels/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    patch:
      summary: Toggle channel enabled state
      operationId: channelsPatch
      tags: [Channels]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses: {"200": {description: OK}, "404": {description: unknown channel}}
    delete:
      summary: Disable a channel (config retained for re-enable)
      operationId: channelsDelete
      tags: [Channels]
      responses: {"200": {description: OK}, "404": {description: unknown channel}}
  /api/channel/send:
    post:
      summary: Send a test message through a named channel
      operationId: channelSend
      tags: [Channels]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel: {type: string, description: "channel name or id"}
                message: {type: string}
      responses: {"200": {description: OK}, "502": {description: provider rejected}}
  /api/sessions/delete:
    post:
      summary: "Delete a session (single or bulk). Accepts {id} or {ids: [...]}"
      operationId: sessionsDelete
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: {type: string}
                ids:
                  type: array
                  items: {type: string}
      responses: {"200": {description: OK}}
  /api/sessions/timeline:
    get:
      summary: Session event timeline (state transitions + key events)
      operationId: sessionsTimeline
      tags: [Sessions]
      parameters:
        - {name: id, in: query, required: true, schema: {type: string}}
        - {name: since, in: query, schema: {type: integer, description: "epoch ms"}}
        - {name: limit, in: query, schema: {type: integer}}
      responses: {"200": {description: OK}}

  # BL359 — restart session by ID (path-based)
  /api/sessions/{id}/status:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: "Full or short session ID"}
    get:
      summary: Session status board (hook state plus Automaton detail)
      description: |
        Latest hook-event state and derived board for the PWA Status tab.
        For autonomous task sessions the response also carries an `automaton`
        block built from the daemon's own PRD/story/task store, so it is
        present even when the agent sends no hook payloads. The block is
        omitted for sessions not linked to an autonomous task.
        When no hook payload supplied `sprint`, a backward-compatible
        `sprint` map is synthesized from the same data.
        Requires `CapConfigRead` federation capability.
      operationId: sessionStatus
      tags: [Sessions]
      responses:
        "200":
          description: Status board
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: {type: string}
                  state: {type: string, description: "running | waiting | idle | unknown"}
                  current_focus: {type: object, additionalProperties: true}
                  sprint:
                    type: object
                    additionalProperties: true
                    description: |
                      Hook-supplied sprint state, or (autonomous sessions without a
                      hook payload) a synthesized map with stable keys `sprint_id`,
                      `title`, `status`, `automata`, `task_id`, `task_title`, `story_title`.
                  tests: {type: object, additionalProperties: true}
                  git: {type: object, additionalProperties: true}
                  last_event: {type: object, additionalProperties: true}
                  idle_since: {type: string, format: date-time}
                  hook_health: {type: string, description: "alive | stale | missing"}
                  telemetry: {type: object, additionalProperties: true}
                  automaton: {$ref: "#/components/schemas/SessionAutomatonDetail"}
                  updated_at: {type: string, format: date-time}
        "400": {description: Session id required}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Federation peer lacks CapConfigRead}
        "405": {description: Method not allowed}

  /api/sessions/{id}/restart:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      summary: Restart a session by path ID
      description: |
        Restart a completed, failed, or killed session. Optionally supply
        a new task or session name; otherwise the original values are reused.
      operationId: sessionRestartById
      tags: [Sessions]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                task: {type: string, description: "Override the task for the restarted session"}
                session_name: {type: string, description: "Override the session name"}
      responses:
        "200":
          description: Session restarted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400": {description: Bad Request}
        "404": {description: Session not found}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/cert:
    get:
      summary: Download the server CA certificate PEM
      operationId: cert
      tags: [Security]
      responses:
        "200":
          description: PEM-encoded certificate
          content:
            application/x-pem-file: {schema: {type: string}}
        "404": {description: TLS not enabled}
  /api/interfaces:
    get:
      summary: List network interfaces the daemon sees
      operationId: interfaces
      tags: [Diagnostics]
      responses: {"200": {description: OK}}
  /api/logs:
    get:
      summary: Paged daemon log tail
      operationId: logs
      tags: [Diagnostics]
      parameters:
        - {name: level, in: query, schema: {type: string, enum: [info, warn, error]}}
        - {name: since, in: query, schema: {type: integer, description: "epoch ms"}}
        - {name: limit, in: query, schema: {type: integer}}
      responses: {"200": {description: OK}}
  /api/restart:
    post:
      summary: Restart the daemon (re-exec). Returns before the old process exits.
      operationId: restart
      tags: [Operations]
      responses: {"200": {description: "{status: restarting}"}}

  # Result store (BL360)
  /api/result-store:
    get:
      summary: List result store entries
      operationId: resultStoreList
      tags: [ResultStore]
      parameters:
        - {name: prefix, in: query, required: false, description: "Optional name prefix filter", schema: {type: string}}
      responses:
        "200":
          description: Array of result entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResultEntry"
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      summary: Put a result store entry
      operationId: resultStorePut
      tags: [ResultStore]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, payload]
              properties:
                name: {type: string}
                payload: {type: object}
                ttl_seconds: {type: integer}
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultEntry"
        "400": {description: Bad Request}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/result-store/{name}:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string}}
    get:
      summary: Get a result store entry by name
      operationId: resultStoreGet
      tags: [ResultStore]
      responses:
        "200":
          description: Result entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultEntry"
        "404": {description: Not found}
        "401": {$ref: "#/components/responses/Unauthorized"}
    delete:
      summary: Delete a result store entry
      operationId: resultStoreDelete
      tags: [ResultStore]
      responses: {"200": {description: Deleted}, "404": {description: Not found}, "401": {$ref: "#/components/responses/Unauthorized"}}

  /api/ollama/models:
    get:
      summary: List installed Ollama models (name, size, modified)
      operationId: ollamaModels
      tags: [Backends]
      responses: {"200": {description: OK}}
  /api/openwebui/models:
    get:
      summary: List OpenWebUI models
      operationId: openwebuiModels
      tags: [Backends]
      responses: {"200": {description: OK}}

  # ─── Observer (BL171, v4.1.0) — unified stats / process-tree /
  # sub-process monitoring. /api/stats gained a ?v=2 param that
  # returns the structured StatsResponse v2 payload. /api/observer/*
  # exposes the envelope + tree drill-downs that mobile + PWA use.
  /api/observer/stats:
    get:
      summary: StatsResponse v2 snapshot (structured host / cpu / mem / disk / gpu / sessions / backends / envelopes / processes), plus the `ui_prompts` object when the daemon tracks Claude Code interstitial-prompt dismissals — total `dismissed` / `not_cleared` / `refused` counts since daemon start and a `by_kind` breakdown; in-memory, nil (omitted) until the first tracked dismissal
      operationId: observerStats
      tags: [Observer]
      responses: {"200": {description: OK}, "503": {description: observer disabled}}
  /api/observer/envelopes:
    get:
      summary: Envelope rollup only — per-session + per-LLM-backend CPU / mem / net / GPU totals
      operationId: observerEnvelopes
      tags: [Observer]
      responses: {"200": {description: OK}, "503": {description: observer disabled}}
  /api/observer/envelope:
    get:
      summary: Drill-down — process sub-tree for one envelope by id
      operationId: observerEnvelope
      tags: [Observer]
      parameters:
        - {name: id, in: query, required: true, schema: {type: string},
           description: "envelope id, e.g. session:peer-d-787e or backend:ollama"}
      responses: {"200": {description: OK}, "404": {description: envelope not found}, "503": {description: observer disabled}}
  /api/observer/config:
    get:
      summary: Read observer config
      operationId: observerConfigGet
      tags: [Observer]
      responses: {"200": {description: OK}}
    put:
      summary: Replace observer config (full body)
      operationId: observerConfigSet
      tags: [Observer]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object}}}
      responses: {"200": {description: OK}, "400": {description: Bad Request}}

  # ─── Observer peers (BL172 / S11 Shape B + C) — federated peer
  # registry. 503 when observer.peers.allow_register is false.
  /api/observer/peers:
    get:
      summary: List registered Shape B / C peers (TokenHash redacted)
      operationId: observerPeersList
      tags: [Observer]
      responses: {"200": {description: OK}, "503": {description: Peer registry disabled}}
    post:
      summary: Register a Shape B / C peer; returns the minted bearer token (only opportunity)
      operationId: observerPeersRegister
      tags: [Observer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:    {type: string, description: "Stable peer name (commonly hostname)"}
                shape:   {type: string, enum: [B, C], default: B}
                version: {type: string}
                host_info: {type: object, additionalProperties: true}
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:  {type: string}
                  shape: {type: string}
                  token: {type: string, description: "Bearer token — store securely; only returned once"}
        "400": {description: Bad Request}
        "503": {description: Peer registry disabled}
  /api/observer/peers/{name}:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string}}
    get:
      summary: Peer detail (TokenHash redacted)
      operationId: observerPeerGet
      tags: [Observer]
      responses: {"200": {description: OK}, "404": {description: Not found}, "503": {description: Peer registry disabled}}
    delete:
      summary: De-register a peer (rotates the token — peer auto-re-registers on next push)
      operationId: observerPeerDelete
      tags: [Observer]
      responses: {"200": {description: OK}, "404": {description: Not found}, "503": {description: Peer registry disabled}}
  /api/observer/peers/{name}/stats:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string}}
    get:
      summary: Last-known StatsResponse v2 snapshot for the peer
      operationId: observerPeerLastStats
      tags: [Observer]
      responses: {"200": {description: OK}, "404": {description: No snapshot or unknown peer}, "503": {description: Peer registry disabled}}
    post:
      summary: Push a StatsResponse v2 snapshot (Bearer auth from `register`)
      description: |
        Push body wraps the StatsResponse v2 with `shape` and
        `peer_name` fields so the parent can roll up envelopes
        per-peer. peer_name in the body must match the path segment.
      operationId: observerPeerPush
      tags: [Observer]
      security:
        - BearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshot]
              properties:
                shape:     {type: string, enum: [B, C]}
                peer_name: {type: string}
                snapshot:  {type: object, description: "StatsResponse v2 payload"}
      responses:
        "200": {description: Accepted}
        "400": {description: Bad payload or peer_name mismatch}
        "401": {description: Missing or invalid bearer token}
        "503": {description: Peer registry disabled}

  # ─── Memory + Knowledge Graph (BL23 episodic + BL57 KG, BL101 cross-
  # profile namespaces). All endpoints 503 when memory is not enabled.
  /api/memory/stats:
    get:
      summary: Memory backend status (provider, embedder, counts, last write)
      operationId: memoryStats
      tags: [Memory]
      responses: {"200": {description: OK}, "503": {description: Memory not enabled}}
  /api/memory/list:
    get:
      summary: List recent memories (most recent first)
      operationId: memoryList
      tags: [Memory]
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer}}
        - {name: namespace, in: query, required: false, schema: {type: string}}
      responses: {"200": {description: OK}, "503": {description: Memory not enabled}}
  /api/memory/search:
    get:
      summary: Semantic recall over the episodic store
      description: |
        Vector search across stored memories. Pass `q` for the query
        string. Optional `profile` (or `agent_id`) expands the
        namespace set per BL101 mutual-opt-in rules so workers see
        peer-profile memories without knowing raw namespace ids.
      operationId: memorySearch
      tags: [Memory]
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer}}
        - {name: profile, in: query, required: false, schema: {type: string}}
        - {name: agent_id, in: query, required: false, schema: {type: string}}
        - {name: namespace, in: query, required: false, schema: {type: string}}
      responses: {"200": {description: OK}, "400": {description: Missing q}, "503": {description: Memory not enabled}}
  /api/memory/save:
    post:
      summary: Store a new memory (decision, pattern, finding)
      operationId: memorySave
      tags: [Memory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: {type: string}
                kind: {type: string, description: "decision / pattern / finding / context (free-form)"}
                namespace: {type: string}
                tags: {type: array, items: {type: string}}
                metadata: {type: object}
      responses: {"200": {description: Saved}, "400": {description: Bad Request}, "503": {description: Memory not enabled}}
  /api/memory/delete:
    post:
      summary: Forget a memory by id
      operationId: memoryDelete
      tags: [Memory]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [id], properties: {id: {type: string}}}}}
      responses: {"200": {description: OK}, "404": {description: Not found}, "503": {description: Memory not enabled}}
  /api/memory/reindex:
    post:
      summary: Rebuild the vector index for a namespace (or all namespaces)
      operationId: memoryReindex
      tags: [Memory]
      requestBody:
        required: false
        content: {application/json: {schema: {type: object, properties: {namespace: {type: string}}}}}
      responses: {"200": {description: Reindex started}, "503": {description: Memory not enabled}}
  /api/memory/learnings:
    get:
      summary: Recent learnings (decisions + verifier results) feeding the autonomous loop
      operationId: memoryLearnings
      tags: [Memory]
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer}}
        - {name: since, in: query, required: false, schema: {type: string, format: date-time}}
      responses: {"200": {description: OK}, "503": {description: Memory not enabled}}
  /api/memory/research:
    get:
      summary: Cross-session research aggregator (deep search with KG context)
      operationId: memoryResearch
      tags: [Memory]
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}}
        - {name: depth, in: query, required: false, schema: {type: integer}}
      responses: {"200": {description: OK}, "400": {description: Missing q}, "503": {description: Memory not enabled}}
  /api/memory/export:
    get:
      summary: Export the entire memory store as a portable JSON bundle
      operationId: memoryExport
      tags: [Memory]
      responses:
        "200":
          description: JSON bundle (memories + KG + namespaces)
          content: {application/json: {schema: {type: object}}}
        "503": {description: Memory not enabled}
  /api/memory/import:
    post:
      summary: Import a memory bundle (idempotent — existing ids are skipped)
      operationId: memoryImport
      tags: [Memory]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object}}}
      responses: {"200": {description: Imported}, "400": {description: Bad bundle}, "503": {description: Memory not enabled}}
  /api/memory/wal:
    get:
      summary: Tail of the memory write-ahead audit log
      operationId: memoryWAL
      tags: [Memory]
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer}}
      responses: {"200": {description: OK}, "503": {description: Memory not enabled}}
  /api/memory/test:
    get:
      summary: Probe the configured backend before flipping the enable flag
      description: PWA Settings toggle uses this to validate Postgres + embedder reachability.
      operationId: memoryTest
      tags: [Memory]
      responses: {"200": {description: Reachable}, "502": {description: Backend unreachable}}
  /api/memory/kg/query:
    get:
      summary: Knowledge-graph query (entities + relationships)
      operationId: kgQuery
      tags: [Memory]
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}}
        - {name: depth, in: query, required: false, schema: {type: integer}}
      responses: {"200": {description: OK}, "400": {description: Missing q}, "503": {description: Memory not enabled}}
  /api/memory/kg/add:
    post:
      summary: Add an entity / relationship to the knowledge graph
      operationId: kgAdd
      tags: [Memory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject: {type: string}
                predicate: {type: string}
                object: {type: string}
                metadata: {type: object}
      responses: {"200": {description: OK}, "400": {description: Bad Request}, "503": {description: Memory not enabled}}
  /api/memory/kg/invalidate:
    post:
      summary: Invalidate (soft-delete) a KG triple by id
      operationId: kgInvalidate
      tags: [Memory]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [id], properties: {id: {type: string}, reason: {type: string}}}}}
      responses: {"200": {description: OK}, "404": {description: Not found}, "503": {description: Memory not enabled}}
  /api/memory/kg/timeline:
    get:
      summary: Timeline view of KG changes for an entity
      operationId: kgTimeline
      tags: [Memory]
      parameters:
        - {name: entity, in: query, required: true, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer}}
      responses: {"200": {description: OK}, "400": {description: Missing entity}, "503": {description: Memory not enabled}}
  /api/memory/kg/stats:
    get:
      summary: KG counts (entities, triples, namespaces)
      operationId: kgStats
      tags: [Memory]
      responses: {"200": {description: OK}, "503": {description: Memory not enabled}}

  # ─── Voice transcription (issue #2 / F18) — Whisper-backed
  # multipart upload returning the transcript and an optional command
  # action. Used by the PWA mic button (#21, v4.2.0) and by mobile.
  /api/voice/transcribe:
    post:
      summary: Transcribe an audio blob with Whisper (returns transcript + optional action dispatch)
      description: |
        Accepts multipart/form-data with an `audio` blob (opus/ogg/webm/mp4
        preferred). When `session_id` is set the result auto-replies into
        that session; when `auto_exec` is `true` and the transcript starts
        with `new:`, `reply:`, or `status`, the corresponding action is
        returned in the `action` field.

        The transcription deadline is 5 minutes, or twice the audio length
        when that is longer, capped at 30 minutes. Local whisper splits audio
        longer than `whisper.chunk_seconds` (default 120, 0 disables) and
        transcribes it slice by slice.
      operationId: voiceTranscribe
      tags: [Voice]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: Audio blob (opus/ogg/webm/mp4 preferred, mono 16 kHz)
                session_id:
                  type: string
                  description: When set the transcript is replied into this session
                auto_exec:
                  type: string
                  description: "true / 1 — run a recognised command prefix (new:/reply:/status)"
                ts_client:
                  type: string
                  description: unix_ms client send time, for latency telemetry
      responses:
        "200":
          description: Transcript + optional action
          content:
            application/json:
              schema:
                type: object
                properties:
                  transcript: {type: string}
                  confidence: {type: number}
                  action: {type: string, enum: [none, new, reply, status]}
                  session_id: {type: string}
                  latency_ms: {type: integer}
        "400": {description: Missing or malformed audio}
        "413": {description: Upload larger than the 25 MB limit}
        "502":
          description: |
            The transcription failed. The body is JSON and names the real
            cause. The same failure is logged on the daemon as a
            `[voice] transcribe failed:` line.
          content:
            application/json:
              schema:
                type: object
                required: [error, cause, hint, detail, latency_ms]
                properties:
                  error:
                    type: string
                    description: One sentence naming the real cause, prefixed with `transcribe:`
                  cause:
                    type: string
                    enum: [timeout, killed, out_of_memory, ffmpeg_missing, backend_error, unknown]
                    description: |
                      `timeout` — the deadline expired or the request was cancelled.
                      `killed` — the whisper process was ended by SIGKILL, usually the kernel out-of-memory killer.
                      `out_of_memory` — whisper reported it ran out of memory.
                      `ffmpeg_missing` — ffmpeg is not installed or not on PATH.
                      `backend_error` — any other non-zero exit or HTTP failure from the backend.
                      `unknown` — matches no known cause.
                  hint:
                    type: string
                    description: One actionable sentence for the operator
                  detail:
                    type: string
                    description: The raw backend error text, cut to 500 bytes
                  latency_ms:
                    type: integer
                    description: Milliseconds from request start to the failure
        "503": {description: Voice transcription not enabled}

  # ─── RTK auto-update (BL85, v4.0.1) — surfaces the background
  # checker to operators so they can see the available rtk version
  # and trigger an update from the PWA / Signal.
  /api/rtk/version:
    get:
      summary: Currently-installed rtk version + last-known available release
      operationId: rtkVersion
      tags: [RTK]
      responses:
        "200":
          description: Version info
          content:
            application/json:
              schema:
                type: object
                properties:
                  installed: {type: string}
                  available: {type: string}
                  update_available: {type: boolean}
                  checked_at: {type: string, format: date-time}
  /api/rtk/check:
    post:
      summary: Force a check against the rtk-ai/rtk releases endpoint now
      operationId: rtkCheck
      tags: [RTK]
      responses: {"200": {description: Check completed}, "502": {description: GitHub releases unreachable}}
  /api/rtk/update:
    post:
      summary: Download + install the available rtk binary (atomic replace + chmod)
      description: |
        Operator-triggered update. The PWA Settings → Monitor card
        surfaces the upstream install one-liner
        (`curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh`)
        as a click-to-copy chip when an upgrade is available, so the
        operator can run it manually if they prefer.
      operationId: rtkUpdate
      tags: [RTK]
      responses: {"200": {description: Updated}, "409": {description: Already up to date}, "502": {description: Download failed}}
  /api/rtk/discover:
    get:
      summary: Walk recent Claude Code sessions and report missed RTK opportunities
      operationId: rtkDiscover
      tags: [RTK]
      responses: {"200": {description: Discovery report}}

  # ─── Cost tracking (BL6) — token + USD rollups across sessions and
  # backends. Mobile + PWA Settings card both consume.
  /api/cost:
    get:
      summary: Token + USD cost rollup across all sessions
      operationId: costSummary
      tags: [Cost]
      parameters:
        - {name: since, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: backend, in: query, required: false, schema: {type: string}}
      responses: {"200": {description: OK}}
  /api/cost/usage:
    get:
      summary: Per-session usage + cost detail
      operationId: costUsage
      tags: [Cost]
      parameters:
        - {name: session_id, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer}}
      responses: {"200": {description: OK}}
  /api/cost/rates:
    get:
      summary: Current per-model price-per-token rates
      operationId: costRatesGet
      tags: [Cost]
      responses: {"200": {description: OK}}
    put:
      summary: Operator override for per-model rates
      operationId: costRatesSet
      tags: [Cost]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object}}}
      responses: {"200": {description: OK}, "400": {description: Bad Request}}

  # ─── Schedules — plural path the server actually serves (v4.0.7 fix for issue #16)
  /api/schedules:
    get:
      summary: List scheduled commands (plural alias of /api/schedule)
      description: |
        Returns scheduled commands. Optional query params filter
        the result set; the PWA uses both `session_id` and `state`.
      operationId: listSchedules
      tags: [Schedule]
      parameters:
        - name: session_id
          in: query
          required: false
          description: Filter to schedules attached to a specific session
          schema: {type: string}
        - name: state
          in: query
          required: false
          description: Filter by lifecycle state
          schema: {type: string, enum: [pending, fired, cancelled, failed]}
      responses:
        "200":
          description: Array of scheduled command entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledCommand"
    post:
      summary: Add a scheduled command (plural alias of /api/schedule)
      operationId: addSchedule
      tags: [Schedule]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledCommand"
      responses:
        "200":
          description: Scheduled command added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledCommand"
    delete:
      summary: Cancel a scheduled command by id (plural alias of /api/schedule)
      operationId: deleteSchedule
      tags: [Schedule]
      parameters:
        - name: id
          in: query
          required: true
          schema: {type: string}
      responses:
        "200": {description: OK}
        "404": {description: schedule not found}

  # ─── Profiles — backend + project + cluster profile enumeration (issue #16)
  /api/profiles:
    get:
      summary: List all registered profiles (backend / project / cluster)
      description: |
        Returns a unified list of agent profiles used by the New
        Session form. The server splits the detailed CRUD across
        `/api/profiles/projects` and `/api/profiles/clusters`; this
        top-level list is the convenience view.
      operationId: listProfiles
      tags: [Profiles]
      responses:
        "200":
          description: Array of profile summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: {type: string}
                    kind:
                      type: string
                      enum: [backend, project, cluster]
                    default_backend: {type: string}
  /api/profiles/projects:
    get:
      summary: List project profiles
      operationId: listProjectProfiles
      tags: [Profiles]
      responses: {"200": {description: OK}}
    post:
      summary: Create or update a project profile
      operationId: upsertProjectProfile
      tags: [Profiles]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"200": {description: OK}, "400": {description: Bad Request}}
  /api/profiles/clusters:
    get:
      summary: List cluster profiles
      operationId: listClusterProfiles
      tags: [Profiles]
      responses: {"200": {description: OK}}
    post:
      summary: Create or update a cluster profile
      operationId: upsertClusterProfile
      tags: [Profiles]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"200": {description: OK}, "400": {description: Bad Request}}

  # ─── BL170 phase 5 — long-tail backfill (operator-facing routes).
  # Worker-internal / PWA-only routes deliberately omitted: /api/proxy/*,
  # /api/test/message, /api/mcp/docs, /api/agents/peer/*,
  # /api/channel/{ready,notify}, /api/stats/kill-orphans, /api/update,
  # /api/pipeline*. See docs/plans/2026-04-25-bl170-feature-completeness-audit.md.

  # Sessions sub-routes
  /api/sessions/finished-oneshots:
    get:
      summary: List one-shot sessions whose command has ended but that never reached complete
      operationId: sessionsFinishedOneShotsList
      tags: [Sessions]
      responses: {"200": {description: "{count, ids}"}}
    post:
      summary: Complete those sessions (runs the validation gate), close their panes and remove scratch files
      operationId: sessionsFinishedOneShotsCleanup
      tags: [Sessions]
      responses: {"200": {description: "{reaped: [session ids]}"}}
  /api/sessions/aggregated:
    get:
      summary: Aggregated session view across federated peers
      operationId: sessionsAggregated
      tags: [Sessions]
      responses: {"200": {description: OK}}
  /api/sessions/bind:
    post:
      summary: Bind a session to an agent worker (proxies session reads through /api/proxy/agent/...)
      operationId: sessionBind
      tags: [Sessions]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [session_id, agent_id], properties: {session_id: {type: string}, agent_id: {type: string}}}}}}
      responses: {"200": {description: Bound}, "404": {description: Session or agent not found}}
  /api/sessions/import:
    post:
      summary: Import a single orphan session from disk
      operationId: sessionImport
      tags: [Sessions]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [path], properties: {path: {type: string}}}}}}
      responses: {"200": {description: Imported}, "404": {description: Session dir not found}}
  /api/sessions/kill:
    post:
      summary: Terminate a session (sends SIGTERM to the tmux process)
      operationId: sessionKill
      tags: [Sessions]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [id], properties: {id: {type: string}}}}}}
      responses: {"200": {description: OK}, "404": {description: Not found}}
  /api/sessions/prompt:
    get:
      summary: Inspect the captured prompt waiting for input (when state=waiting_input)
      operationId: sessionPromptGet
      tags: [Sessions]
      parameters:
        - {name: id, in: query, required: true, schema: {type: string}}
      responses: {"200": {description: OK}, "404": {description: Not found}}
  /api/sessions/reconcile:
    get:
      summary: List orphan session directories on disk that are missing from the registry
      operationId: sessionReconcile
      tags: [Sessions]
      responses: {"200": {description: List of orphans}}
  /api/sessions/response:
    get:
      summary: Last LLM response for a session (final assistant message, parsed)
      operationId: sessionResponse
      tags: [Sessions]
      parameters:
        - {name: id, in: query, required: true, schema: {type: string}}
      responses: {"200": {description: OK}, "404": {description: Not found}}
  /api/sessions/stale:
    get:
      summary: List running sessions stuck longer than session.stale_timeout_seconds
      operationId: sessionsStale
      tags: [Sessions]
      parameters:
        - {name: seconds, in: query, required: false, schema: {type: integer}}
      responses: {"200": {description: OK}}
  /api/sessions/state:
    post:
      summary: Manual state override (operator only — bypasses idle-detection)
      operationId: sessionStateOverride
      tags: [Sessions]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [id, state], properties: {id: {type: string}, state: {type: string, enum: [running, waiting_input, complete, killed, rate_limited]}}}}}}
      responses: {"200": {description: OK}, "400": {description: Bad state}, "404": {description: Not found}}

  /api/sessions/set_priority:
    post:
      summary: Set a session's capacity-queue priority
      description: Higher priority sessions are admitted first when capacity is contended. Default 0. Identify the session by id or session_name.
      operationId: sessionSetPriority
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priority]
              properties:
                id: {type: string}
                session_name: {type: string}
                priority: {type: integer, description: "A whole number; anything else is a 400"}
      responses:
        "200": {description: "OK: {status, id, priority}"}
        "400": {description: Priority is not an integer, or neither id nor session_name was given}
        "404": {description: Session not found}
        "409": {description: session_name matches more than one session}
  /api/llms:
    get:
      summary: List LLM registry entries
      description: Returns the entries plus a status object. status.role_warnings carries the current role-contention warnings.
      operationId: llmsList
      tags: [LLMs]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  llms: {type: array, items: {$ref: "#/components/schemas/LLMEntry"}}
                  status:
                    type: object
                    properties:
                      role_warnings: {type: array, items: {type: string}}
    post:
      summary: Create an LLM registry entry
      description: Roles are trimmed, lower-cased and de-duplicated. An empty role string is a 400. Every write re-runs the role contention check.
      operationId: llmsCreate
      tags: [LLMs]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LLMWriteBody"}
      responses:
        "200": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/LLMEntry"}}}}
        "400": {description: Invalid entry, including an empty role}
  /api/llms/{name}:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string}}
    get:
      summary: Get one LLM registry entry
      description: The entry carries role_warnings, the contention warnings that name it.
      operationId: llmsGet
      tags: [LLMs]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/LLMEntry"}}}}
        "404": {description: Not found}
    put:
      summary: Update an LLM registry entry
      description: A body that omits roles keeps the stored roles; an empty list clears them.
      operationId: llmsUpdate
      tags: [LLMs]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LLMWriteBody"}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/LLMEntry"}}}}
        "400": {description: Invalid entry, including an empty role}
        "404": {description: Not found}
  /api/llm-roles:
    get:
      summary: Resolved workload roles and contention warnings
      description: |
        Each claimed role with the registry entry it currently resolves to, plus the contention warnings.
        Only enabled entries count. When several enabled entries claim one role the first by name wins and a warning says so.
        It sits beside /api/llms because /api/llms/{name} would shadow a literal roles sub-path.
      operationId: llmRolesGet
      tags: [LLMs]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LLMRoleTable"}
        "405": {description: Method not allowed}
        "503": {description: LLM registry disabled}

  # Agents
  /api/agents:
    get:
      summary: List ephemeral agent workers
      operationId: agentsList
      tags: [Agents]
      responses: {"200": {description: OK}}
    post:
      summary: Spawn a new agent worker
      operationId: agentSpawn
