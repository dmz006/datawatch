<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>datawatch — Documentation</title>
<style>
  :root {
    --bg: #0e1013;
    --bg2: #161a1f;
    --bg3: #1e232a;
    --text: #e6e6e6;
    --text2: #9aa0a6;
    --border: #2a2f36;
    --accent: #60a5fa;
    --accent2: #7c3aed;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100vh; background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }
  .app { display: grid; grid-template-rows: auto 1fr; height: 100vh; height: 100dvh; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--bg2); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; flex: 1; }
  header .links a { color: var(--accent); text-decoration: none; font-size: 13px; margin-left: 12px; }
  header .links a:hover { text-decoration: underline; }
  header button.toggle {
    background: var(--bg3); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 6px 10px; cursor: pointer; font-size: 14px;
  }
  header button.toggle:hover { border-color: var(--accent); }
  .body { display: grid; grid-template-columns: 320px 1fr; overflow: hidden; transition: grid-template-columns 0.18s ease; }
  .body.aside-collapsed { grid-template-columns: 0px 1fr; }
  .body.aside-collapsed aside {
    /* Desktop collapse — fully hide aside so the 1px border-right
       doesn't leak as a visible strip at x=-1/0 on Chrome. */
    transform: translateX(-100%);
    visibility: hidden;
    border-right: none;
    width: 0;
    overflow: hidden;
  }
  aside {
    background: var(--bg2);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px 0;
  }
  aside .search-wrap {
    position: relative;
    padding: 10px 12px 8px;
    border-bottom: 1px solid var(--border);
  }
  aside .search-wrap input#docSearchBox {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 8px;
    border-radius: 4px;
    font-size: 13px;
    box-sizing: border-box;
  }
  aside .search-wrap input#docSearchBox:focus { outline: none; border-color: var(--accent); }
  #docSearchDropdown {
    display: none;
    position: absolute;
    top: calc(100% - 2px);
    left: 12px; right: 12px;
    background: var(--bg2, #1a1d27);
    border: 1px solid #2d2f3e;
    border-top: none;
    border-radius: 0 0 6px 6px;
    z-index: 100;
    max-height: 340px;
    overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  #docSearchDropdown.open { display: block; }
  aside .filter {
    padding: 0 12px 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }
  aside .filter input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 8px;
    border-radius: 4px;
    font-size: 13px;
  }
  aside .filter input:focus { outline: none; border-color: var(--accent); }
  .search-result {
    display: block; width: 100%; text-align: left;
    background: transparent; color: var(--text); border: none;
    padding: 8px 14px; font-size: 13px; cursor: pointer; line-height: 1.4;
    border-bottom: 1px solid var(--border);
  }
  .search-result:hover { background: var(--bg3); }
  .search-result .sr-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .search-result .sr-path { font-size: 11px; color: var(--text2); margin-top: 1px; }
  .search-result .sr-excerpt { font-size: 11px; color: var(--text2); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .search-empty { color: var(--text2); padding: 12px 14px; font-size: 13px; }
  aside .group {
    padding: 6px 12px 2px;
    font-size: 11px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 10px;
  }
  aside button.doc {
    display: block; width: 100%; text-align: left;
    background: transparent; color: var(--text); border: none;
    padding: 6px 14px; font-size: 13px; cursor: pointer; line-height: 1.4;
  }
  aside button.doc:hover { background: var(--bg3); }
  aside button.doc.active { background: var(--accent); color: #111; }
  aside button.doc .count { color: var(--text2); font-size: 11px; margin-left: 6px; }
  aside button.doc.active .count { color: #1a1a1a; }
  main { overflow-y: auto; padding: 20px; }
  .doc-header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  .doc-header h2 { margin: 0; font-size: 18px; }
  .doc-header .path { color: var(--text2); font-size: 12px; font-family: monospace; }
  .diagram-shell {
    position: relative;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 48px 16px 16px;
    margin-bottom: 20px;
    overflow: auto;
    min-height: 200px;
  }
  .diagram-shell .title {
    position: absolute; top: 14px; left: 16px;
    font-size: 13px; color: var(--text2); font-weight: 500;
  }
  .diagram-shell .controls {
    position: absolute; top: 10px; right: 12px;
    display: flex; gap: 6px;
  }
  .diagram-shell .controls button {
    background: rgba(255,255,255,0.06); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 8px; font-size: 12px; cursor: pointer; min-width: 28px;
  }
  .diagram-shell .controls button:hover { border-color: var(--accent); }
  .diagram-canvas {
    transform-origin: top left;
    transition: transform 0.12s ease-out;
    cursor: grab;
    min-height: 100px;
  }
  .diagram-canvas:active { cursor: grabbing; }
  .diagram-shell.fullscreen {
    position: fixed; inset: 0;
    z-index: 9999;
    border-radius: 0; border: none;
    padding-top: 56px;
    background: var(--bg);
  }
  .diagram-shell.fullscreen .controls { top: 16px; right: 20px; }
  .loading, .empty { color: var(--text2); padding: 30px 0; text-align: center; }
  .prose {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 20px;
    color: var(--text2);
    font-size: 13px;
    line-height: 1.55;
    white-space: pre-wrap;
  }
  /* v6.13.13 — operator round 3 (still complaining about double-spacing):
     drop ALL paragraph margins, kill the p+p rule entirely, rely purely
     on line-height for the reading rhythm. Headings get tiny top margin
     so they group with the paragraph above without compounding. line-
     height 1.45 → 1.35 (tighter, still legible). */
  .prose { line-height: 1.35; }
  .prose h1 { color: var(--text); margin: 8px 0 2px; font-size: 22px; }
  .prose h2 { color: var(--text); margin: 6px 0 2px; font-size: 17px; border-bottom: 1px solid var(--border); padding-bottom: 2px; }
  .prose h3 { color: var(--text); margin: 4px 0 1px; font-size: 14px; }
  .prose h4 { color: var(--text); margin: 3px 0 1px; font-size: 13px; }
  .prose p { margin: 0 0 2px 0; }
  .prose p:last-child { margin-bottom: 0; }
  .prose code { background: var(--bg3); padding: 1px 5px; border-radius: 3px; font-size: 12px; }
  .prose ul, .prose ol { padding-left: 22px; margin: 1px 0 2px; }
  .prose li { margin: 0; }
  .prose li > p { margin: 0; } /* marked sometimes wraps li content in <p> — kill that vertical drift */
  .prose pre { background: var(--bg3); padding: 8px 10px; border-radius: 4px; overflow: auto; font-size: 12px; white-space: pre; margin: 2px 0 4px; line-height: 1.4; }
  .prose a { color: var(--accent); }
  .prose blockquote { border-left: 3px solid var(--accent2); margin: 2px 0; padding-left: 12px; color: var(--text); }
  .prose blockquote p { margin: 0; }
  .prose table { border-collapse: collapse; margin: 2px 0 4px; }
  .prose th, .prose td { border: 1px solid var(--border); padding: 3px 6px; text-align: left; }
  .prose hr { border: none; border-top: 1px solid var(--border); margin: 4px 0; }

  /* Mobile / portrait — stack the layout, allow rotation, collapse aside by default. */
  @media (max-width: 820px), (orientation: portrait) {
    .body { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    /* When the drawer is collapsed in mobile, the aside is position:fixed
       (out of grid flow). The desktop "0px 1fr" two-column template would
       otherwise win by specificity and auto-place main into the 0px first
       cell — leaving main rendered at ~28 px (its padding) and the user
       seeing a blank screen. Pin the layout to a single 1fr column so
       main always claims the full viewport. */
    .body.aside-collapsed { grid-template-columns: 1fr; }
    aside {
      position: fixed; top: 52px; left: 0; bottom: 0;
      width: 280px; max-width: 80vw; z-index: 50;
      transform: translateX(0);
      transition: transform 0.18s ease, visibility 0.18s ease;
      box-shadow: 4px 0 12px rgba(0,0,0,0.4);
    }
    .body.aside-collapsed aside {
      /* Translate fully off-screen AND hide visibility so nothing
         (shadow, border, scrollbar) leaks into the viewport on
         Chrome mobile / installed PWA, and pointer-events drop so
         the hidden drawer can't intercept taps on the diagram. */
      transform: translateX(-100%);
      visibility: hidden;
      pointer-events: none;
      box-shadow: none;
    }
    main {
      padding: 14px;
      /* Belt + suspenders: when aside is fixed-position, main needs
         to claim the full grid cell so the diagram always has room. */
      width: 100%;
      min-width: 0;
      overflow-x: auto;
    }
    .doc-header { flex-direction: column; align-items: flex-start; gap: 6px; }
    .diagram-shell { padding: 56px 8px 12px; min-height: 240px; }
  }
</style>
</head>
<body>
<div class="app">
<header>
  <a href="/" class="toggle" title="Back to PWA" aria-label="Back to PWA" style="text-decoration:none;display:inline-flex;align-items:center;gap:4px;">&#8592; PWA</a>
  <button class="toggle" id="asideToggle" title="Toggle file list" aria-label="Toggle file list">&#9776;</button>
  <h1>datawatch — Documentation</h1>
  <div class="links">
    <a href="/api/docs">API spec</a>
    <a href="/api/mcp/docs">MCP tools</a>
  </div>
</header>
<div class="body" id="bodyEl">
  <aside>
    <div class="search-wrap">
      <input id="docSearchBox" type="search" placeholder="Search docs…" autocomplete="off" />
      <div id="docSearchDropdown"></div>
    </div>
    <div class="filter"><input id="filter" placeholder="Filter files…" autocomplete="off" /></div>
    <div id="list"><div class="loading">Loading index…</div></div>
  </aside>
  <main id="main">
    <div class="loading">Pick a file from the left.</div>
  </main>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.6/dist/mermaid.min.js"
  integrity="sha384-qX9VvWkP79m/O121ZE6sOYp0nf/pldQgtvWDbkpzi+3mUo4Wn4Ix4cFzNPay3VaB"
  crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
  integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi"
  crossorigin="anonymous"></script>
<script src="/diagrams.js"></script>
</body>
</html>
