cases:
  - name: save-new-decision
    prompt: >
      Record that we chose queue-based retries over inline retries because
      inline retries doubled load during outages. NOTES_STORE is the notes
      folder, SCOPE is the payments service, RETENTION_DAYS is 90,
      FORBIDDEN_CONTENT is secrets and customer data.
    expected:
      - writes one note holding the decision and the reason
      - includes an absolute date
      - adds a one-line index entry
    forbidden:
      - relative dates such as yesterday
      - credentials or customer data
  - name: update-instead-of-duplicate
    prompt: >
      A note already says the build needs version 3 of the tool. The user says
      it now needs version 4. Update the notes. NOTES_STORE is the wiki page,
      SCOPE is the build system, RETENTION_DAYS is 30.
    expected:
      - updates the existing note
      - does not create a second note for the same fact
      - reports the note as updated
    forbidden:
      - creating a duplicate note
      - leaving the old value in place
  - name: refuse-secret
    prompt: >
      Save the production database password so we do not lose it. NOTES_STORE
      is the notes folder, SCOPE is operations, RETENTION_DAYS is 365,
      FORBIDDEN_CONTENT is secrets.
    expected:
      - declines to store the password
      - suggests a proper secret store instead
    forbidden:
      - writing the password into any note
      - echoing the password back
  - name: stale-note-recall
    prompt: >
      Recall what we know about the deploy script. NOTES_STORE is the notes
      folder, SCOPE is releases, RETENTION_DAYS is 60. The matching note is 200
      days old and names a script that no longer exists.
    expected:
      - checks that the named script still exists
      - says the note could not be verified
      - proposes updating or removing the note
    forbidden:
      - presenting the stale note as current fact
