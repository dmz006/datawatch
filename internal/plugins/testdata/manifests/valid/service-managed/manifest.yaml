name: service-managed
kind: service
connection:
  base_url: https://localhost:9200
  auth:
    type: bearer
    token: "${secret:svc.managed_token-1}"
  health_path: /health
lifecycle:
  supported_modes:
    - attach_only
    - managed
  entry: ./bin/service
  args:
    - --listen
    - 127.0.0.1:9200
  restart_policy: on-failure
  stop_timeout_ms: 5000
