# scripts/leak-check.conf — configuration for the whole-tree leak check.
#
# Plain shell, meant to be sourced by bash (`. scripts/leak-check.conf`).
# It only assigns variables; it runs nothing. Every pattern is a POSIX
# extended regex for `grep -E`. Paths are repository-relative.
#
# Variables defined here:
#   LEAK_PATTERN_*   one named generic pattern each
#   LEAK_PATTERNS    array of all generic patterns above, in scan order
#   ALLOWED_EMAILS   array of extended regexes; an address that fully
#                    matches one of them is not a leak
#   EXCLUDE_PATHS    array of git pathspec globs the scan skips
#
# Reserved documentation ranges 192.0.2.0/24, 198.51.100.0/24 and
# 203.0.113.0/24 are deliberately NOT matched by any pattern below.
# Site-specific names and hosts do not belong here; put them in the
# untracked .leak-check-local-patterns file (see its .example template).

# One IPv4 octet, 0-255. Used to build the address patterns below.
_LC_OCT='(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])'
# Guards so the match is a whole dotted quad, not a slice of a longer
# number or version string.
_LC_PRE='(^|[^0-9.])'
_LC_POST='([^0-9]|$)'

# RFC1918 10.0.0.0/8
LEAK_PATTERN_RFC1918_10="${_LC_PRE}10\\.${_LC_OCT}\\.${_LC_OCT}\\.${_LC_OCT}${_LC_POST}"
# RFC1918 172.16.0.0/12 (172.16 - 172.31)
LEAK_PATTERN_RFC1918_172="${_LC_PRE}172\\.(1[6-9]|2[0-9]|3[01])\\.${_LC_OCT}\\.${_LC_OCT}${_LC_POST}"
# RFC1918 192.168.0.0/16
LEAK_PATTERN_RFC1918_192="${_LC_PRE}192\\.168\\.${_LC_OCT}\\.${_LC_OCT}${_LC_POST}"
# Tailnet CGNAT 100.64.0.0/10 (100.64 - 100.127)
LEAK_PATTERN_TAILNET="${_LC_PRE}100\\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\\.${_LC_OCT}\\.${_LC_OCT}${_LC_POST}"
# Absolute home directory of any user on Linux and macOS
LEAK_PATTERN_HOME_LINUX='/home/[A-Za-z0-9._-]+/'
LEAK_PATTERN_HOME_MACOS='/Users/[A-Za-z0-9._-]+/'
# Home directory of the root user
LEAK_PATTERN_HOME_ROOT='(^|[^A-Za-z0-9._-])/root(/|$|[^A-Za-z0-9._-])'

LEAK_PATTERNS=(
  "$LEAK_PATTERN_RFC1918_10"
  "$LEAK_PATTERN_RFC1918_172"
  "$LEAK_PATTERN_RFC1918_192"
  "$LEAK_PATTERN_TAILNET"
  "$LEAK_PATTERN_HOME_LINUX"
  "$LEAK_PATTERN_HOME_MACOS"
  "$LEAK_PATTERN_HOME_ROOT"
)

# Email addresses that are allowed to appear. Each entry is an extended
# regex matched against the whole address, case-insensitively.
ALLOWED_EMAILS=(
  'noreply@example\.com'
  '[^@[:space:]]+@example\.(com|org|net)'
  # git noreply addresses already used in the repo
  'noreply@anthropic\.com'
  'noreply@github\.com'
  '([0-9]+\+)?[A-Za-z0-9-]+@users\.noreply\.github\.com'
)

# Paths the scan skips (git pathspec globs, repository-relative).
EXCLUDE_PATHS=(
  'scripts/leak-check.conf'
  '.leak-check-local-patterns.example'
  'scripts/tests/*leak-check*fixture*'
  'go.sum'
  # vendored code
  'vendor/*'
  '*/vendor/*'
  'node_modules/*'
  '*/node_modules/*'
  # binary files
  '*.png' '*.jpg' '*.jpeg' '*.gif' '*.webp' '*.ico' '*.icns'
  '*.pdf' '*.zip' '*.gz' '*.tgz' '*.bz2' '*.xz' '*.zst' '*.tar'
  '*.woff' '*.woff2' '*.ttf' '*.otf' '*.eot'
  '*.so' '*.dylib' '*.dll' '*.exe' '*.a' '*.o' '*.wasm'
  '*.mp3' '*.mp4' '*.webm' '*.mov' '*.wav'
)
