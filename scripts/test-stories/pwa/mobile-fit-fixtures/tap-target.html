<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Small tap target</title>
<style>
  html, body { margin: 0; padding: 0; }
  body { font: 16px/1.4 system-ui, sans-serif; background: #f4f5f7; }
  .pad { padding: 12px; }
  button.tiny {
    width: 24px; height: 24px; padding: 0; font-size: 12px;
    border: 1px solid #2b57d0; border-radius: 6px;
    background: #3462e0; color: #fff;
  }
</style>
</head>
<body>
  <div class="pad">
    <button class="tiny">Go</button>
  </div>
</body>
</html>
