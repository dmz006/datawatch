<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipped text without ellipsis</title>
<style>
  html, body { margin: 0; padding: 0; }
  body { font: 16px/1.4 system-ui, sans-serif; background: #f4f5f7; }
  p.mono { padding: 12px; }
  .clip {
    display: inline-block; width: 120px; white-space: nowrap;
    overflow: hidden; vertical-align: top; font-size: 14px;
  }
</style>
</head>
<body>
  <p class="mono">
    <span class="clip">This sentence is much longer than the one hundred twenty pixel box that contains it</span>
  </p>
</body>
</html>
