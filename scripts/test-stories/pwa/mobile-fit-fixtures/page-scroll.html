<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page scrolls horizontally</title>
<style>
  html, body { margin: 0; padding: 0; }
  body { font: 16px/1.4 system-ui, sans-serif; background: #f4f5f7; color: #fff; }
  .wide {
    width: 600px; margin: 8px auto; background: #3462e0;
    padding: 16px; box-sizing: border-box;
  }
</style>
</head>
<body>
  <div class="wide">This 600-pixel block is wider than a 360-pixel viewport and makes the page scroll horizontally.</div>
</body>
</html>
