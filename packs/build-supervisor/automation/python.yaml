# Python build automation module. Chosen when the project holds pyproject.toml or requirements.txt.
stack: python
detect:
  files: [pyproject.toml, requirements.txt, setup.py]
build: python -m compileall -q .
test: python -m pytest -q
lint: python -m ruff check .
format_check: python -m ruff format --check .
verify_before_commit: [build, test, lint, format_check]
rules:
  - Work inside the project's virtual environment; never install into the system interpreter.
  - Run the tests before calling work done.
  - Run every command with the tmux variables removed (env -u TMUX -u TMUX_TMPDIR).
